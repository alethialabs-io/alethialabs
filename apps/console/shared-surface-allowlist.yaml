# SPDX-License-Identifier: AGPL-3.0-only
#
# Shared-surface exceptions and measured drift — the machine-readable half of CLAUDE.md §6.
#
# §6: "if two pages disagree about how something looks or reads, the user is being told the product
# is two products." `check:shared-surface` (scripts/check-shared-surface.mjs) fails on any console
# site that hand-rolls a number, a date, a section heading, a font size, an empty state, a stat
# strip, a stacking level or a table instead of reaching for `@repo/format`,
# `@repo/ui/section-heading`, a `--text-ui-*` rung, `@repo/ui/empty`, `@repo/ui/status-badge`, a
# `--z-*` token or `DataTable` — and on any console page that gives itself a TITLE, which is the one
# rule whose fix is deletion. Unless it is listed here.
#
# TWO KINDS OF ENTRY, and the file says which. They are counted separately, and neither can be
# spent as the other — converting one into the other is a diff, which is the point.
#
#   reason:  A DECISION. This surface is genuinely a different thing from the one the shared
#            component is for — a display heading on a marketing-shaped page, an accessibility
#            landmark, a quantity the package has no opinion about. NEVER "we haven't got to it
#            yet". An exclusion says we are not going to do it, and the guard prints it to anyone
#            who trips over it. Counted against `baseline`.
#
#   lifts:   DEBT. Measured drift that is going to be fixed, recorded per file and per occurrence
#            so it can only shrink, and naming the board issue that removes it — quoted, because a
#            bare `#` opens a comment in every YAML reader that is not the guard's own. Counted
#            against `debt`.
#
# Why the second kind exists, since the first kind's rule ("never 'we haven't got to it yet'") is
# right and stays: on its own it is also a rule that stops a guard from ever being ADDED to a
# surface that has already drifted. The six rules added in #3615 were measured on an unmodified
# `dev` and found 101 occurrences across 74 files, and there is no honest sentence in the product's
# voice that calls any of them a different thing. Writing 74 fake decisions would empty the word
# "decision" of meaning — the eleven `page_header` reasons below are worth reading precisely
# because none of them is that. Leaving the guard red would mean it never lands, which is how the
# drift reached 101 unseen. So the drift is written down where it can only shrink, and every row
# says which issue takes it away. Work not yet done still belongs on the board, and here it is
# ON the board: #3613's conformance lanes, one per console area.
#
# BOTH ledgers are SHRINK-ONLY and both are checked in BOTH directions: adding a row without
# raising the number is refused, and so is a shrink that is not recorded, so a win cannot be
# quietly spent later. Be clear about what that does and does not mechanise: the guard compares
# each number against the rows in THIS file, so raising it and adding a row in one commit passes.
# The shrink-only property is enforced by REVIEW — the same way the checked-in coverage floors
# are. A `baseline` or a `debt` that goes UP in a diff is the thing to stop.
#
# `hits` is the same ratchet one level down — granted per OCCURRENCE, not per file, so a new
# `<h2>` in a file already carrying two is new drift.
#
# Fields:
#   path    — repo-relative, exactly as the guard prints it. One entry per file per section; a
#             second entry for the same path is a parse error, because it would be a free entry
#             against a ledger with only one of its two notes being the recorded one.
#   hits    — how many occurrences this entry covers. The guard fails if the file has more OR
#             fewer, which is also its live proof that the matcher still matches.
#   reason  — one line, in the product's voice: what a USER gets from this surface being different,
#             not what the code does. The guard prints it verbatim with either `hits` failure.
#   lifts   — one quoted line starting `#<issue>`: the board issue that removes this drift, and
#             what is here. Printed the same way, so whoever trips over it knows where it is owed.
#
# THE SECTIONS. A section this file invents is a parse error, never a silently ignored block of
# exceptions.
#   format:          — @repo/format. `toFixed(`, `toLocaleDateString`, `toLocaleTimeString`, a
#                      literal `$` before an interpolation, `/ 1024`, an interpolation glued
#                      directly onto a `toLocaleString`, and a currency symbol passed as a prop.
#   page_title:      — NO page title. A raw `<h1>` in app/(private)/** or components/**. The
#                      direction of this rule is INVERTED from what it was: the fix is to DELETE the
#                      heading, not to adopt a component. #3733 — the page's name is said by the
#                      sidebar entry you clicked and by the breadcrumb above the content, and a
#                      third saying earns nothing. Every entry below is therefore a surface with NO
#                      BREADCRUMB ABOVE IT, or the one `sr-only` outline landmark.
#   section_header:  — @repo/ui/section-heading. A raw `<h2>` through `<h6>`, same scope. It runs
#                      to `<h6>` because a rule that stopped at `<h3>` would be an instruction to
#                      demote: the guard goes quiet, the outline gets worse. Kept apart from
#                      `page_title:` so a file's `<h1>` decision and its `<h2>` debt cannot merge
#                      into one entry carrying only one of the two notes.
#   type_scale:      — a `--text-ui-*` rung from packages/brand/src/tokens.css. A hardcoded font
#                      size — `text-[13px]`, `text-[12.5px]`, and the same in any length unit, with
#                      or without a variant prefix — in components/**, app/**, lib/** or hooks/**.
#                      1,079 of them
#                      across 23 values when the rule landed, against a token file that carried no
#                      UI type scale at all; every one is debt and none is a decision.
#   empty_state:     — @repo/ui/empty. One class string — double-quoted, single-quoted or a
#                      template literal — carrying `text-center` and `py-6` or more, no upper bound.
#   stat_strip:      — §6's "No stat-card strips": a `<Stat` CELL — the container is the wrong
#                      half of the shape — and the `Stat` primitive itself.
#   layer_token:     — a `--z-*` token. A raw stacking level of 40 or more, variant prefix or
#                      not (`md:z-50`, `data-[state=open]:z-50`), counting from the gap
#                      packages/brand/src/tokens.css leaves empty between its in-flow lifts and
#                      the page chrome.
#   data_table:      — DataTable, or @repo/ui/table. A grid used as a table, and a raw `<table>`.
#   scanned:         — NOT entries. One census floor per scope the guard declares: the fewest
#                      files that scope may examine before the run is refused. It is the ONLY
#                      control that notices a root being DELETED from the guard's own scope
#                      declaration — the per-root vacuity check is built from that list, so a
#                      removed root has no row left to be zero, and the guard printed a clean tree
#                      over 299 unread route files. This ratchet runs the OPPOSITE way to the two
#                      above: files only grow, so the number may be raised freely and a DROP is
#                      the thing review stops. The floors sit a few percent under the live count
#                      so an ordinary refactor need not touch them.

baseline: 16
debt: 145

scanned:
  - scope: console_code
    floor: 1100
  - scope: console_view
    floor: 630
  - scope: console_pages
    floor: 400

format:
  - path: apps/console/components/runners/pool-card.tsx
    hits: 2
    reason: Provisioned hours and utilization are fleet telemetry, not money or duration — @repo/format has no opinion about either, and inventing one for two call sites would be the wrong place to decide it.
  - path: apps/console/components/runners/runner-card.tsx
    hits: 1
    reason: The same provisioned-hours figure as the pool card, and it must read the same way on both — `formatDuration` measures a span in milliseconds, which is a different question.
  - path: apps/console/components/agent/agent-knowledge-panel.tsx
    hits: 1
    reason: Knowledge size is a budget you are spending against a limit, so it stays a bare compact figure (`2.1k`) rather than a formatted quantity with a unit.
  - path: apps/console/components/agent/widgets/bodies/blocks.tsx
    hits: 2
    reason: SVG path coordinates for a sparkline — geometry the browser reads, never a number a person does.
  # --- debt: measured 2026-09-01 on an unmodified dev, by the two new money matchers.

page_title:
  # THE TEST IS: DOES ANYTHING ELSE ON SCREEN ALREADY NAME THIS? Not "is there a breadcrumb" — FIVE
  # of the eleven entries below sit inside the console shell WITH a breadcrumb above them, and are
  # kept because what they say is not the route's name: a question ("What can we help you with?"),
  # two invitations above an empty composer, an error message, and an `sr-only` outline root. The
  # other six are outside the shell entirely, where there is neither breadcrumb nor sidebar entry,
  # so the heading is the only thing that says what the page is. Each entry's own `reason:` says
  # which of the two it is, and applying "is there a breadcrumb" instead would delete five headings
  # this list deliberately keeps.
  - path: apps/console/components/auth/auth-form.tsx
    hits: 4
    reason: Sign-in is the front door — no sidebar, no breadcrumb, nothing else on the screen says what this is. It keeps the display heading the website uses, so the two halves of arriving look like one product.
  - path: apps/console/components/auth/onboarding-form.tsx
    hits: 2
    reason: The first screen after sign-up, still outside the console shell — it welcomes you, and there is no breadcrumb above it to welcome you instead.
  - path: apps/console/components/forms/oauth-consent-form.tsx
    hits: 2
    reason: A consent screen has to read as its own moment, not as a page inside the console you happen to be on, because the decision it asks for is about handing access to someone else — and it renders outside the shell, with no breadcrumb.
  - path: apps/console/components/org/org-purchase-ui.tsx
    hits: 2
    reason: Buying a plan is a checkout, not a console page; it renders outside the shell and keeps the display type the pricing page uses, so the two halves of one purchase look like one purchase.
  - path: apps/console/components/legal/accept-terms-form.tsx
    hits: 1
    reason: Accepting terms blocks everything else until it is answered — it replaces the console rather than sitting inside it, and the display heading is what makes it read as a stop rather than a page.
  - path: apps/console/app/(private)/cli/login/page.tsx
    hits: 1
    reason: The CLI hand-off is a single-purpose full-screen page in the same shell-less frame as sign-in, arrived at from a terminal rather than from the console, so nothing above it says what it is.
  - path: apps/console/app/(private)/[org]/~/support/page.tsx
    hits: 1
    reason: "\"What can we help you with?\" is a question, not the name of a page — the breadcrumb above it already says \"Support\", and this asks you something instead of repeating that."
  - path: apps/console/components/agent/elench/elench-empty-landing.tsx
    hits: 1
    reason: The agent's invitation above an empty composer. It is the prompt, not the name of a page — the breadcrumb already says where you are, and there is nothing on screen yet for a title to title.
  - path: apps/console/components/create-project/create-project-form.tsx
    hits: 1
    reason: The same invitation, on the surface where a project starts; it opens the composer rather than labelling the route — the breadcrumb labels the route — and the two openers must read alike.
  - path: apps/console/components/alerts/alerts-page.tsx
    hits: 1
    reason: An `sr-only` landmark, and the only heading in this list that is never painted. No console page shows a title any more, but a route still needs one outline root or its three sections are orphans — a screen reader has no breadcrumb to fall back on.
  - path: apps/console/components/errors/error-state.tsx
    hits: 1
    reason: An error boundary replaces the page, so the breadcrumb above it is naming something the reader can no longer see; its heading says what went wrong, and has to size itself to whether it is filling the screen or sitting inside a panel.

