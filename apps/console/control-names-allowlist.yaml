#
# Control-name exceptions and measured drift — the ledger of `check:control-names`
# (apps/console/scripts/check-control-names.mjs, #5046). That check fails on any console control
# with no role or no accessible name: a button or link whose content renders no text and whose tag
# names nothing (`control_name`), a non-interactive element with `onClick` and no `role`
# (`clickable_role`), and a form field with no label (`field_label`). Unless it is listed here.
#
# TWO KINDS OF ENTRY, the same two as shared-surface-allowlist.yaml and for the same reason:
#
#   reason:  A DECISION. This control is named, or is not a control, by a route the check cannot
#            see — a name that arrives through a spread, a wrapper, an id paired in another file.
#            NEVER "we haven't got to it yet". Counted against `baseline`.
#
#   lifts:   DEBT. A measured, real defect, recorded per file and per occurrence so it can only
#            shrink, naming the board issue that removes it — quoted, because a bare `#` opens a
#            comment in every YAML reader that is not the check's own. Counted against `debt`.
#
# Every `lifts:` row names #5056, NOT #5046. #5046 is the unit that landed the check and it closes
# when that PR merges; a `lifts:` naming a closed issue is debt with no owner, and nothing here can
# see that (it checks that a row names an issue, not that the issue is open).
#
# BOTH ledgers are checked in BOTH directions: a file with more findings than its `hits:` is new
# drift, a file with fewer is an unrecorded win (lower the number — otherwise the next change
# spends it silently), and a row whose file has no findings at all fails. The shrink-only property
# of `baseline`/`debt` themselves is enforced by REVIEW: a diff that raises either is the thing
# to stop.
#
# DO NOT TYPE `baseline:` OR `debt:`. They are entry counts DERIVED from the rows —
# `pnpm -C apps/console run gen:control-names` writes them, the check refuses a file whose counters
# disagree, and CI runs the generator and diffs. On a merge conflict at those two lines, take
# either side and run the generator.
#
# Fields: `path` (repo-relative, as the check prints it; one entry per file per section), `hits`
# (occurrences covered — exact, both directions), and ONE of `reason:` / `lifts:`.

baseline: 4
debt: 0

floors:
  # The minimum the scan must have READ, so a walker, a root or a tag list that quietly stopped
  # matching fails instead of printing a clean result over nothing. Measured 2026-09-24: 433 files,
  # 504 name-from-content controls, 131 fields, 10 clickable non-controls. Set with headroom so an
  # ordinary deletion does not trip them. `clickable_role` is 0 on purpose: fixing that rule's debt
  # REMOVES the shape it examines (an `onClick` moves onto a `<button>`), so a floor there would
  # fight the fix. Its liveness is carried instead by the permanent probes and by the wrapper
  # derivation, which refuses to run when it reads nothing.
  files: 350
  control_name: 400
  clickable_role: 0
  field_label: 100

control_name:
  - path: apps/console/components/ai-elements/prompt-input.tsx
    hits: 1
    reason: PromptInputButton is a pass-through — it renders nothing of its own, and every caller's children, aria-label and tooltip arrive through the spread, which is where each of those callers is named.

clickable_role:

field_label:
  - path: apps/console/components/billing/payer-declaration-form.tsx
    hits: 1
    reason: The field's label is org-purchase-ui.tsx's `Field`, which renders a real `<label htmlFor={id}>` and hands that `id` to this file's render-prop child, which puts it on the input — an id paired with a `htmlFor` in ANOTHER file, which this check cannot follow.
  - path: apps/console/components/org/create-org-sheet.tsx
    hits: 1
    reason: The field's label is org-purchase-ui.tsx's `Field`, which renders a real `<label htmlFor={id}>` and hands that `id` to this file's render-prop child, which puts it on the input — an id paired with a `htmlFor` in ANOTHER file, which this check cannot follow.
  - path: apps/console/components/runners/fleet-pool-wizard.tsx
    hits: 4
    reason: Each field's label is runners/field-help.tsx's `FieldLabel`, given `htmlFor={xId}` here while the input carries `id={xId}` — a `<Label htmlFor>` rendered in ANOTHER file, which this check cannot follow. The pairs are useId() values declared in this file.
