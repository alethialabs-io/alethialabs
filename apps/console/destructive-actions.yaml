#
# THE DESTRUCTIVE-ACTION REGISTRY — every control in the console that deletes, removes, destroys,
# revokes, cancels, detaches, disconnects, discards or suspends something, and what stands between
# a click and the mutation.
#
# One list, read by three instruments so they cannot disagree about what exists:
#   · scripts/check-destructive-actions.mjs   — the STATIC census: every call site of a
#     destructive server action / auth-client method under apps/console must have an entry here,
#     and every entry's `surface` must contain its `mutation`. (#4266)
#   · apps/console/e2e/audit/destructive.spec.ts — the LIVE spec: opens each control, asserts the
#     confirmation it declares, CANCELS, and proves nothing mutated. A `missing` entry whose dialog
#     now appears FAILS — the lane that adds the dialog flips the entry in the same PR. (#4266)
#   · .claude/skills/console-prod-qa/SKILL.md   — the production pass reads `prod-qa` to decide
#     what it may open on alethialabs.io: `open-cancel` (open the dialog, press Cancel),
#     `own-rows-only` (may confirm, but only on a row the run itself created), `skip` (never
#     touched on production, with the reason beside it). (#4284)
#
# Field contract (version 1):
#   id              stable dotted name; the census and the spec key on it
#   route           the manifest route the control lives on (scripts/lib/console-routes.mjs)
#   surface         the component file — PINNED; read it before asserting anything about the control
#   mutation        the identifier the click reaches (a server action, an authClient method, a store
#                   action); "" when the lane that owns the surface has yet to pin it (the census
#                   refuses an empty mutation — it is a to-do, not an exemption).
#                   TWO SHAPES, because two kinds of call site exist and the census greps for both:
#                     · an identifier — `deleteProject`, `authClient.organization.delete`. Matched
#                       whole, or by its last segment for a dotted path.
#                     · a bare fetch — `<path> <VERB>`, e.g. `/api/org/logo DELETE`. There is no
#                       identifier to grep, so the census matches the PATH and reads the verb as
#                       documentation. Written this way rather than invented as a fake identifier:
#                       a name that appears in no file is one a reader cannot chase.
#   mutation_surface  OPTIONAL — the file that actually invokes `mutation`, when that is not
#                   `surface`. Six controls are presentational: `pool-card.tsx` renders the trigger
#                   and raises `onDelete`, and the parent (or a store) calls the server action.
#                   `surface` answers "where does the spec find the control", which is what drives
#                   it; this answers "where does the mutation live", which is what the census greps.
#                   Collapsing the two would force a choice between a `surface` the spec cannot
#                   drive and a census rule that cannot check anything — so they are two fields.
#                   When absent, the census reads `mutation` from `surface`, which is the ordinary
#                   case (35 of 41).
#   reach           optional opener chain the spec walks first: {menu: "<name>"} | {section: "<title>"}
#                   | {select: "<row>"} | {open: "<control>"}
#   control         the trigger, by accessible role + name (never a CSS class)
#   confirm         alert-dialog | confirm-dialog | typed | popover | undo | staged | none — the census
#                   refuses any other value
#                   `typed`: a dialog whose `confirm_action` stays DISABLED until the subject's name
#                   is typed (`ConfirmAction` at `severity: destroy`, or a form refining on the typed
#                   name). The spec asserts the button is there and disabled, and never types. (#6830)
#                   `staged`: the click only stages the change in an edit draft, and a save bar
#                   decides it. `staged: {save, discard, table}` names that bar's two buttons
#                   and the table its save updates in place; the spec asserts Save appears (never
#                   presses it), presses Discard, requires the control back, and requires the org's
#                   rows in `table` byte-identical before the click and after Discard. (#4939)
#   confirm_action  the destructive button's label — the ONE control the spec never clicks
#   cancel_action   OPTIONAL — the label of the dialog's way out, when it is not a "Cancel"/"No"/"Keep"
#                   button (`env.destroy.cascade`'s is "Destroy children first"). The spec presses
#                   it exactly as it presses Cancel; absent, the default matcher applies.
#   dialog_title    what the dialog says, so a renamed dialog is a finding rather than a pass
#   fixture         what the spec must seed for the control to render
#   persona         owner | team | member
#   status          confirmed (a confirmation exists) | missing (fires on a bare click — `issue`
#                   REQUIRED) | inert (the control does nothing at all — `issue` REQUIRED)
#   issue           the board unit that flips a `missing`/`inert` entry
#   class           OPTIONAL — `destroy` is the only value. The destroy class is the console spec's
#                   (console-route-finish §4.3): delete organization, delete project, delete
#                   environment, destroy environment, cascade destroy, destroy runner. A `destroy`
#                   entry must declare `confirm: typed`. The tag is hand-assigned, so an untagged
#                   control is not asked — which is why the census also refuses those six ids
#                   (DESTROY_CLASS_REQUIRED) without the tag: removing it is not a way to pass. (#6830)
#   typed_by        a `class: destroy` entry that is not typed yet names the board unit that types
#                   it, `"#<n>"`. Debt recorded, not an exemption, and it fails in both directions:
#                   refused on an entry already `typed`, and on one that is not destroy-class.
#   prod-qa         open-cancel | own-rows-only | skip — REQUIRED on every entry; the census
#                   refuses an absent or unknown value, because an unclassified control is one the
#                   production sweep has no ruling for
#   reason          why prod-qa is what it is. REQUIRED when `skip` — that value is the one that
#                   removes a control from the production sweep, and a removal with no argument
#                   beside it reads to the next person as one already made. Permitted, never
#                   required, on the other two: `env.destroy` is `open-cancel` by decision and a
#                   guard whose cheapest escape is deleting that argument would be worse than none.
#
# A `missing` entry is a DEFECT recorded, not a decision. The count is stated as the three statuses
# rather than one number because `inert` is not a missing confirmation, it is a control that does
# nothing at all, and a single figure hid that distinction.
#
# ── THE CENSUS LINE BELOW IS DERIVED. DO NOT HAND-EDIT IT. ──────────────────────────────────────
#
# `scripts/check-destructive-actions.mjs` recounts it from the `controls:` entries on every run and
# FAILS if this line disagrees with them — and fails if the line is missing altogether, so it cannot
# be made to pass by deletion. When it fails it prints the line to paste. Run the check; do not
# retype it from memory.
#
# It is derived because the hand-typed version rotted, and rotted in triplicate: this header said
# 41 controls / 22 confirmed / 18 missing / 1 inert (read on 2026-09-07), #4517's body said 47 / 27 /
# 19 / 1, and the parser said something different from both. Three disagreeing counts of one list
# that a script could count all along. Nothing compared them, which is exactly why it went unnoticed
# — it is prose, and prose is not measured. Now it is.
#
#   census: 53 controls — 53 confirmed

version: 1

allow:
  # Call sites the census may see that are NOT a destructive control a person clicks. Each needs a
  # reason; an empty reason is refused. Each must also name a file that exists, a mutation that
  # occurs in it and a call site the scan finds — an exemption that suppresses nothing is refused
  # (#6830). `discardChanges` named the store #7168 deleted, and an earlier `cancelJob` entry named a
  # query hook that no longer calls it (the job page reaches it through `useActionMutation`).
  - mutation: destroyProject
    surface: apps/console/lib/ai/mcp/handlers.ts
    reason: the MCP `request_destroy` tool, not a control a person clicks. It queues a destroy only after a person approved that exact plan in the console, and destroyProject re-checks and consumes that approval once
  - mutation: cancelPaddleSubscriptionAtPeriodEnd
    surface: apps/console/lib/billing/paddle/provider.ts
    reason: the Paddle adapter's `cancelAtPeriodEnd`, not a control a person clicks. It is reached only through `cancelSubscriptionPlan`, whose plan-card button carries the `billing.subscription.cancel` confirmation
  - mutation: cancelJob
    surface: apps/console/lib/ai/mcp/handlers.ts
    reason: the MCP `cancel_job` tool, not a control a person clicks. It runs as the person under the token's plan scope, and cancelJob applies the same authorization the job page's Cancel does

controls:
  # ── organisation & project ─────────────────────────────────────────────────────────────────
  - id: org.delete
    route: /[org]/~/settings/general
    surface: apps/console/components/settings/general/org-general.tsx
    mutation: deleteOrganization
    # NO reach step. The `{section: "Delete organization"}` step only scrolled to the danger row, and
    # it was a second serial 8 s wait in front of the trigger's own: it was not taken once on
    # /[org]/~/settings/general (#7081's gate) and passed on the rerun. The trigger is ONE button
    # named "Delete organization" (`aria-label`, org-general.tsx), and the click scrolls to it.
    control: { role: button, name: "Delete organization" }
    # `ConfirmAction` at `severity: destroy` (#7091): Delete stays disabled until the org's name is typed.
    confirm: typed
    class: destroy
    confirm_action: "Delete organization"
    dialog_title: "Delete this organization?"
    fixture: none
    persona: owner
    status: confirmed
    prod-qa: skip
    reason: irreversible — deletes the QA org itself

  - id: org.leave
    route: /[org]/~/settings/general
    surface: apps/console/components/settings/general/org-general.tsx
    mutation: authClient.organization.leave
    # The trigger is ONE button named "Leave organization" (`aria-label`, org-general.tsx), beside
    # Delete in the danger zone. `ConfirmAction` at `severity: confirm`, an alert dialog: leaving
    # removes the caller's own membership, not a resource, so it is not destroy-class (#7204).
    control: { role: button, name: "Leave organization" }
    confirm: alert-dialog
    confirm_action: "Leave organization"
    dialog_title: "Leave <org>?"
    # The org's last ACTIVE owner sees Leave disabled with the reason, and the audit's owner is the
    # org's only one — so the fixture seeds a second active owner row, which makes the control live.
    fixture: second-owner-row
    persona: owner
    status: confirmed
    prod-qa: skip
    reason: leaving removes the QA account from the QA org

  - id: project.delete
    route: /[org]/[project]/settings/general
    surface: apps/console/components/settings/general/project-general.tsx
    mutation: removeProject
    reach: [{ section: "Delete project" }]
    control: { role: button, name: "Delete project" }
    # `ConfirmAction` at `severity: destroy` (#7198): Delete project stays disabled until the
    # project's name is typed.
    confirm: typed
    class: destroy
    confirm_action: "Delete project"
    dialog_title: "Delete this project?"
    fixture: project
    persona: owner
    status: confirmed
    prod-qa: own-rows-only

  - id: env.delete
    route: /[org]/[project]/environments
    surface: apps/console/components/environments/environments-view.tsx
    mutation: deleteEnvironment
    # The ROW's menu. Since #6819 each row's trigger is named `Environment actions for <name>`
    # (environment-columns.tsx), and Delete renders only for a non-default environment, so a bare
    # "Environment actions" opened the default row's menu, which has none. `audit-staging` is the
    # non-default environment `project-with-two-environments` seeds (e2e/audit/fixtures-destructive.ts).
    reach: [{ menu: "Environment actions for audit-staging" }]
    control: { role: menuitem, name: "Delete" }
    # `ConfirmAction` at `severity: destroy` (environments-view.tsx): typed environment name.
    confirm: typed
    class: destroy
    confirm_action: "Delete environment"
    dialog_title: "Delete <name>?"
    fixture: project-with-two-environments
    persona: owner
    status: confirmed
    prod-qa: own-rows-only

  - id: promotion.reject
    route: /[org]/[project]/environments
    surface: apps/console/components/environments/environments-view.tsx
    mutation: rejectPromotion
    control: { role: button, name: "Reject" }
    confirm: confirm-dialog
    confirm_action: "Reject promotion"
    dialog_title: "Reject this promotion?"
    fixture: pending-promotion
    persona: owner
    status: confirmed
    prod-qa: skip
    reason: needs a pending promotion, which needs a deployed environment

  - id: promotion.cancel
    route: /[org]/[project]/environments
    surface: apps/console/components/environments/environments-view.tsx
    mutation: cancelPromotion
    control: { role: button, name: "Cancel" }
    confirm: confirm-dialog
    confirm_action: "Cancel promotion"
    dialog_title: "Cancel this promotion?"
    fixture: pending-promotion
    persona: owner
    status: confirmed
    prod-qa: skip
    reason: needs a pending promotion, which needs a deployed environment

  # ── canvas ─────────────────────────────────────────────────────────────────────────────────
  - id: env.destroy
    route: /[org]/[project]/architecture
    surface: apps/console/components/design-project/canvas/cards/env-settings-card.tsx
    mutation_surface: apps/console/components/design-project/canvas/design-project-canvas.tsx
    mutation: destroyEnvironmentAction
    # The ⋯ menu's button is named "More" (`aria-label`); its item docks the Environment settings
    # card on the rail, which holds the danger zone (#4775 — it used to sit on the project node's
    # inspector, and the project node is not rendered on the board).
    reach: [{ menu: "More" }, { open: "Environment settings" }, { section: "Destroy environment" }]
    control: { role: button, name: "Destroy" }
    # Destroy-class; with nothing placed on its cluster the dialog is `SingleConfirm`
    # (destroy-environment-dialog.tsx): "Destroy environment" is a submit that stays disabled until
    # the environment's name is typed (#7198), the same gate `CascadeConfirm` puts on the project name.
    confirm: typed
    class: destroy
    confirm_action: "Destroy environment"
    dialog_title: "Destroy this environment?"
    fixture: project
    persona: owner
    status: confirmed
    prod-qa: open-cancel

  # A cluster found deleted outside Alethia (#6736): records the environment and its cluster as
  # DESTROYED with no cloud call and no job. The SAME component renders on the environment card
  # (/[org]/[project]/environments); the cluster card is the route recorded here.
  - id: env.mark-destroyed
    route: /[org]/~/clusters
    surface: apps/console/components/clusters/missing-cluster-actions.tsx
    mutation: markEnvironmentDestroyedAction
    control: { role: button, name: "Mark as destroyed" }
    confirm: confirm-dialog
    confirm_action: "Mark as destroyed"
    dialog_title: "Mark <name> as destroyed?"
    fixture: missing-cluster
    persona: owner
    status: confirmed
    prod-qa: open-cancel

  # The SAME Destroy button, on an environment that owns a cluster other environments are placed on
  # (#5261). Clicking it reads `canvas.destroyTree` first, so the dialog it opens is a different one: it
  # lists every environment the cascade takes, tenants first and the owner last, and its two buttons
  # are "Destroy children first" (the way out — it cancels and explains the order) and "Destroy all
  # <n> environments" (`destroyEnvironmentAction` with `cascade: true`, disabled until the project name is
  # typed). There is no button named Cancel, so `cancel_action` names the way out for the spec.
  - id: env.destroy.cascade
    route: /[org]/[project]/architecture
    # The trigger is the danger zone's Destroy; the dialog itself is
    # canvas/cards/destroy-environment-dialog.tsx.
    surface: apps/console/components/design-project/canvas/cards/env-settings-card.tsx
    mutation_surface: apps/console/components/design-project/canvas/design-project-canvas.tsx
    mutation: destroyEnvironmentAction
    reach: [{ menu: "More" }, { open: "Environment settings" }, { section: "Destroy environment" }]
    control: { role: button, name: "Destroy" }
    # `CascadeConfirm`: "Destroy all" is a submit that stays disabled until the project name is typed.
    confirm: typed
    class: destroy
    confirm_action: "Destroy all"
    cancel_action: "Destroy children first"
    dialog_title: "Destroy <n> environments?"
    fixture: fabric-owner-with-live-tenant
    persona: owner
    status: confirmed
    prod-qa: skip
    reason: needs a dedicated environment with a live namespace/vcluster environment placed on its cluster, which needs two deployed environments

  - id: canvas.discard-staged
    route: /[org]/[project]/architecture
    surface: apps/console/components/design-project/canvas/pending-changes-bar.tsx
    mutation_surface: apps/console/components/design-project/canvas/design-project-canvas.tsx
    mutation: discardStagedDesignAction
    reach: [{ open: "add a node so the pending-changes bar renders" }]
    control: { role: button, name: "Discard" }
    confirm: confirm-dialog
    confirm_action: "Discard"
    dialog_title: "Discard staged changes?"
    fixture: project
    persona: owner
    status: confirmed
    prod-qa: own-rows-only

  - id: canvas.delete-resource
    route: /[org]/[project]/architecture
    surface: apps/console/components/design-project/canvas/inspector/danger-zone.tsx
    mutation: removeNodes
    # "Database audit-db" is the accessible name of the card the `project-with-a-node` seeder
    # writes (e2e/audit/fixtures-destructive.ts). base-node.tsx labels every card `role="group"`
    # with nodeAccessibleName(eyebrow, title). The board draws no cluster or network card
    # (canvas-flow.tsx), so the "Cluster" this step named on run 35368920880 was not a board node.
    # Clicking the card opens the inspector (canvas-flow.tsx `onNodeClick`) on the rail. The danger
    # zone is on the inspector's SETTINGS tab (node-inspector.tsx), not on Overview where a card
    # opens, and it is a COLLAPSIBLE (inspector/danger-zone.tsx), so "Delete resource" is not in the
    # DOM until both are opened.
    reach: [{ select: "Database audit-db" }, { tab: "Settings" }, { open: "Danger zone" }, { section: "Delete resource" }]
    control: { role: button, name: "Delete" }
    confirm: undo
    undo: { shortcut: "Meta+Z" }
    fixture: project-with-a-node
    persona: owner
    status: confirmed
    prod-qa: own-rows-only

  - id: byo.chart.detach
    route: /[org]/[project]/architecture
    surface: apps/console/components/design-project/canvas/nodes/chart-node.tsx
    mutation: detachByoChartAction
    control: { role: button, name: "Detach chart" }
    confirm: confirm-dialog
    confirm_action: "Detach"
    dialog_title: "Detach this chart?"
    fixture: byo-chart
    persona: owner
    status: confirmed
    prod-qa: skip
    reason: needs an attached BYO chart

  - id: byo.iac.detach
    route: /[org]/[project]/architecture
    surface: apps/console/components/design-project/byo/iac-node.tsx
    mutation: detachIacSourceAction
    control: { role: button, name: "Detach IaC source" }
    confirm: confirm-dialog
    confirm_action: "Detach source"
    dialog_title: "Detach this IaC source?"
    fixture: byo-iac-source
    persona: owner
    status: confirmed
    prod-qa: skip
    reason: needs an attached BYO IaC source

  - id: addons.remove
    route: /[org]/[project]/architecture
    surface: apps/console/components/addons/addon-config-card.tsx
    mutation: useDisableAddon
    # REAL control names, not prose. `walkReach` resolves each step with
    # getByRole(button|option|menuitem)/getByLabel on the LITERAL string, so the previous step —
    # `{ open: "an installed add-on's config sheet" }` — could only ever time out and record the
    # control `not-measured`: unreachable by construction rather than by fixture luck. The two
    # steps below are the flow a person takes: the canvas toolbar's **Add** button opens the node
    # palette (design-project-canvas.tsx), and the palette's Add-ons group lists each catalog
    # add-on as a `role="option"` named after it (node-palette.tsx), which opens this card.
    # The fixture must install THAT add-on — the Remove button only renders for `item.install`.
    reach: [{ open: "Add" }, { open: "Prometheus + Grafana" }]
    control: { role: button, name: "Remove" }
    confirm: confirm-dialog
    confirm_action: "Remove add-on"
    dialog_title: "Remove this add-on?"
    fixture: installed-addon (kube-prometheus-stack / Prometheus + Grafana)
    persona: owner
    status: confirmed
    prod-qa: skip
    reason: needs an installed add-on on a provisioned environment

  # ── connectors ─────────────────────────────────────────────────────────────────────────────
  #
  # The disconnect dialog is ONE control that dispatches by kind: `disconnectConnector`
  # (connectors-page.tsx) sends a git link to `deleteProviderToken`, an api_key credential to
  # `deleteConnectorCredential`, and every cloud account to `disconnectCloudAccount` (#6124 — the
  # four per-cloud disconnect actions became one, which reads the provider from the stored row).
  # The dialog is `ConnectorsDisconnectDialog` (connectors-disconnect-dialog.tsx), on `ConfirmAction`.
  #
  # REAL CONTROLS (#6830). These six used to reach for `{menu: "connector actions"}` and a
  # `menuitem` named "Disconnect"; `components/connectors/` renders no menu at all, so every one was
  # withheld on every gate run and the typed disconnect dialog #7070 shipped was never opened. The
  # path a person takes: the connector's **Manage <connector>** button (connectors-action.tsx — on
  # the card and on the table row alike) opens the detail sheet; there a cloud account carries its
  # own icon button `Disconnect <account>` (connector-detail-sheet.tsx), and a git link or an api_key
  # connector carries one footer button `Disconnect <connector>`.
  #
  # The control names are the FIXTURE's names, literally: `connected-cloud-identity` writes one
  # account per cloud named `Audit <PROVIDER> account` (e2e/audit/fixtures-destructive.ts), and the
  # connector names are the catalog's (lib/db/seed/connectors.generated.sql). A template prefix
  # ("Disconnect <name>") would match only "Disconnect", which every one of these shares.
  #
  # Not destroy-class (the spec's §4.3 list does not name it). The dialog asks for the account's name
  # to be typed only when a project uses the account; with none it is a plain confirmation, so these
  # declare `alert-dialog` — the confirm button is asserted present either way.

  - id: connectors.disconnect
    route: /[org]/~/connectors
    surface: apps/console/components/connectors/connectors-page.tsx
    mutation: deleteProviderToken
    reach: [{ open: "Manage GitHub" }]
    control: { role: button, name: "Disconnect GitHub" }
    confirm: alert-dialog
    confirm_action: "Disconnect"
    dialog_title: "Disconnect GitHub?"
    fixture: connected-git-link
    persona: owner
    status: confirmed
    prod-qa: skip
    reason: a production connector is a real credential; the dialog also covers git unlink and API-key delete

  - id: connectors.disconnect.aws
