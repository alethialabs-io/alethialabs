    control: { role: button, name: "Delete organization" }
    confirm: alert-dialog
    confirm_action: "Delete organization"
    dialog_title: "Delete this organization?"
    fixture: none
    persona: owner
    status: confirmed
    prod-qa: skip
    reason: irreversible — deletes the QA org itself

  - id: project.delete
