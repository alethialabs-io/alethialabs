# SPDX-License-Identifier: AGPL-3.0-only
#
# THE DESTRUCTIVE-ACTION REGISTRY — every control in the console that deletes, removes, destroys,
# revokes, cancels, detaches, disconnects, discards or suspends something, and what stands between
# a click and the mutation.
#
# One list, read by three instruments so they cannot disagree about what exists:
#   · scripts/check-destructive-actions.mjs   — the STATIC census: every call site of a
#     destructive server action / auth-client method under apps/console must have an entry here,
#     and every entry's `surface` must contain its `mutation`. (#4266)
#   · apps/console/e2e/audit/destructive.spec.ts — the LIVE spec: opens each control, asserts the
#     confirmation it declares, CANCELS, and proves nothing mutated. A `missing` entry whose dialog
#     now appears FAILS — the lane that adds the dialog flips the entry in the same PR. (#4266)
#   · .claude/skills/console-prod-qa/SKILL.md   — the production pass reads `prod-qa` to decide
#     what it may open on alethialabs.io: `open-cancel` (open the dialog, press Cancel),
#     `own-rows-only` (may confirm, but only on a row the run itself created), `skip` (never
#     touched on production, with the reason beside it). (#4284)
#
# Field contract (version 1):
#   id              stable dotted name; the census and the spec key on it
#   route           the manifest route the control lives on (scripts/lib/console-routes.mjs)
#   surface         the component file — PINNED; read it before asserting anything about the control
#   mutation        the identifier the click reaches (a server action, an authClient method, a store
#                   action); "" when the lane that owns the surface has yet to pin it (the census
#                   refuses an empty mutation — it is a to-do, not an exemption).
#                   TWO SHAPES, because two kinds of call site exist and the census greps for both:
#                     · an identifier — `deleteProject`, `authClient.organization.delete`. Matched
#                       whole, or by its last segment for a dotted path.
#                     · a bare fetch — `<path> <VERB>`, e.g. `/api/org/logo DELETE`. There is no
#                       identifier to grep, so the census matches the PATH and reads the verb as
#                       documentation. Written this way rather than invented as a fake identifier:
#                       a name that appears in no file is one a reader cannot chase.
#   mutation_surface  OPTIONAL — the file that actually invokes `mutation`, when that is not
#                   `surface`. Six controls are presentational: `pool-card.tsx` renders the trigger
#                   and raises `onDelete`, and the parent (or a store) calls the server action.
#                   `surface` answers "where does the spec find the control", which is what drives
#                   it; this answers "where does the mutation live", which is what the census greps.
#                   Collapsing the two would force a choice between a `surface` the spec cannot
#                   drive and a census rule that cannot check anything — so they are two fields.
#                   When absent, the census reads `mutation` from `surface`, which is the ordinary
#                   case (35 of 41).
#   reach           optional opener chain the spec walks first: {menu: "<name>"} | {section: "<title>"}
#                   | {select: "<row>"} | {open: "<control>"}
#   control         the trigger, by accessible role + name (never a CSS class)
#   confirm         alert-dialog | confirm-dialog | popover | undo | none
#   confirm_action  the destructive button's label — the ONE control the spec never clicks
#   dialog_title    what the dialog says, so a renamed dialog is a finding rather than a pass
#   fixture         what the spec must seed for the control to render
#   persona         owner | team | member
#   status          confirmed (a confirmation exists) | missing (fires on a bare click — `issue`
#                   REQUIRED) | inert (the control does nothing at all — `issue` REQUIRED)
#   issue           the board unit that flips a `missing`/`inert` entry
#   prod-qa         open-cancel | own-rows-only | skip
#   reason          why prod-qa is `skip`, when it is
#
# A `missing` entry is a DEFECT recorded, not a decision. Of the 41 controls read on 2026-09-07,
# 22 are `confirmed`, 18 are `missing` and 1 is `inert` — so NINETEEN fire on a bare click, and each
# names the lane that adds the ConfirmDialog. (The count is stated as the three statuses rather than
# one number because `inert` is not a missing confirmation, it is a control that does nothing at
# all, and a single figure hid that distinction.)

version: 1

allow:
  # Call sites the census may see that are NOT a destructive control a person clicks. Each needs a
  # reason; an empty reason is refused.
  - mutation: discardChanges
    surface: apps/console/lib/stores/use-canvas-store.ts
    reason: the client-side half of canvas.discard-staged; the server half (discardStagedChanges) is the registered mutation

  - mutation: cancelJob
    surface: apps/console/lib/query/use-jobs-query.ts
    reason: the query-hook delegate for jobs.cancel; the control is the job page's Cancel button, recorded there

