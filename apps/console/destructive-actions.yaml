    confirm_action: "Suspend member"
    dialog_title: "Suspend this member?"
    fixture: member-row
    persona: team
    status: confirmed
    prod-qa: skip
    reason: suspends a real person's access; the QA org's only other member is the founder

  - id: members.reactivate
    route: /[org]/~/settings/members
    surface: apps/console/components/settings/members/members-table.tsx
    mutation: setMemberSuspended
    # A SUSPENDED member's menu — `Reactivate` replaces `Suspend` only for `r.status === "suspended"`,
    # so this is the one row kind on which the item exists at all.
    reach: [{ menu: "Manage suspended member" }]
    control: { role: menuitem, name: "Reactivate" }
    # Reactivating destroys nothing, and it is registered and confirmed anyway: it is the same
    # `setMemberSuspended` write on the same menu, and a toggle whose two directions disagree about
    # whether they ask first teaches the reader that the question is decoration.
    confirm: confirm-dialog
    confirm_action: "Reactivate member"
    dialog_title: "Reactivate this member?"
    fixture: suspended-member-row
    persona: team
    status: confirmed
    prod-qa: skip
    reason: the inverse of members.suspend, which is skipped

  - id: members.bulk-remove
    route: /[org]/~/settings/members
    surface: apps/console/components/settings/members/members-table.tsx
    mutation: authClient.organization.removeMember
    # `Select` is the LEADING WORD of every row checkbox's accessible name ("Select <who>") — the
    # reach matcher is a substring, so one step ticks the first row, and one ticked row raises the
    # bulk bar, which is all this entry needs. The previous step, "select two rows", was a sentence
    # rather than a control, so it could never be taken. Unlike the four row-menu entries above, this
    # one does NOT depend on a fixture: the checkbox column renders for every row including the
    # owner's, so an org holding nothing but its owner still raises the bar.
    reach: [{ open: "Select" }]
    control: { role: button, name: "Remove" }
    confirm: confirm-dialog
    confirm_action: "Remove selected"
    dialog_title: "Remove the selected people?"
    fixture: two-member-rows
    persona: team
    status: confirmed
    prod-qa: skip
    reason: bulk over real people

