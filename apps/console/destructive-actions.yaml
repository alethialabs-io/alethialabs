  - id: members.remove
    route: /[org]/~/settings/members
    surface: apps/console/components/settings/members/members-table.tsx
    mutation: authClient.organization.removeMember
    # ── THE FOUR ROW CONTROLS BELOW REACH A ROW KIND, NOT "THE FIRST MANAGE BUTTON" ──────────────
    #
    # A reach step naming something the page does not render withholds the control's verdict WITHOUT
    # failing — a confirmation nobody ever opened, recorded as fine — so "Row actions", a string that
    # appears nowhere in the console, had to go. But "Manage" alone was not the fix either: every
    # non-owner row rendered a trigger with that exact `aria-label`, `walkReach` takes `.first()`,
    # and so all four of these opened ROW 1's menu. Two of the four items only exist on some other
    # row's menu — `Cancel invitation` on an invitation's, `Reactivate` on a suspended member's — so
    # those two could never be reached and were withheld while the entry claimed `confirmed`.
    #
    # members-table.tsx now names each trigger for its subject — "Manage member <who>", "Manage
    # suspended member <who>", "Manage invitation <address>" — which is the a11y fix as much as the
    # measurement one (one "Manage" repeated down a column tells a screen-reader user nothing about
    # which person it belongs to). The KIND leads, so a chain can select the row it needs without any
    # fixture having to be named here.
    #
    # ⚠ Selecting the right KIND is not the same as the row EXISTING. No project seeds the `fixture:`
    # rows below — `e2e/audit/context.ts` writes a project, a job and a support case and nothing
    # else — so on an org holding only its owner these steps still withhold, now with the honest
    # reason ("not rendered for this persona") rather than by opening the wrong menu. Seeding them,
    # and the fact that a withheld verdict is currently GREEN, are #4646.
    reach: [{ menu: "Manage member" }]
    control: { role: menuitem, name: "Remove from organization" }
    confirm: confirm-dialog
    confirm_action: "Remove member"
    dialog_title: "Remove this member?"
    fixture: member-row
    persona: team
    status: confirmed
    prod-qa: own-rows-only

  - id: members.invitation.cancel
    route: /[org]/~/settings/members
    surface: apps/console/components/settings/members/members-table.tsx
    mutation: authClient.organization.cancelInvitation
    # An INVITATION's menu — the only one that carries this item (`r.kind !== "member"`).
    reach: [{ menu: "Manage invitation" }]
    control: { role: menuitem, name: "Cancel invitation" }
    confirm: confirm-dialog
    # "Revoke invitation" — a THIRD spelling on purpose. The menu item that opens this dialog says
    # "Cancel invitation" and the dialog's own way out says "Cancel"; a confirm button spelled like
    # either one gives the spec two matches and no attributable verdict.
    confirm_action: "Revoke invitation"
    dialog_title: "Cancel this invitation?"
    fixture: pending-invitation
    persona: team
    status: confirmed
    prod-qa: own-rows-only

  - id: members.suspend
