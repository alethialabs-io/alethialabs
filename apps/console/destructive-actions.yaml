    route: /[org]/[project]/architecture
    surface: apps/console/components/addons/addon-config-card.tsx
    mutation: useDisableAddon
    # REAL control names, not prose. `walkReach` resolves each step with
    # getByRole(button|option|menuitem)/getByLabel on the LITERAL string, so the previous step —
    # `{ open: "an installed add-on's config sheet" }` — could only ever time out and record the
    # control `not-measured`: unreachable by construction rather than by fixture luck. The two
    # steps below are the flow a person takes: the canvas toolbar's **Add** button opens the node
    # palette (design-project-canvas.tsx), and the palette's Add-ons group lists each catalog
    # add-on as a `role="option"` named after it (node-palette.tsx), which opens this card.
    # The fixture must install THAT add-on — the Remove button only renders for `item.install`.
    reach: [{ open: "Add" }, { open: "Prometheus + Grafana" }]
    control: { role: button, name: "Remove" }
    confirm: confirm-dialog
    confirm_action: "Remove add-on"
    dialog_title: "Remove this add-on?"
    fixture: installed-addon (kube-prometheus-stack / Prometheus + Grafana)
    persona: owner
    status: confirmed
    prod-qa: skip
