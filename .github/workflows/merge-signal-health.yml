#
# Weekly reliability report for the merge queue's OBSERVE-ONLY heavy signals (real-runner
# provision-e2e + the browser E2Es). It runs scripts/merge-signal-health.sh over recent MERGIFY
# queue builds — ci.yml `pull_request` runs on `mergify/merge-queue/*` heads, listed through the
# REST API (#2759) — and reports each signal's pass-rate + a PROMOTE/OBSERVE/UNREACHABLE verdict,
# so "observe then promote" is a data trigger, not a calendar reminder.
#
# It exits 1 (a red run) when the source is empty or stale, or when a signal is UNREACHABLE on it
# — a signal the queue never schedules cannot be graded, and saying "keep observing" about it is
# how this report stayed green for six weeks on a dead `merge_group` source.
#
# Promotion is NOT a one-line edit: the report names all three required-check lists
# (var.required_status_checks, .mergify.yml merge_conditions and merge_protections) and the
# always-report rule a job must satisfy first. A `schedule:` runs the DEFAULT branch's copy of the
# script, so a change to it reports here only once it reaches main.

name: Merge-signal health

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC (after the Monday mutation cron; weekly cadence)
  workflow_dispatch: # run on demand from the Actions tab

permissions:
  contents: read
  actions: read # read CI run + job conclusions
  issues: write # upsert the report onto the tracking issue (if MERGE_SIGNAL_ISSUE is set)

jobs:
  report:
    name: Merge-signal health report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compute merge-signal health
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional: repo variable MERGE_SIGNAL_ISSUE = the tracking issue number to comment on.
          MSI_ISSUE: ${{ vars.MERGE_SIGNAL_ISSUE }}
        run: |
          args=()
          [ -n "$MSI_ISSUE" ] && args=(--issue "$MSI_ISSUE")
          code=0
          report="$(bash scripts/merge-signal-health.sh "${args[@]}")" || code=$?
          echo "$report"
          # Always surface the report before preserving a refusal's non-zero verdict. Without the
          # explicit capture, bash -e exits on the assignment and the summary is never written.
          {
            echo '## Merge-signal health'
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
