name: Infra - CP AWS

# VALIDATE-ONLY, and credential-free by construction. `infra/cp-aws` is a self-hosting option a
# user applies in THEIR OWN AWS account (apps/docs/.../self-host/terraform/aws.mdx); it is not a
# deployment target of ours. Hosted prod runs on `cp-hetzner`. Until 2026-11-14 this file also
# carried a push-to-main `apply` job behind `vars.INFRA_AWS_APPLY` and static
# `AWS_ACCESS_KEY_ID`/`AWS_SECRET_ACCESS_KEY` repo secrets. That job never ran (every push run was
# `skipped`, the variable was never set), the `TF_STATE_S3_*` secrets its `tofu init` needed do not
# exist, no `aws-cp/` state exists, and the static key (set 2026-05-31) predates every IAM key the
# account still holds, so it could not authenticate either. It was
# removed rather than moved to OIDC: a deploy role for a target nobody deploys is standing
# privilege with no user. To make AWS a real target again, add a role to `infra/aws-oidc/roles.tf`
# (the `alethia-cp-deployer` pattern) and an `aws-actions/configure-aws-credentials` apply job —
# never a static key.
on:
  pull_request:
    paths:
      - 'infra/cp-aws/**'

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml`, `addon-render-determinism.yml` and the four workflows
# fixed on 2026-09-02 carry this; these nine did not.
#
# MEASURED 2026-09-03 over 500 runs / 6h24m: jobs spend 5,376 minutes WAITING for a runner against
# 1,802 executing, and 77 of 500 runs (15 percent) were cancelled — started, took a slot, thrown
# away. The currency is slots REQUESTED, so a superseded run costs the same as a useful one until
# it dies.
#
# `github.ref` is `refs/pull/<n>/merge` on a pull_request, so it is distinct per PR.
concurrency:
  group: infra-cp-aws-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_DIR: infra/cp-aws
  TOFU_VERSION: "1.10.10"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Validate (no backend, no secrets)
        working-directory: ${{ env.TF_DIR }}
        # No backend and no secrets: this workflow references none, so none can reach a PR job.
        run: |
          tofu init -backend=false
          tofu validate

      - name: IaC checks (fmt + tflint + Trivy)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: ${{ env.TF_DIR }}
