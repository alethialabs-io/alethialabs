name: Infra - Project Templates

on:
  pull_request:
    paths:
      - 'infra/templates/**'
      - 'infra/.tflint.hcl'
      - 'infra/.trivy.yaml'
      - '.github/actions/iac-checks/**'
  push:
    branches: [main]
    paths:
      - 'infra/templates/**'

# The customer project templates (infra/templates/project/{aws,gcp,azure,hetzner,alibaba}) are
# applied at provision time by the runner, NOT by this repo's CI. So this workflow gates them with
# credential-free static checks: fmt + validate + tflint + Trivy misconfig + the plan-out-safety
# guard (below). No apply.

permissions:
  contents: read

env:
  # THE ENGINE THE RUNNER APPLIES WITH — not the newest OpenTofu. This gate exists to prove the
  # project templates plan; run it on anything else and it proves that some OTHER engine can plan
  # them. It gated with 1.10.10 for the life of these templates while the runner applied 1.9.0
  # (#1931), and the two disagree on `||` short-circuiting: 1.9.0 evaluates every disjunct, so an
  # index into a count-0 resource kills the plan where 1.10.10 never reaches it. That skew hid a
  # dead gcp template (#1920) and two live azure conditions.
  #
  # This value is COUPLED, not typed here twice: packages/core/compat/matrix.json
  # `static_couplings[tofu].value` is the SSOT that already binds the Go const
  # (packages/core/tofu/tofu.go DefaultIaCVersion) to the runner image ARG
  # (apps/runner/Dockerfile.base). `packages/core/compat/couplings_drift_test.go` now reads this
  # env too, so editing this literal alone reds that test — which is the point. Bump the matrix.
  TOFU_VERSION: "1.9.0"

  # ── DOCUMENTED CLOUD-PARITY EXCLUSION: hetzner, `tofu test` only ─────────────────────────────
  # OpenTofu 1.9.0 CRASHES running hetzner's suite at all — nil pointer in cty.testConformance via
  # readDataSource, composing a mock value for data.talos_image_factory_extensions_versions.this.
  # Root cause upstream: MockValueComposer built a cty.NilType for any schema attribute declared
  # with a structural NestedType — opentofu/opentofu#2993, fixed by opentofu/opentofu#2994
  # (#2599 closed as a duplicate). It is a `tofu test` MOCK bug: a real provider read never goes
  # through MockValueComposer, so this is not something a real hetzner plan hits.
  #
  # So hetzner's `tofu test` runs 1.9.4: the newest patch on the runner's OWN 1.9 minor. It carries
  # the mock fix and still does NOT short-circuit `||` (measured: `true || []{0}.x` errors on both
  # 1.9.0 and 1.9.4, plans clean on 1.10.10), so hetzner's suite is still judged on the shipped
  # evaluation semantics. Falling back to 1.10.x instead would restore short-circuiting and keep
  # hiding, on hetzner alone, the exact class this coupling exists to catch.
  #
  # `tofu validate` — the step that actually evaluates the hetzner template — still runs on
  # TOFU_VERSION. See the swap step below for what else the position costs.
  #
  # RETIRE THIS when the runner's tofu moves to >= 1.9.4 — a patch bump on the same minor, which is
  # a far smaller decision than moving the minor. Recorded as data in matrix.json
  # `static_couplings[tofu].workflow_exclusions`, and drift-checked against this literal.
  TOFU_TEST_EXCLUDED_CLOUD: "hetzner"
  TOFU_TEST_EXCLUSION_VERSION: "1.9.4"

jobs:
  # The runner deploys via `tofu plan -out` → apply that saved plan. A provider configured from
  # a cluster's own known-after-apply kubeconfig can't resolve at plan, so the runner can never
  # deploy such a template — this shipped undetected on Hetzner (#295) because CI only ran
  # `tofu validate` (which never evaluates provider configs). This guard makes that bug class
  # non-regressable, credential-free.
  plan-out-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Project templates must be plan-out-safe (no in-tofu k8s-apply resources)
        run: bash scripts/check-templates-plan-safe.sh

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure, hetzner, alibaba, local]
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Validate (no backend, no creds)
        working-directory: infra/templates/project/${{ matrix.cloud }}
        run: |
          tofu init -backend=false
          tofu validate

      # The hetzner exclusion, applied. It sits HERE, after `validate` and before both `tofu test`
      # invocations, because ./.github/actions/iac-checks runs a second `tofu test` of its own at the
      # end — so a swap placed any later would still hand hetzner's suite to 1.9.0 and crash. The
      # cost of the position is that hetzner's `tofu fmt -check` also runs on the exclusion version;
      # `validate` — the step that evaluates the template — does not, and formatting is identical
      # across 1.9.0 / 1.9.4 / 1.10.10 (measured, `fmt -check -recursive` clean on all three).
      #
      # Announced as a workflow warning so the departure is visible in the run, not just in a
      # comment. See the block on TOFU_TEST_EXCLUSION_VERSION above for the upstream reference and
      # what retires it.
      - name: 'Exclusion: hetzner ''tofu test'' runs a different engine'
        if: matrix.cloud == env.TOFU_TEST_EXCLUDED_CLOUD
        run: |
          msg="hetzner's 'tofu test' runs OpenTofu ${TOFU_TEST_EXCLUSION_VERSION}, not the runner's ${TOFU_VERSION}."
          msg="$msg ${TOFU_VERSION} crashes composing a mock for data.talos_image_factory_extensions_versions"
          msg="$msg (opentofu/opentofu#2993, fixed by #2994) — a tofu-test mock bug, not a plan bug."
          msg="$msg Same 1.9 minor, same non-short-circuiting '||'; 'tofu validate' still ran on ${TOFU_VERSION}."
          msg="$msg Retire when the runner's tofu reaches ${TOFU_TEST_EXCLUSION_VERSION}."
          echo "::warning title=hetzner tofu test exclusion (#1931)::$msg"
      - uses: opentofu/setup-opentofu@v2
        if: matrix.cloud == env.TOFU_TEST_EXCLUDED_CLOUD
        with:
          tofu_version: ${{ env.TOFU_TEST_EXCLUSION_VERSION }}

      # `tofu test` runs the fail-closed guards against MOCKED providers and asserts they actually
      # refuse what they claim to refuse. `validate` cannot do this: it never evaluates a
      # precondition, so a guard that can't fail looks identical to one that works. A cloud with no
      # *.tftest.hcl is skipped rather than failed — the suites land per cloud as each is written.
      #
      # A FETCH FAILURE IS NOT A RENDER FAILURE (#2754).
      #
      # `tofu test` here is NOT hermetic, on one cloud. hetzner's template holds four
      # `data "helm_template"` sources pointing at two third-party hosts — charts.hetzner.cloud
      # and helm.cilium.io — and a data source is evaluated at plan, so every run fetches an
      # index.yaml and a chart tarball live from someone else's server. aws and gcp render from
      # local chart paths; alibaba, azure and local render nothing. hetzner is the only cloud
      # exposed, which is exactly the distribution of the flake.
      #
      # `helm` is deliberately left unmocked in checks_dns_and_network.tftest.hcl, because
      # checks_data.tf and csi.tf assert real properties of the rendered manifests and a mock
      # hands them empty strings. That trade is defensible; what is not is that a TCP reset on
      # a third-party host then reads as a template defect:
      #
      #   Error: looks like "https://charts.hetzner.cloud" is not a valid chart repository or
      #   cannot be reached: … read: connection reset by peer
      #   with data.helm_template.hcloud_ccm, on cilium.tf line 111
      #
      # That is the whole of #2754 — "a fetch failure is indistinguishable from a render
      # failure". It went red on the staging→main promotion PR #3117 while the same commit
      # passed on azure, gcp, alibaba and local, and blocked a production promotion.
      #
      # So: retry ONLY a network-shaped failure, and say so out loud. Anything else — a failed
      # assertion, a bad plan, a broken mock — is a real verdict and fails on the FIRST attempt,
      # because retrying a genuine failure is how a gate quietly stops gating. A retry emits a
      # ::warning:: naming the host, so the flake stays visible and countable in the run rather
      # than being silently absorbed; exhausting the retries emits an error that names it a
      # FETCH failure, so the next person does not go looking at the template.
      #
      # The durable fix is to stop fetching third-party charts in CI at all (#2754). This makes
      # the failure honest and non-blocking in the meantime; it does not close that issue.
      - name: OpenTofu Test (mocked providers, no creds)
        working-directory: infra/templates/project/${{ matrix.cloud }}
        env:
          TOFU_TEST_FETCH_ATTEMPTS: "3"
        run: |
          if ! ls ./*.tftest.hcl >/dev/null 2>&1; then
            echo "::notice::no *.tftest.hcl for ${{ matrix.cloud }} — skipping"
            exit 0
          fi
          tofu version

          # Network-shaped, not failure-shaped. Every alternative here names a transport problem
          # reaching a chart repository; none of them can be produced by a template that renders.
          fetch_err='not a valid chart repository or cannot be reached|connection reset by peer|TLS handshake timeout|no such host|i/o timeout|Client\.Timeout exceeded|unexpected EOF|EOF$|temporary failure in name resolution|502 Bad Gateway|503 Service Unavailable'

          attempt=1
          while :; do
            # `tee` so the run stays readable while the output is also inspected. PIPESTATUS[0],
            # not $?, because a pipeline reports the LAST command's status — tee always succeeds,
            # so `$?` here would report every failing test run as a pass.
            set -o pipefail
            tofu test 2>&1 | tee /tmp/tofu-test.log
            rc=${PIPESTATUS[0]}
            set +o pipefail
            [ "$rc" -eq 0 ] && break

            if ! grep -qEi "$fetch_err" /tmp/tofu-test.log; then
              echo "::error title=tofu test failed::${{ matrix.cloud }}: this is a TEST failure, not a fetch failure — not retrying."
              exit "$rc"
            fi

            host="$(grep -oE 'https://[a-zA-Z0-9._-]+' /tmp/tofu-test.log | head -1)"
            host="${host:-a chart repository}"

            if [ "$attempt" -ge "$TOFU_TEST_FETCH_ATTEMPTS" ]; then
              echo "::error title=chart fetch failed (#2754)::${{ matrix.cloud }}: could not REACH ${host} in ${TOFU_TEST_FETCH_ATTEMPTS} attempts. This is a FETCH failure — the template was never evaluated, so it says nothing about the template. See #2754."
              exit "$rc"
            fi

            echo "::warning title=chart fetch flake (#2754)::${{ matrix.cloud }}: attempt ${attempt}/${TOFU_TEST_FETCH_ATTEMPTS} could not reach ${host} — a live third-party fetch, not a template failure. Retrying in $((attempt * 10))s."
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done

      - name: IaC checks (fmt + tflint + Trivy)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: infra/templates/project/${{ matrix.cloud }}
