name: Infra - Project Templates

on:
  pull_request:
    paths:
      - 'infra/templates/**'
      - 'infra/.tflint.hcl'
      - 'infra/.trivy.yaml'
      - '.github/actions/iac-checks/**'
      - 'scripts/check-templates-refresh-safe.mjs'
      # This file itself: a change to which engine runs a template's `tofu test` is only measured
      # if the workflow runs on the PR that makes it (#5709 retired an exclusion and had no other
      # path to a run).
      - '.github/workflows/infra-templates.yml'
  push:
    branches: [main]
    paths:
      - 'infra/templates/**'
      - 'scripts/check-templates-refresh-safe.mjs'

# The customer project templates (infra/templates/project/{aws,gcp,azure,hetzner,alibaba}) are
# applied at provision time by the runner, NOT by this repo's CI. So this workflow gates them with
# credential-free static checks: fmt + validate + tflint + Trivy misconfig + the plan-out-safety
# guard (below). No apply.

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml` and `addon-render-determinism.yml` have carried this
# since they were written; these seven did not, and the gap only became expensive when the queue
# started landing PRs faster than a run takes to finish.
#
# MEASURED 2026-09-02 19:2xZ, with the dev queue draining: 48 runs queued against 2 in progress,
# and the single largest group was 23 runs headed `dev` — the standing `dev → staging` promotion
# PR #3562, which re-triggers every `pull_request` workflow on EVERY merge into dev. `CI` had
# already cancelled its own superseded runs and showed 1; these seven each showed a full stack.
#
# Scoped to `github.ref`, so this only ever cancels an OLDER run of the SAME workflow on the SAME
# PR or branch — the ordinary "I pushed again" case. It cannot cancel a run for a different ref.
concurrency:
  group: infra-templates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # THE ENGINE THE RUNNER APPLIES WITH — not the newest OpenTofu. This gate exists to prove the
  # project templates plan; run it on anything else and it proves that some OTHER engine can plan
  # them. It gated with 1.10.10 for the life of these templates while the runner applied 1.9.0
  # (#1931), and the two disagree on `||` short-circuiting: 1.9.0 evaluates every disjunct, so an
  # index into a count-0 resource kills the plan where 1.10.10 never reaches it. That skew hid a
  # dead gcp template (#1920) and two live azure conditions.
  #
  # This value is COUPLED, not typed here twice: packages/core/compat/matrix.json
  # `static_couplings[tofu].value` is the SSOT that already binds the Go const
  # (packages/core/tofu/tofu.go DefaultIaCVersion) to the runner image ARG
  # (apps/runner/Dockerfile.base). `packages/core/compat/couplings_drift_test.go` now reads this
  # env too, so editing this literal alone reds that test — which is the point. Bump the matrix.
  TOFU_VERSION: "1.9.0"

jobs:
  # The runner deploys via `tofu plan -out` → apply that saved plan. A provider configured from
  # a cluster's own known-after-apply kubeconfig can't resolve at plan, so the runner can never
  # deploy such a template — this shipped undetected on Hetzner (#295) because CI only ran
  # `tofu validate` (which never evaluates provider configs). This guard makes that bug class
  # non-regressable, credential-free.
  plan-out-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Project templates must be plan-out-safe (no in-tofu k8s-apply resources)
        run: bash scripts/check-templates-plan-safe.sh

      # The same class one command later in the runner's life. `plan -out` is how it DEPLOYS;
      # `plan -refresh-only` is how it detects DRIFT, and refresh-only never plans a create — so a
      # counted resource the environment has not applied yet is an empty tuple and `[0]` aborts the
      # whole check. That killed drift detection on a production environment for five weeks, and no
      # apply-and-check e2e can see it: the failure needs an environment whose template has moved
      # since its last apply (#3351).
      - name: Project templates must be refresh-only safe (no bare [0] into a counted resource)
        run: node scripts/check-templates-refresh-safe.mjs

      # The guard's own fixtures: a detector that only ever runs against a clean tree cannot tell
      # "found nothing" from "asks nothing".
      - name: Refresh-safety guard self-test
        run: node scripts/check-templates-refresh-safe.mjs --self-test

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure, hetzner, alibaba, local]
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Validate (no backend, no creds)
        working-directory: infra/templates/project/${{ matrix.cloud }}
        run: |
          tofu init -backend=false
          tofu validate

      # `tofu test` runs the fail-closed guards against MOCKED providers and asserts they actually
      # refuse what they claim to refuse. `validate` cannot do this: it never evaluates a
      # precondition, so a guard that can't fail looks identical to one that works. A cloud with no
      # *.tftest.hcl is skipped rather than failed — the suites land per cloud as each is written.
      #
      # A FETCH FAILURE IS NOT A RENDER FAILURE (#2754). `tofu test` is not hermetic on one cloud:
      # hetzner declares three `data "helm_template"` sources against two third-party hosts, and a
      # data source is evaluated at plan, so every run fetches live. No other cloud template
      # declares a `helm_template` at all. The retry, what it refuses to retry, and why it is a
      # shared script rather than inline, all live in the script's own header.
      # THE NAME IS PART OF THE FIX (#2489). It used to read "mocked providers, no creds", and the
      # complaint that opened that issue was that the name is a promise: a reader whose PR reds here
      # assumes they broke a mocked test and looks in the wrong place — which is exactly what
      # happened before anyone read the log. "no creds" is true; "no network" never was, and the two
      # are easy to hear as the same claim.
      - name: OpenTofu Test (mocked providers · renders fetch pinned charts)
        working-directory: infra/templates/project/${{ matrix.cloud }}
        env:
          TOFU_TEST_FETCH_ATTEMPTS: "3"
        run: |
          if ! ls ./*.tftest.hcl >/dev/null 2>&1; then
            echo "::notice::no *.tftest.hcl for ${{ matrix.cloud }} — skipping"
            exit 0
          fi
          tofu version
          "${{ github.workspace }}/scripts/ci/tofu-test-retry-fetch.sh" "${{ matrix.cloud }}"

      - name: IaC checks (fmt + tflint + Trivy)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: infra/templates/project/${{ matrix.cloud }}
