#
# Close board issues the moment their PR merges into `dev`.
#
# GitHub's native "Closes #n" linkage only auto-closes an issue when the PR merges into the
# repository's DEFAULT branch (`main`). Our integration branch is `dev`, so a PR that merges
# into `dev` leaves its referenced issues OPEN — which is how >50% of the "open" board became
# already-shipped work that later gets re-claimed (duplicate builds). This closes that gap: on
# every merged PR into `dev`, parse the PR title + body for ALL closing refs and close each
# referenced issue that is still open.
#
# It is the Action half of Stream A; `scripts/coordinate.sh --close-shipped` is the manual
# backstop for refs this misses. See .claude/COORDINATION.md.
#
# Safety: plain `pull_request` (NEVER `pull_request_target`) — it checks out no untrusted code
# and does nothing but close issues. Least privilege: `issues: write` only.

name: Close on dev-merge

on:
  pull_request:
    # `closed` fires on both merge and plain-close; the merged guard below keeps only merges.
    types: [closed]
    branches: [dev]

permissions:
  issues: write
  contents: read

jobs:
  close-referenced-issues:
    name: Close issues referenced by the merged PR
    runs-on: ubuntu-latest
    # Only act on a real MERGE into dev — a PR closed without merging closes nothing.
    if: github.event.pull_request.merged == true
    steps:
      - name: Close each referenced issue that is still open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Title + body carry the closing keywords; join them so multi-issue PRs that put
          # refs in either place are all caught.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Parse ALL closing refs from the title + body. GitHub only auto-closes on `main`, and
          # multi-issue PRs frequently drop a per-issue keyword — so we deliberately match EVERY
          # `<keyword> #<n>` occurrence (close/fix/resolve + tenses), case-insensitive.
          #
          # ── A NEGATED KEYWORD IS NOT A KEYWORD (#3855, twice in one day) ──────────────────────
          # This used to be a bare `grep -oiE '(close|closes|…) +#[0-9]+'`, which matched the
          # `close #3855` INSIDE the sentence "It does not close #3855" and closed the issue. It
          # fired on #4919 at 16:54Z, a fix was promised, no PR was opened, and it fired again on
          # #4924 at 21:41Z — on the same issue, five hours later. Prose ABOUT a closing keyword is
          # not a closing keyword, and a PR explaining why it does NOT close something is exactly
          # the PR most likely to say the words.
          #
          # The negative lookbehinds need a PCRE-class engine, which ERE `grep` is not — hence jq,
          # whose Oniguruma supports them. Keep this pattern IDENTICAL to $BOARD_PR_CLOSING_KW in
          # scripts/lib/board-pr.sh; `scripts/check-closing-keyword-parsers.mjs` fails the build if
          # the two drift, because the same defect lived in BOTH and only one got noticed.
          #
          # The safe direction is deliberate: over-rejecting leaves an issue open for a human to
          # close, while under-rejecting closes an issue nobody meant to close and the board then
          # lies about what is done.
          # ── A CLOSING KEYWORD MUST START ITS LINE — the rule that subsumes the rest ──────────
          # A FOURTH false positive arrived ELEVEN SECONDS after the third fix merged, from the
          # paragraph in that very PR documenting the defect: "they closed #3348 and #4110 while
          # this branch was open" closed #3348 again. Past tense, no negation, not quoted — all
          # three guards correct, none applicable. A PR explaining this bug is GUARANTEED to carry
          # the strings, so lookbehinds are whack-a-mole by construction.
          #
          # Every false positive so far has been MID-SENTENCE. Measured over the last 60 merged dev
          # PRs: 28 closing refs on their own line, 10 only inline — of which exactly TWO are
          # genuine ("Closes #4910. Also fixes…", "Closes #4114. Part of #2766."), both
          # LINE-INITIAL. So this keeps 30 of 30 real refs and rejects 8 of 8 false ones on real
          # data rather than on an argument.
          #
          # ⚠️ `(?m)` HERE MEANS MULTILINE, not dotall. Classic Oniguruma documents it the other
          # way; jq's build uses Perl semantics. Verified: without `(?m)`, `^` anchors to the
          # string start and a line-initial ref on line 2 is MISSED. Title is joined before body
          # with "\n" for the same reason — a space would put a title's `Closes #n` mid-line.
          #
          # The lookbehinds below are kept as belt-and-braces for a line-initial negation
          # ("Does not close #n" starting a line), which the anchor alone would admit.
          #
          # The three families the lookbehinds cover, each of which closed a REAL issue:
          #   negation         "does not close #n"     → #3855, twice (#4919 16:54Z, #4924 21:41Z)
          #   relative clause  "what closes #n"        → #3348, by the sentence in #4940 saying it
          #                                              used `Refs` and not `Closes`
          #   quoted keyword   "`Closes #n`"           → #4110, by the note in #4935 recording that
          #                                              the ref had been changed FROM `Closes` so
          #                                              the issue would STAY OPEN
          # The first two are lookbehinds. The third is not decidable that way and is stripped
          # before matching — a keyword inside backticks is being NAMED, not used. Fenced blocks go
          # first: a ``` block can contain single backticks.
          refs="$(jq -rn --arg t "$PR_TITLE" --arg b "$PR_BODY" '
            ($t + "\n" + ($b // ""))
            | gsub("(?s)```.*?```"; " ") | gsub("`[^`\n]*`"; " ")
            | [ match("(?i)(?m)^[ \t]*(?:[-*>][ \t]*)*(?:[*][*])?(?<!not )(?<!n.t )(?<!never )(?<!what )(?<!that )(?<!which )(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved) +#([0-9]+)"; "g")
                | .captures[1].string ]
            | map(tonumber) | unique | .[]' || true)"

          if [ -z "$refs" ]; then
            echo "PR #$PR_NUMBER: no closing refs in title/body — nothing to close."
            exit 0
          fi

          echo "PR #$PR_NUMBER merged into dev; referenced issues: $(echo "$refs" | tr '\n' ' ')"
          for n in $refs; do
            # Idempotent: skip anything not currently OPEN (already closed, or not an issue —
            # a #<n> that resolves to a PR returns non-OPEN/errors and is skipped).
            state="$(gh issue view "$n" --json state --jq .state 2>/dev/null || echo "MISSING")"
            if [ "$state" != "OPEN" ]; then
              echo "  #$n: state=$state — skip."
              continue
            fi
            gh issue close "$n" \
              --comment "Closed by #${PR_NUMBER} merged into dev (close-on-dev-merge)." \
              && echo "  #$n: closed."
          done
