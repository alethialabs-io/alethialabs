#
# Static validation for the infra/e2e-issuer stack (the E2E assertion issuer's Workers Custom Domain
# and CAA set, #4226). Credential-free by design: the stack is APPLIED MANUALLY by the maintainer with
# a zone-scoped Cloudflare token (infra/e2e-issuer/README.md), so there is deliberately NO apply job
# here and no Cloudflare or state credential ever touches a run (safe on contributor PRs).
#
# iac-checks runs `tofu test` because the stack ships checks.tftest.hcl — mocked providers, which is
# where every validation, precondition and check in the stack is shown to FIRE.

name: Infra - E2E issuer

on:
  pull_request:
    paths:
      - "infra/e2e-issuer/**"
      # main.tf reads the Worker's name out of wrangler.jsonc, so a change there changes this plan.
      - "apps/e2e-issuer/wrangler.jsonc"
      # The other four committed copies of the issuer origin, and the instrument that compares them.
      - "infra/aws-oidc/terraform.tfvars"
      - "infra/gcp-e2e/terraform.tfvars"
      - "infra/azure-e2e/terraform.tfvars"
      - "infra/alibaba-e2e/terraform.tfvars"
      - "scripts/ci/check-e2e-issuer-health.mjs"
      - "infra/.trivyignore"
      - "infra/.tflint.hcl"
      - "infra/.trivy.yaml"
  push:
    branches: [main]
    paths:
      - "infra/e2e-issuer/**"
      - "apps/e2e-issuer/wrangler.jsonc"

# `github.ref`, not the PR number: this also fires on `push`, where the number renders empty and every
# push to `main` would share one group (infra-aws-oidc.yml records the same trap).
concurrency:
  group: infra-e2e-issuer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_DIR: infra/e2e-issuer
  TOFU_VERSION: "1.10.10"

jobs:
  validate:
    name: Validate + IaC checks (no backend, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          tofu init -backend=false
          tofu validate

      # The committed copies of the issuer origin (this stack's hostname, tls-ca-pin.json and the four
      # trust stacks' e2e_broker_issuer_url) agree. Hermetic.
      - name: The issuer origin has one value everywhere it is committed
        run: node scripts/ci/check-e2e-issuer-health.mjs --static
      # The scheduled health check's own proof, on the PR that changes it rather than only at 6-hourly
      # runs of main's copy: every check goes red on a fixture built to trip it.
      - name: The issuer health check can go red on every check
        run: node scripts/ci/check-e2e-issuer-health.mjs --self-test

      - name: IaC checks (fmt + tflint + Trivy + tofu test)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: ${{ env.TF_DIR }}
