# SPDX-License-Identifier: AGPL-3.0-only
#
# Continuous integration — validates every PR + push to main. The CD/release/infra
# workflows are separate. (The enterprise package @alethia/ee is verified at standup,
# not here — community CI checks the open-source build.)
#
# Since 2026-11-22 it also carries the two checks that had a workflow each — `capabilities-security`
# and `Build console images (no push)` — under their unchanged job names, and the `CI required` job
# that aggregates every required job here into one context (see its own comment for the rollout).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Historical native-queue trigger. Mergify does not emit `merge_group` (#4173) — a Mergify queue
  # build is a `pull_request` run on a `mergify/merge-queue/*` draft PR, and that is what
  # `provision-e2e` and scripts/merge-signal-health.sh now read (#2759). Kept so the jobs that still
  # name it keep working if a native queue ever returns; nothing fires it today.
  merge_group:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — mutation testing (slow, non-blocking)
    # Nightly 03:00 UTC — the console UI conformance audit over EVERY route, so a route no PR
    # happened to touch is still measured.
    #
    # ADDING A CRON SIGNS UP MORE THAN THE JOB YOU ADDED IT FOR, in two different ways, and both
    # are handled here rather than discovered later:
    #
    #   · a job that gates on `github.event_name == 'schedule'` now also fires nightly — that is
    #     `mutation`, which is pinned to its own cron expression below;
    #   · a job with NO `if:` AT ALL fires on every trigger, so six jobs that ran weekly on the
    #     Monday cron would have started running nightly against `main` (schedule only fires on the
    #     default branch): `typescript`, `integration`, `guards`, `go`, `secrets` and
    #     `addon-charts-render`. Each now carries `if: github.event.schedule != '0 3 * * *'` —
    #     and since `typescript` was split (2026-11-22), so do its three parts `ts-lint-types`,
    #     `ts-test` and `ts-build`.
    #
    # Two are deliberately NOT excluded, and the reason is not "it was missed":
    #   · `detect-changes` — `ui-audit` declares `needs: [detect-changes]`, and a job whose `needs`
    #     skipped is itself skipped, so excluding it would silently cancel the nightly audit;
    #   · `docs-prose` — it exists to ALWAYS report its status check (see its own comment), and on
    #     a schedule event every one of its steps is gated off by the `docs` filter, so it costs one
    #     idle runner rather than a Vale run.
    #
    # Three jobs added on 2026-11-22 never needed the conjunct: `capabilities-security` and
    # `build-console` (folded in from their own workflows) gate on a PR/dispatch event, and
    # `ci-required` is `if: always()` by design — on this cron it aggregates skipped needs and
    # costs one idle runner, the same trade `docs-prose` makes. (The TypeScript parts, `integration`,
    # `go` and `addon-charts-render` now also `need` `detect-changes`; they keep their own conjunct.)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      # ONLY the ts-coverage determinism probe reads this; every other job ignores it. It is here
      # because a run-count is the one knob a flap hunt actually needs, and today changing it means
      # editing a script and opening a PR — which is a poor way to ask "does it show up in 20?".
      #
      # MEASURED NEED (#3342): `apps/console/lib/billing` measures 957 or 958 of 1753 on the same
      # tree, and a 5-run dispatch on 2026-09-01 (run 33497231141) reported it DETERMINISTIC. That
      # is not evidence the flap is gone — it is evidence it is rarer than 1 in 5, and the only way
      # to say more is more runs.
      ts_probe_runs:
        description: "TS coverage determinism probe: how many runs to compare (default 5)"
        required: false
        default: "5"
      # ONLY `ts-shard-equivalence` reads this. Off by default, because that job re-runs the console suite
      # unsharded (~16 minutes of runner) — it is the proof the shard split needed once and needs again
      # after any change to vitest, its coverage provider or the merge, not a cost to pay on every dispatch.
      ts_shard_equivalence:
        description: "Run the console suite unsharded AND sharded+merged, and fail on any coverage difference"
        required: false
        type: boolean
        default: false

# CANCELLATION IS FOR SUPERSEDED PR RUNS ONLY (2026-11-22).
#
# This was `ci-${{ github.ref }}` with `cancel-in-progress: true`, and three different events share
# `refs/heads/main`: a push, the Monday 06:00 cron and the nightly 03:00 cron. So a merge to main
# cancelled a running mutation/UI-audit cron, and a cron cancelled the push run whose coverage-badge
# jobs publish from main. Measured over 2026-11-15→22: CI's median run was 56 minutes and 31% of its
# runs were cancelled.
#
# Now: a `pull_request` run is keyed on the PR's ref and cancels its own predecessor (the "I pushed
# again" case, unchanged). Every other event is keyed on its event name AND its commit, so a push, a
# cron or a dispatch never cancels anything and is never cancelled — including by a newer push,
# because a still-PENDING run in a shared group is replaced by the next one, which is a cancellation
# too.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# How many runners the console's unit suite is split across — read by `ts-test-console` (whose matrix
# must list exactly 1..N, and fails its first step when it does not), by `ts-test`'s merge (which
# refuses any other number of shards) and by `ts-shard-equivalence`. One value, three readers, every
# disagreement red. Why 4: see `ts-test-console`.
env:
  TS_CONSOLE_SHARDS: "4"

jobs:
  # Which surfaces does this PR touch? Two jobs' worth of answers, from one job:
  #
  #   · THE FOUR ORIGINAL OUTPUTS — `agent`, `console`, `docs`, `runner` — keep their exact meaning:
  #     'true'/'false' on a `pull_request`, and 'false' on every other event (each consumer below
  #     already ORs in the events it wants to run on). The heavy browser E2Es stay OFF most PRs
  #     (Actions minutes), but a PR that changes a surface an E2E covers turns that E2E into a PR
  #     gate — because the alternative is what kept happening: a suite that only runs post-merge
  #     lets a break ship green. A whole Lexical composer rewrite shipped that way (→ `agent`); the
  #     "Org evidence" heading the hero path waited for was deleted in an Evidence redesign and
  #     rotted for weeks (→ `console`).
  #
  #   · THE AFFECTED-ONLY PLAN (2026-11-22) — which required jobs a PR's diff can skip, and how far
  #     the TypeScript parts may narrow their turbo run. See "AFFECTED-ONLY" below.
  #
  # Replaced a hand-written `git diff | grep -E` with dorny/paths-filter — the same pinned major
  # validate-console's build job and deploy-console.yml already used. On a `pull_request` it lists
  # the PR's files through the API, which is the PR's OWN changes (the three-dot, merge-base set the
  # old grep computed by hand), so there is no checkout at all now. The old regexes were PREFIX
  # matches, and the globs below keep that: `components/agent` matched `components/agent-rail/…`
  # too, so it is written `agent*` and `agent*/**`.
  #
  # ── AFFECTED-ONLY ───────────────────────────────────────────────────────────────────────────
  #
  # `selective` is true only on an ordinary PR: event `pull_request`, head NOT a Mergify queue
  # branch (`mergify/merge-queue/*` — the queue build is where cross-PR breakage is caught, so it
  # runs everything), base NOT `main`/`staging` (a promotion ships what it carries). A push, a
  # `merge_group`, a cron and a dispatch are never selective: they run everything, as before.
  #
  # Two levers hang off it, and they are armed SEPARATELY on purpose:
  #
  #   1. TURBO NARROWING — live as of this change. `ts-lint-types` and `ts-build` hand turbo
  #      `--filter=…[HEAD^1]` when `ts_filter` is `affected`. The job still RUNS and still reports,
  #      so no required context changes shape; it only does less work.
  #
  #   2. JOB-LEVEL SKIPS — ARMED (`AFFECTED_ONLY_ARMED` below reads "true"; see there). A skipped job
  #      reports `skipped` and a matrix leg that is not generated reports NOTHING. `CI required`
  #      accepts both (a skipped need is "not needed"); a per-job `check-success=` in `.mergify.yml`
  #      accepts neither, and a ruleset that names a per-job context waits forever on a leg that
  #      never reports. So BEFORE this constant may read "true", ALL THREE of these must hold:
  #        a. `.mergify.yml` ON `main` requires `CI required` and none of the per-job contexts it
  #           covers (Mergify reads its configuration only from `main`);
  #        b. the LIVE `protect-dev` ruleset requires `CI required` and none of those per-job
  #           contexts — i.e. infra/github has been APPLIED and
  #           `node scripts/ci/check-required-checks.mjs --live` reports protect-dev agreeing with
  #           the HCL. (protect-main changes in the same apply; a PR into `main` is never selective,
  #           so it skips nothing either way.)
  #        c. `CI required` has been observed green on a real dev PR after (a) and (b).
  #      Then a reviewed one-line PR flips this constant. It is a constant in this file and not a
  #      repository variable so that the switch is a diff someone reviewed, and so that nothing
  #      outside the tree can arm it on its own.
  #
  # WHAT THE SKIP SETS ARE, AND WHAT THEY ARE NOT. The sets were derived on 2026-11-22 from a grep
  # of what each language's tests actually READ — and this repo's tests cross-read heavily: Go
  # tests read apps/console sources, apps/docs pages, packages/format fixtures, infra/templates and
  # .github/workflows; console unit tests read Go sources in packages/core and fixtures in apps/cli.
  # So every set below is an ALLOW-TO-SKIP list (a change confined to it may skip; anything else,
  # including a directory nobody listed, runs in full), never an allow-to-run list. A new
  # cross-read added later is not seen by this job — that is the bound, stated.
  #
  #   · Go `[]`          — every changed file is a `.md`, or under a TS-only app/package no Go
  #                        source names (marketing, admin, blog, ee, and the @repo/* packages other
  #                        than format).
  #   · Go `[apps/cli]`  — the above plus apps/cli, apps/docs (the CLI tests read the docs pages)
  #                        and packages/format (the CLI tests read its conformance cases). apps/cli
  #                        is the only leg nothing else depends on: apps/runner's go.mod requires
  #                        packages/core, apps/cli's requires both, and packages/core's tests read
  #                        apps/runner sources — so any other Go-relevant change runs all three.
  #   · `ts_skip`        — every changed file is `.md`/`.mdx`. That is turbo.json's OWN declared
  #                        non-input set for `lint`, `check-types` and `test`, so a skip here is
  #                        the same claim the turbo cache already makes — not a new one. It skips
  #                        `ts-lint-types`, `ts-test`, `integration` and `addon-charts-render`;
  #                        `ts-build` still runs (narrowed), because the docs build renders `.mdx`.
  #   · `ts_filter`      — `affected` when every changed file is inside a TypeScript workspace
  #                        package (or is `.md`/`.mdx`) and no root config changed; `full`
  #                        otherwise. A change outside every package — packages/core, scripts/,
  #                        infra/, the lockfile, turbo.json, this file — runs unfiltered, because
  #                        turbo cannot attribute it to a package and the console's tests read
  #                        several of those directories directly.
  #
  # FAIL-SAFE DIRECTION. Every consumer treats an EMPTY output as "run in full", and the consumers
  # carry `!cancelled()`, so a failed detect job runs everything rather than skipping it. The
  # `CI required` aggregator separately fails when this job did not succeed.
  #
  # ── TWO LANES (2026-11-27) ─────────────────────────────────────────────────────────────────
  #
  # `lane` is `fast` exactly when `skip_unaffected` is true — an ordinary PR into dev with
  # AFFECTED_ONLY_ARMED on — and `full` on everything else: the Mergify queue's batch
  # (`mergify/merge-queue/*`), a promotion (`release/<sha>` → main), a push, a cron, a dispatch.
  # So the one kill switch above also turns the fast lane off: set AFFECTED_ONLY_ARMED to "false"
  # and every PR runs the full lane, as before this change.
  #
  # Measured 2026-11-26 (139 CI runs/day, median 45 min wall, ~105 runner-min/run): every PR ran
  # the whole suite TWICE — once on its own head, once again in the queue's batch, and only the
  # second run decides what lands. The fast lane drops, from the PR's own run, the jobs below. They
  # still run, unchanged and path-conditional exactly as before, on every full-lane run, and the
  # queue's batch run is a full-lane run whose `CI required` must be green before Mergify merges.
  #
  # THE RULE THAT DECIDES WHAT MAY MOVE: a job the fast lane drops must be a `needs:` of
  # `CI required`. Then "it did not run on the PR" can only mean "it runs, and gates, in the queue's
  # batch" — nothing reaches dev without it passing there. A non-required (observe-only) job cannot
  # meet that rule without changing what gates the merge, which is a separate decision with its own
  # process (scripts/merge-signal-health.sh's PROMOTE verdict), so those stay where their author
  # sees them, on the PR.
  #
  #   FULL LANE ONLY (each a `needs:` of `CI required`):
  #     · `build-console` — Build console images (no push). 14.3 min median, seven Docker builds; a
  #       PR author's first answer comes from `ts-build`'s `next build` smoke, which stays.
  #     · `integration` — Integration (real Postgres + RLS). 13.0 min median. The query builders'
  #       unit tests and types stay in the fast lane; the real-database pass runs in the batch.
  #     · `byo-users-postgres` (the matrix legs) — real Postgres 17/14. Its always-reporting wrapper
  #       `byo-users-postgres-required` still runs on the fast lane and passes "skipped by design".
  #     · `e2e-qa-leg` — the release gate's qa leg (~10 runner-min, a console build + Playwright).
  #       Before this change it ran on the PR and NOT in the queue; now it runs in the queue, which
  #       also closes the gap that comment recorded (two UI PRs that each pass alone and break each
  #       other now meet in the batch, not at the promotion).
  #
  #   KEPT IN THE FAST LANE, and why:
  #     · lint · types, the unit suites + coverage ratchets, the build smoke (`ts-*`/`typescript`),
  #       `go` (affected modules), `guards` (its 8–12 min self-test already path-gated), `secrets`,
  #       `docs-prose`, `capabilities-security`, `gate-ledger`, `addon-charts-render` — the PR
  #       author's first answer, and each cheap or already narrowed by the plan above.
  #     · `e2e-browser`, `e2e-elench-ai`, `byo-users-mysql`, `db-tls-verify`, `runner-image-arch`,
  #       `t1-kind-images` — heavy, but OBSERVE-ONLY (no `CI required` need). Moving them would hide
  #       their red from the author without making it block anywhere, so they keep their own
  #       path conditions (console / agent / runner / t1 paths) and run on the PR as before.
  #     · `provision-e2e` — unchanged: it already runs only on the queue's batch.
  #
  # HOW A FULL RUN IS KEPT FROM SKIPPING THE SUITE: `CI required` (a) recomputes from the event
  # itself whether this run is an ordinary dev PR and refuses `lane=fast` on anything else — so a
  # planner bug cannot turn the queue's batch into a fast run — and (b) on `lane=full` fails when a
  # full-lane-only job reports `skipped` although its own (non-lane) condition says it runs.
  detect-changes:
    name: Detect PR surface changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `pull-requests: read` — dorny/paths-filter lists a PR's files through the pulls API.
    permissions:
      contents: read
      pull-requests: read
    env:
      # ARMED 2026-11-22. (a) `.mergify.yml` on main requires `CI required` (promotion #7288).
      # (b) The live protect-dev and protect-main rulesets require it too: infra/github was applied
      # after #7286 and `check-required-checks.mjs --live` agreed, with every required context
      # observed green. (c) The arming PR's own run was the first `CI required` under both; it
      # changes this file, so it ran in full and arming could not skip anything in it. Set this
      # back to "false" if a required check is ever named again outside the aggregator: a skipped
      # job reads as not-green there.
      AFFECTED_ONLY_ARMED: "true"
    outputs:
      agent: ${{ steps.plan.outputs.agent }}
      console: ${{ steps.plan.outputs.console }}
      docs: ${{ steps.plan.outputs.docs }}
      runner: ${{ steps.plan.outputs.runner }}
      ts: ${{ steps.plan.outputs.ts }}
      go_cli: ${{ steps.plan.outputs.go_cli }}
      go_runner: ${{ steps.plan.outputs.go_runner }}
      go_core: ${{ steps.plan.outputs.go_core }}
      infra: ${{ steps.plan.outputs.infra }}
      harness: ${{ steps.plan.outputs.harness }}
      guards_selftest: ${{ steps.plan.outputs.guards_selftest }}
      console_images: ${{ steps.plan.outputs.console_images }}
      qa_leg: ${{ steps.plan.outputs.qa_leg }}
      t1_images: ${{ steps.plan.outputs.t1_images }}
      selective: ${{ steps.plan.outputs.selective }}
      skip_unaffected: ${{ steps.plan.outputs.skip_unaffected }}
      lane: ${{ steps.plan.outputs.lane }}
      ts_filter: ${{ steps.plan.outputs.ts_filter }}
      ts_skip: ${{ steps.plan.outputs.ts_skip }}
      go_matrix: ${{ steps.plan.outputs.go_matrix }}
    steps:
      # SURFACES — "did ANY changed file match". Only on a `pull_request`: every other event runs
      # everything, and the four original outputs must stay 'false' there (see the job comment).
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            # `agent` — the narrow Elench/agent surface the Elench AI E2E drives.
            agent:
              - 'apps/console/components/agent*'
              - 'apps/console/components/agent*/**'
              - 'apps/console/components/ui/message-scroller*'
              - 'apps/console/components/ui/message-scroller*/**'
              - 'apps/console/lib/ai*'
              - 'apps/console/lib/ai*/**'
              - 'apps/console/lib/stores/use-elench*'
              - 'apps/console/lib/stores/use-elench*/**'
              - 'apps/console/lib/stores/use-artifact*'
              - 'apps/console/lib/stores/use-artifact*/**'
              - 'apps/console/lib/stores/use-widget-grid*'
              - 'apps/console/lib/stores/use-widget-grid*/**'
              - 'apps/console/app/api/agent*'
              - 'apps/console/app/api/agent*/**'
              - 'apps/console/app/server/actions/agent*'
              - 'apps/console/app/server/actions/agent*/**'
              - 'apps/console/app/server/actions/artifacts*'
              - 'apps/console/app/server/actions/artifacts*/**'
              - 'apps/console/app/server/actions/mentions*'
              - 'apps/console/app/server/actions/mentions*/**'
              - 'apps/console/e2e/elench*'
              - 'apps/console/e2e/elench*/**'
            # `console` — the hero happy-path threads through nearly the whole console (auth → org →
            # connectors → canvas → evidence → clusters), so the filter is DELIBERATELY broad: any
            # console or shared-UI change can break it. The Evidence break proves narrow is a trap.
            # ⚠️ The npm SCOPE is `@repo/*` but the DIRECTORY is `packages/<name>` — there has never
            # been a `packages/@repo/`, and an arm written that way once matched nothing and let the
            # `[ ]` bracket mark rename every control's accessible name unobjected. The list is the
            # console's own @repo dependencies, by path.
            console:
              - 'apps/console/**'
              - 'packages/ui/**'
              - 'packages/brand/**'
              - 'packages/assets/**'
              - 'packages/email/**'
              - 'packages/nra/**'
              - 'packages/org-slug/**'
              - 'packages/plan-catalog/**'
              - 'packages/platform/**'
              - 'packages/privacy/**'
              - 'packages/support/**'
            # `docs` — the Vale prose lint. The whole docs app, so a .vale.ini / style / vocab change
            # re-runs it too; and demos/proofs/templates/ai/, because a new AI-template proof bundle
            # changes the cost figure the starter-templates page must quote (#5302).
            docs:
              - 'apps/docs/**'
              - 'demos/proofs/templates/ai/**'
            # `runner` — the inputs to the runner BINARY + its Docker image (the 2026-07-22
            # fleet-churn incident: an arm64 binary in the amd64 image). The Dockerfiles, the
            # runner/cli Go, the shared Go the runner compiles in (packages/core, go.work*), and this
            # workflow, so an edit to the guard job re-validates it.
            runner:
              - 'apps/runner/**'
              - 'apps/cli/**'
              - 'packages/core/**'
              - 'go.work*'
              - '.github/workflows/ci.yml'
            # `t1_images` — what decides T1's image archive (#7698): the ArgoCD chart pin and values
            # (packages/core/argocd), the renderer and loader (test/e2e), the scripts that pull and
            # archive, and this workflow. A PR touching them runs `t1-kind-images`, which builds the
            # archive and loads it into a real kind node — T1 itself runs only in the queue.
            t1_images:
              - 'packages/core/argocd/**'
              - 'test/e2e/**'
              - 'scripts/e2e/t1-kind-images.sh'
              - 'scripts/ci/docker-pull-retry.sh'
              - '.github/workflows/ci.yml'
            # `qa_leg` — what release-gate.yml's `qa` leg measures, for `e2e-qa-leg` (#7647). The
            # console's UI and server code (the leg boots `next build` + `next start` from it and
            # drives the browser through it), its e2e specs and harness, its build scripts and
            # migrations, every workspace package apps/console/package.json depends on (by
            # DIRECTORY — `@repo/x` lives at `packages/x`, see the `console` note above), the lockfile,
            # and the leg's own seams (release-gate.yml's SEAMS list). NOT apps/console/docs,
            # apps/console/tests (vitest) or the ledgers at the console root, which no leg reads.
            # `.github/workflows/ci.yml` is here so an edit to the caller job self-tests. A diff of
            # ONLY prose (`outside.not_prose == false`) never runs it — see the `plan` step.
            qa_leg:
              - 'apps/console/app/**'
              - 'apps/console/components/**'
              - 'apps/console/lib/**'
              - 'apps/console/hooks/**'
              - 'apps/console/types/**'
              - 'apps/console/emails/**'
              - 'apps/console/public/**'
              - 'apps/console/scripts/**'
              - 'apps/console/e2e/**'
              - 'apps/console/playwright.config.ts'
              - 'apps/console/next.config.ts'
              - 'apps/console/proxy.ts'
              - 'apps/console/instrumentation.ts'
              - 'apps/console/package.json'
              - 'apps/console/tsconfig*.json'
              - 'apps/console/postcss.config.mjs'
              - 'ee/**'
              - 'packages/assets/**'
              - 'packages/brand/**'
              - 'packages/cloud-catalog/**'
              - 'packages/email/**'
              - 'packages/enterprise-api/**'
              - 'packages/format/**'
              - 'packages/legal/**'
              - 'packages/nra/**'
              - 'packages/org-slug/**'
              - 'packages/plan-catalog/**'
              - 'packages/platform/**'
              - 'packages/privacy/**'
              - 'packages/support/**'
              - 'packages/ui/**'
              - 'packages/workload-identity/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'scripts/e2e-ratchet.mjs'
              - 'scripts/lib/console-routes.mjs'
              - 'scripts/ci/playwright-install.sh'
              - 'scripts/sync-public-assets.mjs'
              - '.github/workflows/release-gate.yml'
              - '.github/workflows/ci.yml'
            # Informational surfaces (job outputs, for anything that wants to key on them).
            ts:
              - 'apps/console/**'
              - 'apps/marketing/**'
              - 'apps/admin/**'
              - 'apps/docs/**'
              - 'apps/blog/**'
              - 'apps/e2e-issuer/**'
              - 'ee/**'
              - 'packages/!(core)/**'
              - 'scripts/spend-report/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'patches/**'
            go_cli:
              - 'apps/cli/**'
            go_runner:
              - 'apps/runner/**'
            go_core:
              - 'packages/core/**'
              - 'test/e2e/**'
              - 'go.work*'
            infra:
              - 'infra/**'
            harness:
              - '.claude/**'
              - '.codex/**'
              - '.agents/**'
              - '.githooks/**'
              - 'CLAUDE.md'
              - 'AGENTS.md'
            # What the `guards` job's "Guards self-test" step reads: the hooks and their libraries,
            # every workflow (guard-spend prices each one and fails on one it cannot classify), the
            # scripts the hooks call or source (env.sh, wt-lease, creds), deploy/ (runner-version,
            # prod secrets example) and release-please's config (guard-merge). Deliberately broad —
            # all of scripts/ and deploy/ — because a missed input lets a broken guard reach dev,
            # while an extra one only costs a run. That step is 8–12 minutes of the job.
            guards_selftest:
              - '.claude/**'
              - '.codex/**'
              - '.agents/**'
              - '.githooks/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'release-please-config.json'
              - 'CLAUDE.md'
              - 'AGENTS.md'
            # Root config that every TypeScript package inherits — a change here runs turbo
            # unfiltered, because turbo attributes no package to it.
            ts_root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'patches/**'
              - '.github/workflows/ci.yml'
            # The box images `build-console` proves (formerly validate-console.yml's own filter: the
            # path set deploy-console.yml's `changes` job uses for its `apps` group, plus the
            # lockfile, plus the workflow that holds the build steps so an edit to them self-tests).
            console_images:
              - 'apps/console/**'
              - 'apps/marketing/**'
              - 'apps/admin/**'
              - 'apps/docs/**'
              - 'apps/blog/**'
              - 'packages/**'
              - 'ee/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
      # CONFINEMENT — "is there a changed file OUTSIDE this set". With `predicate-quantifier: every`
      # a file matches a filter only when it matches EVERY pattern, so `'**'` plus negations reads
      # "some changed file is none of these". `false` therefore means the whole diff is confined to
      # the negated set. Its own step because the quantifier is per step, not per filter.
      - uses: dorny/paths-filter@v4
        id: outside
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            not_prose:
              - '**'
              - '!**/*.md'
              - '!**/*.mdx'
            not_go_free:
              - '**'
              - '!**/*.md'
              - '!apps/marketing/**'
              - '!apps/admin/**'
              - '!apps/blog/**'
              - '!ee/**'
              - '!packages/assets/**'
              - '!packages/brand/**'
              - '!packages/cloud-catalog/**'
              - '!packages/email/**'
              - '!packages/enterprise-api/**'
              - '!packages/eslint-config/**'
              - '!packages/legal/**'
              - '!packages/nra/**'
              - '!packages/org-slug/**'
              - '!packages/plan-catalog/**'
              - '!packages/platform/**'
              - '!packages/privacy/**'
              - '!packages/status/**'
              - '!packages/support/**'
              - '!packages/typescript-config/**'
              - '!packages/ui/**'
              - '!packages/workload-identity/**'
            not_go_cli_only:
              - '**'
              - '!**/*.md'
              - '!apps/cli/**'
              - '!apps/docs/**'
              - '!packages/format/**'
              - '!apps/marketing/**'
              - '!apps/admin/**'
              - '!apps/blog/**'
              - '!ee/**'
              - '!packages/assets/**'
              - '!packages/brand/**'
              - '!packages/cloud-catalog/**'
              - '!packages/email/**'
              - '!packages/enterprise-api/**'
              - '!packages/eslint-config/**'
              - '!packages/legal/**'
              - '!packages/nra/**'
              - '!packages/org-slug/**'
              - '!packages/plan-catalog/**'
              - '!packages/platform/**'
              - '!packages/privacy/**'
              - '!packages/status/**'
              - '!packages/support/**'
              - '!packages/typescript-config/**'
              - '!packages/ui/**'
              - '!packages/workload-identity/**'
            not_ts_scoped:
              - '**'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!apps/console/**'
              - '!apps/marketing/**'
              - '!apps/admin/**'
              - '!apps/docs/**'
              - '!apps/blog/**'
              - '!apps/cli/**'
              - '!apps/e2e-issuer/**'
              - '!ee/**'
              - '!packages/assets/**'
              - '!packages/brand/**'
              - '!packages/cloud-catalog/**'
              - '!packages/email/**'
              - '!packages/enterprise-api/**'
              - '!packages/eslint-config/**'
              - '!packages/format/**'
              - '!packages/legal/**'
              - '!packages/nra/**'
              - '!packages/org-slug/**'
              - '!packages/plan-catalog/**'
              - '!packages/platform/**'
              - '!packages/privacy/**'
              - '!packages/status/**'
              - '!packages/support/**'
              - '!packages/typescript-config/**'
              - '!packages/ui/**'
              - '!packages/workload-identity/**'
              - '!scripts/spend-report/**'
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          F_AGENT: ${{ steps.filter.outputs.agent }}
          F_CONSOLE: ${{ steps.filter.outputs.console }}
          F_DOCS: ${{ steps.filter.outputs.docs }}
          F_RUNNER: ${{ steps.filter.outputs.runner }}
          F_TS: ${{ steps.filter.outputs.ts }}
          F_GO_CLI: ${{ steps.filter.outputs.go_cli }}
          F_GO_RUNNER: ${{ steps.filter.outputs.go_runner }}
          F_GO_CORE: ${{ steps.filter.outputs.go_core }}
          F_INFRA: ${{ steps.filter.outputs.infra }}
          F_HARNESS: ${{ steps.filter.outputs.harness }}
          F_GUARDS_SELFTEST: ${{ steps.filter.outputs.guards_selftest }}
          F_TS_ROOT: ${{ steps.filter.outputs.ts_root }}
          F_CONSOLE_IMAGES: ${{ steps.filter.outputs.console_images }}
          F_QA_LEG: ${{ steps.filter.outputs.qa_leg }}
          F_T1_IMAGES: ${{ steps.filter.outputs.t1_images }}
          HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          O_NOT_PROSE: ${{ steps.outside.outputs.not_prose }}
          O_NOT_GO_FREE: ${{ steps.outside.outputs.not_go_free }}
          O_NOT_GO_CLI_ONLY: ${{ steps.outside.outputs.not_go_cli_only }}
          O_NOT_TS_SCOPED: ${{ steps.outside.outputs.not_ts_scoped }}
        run: |
          set -eu
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          # 'true' only when the filter said exactly 'true'; anything else (unset on a non-PR event) is 'false'.
          b() { if [ "${1:-}" = true ]; then echo true; else echo false; fi; }

          out agent "$(b "${F_AGENT:-}")"
          out console "$(b "${F_CONSOLE:-}")"
          out docs "$(b "${F_DOCS:-}")"
          out runner "$(b "${F_RUNNER:-}")"
          out go_cli "$(b "${F_GO_CLI:-}")"
          out go_runner "$(b "${F_GO_RUNNER:-}")"
          out go_core "$(b "${F_GO_CORE:-}")"
          out infra "$(b "${F_INFRA:-}")"
          out harness "$(b "${F_HARNESS:-}")"
          out t1_images "$(b "${F_T1_IMAGES:-}")"

          selective=false
          if [ "$EVENT_NAME" = pull_request ] \
            && [ "${HEAD_REF#mergify/merge-queue/}" = "$HEAD_REF" ] \
            && [ "$BASE_REF" != main ] && [ "$BASE_REF" != staging ]; then
            selective=true
          fi
          out selective "$selective"

          # Off an ordinary PR, every surface counts as changed.
          if [ "$EVENT_NAME" != pull_request ]; then
            out ts true
            out console_images true
          else
            out ts "$(b "${F_TS:-}")"
            out console_images "$(b "${F_CONSOLE_IMAGES:-}")"
          fi

          skip=false
          if [ "$selective" = true ] && [ "$AFFECTED_ONLY_ARMED" = true ]; then skip=true; fi
          out skip_unaffected "$skip"

          # TWO LANES (see the job comment): `fast` only where the affected-only skips are armed for
          # an ordinary dev PR; everything else — the queue's batch above all — is `full`.
          lane=full
          if [ "$skip" = true ]; then lane=fast; fi
          out lane "$lane"

          # The guards' self-tests (8–12 minutes) run unless this is an affected-only PR that touched
          # none of their inputs. The merge queue, pushes, promotions and the schedule are never
          # selective, so a guard change is always self-tested before it lands on dev.
          guards_selftest=true
          if [ "$skip" = true ] && [ "$(b "${F_GUARDS_SELFTEST:-}")" = false ]; then guards_selftest=false; fi
          out guards_selftest "$guards_selftest"

          ts_filter=full
          if [ "$selective" = true ] && [ "$(b "${F_TS_ROOT:-}")" = false ] && [ "$(b "${O_NOT_TS_SCOPED:-true}")" = false ]; then
            ts_filter=affected
          fi
          out ts_filter "$ts_filter"

          ts_skip=false
          if [ "$skip" = true ] && [ "$(b "${O_NOT_PROSE:-true}")" = false ]; then ts_skip=true; fi
          out ts_skip "$ts_skip"

          # The qa release-gate leg (#7647): a dev PR — an ordinary one OR the Mergify queue's batch
          # PR (two lanes, 2026-11-27) — whose diff hits `qa_leg` and is not prose-only. A promotion
          # into main runs all seven legs in release-gate.yml's own run, so it is excluded here. A
          # fork PR is excluded: it gets no repo secrets, so the leg's `stripe` capability guard would
          # fail on a variable its author cannot supply. This output is the leg's PATH condition only;
          # `e2e-qa-leg` adds `lane != 'fast'`, so on an ordinary PR it runs in the batch instead.
          qa_leg=false
          if [ "$EVENT_NAME" = pull_request ] && [ "$BASE_REF" != main ] && [ "$BASE_REF" != staging ] \
            && [ "$(b "${F_QA_LEG:-}")" = true ] \
            && [ "$(b "${O_NOT_PROSE:-true}")" = true ] && [ "${HEAD_FORK:-false}" != true ]; then
            qa_leg=true
          fi
          out qa_leg "$qa_leg"

          go_matrix='["apps/cli","apps/runner","packages/core"]'
          if [ "$skip" = true ]; then
            if [ "$(b "${O_NOT_GO_FREE:-true}")" = false ]; then
              go_matrix='[]'
            elif [ "$(b "${O_NOT_GO_CLI_ONLY:-true}")" = false ]; then
              go_matrix='["apps/cli"]'
            fi
          fi
          out go_matrix "$go_matrix"

  # ── THE TYPESCRIPT CHECK, SPLIT INTO THREE PARALLEL PARTS (2026-11-22) ─────────────────────────
  #
  # This was ONE job running lint+types, then the unit suites and their coverage ratchets, then the
  # production build smoke, in sequence: 24–32 minutes, and the critical path of every CI run
  # (median 56 minutes over 2026-11-15→22). The three parts share nothing but the install, so they
  # now run side by side as `ts-lint-types`, `ts-test` and `ts-build`, and the `typescript` job
  # below — which keeps the EXACT context name `TypeScript (lint · types · test · docs)` (required by
  # name until 2026-11-22, and since then one of the `needs:` of `CI required`) — needs all three
  # and fails unless every one succeeded. No context changed name.
  #
  # A SIDE EFFECT THAT IS AN IMPROVEMENT, stated so nobody "restores" the old order: in one job a
  # lint failure skipped the unit suites and the build, so the author learned about one failure per
  # push. Now each part reports its own verdict on every run.
  ts-lint-types:
    name: TypeScript — lint · types
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    # AFFECTED-ONLY (see `detect-changes`): skipped only when the job-level skips are ARMED and the
    # whole diff is `.md`/`.mdx` — turbo.json's own declared non-inputs for this task. `!cancelled()`
    # so a failed detect job runs this in full rather than skipping it.
    needs: [detect-changes]
    if: ${{ !cancelled() && github.event.schedule != '0 3 * * *' && needs.detect-changes.outputs.ts_skip != 'true' }}
    steps:
      # Depth 2: the PR's merge commit AND its first parent (the base), which is what `[HEAD^1]`
      # below diffs against. Turbo treats a checkout too shallow to answer as "everything changed".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Persist Turbo's local cache across runs. Before this, only the pnpm store was cached, so every run
      # re-ran check-types/lint/test/build for EVERY package cold. Keyed per-sha with an os restore fallback,
      # so a PR restores the previous run's cache and Turbo only re-executes the packages that actually
      # changed (it replays cached logs for the rest). This is the single biggest CI-time win.
      #
      # ONE KEY PER PART since the split: each part runs different turbo tasks, and three jobs saving
      # one key race — the first save wins and the other two parts' outputs are never cached. The
      # bare `turbo-<os>-` fallback still restores the pre-split cache on a part's first run.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-lint-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-lint-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Turbo fans these out across EVERY workspace project that defines the script
      # (console, marketing, docs, blog, @alethia/ee, @repo/{ui,brand,plan-catalog}),
      # so new apps/packages are covered automatically — no hardcoded list to drift.
      #
      # NARROWED ON AN ORDINARY PR (`ts_filter == affected`, see `detect-changes`): `...[HEAD^1]` is
      # every package the PR changed PLUS every package that depends on one, which is the whole set
      # whose types or lint can move — both tasks depend only on a package's own sources and, through
      # `^check-types`/`^lint`, its dependencies'. On a pull_request checkout HEAD is the merge commit
      # and HEAD^1 the base it was merged onto, so the diff is exactly the PR's own changes.
      # Everything else — a push, the queue build, a dispatch, a root-config change — runs unfiltered.
      - name: Type-check + lint (affected workspace projects on a PR; all of them otherwise)
        # The console's `tsc --noEmit` outgrew Node's default heap and aborted with "JavaScript heap
        # out of memory" (exit 134) on several PRs on 2026-11-24. Each task gets a 6 GiB heap and turbo
        # runs at most two at once, so two tsc/eslint processes fit the 16 GiB ubuntu-latest runner.
        env:
          TS_FILTER: ${{ needs.detect-changes.outputs.ts_filter }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          if [ "$TS_FILTER" = affected ]; then
            echo "affected-only: turbo --filter=...[HEAD^1]"
            pnpm exec turbo run check-types lint --concurrency=2 --filter='...[HEAD^1]'
          else
            echo "full run (ts_filter='${TS_FILTER}')"
            pnpm exec turbo run check-types lint --concurrency=2
          fi

  # ── THE CONSOLE'S UNIT SUITE, SHARDED ACROSS RUNNERS ───────────────────────────────────────────────
  #
  # Before this split `ts-test` ran every workspace's unit suite in one `turbo run test`, and the
  # console's (~1400 test files) was 15–16 of its 17–27 minutes (measured: `console:test` reported
  # `Duration 940.38s` in run 45869149577, with every other workspace done inside its first minute).
  # So the console now runs as TS_CONSOLE_SHARDS shards (`vitest run --coverage --shard=i/N`), each on
  # its own runner, and `ts-test` below merges their coverage and runs the ratchets as before.
  #
  # N = 4, measured rather than guessed: a shard pays ~2 minutes of fixed cost (checkout, install,
  # the ee build) before its first test, so 940 s of suite becomes ~4 min of tests + ~2 min of setup
  # per shard at N=4, ~5 + 2 at N=3, and ~2.6 + 2 at N=6 — past four the fixed cost dominates while
  # every extra shard is one more runner competing for the org's queue on every PR. Vitest assigns
  # files to shards by a sha1 of each file's root-relative path, so the partition is deterministic,
  # disjoint and complete by construction; the balance is by file COUNT, not duration.
  #
  # HOW THE SHARDS STAY ONE MEASUREMENT (see scripts/lib/ts-coverage-merge.mjs for the argument):
  #
  #   · each shard uploads its coverage-final.json with a fingerprint (the ratchet's own `currentEnv`
  #     plus which shard it is) as the artifact `console-coverage-shard-<i>-of-<N>`;
  #   · `ts-test` FAILS — it does not skip, and it does not demote — when this job did not succeed, and
  #     its merge step fails when any shard is missing, duplicated, mislabelled, corrupt or measured in
  #     an environment other than its own. N is never inferred from what arrived;
  #   · the console ratchet runs with `--merged-from-shards`, which refuses to measure anything but
  #     the verified merge (manifest + sha256), so a partial file can never be read as the whole.
  #
  # `fail-fast: false`: one shard's red would otherwise cancel the other three, and the author would
  # learn about a quarter of the failures per push — the same reason the TypeScript check was split.
  #
  # UNFILTERED, for the reasons recorded on `ts-test` below: the shards run on every PR that runs
  # `ts-test`, under the same affected-only skip (`ts_skip`: a prose-only diff), and `ts_filter` does
  # not narrow them.
  ts-test-console:
    name: TypeScript — console unit tests (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOT ON THE UI-AUDIT NIGHTLY, and AFFECTED-ONLY — the identical conjuncts to `ts-test`, which
    # needs this job: a mismatch would either run shards nobody merges or skip shards `ts-test` waits on.
    needs: [detect-changes]
    if: ${{ !cancelled() && github.event.schedule != '0 3 * * *' && needs.detect-changes.outputs.ts_skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Must list 1..TS_CONSOLE_SHARDS exactly. The first step below fails the shard when it does
        # not, so the matrix and the merge cannot drift apart silently.
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      MATRIX_SIZE: ${{ strategy.job-total }}
    steps:
      - name: The matrix and TS_CONSOLE_SHARDS agree
        run: |
          set -euo pipefail
          if [ "$MATRIX_SIZE" != "$TS_CONSOLE_SHARDS" ] || [ "$SHARD" -lt 1 ] || [ "$SHARD" -gt "$TS_CONSOLE_SHARDS" ]; then
            echo "::error::shard ${SHARD} of a ${MATRIX_SIZE}-leg matrix, but TS_CONSOLE_SHARDS=${TS_CONSOLE_SHARDS} — the matrix must list exactly 1..TS_CONSOLE_SHARDS, or the merge in ts-test expects shards that never ran"
            exit 1
          fi
          echo "shard ${SHARD}/${TS_CONSOLE_SHARDS}"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # ONE KEY PER SHARD, for the reason the three TypeScript parts each have one: jobs saving one key
      # race, and only the first save survives. turbo hashes the pass-through `--shard=i/N` into
      # `console#test`, so a shard's cache entry replays only that shard's coverage/, never another's.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-console-${{ matrix.shard }}-of-${{ strategy.job-total }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-console-${{ matrix.shard }}-of-${{ strategy.job-total }}-
            turbo-${{ runner.os }}-test-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # EXPLICIT, though `console#test` reaches `@alethia/ee#build` through `^build` anyway: turbo
      # restores a cache hit's declared `outputs`, and the root `build.outputs` names `.next/**` only —
      # so on an `@alethia/ee#build` cache HIT, nothing would put ee/dist back. The floors record
      # `ee_dist: true`, and this shard's fingerprint must say the same thing as the merging job's
      # (which builds it the same way), or the merge refuses the shard. esbuild; well under a second.
      - name: Build @alethia/ee
        run: pnpm -F @alethia/ee build
      # The same `turbo run test` the console has always run — same task, same `^build` graph, same
      # strict env, same cache semantics — with `--shard` passed through to vitest. turbo passes
      # pass-through arguments to the ENTRY-POINT task only (`console#test`), not to its `^build`
      # dependencies; checked against turbo 2 directly, since a `--shard` reaching esbuild would fail.
      - name: Console unit tests — this shard
        run: pnpm exec turbo run test --filter=console -- "--shard=${SHARD}/${TS_CONSOLE_SHARDS}"
      # One directory, one upload, `if-no-files-found: error` — see scripts/ci/check-upload-aggregate.mjs
      # for why a second path under one upload would weaken that `error`. The fingerprint is written
      # AFTER the suite, so it describes the tree the suite actually ran in (ee/dist and all).
      - name: Stage this shard's coverage and fingerprint
        run: |
          set -euo pipefail
          mkdir -p console-coverage-shard
          cp apps/console/coverage/coverage-final.json console-coverage-shard/coverage-final.json
          node scripts/ts-coverage-shards.mjs fingerprint --project apps/console \
            --shard "${SHARD}/${TS_CONSOLE_SHARDS}" > console-coverage-shard/fingerprint.json
          cat console-coverage-shard/fingerprint.json
      # `overwrite: true` so "Re-run failed jobs" can re-upload a re-run shard under the same name in the
      # same run; the merge still checks every shard's fingerprint and coverage, so nothing stale passes.
      - uses: actions/upload-artifact@v7
        with:
          name: console-coverage-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: console-coverage-shard/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  ts-test:
    name: TypeScript — unit tests · coverage ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    # AFFECTED-ONLY (see `detect-changes`): skipped only when the job-level skips are ARMED and the
    # whole diff is `.md`/`.mdx` — turbo.json's own declared non-inputs for this task. `!cancelled()`
    # so a failed detect job runs this in full rather than skipping it.
    #
    # `!cancelled()` ALSO KEEPS THIS JOB RUNNING WHEN A CONSOLE SHARD FAILED — deliberately. With the
    # implicit `success()` a red shard would SKIP this job, and a skipped `ts-test` reads to the
    # `typescript` aggregator as "planned away" only when `ts_skip` says so; otherwise it is red there
    # too, but with the failure one hop further from where the author looks. Running, this job fails
    # its own `Every console shard succeeded` step with the shard named, and still reports the other
    # projects' tests and ratchets.
    needs: [detect-changes, ts-test-console]
    if: ${{ !cancelled() && github.event.schedule != '0 3 * * *' && needs.detect-changes.outputs.ts_skip != 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Persist Turbo's local cache across runs. Before this, only the pnpm store was cached, so every run
      # re-ran check-types/lint/test/build for EVERY package cold. Keyed per-sha with an os restore fallback,
      # so a PR restores the previous run's cache and Turbo only re-executes the packages that actually
      # changed (it replays cached logs for the rest). This is the single biggest CI-time win.
      #
      # ONE KEY PER PART since the split: each part runs different turbo tasks, and three jobs saving
      # one key race — the first save wins and the other two parts' outputs are never cached. The
      # bare `turbo-<os>-` fallback still restores the pre-split cache on a part's first run.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-test-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # EXPLICIT, and load-bearing for every ratchet below. The floors record `ee_dist: true`, and the
      # ratchet reads it from THIS job's tree. It used to arrive implicitly: `turbo run test` reached
      # `@alethia/ee#build` through apps/console's optionalDependency on @alethia/ee. With the console
      # excluded from this job's turbo run (its shards run in `ts-test-console`), nothing here depends
      # on @alethia/ee any more — so without this step ee/dist would be absent, F7 would DEMOTE every
      # project's regressions to warnings, and the merge would refuse every shard (their fingerprints
      # say `ee_dist: true`). scripts/check-floors-reproducible.mjs reads this step by its name.
      - name: Build @alethia/ee
        run: pnpm -F @alethia/ee build
      # UNFILTERED EVEN ON AN ORDINARY PR, unlike `ts-lint-types` and `ts-build` (2026-11-22). Two
      # reasons, either sufficient: (1) the console's unit tests READ files outside every package
      # graph edge turbo can see — Go sources in packages/core, fixtures in apps/cli, scripts/ — so
      # `...[HEAD^1]` would not re-run a test whose fixture changed in a package it does not depend
      # on; and (2) the ratchets below compare against floors recorded with ee/dist present (the
      # step above). The turbo cache still skips the packages whose inputs are unchanged.
      #
      # `--filter='!console'` is the ONE exclusion, and it drops nothing: the console's suite runs in
      # full across the `ts-test-console` shards. Every other workspace's `test` (and its `^build`
      # graph) runs here exactly as before.
      - name: Unit tests (every workspace except the console, whose shards ran in ts-test-console)
        id: unit
        run: pnpm exec turbo run test --filter='!console'
      # FAIL, NEVER SKIP OR DEMOTE. `needs.ts-test-console.result` is the matrix's aggregate: `success`
      # only when every shard succeeded. A red, cancelled or skipped shard means some console test
      # files did not pass (or did not run), and there is no artefact here that could be measured as
      # the console's coverage.
      - name: Every console shard succeeded
        id: shards
        if: ${{ !cancelled() }}
        env:
          SHARDS_RESULT: ${{ needs.ts-test-console.result }}
        run: |
          if [ "$SHARDS_RESULT" != success ]; then
            echo "::error::ts-test-console concluded '${SHARDS_RESULT}' — at least one of the ${TS_CONSOLE_SHARDS} console unit-test shards failed or did not run. Open that shard for the failure; the console's coverage is not measured from an incomplete suite."
            exit 1
          fi
          echo "all ${TS_CONSOLE_SHARDS} console shards succeeded"
      # Each artifact extracts into `console-shards/<artifact name>/` (a `pattern`, not a `name`). Not
      # trusted to have found them all: the merge below counts them against TS_CONSOLE_SHARDS itself,
      # and runs even when this step fails, so a missing shard is reported by NAME rather than as a
      # download error.
      - name: Download the console shards' coverage
        if: ${{ !cancelled() && steps.shards.outcome == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: console-coverage-shard-*
          path: console-shards
          merge-multiple: false
      # The istanbul merge semantics, proven on the installed tree before they are trusted with the
      # real artefacts. Hermetic (fixtures only); the refusal paths are also driven by
      # `ts-coverage.mjs --self-test` in the `guards` job, which has no installed tree.
      - name: Shard-merge self-test (istanbul semantics, end to end through the CLI)
        id: merge-selftest
        if: ${{ !cancelled() && steps.shards.outcome == 'success' }}
        run: node scripts/ts-coverage-shards.mjs --self-test
      - name: Merge the console shards' coverage (fails on a missing, extra, corrupt or foreign shard)
        id: merge
        if: ${{ !cancelled() && steps.merge-selftest.outcome == 'success' }}
        # Headroom, not a measured need: the merge streams shard by shard, but one console artefact
        # parsed is several times its file size, and an OOM here would read as a broken pipeline.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/ts-coverage-shards.mjs merge --project apps/console --from console-shards --shards "$TS_CONSOLE_SHARDS"
      # Coverage is merged into the self-hosted README badge by the `coverage-badge` job
      # (push-to-main); no third-party service. See scripts/coverage-badge.mjs + TESTING.md.
      #
      # THE RATCHETS LIVE IN THIS JOB BECAUSE THEY READ ITS ARTEFACTS — the console's as merged above,
      # every other project's as written by `Unit tests`. They used to sit after the
      # build smoke in a single job, so that a true ratchet failure could not skip the build — the
      # only check that catches a module imported from both a server and a client component, which
      # type-checks, lints and unit-tests clean and then 500s the page at runtime. The split gives
      # that for free: `ts-build` is its own job, and nothing here can skip it.
      #
      # Per-directory statement-coverage RATCHET: coverage may rise, never fall. Reads the
      # coverage-final.json each project's vitest run wrote above — or that turbo REPLAYED from
      # cache, which is equally valid, because a cache hit means byte-identical inputs and the
      # `test` task now declares ALETHIA_EDITION in its cache key. It does NOT re-run the suite.
      #
      # No `working-directory`: the script resolves the repo root itself, so every project is
      # invoked identically and the fix command it prints needs no cd puzzle.
      #
      # No `if: always()`: when `Unit tests` fails there is no usable coverage artefact, and
      # reporting a coverage collapse on top of a test failure misattributes the cause.
      #
      # ONE STEP PER PROJECT, deliberately — a `--all` wildcard is how a project silently drops
      # out of the gate. Adding a project is a three-line edit here, and `--self-test` FAILS
      # until that edit is made: it asserts this file carries a step for every vitest project
      # that declares a coverage block.
      #
      # Every false-failure path is fail-open and enumerated F1..F10 in the script header. The
      # floors carry a fingerprint of the environment that recorded them — including whether
      # ee/dist existed, which is TRUE here (the `Build @alethia/ee` step above).
      #
      # A HISTORY WORTH KEEPING. This comment once claimed that apps/console did NOT reach @alethia/ee,
      # so `test.dependsOn: ["^build"]` never built ee/dist. That was wrong — `@alethia/ee` is an
      # **optionalDependency** of apps/console, and turbo's `^build` traverses it — and the measured
      # proof was the determinism probe finding ee/dist ABSENT at job start and recording
      # `"ee_dist": true` after its `turbo run test`. Since the shard split this job no longer runs the
      # console's turbo task at all, which is exactly why the dist is now built by name above rather
      # than left to a dependency edge: an implicit producer of a fingerprinted axis is how a ratchet
      # gets disarmed by a refactor that never mentions it.
      - name: Coverage ratchet — apps/console
        # Runs only on the VERIFIED MERGE of every shard. `--merged-from-shards` re-checks the merge's
        # manifest (project, N, sha256 of the bytes) before measuring and EXITS 1 — never fails open —
        # on anything else, so a partial artefact cannot be read as the whole. See ts-coverage.mjs's
        # SHARDED INPUT header.
        if: ${{ !cancelled() && steps.merge.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project apps/console --merged-from-shards "$TS_CONSOLE_SHARDS"
      - name: Coverage ratchet — packages/ui
        # Runs whenever the coverage ARTEFACT is trustworthy, which is the real precondition —
        # rather than inheriting the implicit success() that would let one project's ratchet hide
        # the other two's verdicts. NOT `always()`: with `Unit tests` failed there is no usable
        # artefact, and reporting a coverage collapse on top of a test failure misattributes the
        # cause. `!cancelled()` keeps it off a cancelled run.
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project packages/ui
      - name: Coverage ratchet — packages/plan-catalog
        # Runs whenever the coverage ARTEFACT is trustworthy, which is the real precondition —
        # rather than inheriting the implicit success() that would let one project's ratchet hide
        # the other two's verdicts. NOT `always()`: with `Unit tests` failed there is no usable
        # artefact, and reporting a coverage collapse on top of a test failure misattributes the
        # cause. `!cancelled()` keeps it off a cancelled run.
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project packages/plan-catalog
      # apps/marketing and ee join the gate here. Both emitted NO coverage at all until now — they
      # ran `vitest run` with no `--coverage`, so there was no artefact and nothing for the ratchet
      # to hold. `ee/` is the LICENSED tier: the code customers pay for was the least measured
      # surface in the repository.
      #
      # Both land INERT: no floors file yet, so F1 fires and each exits 0. Arming follows once the
      # determinism probe has recorded numbers from CI. Same two-step bootstrap the other three
      # projects used, for the same reason — floors recorded on a laptop are not comparable to CI.
      #
      # These steps are not optional bookkeeping: `--self-test` FAILS while a project declares a
      # coverage block and has no step here, which is exactly how this change was caught mid-edit
      # ("no coverage-emitting vitest project lacks a ratchet step in ci.yml — apps/marketing, ee").
      - name: Coverage ratchet — apps/marketing
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project apps/marketing
      - name: Coverage ratchet — ee
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project ee
      # @repo/format joins ARMED on its first commit, at 61/61 statements. A pure-function
      # package — no I/O, no clock except one injected baseline, no React — so 100% is the
      # honest floor rather than an aspiration, and anything below it is a real gap. Floors
      # recorded with ee/dist present, which is what `turbo run test` produces here.
      - name: Coverage ratchet — packages/format
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project packages/format
      # @repo/org-slug (#5509) joins INERT: no floors file yet, so F1 fires and the step exits 0.
      # Floors recorded on a laptop are not comparable to CI's, so arming follows from a CI run —
      # the same two-step bootstrap apps/marketing and ee used. Locally it measures 11/11.
      - name: Coverage ratchet — packages/org-slug
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project packages/org-slug
      # @repo/cloud-catalog joins INERT for the same reason: no floors file yet, so F1 fires and the
      # step exits 0. Arming follows from a CI run.
      - name: Coverage ratchet — packages/cloud-catalog
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --project packages/cloud-catalog

  ts-build:
    name: TypeScript — app build smoke
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    # NEVER skipped by AFFECTED-ONLY — the docs build renders `.mdx`, so a prose-only diff can still
    # break it. Narrowed instead (see the build step). `!cancelled()` keeps a failed detect job from
    # skipping it.
    needs: [detect-changes]
    if: ${{ !cancelled() && github.event.schedule != '0 3 * * *' }}
    steps:
      # Depth 2 for `[HEAD^1]` — see `ts-lint-types`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Persist Turbo's local cache across runs. Before this, only the pnpm store was cached, so every run
      # re-ran check-types/lint/test/build for EVERY package cold. Keyed per-sha with an os restore fallback,
      # so a PR restores the previous run's cache and Turbo only re-executes the packages that actually
      # changed (it replays cached logs for the rest). This is the single biggest CI-time win.
      #
      # ONE KEY PER PART since the split: each part runs different turbo tasks, and three jobs saving
      # one key race — the first save wins and the other two parts' outputs are never cached. The
      # bare `turbo-<os>-` fallback still restores the pre-split cache on a part's first run.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Build smoke for the split-affected apps — catches transpilePackages /
      # standalone breakage on PRs. Build-only placeholder env so the console's
      # strict zod config modules pass validation (mirrors apps/console/Dockerfile;
      # nothing is contacted — postgres-js + the S3 client connect lazily).
      #
      # NARROWED ON AN ORDINARY PR: `<app>...[HEAD^1]` selects the app only when it OR one of its
      # dependencies changed in this PR (turbo's documented meaning of a trailing `...` with a git
      # range). A build depends only on what it imports, so an app none of whose inputs moved is
      # not rebuilt. Unfiltered (all three) on every other event and on a root-config change.
      - name: App build smoke (console · marketing · docs — those a PR affects; all three otherwise)
        run: |
          set -euo pipefail
          if [ "$TS_FILTER" = affected ]; then
            echo "affected-only: each app built only if it or a dependency changed since HEAD^1"
            pnpm exec turbo run build --filter='console...[HEAD^1]' --filter='marketing...[HEAD^1]' --filter='docs...[HEAD^1]'
          else
            echo "full run (ts_filter='${TS_FILTER}')"
            pnpm exec turbo run build --filter=console --filter=marketing --filter=docs
          fi
        env:
          TS_FILTER: ${{ needs.detect-changes.outputs.ts_filter }}
          BETTER_AUTH_SECRET: build-time-placeholder
          BETTER_AUTH_URL: http://localhost:3000
          ALETHIA_DATABASE_URL: postgres://build:build@localhost:5432/build
          ALETHIA_APP_DATABASE_URL: postgres://build:build@localhost:5432/build
          ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
          ALETHIA_STORAGE_ACCESS_KEY_ID: build
          ALETHIA_STORAGE_SECRET_ACCESS_KEY: build

  # THE TYPESCRIPT VERDICT, as one of the `needs:` of `CI required` (the context the rulesets and the
  # queue require). Its `name:` was itself required until 2026-11-22, and a LIVE ruleset may still
  # name it until infra/github is applied — so it must not change before then: renaming it would
  # leave that ruleset waiting on a check that no longer reports. It does no work of its own — it is
  # green only when all three parts are.
  #
  # `!cancelled()` and not the implicit `success()`: with `success()` a failed part would SKIP this
  # job, and a skipped required check reads as neither red nor green — the queue would sit on it.
  # This way a failed part turns this context RED, which is the verdict the old single job gave.
  # The 03:00 conjunct mirrors the parts, which do not run on the UI-audit nightly either.
  typescript:
    name: TypeScript (lint · types · test · docs)
    needs: [detect-changes, ts-lint-types, ts-test, ts-build]
    if: ${{ !cancelled() && github.event.schedule != '0 3 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every TypeScript part passed
        env:
          LINT_TYPES: ${{ needs.ts-lint-types.result }}
          UNIT_TESTS: ${{ needs.ts-test.result }}
          BUILD_SMOKE: ${{ needs.ts-build.result }}
          # 'true' only when detect-changes planned the two skippable parts away (armed AFFECTED-ONLY
          # and a prose-only diff). Then — and only then — `skipped` is their expected verdict.
          # `ts-build` is never planned away, so it must always succeed.
          TS_SKIP: ${{ needs.detect-changes.outputs.ts_skip }}
        run: |
          set -u
          bad=0
          for part in "lint · types=$LINT_TYPES=skippable" "unit tests · coverage ratchets=$UNIT_TESTS=skippable" "app build smoke=$BUILD_SMOKE=required"; do
            label=${part%%=*}
            rest=${part#*=}
            result=${rest%%=*}
            kind=${rest#*=}
            if [ "$result" = "success" ]; then
              echo "ok: TypeScript — $label"
            elif [ "$result" = "skipped" ] && [ "$kind" = skippable ] && [ "${TS_SKIP:-}" = true ]; then
              echo "ok: TypeScript — $label skipped by design (prose-only diff, affected-only armed)"
            else
              echo "::error::TypeScript — $label concluded '$result'. Open that job for the failure; this one only aggregates."
              bad=1
            fi
          done
          exit "$bad"

  # ── THE RELEASE-GATE LEDGER'S BAR: ZERO `failed`, AND EVERY `{fixme}` CITES AN OPEN ISSUE (#5417) ──
  #
  # MOVED HERE FROM release-gate.yml ON 2026-11-22, with its name unchanged. That workflow no longer
  # runs on an ordinary feature PR into dev (see its header), and this job's first question must
  # still be asked on every PR — so it rides in the workflow that does run on every PR.
  #
  # The gate's legs measure a run against apps/console/e2e/gate-baseline.json; this job measures the
  # LEDGER itself, so it needs no browser and takes seconds. Two questions, each asked by a different
  # step:
  #
  #   · ZERO `failed` ENTRIES. The ratchet cannot ask this. A test the ledger records as `failed`
  #     that still fails is "no regression" to `scripts/e2e-ratchet.mjs`, and a PR that edits a spec
  #     may re-record that spec's slice (check-gate-baseline-slice-ownership.mjs rule R1) — so a new
  #     `failed` entry, or a `passed` one turned `failed`, passed every other guard. Asked on EVERY
  #     PR, drafts included (ci.yml has no `ready_for_review` trigger, so a draft filter would leave
  #     a PR opened as a draft unasked until its next push): it reads only the tree, so it cannot red
  #     a PR for a change made elsewhere.
  #   · EVERY `{fixme}` CITES AN OPEN ISSUE — scripts/check-gate-fixme-issues.mjs, the instrument the
  #     daily gate-fixme-currency.yml will also run once it reaches main (a schedule runs from the
  #     default branch, so as of 2026-10-04 it never has); exit 1 (a closed issue) and exit 2 (an unanswered
  #     question) are both red. It reads ISSUE STATE, which changes outside the diff, so on a dev PR
  #     it is asked only when the PR changes the ledger or the code that decides what a fixme is.
  #     A fixme can only be added by changing the ledger, so that PR is asked. A promotion PR and a
  #     dispatch are asked unconditionally: those ship the ledger as it stands.
  #
  # NOT A REQUIRED CHECK: no ruleset and nothing in `.mergify.yml` names this job's context (unlike
  # the seven release-gate legs, which protect-main requires). Its red is visible on the PR; nothing
  # enforces it. Not on a push or a cron: those carry no PR diff, and a push to main already passed
  # this on the PR that landed it.
  gate-ledger:
    name: Gate ledger — zero failed, every fixme cites an open issue
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `issues: read` is what `gh issue view --json state` needs; nothing else here calls the API.
    permissions:
      contents: read
      issues: read
    steps:
      # Depth 2: on a `pull_request` HEAD is the merge commit, and its first parent is the base tip,
      # so `HEAD^1..HEAD` is exactly what this PR changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # `census()` is the ratchet's own counter, imported rather than re-implemented, and it THROWS on
      # an entry that is none of passed|failed|{fixme}|{skip} — an uncountable entry is red, not zero.
      - name: Zero `failed` entries in gate-baseline.json
        run: |
          node --input-type=module - <<'EOF'
          import fs from "node:fs";
          import { census, DEFAULT_BASELINE } from "./scripts/e2e-ratchet.mjs";
          const doc = JSON.parse(fs.readFileSync(DEFAULT_BASELINE, "utf8"));
          const c = census(doc);
          if (c.tests === 0) {
            console.log(`::error file=${DEFAULT_BASELINE}::the ledger records no tests at all — there is nothing to call zero-failed`);
            process.exit(1);
          }
          if (c.failed === 0) {
            console.log(`${DEFAULT_BASELINE}: ${c.tests} tests, 0 failed (${c.fixme} fixme, ${c.dataSkip} data-skip).`);
            process.exit(0);
          }
          for (const [project, specs] of Object.entries(doc.projects)) {
            for (const [spec, tests] of Object.entries(specs)) {
              for (const [title, outcome] of Object.entries(tests)) {
                if (outcome === "failed") console.log(`::error file=${DEFAULT_BASELINE}::${project} · ${spec} · "${title}" is recorded failed`);
              }
            }
          }
          console.log(`${c.failed} failed entr${c.failed === 1 ? "y" : "ies"} in ${DEFAULT_BASELINE}. The bar is zero (TESTING.md): fix the test, or mark it test.fixme(true, "BUG: <what> #<open issue>") and re-record its slice.`);
          process.exit(1);
          EOF
      - name: Self-test the fixme currency check
        run: node scripts/check-gate-fixme-issues.mjs --self-test
      # Fails CLOSED: a `git diff` that cannot answer (exit 2+) asks the question rather than skip it.
      - id: scope
        name: Does this run ask GitHub about the fixmes?
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" = "main" ] || [ "$BASE_REF" = "staging" ]; then
            echo "asked: a ${EVENT} into '${BASE_REF:-n/a}' ships the ledger as it stands"
            echo "ask=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The step runs under `bash -e`, and `set -uo pipefail` does not clear `-e`: a bare
          # `git diff --quiet` exiting 1 ("this PR changes the ledger") would end the step red here,
          # before the `case` reads it. `|| rc=$?` captures the code without tripping `-e`.
          rc=0
          git diff --quiet HEAD^1 HEAD -- apps/console/e2e/gate-baseline.json scripts/check-gate-fixme-issues.mjs scripts/e2e-ratchet.mjs || rc=$?
          case "$rc" in
            0)
              echo "not asked: this dev PR changes neither the ledger nor the code that reads its fixmes; every promotion PR asks (the daily gate-fixme-currency.yml runs only once it reaches main)"
              echo "### Fixme currency: not asked on this PR — it does not change the ledger. Every promotion PR asks; the daily cron runs only once gate-fixme-currency.yml reaches main." >> "$GITHUB_STEP_SUMMARY"
              echo "ask=no" >> "$GITHUB_OUTPUT" ;;
            1)
              echo "asked: this PR changes the ledger or the code that reads its fixmes"
              echo "ask=yes" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::warning::git diff exited ${rc} — asking anyway"
              echo "ask=yes" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Every {fixme} in gate-baseline.json cites an OPEN issue
        if: ${{ steps.scope.outputs.ask == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-gate-fixme-issues.mjs

  integration:
    name: Integration (real Postgres + RLS)
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    # AFFECTED-ONLY: skipped only when armed and the whole diff is `.md`/`.mdx` (see `detect-changes`).
    # FULL LANE ONLY (two lanes, see `detect-changes`): skipped on an ordinary PR's fast lane, run on
    # the queue's batch, where `CI required` fails if it skipped. `CI required` restates the
    # non-lane half of this condition (not the 03:00 cron); change one and you must change the other.
    needs: [detect-changes]
    if: ${{ !cancelled() && github.event.schedule != '0 3 * * *' && needs.detect-changes.outputs.ts_skip != 'true' && needs.detect-changes.outputs.lane != 'fast' }}
    # A throwaway Postgres mirroring the dev stack (compose uses postgres:17-alpine with the
    # same superuser/db). db:migrate then creates the least-priv `alethia_app` role + RLS, so
    # the suite exercises the real SQL query builders and the multi-tenant isolation boundary.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Point at the CI service (the suite's setup.ts defaults to :5433 — these win).
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      # A DISTINCT app-role URL so the RLS isolation assertion actually runs (not skipped).
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      # OpenFGA (started as a step below — service containers can't override the image command, and
      # OpenFGA needs `run`). Makes the community↔enterprise PDP-parity suite actually execute
      # per-commit; REQUIRE=1 turns an OpenFGA-absent skip into a hard failure so parity can't
      # silently go dark (SOC2 CC6.1).
      OPENFGA_TEST_API_URL: http://localhost:8082
      ALETHIA_PDP_PARITY_REQUIRE: "1"
      # The same rule one level up, for the tier itself (#2669). 55 files gate on `describeIfDb`; if
      # the probe in tests/integration/db.ts cannot reach Postgres they ALL no-op and this REQUIRED
      # check goes green having run no RLS assertion at all. Until now the only thing stopping that
      # was the ordering of the steps below — `Migrate the test database` reds the job first — which
      # is an accident of sequence, not a check, and it would vanish the moment those steps were made
      # independent. This makes the requirement explicit and order-free.
      ALETHIA_INTEGRATION_REQUIRE_DB: "1"
      # THE EDITION IS A DECISION HERE, NOT `auto` (#6113). The job builds ee/dist below, and with it
      # present `auto` would resolve to enterprise anyway — but `auto` cannot tell "enterprise" from
      # "the module failed to resolve, so community", and says so itself (`lib/enterprise.ts`).
      # `enterprise` makes a broken ee load FAIL the files that depend on it instead.
      # Measured before choosing, on a fresh database (local Postgres): with ee/dist present under
      # `auto` all 107 files pass; under explicit `enterprise` every file passes except two that
      # also fail with ee ABSENT on the same laptop — cli-paging's at-scale cleanup hook timing
      # out, and reconcile-b2c's database-wide GC then counting the rows it left. No file assumed
      # community. This job's own run is the CI confirmation.
      # `rpc-tenancy.community.test.ts` pins `community` for itself and restores the value after.
      # The community edition gets its own full pass — see the step after the enterprise one.
      ALETHIA_EDITION: enterprise
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # In-memory OpenFGA for the PDP-parity test (it provisions its own store/model/tuples and
      # deletes them after — no datastore migration needed). Started via docker run so we can pass
      # the `run` command; HTTP 8080 → host 8082 (what OPENFGA_TEST_API_URL points at).
      - name: Start OpenFGA (in-memory) for PDP parity
        run: |
          docker run -d --name openfga -p 8082:8080 \
            -e OPENFGA_DATASTORE_ENGINE=memory openfga/openfga:v1.8.4 run
          for i in $(seq 1 40); do
            curl -sf http://localhost:8082/healthz && { echo "openfga up"; break; }
            [ "$i" = "40" ] && { echo "::error::OpenFGA did not become healthy"; docker logs openfga; exit 1; }
            sleep 1
          done
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # Build @alethia/ee so the ENTERPRISE edition is loadable (#6113). Its dist is gitignored, and
      # `test:integration` calls vitest directly — no turbo `^build` — so without this step the
      # enterprise module never exists here, and the read router's multi-tenant tenancy proof
      # (`tests/integration/rpc-tenancy.enterprise.test.ts`, ALETHIA_EDITION=enterprise) has nothing
      # to load. That file asserts the edition registered and FAILS rather than skips, so the guard
      # below only names the cause earlier; it is the same guard the hero job carries.
      #
      # The edition of every OTHER file is `ALETHIA_EDITION` in this job's env (`enterprise`, above).
      - name: Build @alethia/ee (the enterprise tenancy proof loads it)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the enterprise tenancy proof cannot run
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — rpc-tenancy.enterprise.test.ts cannot load the"
            echo "::error::enterprise edition, so the read router's multi-tenant answer is unproven."
            exit 1
          }
      - name: Integration tests (real SQL query builders + RLS isolation + PDP parity)
        run: pnpm -C apps/console run test:integration
      # THE COMMUNITY (AGPL) EDITION KEEPS ITS OWN PASS (#6113 review). Before ee/dist was built here,
      # 27 files ran their community branch — `auto` with no ee found — and building ee/dist moved
      # every one of them to enterprise. "All pass in enterprise" does not mean "none lost the
      # community path it covered", so the whole suite runs again with the edition pinned to
      # `community`. A second STEP, not a matrix: a matrix renames this job, and its name is a
      # required check. Cost: one more suite run, ~200s on this job (measured on #6169).
      #
      # `rpc-tenancy.enterprise.test.ts` is EXCLUDED here by name, not skipped: it pins `enterprise`
      # for itself and has already run in the step above; it is not a community test, and it fails
      # rather than skip when its edition cannot load. `rpc-tenancy.community.test.ts` runs in both
      # passes (it pins `community` itself).
      #
      # Explicit `community` is the CONFIGURED single-tenant edition, not the `auto`/not-installed
      # state the 27 files ran under on dev; the two differ in one place — `currentActor()` refuses a
      # personal-scope collapse when the edition is unconfigured (#6149). The configured edition is
      # the one an AGPL install is told to run, so it is the one measured.
      #
      # A FRESH DATABASE, not the one the enterprise pass just used. Some suites assert on
      # database-wide state — reconcile-b2c's `gc_fleet_actions` counts every old row in the table —
      # so a second pass over the first pass's leftovers fails for a reason that is not the
      # edition. Measured on #6169: the shared-database version failed exactly that test, and the
      # same pass on a fresh database (locally) was green. The app role is cluster-wide, so the
      # migration below grants it on the new database exactly as on the first.
      #
      # No coverage fingerprint moves: this job records no coverage (vitest.integration.config.ts).
      - name: Create and migrate a fresh database for the community pass
        env:
          ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia_community
        run: |
          psql postgres://alethia:alethia-dev-secret@localhost:5432/alethia -c 'CREATE DATABASE alethia_community'
          pnpm -C apps/console run db:migrate
      - name: Integration tests — community edition (the AGPL path)
        env:
          ALETHIA_EDITION: community
          ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia_community
          ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia_community
        run: pnpm -C apps/console run test:integration --exclude tests/integration/rpc-tenancy.enterprise.test.ts

  e2e-browser:
    name: E2E (browser · Playwright hero path)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    # Heavy (console build + Playwright), so it stays OFF most PRs to cut Actions minutes — but it
    # now RUNS on any PR that touches the console surface (detect-changes.console), because that is
    # the only pre-merge signal the hero path has. There is NO nightly hero run (e2e-nightly is
    # maintainer-gated real-cloud provisioning; e2e-ai-nightly drives the Elench journeys), and the
    # merge queue is off — so before this, a console change could break the sellable flow and only a
    # post-merge push would notice. That is exactly how the "Org evidence" assertion rotted for weeks.
    # Still runs on the merge queue, pushes, and manual dispatch as before.
    # NOT on a promotion PR (into main or staging): release-gate.yml boots the same console and
    # drives this same project there, as one of its legs; running it twice on one merge ref buys
    # nothing but a runner slot. Dev PRs, pushes and dispatches are unchanged.
    if: >-
      (github.event_name == 'merge_group' || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || needs.detect-changes.outputs.console == 'true')
      && !(github.event_name == 'pull_request' && contains(fromJSON('["main","staging"]'), github.base_ref))
    # Own parallel job, OFF the fast path: builds + boots the real console against a real Postgres
    # and drives the sellable happy-path in a headless browser (sign-in → org → connect-a-cloud
    # surface → design → Deploy/pending-changes → evidence/clusters). Fully hermetic: email-OTP with
    # the code scraped from the console log — no SES, no OAuth, no cloud creds. OpenFGA is left UNSET
    # so the community PostgresRbacPDP is the authz engine (no extra service). Same postgres:17 +
    # db:migrate as the Integration job above.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Real Postgres service (superuser + least-priv app role created by db:migrate, for RLS).
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      # Auth: a non-secret placeholder + same-origin base URL. Email-OTP only (no OAuth, no SES) →
      # the OTP is logged, which is the hermetic seam the spec reads.
      BETTER_AUTH_SECRET: e2e-browser-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # `next start` is production mode, but this hermetic job has no trusted ingress proxy.
      ALETHIA_AUTH_RATE_LIMIT: "0"
      # Storage placeholders (the S3 client connects lazily; the hero path uploads nothing).
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      # The Playwright webServer boots `next start` and tees stdout here; the OTP helper reads it.
      DEV_CONSOLE_LOG: /tmp/alethia-e2e-console.log
    steps:
      # `id:` so the upload at the bottom can ask whether there is a workspace — the `services:`
      # block above starts before this step, and its failure skips this one, not that one (#4084).
      - id: checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # Build @alethia/ee FIRST. Its dist is gitignored and it has no prepare/postinstall
      # hook, and `pnpm -C apps/console run build` calls the console's own script — bypassing turbo,
      # so `build.dependsOn: ["^build"]` never fires. Without this, ee/dist/index.js does
      # not exist, getEnterprise()'s tolerant require throws, and lib/auth/scope.ts falls
      # back to `{ userId, orgId: userId }`.
      #
      # That fallback made this whole job VACUOUS: getOrgEvidence short-circuits to
      # EMPTY_EVIDENCE whenever actor.orgId === actor.userId, so the evidence page rendered
      # "No environments yet" regardless of data and the hero assertion could not fail. The
      # EE scope — the one production and the sandbox box actually run — was never tested.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the suite silently runs community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community"
            echo "::error::scope (actor.orgId === userId), which makes org-scoped assertions vacuous."
            exit 1
          }
      - name: Build the console (production image the browser drives)
        run: pnpm -C apps/console run build
      - name: Install Playwright (Chromium + OS deps)
        run: bash scripts/ci/playwright-install.sh
      # Guard against a vacuous green: if the hero spec is ever renamed without updating the
      # project's testMatch, `playwright test --project=hero` would match 0 tests and could exit 0.
      # Fail loudly instead.
      - name: Guard — hero project must match at least one test
        run: |
          list=$(pnpm -F console exec playwright test --project=hero --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          echo "$list" | grep -qE "Total: [1-9][0-9]* test" || { echo "::error::--project=hero matched 0 tests (testMatch drift?)"; exit 1; }
      - name: Run the hero happy-path (Playwright boots `next start` via webServer)
        run: pnpm -F console exec playwright test --project=hero
      # Gated on the checkout, not on `!cancelled()` alone: a service container that fails to pull
      # skips every step here, and this one would then report SUCCESS having uploaded nothing (#4084).
      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/console/playwright-report/
          retention-days: 7

  ui-audit:
    name: UI conformance audit (console · non-required)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    # NON-REQUIRED, DELIBERATELY, and the reason is on the record. This drives every private console
    # route through the live half of apps/console/docs/ui-conformance/RUBRIC.md (R1-R7, T5-T7) and
    # it WILL be red until the conformance lanes land — the baseline is captured separately (#3634),
    # and a suite that becomes a merge gate before anyone has read its findings is how #2417's
    # 320-test suite nearly went in. It is not one of the `needs:` of `CI required` (the job that
    # decides which CI jobs gate a merge), and its context is named neither in .mergify.yml nor in
    # the protect-dev ruleset. Making it a gate is a deliberate edit to that `needs:` list —
    # scripts/ci/check-required-checks.mjs compares the two named lists, and does NOT read `needs:`.
    #
    # WHEN: nightly at 03:00 UTC, and on demand. NOT on every console PR any more (#4173).
    #
    # It used to add `needs.detect-changes.outputs.console == 'true'`, so every console PR paid for
    # a console build, a Chromium install and a Postgres service — 11 minutes median — to produce a
    # result the job's own comment above promises WILL BE RED until the conformance lanes land. A
    # non-required check that is expected to fail teaches a reader to skim past it, and it was doing
    # that at the cost of a runner slot per console PR.
    #
    # That cost is not measured in minutes. Measured 2026-09-03 across 500 runs: jobs spend 5,376
    # minutes WAITING for a runner against 1,802 executing, with a zero-dependency job waiting a
    # median of 15 minutes. The currency is slots REQUESTED, so removing a job from the per-PR path
    # gives back more than its own runtime.
    #
    # ⚠️ WHAT THIS GIVES UP, stated so it can be reversed knowingly: a console PR no longer gets
    # per-PR conformance feedback. The nightly still drives every private route and still produces
    # the `ui-audit` artifact — that artifact is what R5's colour-contrast diagnosis is read from
    # (#4099). If a conformance lane starts needing per-PR feedback, put it back behind a LABEL
    # rather than the broad `console` filter, so the routes that want it pay and the rest do not.
    #
    # `github.event.schedule` is matched EXACTLY rather than `event_name == 'schedule'`, because
    # ci.yml also carries a Monday cron for the mutation job and a bare event_name test would
    # silently sign that job up for a nightly run too.
    if: >-
      github.event.schedule == '0 3 * * *'
      || github.event_name == 'workflow_dispatch'
    # Same hermetic recipe as the hero job: real Postgres, a production console booted by the
    # Playwright `webServer`, email-OTP with the code scraped from the teed log. No sandbox box, no
    # cloud credentials — this costs CI minutes, not an environment slot.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      BETTER_AUTH_SECRET: e2e-browser-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      DEV_CONSOLE_LOG: /tmp/alethia-ui-audit-console.log
      # The audit is a LOAD TEST against its own server, and the limiter it trips is protecting
      # nothing here — this is a throwaway `next start` on localhost with a throwaway database.
      # apps/console/lib/config/auth.ts documents ALETHIA_AUTH_RATE_LIMIT=0 as exactly that escape
      # hatch. Why it is needed: lib/auth/index.ts trusts ONLY `cf-connecting-ip` for the bucket
      # key (prod is Cloudflare → Caddy → console), that header never arrives on a bare localhost
      # `next start`, and Better Auth's getIP returns null under NODE_ENV=production — so every
      # request in the run lands in ONE shared `no-trusted-ip|/get-session` bucket. The global rule
      # is 60s/100 and an ALLOWED request rewrites `lastRequest`, so the window only resets after
      # 60s of SILENCE on the key: it is 100 requests for the whole run, not 100 per minute. The
      # audit does ~270 page loads and every private page mounts `useSession`, so it rate-limits
      # itself and then reports its own 429s as R6 "failed request" defects on the pages under
      # test. Scoped to this job's env only — production policy is untouched.
      ALETHIA_AUTH_RATE_LIMIT: "0"
    steps:
      # `id:` so the two `!cancelled()` steps at the bottom of this job can ask whether there is a
      # WORKSPACE before they run. The `services:` block above starts in `Initialize containers`,
      # which is step ZERO — it runs BEFORE this checkout — so a failed image pull skips everything
      # here and leaves the tree empty, while `cancelled()` stays false. See #4084.
      - id: checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # See the hero job: without ee/dist the console falls back to community scope
      # (actor.orgId === actor.userId) and every org-scoped surface renders empty — which would
      # make the whole audit a measurement of the wrong application.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the audit measures community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community scope."
            exit 1
          }
      - name: Build the console (production image the browser drives)
        run: pnpm -C apps/console run build
      - name: Install Playwright (Chromium + OS deps)
        run: bash scripts/ci/playwright-install.sh
      # The route manifest IS the audit's denominator. If the seam raises — a moved route group, a
      # zero-route scan — every route below would be "audited" over nothing, so it is run here on
      # its own where the failure names itself. NOT piped: a pipe would report the pipe's exit code.
      - name: Guard — the route manifest resolves
        run: node scripts/lib/console-routes.mjs --summary
      - name: Guard — the audit project must match at least one test
        run: |
          list=$(pnpm -F console exec playwright test --project=audit --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          echo "$list" | grep -qE "Total: [1-9][0-9]* test" || { echo "::error::--project=audit matched 0 tests (testMatch drift?)"; exit 1; }
      - name: Run the UI conformance audit (Playwright boots `next start` via webServer)
        run: pnpm -F console exec playwright test --project=audit
      # THE JOB IS LEGITIMATELY, PERMANENTLY RED — R3, R5 and R6 carry real debt `LIVE_DEBT` owns —
      # so "did the check go green" answers nothing about any single lane. #3893 is the case that
      # made it concrete: it removed the topbar overlap, its check was red before and red after, and
      # the only way to see that it had worked was to break the run down by predicate BY HAND
      # (`R4 7 → 0, nothing else moved`). Nobody does that per lane, so an unreadable check gets
      # ignored — and an ignored check is one nobody notices going MORE red.
      #
      # This prints the per-predicate table to the run summary. It is a rendering of numbers that
      # already exist, not a new measurement, and it is NOT a step toward making the job required:
      # it cannot be while it is honestly red, and forcing it green by suppressing the debt is the
      # failure this wave exists to prevent.
      #
      # `!cancelled()` and NOT `success()`: the summary is worth most when the audit FAILED, which
      # is nearly always. It cannot turn a broken run into good news, and there are TWO ways a run
      # can be broken, which is worth stating separately because the first version of this comment
      # claimed only the first and read as though it covered both:
      #
      #   - a truncated ARTIFACT — a missing or empty `records` array, or no sections. It raises.
      #   - a withheld MEASUREMENT — `record()` rewrites every verdict for a withheld predicate to
      #     `NOT MEASURED`, so the array is FULL and only the verdicts changed. That is the shape
      #     this audit actually produces when a positive control breaks, and counting only FAIL
      #     scored it as zero: `R4 7 → 0`, a broken run wearing the exact shape of a fixed lane.
      #     A withheld predicate now carries a floor and no delta, and a section that is withheld
      #     end to end raises like the empty one it is.
      #
      # …and NOT `!cancelled()` alone (#4084). On run 33710964528 the postgres service failed to
      # pull, `Initialize containers` went red, all thirteen real steps were SKIPPED — and this one
      # ran anyway, against an empty workspace, so the last line of the job read
      # `Cannot find module … apps/console/scripts/audit-report.mjs` for a file that is present on
      # dev at 173450 bytes. The job's own log accused the console of a missing script. Conjoining
      # the checkout's outcome puts `Initialize containers` back as the last thing that failed.
      #
      # `--not-run=interaction`: this job runs `--project=audit` only. The `interaction` section's
      # artifact (`ui-audit-interaction.json`, R8 + F8–F10) is written by the `audit-interaction`
      # project, which needs the stripe+encryption capabilities and runs as its own release-gate
      # leg. Without the declaration this step refused on the missing file EVERY night — runs
      # 45814921924, 45611112939, 45402034845 and back through November all had 276/276 audit tests
      # pass and went red here, so the table nobody could read was the job's only red. The flag
      # skips by DECLARATION, and refuses if the artifact turns up after all.
      - name: Per-predicate summary of the audit, against the recorded baseline
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          node apps/console/scripts/audit-report.mjs \
            --step-summary=apps/console --not-run=interaction >> "$GITHUB_STEP_SUMMARY"
      # Same conjunct, milder symptom: on that run this step reported SUCCESS having uploaded
      # nothing, which is the harder half to notice.
      - name: Upload the audit report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-audit
          path: |
            apps/console/playwright-report/
            apps/console/test-results/ui-audit*.json
          retention-days: 14

  e2e-elench-ai:
    name: E2E (browser · Elench AI journeys · scripted model)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    # Heavy (console build + Playwright), so it stays OFF most PRs to cut Actions minutes — but it
    # now RUNS on any PR that touches the agent surface. It is the only test that drives the real
    # composer/rail/grid in a browser, and skipping it on PRs is how a broken Lexical composer
    # shipped green. Still runs on the merge queue, pushes, and manual dispatch as before.
    # NOT on a promotion PR (into main or staging): release-gate.yml boots the same console and
    # drives this same project there, as one of its legs; running it twice on one merge ref buys
    # nothing but a runner slot. Dev PRs, pushes and dispatches are unchanged.
    if: >-
      (github.event_name == 'merge_group' || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || needs.detect-changes.outputs.agent == 'true')
      && !(github.event_name == 'pull_request' && contains(fromJSON('["main","staging"]'), github.base_ref))
    # The Elench AI journeys end-to-end with a SCRIPTED model (ALETHIA_AI_MOCK=1 → the
    # MockLanguageModelV3 in lib/config/ai-mock). Only the model is deterministic: the agent
    # route, extended thinking, orchestration markers, TOOL EXECUTION (PDP-gated reads against
    # this real Postgres), metering, transcript persistence, widget auto-pin into thread_widgets,
    # artifacts and RLS all run for real. No API key, no flake, no cost. The real-model run is
    # the separate (non-gating) e2e-ai-nightly workflow.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      BETTER_AUTH_SECRET: not-a-secret-e2e-placeholder
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # `next start` is production mode, but this hermetic job has no trusted ingress proxy.
      ALETHIA_AUTH_RATE_LIMIT: "0"
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      DEV_CONSOLE_LOG: /tmp/alethia-e2e-console.log
      # The scripted model. NEVER set anywhere but an E2E console (unit-tested: the gate is
      # off by default and only the literal "1" engages it).
      ALETHIA_AI_MOCK: "1"
    steps:
      # `id:` so the upload at the bottom can ask whether there is a workspace — the `services:`
      # block above starts before this step, and its failure skips this one, not that one (#4084).
      - id: checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # Build @alethia/ee FIRST. Its dist is gitignored and it has no prepare/postinstall
      # hook, and `pnpm -C apps/console run build` calls the console's own script — bypassing turbo,
      # so `build.dependsOn: ["^build"]` never fires. Without this, ee/dist/index.js does
      # not exist, getEnterprise()'s tolerant require throws, and lib/auth/scope.ts falls
      # back to `{ userId, orgId: userId }`.
      #
      # That fallback made this whole job VACUOUS: getOrgEvidence short-circuits to
      # EMPTY_EVIDENCE whenever actor.orgId === actor.userId, so the evidence page rendered
      # "No environments yet" regardless of data and the hero assertion could not fail. The
      # EE scope — the one production and the sandbox box actually run — was never tested.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the suite silently runs community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community"
            echo "::error::scope (actor.orgId === userId), which makes org-scoped assertions vacuous."
            exit 1
          }
      - name: Build the console (production image the browser drives)
        run: pnpm -C apps/console run build
      - name: Install Playwright (Chromium + OS deps)
        run: bash scripts/ci/playwright-install.sh
      # Guard against a vacuous green (renamed spec → testMatch drift → 0 tests → exit 0).
      - name: Guard — elench-ai project must match at least one test
        run: |
          list=$(pnpm -F console exec playwright test --project=elench-ai --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          echo "$list" | grep -qE "Total: [1-9][0-9]* test" || { echo "::error::--project=elench-ai matched 0 tests (testMatch drift?)"; exit 1; }
      - name: Run the Elench AI journeys (scripted model, real pipeline)
        run: pnpm -F console exec playwright test --project=elench-ai
      # Gated on the checkout, not on `!cancelled()` alone: a service container that fails to pull
      # skips every step here, and this one would then report SUCCESS having uploaded nothing (#4084).
      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-elench-ai
          path: apps/console/playwright-report/
          retention-days: 7

  coverage-badge:
    name: Coverage badge (self-hosted)
    runs-on: ubuntu-latest
    # Only on push to main: regenerate coverage and commit the shields.io badge JSON the README
    # renders. No third-party service. `[skip ci]` on the commit avoids a run loop.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit suites (produces per-project coverage summaries)
        run: pnpm exec turbo run test
      - name: Compute merged coverage → badge JSON
        run: node scripts/coverage-badge.mjs
      # Publish UNCONDITIONALLY. There used to be an `if git diff --quiet -- <the badge>` guard
      # here, and it was a trap waiting for the tracked copy to go away.
      #
      # `git diff` compares the index and the working tree for TRACKED paths. It says NOTHING
      # about an untracked one — measured, both directions: on an untracked file
      # `git diff --quiet -- <path>` exits 0 ("clean") while `git status --porcelain -- <path>`
      # correctly prints `?? <path>`. The badge JSON is no longer checked in (it could never be
      # kept honest — this job runs only on push to main and publishes to `badges`, so it never
      # writes back to the tree, and the checked-in copy sat at 91% against a real 67.8%).
      # So the file coverage-badge.mjs writes is now always untracked, the old conditional would
      # always have reported "unchanged", and the badge would have frozen forever with this job
      # GREEN — the same swallowed-signal shape that left the Go badge advertising 21.6% against
      # a real 61.2% for five weeks.
      #
      # Dropping the conditional is safe precisely BECAUSE the file is untracked: each run starts
      # from a fresh checkout of main where it does not exist, so `git add` always stages a new
      # file and `git commit` can never fail with "nothing to commit".
      - name: Publish the badge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # THE SIBLING BADGE HAS TO BE CARRIED FORWARD, OR PUBLISHING THIS ONE DELETES IT.
          #
          # Both badge jobs end in `git push --force origin HEAD:badges` — they publish main's
          # tree, with their own badge committed on top. That was survivable only while BOTH
          # JSONs were tracked in main: each job's tree carried its sibling's file along for the
          # ride. Now that neither is tracked, this job's tree contains only `coverage.json`, so
          # a force-push would drop `go-coverage.json` from `badges` — and the README's Go badge
          # would 404 on every push to main, with both jobs green. That is the exact
          # failure-with-a-green-check shape this PR exists to remove, so it must not be
          # reintroduced by the fix.
          #
          # Restoring the sibling from the branch we are about to overwrite makes the force-push
          # additive rather than destructive. `|| true` is correct ONLY here: on the very first
          # run the file legitimately does not exist yet, and this job does not own it.
          # `|| true` on the fetch would be a fail-open that silently reintroduces the deletion
          # this block exists to prevent: no FETCH_HEAD, no sibling restored, force-push drops it,
          # job green. So the ONLY tolerated absence is a `badges` branch that genuinely does not
          # exist yet (the very first publish); a fetch that FAILS against an existing branch reds
          # this job.
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges
            # `checkout … || echo` would swallow EVERY failure of that command, not only the one
            # absence we mean to tolerate: a wrong FETCH_HEAD, a moved path or a locked index would
            # all print the same notice and then force-push the sibling away, green. So the
            # tolerated case is tested for explicitly and the checkout itself is strict.
            if git cat-file -e "FETCH_HEAD:.github/badges/go-coverage.json" 2>/dev/null; then
              git checkout FETCH_HEAD -- .github/badges/go-coverage.json
            else
              echo "::notice::no go-coverage.json on \`badges\` yet — nothing to carry forward"
            fi
          else
            echo "::notice::\`badges\` does not exist yet — first publish, nothing to carry forward"
          fi
          # -f is defensive: .gitignore carries a bare `coverage` rule, which does NOT match
          # `.github/badges/coverage.json` today (no path component is exactly `coverage`), but a
          # future broadening of that rule must not silently stop the badge instead of failing.
          git add -f .github/badges/
          # --no-verify: the repo's pre-commit hook (core.hooksPath) blocks direct
          # commits to main; this CI-authored badge commit is legitimate.
          git commit --no-verify -m "chore(ci): update coverage badge [skip ci]"
          # Publish to the unprotected orphan `badges` branch, NOT to main. `protect-main` is
          # enforcement:active with bypass_actors:[] and a pull_request rule, so a direct push
          # to refs/heads/main is refused with GH006 — contents:write on the token is
          # irrelevant, the ruleset denies the ref update. See publish_badge in the Go badge
          # job below for the full diagnosis; this badge was dead for the same reason.
          #
          # NO `|| true`. A push that cannot land must RED this job.
          git push --force origin HEAD:badges

  guards:
    name: Authz / open-core guards
    runs-on: ubuntu-latest
    # For `guards_selftest` only (the "Guards self-test" step). `!cancelled()` keeps this job
    # running if detect-changes fails, and that step runs unless the output is exactly 'false'.
    needs: [detect-changes]
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    if: ${{ !cancelled() && github.event.schedule != '0 3 * * *' }}
    # `issues: read` for check-exclusion-issues.mjs, the one network step in an otherwise hermetic
    # job. The workflow-level `permissions: contents: read` makes every unlisted scope NONE, so
    # without this `gh issue view` fails, the check reports "could not read the state" and — being
    # continue-on-error — becomes permanent background noise in which a genuinely CLOSED tracker
    # renders identically to the guard being broken. Every other workflow here that touches the
    # issues API declares it explicitly (programme.yml, workflow-health.yml, catalog-drift.yml, …).
    permissions:
      contents: read
      issues: read
      # `pull-requests: read` for check-pr-scope.mjs: the guards job is a SHALLOW checkout, so
      # `git diff base...head` has no base to reach and the changed-file list has to come from the
      # API. Read-only, and the check writes nothing anywhere.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Go is here for three steps. check-go-arch-filenames.mjs --self-test cross-checks its
      # hard-coded GOOS/GOARCH lists against the toolchain's internal/syslist, and FAILS under CI
      # without a `go` (#5593) — a skip there would be a permanent silent green. `pnpm
      # compliance:release` runs `go list -m -json all` in apps/cli, apps/runner and packages/core,
      # and the programme spine mirror runs `go test` in test/e2e; both FETCH modules. With
      # `cache: false` every run fetches them from proxy.golang.org, so the step right after the
      # install pre-fetches test/e2e's under a retry, and release-compliance.mjs retries its own
      # `go list` (#6031).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - id: setup
        run: pnpm install --frozen-lockfile
      # Retries only a fetch that did not complete (an HTTP/2 stream reset from proxy.golang.org, a
      # TLS or i/o timeout, a 502/503/504) and fails anything else on the first attempt. A retry
      # that ends green still leaves a `::warning` on the run. A plain `go mod download` writes only
      # the module cache: test/e2e's go.mod and go.sum stay as committed. Its self-test runs further
      # down, next to the chart-fetch retry's.
      - name: Pre-fetch test/e2e's Go modules (retrying a transient proxy error)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: GOWORK=off bash scripts/ci/go-mod-download-retry.sh test/e2e
      - name: Open-core boundary (core must not import ee/)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:ee-boundary
      - name: Repository-wide open-core boundary and community image contract
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:open-core
      - name: No @theme inline variable is overridden (inert responsive ladder)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:theme-inline
      # The `"use client"` on @repo/ui/button, and the note explaining it. Its absence produced
      # "Element type is invalid … got: undefined" on two separate pages and cost two long bisects —
      # tsc, eslint and the type checker are all blind to it, so only a production build sees it, at
      # request time. The note that says "keep it that way" then named two callers and one of them
      # was a DIFFERENT `buttonVariants` from fumadocs, in an app that does not even declare
      # @repo/ui. This derives the claim from the tree instead of restating it (#2677).
      - name: '@repo/ui/button keeps its client boundary, and its callers are client modules'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:ui-client-boundary
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:ui-client-boundary -- --self-test
      # The packages published to npm as @alethialabs/* (packages/public-packages.json,
      # docs/contributing/releasing-packages.md). Building and packing them on every PR is the only
      # place a broken publish shows BEFORE it reaches main: a published package depending on an
      # unpublished one, an export the build did not produce, a missing asset. The changeset check
      # fails a PR that changes what a published package ships without saying how to version it.
      # Each script's self-test plants its defects first, so a parser that stopped matching cannot
      # pass green over nothing.
      - name: Published packages build, stage and pack (no upload)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/release/stage-public-packages.mjs --self-test
          node scripts/release/stage-public-packages.mjs
          node scripts/release/publish-public-packages.mjs --dry-run
      - name: A change to a published package carries a changeset
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/check-changeset.mjs --self-test
          node scripts/release/check-changeset.mjs
      # CLAUDE.md §6's shared-surface table, for the two rows where the rule is unambiguous:
      # @repo/format and @repo/ui/page-header. Before this, no row of that table was guarded by
      # anything — one `numeric` column rendered as `$12.50/mo`, `~$12/mo` and `€12.50`, and
      # in-app page titles rendered at five sizes. apps/console/shared-surface-allowlist.yaml
      # carries the documented exceptions and is shrink-only.
      # THE CLI SURFACE CENSUS RUNS HERE RATHER THAN IN A JOB OF ITS OWN (#4373), and the placement
      # is the decision. `ui-audit` was taken OFF the per-PR path in #4173 because runner SLOTS are
      # the scarce currency — measured 2026-09-03, jobs spend 5,376 minutes waiting against 1,802
      # executing — so adding a job to report four numbers would have pushed against that.
      #
      # This is a pure-Node walk over files. No Postgres, no build, no browser, seconds not minutes.
      # Folded into a job that already runs, it costs ZERO additional slots, which is why it can
      # afford to run on every PR rather than nightly.
      #
      # IT ENFORCES (#3664). #4373 shipped it in report mode — exit 0 whatever the counters said —
      # so the numbers could be watched on real PRs before a ratchet was armed on them. All four
      # reached target on dev (0 handoffs, 92/92 form coverage, 0 allowlist rows, 0 unlocked
      # mirrors), so any non-zero gap now exits 1 and fails this job, as does a counter that
      # cannot measure. apps/cli/cli-surface-allowlist.yaml was deleted, and its return is itself
      # a violation: there is no ledger to excuse a finding with.
      - name: CLI surface census (four counters, each enforced at a zero gap)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:cli-surface
      - name: ...and that census is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-cli-surface.mjs --self-test
      # The destructive-action registry, censused against the tree in BOTH directions (#4266):
      # every destructive call site has an entry, and every entry's mutation really occurs in the
      # file that invokes it. The second direction is the one that matters silently — a stale entry
      # makes a real site look accounted for. The self-test carries the floor's own argument.
      - name: Every destructive control is in the registry, and every entry still has its control
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:destructive-actions
      - name: ...and that census is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-destructive-actions.mjs --self-test
      # A third-party firm's name was removed from this public tree once already (0a2e9a42d,
      # "remove the former client's name from the public repo", #2416) and 80 occurrences were
      # back by 2026-09-22. A one-pass replace removes what exists; nothing failed when it
      # returned. This is the half #2416 lacked.
      - name: No forbidden third-party name is in the tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:forbidden-names
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-forbidden-names.mjs --self-test
      # The release gate's billing flag, beside a Stripe test key, opens the paid-conversion gate's
      # market check (#5412). Three places said it is set ONLY in release-gate.yml and nothing made
      # that true (#5443). This fails when the name appears in any tracked file outside a five-entry
      # allowlist — every deploy workflow, deploy/, infra/ and env assembly included — and when an
      # allowlisted file stops naming it.
      - name: The billing test-market flag is set only by the release gate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-billing-test-market-flag.mjs
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-billing-test-market-flag.mjs --self-test
      # #3855 was auto-closed TWICE on 2026-09-22 — at 16:54Z and again at 21:41Z — by PR bodies
      # saying they did NOT close it. Both parsers carried the defect; only the destructive one
      # was visible. This fails the build if either loses its negation guard, or if the two drift.
      - name: A negated closing keyword does not close an issue
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:closing-keyword-parsers
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-closing-keyword-parsers.mjs --self-test
      # promote.yml picks the dev commit a promotion pins and decides what happens to an older
      # promotion PR. Those rules run unattended on a schedule, so their pure halves are tested here.
      - name: The promotion picker's rules (green-by-tree, older-PR handling) hold
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/promote.mjs --self-test
      - name: Console shared surface (@repo/format, @repo/ui/page-header) is not hand-rolled
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:shared-surface
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-shared-surface.mjs --self-test
      # crypto.randomUUID, navigator.clipboard and crypto.subtle are undefined when a self-hosted
      # console is served over plain HTTP, and every test and preview runs in a secure context, so
      # nothing else sees a regression (#6182).
      - name: Browser code uses no SecureContext-only API without a fallback
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-secure-context-apis.mjs
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-secure-context-apis.mjs --self-test
      # Every console shortcut is a row in apps/console/lib/shortcuts/ and `useShortcut` is the one
      # page-level keydown listener (#7007). A second listener answers keys without the registry's
      # rules — Tab unbound, global chords hold a modifier, narrower scope wins (#6928).
      - name: The console has one page-level key listener (the shortcut registry)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:single-keydown
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-single-keydown.mjs --self-test
      # `availability` in packages/core/catalog/catalog.json decides which clouds are offered, and
      # every offer list derives from it. This fails on a NEW hand-written list of three or more
      # cloud slugs, and on a hidden cloud named in marketing, docs, blog, README or console page
      # metadata. The ledger is scripts/cloud-availability-allowlist.yaml (#6950).
      - name: No hand-written cloud list, no hidden cloud on a user-visible surface
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:cloud-availability
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-cloud-availability.mjs --self-test
      # The allowlist's `baseline:` and `debt:` are entry counts over its own rows, and the file is
      # shared by every conformance lane of #3613. Typed by hand they had two failure shapes: two
      # lanes writing DIFFERENT values conflict and the resolution is arithmetic (recount, then
      # probe N±1 to prove the number is unique), and two lanes writing the SAME value — ten rows
      # removed here, ten different rows removed there — merge cleanly and wrongly, failing on `dev`
      # and blaming whichever PR landed second. Derived, that second shape cannot happen. This runs
      # the generator and diffs, the same shape as the offer-parity / config-carriage gates below:
      # the comparison is against the committed FILE, not against a number the script recomputed.
      - name: Shared-surface ledger counters are derived from the rows, not typed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm gen:shared-surface
          git diff --exit-code -- apps/console/shared-surface-allowlist.yaml \
            || { echo "::error::apps/console/shared-surface-allowlist.yaml's ledger counters are stale — run 'pnpm gen:shared-surface' and commit."; exit 1; }
      # Every interactive control in the console has a role and an accessible name (#5046): an
      # icon-only button or link, a clickable non-control, an unlabelled field. A PARSE (the
      # console's own `typescript`), so it reaches the controls behind conditions the rendered axe
      # audit never opens. Measured drift is `lifts:` debt in apps/console/control-names-allowlist.yaml,
      # checked in both directions; the counters are derived, and the third step diffs them.
      - name: Every console control has a role and an accessible name
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:control-names
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node apps/console/scripts/check-control-names.mjs --self-test
      - name: Control-names ledger counters are derived from the rows, not typed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:control-names
          git diff --exit-code -- apps/console/control-names-allowlist.yaml \
            || { echo "::error::apps/console/control-names-allowlist.yaml's ledger counters are stale — run 'pnpm -C apps/console run gen:control-names' and commit."; exit 1; }
      # The connector catalog's `icon_url`s. Eleven of the eighteen icon slugs it named had no file
      # behind them (#3802): the generator emitted every one verbatim into the TS registry AND
      # persisted it into `connectors.icon_url`, so the console asked for an asset that 404s on
      # every render of every connector surface and recovered into the monogram fallback — silently,
      # which is why it survived. Nothing ran this generator in CI either, so a stale
      # registry.generated.ts was equally invisible. Both halves are closed here: the run REFUSES a
      # dangling path, and the diff proves the committed output is what the manifest produces.
      - name: Every connector icon resolves, and the generated registry + seed are current
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # `node …` and not `pnpm -C apps/console run gen:connectors`, deliberately: the generator resolves
        # every path from its own module URL, so the direct call is identical, and it cannot inherit
        # whatever a package-manager wrapper decides to do with a non-zero exit code.
        run: |
          node apps/console/scripts/gen-connectors.mjs
          git diff --exit-code -- apps/console/lib/connectors/registry.generated.ts apps/console/lib/db/seed/connectors.generated.sql \
            || { echo "::error::apps/console/lib/connectors/registry.generated.ts or lib/db/seed/connectors.generated.sql is stale — run 'pnpm -C apps/console run gen:connectors' and commit."; exit 1; }
      - name: ...and that gate is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node apps/console/scripts/gen-connectors.mjs --self-test
      # scripts/lib/console-routes.mjs is the ONE definition of "the console's private route set" —
      # the denominator of every score the console-UI conformance wave reports. It raises rather
      # than returning [] on a renamed route group, an unreadable directory, two pages on one URL
      # and two spellings of one boundary, so running it over the real tree IS the check: a route
      # list nothing resolves is a clean bill of health over zero files.
      - name: The console's private route manifest still resolves
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:console-routes
      - name: ...and that manifest is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/lib/console-routes.mjs --self-test
      # RUBRIC.md's S1–S4 and T1–T4 scored over that same manifest, against the shrink-only
      # baseline in apps/console/route-states-baseline.yaml. It lands red-by-record rather than
      # red: today's tree HAS 45 failing route-predicate pairs, every one of them written into the
      # baseline, so the step is green until a route regresses or a recorded failure is fixed
      # without deleting its line. Nothing invoked this file between #3690 and here, which is the
      # failure mode it exists to catch — a baseline nothing re-runs goes stale on `dev` where the
      # regression cannot be attributed to the PR that caused it. Do NOT pipe this into
      # `tail`/`head`: the script's own header says so, because a pipe reports the exit code of
      # the LAST command in it.
      #
      # IT IS REQUIRED FROM THE MOMENT IT LANDED, AND THERE IS NO SOAK. #3781's body proposed
      # promoting it "once it has ridden a few PRs", but this job is `Authz / open-core guards`,
      # which was required by name on `protect-dev` and in `.mergify.yml` when this step landed and
      # is now one of the `needs:` of `CI required`, the context both require — and the step
      # carries no `continue-on-error`, so it has blocked merges since it merged. The soak was never a state this step could be in.
      #
      # Left required deliberately rather than made real with `continue-on-error: true`: a gate
      # that reports green while finding something is the defect class this repo has shipped most
      # often, and this one is deterministic, sub-second, and green on `dev`. So the churn the
      # #3781 body identified is a CONTRACT, not a risk to measure: a PR that adds or renames a
      # private console route updates apps/console/route-states-baseline.yaml in the same commit.
      - name: Route states (RUBRIC.md S1-S4, T1-T4) have not regressed against the baseline
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:route-states
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-route-states.mjs --self-test
      # RUBRIC.md's family F — the console filter standard — scored over the console's fifteen
      # filter SURFACES (a `createFilterStore` call site, not a store module: one file holds
      # seven). Before #3796 nothing in the tree measured any of F1-F7 and the scoreboard rendered
      # the whole column `—`, which is the failure this wave exists to close: a report whose
      # "nothing found" branch is indistinguishable from "nothing measured".
      #
      # WHAT THIS STEP FAILS ON. Since #4890 a per-surface F1-F6 FAIL not declared in
      # `FILTER_STANDARD_DEBT` fails it, naming the SURFACE. The same verdicts also reach
      # `apps/console/ui-conformance-baseline.json` through the audit-report step below, but that is
      # a per-route RECORD: since #7594 a PR only REPORTS its diff against it, and dev's copy is
      # regenerated by .github/workflows/ui-conformance-scoreboard.yml — so the gate is here, not
      # there. It also fails on a BROKEN
      # SUBJECT SET: no surfaces, a store nobody reads, an unreadable console root, or a
      # facet-bearing server builder that `apps/console/tests/lib/queries/filter-standard-facets.test.ts`
      # neither drives nor declares. F7 is a behaviour (RUBRIC.md's "Family F" says so, with the reason),
      # so the only thing a static file can honestly say about it is whether the instrument still
      # covers its subject — and that is checked in BOTH directions, here and from the test.
      #
      # Do NOT pipe it into `tail`/`head`: a pipe reports the exit code of the LAST command in it.
      - name: The console filter standard (RUBRIC.md F1-F7) still has an instrument over its whole subject
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:filter-standard
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-filter-standard.mjs --self-test
      # Reads travel over the GET read router, never as server actions (ADR 0005 D1, #6113): a
      # server action as a `queryFn` queues every read on the page behind every other (F001). The
      # ledger fails in both directions — new action-backed reads, and entries whose read has moved.
      - name: Console reads do not travel as server actions (ADR 0005 D1 ratchet)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:read-transport
      - name: ...and that ratchet is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-read-transport.mjs --self-test
      # Live by default (ADR 0005 §7 Q3 + §10 R7, #6115): a change the viewer did not make arrives as
      # a topic on the org's change stream, not a poll. Every `refetchInterval` / `setInterval` is in
      # the ledger — a timer with its reason, a poll with the lane that lifts it, and ONE sanctioned
      # fallback poll — and polls only shrink against dev's ledger. The guards job is a shallow
      # checkout, so dev is fetched first; an unreadable base fails rather than skipping the rule.
      - name: The console does not poll for data (ADR 0005 live-by-default ratchet)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev
          pnpm -C apps/console run check:no-polling
      - name: ...and that ratchet is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-no-polling.mjs --self-test
      # The filter bar's other half, in the e2e suite (#5800). React leaves the server's copy of a
      # streamed Suspense section in a hidden `<div hidden id="S:n">`, and `getByLabel` /
      # `getByPlaceholder` match inside it while `getByRole` does not — so a spec that asks for a
      # list page's search box by label can fill the hidden copy and apply no search (#5795's qa leg
      # counted 42 connectors, expecting 3). The input names are derived from every <FilterSearch> /
      # <MultiCombobox> in the console; known, unfixed sites sit in a ledger that fails both ways.
      - name: No e2e spec asks for a list-page filter input by label or placeholder
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:e2e-filter-locators
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-e2e-filter-locators.mjs --self-test
      # The release gate (.github/workflows/release-gate.yml) is green-by-RATCHET: every leg fails on
      # regression against apps/console/e2e/gate-baseline.json, and the rules live in one script. A
      # ratchet that stopped firing would let every leg pass on an empty ledger, so its self-test
      # runs here beside the other guards' — and so does the capability promise's, whose CI branch
      # must THROW on an unmet need rather than skip (the HAVE_MEMBER shape, at the ledger).
      - name: The release gate's ratchet is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/e2e-ratchet.mjs --self-test
      - name: ...and the capability promise fails closed in CI
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console exec tsx e2e/helpers/capabilities.ts --self-test
      # ...and the LEDGER it ratchets against still describes the tree (#4460). A lane rewrites a
      # spec, then regenerates its slice from the gate run's own results — and it cannot win that
      # race: draft means no leg runs at all, non-draft means Mergify merges ~15 minutes before the
      # `qa` leg finishes. So the only instrument that can catch an unregenerated slice is the
      # ratchet's rule 4, which lives on a leg that is required on `main` and gates nothing on `dev`.
      # #4433 lost that race and the next PRs inherited its red; #4324 did the same to the canvas
      # slice and nothing reported it at all.
      #
      # This is the cheap, sound half of that question asked of the TREE: `playwright test --list`
      # plus a JSON read. No browser, no Postgres, no console — seconds, in a job that already runs
      # on every PR, which is the whole point (running Playwright on every dev PR is what #4440
      # exists to avoid). It would have failed #4433 on #4433.
      - name: The release gate's ledger still describes the tree (no renamed or deleted test)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-gate-baseline-consistency.mjs
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-gate-baseline-consistency.mjs --self-test
      # ...and the slice this PR moved is one it OWNS (#4615). The check above asks whether the
      # ledger still describes the tree; this asks whether the PR earned the part of it that moved.
      # Four `wave:release-gate` lanes declare gate-baseline.json in their `scope:`, correctly, and
      # the only thing keeping them apart is `--only`. Read scripts/e2e-ratchet.mjs: with `--only`
      # the writer MERGES (`{ ...current, ...toBaseline(scoped) }`); without it, it REPLACES the
      # whole `projects[<p>]` object with one run. A sibling lane's pending slice is then discarded
      # on merge, and nothing says so — the consistency check above agrees with the branch, the
      # ratchet agrees with the ledger it just rewrote, and check-pr-scope agrees the file is
      # declared. Three green gates. Measured on 2026-09-17: the JSON itself MERGES CLEANLY
      # (it partitions by project → file → title), so there is not even a conflict marker.
      #
      # A diff read: two `gh api` blob fetches and a JSON compare, seconds. It reads BOTH sides from
      # the API rather than the checkout, because on a `pull_request` the checkout is
      # `refs/pull/N/merge` — head merged into the CURRENT base tip — and diffing that against the
      # merge base attributes `dev`'s own landed slices to the PR. On a `push` there is no PR, so it
      # says so and exits 0: a required check that does not always report wedges the queue.
      #
      # Verified against dev's whole history before it shipped: all 18 ledger-moving commits with a
      # parent that carries the file PASS, and a reconstructed bare `--write` over today's baseline
      # REDS on both the loosened and the deleted entry. #4615's own suggested rule — "a slice
      # touched for a spec file the PR does not modify is a finding" — fires on NINE of those 18,
      # every one of them legitimate; the five exemptions in the script's header are what the corpus
      # says the rule actually is.
      - name: ...and the ledger slice this PR moved is one it owns (no bare `--write`)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-gate-baseline-slice-ownership.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: ...and THAT check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-gate-baseline-slice-ownership.mjs --self-test
      # The console's published conformance score. #3618 landed apps/console/scripts/audit-report.mjs
      # and the two artifacts it owns — apps/console/docs/ui-conformance/scoreboard.md and
      # apps/console/ui-conformance-baseline.json — with the two-mode contract PROGRAMME.md uses:
      # `--write` regenerates, a bare invocation checks them against the tree and exits 2 naming the
      # command that fixes it. Nothing invoked either mode, so the numbers could go stale on `dev`
      # the moment any conformance lane of #3613 landed — and a scoreboard nobody re-runs is exactly
      # the defect this wave exists to kill: a guard that reports green by never running. Measured
      # rather than predicted: this generator, run against #3809's type-scale tree, reds with both
      # artifacts STALE. It shells out to scripts/check-shared-surface.mjs in a child process and
      # reads only committed files, so it needs the checkout and `node` and nothing else — no build,
      # no database, no sandbox env — and takes about two seconds. Do NOT pipe either invocation
      # into `tail`/`head`: a pipe reports the exit code of the LAST command in it.
      #
      # `-C apps/console run`, NOT `-F console`, and that is the whole point of this step. MEASURED
      # on this branch's first CI run, before #3618's generator existed on `dev`: `pnpm -F console
      # audit:report` printed `None of the selected packages has a "audit:report" script` and EXITED
      # 0. Both steps concluded `success` having run nothing — a wiring step whose own failure mode
      # is the defect it was added to prevent. `pnpm -C apps/console run` fails that case loudly
      # (`ERR_PNPM_NO_SCRIPT`, exit 1) while still going through the package.json alias the error
      # message tells you to run, so a renamed or deleted script reds here instead of going quiet.
      # The `--self-test` step below keeps that form, and stays BLOCKING.
      #
      # ── SINCE #7594 THE SYNC CHECK IS A REPORT ON A PR, NOT A GATE ──────────────────────────────
      # Both files carry aggregate totals, so N PRs that each regenerated them against their own
      # tree merged cleanly and WRONGLY: every queue batch holding two of them failed this step, and
      # every landing made every other list PR stale. The epic of ~12 list PRs went through strictly
      # one at a time, ~40 min each. So a PR no longer commits them: this step regenerates against
      # the PR's merge ref and prints the diff (log + step summary) so a reviewer still sees the PR's
      # conformance effect, then restores the two files and passes. Exit 2 (stale) is the only code
      # it absorbs — exit 1 is a REFUSAL (a route group renamed, a page's import deleted, a scan root
      # moved) and still fails. Freshness moved to dev: .github/workflows/ui-conformance-scoreboard.yml
      # regenerates on every push to dev, opens ONE bot PR, and goes red when that PR has been open
      # longer than 24h or dev is stale with no bot PR.
      #
      # The diff is against the MERGE ref, so while a bot PR is pending it includes dev's own lag
      # as well as this PR's effect; the summary says so.
      #
      # `node` directly, not `pnpm -C … run`: pnpm's own "Command failed" wrapper would have to be
      # trusted to pass exit 2 through unchanged, and this step's whole logic is that one number.
      # A missing file still fails loudly (`Cannot find module`, exit 1).
      - name: The console UI conformance scoreboard — this PR's effect (a report; dev regenerates it)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          files=(apps/console/docs/ui-conformance/scoreboard.md apps/console/ui-conformance-baseline.json)
          rc=0
          node apps/console/scripts/audit-report.mjs || rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -ne 2 ]; then
            echo "::error title=UI conformance scoreboard::audit-report REFUSED to report (exit $rc) — that is a broken subject set, not staleness, and it still fails."
            exit "$rc"
          fi
          node apps/console/scripts/audit-report.mjs --write
          git diff --stat -- "${files[@]}"
          git diff --no-color -- "${files[0]}" > "$RUNNER_TEMP/scoreboard.diff" || true
          {
            echo "### UI conformance scoreboard — this PR's effect (report only, never fails)"
            echo
            echo "Regenerated against this PR's merge ref. Nothing to commit: dev's copy is regenerated after merge by \`.github/workflows/ui-conformance-scoreboard.yml\` (#7594)."
            echo "If a \`chore(console): regenerate the UI conformance scoreboard\` PR is open, this diff also includes dev's own pending regeneration."
            echo
            echo '```diff'
            head -n 400 "$RUNNER_TEMP/scoreboard.diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          head -n 400 "$RUNNER_TEMP/scoreboard.diff"
          git checkout -- "${files[@]}"
          echo "::notice title=UI conformance scoreboard::This PR moves the console conformance scoreboard (diff above and in the step summary). Report only — dev regenerates it (#7594)."
      - name: ...and that generator is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run audit:report --self-test
      # packages/brand/src/ramp-srgb.ts is a hand-maintained sRGB copy of the OKLCH ramp in
      # tokens.css, for the three surfaces that cannot read a custom property (email, Stripe
      # Elements across an iframe, next/og). It fixed three disagreeing transcriptions by
      # becoming a fourth, and nothing checked it. The CLI's lipgloss ink ramp is generated
      # FROM that file, so a drift here reaches the terminal and makes the CLI a mirror of a
      # copy. The check is arithmetic — every hex is recomputed from the `// oklch(...)`
      # comment each line carries — so it needs no fifth table to compare against.
      - name: Brand sRGB ramp is still a transcription of tokens.css
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:ramp-transcription
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-ramp-transcription.mjs --self-test
      # PROGRAMME.md replaced fifteen hand-maintained boards that had begun contradicting each
      # other in the tree while passing CI, and its §3 says the intent-half grep is "the only
      # structural reason a 16th hand-maintained board cannot re-emerge inside this very file" —
      # inside THAT file. Nothing stopped a new one appearing beside it, and nothing in CI read any
      # of the twelve. A status claim under docs/testing now either derives from the ledger with a
      # diff gate, or is declared with the reason it is still written by hand.
      - name: Every status claim under docs/testing is generated or declared
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:one-board
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-one-board.mjs --self-test
      - name: Runner self-image is baked, matches its job, and is multi-arch
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:runner-self-image
      - name: Community edition type-checks without enterprise activation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          ALETHIA_EDITION: community
          # Same heap as the TypeScript job's type-check: the console's tsc outgrew Node's default.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm -C apps/console run check-types
      - name: Installed dependency licence inventory has no unknown metadata
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm compliance:licenses
      - name: Generate workspace SBOM and community-source evidence
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm compliance:release
          pnpm source:community
      # ONE ARTEFACT PER STEP, because `if-no-files-found` is AGGREGATE (#4347). The action runs a
      # single combined glob over every `path:` entry and tests `filesToUpload.length === 0` once,
      # so `error` fires only when NOTHING AT ALL matched. These two directories come from two
      # different commands in the step above — `pnpm compliance:release` and `pnpm source:community`
      # — and while they shared a step, either one producing its tree covered for the other
      # producing nothing. Do not merge them back, and do not add a third path to either: every
      # entry added widens the set of ways the guard is satisfied by something other than the thing
      # it is guarding. `pnpm check:upload-aggregate` refuses the merged shape.
      #
      # Splitting a step makes the second half skippable when the first fails, which would trade one
      # silent gap for another. Here the `guards` job's own independence rule already covers it:
      # every step carries `steps.setup.outcome == 'success'`, so the community-source upload still
      # runs when the compliance upload has just gone red. The floors dispatch below has no such
      # rule and needed an explicit `if:`.
      - name: Upload compliance evidence
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: compliance-${{ github.sha }}
          path: dist/compliance
          if-no-files-found: error
          retention-days: 30
      - name: Upload community-source evidence
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: community-source-${{ github.sha }}
          path: dist/community-source
          if-no-files-found: error
          retention-days: 30
      - name: No Supabase
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:no-supabase
      - name: No arbitrary var utility shadowed by an unlayered brand device
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:var-utility-shadowing
      - name: Authz scope (PDP, not ad-hoc user_id)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:authz-scope
      - name: Guard — revalidatePath targets resolve to real routes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:revalidate-paths
      - name: Guard — every "use server" export establishes its caller
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:action-boundary
      - name: ...and that guard is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node apps/console/scripts/check-action-boundary.mjs --self-test
      - name: Marketing routes ⇄ reservation ⇄ Caddy in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:marketing-routes
      - name: tsconfig.build.json excludes every un-shipped file (pruned-image type-check)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:tsconfig-build
      # Dead code in the console (knip). The script first asserts that every `entry` glob in
      # apps/console/knip.json still matches at least one file on disk, and FAILS if one does
      # not: a knip run that resolves no entry points treats nothing as reachable, so it can
      # report a clean bill of health while having analysed nothing. "Nothing found" and
      # "nothing wrong" must not share an exit code.
      #
      # Fatal today: unused files, unused (dev)dependencies, unlisted/unresolved imports,
      # unlisted binaries, duplicate exports. Unused EXPORTS and TYPES are `warn` in knip.json
      # — they are printed on every run but do not fail it, because the console carries a
      # ~580-strong backlog of them that this lane's scope (knip.json + package.json) cannot
      # delete. Ratchet those two rules to "error" once that backlog is cleared.
      - name: Dead code — unused files, deps and binaries in the console (knip)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:dead-code
      - name: Drizzle migration history is unforked (linear snapshot chain)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:migrations
      - name: Every canvas offer is buildable on every cloud, or documented (offer parity)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:offer-parity
      - name: Offer-parity matrix is in sync with the code
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:offer-parity
          git diff --exit-code -- docs/testing/offer-parity.md \
            || { echo "::error::docs/testing/offer-parity.md is stale — run 'pnpm -C apps/console run gen:offer-parity' and commit."; exit 1; }
      # The sibling of offer parity, on a different unit: offer parity asks whether a CHOICE the
      # canvas presents is buildable, this asks whether the VALUE a user typed reaches the plan. A
      # choice can be perfectly buildable while the number beside it is discarded — #1981 shipped a
      # cache allow-list that saved cleanly, provisioned nothing, and left the cache open.
      - name: Every value the product collects reaches the plan, or is documented (config carriage)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:config-carriage
      - name: Config-carriage board is in sync with the code
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:config-carriage
          git diff --exit-code -- docs/testing/config-carriage.md \
            || { echo "::error::docs/testing/config-carriage.md is stale — run 'pnpm -C apps/console run gen:config-carriage' and commit."; exit 1; }
      # The third parity unit, and the one that closes a hole the first two structurally could not
      # see: BOTH of the guards above derive their surface from the canvas — offer parity from the
      # offer list, config carriage from user-settable columns. A capability that exists only as a
      # TEMPLATE VARIABLE is invisible to them, so no guard could red it and no deferral about it
      # could go stale. AWS envelope-encrypted Kubernetes Secrets for the entire life of the
      # templates while three clouds did not, unboarded and unexcluded (#2004).
      - name: Every asymmetric template variable is recorded (template parity)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:template-parity
      # The fourth unit, and the one CUSTOMIZABILITY-PARITY.md said could not exist ("no guard can red
      # any cell on this page"). Template parity above asks whether the five templates AGREE; this
      # asks whether a variable one of them declares can be REACHED and is READ. `gke_spot` was
      # declared, defaulted true, reachable and consumed by nothing — the template advertised Spot
      # node pools it never provisioned, and every count in the repo credited it as a working knob.
      - name: Every declared template knob is reachable and read (template knobs)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:template-knobs
      - name: Template-parity board is in sync with the templates
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:template-parity
          git diff --exit-code -- docs/testing/template-parity.md \
            || { echo "::error::docs/testing/template-parity.md is stale — run 'pnpm -C apps/console run gen:template-parity' and commit."; exit 1; }
      - name: Keyless cells agree with the code that implements them
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:keyless-cells
      # The canvas gates the IAM-auth toggle on this table (#1510). Hand-mirroring it would only
      # DETECT drift; generating it makes drift impossible — and the table churns (aws/gcp MySQL
      # opened four lanes after it was first written).
      - name: Keyless cell mirror is in sync with the renderer (keyless.go → keyless-cells.ts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:keyless-cells
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/keyless-cells.ts \
            || { echo "::error::Generated keyless-cells.ts is stale — run 'pnpm -C apps/console run gen:keyless-cells' and commit (source of truth: packages/core/manifests/keyless.go)."; exit 1; }
      # The inspector's per-cloud node-disk floors (#1972). Same shape: the floors live in the
      # templates' own `>= N` validations (the literals the Go constants are pinned to by
      # TestNodeDiskFloorsMatchTemplates); the canvas reads a generated mirror of them, so a floor
      # bump in a template that isn't regenerated here fails the build instead of drifting.
      - name: Node-disk floors are in sync with the templates (variables.tf → node-disk.ts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:node-disk
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/node-disk.ts \
            || { echo "::error::Generated node-disk.ts is stale — run 'pnpm -C apps/console run gen:node-disk' and commit (source of truth: each template's disk-size variable)."; exit 1; }
      # The offer surface — which canvas switches a user can actually see, per cloud. Derived by
      # EVALUATING the inspector schema's visibleWhen predicates, because they are closures over
      # (config, provider, capabilities) that no pattern-match can read. Checked in so the answer is
      # reviewable, and diffed so it cannot move silently: adding a gate to a field is a real change
      # to what the product offers, and until now it moved nothing a reviewer could see.
      - name: Offer surface is in sync with the inspector schema (config-schema.ts → offer-surface.json)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:offer-surface
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/offer-surface.json \
            || { echo "::error::Generated offer-surface.json is stale — run 'pnpm -C apps/console run gen:offer-surface' and commit (source of truth: apps/console/components/design-project/canvas/inspector/config-schema.ts)."; exit 1; }
      # The template-knob manifest — which template variable a user can actually SET, per cloud, per
      # component. Derived from the templates' `variables.tf` and the Go providers' passthrough call
      # sites, and diff-gated for the same reason as the offer surface above: the console's card UI
      # reads the manifest, so a stale one offers knobs the templates no longer declare. The paired
      # guard (`check:template-knobs`, in the parity block above) fails on a knob that is
      # declared, reachable and read by NOTHING — the `gke_spot` shape.
      - name: Template-knob manifest is in sync with the templates (variables.tf + *_provider.go → template-knobs.json)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:template-knobs
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/template-knobs.json docs/testing/template-knobs.md \
            || { echo "::error::Generated template-knobs.json / docs/testing/template-knobs.md are stale — run 'pnpm -C apps/console run gen:template-knobs' and commit (source of truth: each template's root variables and packages/core/cloud/*_provider.go)."; exit 1; }
      # Same shape, same reason (#1621). Which secret stores a cluster can actually read is decided by
      # which store hook each provider registers in Go; the canvas greys out the rest. That answer was
      # a hand-written TS list of two slugs, free to drift from the hooks — and in the direction that
      # matters, a stale list lets the user pick a store the cluster will never resolve, surfacing at
      # deploy time as unresolved secrets rather than at config time. The paired Go test
      # (categories/secrets_runtime_read_mirror_test.go) proves the generator READ the source right.
      - name: Secrets runtime-read mirror is in sync with the hooks (secrets_*.go → secrets-runtime-read.ts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:secrets-runtime-read
          git diff --exit-code -- apps/console/lib/connectors/generated/secrets-runtime-read.ts \
            || { echo "::error::Generated secrets-runtime-read.ts is stale — run 'pnpm -C apps/console run gen:secrets-runtime-read' and commit (source of truth: the saasSecretStore / keylessSecretStore hooks in packages/core/categories/secrets_*.go)."; exit 1; }
      - name: Project templates pin their providers (tofu lock files, no -upgrade)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:tofu-lockfiles
      - name: Shipped version defaults are mutually compatible (compat matrix)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run check:compat
      - name: CLI contract fixtures are in sync with the Zod contract
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:cli-fixtures
          git diff --exit-code -- packages/core/api/testdata \
            || { echo "::error::CLI fixtures are stale — run 'pnpm -C apps/console run gen:cli-fixtures' and commit (the Go contract test will then name any struct field to update)."; exit 1; }
      - name: Go enum constants are in sync with the drizzle enums
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:go-enums
          git diff --exit-code -- packages/core/types/enums_gen.go \
            || { echo "::error::Go enum constants are stale — run 'pnpm -C apps/console run gen:go-enums' and commit. The Go build + exhaustive lint then flag any switch/map to update."; exit 1; }
      # The brand's terminal projection. Two failures ride on one command, and they are
      # different problems with different fixes, so the generator distinguishes them itself:
      # a NEW TOKEN WITH NO PROJECTION makes it exit 1 without writing anything (its own
      # ::error:: names the token), and a stale committed file makes the diff below fire. The
      # first is the one this step exists for — a token added to the console that nobody
      # decided the CLI's answer for is invisible in every other check, and the two surfaces
      # drift by omission rather than by disagreement.
      - name: Every brand token is projected, lossy or refused (tokens.css → brand_gen.go)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:go-brand
          git diff --exit-code -- packages/core/types/brand_gen.go \
            || { echo "::error::The Go brand projection is stale — run 'pnpm -C apps/console run gen:go-brand' and commit (source of truth: packages/brand/src/tokens.css for the values, apps/console/scripts/lib/brand-projection.ts for the exact/lossy/none decisions)."; exit 1; }
      # The console's route tree, projected into Go so the CLI can build deep links over it. Same
      # shape and same reason as the two above: before it, the ONE link the CLI built was
      # `{origin}/dashboard` — a legacy catch-all that 307s to the org root — so `project get --open`
      # did not open the project, and nothing could tell, because the URL was a string literal in Go
      # and the routes are directories in a Next.js app. A route the console renames now removes a
      # constant, and every Go builder over it stops compiling.
      - name: The CLI's deep links match the console's route tree (app/(private)/** → routes_gen.go)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:go-routes
          git diff --exit-code -- packages/core/routing/routes_gen.go \
            || { echo "::error::The Go route table is stale — run 'pnpm -C apps/console run gen:go-routes' and commit (source of truth: apps/console/app/(private)/** through scripts/lib/console-routes.mjs). A route the CLI links to may have moved."; exit 1; }
      # The status vocabulary, on the same shape and for the same reason. The CLI decided a status
      # glyph from nine uppercase words with no case folding while the console decided it from 28
      # lower-cased keys; they disagreed on seven measured cases, and six pgEnums that shout on the
      # wire missed every arm of the Go switch. There is one table now and TypeScript owns it.
      #
      # As with the brand, TWO failures ride on one command and the generator distinguishes them
      # itself: a status word that NO pgEnum spells and that apps/console/scripts/lib/status-vocab.ts
      # does not account for makes it exit 1 without writing (its own ::error:: names the word),
      # and a stale committed file makes the diff below fire. The first is the one this step is for
      # — STATUS_TIER has no single owner, so a word added to it is a word the CLI renders with no
      # idea where it came from, and the two surfaces drift by OMISSION rather than by disagreement.
      - name: Every status word has a provenance (status-badge.tsx → vocab_gen.go)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:go-vocab
          git diff --exit-code -- packages/core/types/vocab_gen.go \
            || { echo "::error::The Go status vocabulary is stale — run 'pnpm -C apps/console run gen:go-vocab' and commit (source of truth: packages/ui/src/status-badge.tsx for the words and tiers, apps/console/lib/db/schema for their provenance, apps/console/scripts/lib/status-vocab.ts for the terminal projection)."; exit 1; }
      # The formatter contract both surfaces are held to. @repo/format decides what `47 min`,
      # `2h 15m` and `$12.50/mo` look like for the console; packages/core/format will be held to
      # the same table for the CLI, which today renders $12.50 as `$12/mo` (Go's %.0f rounds half
      # to EVEN) and runner minutes as `0`. The table is GENERATED from the TS implementation, so
      # it is a mirror of TS rather than a third opinion — and Go cannot write it, so a Go-only
      # change has no way to make itself right.
      - name: Formatter conformance table is in sync with @repo/format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:format-conformance
          git diff --exit-code -- packages/format/conformance/format-cases.json \
            || { echo "::error::The formatter conformance table is stale — run 'pnpm -C apps/console run gen:format-conformance' and commit. NOTE this rewrites an EXPECTATION, not a formatting detail: read BOTH lists the generator prints — the changed CASES (~ = an expectation moved, i = only the inputs did) and the changed ARTIFACT KEYS outside \`cases\`, which is where a change to the whole zeroDecimalCharge SET shows up (#4174; before that it printed nothing at all). packages/core/format is held to all of it."; exit 1; }
      # zod -> JSON Schema -> Go (#3670). The generator REFUSES to emit when a registered schema
      # grows a `.refine()` / `.transform()` nobody disposed of, because z.toJSONSchema drops those
      # silently — so a CLI built on its output would enforce a fraction of the console's rules
      # while looking like it enforced all of them. The self-test runs FIRST and on its own: it
      # drives every refusal over a synthetic schema, so a generator that had stopped refusing
      # anything would still regenerate a byte-identical artifact and pass the diff-gate below.
      - name: The validation generator still refuses what it is supposed to refuse
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run gen:go-validation:self-test
      - name: Shared validation specs are in sync with the console's zod schemas
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:go-validation
          git diff --exit-code -- packages/core/validate/spec_gen.go packages/core/validate/testdata \
            || { echo "::error::The shared validation artifacts are stale — run 'pnpm -C apps/console run gen:go-validation' and commit. NOTE the case table is an EXPECTATION packages/core/validate is held to, not a formatting detail: read the changed-case list the generator prints."; exit 1; }
      # The name grammar and the slug algorithm, on both surfaces. Two artifacts, one generator:
      # names_gen.go carries the DATA (the DNS-1123 pattern, the limits, the reserved environment
      # names) and name-cases.json carries the ALGORITHM contract, produced by running the real
      # lib/utils/slugify.ts. Go can write neither, so a Go-only change cannot make itself right.
      # The same run also refuses a SIXTH slugifier: the generator censuses every tracked source
      # file for slug-shaped expressions and fails on one that is not declared with a reason.
      - name: Name grammar + slug conformance are in sync (and no second slugifier)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:go-names
          git diff --exit-code -- packages/core/names/names_gen.go packages/core/names/testdata/name-cases.json \
            || { echo "::error::The generated name grammar or the slug conformance table is stale — run 'pnpm -C apps/console run gen:go-names' and commit. NOTE name-cases.json is an EXPECTATION packages/core/names is held to, not a snapshot: read the changed-case list the generator prints."; exit 1; }
      - name: Compat matrix mirror is in sync with the SSOT (matrix.json → matrix.ts)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:matrix
          git diff --exit-code -- apps/console/lib/compat/generated/matrix.ts \
            || { echo "::error::Compat matrix.ts is stale — run 'pnpm -C apps/console run gen:matrix' and commit (source of truth: packages/core/compat/matrix.json)."; exit 1; }
      # gen-catalog.mjs has claimed "CI re-runs it and fails on drift" since it was written; until
      # #1373 nothing did. It also re-runs the generator's fail-fast shape guards (every engine has a
      # non-empty versions[] containing its default, and the snake + camel surfaces agree), so a
      # malformed catalog.json reds here rather than at someone's next apply.
      #
      # The same run writes the data half of @repo/cloud-catalog (which clouds exist and which are
      # offered), so both outputs are held by this one diff. It also re-runs the availability
      # refusals: an entry with no `availability`, the two provider blocks disagreeing, or no cloud
      # available. `git diff` sees tracked files only, which is enough: both paths are committed.
      - name: Cloud catalog mirrors are in sync with the SSOT (catalog.json → catalog.ts, @repo/cloud-catalog)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm -C apps/console run gen:catalog
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/catalog.ts packages/cloud-catalog/src/generated.ts \
            || { echo "::error::A generated cloud catalog file is stale — run 'pnpm -C apps/console run gen:catalog' and commit both outputs (source of truth: packages/core/catalog/catalog.json)."; exit 1; }
      - name: Catalog drift scout's pure parsers/differ hold (derive:catalog --self-test)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm -C apps/console run derive:catalog -- --self-test
      - name: Tests exercise real source (anti-vacuous-test tripwire)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-test-imports.mjs
      - name: Go tests exercise real source (anti-vacuous-test tripwire, verify + runner)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-go-test-imports.mjs
      # A `_arm64`/`_linux`/`_windows_amd64` filename suffix is an implicit Go build constraint
      # (#5593). karpenter_arm64_test.go compiled on arm64 laptops and NEVER on these amd64
      # runners, so its tests and coverage vanished with nothing red (#5579). Platform-specific
      # files on purpose are listed, with a reason, in scripts/check-go-arch-filenames.allowlist.
      - name: No Go file is skipped by an accidental GOOS/GOARCH filename suffix
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:go-arch-filenames
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-go-arch-filenames.mjs --self-test
      # The console suite runs as `turbo run test` over a restored .turbo/cache, so a test that reads a
      # file OUTSIDE apps/console (the Go catalog, an infra template, the deploy workflow, a docs/legal
      # page) was replayed green from cache on a PR that changed only that file (#5638). This derives
      # every repo file the suite reads from the test sources and fails when one is missing from
      # console#test's turbo inputs (apps/console/turbo.json), or when an entry there is read by nothing.
      - name: Every file a console test reads is in its turbo cache key
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:console-test-inputs
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-console-test-inputs.mjs --self-test
      - name: Connector setup artifacts in sync (infra/connector ⇄ console public)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-connector-assets.mjs
      - name: SPDX headers are legal-form-agnostic (Alethia Labs, no OÜ/DPK)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-license-headers.mjs
      # #4986: the Google Fonts loader downloads fonts at build time, and a CDN blip failed builds on
      # unrelated PRs. The faces are vendored in packages/brand; this keeps the loader from returning.
      - name: No app loads fonts from the network at build time (#4986)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/check-no-network-fonts.mjs --self-test
          node scripts/check-no-network-fonts.mjs
      # The IP-activation path is dormant code until the founder assignment is signed, and dormant
      # code rots silently. It rewrites eleven exact prose markers across eight legal files; edit any
      # of that wording and the activation would refuse at the worst possible moment. This runs the
      # real rewrite against synthetic evidence, so the markers are proven on every PR.
      - name: IP-activation markers still match the legal prose (#2366)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/legal/activate-company-ip.mjs --check-markers
      - name: Docs describe a repo that exists (paths · scripts · blocked commands)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-docs-contract.mjs
      # The GCP template page named `cloudsql.tf` and `vpn.tf`, which never existed (#5560). This
      # fails when an infrastructure-template docs page names a `.tf` file or a `modules/<name>/`
      # directory that is not in the template directory the page describes.
      - name: Template docs name only template files that exist (#5560)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:template-docs
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-template-docs-files.mjs --self-test
      # A clickwrap record names a Terms VERSION. If the text behind that version can move, the
      # record proves nothing about what the user actually agreed to — so every public legal
      # document is pinned by the SHA-256 of its source, and editing one without re-sealing is a
      # hard failure rather than a silent re-description of the past (#2372).
      - name: Legal documents match their sealed content hash
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-legal-document-hashes.mjs
      # The contributor agreements are sealed BEFORE they are active, and that is the point: the
      # window between counsel approving the text and activation switching enforcement on is exactly
      # when an unnoticed edit would be most damaging. Also guards cla/ACTIVE against disagreeing
      # with the seal once it exists (#2374).
      - name: Contributor agreements match their sealed hash
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/legal/check-cla-hashes.mjs
      # No lawyer reviews the legal set, so the text has to be checkable against the code (#6778).
      # docs/legal/legal-set.json lists every legal document with its owner unit, and ties quoted
      # statements to the file that makes each one true. This fails when a document is missing from
      # the register, when a quoted statement has left its page, and when the code a statement
      # rests on has changed. It reads no network and needs no install.
      - name: Legal-set register and claims ledger still match the tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-legal-set.mjs
      - name: ...and that check is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-legal-set.mjs --self-test
      # Four hermetic suites that ran NOWHERE until now — no network, no gh, no docker.
      # wt-lease-hook-test.sh replays incident #1247 (one instance committing another's
      # uncommitted work) against a real throwaway leased worktree; it is the only proof
      # the lease actually holds, and it was never executed by CI.
      # The count used to be written into this name by hand and went stale the first time the suite
      # grew (13 → 19 in #4599). The suite prints its own tally; the step no longer asserts one.
      - name: Worktree lease protocol (pid-reuse, nested worktrees, the ownership ladder)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/lib/wt-lease.sh --self-test
      - name: 'Worktree lease guard — replays incident #1247'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/lib/wt-lease-hook-test.sh
      # `wt:dehydrate` runs `rm -rf` over directories it selects itself. This suite is the only
      # thing that checks WHAT SURVIVES a reap — uncommitted work, untracked files, tracked files
      # inside an ignored node_modules, a symlinked one, and the worktree itself — and the only
      # thing that pins the three-mode refusal of a live-held tree (an agent, a HUMAN with no agent
      # marker, and ALETHIA_ALLOW_FOREIGN_WT=1; the last two deleted a held tree until #4599).
      # "Tested only when someone remembers" is not a steady state for a destructive command.
      - name: 'Worktree dehydrate — what survives an rm -rf, and who is refused'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/worktree.sh --self-test
      # release-runner's ECS roll skips when there is no fleet (#3438 ruling) and must fail on
      # every other error. That split is only checked on a real release, which is far too late, so
      # this pins it against a stub `aws`: absent → notice and pass, AccessDenied → fail, and a
      # roll error on an ACTIVE service → fail.
      - name: 'Runner ECS roll — skips an absent fleet, fails on everything else'
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash .github/scripts/runner-ecs-roll.sh --self-test
      # The env registry used to key ownership on `user@host`, which every agent, worktree and shell
      # on one machine shares — so env:reap's "someone else is working on this box" could not fire
      # locally, and a finished lane deleted the box out from under a live one (#3841). The identity
      # is now the worktree lease's. The first step pins the identity and the decision; the second
      # drives `env:reap --dry-run` itself against fixture registries, because the defect was never
      # in the decision's logic — it was that nothing could reach it.
      - name: Env ownership identity + reap decision (#3841)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/lib/env-owner.sh --self-test
      # Quoted: an unquoted " #3841" is a YAML COMMENT, and the step name would lose the issue
      # number it exists to carry (the #1247 step above has that bug).
      - name: "env:reap refusal — replays incident #3841 against env.sh"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/lib/env-reap-test.sh
      # A stopped `env:check` used to leave its vitest workers running on the SHARED box — three
      # per abandoned run, one set measured at 8h40m, and nothing on the box reaps them (#4343).
      # The fix is three traps, an exit-code contract and a matcher that decides what dies on a
      # machine other people are working on; `bash -n` two hundred lines below parses every line of
      # it and calls none. This step also pins the CALL SITES — a tag exported one line too early
      # puts `playwright install --with-deps`, apt/dpkg as root, inside the blast radius — and five
      # of its mutants edit env.sh rather than the lib, because the first version of that guard
      # anchored on a COMMENT mentioning the command and passed the exact defect it was written
      # for. An assertion nothing has ever made fail is a claim, not a check.
      - name: "Suite-reap trap + scope — replays incident #4343 (15 mutations, 5 on the call sites)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/lib/env-suite-reap-test.sh
      # A dynamic Mac IP stranded a billing box for ~10h: every env:* command, env:reap and the idle
      # timer all need SSH, and the allowlist was a hand-edited /32 (#5025). env.sh now refreshes it
      # with an OpenTofu apply confined to the firewall — and "confined" is a jq filter over a plan,
      # so this step drives it against fixture plans that also touch the server, replace or re-port
      # the firewall, import, move, or omit it, with stubbed curl/tofu/hcloud/ssh; then mutates
      # env.sh ten times and requires every mutant to fail a named case.
      - name: "SSH allowlist refresh is firewall-only and fails closed (#5025, 17 cases + 10 mutations)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/lib/env-allowlist-test.sh
      - name: Worktree landed-detection (squash merges; merged-PR-plus-new-commit is NOT landed)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/lib/wt-landed-test.sh
      # A `feat/<name>` left on the remote by a MERGED PR made `pnpm wt <name>` start the new work on
      # the old tip while printing "(off origin/dev)". Measured at 125 commits behind, and the
      # resulting PR would have REVERTED two files with a diff that read as deliberate. The fixture
      # squash-merges, because `--is-ancestor` cannot see a squash and would let the bug pass.
      - name: Worktree start-point honesty (a landed remote branch is not a base)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/worktree-base-test.sh
      # The weekly merge-signal report grades the heavy signals over Mergify's queue builds (#2759).
      # Offline — a fake `gh` serves fixtures — and it mutates the script five times and requires
      # every mutant to fail the suite, so a refusal that quietly became a pass cannot stay green.
      - name: "Merge-signal health grades Mergify queue builds, and refuses a dead or stale source (#2759)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/merge-signal-health-test.sh
      - name: Board claim arbitration (earliest-lease-wins) + PR predicates
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/claim-work.sh --self-test
      # `blocked-by:` is parsed TWICE — by the coordinator that maintains the `blocked` label and by
      # the dashboard that renders the reason — and the two are a contract, not two implementations.
      # They have already drifted once: the dashboard took only the FIRST declaration line while the
      # coordinator unioned every one, so a lane blocked on two issues rendered `◂ #10` and the
      # maintainer closing #10 saw it stay blocked with nothing explaining why. Both self-tests run
      # the SAME fixture file (scripts/lib/board-body-fixtures.json), so a change that moves one
      # parser off the contract reds here instead of waiting for someone to run them by hand.
      # Hermetic, like the steps above: no gh, no network, no board state.
      - name: Board dependency-line parser contract (coordinator half)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/coordinate.sh --self-test
      - name: Board dependency-line parser contract (dashboard half)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/board-dashboard.mjs --self-test
      # The Go coverage ratchet becomes a step inside `Go (build · vet · test · lint)`, a REQUIRED
      # check with no path filter — so it gates every PR in the repository and a false failure
      # stops the merge queue for everyone, not just its author. Three properties are pinned here
      # because each is a way it could wedge the repo:
      #   · the arithmetic is integer cross-multiplication, never a percentage. packages/core/git
      #     is 185/291 = 63.5739% and DISPLAYS as 63.6%; comparing displayed values fails with
      #     zero code change, forever.
      #   · the fail-open set (unparseable floors from a hand-resolved conflict, partial profile,
      #     unknown covermode, new/deleted package) — the gate may only fail on a real regression.
      #   · the floors JSON layout, asserted with a real `git merge-file`: two PRs each raising a
      #     DIFFERENT, ADJACENT package must merge clean, or every concurrent Go PR conflicts.
      # Hermetic: no go, no network, no repo state.
      - name: Go coverage ratchet (arithmetic · fail-open set · merge-safe layout)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/go-coverage.sh --self-test
      # The TypeScript half of the same design — the ratchet steps of `ts-test`, a part of the
      # REQUIRED `TypeScript (lint · types · test · docs)` check with NO path filter (that context
      # is the aggregator and fails when `ts-test` does), so it gates every PR in the
      # repository and a false failure stops the merge queue for everyone. Five properties are
      # pinned here, because each is a way it could wedge the repo:
      #   · the arithmetic is integer cross-multiplication, never a percentage — including the
      #     rounding trap where 185/291 displays as "63.6%", so a stored display value would fail
      #     its own floor with zero code change, forever.
      #   · the measurement derives from coverage-final.json's statementMap — the artefact vitest
      #     emits BY DEFAULT — never from coverage-summary.json's rolled-up integers, and it
      #     rejects any record whose statementMap and s disagree. That last check is a corruption
      #     tripwire the summary artefact structurally cannot express.
      #   · the fail-open set F1..F10, each branch reached deliberately: unparseable floors from a
      #     hand-resolved conflict, an absent or truncated artefact, a fingerprint mismatch, a
      #     collapsed denominator, a directory with no floor yet.
      #   · the floors JSON layout, asserted with a REAL `git merge-file`: two PRs each raising a
      #     DIFFERENT, ADJACENT directory must merge clean, or every concurrent TS PR conflicts on
      #     a generated file nobody is allowed to hand-resolve.
      #   · that ci.yml carries a ratchet step for every vitest project declaring a coverage block
      #     — the guard's own guard, so a new project cannot join un-gated.
      # Hermetic: no suites, no network, no installed tree.
      - name: TS coverage ratchet (arithmetic · fail-open set · merge-safe layout · scope)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ts-coverage.mjs --self-test
      # A floor can only be honest about a scope somebody checked. These two steps check the SCOPE
      # the floors above are taken over: every coverage exclusion carries a manifest entry, and
      # every tier-separation claim is re-read from the suite it names rather than believed as
      # prose. #3262 exists because one such claim — "convergence/reap/GC verified by
      # reconcile-b2c.test.ts" — was false for eight weeks: that suite never imports the GC module.
      # Both run in THIS job deliberately, not as a new required check: adding one needs a
      # `tofu apply` in infra/github/, and an unapplied required check blocks every PR.
      # Hermetic, like the steps above: no suites, no network, no installed tree.
      - name: Coverage-exclusion guard self-test (classifier, not path)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-coverage-exclusions.mjs --self-test
      - name: Every coverage exclusion is manifested, and every claim re-read
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:coverage-exclusions
      # The self-test above proves the ratchet's ARITHMETIC. This proves its PREMISE: that the
      # environment each committed floors file records is one the enforcing job can actually
      # reproduce. A recorded axis the job can never match demotes every regression to a warning,
      # so the gate passes forever while looking exactly like a gate that is holding.
      - name: Floors fingerprint is reproducible by the job that enforces it
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:floors-reproducible
      # And this proves the VEHICLE. The probe that records those floors is
      # `workflow_dispatch`-only, so nothing exercises its body on a PR — a defect in it is
      # invisible until someone dispatches it, which is how its project list stayed three long
      # against a record of six for as long as it did (#3265). The assertion that matters most is
      # the one that says it MEASURED every recorded project: `--print` fails open (F2) and prints
      # no rows at all for a project with no artefact, so an absence is silence rather than a zero,
      # and five identical silences are perfectly "deterministic".
      - name: The determinism probe measures every project the sweep record names
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: scripts/ci/ts-coverage-probe.sh --self-test
      - name: Board decomposition validator (disjoint scopes, acyclic DAG)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/decompose-validate.mjs --self-test
      # The scope-glob matcher those three surfaces now SHARE (scripts/lib/scope-overlap.mjs): the
      # step above validates a proposal at seed time, coordinate.sh's report asks the same question
      # continuously, and board-dashboard.mjs renders it. Until #4115 they were three answers — a
      # real matcher, a separator-less `startsWith` copy, and, in the report, nothing at all while
      # COORDINATION.md said otherwise. Two properties are pinned, because each is a way the check
      # could go quietly wrong:
      #   · the predicate. Expected values are hand-authored data in board-body-fixtures.json, and
      #     the suite additionally runs them against two DELIBERATELY BROKEN matchers and fails if
      #     either passes — a fixture set a broken matcher satisfies discriminates nothing.
      #   · the three outcomes. A board whose scopes could not be READ must never render as a clean
      #     one; the suite asserts the ✓ marker appears only for a verdict that earned it.
      # Hermetic, like the steps above: no gh, no network, no board state.
      - name: Board scope-overlap matcher (one predicate · three outcomes · mutation controls)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/lib/scope-overlap.mjs --self-test
      # …and the question that matcher STRUCTURALLY CANNOT ask (#4442). It compares the scopes units
      # DECLARE; only a PR knows which files a unit actually touched. A wrong `scope:` line is
      # therefore counted as disjoint and buys a "no overlap" verdict it has not earned — which is
      # how #4441 came to edit five files #4270 owned and three #4268 owned while the board reported
      # "compared, no overlap: 26 of 26".
      #
      # Hermetic half first. The fixtures include the incident REPLAYED — #4309's scope as declared
      # against four of the files its PR changed — because the live PR no longer reproduces it: that
      # scope has since been widened to 35 globs, exactly matching its diff.
      - name: A PR's files are inside the scope of the unit it closes (no network)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-pr-scope.mjs --self-test
      # …and the live question, against THIS pull request. Blocking on purpose, unlike the
      # scheduled-measurement guard beside it: that one reports on the state of ANOTHER ref and is
      # expected to be red through a promotion window, while this one reports on the diff in front of
      # it, and the remedy — widen the `scope:` line, or move the file to the unit that owns it — is
      # in the author's hands. On a non-PR event it prints that it measured nothing and exits 0.
      - name: ...and no changed file belongs to a different open unit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # A PR into staging/main closes nothing (close-on-dev-merge.yml fires on dev only), so the
          # script measures nothing for it and says so (#5948).
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: node scripts/ci/check-pr-scope.mjs
      # Every go.work module gets Dependabot version updates. test/e2e replaces packages/core, so a
      # core bump that skips it leaves test/e2e/go.mod untidy and the GOWORK=off tidy check red
      # until someone hand-pushes a tidy (#5948). Hermetic: reads two files, no network.
      - name: Dependabot gomod covers every go.work module (self-test)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-dependabot-gomod.mjs --self-test
      - name: ...and every go.work module is in the gomod directories
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-dependabot-gomod.mjs
      # One react, and one react-dom peered on it. `react-dom@A(react@B)` with A ≠ B makes
      # react-dom/server throw on every email render (#2151). It landed green three times, last by a
      # Dependabot react bump (#4885) that raised the manifests and left `pnpm.overrides` behind.
      # Also fails when the zod resolution is not `pnpm.overrides.zod`, or when an override does not
      # satisfy a manifest range, which is how a bump without the override goes red here (#6137).
      # Hermetic: reads package.json, pnpm-lock.yaml and the importers' manifests.
      - name: Lockfile holds one react / react-dom pair and the overridden zod (self-test)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-react-pair.mjs --self-test
      - name: ...and the lockfile holds one react / react-dom pair and the overridden zod
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-react-pair.mjs
      # The CLA gate runs from `pull_request_target` — a privileged token, and comment text written
      # by whoever opened the pull request. It is also DORMANT until `pnpm legal:activate-ip` writes
      # cla/ACTIVE, so nothing exercises it until the day it starts gating every external
      # contribution at once. These fixtures are what stand in for that: both directions of the
      # trusted-actor list (the archived action's `bot*` glob trusted any registrable "bot…" login,
      # and the shell `case` it replaced never matched the real `[bot]` logins at all), an edited
      # signing comment, a third party signing on the author's behalf, and a signature scoped to a
      # superseded CLA version. Hermetic — no network, no gh, no repo state.
      - name: CLA gate decisions (spoofed bots · edited comments · version scoping)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/legal/cla-check-selftest.mjs
      # The capabilities-security REQUIRED check decides which changed files it inspects AT ALL, and a
      # file outside that set is not "passed" — it is never read and the check goes green (#1789). This
      # asserts every known-guarded path still exists AND still matches (a rename that quietly drops a
      # file out of scope reds here, not months later on a green PR), that out-of-scope paths still do
      # not match, and that invariants A–D still fire. It reads the checkout, but runs no git and no
      # network — the invariants are driven from inline fixtures.
      - name: Capabilities-security gate scope + invariants (the guard's own guard)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/security/capabilities-gate.mjs --self-test
      # The nightly rollup is the only thing that reads a real-cloud run's verdict, and it reported a
      # leg that provisioned and FAILED as "gate off — no secret/var wired" (#1613). It is main-gated
      # and runs once a night, so a regression there is invisible for a day and then misattributed to
      # whatever diff is nearby. These fixtures are hermetic — no network, no gh, no token.
      - name: Nightly rollup derivation (a red leg is never "not enabled")
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/nightly-rollup.sh --self-test
      # An e2e exclusion's tracking issue must still be OPEN — the `Issue` field's own docstring in
      # test/e2e/addon_exclusions.go says a closed one "defeats the whole point of the field". Only
      # its SHAPE (`^#\d+$`) was enforced, by a pure test that cannot ask GitHub, and the contract
      # was already broken on dev: the sole entry cited #2717, closed 2026-08-29 (#3524).
      #
      # The guard now has THREE modes, not two, after the maintainer's ruling on #3591:
      # test/e2e/addon_exclusions.go must be OPEN unless the entry is `Permanent: true` (the ruling on
      # #3524: then it names the ruling and need only be FILED); a CLIGap row in test/e2e/t2_cli_demo.go must be
      # OPEN too (our own debt has to be able to close); a CloudManual row there need only be FILED
      # (a cloud ceiling does not lift because its issue did — all four are legitimately closed).
      #
      # THREE steps, because they answer different questions and only one needs the network. The
      # self-test pins the scan and the verdict — including that an UNREADABLE state is an error and
      # never "assume open" — and runs even where the live check cannot. It also carries the ONLY
      # proof that the CLIGap arm discriminates: the live table has zero CLIGap rows, so it mutates
      # the shipped source into one citing a closed issue and asserts the arm reds.
      - name: Exclusion tracking-issue guard self-test (scan + verdict + the CLIGap arm, no network)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-exclusion-issues.mjs --self-test
      # …and the same scans against the REAL files, which are also pure. It BLOCKS, because the
      # tripwires it carries — "found NO Issue fields", a field in a shape the scan cannot read, a
      # row whose Issue cannot be attributed to a verdict, and a verdict name this guard holds a
      # contract over that the file no longer declares — are the ones whose own message says "a
      # guard that silently checks nothing is worse than no guard". Reachable only from the network
      # step below, they could never red the build: a regex that stopped matching produced an
      # annotation on a green job and nothing else.
      - name: Every exclusion and demo-table tracking issue is READABLE (no network)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-exclusion-issues.mjs --scan-only
      # …and the live question. `continue-on-error` DELIBERATELY: an issue closing is a state change
      # in GitHub, not in the diff, so this can go red on a PR that touched nothing — and a guard
      # that blocks unrelated work is a guard people route around. It annotates; the self-test above
      # is the blocking half. Revisit if it turns out to be ignored rather than acted on.
      - name: Every exclusion, and every CLIGap, still names an OPEN issue
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-exclusion-issues.mjs
      # The row the rollup appends must name the commit the RUN executed, not the commit the rollup
      # job happens to be sitting on. Those are different jobs, so any merge between them separates
      # the two — and seven ledger rows already disagree with their own bundle, in BOTH directions,
      # two of them backing cells the grid renders proven (#2718). The sha is now read from the
      # bundle, so row and bundle agree by construction; these fixtures pin that, including the
      # end-to-end case where the caller passes a DIFFERENT sha and it must not reach the ledger.
      - name: Ledger rows name the commit the run executed (not the rollup job's HEAD)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/provisioning-e2e.sh --self-test
      # Which dimension a nightly proved decides the tracking issue's TITLE, and the title is the
      # dedup key: keyed on the cloud alone, the floor and the weekly full bar collapse onto one
      # issue and the second red filed is silently dropped — which is how the full bar ran unwatched
      # for weeks (#1755). Both crons are asserted here because neither is reachable from a PR.
      - name: Nightly dimension resolution (floor and full-bar never collide)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/resolve-dimension.sh --self-test
      # The keyless recorder decides what a run PROVED, and the parity board flips a cell to ✅ only
      # on a PASS row it writes — so a misclassification here is the whole chain. It shipped reading
      # `rc == 0 && grep '^ok|^--- PASS|^PASS'` FIRST, and a Go test that SKIPS prints both markers
      # and exits 0, so an un-configured run — the most likely FIRST run — recorded PASS. That is
      # #1723 inside the script whose header promises to prevent it. These fixtures pin the three
      # shapes of that hazard (a SKIP, a `no tests to run`, and a green T2 that never ran the keyless
      # stage at all) against the summary file the scenario itself writes. Hermetic — no cloud, no
      # network, no repo write.
      - name: Keyless-DB recorder verdicts (a SKIPPED run is BLOCKED, never PASS)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/keyless-db-e2e.sh --self-test
      # The AWS sweeper discovers this run's cluster to reach the resources tofu never owned — the
      # NLB ingress-nginx creates, Karpenter's instances. Discovery fell back to EC2 tags alone, so a
      # teardown that deleted the cluster AND the instances (a hard-killed run's exact end state) left
      # CLUSTER empty, and every cluster-scoped sweep silently became a no-op. Worse, `alive_lbs` in
      # verify_swept is CLUSTER-scoped too, so the sweep exited GREEN with a load balancer billing —
      # run 31929564177 left one standing for eight days. Both directions are asserted: another run's
      # LB must NOT resolve, or the fix would be a wildcard. Hermetic — `aws` is stubbed, no creds.
      - name: AWS sweeper cluster discovery (a dead cluster still reaches its load balancer)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/aws-cleanup.sh --self-test
      # The hcloud sweeper's twin blind spot. The imager provider boots a rescue server and an ssh
      # key named `hcloud-upload-image-*` to build the Talos snapshot, neither carrying a label, and
      # a build that fails mid-resource never lands in state — so the destroy pass cannot see them
      # either. A stopped Hetzner server still bills. They cannot be swept safely (the account is
      # shared, and a CONCURRENT run's upload server matches the same prefix), so they are REPORTED.
      #
      # WHICH STATE they are reported AS is what this step decides, and #3138 got it wrong: it
      # recorded them as UNVERIFIABLE, which gates, so every hetzner leg exited 4 on a sweep that had
      # worked (run 33172643012). Both listings SUCCEED here — the answer is simply that an
      # unlabelled resource exists — so this is UNATTRIBUTABLE: loud, and non-gating. The self-test
      # asserts BOTH ledgers on every case and replays 33172643012 end to end through the exit code,
      # because "it is unattributable" alone passes if a dead credential became unattributable too.
      # Hermetic: `hcloud` is stubbed.
      - name: hcloud sweeper reports what it cannot attribute (imager upload helpers)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/hcloud-cleanup.sh --self-test
      # ── The four-state probe contract, and the reason all five sweepers are asserted here now.
      #
      # Every cloud verified teardown with `<cli> … 2>/dev/null | tr | grep -v '^$' || true`. Three
      # launderings in one line: the redirect drops the reason, the pipe substitutes the LAST
      # stage's status for the cloud call's, and `|| true` normalises what is left. An API that
      # FAILED therefore produced empty stdout and exit 0 — byte-identical to "confirmed gone" —
      # and verify_swept's `[ -n "$x" ]` test read EVERY resource type as clean at once. One
      # expired credential and a leaked Aurora cluster, NAT gateway or EKS control plane billed
      # while the step printed "cleanup verified complete".
      #
      # This is the `always()` teardown path test/e2e/t2_provision_test.go defers to as "the
      # guarantee" — the in-process destroy is allowed to fail BECAUSE the sweeper will catch it.
      # If the sweeper cannot see, nothing does. So each self-test asserts every state end to end,
      # varying the stub's OUTPUT and its EXIT CODE independently: a test that varies only the
      # output passes just as happily with the fix removed, because output was the half that
      # already worked.
      #
      # The FOURTH state is the boundary that fix overshot. UNVERIFIABLE means the probe could not
      # get an answer and it gates; UNATTRIBUTABLE means it DID get one, and the answer is that
      # something exists which by design cannot be tied to this run, so it is reported loudly and
      # does not gate — otherwise the step is red every night and stops being read. Each sweeper
      # asserts both halves, because either alone is satisfiable by the wrong change.
      # Hermetic — every CLI is stubbed, no credentials, no cloud, no spend.
      - name: Sweeper probe contract (an API that did not answer is not an empty account)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/lib/sweep-probe.sh --self-test
      # Which tag KEY a sweeper scopes by, and which of the two handles a discovered resource belongs
      # to (#5096). A CLI-created stack's project-id is its UUID, so it is found only by its
      # `e2e-run` classification; a seeded stack — including every one from before that tag — by
      # project-id. The rule is shared by four sweepers, so it is asserted once here as well as
      # end to end in each of their self-tests. Hermetic — no CLI is called at all.
      - name: Sweeper scope key (a CLI-created stack is found by e2e-run, an old one by project-id)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/lib/scope-key.sh --self-test
      - name: Orphan reaper result contract is secret-free and fail-closed (#2465)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/e2e/reaper-result.mjs --self-test
      - name: GCP sweeper four-state verification
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/gcp-cleanup.sh --self-test
      # The red-gcp-leg diagnostic (#5273): scoped to the run's own cluster, read-only, and never
      # an exit code on the real path. Hermetic — `gcloud` is a stub on PATH.
      - name: GKE operation-error diagnostic (scoped, read-only, never masks the red)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/gke-op-errors.sh --self-test
      - name: Azure sweeper four-state verification
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/azure-cleanup.sh --self-test
      - name: Alibaba sweeper four-state verification
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/alibaba-cleanup.sh --self-test
      # The self-test above shadows the `ali` FUNCTION, so it never sees an argv — and the ALB
      # listers were built from `--Tag.1.Key`, which the pinned aliyun CLI refuses for ALB, so no
      # run could prove an ALB gone (#2545). This pins the exact argv of every tag-filtered lister
      # shape against a stub `aliyun` on PATH, and reads the verdict through the sweeper's exit code.
      # Hermetic — no credentials, no cloud, no spend.
      - name: Alibaba sweeper argv (the CLI accepts what the listers send)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/alibaba-cleanup-argv-test.sh
      # `VERIFY_ONLY=1` is a READ-ONLY mode added to five scripts whose day job is deleting cloud
      # resources (#4398), and its whole licence is that it is safe to point at a live account
      # right after a teardown. That property was asserted only in prose at first: four mutations
      # of the guard — one per structural shape, plus the DRY_RUN/PREFLIGHT refusal — SURVIVED
      # every check in this file. This is the test that kills them, and it also pins the regression
      # where the mode skipped hetzner's CCM-load-balancer reporter and published CLEAN over a
      # question nobody had asked. Hermetic — every CLI is stubbed, no credentials, no cloud.
      - name: VERIFY_ONLY deletes nothing (all five sweepers)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/verify-only-readonly-test.sh
      # Which workflows are red, and have been red for a while. The classifier is the load-bearing
      # part: `skipped` must never read as a failure (a gate-off leg is not a broken pipeline), and
      # three runs is the minimum that can distinguish "dead" from "flaked once". Both are asserted.
      # Hermetic — the classifier is pure and the fixtures are the real 2026-08-24 shape.
      - name: Workflow health classifier (skipped is not a failure)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/workflow-health.mjs --self-test
      # How much CI this repo ASKS FOR, and how long it waits to get it (#4173). The load-bearing
      # part is which jobs count as "waiting": a job with `needs:` is created when its DEPENDENCY
      # finishes, so it starts at once and its ~0 wait is not evidence about runner availability.
      # Two earlier definitions of the metric were dominated by exactly that and reported a healthy
      # 0.0 min against a measured 15-minute median — both are pinned here as fixtures, along with
      # the refusals for an empty or untimed sample.
      - name: CI demand classifier (a dependent job's instant start is not spare capacity)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/ci-demand.mjs --self-test
      # A TIMER must never start an unpriced real apply. The weekly `17 5 * * 0` full-bar cron fanned
      # the 11-kind surface across all five clouds while ALETHIA_COST_CEILING_MONTHLY_USD was wired
      # for aws alone, and bought a standing monthly alibaba CR EE subscription each week (#2340
      # landed the detection only on 2026-08-11). The cron is gone — but removing a cron is a
      # one-line edit and so is adding one, so this is the tripwire on the reintroduction: a cron
      # that resolves to `full` fails unless every matrix cloud is priced. Exemptions (a watched
      # dispatch) deliberately do not satisfy it. Hermetic — parses two files, no gh, no cloud.
      - name: E2E spend guard (no scheduled full bar on an unpriced cloud)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/check-e2e-spend-guard.mjs --self-test
          node scripts/check-e2e-spend-guard.mjs
      # Which commit of each starter template was last green-proven (#5411), and whether each starter
      # repo's HEAD has moved past it (#5418). The live comparison runs daily from
      # template-proof-currency.yml and NOT here: a push to a starter repo is a change in another repo,
      # not in this diff. These are the hermetic halves, so a broken reader or a comparison that can no
      # longer go red fails the PR that broke it. Each self-test carries its own mutation control.
      - name: Template proof reader + currency check self-tests (no network)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/lib/template-proofs.mjs --self-test
          node scripts/check-template-proof-currency.mjs --self-test
      # `schedule:` fires the DEFAULT BRANCH's copy — the workflow AND, for an unpinned checkout, the
      # whole tree it executes. So a measurement defined on `dev` can run green for days and publish
      # nothing, which is #4395: eight successful orphan-reaper runs, zero artifacts, and MVP
      # predicate 6 unsatisfiable with a green check every morning. Split in three on purpose.
      - name: Scheduled-measurement guard self-test (no network)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-scheduled-measurements.mjs --self-test
      - name: Every scheduled measurement declares the tree it runs (no network)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-scheduled-measurements.mjs --scan-only
      # …and the live question. `continue-on-error` DELIBERATELY: the default branch being behind is
      # a state change in ANOTHER REF, not in the diff, so this can go red on a PR that touched
      # nothing — and it is EXPECTED to be red for the whole length of a promotion window. A guard
      # that blocks unrelated work is a guard people route around. It annotates; the two steps above
      # are the blocking half. Its findings name the promotion as the remedy, never a culprit.
      - name: ...and the branch that actually runs it still publishes the evidence
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin "$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"
          node scripts/check-scheduled-measurements.mjs
      # A knob the harness READS that no dispatch can SET is a scenario nobody can run at any price,
      # and it fails silently: the code is written, its unit tests pass, and every run takes the
      # default forever. #2775 found the BYO-IaC custody chain had never executed for exactly that
      # reason. #2591 and #2717 then each named a discriminating experiment — raise the day-2 URL
      # timeout, raise the ArgoCD convergence budget — that could not be dispatched at all.
      # Hermetic: reads test/e2e/**.go, the nightly workflow and the resolver. No gh, no cloud.
      - name: E2E knob reachability (a knob nothing can set is a scenario nobody can run)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-e2e-knob-reach.mjs
      # hcloud-cloud-controller-manager refuses to create a Load Balancer unless it is told WHERE.
      # The hetzner template told it nothing, so every `type: LoadBalancer` Service sat Pending —
      # SILENTLY, because a pending Service logs no error anyone surfaces. That silence is what let
      # it become #2490: no LB → the ingress-nginx Service never goes healthy → ArgoCD never reaches
      # PostSync → the admission webhook's caBundle is never patched → every Ingress fails x509.
      # The symptom names none of its cause, so a comment in the template would not have survived;
      # dropping the location re-arms the whole chain. Hermetic — parses one .tf, no cloud.
      - name: Hetzner CCM has somewhere to put a Load Balancer
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/check-hetzner-lb-location.mjs --self-test
          node scripts/check-hetzner-lb-location.mjs
      # The Talos snapshot cache (#3027) is a coupling across four files in three languages, in an
      # hcloud account SHARED WITH PROD, and every way it can come apart is silent: the label stops
      # being stamped (every run rebuilds, 5-15m each, greenly); the `cluster` label comes back (the
      # sweeper deletes the cache at the end of the run that built it); `count` stops consulting the
      # lookup (the lookup becomes dead code); or a NEW key dimension reaches the template but not
      # the pruner, whose --prune-superseded then groups on a key that is no longer the key and
      # DELETES an image that is not superseded. `tofu validate` evaluates neither `count` nor
      # `check`, so none of those is visible to anything else in CI. Hermetic - parses one .tf and
      # two .sh, no cloud.
      - name: The Talos image cache's label, gate and sweeper skip-list cannot drift apart
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/check-hetzner-image-cache.mjs --self-test
          node scripts/check-hetzner-image-cache.mjs
      # And the tool that is the ONLY thing allowed to delete a cache entry. Its dangerous modes sit
      # behind --yes-delete, and the self-test asserts on DELETE-CALL COUNTS rather than exit codes:
      # a prune that deleted everything unasked exits 0 exactly like one that deleted nothing.
      - name: hcloud image-cache tool (--yes-delete is what deletes; a failed listing is not "empty")
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/hcloud-image-cache.sh --self-test
      # A variable's DEFAULT is a decision, and `infra/.gitignore` used to hide every stack's real
      # inputs — so on any fresh checkout a bare `tofu apply` ran entirely on defaults, with nothing
      # saying so. That is not untidy, it is dangerous in two directions: a `count` gated on an
      # empty-defaulting variable means DESTROY (aws-oidc would have destroyed a Route53 zone whose
      # NS set is delegated at Cloudflare), and an empty default that merely STEERS a branch narrows
      # or widens in silence (gcp-e2e's OIDC trust went ref-only, killing every workflow_dispatch
      # from dev while the scheduled run kept passing). Twice is a class.
      #
      # A THIRD direction (#3292): a default that is not absent but OPEN. `ssh_allowed_cidrs`
      # defaults to `["0.0.0.0/0", "::/0"]` in cp-hetzner, status and sandbox, straight into the
      # source_ips of a port-22 firewall rule — and two of those three stacks are applied by
      # `tofu apply -auto-approve` on push to main with nothing supplying a narrower value, so the
      # open default IS the live configuration. The empty-default rule cannot see it: the value is
      # not empty and it steers nothing, it is simply what gets applied.
      #
      # Nothing in CI can catch this by running tofu: no workflow runs `tofu plan`, and `validate`
      # evaluates neither `check`, `validation` nor `prevent_destroy`. So it is a static read of the
      # HCL, ratcheting against infra/tfvars-safety-baseline.json — new empty defaults fail on the
      # PR that adds them, and a baseline entry that stops describing anything fails too.
      - name: Every dangerous variable default is supplied, required, or written down
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/check-tfvars-safety.mjs --self-test
          node scripts/check-tfvars-safety.mjs
      # The production deploy's email-transport gate (deploy-console.yml preflight + the deploy
      # script) runs only on `main`, against the live vault, so nothing on a PR would ever see it
      # refuse. The self-test runs it on fixtures and fails on any case whose exit code is wrong.
      - name: The deploy's email-transport gate refuses what it should (self-test)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/ci/check-email-provider-keys.sh --self-test
      # The E2E issuer origin has a committed copy in every place the script's PATHS lists — infra/e2e-issuer's
      # hostname, its tls-ca-pin.json, and e2e_broker_issuer_url in each trust stack (aws-oidc, aws-e2e,
      # gcp-e2e, azure-e2e, alibaba-e2e) — and four clouds pin it byte for byte (#4226). Here in the always-run guards job, not behind a path
      # filter, so an edit to any one copy cannot skip the comparison. The self-test first: every live
      # check goes red on a fixture, the pin merge and atomic write hold, and a loopback TLS server
      # proves an unverified chain is never pinned. Hermetic.
      - name: The E2E issuer origin has one value in every committed copy (and its health check can go red)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          node scripts/ci/check-e2e-issuer-health.mjs --self-test
          node scripts/ci/check-e2e-issuer-health.mjs --static
      # The proof-bundle scrub decides what a PUBLIC repo publishes, and its only run was inside
      # e2e-nightly.yml — a workflow no PR triggers. So the change that made the tripwire fire on
      # every azure plan JSON could not have been caught before merge, and wasn't: azure lost its
      # runner log on every run and published an unscrubbed 148 KB plan (#1923). The suite pins
      # both directions — non-vacuous AND not over-broad — and is hermetic: no cloud, no secret,
      # obviously-fake literals only.
      - name: Proof-scrub denylist (non-vacuous, and no false positive on a tofu plan JSON)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash demos/proofs/scrub.sh --self-test
      # The scrub above decides what a bundle may PUBLISH. This decides whether a bundle SAYS
      # ANYTHING — and until #2688 it did not. capture-proof.sh runs after the tier's t.Cleanup has
      # destroyed the cluster, so its live probe counted a cluster that was gone and wrote 0/0 on
      # every run: a PASS bundle and a FAIL bundle were numerically identical, and the only thing
      # telling them apart was the word "(T2-asserted)". Every bundle from 2026-08-25 onward carried
      # `nodes_ready:0, argocd_total:0, argocd_healthy_synced:0`, with no counter-example.
      #
      # Nothing in CI could see that, because the JSON's SHAPE was always right — only its values
      # were vacuous. So this self-test drives the real script end to end into a temp dir and
      # compares two bundles it actually wrote, rather than asserting against a fixture that would
      # have matched the broken output just as well.
      - name: Proof bundle distinguishes a PASS from a FAIL (never 0/0 on both)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash demos/proofs/capture-proof.sh --self-test
      # And whether a bundle that says nothing may still PROMOTE A CELL — which, until #3281, it
      # could. The capture printed "WARNING — this bundle carries NO measured ArgoCD convergence
      # counts" on a hetzner/addons run that had just driven 22 Applications to Healthy+Synced, and
      # nothing was required to act on it, so the cell went green on a job-log line that expires.
      # A warning nobody must act on is indistinguishable from silence.
      #
      # The gate is at the moment a bundle is used to CLAIM something (commit-proof.sh), never at
      # capture: a failing run's bundle is the evidence of the failure and must always survive.
      - name: A bundle that measured nothing cannot promote a cell (#3281)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash demos/proofs/check-proof-integrity.sh --self-test
      # PROGRAMME.md is the one file a session reads to know where the MVP programme stands, so its
      # status half is DERIVED and diff-gated — the numbers cannot be typed. This is the guard's own
      # guard (fixtures for RETRACTED supersession, an expiring CI run tag masquerading as a proof,
      # the marker splice refusing a duplicated region, and a vacuity case) plus the staleness diff.
      # The hand-maintained boards it replaces were contradicting each other IN THE TREE while
      # passing CI: runner-xcloud-parity.md called hetzner green for cluster provision,
      # provisioning-e2e-parity.md called it blocked, and the proof ledger said neither had evidence.
      - name: Programme ledger derivation (a PASS with no bundle is never a proof)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/programme-rollup.mjs --self-test
      - name: Programme ledger is in sync with the tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/programme-rollup.mjs
      # The spine mirror: Node cannot parse Go, so the Go tables that already OWN and validate the
      # ceiling/debt verdicts (MaxConfigCarriage, CLIReach) are exported to JSON and diff-gated,
      # rather than a third hand-authored list being kept in step by hand. Same shape as
      # gen:offer-surface / gen:keyless-cells. Untagged test — no cloud, no cost.
      - name: Programme spine mirror is in sync with the Go tables
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          (cd test/e2e && GOWORK=off go test -run 'TestProgrammeExport' ./...)
          git diff --exit-code -- test/e2e/generated/programme.json \
            || { echo "::error::test/e2e/generated/programme.json is stale — regenerate with (cd test/e2e && GOWORK=off go test -run TestProgrammeExport ./...) and commit. Source of truth: MaxConfigKinds + CLIDemoSteps."; exit 1; }
      # Each guard proves it still BLOCKS what it must and, more importantly, still
      # ALLOWS what it must — the false positives are what get a guard disabled.
      # This job is a BAG of independent checks, and it must stay one. Actions stops a job at its
      # first failing step, so before #2662 a failure at index 4 (`Open-core boundary`) silently
      # skipped 73 others — including the migration-chain check, the proof-scrub denylist and the
      # hook self-tests below, none of which has anything to do with the open-core boundary. Every
      # red run reported ONE finding and hid however many more sat behind it.
      #
      # The 73 `if:` lines fix today. This keeps them: the next check appended without one would
      # otherwise rejoin the veto chain at the bottom, where it is also the step most likely to be
      # skipped, and nothing would say so.
      # A workflow file can be VALID YAML and REJECTED by Actions: a step with no `run:` and no
      # `uses:` is a well-formed mapping that Actions refuses, producing a run with ZERO JOBS. None
      # of the nine required checks then reports, so the PR does not go red — it sits BLOCKED with an
      # EMPTY rollup, which reads like "CI hasn't started". `yaml.parse()` passes on that input,
      # which is exactly why parsing is not validation (#2670).
      # The console's compiled-from set is DERIVED from the workspace, and the release gate reads it
      # to decide whether a changed path is something a leg measures. This asks the inverse: is every
      # `@repo/*`/`@alethia/*` package in the tree either compiled into the console or recorded as
      # not. It lives HERE rather than in release-gate.yml because it is a repo invariant, and a repo
      # invariant checked inside a per-PR gate reds the wrong PR: the gate's check is skipped
      # whenever the gate RUNS, so the labelled PR that lands a new package never evaluated it, while
      # every unlabelled dev PR afterwards failed for a diff its author never wrote (#4606).
      - name: The console's surface is derivable, and every scoped package is on it or recorded
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:console-surface
      - name: ...and that walk is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-console-surface.mjs --self-test
      - name: Every workflow step has a run or a uses (Actions rejects the file otherwise)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:workflow-shape
      - name: ...and that check's own parser is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:workflow-shape -- --self-test
      # `if-no-files-found: error` is AGGREGATE — the action globs every `path:` entry together and
      # asks `filesToUpload.length === 0` ONCE — so a step listing several paths under it succeeds
      # if ANY ONE matched, having captured nothing it exists for. Two steps here were that shape,
      # and in both the path that always matches was the one riding along (#4347). The edit alone
      # fixes today: the instinct on a missing file is to ADD ITS PATH to the existing step, which
      # is one invisible line and puts the repo straight back.
      - name: No upload step's if-no-files-found error is satisfiable by a path it does not guard
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:upload-aggregate
      - name: ...and that check's own parser is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:upload-aggregate -- --self-test
      # Three lists of required checks have to agree and nothing compared them (#3180). The
      # dangerous direction is a check the protect-dev ruleset requires that .mergify.yml does not
      # wait for: the queue decides the PR is ready, GitHub refuses the merge, and nothing is red.
      - name: The required-check lists agree (HCL vs Mergify)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:required-checks
      - name: ...and that check's own parser is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:required-checks -- --self-test
      - name: The guards job is a bag of independent checks, not a pipeline
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-guards-independent.mjs
      - name: ...and that check's own parser is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-guards-independent.mjs --self-test
      # The production-deploy alert runs only on a red main run, so this is the one place its wording
      # is exercised before it matters: a green deploy with a red smoke must not say production did
      # not receive the commit (#5643), and the two cases must not update each other's issue.
      - name: The deploy-failure alert says what production runs, per case
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/deploy-failure-report.mjs --self-test
      # The level ABOVE the two checks either side of this one. They ask whether a step is shaped
      # so Actions will run it, and whether one failure can skip the rest. This asks whether the
      # command a step names does anything at all: `pnpm -F <pkg> <script>` exits 0 when no
      # selected package has that script — an EMPTY SELECTION, not an error (#3853). 32 of the
      # steps in this very job were written that way, `check:ee-boundary`, `check:authz-scope` and
      # `check:migrations` among them, so renaming any one of those scripts would have left its
      # gate green having executed nothing, with the PR that did it looking clean. Measured, not
      # theorised: #3827's two new steps reported `success` having run nothing.
      - name: Every pnpm script a workflow names exists, and none uses the exit-0 filter form
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm check:pnpm-script-refs
      - name: ...and that check's own parser is not silently blind
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/check-pnpm-script-refs.mjs --self-test
      # The classifier both chart-render jobs share, and the retry built on it. It runs the script
      # under `bash -e` — GitHub's default shell — because an earlier version of that retry was 100%
      # INERT in CI for exactly that reason while passing a harness that used plain `bash`.
      - name: The chart-fetch retry retries a fetch and refuses a real failure
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/ci/tofu-test-retry-fetch.sh --self-test
      # The Go module fetch retry (#6031), held to the same two directions under `bash -e`: a
      # transient proxy error is retried and logged, and a non-network failure — a missing go.sum
      # entry, a 404 for a version that does not exist, a transport word with no URL — is not.
      - name: The Go module fetch retry retries a proxy flake and refuses a real failure
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/ci/go-mod-download-retry.sh --self-test
      # The image pull retry T1 uses for ArgoCD's images (#6044), held to the same two directions
      # under `bash -e`: a rate limit or a transport error is retried and logged, and a tag that does
      # not exist, a private image or a stopped daemon is not. It also pins the mirror mapping
      # (#6067): only `ecr-public.aws.com/docker/library/*` is served from mirror.gcr.io, and five
      # mutants of the script must each fail this self-test.
      - name: The image pull retry retries a rate limit and refuses a real failure
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/ci/docker-pull-retry.sh --self-test
      # T1's image archive (#7698): the cache key is the list, order- and comment-blind; a
      # containerd-store save names the server's platform; a failed pull or save, or an archive with
      # no image index, writes nothing; a node missing an image is an ::error naming it.
      - name: T1's image archive saves one platform and never caches a broken archive
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/e2e/t1-kind-images.sh --self-test
      # The same shape one host over: Playwright's `--with-deps` shells out to apt, and the runner
      # image carries Google's Chrome channel that Chromium does not need. Both directions pinned —
      # a transient fetch is retried, a real failure is not (#4499).
      - name: The playwright-install retry retries a fetch and refuses a real failure
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/ci/playwright-install.sh --self-test
      # release-please cuts a component's commits at its release commit by position in a date-ordered
      # walk, so a dev commit promoted after a release it predates is never released. The detector
      # release-please.yml runs after every main push, held to both orderings in a throwaway repo.
      - name: The release-cursor detector names a commit release-please cannot see
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/release-cursor.sh --self-test
      - name: Guards self-test (runtime · compose · merge · secrets · worktree · spend · destroy)
        # Skipped only on an affected-only PR that touched none of the guards' inputs (detect-changes
        # `guards_selftest` filter). Runs on anything but an explicit 'false', so a failed detection runs it.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.detect-changes.outputs.guards_selftest != 'false' }}
        run: |
          bash .claude/hooks/guard-runtime.sh --self-test
          bash .claude/hooks/guard-compose.sh --self-test
          bash .claude/hooks/guard-merge.sh --self-test
          # The IaC guard was removed 2026-11-22: instructed applies are the agent's now. What
          # replaced it is the credential broker and guard-secrets (use a secret, never print it).
          bash .claude/hooks/guard-secrets.sh --self-test
          python3 scripts/creds.py --self-test
          # guard-worktree had NO self-test, alone among the four, and it is the one with the most
          # moving parts — two rules, a quote-stripped scan, a target resolver and a fail-closed
          # fall-through. Every defect fixed in #3192 was found by tripping over it in ordinary
          # work; two had been shipped for weeks. It builds a real main checkout and a real linked
          # worktree in a tmpdir, so it stays hermetic.
          bash .claude/hooks/guard-worktree.sh --self-test
          # The spend ledger and the deletion guard (#harness 2026-11-06). Each self-test exercises every
          # refusal and every allow; the deletion guard's snapshot path runs for real in a temp repo.
          bash .claude/hooks/guard-spend.sh --self-test
          bash .claude/hooks/guard-destroy.sh --self-test
          # Mutation tests: every rule's call sites are disabled in turn, and so is every statement a
          # `# @mut` marker names (one site of a rule, a cap, the shared gh-flag parser), and the
          # self-test must FAIL for each. The list is derived from the files, so a rule or marker
          # added without a failing case fails here. ~4–5 min together, most of it the snapshot
          # fixtures (5000+ and 20000+ files, a 60 MB file) that the cap and fairness mutants reach.
          bash .claude/hooks/guard-spend.sh --mutation-test
          bash .claude/hooks/guard-destroy.sh --mutation-test
          bash .claude/hooks/guard-merge.sh --mutation-test
          bash .claude/hooks/session-cleanup.sh --self-test
      - name: Hook scripts parse
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          for f in .claude/hooks/*.sh .claude/hooks/lib/*.sh scripts/env.sh scripts/dev-doctor.sh scripts/box/*.sh; do
            bash -n "$f"
          done
      # The box scripts' own decision matrices — the seed/empty/restart table and the edition
      # verdict in env-mode.sh, the port arithmetic in env-registry.sh. They HAD a CI home, in
      # infra-sandbox.yml, and it is gated on `infra/sandbox/**`: a change to scripts/box/ ran
      # the parse above and nothing else, so every cell in those matrices was advisory on the
      # only PRs that could break them. The step above proves the file parses; this one proves
      # the decisions still hold.
      - name: Box script self-tests (edition verdict · seed matrix · port allocation)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bash scripts/box/env-mode.sh --self-test
          bash scripts/box/env-registry.sh --self-test
      - name: Cloud privilege (OIDC / creds) never reachable from a PR (BYOC invariant 1)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/check-workflow-oidc-isolation.mjs

  go:
    name: Go (build · vet · test · lint)
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    # AFFECTED-ONLY: the matrix comes from `detect-changes`. It is all three modules on every event
    # unless the job-level skips are ARMED; armed, an ordinary PR gets `[]` (job skipped) or
    # `["apps/cli"]` when its diff is confined to the sets `detect-changes` documents. An empty
    # output — a failed detect job — falls back to all three, and `!cancelled()` lets it run.
    needs: [detect-changes]
    if: ${{ !cancelled() && github.event.schedule != '0 3 * * *' && needs.detect-changes.outputs.go_matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-changes.outputs.go_matrix || '["apps/cli","apps/runner","packages/core"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # Every module the steps below need, fetched up front under a retry that re-tries ONLY a
      # transient proxy error (an HTTP/2 stream reset, a TLS or i/o timeout, a 502/503/504) and
      # fails anything else on the first attempt (#6031). Two fetches: the matrix module in
      # workspace mode, for build/vet/test and golangci-lint; and on the packages/core leg the
      # test/e2e harness, a module outside the workspace (GOWORK=off). Each is a plain
      # `go mod download`, which writes only the module cache and the gitignored go.work.sum —
      # go.mod and go.sum stay exactly as committed, so every step below sees the committed files.
      # The standalone tidy guard needs modules this does not fetch (tidy also loads the tests of
      # dependencies), so it runs its own `go mod tidy` under the same retry instead.
      - name: Pre-fetch Go modules (retrying a transient proxy error)
        run: |
          bash scripts/ci/go-mod-download-retry.sh ${{ matrix.module }}
          if [ "${{ matrix.module }}" = packages/core ]; then
            GOWORK=off bash scripts/ci/go-mod-download-retry.sh test/e2e
          fi
      # packages/core's untagged provisioning-wiring E2E (deploy_wiring_test.go) runs a real
      # `tofu` against a provider-less module — it self-skips without tofu on PATH, which
      # would make the keystone's per-PR signal hollow. Install it so the test actually runs.
      #
      # apps/runner needs it for the SAME reason, and did not have it. Its chart-scan and
      # IaC-scan suites (chart_scan_test.go, exec_stage_test.go, iac_scan_test.go) self-skip
      # without `helm` and `tofu` on PATH. The 2026-08-04 determinism probe confirmed what
      # ubuntu-latest actually ships: helm IS preinstalled (/usr/local/bin/helm) but **tofu is
      # MISSING**, so those runner tests have been silently skipping in CI — passing by not
      # running. Worth fixing on its own; it also makes the leg's coverage reproducible, which
      # a floor depends on (the same suites measure 49.58% locally with tofu present and
      # 47.24% without).
      #
      # helm is pinned rather than inherited: "happens to be on the GitHub-managed image" is an
      # unpinned property, and the day it is pruned those tests would go quiet again.
      - uses: azure/setup-helm@v5
        if: matrix.module == 'apps/runner'
        with:
          version: v3.16.3
      # packages/core inherited helm the same way apps/runner used to, and the consequence here is
      # WORSE than a quiet skip. Its floors record `"helm": true`, and the ratchet's fingerprint
      # check demotes — not fails — when the current environment is missing something the recording
      # environment had. So the day ubuntu-latest prunes helm, this leg does not go red: it goes
      # silently ADVISORY, and every coverage regression in packages/core sails through as a
      # warning. That is the "a guard's nothing-found branch is indistinguishable from
      # nothing-wrong" class, armed and waiting.
      #
      # Pinned to v3.21.4 DELIBERATELY, which is not the v3.16.3 above. That is the version
      # actions/runner-images currently ships on ubuntu-24.04, so this leg keeps running the exact
      # binary it runs today: the pin buys determinism and changes no behaviour, and therefore
      # cannot move the recorded numbers. It has to be that way round, because the fingerprint is a
      # BOOLEAN — `helm: true` cannot see a version change, so a version-shifting pin would not
      # demote, it would simply red, and it would red on whoever landed next rather than on the PR
      # that caused it.
      #
      # The two legs therefore run different helm versions. That is the honest state, not the
      # desired one; harmonising them is a behaviour change that moves numbers and needs its own
      # floors re-record, so it is filed separately rather than smuggled into a determinism fix.
      - uses: azure/setup-helm@v5
        if: matrix.module == 'packages/core'
        with:
          version: v3.21.4
      - uses: opentofu/setup-opentofu@v2
        if: matrix.module == 'packages/core' || matrix.module == 'apps/runner'
        with:
          tofu_version: "1.9.0"
      # `-count=1` is what makes the TS-vs-Go mirror locks run on a console-only PR (#4768).
      #
      # Several tests read files OUTSIDE their Go module through the monorepo root: the
      # `Mirrors the Go X` lock in packages/core/jsonbmirror (#4455), and the mirror/coupling tests
      # in argocd, categories, cloud, compat, format, manifests and validate, plus
      # apps/runner/internal/agent/override_expiry_wire_test.go. The Go test cache does not key on
      # the console files the jsonbmirror lock reads. Measured on go1.27 with this exact command:
      # renaming a mirrored field in apps/console/lib/addons/types.ts left
      # `go test -coverprofile=… ./jsonbmirror/` at `ok … (cached)`, exit 0, and `-count=1` on the
      # same tree FAILED. `-coverprofile` does not disable caching.
      #
      # setup-go restores GOCACHE, and CI does serve hits: dev run 35286108684 printed `(cached)`
      # for 16 packages/core packages, categories, format and manifests among them. A `(cached)`
      # line means the test binary never ran, so a console-only PR (a TS change, no Go change,
      # a warm cache) is exactly the PR these locks existed for and exactly the one they skipped.
      #
      # Applied to the whole run rather than a list of packages, because a hand-written list of
      # "the tests that read outside the module" is a list the next such test is missing from.
      # The cost is small: seven of the eight most recent green runs before this change printed
      # zero `(cached)` lines in any Go leg, so today's timings are mostly uncached ones already.
      # The job still reports on every PR; only the cache lookup changes.
      - name: Build · vet · test (with coverage)
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test -count=1 -coverprofile=cover.out ./...
      # Per-package statement-coverage RATCHET: coverage may rise, never fall. Reads the cover.out
      # written directly above — it does NOT re-run the suite.
      #
      # No `working-directory`: the script cd's to the repo root itself, so it is invoked
      # identically for every module and the fix command it prints needs no cd puzzle.
      #
      # No `if: always()`: when the step above fails there is no usable profile, and reporting a
      # coverage collapse on top of a test failure would misattribute the cause.
      #
      # This blocks a PR that lowers coverage in ANY package, including one the author does not
      # own. That is deliberate. Every false-failure path is fail-OPEN and enumerated in the
      # script header — the floors carry a fingerprint of the environment that recorded them, and
      # a mismatch (including a different OS) demotes failures to warnings rather than blaming
      # coverage for a toolchain change.
      #
      # --require-verdict: every fail-open path in the script exits 0, which made "the ratchet
      # passed" and "the ratchet never ran" the same green here (#2852). Two of those can fire on
      # a runner — jq missing from an image, and a test step that wrote its profile somewhere
      # else — and both announced themselves with `::warning::`, which nothing surfaces on a PR
      # page. The flag turns any non-measuring path into exit 3, so this step asserts it actually
      # got an answer. Local runs stay advisory: the flag is off by default.
      - name: Coverage ratchet (per package, no regressions)
        run: bash scripts/go-coverage.sh --module ${{ matrix.module }} --require-verdict
      # Each Go module must be tidy STANDALONE (no go.work) — the CLI mirror + GoReleaser build
      # apps/cli outside the workspace, where go.work can't paper over a missing require. This guard
      # fails the PR instead of the (post-merge) mirror when go.mod/go.sum drift standalone.
      #
      # `go mod tidy` fetches the modules it loads, so it runs under the module-fetch retry (#6031):
      # only a transient proxy error is retried, and the go.mod/go.sum it leaves are tidy's own.
      - name: go.mod tidy guard (standalone — GOWORK=off)
        working-directory: ${{ matrix.module }}
        run: |
          GOWORK=off bash "$GITHUB_WORKSPACE/scripts/ci/go-mod-download-retry.sh" -- go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::${{ matrix.module }}/go.mod or go.sum is not tidy standalone — run 'cd ${{ matrix.module }} && GOWORK=off go mod tidy' and commit." >&2
            exit 1
          fi
      # Compile-check the docker-gated e2e_local keystone (it's excluded from the default
      # build tags, so a break in deploy_e2e_test.go would otherwise escape all of CI).
      - name: Vet e2e_local keystone (compile check)
        if: matrix.module == 'packages/core'
        working-directory: ${{ matrix.module }}
        run: go vet -tags=e2e_local ./provisioner/
      # Compile-check the T1/T2 harness (test/e2e — a SEPARATE module outside go.work, run
      # only by the merge-queue provision-e2e job / the nightly). Without this, a break in
      # controlplane.go / t1_provision_test.go would escape every per-PR check and only
      # surface in the merge queue, blocking it for everyone rather than failing the
      # offending PR (parity with the e2e_local keystone above). The untagged `go test` runs
      # the harness's PURE unit tests (argocd_assert_test.go — the ArgoCD health assertion's
      # parse/evaluate/derive negative paths; no docker/kind/postgres needed).
      - name: Vet + unit-test e2e harness (compile check + pure logic)
        if: matrix.module == 'packages/core'
        run: |
          cd test/e2e
          GOWORK=off go vet -tags=e2e_t1 ./...
          GOWORK=off go vet -tags=e2e_t2 ./...
          GOWORK=off go vet -tags=e2e_b6 ./...
          # -count=1 as in the module legs above (#4768). No untagged test here was found reading
          # outside the module (grep for go.work / ../../); this keeps "no Go test result on a PR
          # comes from the cache" true for all four modules instead of three.
          GOWORK=off go test -count=1 -coverprofile=cover.out ./...
      # test/e2e is the FOURTH Go module and has no matrix leg of its own — it is exercised from
      # inside the packages/core leg above, which is why its 2,193 statements have never been
      # coverage-measured. Its ratchet is therefore an explicit step here rather than a matrix
      # entry.
      #
      # Its floors WERE recorded by the determinism probe, whose test/e2e leg installs no tofu,
      # while this leg does — a deliberately CONSERVATIVE floor that the comment here predicted
      # would "tighten on the first `--update`". It has (#2156): the floors now carry this leg's
      # own measurement and `"tofu": true` with it. The fingerprint has to move WITH the number,
      # or the fallback the conservative floor bought is silently gone — a broken tofu install
      # would drop coverage below a floor recorded as tofu-less, and F7 would find nothing
      # "missing" to demote the failure with. Recorded tofu:true, it demotes to a warning.
      - name: Coverage ratchet — test/e2e harness
        if: matrix.module == 'packages/core'
        run: bash scripts/go-coverage.sh --module test/e2e --require-verdict
      - name: CLI logic-scope coverage gate (≥90%)
        if: matrix.module == 'apps/cli'
        working-directory: ${{ matrix.module }}
        run: ./scripts/coverage.sh 90
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}
      # The step above lints the DEFAULT build of each matrix module and nothing else (#5967). A
      # file behind a `//go:build` tag is not in that build, so it was never linted at all — and
      # test/e2e, the fourth Go module, was not in the matrix either. When this landed, the e2e_t2
      # build alone carried 23 findings no check could see.
      #
      # packages/core's two tags (e2e_local, integration) are purely additive, so one build with
      # both compiles every file either one selects.
      - name: golangci-lint — packages/core tagged builds (e2e_local, integration)
        if: ${{ !cancelled() && matrix.module == 'packages/core' }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: packages/core
          args: --build-tags=e2e_local,integration
      # The `!cancelled()` on each: one red lint step must not hide the next build's findings.
      #
      # test/e2e is outside go.work (GOWORK=off, as its vet step above). It is linted once per tag
      # and once untagged — the untagged build is a different file set, because three pure tests
      # carry `!e2e_t1 && !e2e_t2 && !e2e_b6`.
      #
      # `unused` is OFF in those four builds, and that is the only linter that is. A helper defined
      # in an untagged file and called only from an e2e_t2 file is unused in every build but
      # e2e_t2's, and runPromotionGateShim (called only under e2e_b6) is unused under e2e_t2: in a
      # single-tag build `unused` reports tag-only symbols, not dead ones (55 under e2e_t1 alone).
      # It runs instead in the UNION build below, which compiles every tagged file at once and so
      # is the only build where "no caller" means no caller. Its stated boundary: a symbol defined
      # only in one of the three `!e2e_*` files is outside the union, and `unused` cannot see it.
      - name: golangci-lint — test/e2e untagged (unused in the union step)
        if: ${{ !cancelled() && matrix.module == 'packages/core' }}
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: "off"
        with:
          version: v2.13.2
          working-directory: test/e2e
          args: --disable=unused
      - name: golangci-lint — test/e2e e2e_t1 (unused in the union step)
        if: ${{ !cancelled() && matrix.module == 'packages/core' }}
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: "off"
        with:
          version: v2.13.2
          working-directory: test/e2e
          args: --build-tags=e2e_t1 --disable=unused
      - name: golangci-lint — test/e2e e2e_t2 (unused in the union step)
        if: ${{ !cancelled() && matrix.module == 'packages/core' }}
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: "off"
        with:
          version: v2.13.2
          working-directory: test/e2e
          args: --build-tags=e2e_t2 --disable=unused
      - name: golangci-lint — test/e2e e2e_b6 (unused in the union step)
        if: ${{ !cancelled() && matrix.module == 'packages/core' }}
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: "off"
        with:
          version: v2.13.2
          working-directory: test/e2e
          args: --build-tags=e2e_b6 --disable=unused
      - name: golangci-lint — test/e2e union of tags (e2e_t1,e2e_t2,e2e_b6 — the unused gate)
        if: ${{ !cancelled() && matrix.module == 'packages/core' }}
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: "off"
        with:
          version: v2.13.2
          working-directory: test/e2e
          args: --build-tags=e2e_t1,e2e_t2,e2e_b6

  byo-users-postgres:
    name: BYO users SQL — real Postgres (${{ matrix.postgres }})
    # The per-binding BYO database users SQL (apps/runner/internal/agent/db_bootstrap_byo*.go,
    # #6465) is security-critical and only a real server can say whether it works: the unit tests
    # pin its text, not what Postgres does with it. This applies it to a real server as a
    # NON-superuser admin, which is what every managed Postgres hands us (RDS master,
    # cloudsqlsuperuser, azure_pg_admin), on the console Integration job's major (17). Per-binding users
    # need Postgres 15 or newer, so the ONE pre-15 major (14) proves the refusal: the run fails with
    # the floor's reason and changes nothing.
    needs: detect-changes
    # Not on the UI-audit nightly (see `go` above), and on a PR only when the runner's Go could
    # have changed — detect-changes' `runner` filter covers apps/runner, packages/core, go.work and
    # this file. `byo-users-postgres-required` below restates this condition to know whether a
    # `skipped` result is by design; change one and you must change the other.
    # FULL LANE ONLY (two lanes, see `detect-changes`): never on an ordinary PR's fast lane — the
    # queue's batch runs it. The wrapper below restates the lane too.
    if: github.event.schedule != '0 3 * * *' && (github.event_name != 'pull_request' || needs.detect-changes.outputs.runner == 'true') && needs.detect-changes.outputs.lane != 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17-alpine", "14-alpine"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: apps/runner/go.sum
      - name: Pre-fetch Go modules (retrying a transient proxy error)
        run: bash scripts/ci/go-mod-download-retry.sh apps/runner
      - name: Install the psql client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q postgresql-client
          fi
          psql --version
      # The admin the tests act as: LOGIN CREATEROLE CREATEDB, owner of the test database, and NOT a
      # superuser. The database name carries a '-' so identifier quoting is exercised for real.
      - name: Create a non-superuser admin and its database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres-ci
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE byo_admin LOGIN CREATEROLE CREATEDB PASSWORD 'byo-admin-ci'"
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "byo-test" OWNER byo_admin'
          test "$(psql -X -At -c "SELECT rolsuper FROM pg_roles WHERE rolname = 'byo_admin'")" = f
      # ALETHIA_TEST_PG_REQUIRED turns the tests' "no database" skip into a failure, and the grep
      # below asserts each real-Postgres test actually PASSED by name: a renamed test, a -run that
      # matches nothing, or a skip would otherwise all read green.
      - name: go test -tags integration (BYO users, real Postgres)
        working-directory: apps/runner
        env:
          ALETHIA_TEST_PG_ADMIN_DSN: postgres://byo_admin:byo-admin-ci@localhost:5432/byo-test?sslmode=disable
          ALETHIA_TEST_PG_REQUIRED: "1"
        # pipefail: without it the step's status is tee's, so a failing test this -run matches but
        # the PASS check below does not name would read green.
        run: |
          set -o pipefail
          go test -tags integration -count=1 -v -run ByoUsers ./internal/agent/... | tee "$RUNNER_TEMP/byo.log"
          if [ "${{ matrix.postgres }}" = 14-alpine ]; then
            want="TestByoUsersPostgres_RefusesBelow15"
          else
            want="TestByoUsersPostgres_Lifecycle TestByoUsersPostgres_RefusesForeignRole TestByoUsersPostgres_RevokeFailsSafe TestByoUsersPostgres_PublicCreateRefused TestByoUsersPostgres_SkipRevoke"
          fi
          for t in $want; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/byo.log" || { echo "::error::$t did not PASS on postgres ${{ matrix.postgres }}"; exit 1; }
          done

  # THE ONE CONTEXT THAT MAKES `byo-users-postgres` REQUIRABLE (#6484). Required by name in
  # .mergify.yml and infra/github/variables.tf until 2026-11-22; since then one of the `needs:` of
  # `CI required`, the context those two require.
  #
  # The matrix above cannot be required directly. Skipped at job level — every PR that does not
  # touch the runner — it reports ONE check under its UNEXPANDED name,
  # `BYO users SQL — real Postgres (${{ matrix.postgres }})`, and never the per-leg names, so a
  # `check-success=<leg>` would wedge every such PR. Accepting the unexpanded name as well was tried
  # in #6475 and withdrawn: Mergify gives `{{ … }}` a meaning inside a condition value, and an
  # invalid .mergify.yml stops the queue for everyone, readable only once it reaches `main`.
  #
  # So this job has a FIXED name with no `${{ }}` in it, and always reports: `!cancelled()` runs it
  # even when the legs were skipped (the implicit `success()` would skip it with them). It passes
  # in exactly two cases — the legs were EXPECTED to run and the matrix result is `success`, or
  # they were NOT expected and it is `skipped` — and fails on everything else, `cancelled`
  # included. "Expected" is the legs' own `if:` restated below; keep the two in step.
  #
  # `detect-changes` must itself have succeeded. Its `runner` output is empty when it failed, which
  # would read as "the runner did not change" and turn a broken filter into a green gate.
  byo-users-postgres-required:
    name: BYO users SQL — real Postgres
    needs: [detect-changes, byo-users-postgres]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed, or the runner did not change
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          RUNNER_CHANGED: ${{ needs.detect-changes.outputs.runner }}
          LEGS_RESULT: ${{ needs.byo-users-postgres.result }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          LANE: ${{ needs.detect-changes.outputs.lane }}
        run: |
          if [ "$DETECT_RESULT" != success ]; then
            echo "::error::detect-changes concluded '$DETECT_RESULT', so whether the runner changed is unknown"
            exit 1
          fi
          # The legs' own condition: not the 03:00 UI-audit nightly, on a PR only when `runner` changed,
          # and never on the fast lane (two lanes — the queue's batch runs them; `CI required` refuses
          # `lane=fast` on any run that is not an ordinary dev PR, so this cannot excuse a queue skip).
          expected=false
          if [ "$EVENT_SCHEDULE" != "0 3 * * *" ] && { [ "$EVENT_NAME" != pull_request ] || [ "$RUNNER_CHANGED" = true ]; } \
            && [ "$LANE" != fast ]; then
            expected=true
          fi
          echo "lane: ${LANE:-?}; legs expected to run: $expected; matrix result: $LEGS_RESULT"
          if [ "$expected" = true ] && [ "$LEGS_RESULT" = success ]; then
            echo "every BYO users leg passed"
          elif [ "$expected" = false ] && [ "$LEGS_RESULT" = skipped ]; then
            echo "the runner did not change, or this is the fast lane, so the legs were skipped by design"
          else
            echo "::error::BYO users SQL legs concluded '$LEGS_RESULT' (expected to run: $expected)"
            exit 1
          fi

  byo-users-mysql:
    name: BYO users SQL — real MySQL (${{ matrix.mysql }})
    # The MySQL dialect of the per-binding BYO database users SQL
    # (apps/runner/internal/agent/db_bootstrap_byo_mysql*.go, #6467), applied to a real server the way
    # the BYO users Job applies it: the provision script without --force, then the sweep with --force,
    # over TLS. The admin holds the static privilege set an RDS master user holds — no SUPER, no
    # SET_USER_ID, no CONNECTION_ADMIN — on 8.0 and 8.4. Per-binding users need MySQL 8.0.21 or newer, so
    # 8.0.20, the last release below that floor, proves the refusal. Same trigger as
    # `byo-users-postgres`; `byo-users-mysql-required` below restates it.
    needs: detect-changes
    if: github.event.schedule != '0 3 * * *' && (github.event_name != 'pull_request' || needs.detect-changes.outputs.runner == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.4", "8.0", "8.0.20"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: apps/runner/go.sum
      - name: Pre-fetch Go modules (retrying a transient proxy error)
        run: bash scripts/ci/go-mod-download-retry.sh apps/runner
      - name: Install the mysql client
        run: |
          if ! command -v mysql >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q mysql-client
          fi
          mysql --version
      # The admin the tests act as, with an RDS master user's static privileges and nothing dynamic,
      # and a database whose name carries a '-' so quoting is exercised for real.
      - name: Create a non-root admin and its database
        env:
          MYSQL_PWD: root-ci
        run: |
          root() { mysql --protocol=TCP -h 127.0.0.1 -uroot --ssl-mode=REQUIRED -N -B -e "$1"; }
          root "CREATE USER 'byo_admin'@'%' IDENTIFIED BY 'byo-admin-ci'"
          root "GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES, LOCK TABLES, EXECUTE, CREATE VIEW, SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER ON *.* TO 'byo_admin'@'%' WITH GRANT OPTION"
          # shellcheck disable=SC2016 # the backticks quote a MySQL identifier, not a command
          root 'CREATE DATABASE `byo-test`'
          grants="$(root "SHOW GRANTS FOR 'byo_admin'@'%'")"
          echo "$grants"
          if echo "$grants" | grep -Eq 'SUPER|SET_USER_ID|CONNECTION_ADMIN|ALL PRIVILEGES'; then
            echo "::error::the CI admin holds a privilege a managed admin does not"; exit 1
          fi
      # ALETHIA_TEST_MYSQL_REQUIRED turns the tests' skip into a failure, and the grep below asserts
      # each real-MySQL test PASSED by name, so a renamed test, a -run matching nothing, or a skip
      # cannot read green.
      - name: go test -tags integration (BYO users, real MySQL)
        working-directory: apps/runner
        env:
          ALETHIA_TEST_MYSQL_ADMIN_DSN: mysql://byo_admin:byo-admin-ci@127.0.0.1:3306/byo-test
          ALETHIA_TEST_MYSQL_ROOT_DSN: mysql://root:root-ci@127.0.0.1:3306/byo-test
          ALETHIA_TEST_MYSQL_REQUIRED: "1"
        run: |
          set -o pipefail
          go test -tags integration -count=1 -v -run ByoUsersMySQLServer ./internal/agent/... | tee "$RUNNER_TEMP/byo.log"
          if [ "${{ matrix.mysql }}" = 8.0.20 ]; then
            want="TestByoUsersMySQLServer_RefusesBelowFloor"
          else
            want="TestByoUsersMySQLServer_Lifecycle TestByoUsersMySQLServer_RefusesForeignUser TestByoUsersMySQLServer_RevokeFailsSafe TestByoUsersMySQLServer_KillsSessions TestByoUsersMySQLServer_PartialRevokes TestByoUsersMySQLServer_SkipRevoke TestByoUsersMySQLServer_FailedCursorStepDropsNoOtherAccount TestByoUsersMySQLServer_RefusedProvisionedUserIsLocked TestByoUsersMySQLServer_LineTerminatorLookalikeIsNoCandidate TestByoUsersMySQLServer_UserCannotRetagItself TestByoUsersMySQLServer_SessionsNotEndedOnlyWithSessions TestByoUsersMySQLServer_LostSessionRecordIsADoubt TestByoUsersMySQLServer_PrivilegeProbeIsBinary TestByoUsersMySQLServer_ReportLinesCapped TestByoUsersMySQLServer_SessionPastKillCapIsReported TestByoUsersMySQLServer_FailedKillStepIsReported"
          fi
          for t in $want; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/byo.log" || { echo "::error::$t did not PASS on mysql ${{ matrix.mysql }}"; exit 1; }
          done
      # The scripts claim to mean the same under any sql_mode: no literal carries a backslash, and no
      # `"` delimits anything. This pass MEASURES that: it turns on NO_BACKSLASH_ESCAPES and
      # ANSI_QUOTES for every new session and reruns every test, and TestByoUsersMySQLServer_SQLMode
      # proves the modes were active in the administrator's session.
      - name: go test -tags integration (BYO users, real MySQL, sql_mode NO_BACKSLASH_ESCAPES,ANSI_QUOTES)
        if: matrix.mysql != '8.0.20'
        working-directory: apps/runner
        env:
          ALETHIA_TEST_MYSQL_ADMIN_DSN: mysql://byo_admin:byo-admin-ci@127.0.0.1:3306/byo-test
          ALETHIA_TEST_MYSQL_ROOT_DSN: mysql://root:root-ci@127.0.0.1:3306/byo-test
          ALETHIA_TEST_MYSQL_REQUIRED: "1"
          ALETHIA_TEST_MYSQL_SQL_MODE: NO_BACKSLASH_ESCAPES,ANSI_QUOTES
          MYSQL_PWD: root-ci
        run: |
          set -o pipefail
          mysql --protocol=TCP -h 127.0.0.1 -uroot --ssl-mode=REQUIRED -N -B \
            -e "SET GLOBAL sql_mode = CONCAT(@@GLOBAL.sql_mode, ',NO_BACKSLASH_ESCAPES,ANSI_QUOTES'); SELECT @@GLOBAL.sql_mode"
          go test -tags integration -count=1 -v -run ByoUsersMySQLServer ./internal/agent/... | tee "$RUNNER_TEMP/byo-modes.log"
          for t in TestByoUsersMySQLServer_SQLMode TestByoUsersMySQLServer_Lifecycle TestByoUsersMySQLServer_RefusesForeignUser TestByoUsersMySQLServer_RevokeFailsSafe TestByoUsersMySQLServer_KillsSessions TestByoUsersMySQLServer_PartialRevokes TestByoUsersMySQLServer_SkipRevoke TestByoUsersMySQLServer_FailedCursorStepDropsNoOtherAccount TestByoUsersMySQLServer_RefusedProvisionedUserIsLocked TestByoUsersMySQLServer_LineTerminatorLookalikeIsNoCandidate TestByoUsersMySQLServer_UserCannotRetagItself TestByoUsersMySQLServer_SessionsNotEndedOnlyWithSessions TestByoUsersMySQLServer_LostSessionRecordIsADoubt TestByoUsersMySQLServer_PrivilegeProbeIsBinary TestByoUsersMySQLServer_ReportLinesCapped TestByoUsersMySQLServer_SessionPastKillCapIsReported TestByoUsersMySQLServer_FailedKillStepIsReported; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/byo-modes.log" || { echo "::error::$t did not PASS on mysql ${{ matrix.mysql }} under NO_BACKSLASH_ESCAPES,ANSI_QUOTES"; exit 1; }
          done

  # The always-reporting aggregator of `byo-users-mysql`, built exactly as `byo-users-postgres-required`
  # above (read its comment): a FIXED name with no `${{ }}`, run with `!cancelled()`, green only when
  # the legs were expected and passed or were not expected and were skipped. It is NOT required yet —
  # it is not one of the `needs:` of `CI required`, and nothing in .mergify.yml or
  # infra/github/variables.tf names it — so a fault in it cannot hold a PR; requiring it is a separate
  # change that adds `byo-users-mysql-required` to `CI required`'s `needs:` (and its count).
  byo-users-mysql-required:
    name: BYO users SQL — real MySQL
    needs: [detect-changes, byo-users-mysql]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed, or the runner did not change
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          RUNNER_CHANGED: ${{ needs.detect-changes.outputs.runner }}
          LEGS_RESULT: ${{ needs.byo-users-mysql.result }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$DETECT_RESULT" != success ]; then
            echo "::error::detect-changes concluded '$DETECT_RESULT', so whether the runner changed is unknown"
            exit 1
          fi
          expected=false
          if [ "$EVENT_SCHEDULE" != "0 3 * * *" ] && { [ "$EVENT_NAME" != pull_request ] || [ "$RUNNER_CHANGED" = true ]; }; then
            expected=true
          fi
          echo "legs expected to run: $expected; matrix result: $LEGS_RESULT"
          if [ "$expected" = true ] && [ "$LEGS_RESULT" = success ]; then
            echo "every BYO users MySQL leg passed"
          elif [ "$expected" = false ] && [ "$LEGS_RESULT" = skipped ]; then
            echo "the runner did not change, so the legs were skipped by design"
          else
            echo "::error::BYO users MySQL legs concluded '$LEGS_RESULT' (expected to run: $expected)"
            exit 1
          fi

  # Database TLS verification on real servers (#6521). The bootstrap Job and the BYO users Job verify
  # the managed database server's certificate before they send it an administrator credential
  # (packages/core/manifests/db_tls.go). The unit tests pin the rendered flags and run the rendered
  # scripts against a fake client; this job runs the same scripts with the real mysql and psql clients
  # against a MySQL 8.4 and a Postgres 16 server whose certificate a throwaway CA signed for one host
  # name. It proves the mechanics each cloud relies on: the identity mode (AWS, Azure) refuses an
  # address the certificate does not name and an unrelated CA; the CA-only mode (GCP) accepts a
  # certificate with no matching name but refuses an unrelated CA; every refusal fails the script with
  # the named reason. It contacts no managed server, so which mode each cloud gets rests on the render
  # tests and the providers' documentation, not on this job. Its second test step re-runs the tests
  # with the scripts mutated back to the old unverified modes and FAILS if they still pass.
  #
  # Not required (no aggregator names it, nothing in .mergify.yml does): it starts two database
  # containers, and an image pull must not wedge the queue. Same trigger as `byo-users-mysql`.
  db-tls-verify:
    name: DB TLS verification — real MySQL 8.4 and Postgres 16
    needs: detect-changes
    if: github.event.schedule != '0 3 * * *' && (github.event_name != 'pull_request' || needs.detect-changes.outputs.runner == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CERTS: ${{ github.workspace }}/.db-tls-certs
      DB_NAME: db-tls.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: packages/core/go.sum
      - name: Pre-fetch Go modules (retrying a transient proxy error)
        run: bash scripts/ci/go-mod-download-retry.sh packages/core
      # The ubuntu-24.04 runner image already ships both clients (mysql-client 8.0 and the PostgreSQL 16
      # client). Going to apt anyway made this job fail on every Ubuntu mirror outage (2026-11-11:
      # "Temporary failure resolving 'azure.archive.ubuntu.com'") while the clients were already there.
      # So apt runs only for a client that is actually missing, and then with retries.
      - name: Install the mysql and psql clients
        run: |
          missing=()
          command -v mysql >/dev/null 2>&1 || missing+=(mysql-client)
          command -v psql >/dev/null 2>&1 || missing+=(postgresql-client)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get -o Acquire::Retries=5 update -q
            sudo apt-get -o Acquire::Retries=5 install -y -q "${missing[@]}"
          fi
          mysql --version
          psql --version
      # A signing CA, an unrelated CA, and one server certificate naming ONLY $DB_NAME (no IP SAN), so
      # dialling 127.0.0.1 is a host-name mismatch. The name resolves to 127.0.0.1 through /etc/hosts.
      - name: Create the test CAs and the server certificate
        run: |
          set -euo pipefail
          mkdir -p "$CERTS"
          cd "$CERTS"
          for ca in ca other-ca; do
            openssl req -x509 -newkey rsa:2048 -nodes -keyout "$ca-key.pem" -out "$ca.pem" -days 2 \
              -subj "/CN=alethia db-tls test $ca" -addext "basicConstraints=critical,CA:TRUE" \
              -addext "keyUsage=critical,keyCertSign,cRLSign"
          done
          openssl req -newkey rsa:2048 -nodes -keyout server-key.pem -out server.csr -subj "/CN=$DB_NAME"
          printf 'subjectAltName=DNS:%s\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n' "$DB_NAME" > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem -CAcreateserial -out server.pem -days 2 -extfile server.ext
          openssl verify -CAfile ca.pem server.pem
          chmod 0644 ./*.pem
          echo "127.0.0.1 $DB_NAME" | sudo tee -a /etc/hosts
      - name: Start MySQL 8.4 and Postgres 16 with that certificate
        run: |
          set -euo pipefail
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=root-ci -v "$CERTS:/certs:ro" mysql:8.4 \
            --ssl-ca=/certs/ca.pem --ssl-cert=/certs/server.pem --ssl-key=/certs/server-key.pem --require-secure-transport=ON
          # Postgres refuses a key file it does not own, so the entrypoint copies the pair first.
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=pg-ci -v "$CERTS:/certs:ro" \
            --entrypoint sh postgres:16 -c 'install -o postgres -m 0600 /certs/server-key.pem /tmp/server-key.pem && install -o postgres -m 0644 /certs/server.pem /tmp/server.pem && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.pem -c ssl_key_file=/tmp/server-key.pem'
          for _ in $(seq 1 60); do
            if MYSQL_PWD=root-ci mysql --protocol=TCP -h 127.0.0.1 -uroot --ssl-mode=REQUIRED -N -B -e 'SELECT 1' >/dev/null 2>&1 &&
               PGPASSWORD=pg-ci psql "host=127.0.0.1 user=postgres sslmode=require" -tAc 'SELECT 1' >/dev/null 2>&1; then
              echo "both servers are up"; exit 0
            fi
            sleep 2
          done
          docker logs mysql | tail -30; docker logs postgres | tail -30
          echo "::error::the database servers did not come up"; exit 1
      # ALETHIA_TEST_DBTLS_REQUIRED turns the tests' skip into a failure, and the grep asserts each
      # test PASSED by name, so a renamed test, a -run matching nothing, or a skip cannot read green.
      - name: go test -tags integration (DB TLS verification, real servers)
        working-directory: packages/core
        env:
          ALETHIA_TEST_DBTLS_CA: ${{ env.CERTS }}/ca.pem
          ALETHIA_TEST_DBTLS_OTHER_CA: ${{ env.CERTS }}/other-ca.pem
          ALETHIA_TEST_DBTLS_NAME: ${{ env.DB_NAME }}
          ALETHIA_TEST_DBTLS_MYSQL_PWD: root-ci
          ALETHIA_TEST_DBTLS_PG_PWD: pg-ci
          ALETHIA_TEST_DBTLS_REQUIRED: "1"
        run: |
          set -o pipefail
          go test -tags integration -count=1 -v -run DBTLSServer ./manifests/ | tee "$RUNNER_TEMP/dbtls.log"
          for t in TestDBTLSServer_BootstrapMySQL TestDBTLSServer_BootstrapPostgres TestDBTLSServer_ByoUsersMySQL TestDBTLSServer_ByoUsersPostgres; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/dbtls.log" || { echo "::error::$t did not PASS"; exit 1; }
          done
      - name: The same tests with the scripts mutated to the unverified modes must FAIL
        working-directory: packages/core
        env:
          ALETHIA_TEST_DBTLS_CA: ${{ env.CERTS }}/ca.pem
          ALETHIA_TEST_DBTLS_OTHER_CA: ${{ env.CERTS }}/other-ca.pem
          ALETHIA_TEST_DBTLS_NAME: ${{ env.DB_NAME }}
          ALETHIA_TEST_DBTLS_MYSQL_PWD: root-ci
          ALETHIA_TEST_DBTLS_PG_PWD: pg-ci
          ALETHIA_TEST_DBTLS_REQUIRED: "1"
          ALETHIA_TEST_DBTLS_MUTATE: unverified
        run: |
          if go test -tags integration -count=1 -v -run DBTLSServer ./manifests/ > "$RUNNER_TEMP/mutant.log" 2>&1; then
            cat "$RUNNER_TEMP/mutant.log"
            echo "::error::the tests passed against unverified connections; they cannot tell verified from unverified"; exit 1
          fi
          for t in TestDBTLSServer_BootstrapMySQL TestDBTLSServer_BootstrapPostgres TestDBTLSServer_ByoUsersMySQL TestDBTLSServer_ByoUsersPostgres; do
            grep -q -- "--- FAIL: $t " "$RUNNER_TEMP/mutant.log" || { cat "$RUNNER_TEMP/mutant.log"; echo "::error::$t did not fail on the unverified mutant"; exit 1; }
          done
          echo "every test failed on the unverified mutant, as it must"
      - name: Server logs
        if: failure()
        run: |
          docker logs mysql 2>&1 | tail -50 || true
          docker logs postgres 2>&1 | tail -50 || true

  # The pinned database CA bundles vs upstream (#6521). INFORMATIONAL. The bootstrap Jobs verify a
  # managed database server against bundles checked into packages/core/manifests/dbca, pinned (source
  # URL and sha256) in dbca/SOURCES.json; nothing fetches them at run time, so a provider that adds or
  # rotates a root would otherwise go unnoticed until a Job failed to verify. This fetches every pinned
  # source and goes red when one no longer matches its pin; the remedy is
  # `scripts/db-ca-bundles.sh update`, a review of which roots changed, and a PR. It runs on the Monday
  # cron (which, like every schedule, runs the default branch's tree), on dispatch, and on a PR that
  # changes the bundles or the script. Not required, and nothing waits on it, so a rotation upstream is
  # noticed without wedging the queue.
  db-ca-bundles:
    name: DB CA bundles vs upstream (informational)
    if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare every pinned source with what upstream serves
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] &&
            ! git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qE '^(packages/core/manifests/dbca/|scripts/db-ca-bundles\.sh$)'; then
            echo "this PR does not change the CA bundles; the weekly run checks them"; exit 0
          fi
          bash scripts/db-ca-bundles.sh check

  coverage-determinism:
    name: Coverage determinism probe (manual)
    # MANUAL ONLY. This exists to answer one question before the ratchet is armed: are the numbers
    # CI produces stable, and are they the same numbers a laptop produces?
    #
    # They are not, and that is the whole point. Go coverage here depends on what is on PATH:
    # measured locally, packages/core/tofu moves 51.98% -> 36.72% with `tofu` removed,
    # packages/core/provisioner 50.73% -> 39.12%, apps/runner/internal/agent 49.58% -> 47.24%
    # (those suites self-skip). packages/core/api moves by two statements depending on whether an
    # alethia credentials file exists in the user's config dir — which it does on a maintainer's
    # Mac and never in CI. Recording floors from a laptop therefore bakes numbers CI can never
    # reach and reds EVERY PR in the repository until someone regenerates them.
    #
    # So: run this, read its output, and generate the floors from THESE numbers.
    #
    # It compares PARSED pairs, never raw profiles — block order in a coverprofile follows package
    # completion order under `go test -p N` and is genuinely unstable run to run, so diffing or
    # checksumming the file itself is broken on arrival.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apps/cli, apps/runner, packages/core, test/e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # The `go` job's module pre-fetch, in the GOWORK mode the runs below use (#6031).
      - name: Pre-fetch Go modules (retrying a transient proxy error)
        run: |
          GOWORK=${{ matrix.module == 'test/e2e' && 'off' || 'auto' }} \
            bash scripts/ci/go-mod-download-retry.sh ${{ matrix.module }}
      # Must mirror the `go` job's toolchain EXACTLY, or the numbers this probe prints are not
      # the numbers the ratchet will compare against and flooring from them reds every PR.
      - uses: azure/setup-helm@v5
        if: matrix.module == 'apps/runner'
        with:
          version: v3.16.3
      - uses: opentofu/setup-opentofu@v2
        if: matrix.module == 'packages/core' || matrix.module == 'apps/runner'
        with:
          tofu_version: "1.9.0"
      - name: Which coverage-affecting binaries does this runner image actually ship?
        run: |
          for b in docker git helm kubectl tofu; do
            printf '%-10s %s\n' "$b" "$(command -v "$b" || echo MISSING)"
          done
      - name: Five runs, comparing parsed pairs
        run: |
          for i in 1 2 3 4 5; do
            (cd ${{ matrix.module }} && GOWORK=${{ matrix.module == 'test/e2e' && 'off' || 'auto' }} \
              go test -count=1 -coverprofile=cover.$i.out ./... >/dev/null)
            bash scripts/go-coverage.sh --module ${{ matrix.module }} \
              --profile ${{ matrix.module }}/cover.$i.out --print >run.$i.txt
          done
          echo "── per-package covered/total, run 1 ──"
          cat run.1.txt
          if [ "$(cat run.*.txt | sort -u | wc -l)" -eq "$(wc -l <run.1.txt)" ]; then
            echo "✓ ${{ matrix.module }} is run-to-run deterministic across 5 runs"
          else
            echo "::error::${{ matrix.module }} is NONDETERMINISTIC — do NOT floor it. Differing rows:"
            cat run.*.txt | sort | uniq -c | awk '$1 != 5'
            exit 1
          fi
      - name: Floors these numbers would produce (copy into the A4 PR)
        run: |
          bash scripts/go-coverage.sh --module ${{ matrix.module }} \
            --profile ${{ matrix.module }}/cover.1.out --update
          echo "── ${{ matrix.module }}/coverage-floors.json ──"
          cat ${{ matrix.module }}/coverage-floors.json
      # The artifact IS the job (#4605): this probe exists to hand a maintainer the floors to paste
      # into the A4 PR, so a run that publishes nothing has produced nothing, and it used to say so
      # only by being an empty download. The step before it writes the file with `--update` and
      # fails the job if it cannot, so `error` cannot fire on any path where the job is otherwise
      # green — it turns "silently empty" into "red", and adds no new way to fail.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-floors-${{ strategy.job-index }}
          path: ${{ matrix.module }}/coverage-floors.json
          if-no-files-found: error

  ts-coverage-determinism:
    name: TS coverage determinism probe (manual)
    # MANUAL ONLY. The same question `coverage-determinism` asks of Go, asked of TypeScript: are
    # the numbers CI produces stable run-to-run, and are they the numbers a laptop produces?
    #
    # They are NOT a laptop's, and that is the point of running it here. What makes the floors it
    # records reachable by the job that ENFORCES them is that this job and the required
    # `typescript` job run the same turbo `test` tasks — same build, same ee/dist, same measured
    # scope. Floors recorded from a laptop would bake in numbers CI can never reproduce and would
    # red — or worse, silently DEMOTE — every PR in the repository.
    #
    # ONE DIFFERENCE SINCE THE SHARD SPLIT, and it is licensed by a measurement rather than argued
    # away: this probe runs the console's suite UNSHARDED, while `ts-test` measures the merge of
    # TS_CONSOLE_SHARDS shards. `ts-shard-equivalence` (dispatch with `ts_shard_equivalence=true`)
    # runs both on one commit and fails on any per-file covered/total difference — dispatch it
    # alongside this probe whenever floors are recorded after a change to vitest, its coverage
    # provider or the merge.
    #
    # (This comment used to claim the opposite: that the probe "deliberately does NOT build
    # @alethia/ee" and therefore measures COMMUNITY scope. That was already corrected twice
    # elsewhere in this file, and every committed floors file records `ee_dist: true`. An inverted
    # comment sitting directly above the code is how the next reader edits in the wrong direction,
    # so it is deleted rather than annotated.)
    #
    # So: run this, read its output, and generate the floors from THESE numbers.
    #
    # The body is scripts/ci/ts-coverage-probe.sh rather than a `run:` block, for two reasons
    # (#3265). A `workflow_dispatch`-only step is exercised by nothing, so a defect in it survives
    # indefinitely — as a script it has a `--self-test` the `guards` job runs on every PR. And the
    # project list belongs to scripts/ts-coverage-sweep.json, not to four hand-typed copies here:
    # the clean-up, the print loop, the update loop and the artefact `path:` all named three
    # projects against a record of six, which is why `apps/marketing` and `ee` could never get the
    # numbers this job exists to produce. `--force` on every run lives in the script's default
    # suite command, or turbo replays run 1's cached coverage/ outputs and the probe proves
    # nothing at all.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: What this runner actually carries (the fingerprint, verbatim)
        run: |
          printf '%-22s %s\n' os "$(uname -s)"
          printf '%-22s %s\n' node "$(node -v)"
          printf '%-22s %s\n' ALETHIA_EDITION "${ALETHIA_EDITION:-unset}"
          printf '%-22s %s\n' ee/dist "$(test -f ee/dist/index.js && echo present || echo ABSENT)"
          node -p "require('./node_modules/@vitest/coverage-v8/package.json').version" 2>/dev/null \
            || echo "coverage-v8 version: resolved per-project"
      # The count comes from the dispatch input, defaulted in BOTH places: the `||` here covers an
      # event where `inputs` does not exist at all, and the script's own `${ALETHIA_TS_PROBE_RUNS:-5}`
      # covers being run by hand.
      #
      # An EMPTY value is safe — `${VAR:-5}` substitutes for empty as well as unset, checked rather
      # than assumed. What is NOT safe is `0`, which survives that default and (on GNU seq) runs the
      # loop zero times, so the probe would report success having compared nothing. The script now
      # rejects anything below 2; this comment records why the rejection is there rather than
      # leaving it to look like fussiness.
      - name: N runs, compared — then the floors those numbers produce
        id: probe
        env:
          ALETHIA_TS_PROBE_RUNS: ${{ inputs.ts_probe_runs || '5' }}
        run: scripts/ci/ts-coverage-probe.sh
      # ONE staged directory, written by the probe from the sweep record. The explicit list that
      # used to live here named the same three projects as the loops did, so even with the loops
      # fixed, marketing's and ee's floors would never have left the runner — and arming them is
      # the whole reason anybody dispatches this job.
      - uses: actions/upload-artifact@v7
        with:
          name: ts-coverage-floors
          path: ts-coverage-floors/
          if-no-files-found: error
      # plan-catalog's raw artefact rides along deliberately: it is the smallest project, so a
      # verbatim copy is a committable size, and it is how the --self-test fixture gets captured
      # from a REAL vitest run with real CI absolute paths rather than hand-written.
      #
      # IT GETS ITS OWN STEP, and that is the whole of #4347. `if-no-files-found` is AGGREGATE —
      # the action globs every `path:` entry together and asks `filesToUpload.length === 0` once —
      # so while this fixture shared a step with `ts-coverage-floors/`, the fixture alone satisfied
      # the guard and an EMPTY staged directory uploaded happily. The dispatch would report success
      # having armed nothing, which is the one outcome the `error` is there to prevent. Split, an
      # empty `ts-coverage-floors/` fails the step above on its own. `pnpm check:upload-aggregate`
      # refuses any re-merge.
      #
      # THE `if:` IS PART OF THE SPLIT, not decoration. Actions stops a job at its first failing
      # step, so once the step above can fail — which is the entire point — an empty floors
      # directory would ALSO skip this one, and a dispatch that used to yield the fixture would
      # start yielding nothing at all. Splitting a step to make one artefact's absence loud must not
      # make the other artefact's presence conditional on it. Gated on the probe rather than left
      # bare: if the probe itself died there is legitimately nothing to upload, and a second red
      # step accusing the fixture of being missing would name the wrong cause.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.probe.outcome == 'success' }}
        with:
          name: ts-coverage-plan-catalog-fixture
          path: packages/plan-catalog/coverage/coverage-final.json
          if-no-files-found: error

  ts-shard-equivalence:
    name: TS shard equivalence — unsharded vs merged console coverage (manual)
    # MANUAL ONLY, and only when asked (`-f ts_shard_equivalence=true`): the proof that licenses the
    # shard split. The console's floors are RECORDED from an unsharded run (the determinism probe
    # above) and ENFORCED against the merge of TS_CONSOLE_SHARDS shards (`ts-test`). That is only
    # sound if the two produce the same numbers, and the argument for it (istanbul's merge is the
    # operation vitest itself applies across test files and environments, and across shards in
    # `--merge-reports`) is an argument, not a measurement. This is the measurement: on ONE commit,
    # the suite unsharded here, against the real shards' artefacts from `ts-test-console` in the same
    # run, merged by the same command `ts-test` uses — compared per FILE on statements, functions and
    # branch arms, and per DIRECTORY on what the ratchet gates. Any covered/total difference is red.
    #
    # If it is ever red, do not loosen the comparison: the step log names every differing file. A
    # one-statement wobble in a directory the determinism probe has already seen flap (#3342,
    # apps/console/lib/billing) is the probe's question, answered by re-running; a difference that
    # REPEATS is a real divergence between the two paths and blocks trusting the merge for that file.
    #
    # `needs: [ts-test-console]` so the shards it compares against are this run's own; a failed shard
    # skips this job (there is nothing whole to compare). ~25 minutes: the unsharded suite is the
    # cost the shards exist to avoid.
    needs: [ts-test-console]
    if: github.event_name == 'workflow_dispatch' && inputs.ts_shard_equivalence == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same explicit build the shards and `ts-test` do, so this job's fingerprint matches theirs —
      # the merge below refuses the shards otherwise.
      - name: Build @alethia/ee
        run: pnpm -F @alethia/ee build
      # The SAME turbo task the shards run, minus `--shard`. No turbo cache is restored in this job,
      # and `--force` makes that explicit: a replayed coverage/ would compare the shards against an
      # older run instead of this commit's.
      - name: The console suite, UNSHARDED
        run: |
          set -euo pipefail
          pnpm exec turbo run test --filter=console --force
          mkdir -p shard-equivalence
          mv apps/console/coverage/coverage-final.json shard-equivalence/unsharded.json
      - name: Download the console shards' coverage
        uses: actions/download-artifact@v8
        with:
          pattern: console-coverage-shard-*
          path: console-shards
          merge-multiple: false
      - name: Merge them with the command ts-test uses
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/ts-coverage-shards.mjs merge --project apps/console --from console-shards --shards "$TS_CONSOLE_SHARDS" --out shard-equivalence/merged/coverage-final.json
      - name: Compare — any per-file covered/total difference fails
        id: compare
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/ts-coverage-shards.mjs compare --project apps/console --first shard-equivalence/unsharded.json --second shard-equivalence/merged/coverage-final.json
      # Both maps, so a red comparison can be re-read file by file without re-running ~25 minutes.
      # Gated on the comparison having RUN: before that the directory is incomplete, and an upload
      # error on top of the real failure would name the wrong cause.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && (steps.compare.outcome == 'success' || steps.compare.outcome == 'failure') }}
        with:
          name: ts-shard-equivalence
          path: shard-equivalence/
          if-no-files-found: error
          retention-days: 7

  runner-image-arch:
    name: Runner image arch (amd64 ships x86-64 — INCIDENT 2026-07-22 guard)
    # Would have caught the 2026-07-22 fleet-churn incident BEFORE prod: apps/runner/Dockerfile.base
    # shipped an arm64 binary inside the amd64 image (a stray `ARG TARGETARCH=arm64` default), so every
    # x86 fleet VM crash-looped on `execve` ENOEXEC and never registered. A plain `go build` can't
    # reproduce a Dockerfile ARG regression — so BUILD THE REAL IMAGE for linux/amd64 and assert its
    # /usr/local/bin/runner is a genuine x86-64 ELF (e_machine 0x3e), not aarch64 (0xb7). runner-base
    # carries the compiled binary that every per-cloud image inherits FROM without rebuilding, so this
    # one build covers runner-{aws,gcp,azure,alibaba,hetzner}. Mirrors scripts/e2e/runner-e2e.sh's
    # `register` stage (which asserts the same on the PUBLISHED images). Gated on the runner surface.
    needs: [detect-changes]
    if: needs.detect-changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runner-base for linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile.base
          platforms: linux/amd64
          load: true
          tags: runner-base:arch-check
          cache-from: type=gha,scope=runner-base-amd64
      - name: Assert /usr/local/bin/runner is x86-64 (e_machine 0x3e, not 0xb7 aarch64)
        run: |
          em=$(docker run --rm --entrypoint sh runner-base:arch-check \
                 -c 'od -An -tx1 -j18 -N2 /usr/local/bin/runner' | tr -d ' ')
          echo "amd64 /runner e_machine=$em"
          case "$em" in
            3e00) echo "OK — amd64 runner is x86-64 (e_machine=0x3e)" ;;
            b700) echo "::error file=apps/runner/Dockerfile.base::amd64 image ships an ARM64 runner (e_machine=0xb7) — the 2026-07-22 fleet-churn INCIDENT bug (arm64 binary in the amd64 image). Ensure the builder cross-compiles from buildx's TARGETARCH with NO arm64 default."; exit 1 ;;
            *)    echo "::error file=apps/runner/Dockerfile.base::unexpected e_machine=$em in the amd64 runner binary (expected 0x3e x86-64)"; exit 1 ;;
          esac

  provision-e2e:
    name: Provisioning E2E (T1 · real runner → kind)
    # RUNS ON EVERY MERGIFY QUEUE BUILD (#2759), and on `merge_group` should a native queue return.
    #
    # History, because the comment here was wrong for six weeks: this job used to be
    # `merge_group`-only. That event fires only under GitHub's NATIVE queue, which `.mergify.yml`
    # replaced on 2026-07-21 — precisely because this job failed on missing auth env there and
    # wedged every queued PR. Measured 2026-09-03: all 107 merge_group CI runs are dated
    # 2026-07-18..21, so T1 had no live trigger at all from then until #2759.
    #
    # A Mergify queue build is a `pull_request` run whose head is the draft PR Mergify opens from
    # `mergify/merge-queue/<hash>`, so `github.head_ref` is the selector. On a feature PR's own run
    # this job is `skipped`; on the queue build it runs. The branch name alone is not an identity —
    # anyone can open a PR from a fork branch with that name — so the head repository must also be
    # this one; Mergify pushes its queue branches here. (A fork that edits ci.yml can rewrite this
    # `if:` too; scripts/merge-signal-health.sh applies the same head-repository test, so such a
    # run is never graded as queue evidence either way.)
    #
    # WHY THIS CANNOT WEDGE THE QUEUE: it is OBSERVE-ONLY. The name is in none of the three
    # required-check lists (infra/github/variables.tf, .mergify.yml merge_conditions and
    # merge_protections — scripts/ci/check-required-checks.mjs keeps those in step), and nothing
    # `needs:` it, so a red, a skip or a cancel here reaches no condition Mergify waits on. The one
    # visible effect of a red is the queue build's overall run conclusion. Promoting it is NOT a
    # list edit: merge_protections are evaluated on the PR itself, where this job is skipped, and
    # Mergify's `check-success=` does not accept `skipped` — see the always-report rule
    # scripts/merge-signal-health.sh prints with any PROMOTE verdict.
    #
    # It stays off manual dispatch: that lacks the real runner/control-plane prerequisites and
    # would produce a predictable red rather than a useful signal.
    #
    # What it does, when it runs: a real runner PROCESS claims a QUEUED job from a real
    # Postgres-backed control plane and drives the full RunDeployV2 spine against a genuine `kind`
    # cluster. kind boot + provider/image pulls are heavy, which is why it was never per-push. The
    # `e2e_t1` build tag keeps it out of the fast per-PR Go suite; ALETHIA_E2E_T1_REQUIRE=1 turns a
    # missing prerequisite (docker/kind/tofu) into a HARD FAIL, never a green skip, so the signal
    # cannot hollow out. Extends the in-process T0 (which stays in the `go` job as a compile check).
    if: >-
      github.event_name == 'merge_group'
      || (github.event_name == 'pull_request'
          && startsWith(github.head_ref, 'mergify/merge-queue/')
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    services:
      # Mirrors the `integration` job: a throwaway Postgres that db:migrate turns into
      # the real control-plane schema + programmables (claim_next_job / update_job_status
      # / insert_job_log) the runner's claim + callbacks + log-shipping exercise.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      # kind is slower than the in-process T0 — give the reachability gate room.
      ALETHIA_CLUSTER_READY_TIMEOUT: 3m
      # In the merge queue a missing prerequisite is a HARD FAIL, never a green skip.
      ALETHIA_E2E_T1_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.9.0"
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - uses: azure/setup-kubectl@v5
      # `go install pkg@version` fetches from proxy.golang.org like any module download, so it runs
      # under the same retry as the harness's own modules below (#6031).
      - name: Install kind CLI (independent kubeconfig + cluster-leak cleanup)
        id: kind
        run: |
          bash scripts/ci/go-mod-download-retry.sh -- go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Pre-fetch test/e2e's Go modules (retrying a transient proxy error)
        run: GOWORK=off bash scripts/ci/go-mod-download-retry.sh test/e2e
      # ArgoCD's images come from the RUNNER's docker, not from the kubelet inside kind (#6044). The
      # chart's redis lives on ECR Public, which limits anonymous pulls per source IP in rate AND in
      # data, and GitHub's runners share IPs: pulled by the kubelet, it hit `toomanyrequests`, sat in
      # ImagePullBackOff and redded queue batches. Here the list is RENDERED from the argo-cd chart
      # at the version the runner installs (cmd/argoimages), so a chart bump cannot leave an image
      # out, and each image is pulled under a retry that waits out a rate limit and says so. An
      # `ecr-public.aws.com/docker/library/*` image is pulled from mirror.gcr.io and tagged to the
      # ECR reference the chart renders, because a retry cannot wait out ECR Public's exhausted data
      # quota (#6067); ECR Public is the fallback, and a notice names the source that served it. The
      # T1 test then loads them into kind as soon as the runner has created it.
      #
      # #7698: the load is `kind load image-archive` of ONE archive saved for the runner's platform
      # only (scripts/e2e/t1-kind-images.sh). `kind load docker-image` on this runner's
      # containerd-store Docker saved every platform's manifest without their blobs, and every
      # import failed — so the kubelet pulled redis from ECR Public anyway and hit the 429. The
      # archive is RESTORED from actions/cache under a key made of the image list itself; a queue
      # build cannot usefully SAVE one (its cache is scoped to its own PR ref), so the
      # `t1-kind-images` job seeds it from main. Only a miss pulls, mirror first, under the retry.
      - name: Render the image list the pinned ArgoCD chart names, and its cache key
        id: t1img
        working-directory: test/e2e
        run: |
          GOWORK=off go run ./cmd/argoimages > "$RUNNER_TEMP/argocd-images.txt"
          key=$(bash "$GITHUB_WORKSPACE/scripts/e2e/t1-kind-images.sh" key "$RUNNER_TEMP/argocd-images.txt")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the image archive (seeded from main by `t1-kind-images`)
        id: t1cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/t1-kind-images.tar
          key: ${{ steps.t1img.outputs.key }}
      - name: Pull and archive the images (cache miss — mirror first, retrying a rate limit)
        if: steps.t1cache.outputs.cache-hit != 'true'
        run: bash scripts/e2e/t1-kind-images.sh archive "$RUNNER_TEMP/argocd-images.txt" "$RUNNER_TEMP/t1-kind-images.tar"
      - run: pnpm install --frozen-lockfile
      - name: Migrate the control-plane database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # B6.1 — the gated-promotion chain is console + DB logic (no cloud, no kind), so it runs here
      # first (fast feedback) against the SAME migrated Postgres: it drives the REAL exported console
      # actions (advancePromotionOnPlan → applyPromotionApproval → finalizeDeployment +
      # finalizePromotionOnDeploy) via the tsx shim and asserts the classification gate blocks, the
      # approval clears it, the DEPLOY reaches SUCCESS through the update_job_status SSOT, and the
      # promotion finalizes. ALETHIA_E2E_B6_REQUIRE=1 makes a missing prereq a hard fail (never a skip).
      - name: B6.1 — gated dev→staging promotion (classification gate → approval → deploy → finalize)
        working-directory: test/e2e
        env:
          ALETHIA_E2E_B6_REQUIRE: "1"
        run: GOWORK=off go test -tags=e2e_b6 ./... -run TestB6GatedPromotion -count=1 -timeout 8m -v
      # 25m: the test's own ctx is 20m (deploy wait 8m + ArgoCD Healthy+Synced
      # convergence assertion 8m + build/boot headroom) plus teardown margin.
      - name: T1 — real runner claims from the control plane and provisions kind
        working-directory: test/e2e
        env:
          ALETHIA_E2E_T1_PRELOAD_IMAGES: ${{ runner.temp }}/argocd-images.txt
          ALETHIA_E2E_T1_PRELOAD_ARCHIVE: ${{ runner.temp }}/t1-kind-images.tar
        run: GOWORK=off go test -tags=e2e_t1 ./... -run TestT1RealRunnerKindProvisioning -count=1 -timeout 30m -v
      # `always()` is deliberate — a leaked cluster must be swept on a CANCEL too, which is the one
      # thing `!cancelled()` would not do. What it must not do is run when `kind` was never
      # installed: this job has `services:`, so a failed image pull reds `Initialize containers`
      # before checkout and skips every step here, and `kind delete` would then be a
      # command-not-found swallowed by `|| true` — a green step that swept nothing (#4084).
      - name: Teardown any leaked kind clusters (safety net)
        if: always() && steps.kind.outcome == 'success'
        run: kind delete clusters --all || true

  t1-kind-images:
    name: T1 image archive (seed cache · kind load smoke)
    # Builds the archive provision-e2e loads into kind (#7698), loads it into a REAL kind node and
    # asserts every image arrived — the one thing about T1's pre-load a feature PR can otherwise
    # never see, because T1 runs only on a Mergify queue build. Its other job is the cache: a queue
    # build is a pull_request run, and a cache it saved would be scoped to its own refs/pull/N/merge,
    # which no other run can read; a cache saved from main can be read by every pull_request run.
    # So on a push to main and on the nightly cron this SAVES the archive (when the key is new), and
    # on a PR it only restores. Observe-only: nothing `needs:` it and it is in no required list.
    needs: [detect-changes]
    if: >-
      github.event_name == 'push'
      || github.event.schedule == '0 3 * * *'
      || needs.detect-changes.outputs.t1_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND_CLUSTER: t1-images-smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      # The pin provision-e2e renders the chart with, so the list — and the key — are the same.
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: Install kind CLI (the version provision-e2e loads with)
        id: kind
        run: |
          bash scripts/ci/go-mod-download-retry.sh -- go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Pre-fetch test/e2e's Go modules (retrying a transient proxy error)
        run: GOWORK=off bash scripts/ci/go-mod-download-retry.sh test/e2e
      - name: Render the image list the pinned ArgoCD chart names, and its cache key
        id: t1img
        working-directory: test/e2e
        run: |
          GOWORK=off go run ./cmd/argoimages > "$RUNNER_TEMP/argocd-images.txt"
          key=$(bash "$GITHUB_WORKSPACE/scripts/e2e/t1-kind-images.sh" key "$RUNNER_TEMP/argocd-images.txt")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the image archive
        id: t1cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/t1-kind-images.tar
          key: ${{ steps.t1img.outputs.key }}
      - name: Pull and archive the images (cache miss — mirror first, retrying a rate limit)
        if: steps.t1cache.outputs.cache-hit != 'true'
        run: bash scripts/e2e/t1-kind-images.sh archive "$RUNNER_TEMP/argocd-images.txt" "$RUNNER_TEMP/t1-kind-images.tar"
      - name: Create a kind cluster
        run: kind create cluster --name "$KIND_CLUSTER" --wait 120s
      # `kind load image-archive` runs the same `ctr images import --all-platforms` T1's pre-load
      # does; check-node then reads the node's containerd, so "kind exited 0" is not the evidence.
      - name: Load the archive into kind, and assert every image arrived
        run: |
          kind load image-archive --name "$KIND_CLUSTER" "$RUNNER_TEMP/t1-kind-images.tar"
          bash scripts/e2e/t1-kind-images.sh check-node "$KIND_CLUSTER-control-plane" "$RUNNER_TEMP/argocd-images.txt"
      # Saved only AFTER the archive loaded, so the cache never holds one kind cannot import.
      - name: Seed the cache from main (push / nightly, new key only)
        if: >-
          steps.t1cache.outputs.cache-hit != 'true'
          && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/t1-kind-images.tar
          key: ${{ steps.t1img.outputs.key }}
      - name: Delete the kind cluster
        if: always() && steps.kind.outcome == 'success'
        run: kind delete cluster --name "$KIND_CLUSTER" || true

  go-coverage-badge:
    name: Go coverage badge (self-hosted)
    runs-on: ubuntu-latest
    # Push-to-main only: aggregate the three Go modules' coverage into one badge JSON the README
    # renders, and commit it. `[skip ci]` avoids a run loop.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    # SERIALISED behind the TypeScript badge job. Both jobs force-push their own tree to `badges`,
    # and each restores the other's badge first so the push is additive. Run concurrently they
    # would both restore from the SAME base, and the second to push would silently revert the
    # first's fresh number — a lost update, with both jobs green. `needs:` removes that race
    # rather than narrowing it.
    #
    # BUT `needs:` CARRIES AN IMPLICIT success() ON THE UPSTREAM JOB, and a matching `if:` does not
    # cancel it — only a status function does. Left bare, a failure anywhere in `coverage-badge`
    # (its install, its suites, its push) would SKIP this job entirely, so a TypeScript-side
    # problem would cost BOTH badges instead of one, and the Go badge would be skipped rather than
    # red. That is the same "a failure vetoes an unrelated unit downstream of it" shape this PR is
    # fixing elsewhere, so it must not be reintroduced here.
    #
    # `!cancelled()` degrades `needs:` to pure ORDERING: the job still runs after its predecessor,
    # whatever that predecessor's outcome, and a TypeScript failure leaves one stale badge instead
    # of two frozen ones.
    needs: coverage-badge
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The Go matrix job's packages/core pins: helm v3.21.4 and tofu 1.9.0. This job runs
      # `go test ./...` over packages/core and apps/runner, so any test that treats a missing binary
      # as a CI failure fails here too: without tofu, TestNodePoolContract_ReferenceRunsEveryCase
      # t.Fatal'd on every main push and the Go badge was never published (#5948). Unconditional,
      # because this job always covers both modules. One helm serves both: the matrix job gives
      # apps/runner helm v3.16.3, so here the runner suites run against v3.21.4, a pairing no
      # per-PR job exercises. Keep these pins in step with the matrix job's packages/core leg.
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.9.0"
      - name: Pre-fetch Go modules (retrying a transient proxy error)
        run: bash scripts/ci/go-mod-download-retry.sh apps/cli apps/runner packages/core
      - name: Cover each Go module
        run: |
          for m in apps/cli apps/runner packages/core; do
            (cd "$m" && go test -coverprofile=cover.out ./...)
          done
      - name: Compute aggregate Go coverage → badge JSON
        run: node scripts/go-coverage-badge.mjs
      # Publish UNCONDITIONALLY — the identical `git diff --quiet` trap the TypeScript badge job
      # above carried. `git diff` reports TRACKED paths only; on an untracked one it exits 0
      # ("clean") while `git status --porcelain` correctly prints `?? <path>`. Now that the badge
      # JSON is no longer checked in, the regenerated file is always untracked and that guard
      # would have reported "unchanged" on every run — freezing the badge with this job GREEN.
      # That is the same swallowed-signal shape this job's own post-mortem below describes.
      #
      # Safe to drop because the file is untracked: every run starts from a fresh checkout of
      # main where it does not exist, so `git add` always stages a new file and `git commit`
      # can never fail with "nothing to commit".
      - name: Publish the badge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Carry the sibling badge forward — see the long note in the `coverage-badge` job. A
          # force-push publishes THIS tree, and this tree no longer contains `coverage.json`, so
          # without restoring it first this job would delete the TypeScript badge and 404 the
          # README. `|| true` is correct only for the first-run case where the file does not exist.
          #
          # This job also `needs: coverage-badge`, which removes the race outright: the two ran
          # concurrently, each restoring the other's file from the SAME base, so whichever pushed
          # second would silently revert the first's fresh number. Serialised, this one fetches a
          # `badges` that already carries the TypeScript job's new value.
          # `|| true` on the fetch would be a fail-open that silently reintroduces the deletion
          # this block exists to prevent: no FETCH_HEAD, no sibling restored, force-push drops it,
          # job green. So the ONLY tolerated absence is a `badges` branch that genuinely does not
          # exist yet (the very first publish); a fetch that FAILS against an existing branch reds
          # this job.
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges
            # `checkout … || echo` would swallow EVERY failure of that command, not only the one
            # absence we mean to tolerate: a wrong FETCH_HEAD, a moved path or a locked index would
            # all print the same notice and then force-push the sibling away, green. So the
            # tolerated case is tested for explicitly and the checkout itself is strict.
            if git cat-file -e "FETCH_HEAD:.github/badges/coverage.json" 2>/dev/null; then
              git checkout FETCH_HEAD -- .github/badges/coverage.json
            else
              echo "::notice::no coverage.json on \`badges\` yet — nothing to carry forward"
            fi
          else
            echo "::notice::\`badges\` does not exist yet — first publish, nothing to carry forward"
          fi
          # -f is defensive: .gitignore carries a bare `coverage` rule, which does NOT match this
          # path today (no component is exactly `coverage`), but a future broadening of that rule
          # must not silently stop the badge instead of failing.
          git add -f .github/badges/
          # --no-verify: the repo's pre-commit hook (core.hooksPath) blocks direct
          # commits to main; this CI-authored badge commit is legitimate.
          git commit --no-verify -m "chore(ci): update go coverage badge [skip ci]"
          # WHY NOT `git push` TO MAIN, AND WHY NO `|| true`:
          #
          # `protect-main` (infra/github/main.tf) is enforcement:active with bypass_actors:[]
          # and a pull_request rule, so EVERY update to refs/heads/main must arrive via a PR.
          # This push was refused with `GH006: Protected branch update failed … Changes must be
          # made through a pull request`, and `|| echo "::warning::badge push skipped"` turned
          # that hard failure into a green job. `permissions: contents: write` never mattered —
          # the token has the permission, the ruleset denies the ref update.
          #
          # Consequence: this job had NEVER pushed successfully. .github/badges/go-coverage.json
          # has exactly one commit in its history (23892e35, 2026-06-28, hand-authored); the
          # job was added 2026-06-30 and the ruleset created 2026-07-03. The README advertised
          # 21.6% for five weeks while the real aggregate was 61.2% — a 40-point error that the
          # swallowed exit code hid. The TypeScript badge above was dead for the same reason.
          #
          # The rulesets match only refs/heads/{dev,main,staging} with empty excludes, so the
          # orphan `badges` branch is writable with no Terraform apply and no hole in main.
          git push --force origin HEAD:badges

  mutation:
    name: Mutation testing (Stryker + Gremlins)
    # The objective "are the tests real" check. Slow — runs WEEKLY + on manual dispatch only,
    # never on PRs. Report-only for now (|| true); ratchet to a hard threshold as scores climb.
    # Pinned to the MONDAY cron by its expression, not to `event_name == 'schedule'`: ci.yml now
    # also carries a nightly cron for the UI audit, and the looser test would have quietly turned
    # this weekly job into a nightly one.
    if: github.event.schedule == '0 6 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - run: pnpm install --frozen-lockfile
      - name: TS mutation (Stryker — lib + actions)
        run: pnpm -C apps/console run mutate || true
      - name: Go mutation (Gremlins — all modules)
        # The install is the one fetch here that can red the job — the run after it is `|| true` —
        # so it is the one put under the module-fetch retry (#6031).
        run: |
          bash scripts/ci/go-mod-download-retry.sh -- go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
          scripts/go-mutation.sh || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    if: github.event.schedule != '0 3 * * *'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license for ORG-owned repos, so we run the
      # open-source gitleaks binary directly (MIT). Scan only the PR/push diff — the
      # .gitleaks.toml is authored for diff-only scanning so pre-existing history findings
      # don't block new PRs (see that file's header).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan new commits for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "scanning ${BASE}..${HEAD}"
            gitleaks git . --redact --log-opts="${BASE}..${HEAD}"
          else
            echo "base commit unavailable — scanning latest commit only"
            gitleaks git . --redact --log-opts="-1"
          fi

  addon-charts-render:
    name: Add-on charts render (helm template · pinned charts)
    runs-on: ubuntu-latest
    # NOT ON THE UI-AUDIT NIGHTLY. `schedule` fires every job with no `if:` at all, so the
    # 03:00 cron added for the console UI audit would have signed this one up for a nightly
    # run it never asked for — the same trap the cron block records for `mutation`, which
    # only covers jobs that gate on `schedule` in the first place. See ci.yml's `on.schedule`.
    # AFFECTED-ONLY: skipped only when armed and the whole diff is `.md`/`.mdx` (see `detect-changes`).
    needs: [detect-changes]
    if: ${{ !cancelled() && github.event.schedule != '0 3 * * *' && needs.detect-changes.outputs.ts_skip != 'true' }}
    # Its own job because it needs helm on PATH and fetches real charts — neither belongs in the
    # console's vitest run. It renders the DEFAULT values of every marketplace add-on against its
    # pinned chart and requires exit 0.
    #
    # #2058 is why this exists: Loki's entry paired `deploymentMode: SingleBinary` with non-zero
    # read/write/backend replicas. Both values are individually valid, the combination is rejected by
    # the chart's own validate.yaml, and NOTHING in this repo could see it — types pass, unit tests
    # assert what the resolver emits rather than what the chart accepts, and neither parity guard
    # measures add-on values. It shipped, and a real cluster found it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      # BEFORE the real run, and cheap: it stubs helm out entirely. The retry this job gained in
      # #2754 is the dangerous kind of change — too eager and it re-rolls a genuine render failure,
      # which is precisely the defect (#2058) this job exists to catch. The self-test asserts the
      # attempt COUNTS, not just the outcomes, because a function that gives up after one attempt
      # returns the same shape as one that tried three times.
      - name: ...and the fetch-vs-render classifier is not too eager
        run: node apps/console/scripts/check-addon-charts-render.mjs --self-test
      # ITS OWN STEP, AND THAT IS THE FIX (#3961). "we could not reach the repository" and "the chart
      # does not render with our values" are different diagnoses with different owners, and until
      # this they shared one exit code under one name — so a reader could not tell a third party's
      # downtime from our defect without opening the log, which is how a gate becomes one people
      # re-run without reading. Split, the checks list answers it: red HERE is somebody else's
      # uptime, red BELOW is this repo's values.
      #
      # It probes every distinct chart repo the generated fixtures name — derived from them, never
      # a typed list — and scores each against scripts/ci/chart-repo-outages.txt. An outage a human
      # has recorded there does not red it; a NEW one does, and so does a recorded one that has
      # RECOVERED, which is what stops the ledger outliving the outage it excuses.
      - name: Chart repositories are reachable (third-party uptime, not this repo's code)
        run: node apps/console/scripts/check-addon-charts-render.mjs --reachability
      - name: Every add-on renders with its pinned chart and its own defaults
        run: node apps/console/scripts/check-addon-charts-render.mjs

  docs-prose:
    name: Docs prose (Vale · Diátaxis + plain-language)
    needs: detect-changes
    # This job ALWAYS runs so it always reports its status check — that is what makes it safe to
    # mark REQUIRED (infra/github). A job whose steps all skip still reports success, so on a
    # non-docs PR / promotion / merge_group it passes green without spinning up Vale. The real work
    # is gated per-step on the `docs` filter; the final step is the explicit no-op pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.docs == 'true'
      - uses: actions/setup-node@v7
        if: needs.detect-changes.outputs.docs == 'true'
        with:
          node-version: 22
      # #5239: 34 broken internal links and anchors sat in the docs with nothing to notice them —
      # eight to a page that never existed, two that doubled the /docs basePath, one per per-cloud
      # tutorial to a heading that had been renamed. Dependency-free node, so it runs before Vale's
      # installs. The self-test plants one of each defect first, so a parser that stopped matching
      # cannot pass green over nothing; the real run also refuses a zero-link count.
      - name: Every internal link and anchor resolves
        if: needs.detect-changes.outputs.docs == 'true'
        working-directory: apps/docs
        run: |
          node scripts/check-links.mjs --self-test
          node scripts/check-links.mjs
      # #5302: the AI template's hourly cost on the starter-templates page is derived from the
      # newest proof bundle's `cost` block, not typed and forgotten. Fails when the page and the
      # bundle disagree in either direction (a missing fact, or a stray figure beside it). The
      # self-test plants each defect class first.
      - name: The AI template's published cost matches its newest proof bundle
        if: needs.detect-changes.outputs.docs == 'true'
        working-directory: apps/docs
        run: |
          node scripts/check-template-cost.mjs --self-test
          node scripts/check-template-cost.mjs
      # Docs rework (2026-11-24): every page stays under its page type's prose-word cap. Pages that
      # were over when the guard landed sit in page-length-ledger.json and may only shrink; the
      # self-test plants each defect class first.
      - name: No docs page is longer than its page type allows
        if: needs.detect-changes.outputs.docs == 'true'
        working-directory: apps/docs
        run: |
          node scripts/check-page-length.mjs --self-test
          node scripts/check-page-length.mjs
      # Vale shells out to `mdx2vast` to parse .mdx (prose only — it drops fenced code,
      # code spans, URLs, JSX/ESM); it must be on $PATH.
      - name: Install the MDX preprocessor
        if: needs.detect-changes.outputs.docs == 'true'
        run: npm i -g mdx2vast
      # Vale is a single Go binary — install the pinned release, mirroring the gitleaks job.
      - name: Install Vale
        if: needs.detect-changes.outputs.docs == 'true'
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.15.1/vale_3.15.1_Linux_64-bit.tar.gz \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
      # Downloads the Google style package into styles/ (gitignored); the Alethia style + vocab
      # are vendored in the repo.
      - name: Sync Vale packages
        if: needs.detect-changes.outputs.docs == 'true'
        working-directory: apps/docs
        run: vale sync
      # `vale` exits non-zero ONLY on error-level alerts (the Alethia.Terminology rule). Warnings
      # (plain-language swaps, long sentences) and suggestions print for visibility but never red
      # the build — matches the green-CI / self-merge flow.
      - name: Lint docs prose
        if: needs.detect-changes.outputs.docs == 'true'
        working-directory: apps/docs
        run: vale content
      # No apps/docs changes — nothing to lint, but the job still reports success so the required
      # check is satisfied on non-docs PRs and promotions.
      - name: No docs changes
        if: needs.detect-changes.outputs.docs != 'true'
        run: echo "No apps/docs changes in this PR — prose lint not required."

  # ── capabilities-security — FOLDED IN FROM capabilities-security.yml (2026-11-22), name unchanged ──
  #
  # The AUTOMATED, fail-closed required check that replaces the dropped #982 CODEOWNERS review (a
  # sole-owner human gate would deadlock the no-approval Mergify queue). It enforces the deterministic
  # `alethia-security-review` invariants on the capabilities / connector / keyless surface: RLS
  # registration of new tenant tables, the cross-provider-leak filter, no unsafe `as any` /
  # `as unknown as` casts, and keyless-only (no static credentials). It does NOT enforce the
  # `Record<string, unknown>`-on-known-shape-JSONB convention — see the script header for why.
  #
  # Its context is the job `name:` — `capabilities-security` — which infra/github/variables.tf and
  # .mergify.yml required by name until 2026-11-22 (#1625 is why it is required at all); it is now
  # one of the `needs:` of `CI required`. The workflow it lives in is not part of a check-run's
  # name, so moving it here changed no required context. It runs on every PR (the old workflow's only trigger) and the
  # script NO-OP-PASSES when no relevant path changed, so it always reports; it fails only when those
  # paths changed AND an invariant is violated. Which files count as "relevant" is the whole gate, and
  # it is guarded by the script's own `--self-test`, run in the `guards` job (#1789).
  #
  # Not on a push, a cron or a dispatch: the script diffs the PR base, which only a PR has.
  capabilities-security:
    name: capabilities-security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the gate can diff base..head to find the PR's changed files.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Capabilities security gate
        env:
          # The PR base commit — the gate diffs GATE_BASE_SHA...HEAD to detect changed paths.
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/security/capabilities-gate.mjs

  # ── Build console images (no push) — FOLDED IN FROM validate-console.yml (2026-11-22), name unchanged ──
  #
  # Actually BUILD the box images on a PR that touches them. deploy-console.yml is the only other
  # workflow that builds apps/console/Dockerfile, and it triggers on a push to MAIN — so before this
  # check existed the image build was exercised for the first time AFTER the promotion had landed.
  #
  # That is not hypothetical. #1711 (2026-07-30) put a MARKETING test under apps/console reaching
  # across with `../../../marketing/proxy`. apps/console/tsconfig.json includes `**/*.ts`, so the test
  # joined the console's type-check program and dragged apps/marketing/proxy.ts in with it — and
  # apps/console/Dockerfile installs `--filter console... --filter @alethia/ee`, which does not include
  # marketing, so `next/server` did not resolve inside the image: TS2307. CI stayed green the whole
  # time because this workflow's other jobs run a FULL `pnpm install`, where marketing's `next` is
  # present. Same code, different install graph. Production shipped nothing for 26 days (#2606).
  #
  # The counterpart to validate-runner.yml, which closed exactly this gap for the runner image.
  # Build-only: nothing is pushed, no registry login, and deliberately NO secrets — the console
  # build's source-map upload is non-fatal on a missing or dead key (apps/console/next.config.ts,
  # #2509), so this both works without one AND regression-tests that guard on every PR.
  #
  # ── WHY THE JOB ALWAYS RUNS AND GATES ITS STEPS INSTEAD ──
  # It was a REQUIRED context by name, and `.mergify.yml`'s `check-success=` does not accept
  # `skipped`, so a job-level skip would have held every PR that does not touch the images. Since
  # 2026-11-22 it is one of the `needs:` of `CI required`, which does accept `skipped` — but a live
  # ruleset may name this context until infra/github is applied, so the shape stays. The job always runs on a PR
  # and self-gates its STEPS on `detect-changes`' `console_images` output, reporting green in seconds
  # when nothing relevant changed — the same shape `docs-prose` uses. `!cancelled()` and the `!=
  # 'false'` step test make a failed detect job BUILD rather than pass vacuously. ONE job, not a
  # matrix: a matrix reports one context per leg and each would have to be required separately.
  #
  # On a PR and a dispatch only, as before — not on a push to main (deploy-console.yml builds there)
  # and not on a cron.
  #
  # FULL LANE ONLY (two lanes, see `detect-changes`): skipped on an ordinary PR's fast lane and run on
  # the queue's batch. `CI required` restates the non-lane half (a PR or a dispatch) to fail a full
  # run that skipped it; change one and you must change the other.
  build-console:
    name: Build console images (no push)
    needs: [detect-changes]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.detect-changes.outputs.lane != 'fast' }}
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to build
        if: needs.detect-changes.outputs.console_images == 'false'
        run: echo "No console-affecting paths changed — nothing to build."

      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.console_images != 'false'

      - uses: docker/setup-buildx-action@v4
        if: needs.detect-changes.outputs.console_images != 'false'

      # The console image is built for BOTH targets. They share the Dockerfile's `build` stage,
      # which is where the failure actually lives, but deploy-console.yml builds them as separate
      # images, so they are proved separately here. Dockerfile.community repeats the same pruned
      # `--filter console...` install and therefore has the same failure mode.
      #
      # `--load` is deliberately absent: nothing needs the image locally, and skipping the export
      # saves both time and disk. A failed build still fails the step.
      - name: Build the box images (no push)
        if: needs.detect-changes.outputs.console_images != 'false'
        env:
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          build() {
            local name="$1" file="$2" target="${3:-}"
            echo "::group::build ${name}"
            if [ -n "$target" ]; then
              docker build -f "$file" --target "$target" --build-arg VERSION="$VERSION" -t "validate-${name}:pr" .
            else
              docker build -f "$file" --build-arg VERSION="$VERSION" -t "validate-${name}:pr" .
            fi
            echo "::endgroup::"
            # Reclaim before the next image: seven Next.js images do not fit on a hosted runner.
            docker image rm "validate-${name}:pr" >/dev/null 2>&1 || true
          }

          build console-runner   apps/console/Dockerfile           runner
          build console-migrate  apps/console/Dockerfile           migrate
          build console-community apps/console/Dockerfile.community
          build marketing        apps/marketing/Dockerfile
          build admin            apps/admin/Dockerfile
          build docs             apps/docs/Dockerfile
          build blog             apps/blog/Dockerfile

  # ── CI required — THE ONE CI CONTEXT THE RULESETS AND THE QUEUE REQUIRE (2026-11-22) ──
  #
  # Every required job of THIS workflow, in one verdict: green when each need concluded `success` or
  # `skipped`, red on `failure` or `cancelled` — and, since the two lanes (2026-11-27), red when a
  # `skipped` is not by design on a full-lane run, or the lane is wrong for the event (its first step). Requiring this one name instead of eleven is what lets
  # a required job be SKIPPED on a PR that cannot affect it (see `detect-changes`, AFFECTED-ONLY): a
  # skipped job here reads as "not needed", where a per-job `check-success=` in `.mergify.yml` reads
  # it as "not green" and a missing matrix leg as "still pending".
  #
  # THE `needs:` LIST BELOW IS THE SOURCE OF TRUTH for which CI jobs gate a merge. `.mergify.yml`
  # (both blocks) and infra/github/variables.tf name only this context (plus `contribution-legal`,
  # below), so adding a required job is an edit HERE — the list and the count the step checks — and
  # nowhere else. scripts/ci/check-required-checks.mjs compares the two named lists; it does not
  # read this one.
  #
  # THE ROLLOUT. Introduced additively (#7267), required from the follow-up that switched
  # `.mergify.yml` and infra/github to it. Mergify acts on that only once it is on `main`, and the
  # LIVE rulesets only once infra/github is applied; both happened on 2026-11-22 (promotion #7288; the infra/github apply
  # after #7286), and the job-level skips were armed after them (`AFFECTED_ONLY_ARMED` in
  # `detect-changes` records the evidence).
  #
  # WHAT IT CANNOT COVER: `contribution-legal`, which comes from cla.yml — a `pull_request_target`
  # workflow — and `needs:` cannot reach across workflows. It stays required on its own.
  #
  # WHY `detect-changes` MUST SUCCEED, not merely "success or skipped": every other need runs with
  # `!cancelled()`, so a failed detect job runs them in FULL rather than skipping them — but a
  # skipped need is accepted here, so a broken planner must be red in its own right or it could, in
  # principle, plan a skip and fail afterwards with nobody told.
  #
  # `if: always()` — the implicit `success()` would SKIP this job whenever a need failed, and a skipped
  # required context is exactly the not-red-not-green state this job exists to remove. On the 03:00
  # UI-audit cron most needs are skipped by their own `if:`, so this costs one idle runner there.
  # ── THE qa RELEASE-GATE LEG, ON THE PR THAT CAN BREAK IT (#7647) ────────────────────────────────
  #
  # Promotions #7554 and #7608 were both blocked by qa-leg regressions (#7559, #7610) from PRs that
  # changed console behaviour — #7399 renamed a facet and disabled "Create role", #7499 added a
  # required env var — and left specs stale. The qa leg ran only at promotion, so the PR that broke
  # the spec never saw it, and the next promotion inherited the red.
  #
  # So this job CALLS release-gate.yml (`workflow_call`) for the `qa` leg alone. Nothing about the
  # leg is restated here: the same `legs` picker, the same `gate` job (postgres, migrations, EE
  # build, `next build`, Playwright, `--workers=3 --retries=1`), the same scripts/e2e-ratchet.mjs
  # against the same apps/console/e2e/gate-baseline.json. ci.yml decides only WHEN it runs.
  #
  # WHEN: `detect-changes.outputs.qa_leg` AND the full lane — a dev PR's full-lane run (the Mergify
  # queue's `mergify/merge-queue/*` batch; an ordinary PR only while the fast lane is switched off)
  # that is not a promotion (which runs all seven legs in release-gate.yml's own run) and not a fork
  # (which gets no secrets), whose diff touches the `qa_leg` paths and is not prose-only. Everything
  # else skips it, which `CI required` counts as success — except a full-lane run where `qa_leg` is
  # true, which `CI required` fails if this job skipped.
  #
  # REQUIRED WHEN IT RUNS: it is a `needs:` of `CI required`. A regression the ratchet reds fails the
  # aggregator; a skip passes it. The fix for a red is the one release-gate.yml's ratchet prints —
  # repair the spec (or the product) in the same PR, or re-record the baseline entry the change
  # legitimately moved. TESTING.md has the procedure.
  #
  # IN THE MERGE QUEUE, NOT ON THE PR (two lanes, 2026-11-27 — inverted from #7647's first form).
  # It used to run on each PR's own head and skip the batch, which cost ~10 runner-minutes per PR
  # push and let two UI PRs that each pass alone, and break each other, merge together. Now an
  # ordinary PR's fast lane skips it and the batch runs it once for up to eight PRs, so the pair
  # meets before dev, not at the promotion. What that gives up, stated: the author sees a qa-leg
  # red when the batch fails (Mergify reports it on the PR and drops it from the queue), not on the
  # first push. Add the `release-gate:run` label for an early answer on a PR that wants one.
  #
  # COST: one shard set (the leg's one matrix entry), ~10 runner-minutes measured on release-gate
  # runs of 2026-11-25, plus a few seconds for `legs`. ci.yml's own `concurrency`
  # (cancel-in-progress per PR ref) cancels the nested run on a re-push, and release-gate.yml gives
  # a called run its own `-ci-call` group so it can never cancel, or be cancelled by, that file's
  # native run on the same PR.
  #
  # `pull-requests: read` because the called `legs` job requests it, and a called job may not ask
  # for more than its caller grants. `secrets: inherit` for the leg's Stripe test key.
  e2e-qa-leg:
    name: E2E qa leg (release gate · affected PRs)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.qa_leg == 'true' && needs.detect-changes.outputs.lane != 'fast'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-gate.yml
    with:
      ci_legs: qa
    secrets: inherit

  ci-required:
    name: CI required
    if: always()
    needs:
      - detect-changes
      - typescript
      - integration
      - go
      - guards
      - secrets
      - docs-prose
      - capabilities-security
      - build-console
      - byo-users-postgres-required
      - e2e-qa-leg
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # TWO LANES (2026-11-27; the lane table is in `detect-changes`' comment). A fast-lane run may
      # skip the full-lane-only jobs; a full-lane run may not — and the queue's batch, the run that
      # decides what lands on dev, must be a full-lane run. Two checks, the first independent of the
      # planner:
      #
      #   (a) THE LANE ITSELF. Recomputed here from the event, not read from the planner: only an
      #       ordinary dev PR (a `pull_request` whose head is not `mergify/merge-queue/*` and whose base
      #       is not main/staging) may be `fast`. A planner bug that called the batch `fast` would
      #       otherwise skip the suite there AND excuse the skip below — so it is red, here.
      #   (b) NO SILENT SKIP ON `full`. Each full-lane-only job's NON-lane condition is restated, and a
      #       `skipped` result where it holds is red. `byo-users-postgres-required` always runs (its
      #       own step judges the legs, lane included), so its `skipped` is never by design.
      #
      # Change a full-lane-only job's `if:` and you must change its line in `full_expected` below.
      - name: The lane is right, and a full-lane run skipped none of the full-lane-only jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          LANE: ${{ needs.detect-changes.outputs.lane }}
          QA_LEG: ${{ needs.detect-changes.outputs.qa_leg }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          bad=0
          ordinary=false
          if [ "$EVENT_NAME" = pull_request ] && [ "${HEAD_REF#mergify/merge-queue/}" = "$HEAD_REF" ] \
            && [ "$BASE_REF" != main ] && [ "$BASE_REF" != staging ]; then
            ordinary=true
          fi
          echo "lane: '${LANE}'; ordinary dev PR: $ordinary; event: $EVENT_NAME; head: ${HEAD_REF:-—}; base: ${BASE_REF:-—}"
          case "$LANE" in
            full) ;;
            fast)
              if [ "$ordinary" != true ]; then
                echo "::error::lane=fast on a run that is not an ordinary dev PR (event $EVENT_NAME, head '${HEAD_REF}', base '${BASE_REF}') — the queue's batch, a promotion, a push, a cron and a dispatch must run the full lane"
                bad=1
              fi ;;
            *) echo "::error::detect-changes reported lane '${LANE}' — expected 'fast' or 'full'"; bad=1 ;;
          esac

          # The non-lane half of each full-lane-only job's `if:`.
          full_expected() {
            case "$1" in
              integration) [ "$EVENT_SCHEDULE" != "0 3 * * *" ] ;;
              build-console) [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = workflow_dispatch ] ;;
              byo-users-postgres-required) true ;;
              e2e-qa-leg) [ "$QA_LEG" = true ] ;;
              *) echo "::error::full_expected has no rule for '$1'"; bad=1; return 1 ;;
            esac
          }
          if [ "$LANE" = full ]; then
            for job in integration build-console byo-users-postgres-required e2e-qa-leg; do
              result=$(jq -r --arg j "$job" '.[$j].result // "absent"' <<<"$NEEDS")
              if [ "$result" = absent ]; then
                echo "::error::$job is not a need of this job — the full-lane list and the needs list disagree"; bad=1
              elif [ "$result" = skipped ] && full_expected "$job"; then
                echo "::error::$job was SKIPPED on a full-lane run although its own condition says it runs — a full run that silently skipped the suite"; bad=1
              else
                echo "ok: $job on the full lane ($result)"
              fi
            done
          fi
          exit "$bad"

      # Runs even when the lane step above is red, so one run reports both verdicts.
      - name: Every required job succeeded or was skipped by design
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad=0
          while IFS=$'\t' read -r job result; do
            case "$job:$result" in
              detect-changes:success) echo "ok: $job" ;;
              detect-changes:*) echo "::error::detect-changes concluded '$result' — the affected-only plan is unknown"; bad=1 ;;
              e2e-qa-leg:success)
                # A called workflow whose jobs all skipped also reports success. `run` is `yes` only
                # when release-gate.yml's `legs` job decided the leg runs (#7647).
                if [ "$(jq -r '.["e2e-qa-leg"].outputs.run // ""' <<<"$NEEDS")" = yes ]; then
                  echo "ok: $job"
                else
                  echo "::error::e2e-qa-leg succeeded but release-gate.yml's legs job never decided to run the leg — a vacuous green"; bad=1
                fi ;;
              *:success) echo "ok: $job" ;;
              *:skipped) echo "ok: $job (skipped)" ;;
              *) echo "::error::$job concluded '$result'. Open that job for the failure; this one only aggregates."; bad=1 ;;
            esac
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<<"$NEEDS")
          # A parse that read nothing must not pass: eleven needs are declared above.
          n=$(jq 'length' <<<"$NEEDS")
          if [ "$n" -ne 11 ]; then
            echo "::error::expected 11 needs, read $n — this job's list and its count disagree"
            bad=1
          fi
          exit "$bad"
