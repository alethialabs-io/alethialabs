# SPDX-License-Identifier: AGPL-3.0-only
#
# Continuous integration — validates every PR + push to main. The CD/release/infra
# workflows are separate. (The enterprise package @alethia/ee is verified at standup,
# not here — community CI checks the open-source build.)

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Merge queue: the heavy real-runner provisioning keystone (job `provision-e2e`)
  # runs ONLY on merge_group events (see its `if:`), so a kind boot + provider/image
  # pulls don't tax every PR. Adding this trigger also lets the required per-PR checks
  # re-validate the queued merge result — standard merge-queue behavior.
  merge_group:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — mutation testing (slow, non-blocking)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which surfaces does this PR touch? The heavy browser E2Es below stay OFF most PRs (Actions
  # minutes), but a PR that changes a surface an E2E covers turns that E2E into a PR gate — because
  # the alternative is what keeps happening: a suite that only runs post-merge lets a break ship
  # green. A whole Lexical composer rewrite shipped that way (→ `agent`); the "Org evidence" heading
  # the hero path waited for was deleted in an Evidence redesign and rotted for weeks (→ `console`,
  # below). Cheap (~15s) and dependency-free.
  detect-changes:
    name: Detect PR surface changes
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      console: ${{ steps.filter.outputs.console }}
      docs: ${{ steps.filter.outputs.docs }}
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "agent=false" >> "$GITHUB_OUTPUT"
            echo "console=false" >> "$GITHUB_OUTPUT"
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "runner=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # THREE-dot (merge-base): the PR's OWN changes only. Two-dot (`git diff base head`)
          # false-positives every filter the moment this branch falls behind base — it then lists
          # every file the base advanced past, so an unrelated PR would run the E2Es. (That is a
          # pre-existing bug this job carried; it over-ran, never under-ran, so it hid.)
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          # `agent` — the narrow Elench/agent surface the Elench AI E2E drives.
          if echo "$changed" | grep -qE '^apps/console/(components/(agent|ui/message-scroller)|lib/(ai|stores/use-(elench|artifact|widget-grid))|app/api/agent|app/server/actions/(agent|artifacts|mentions)|e2e/elench)'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi
          # `console` — the hero happy-path threads through nearly the whole console (auth → org →
          # connectors → canvas → evidence → clusters), so the filter is DELIBERATELY broad: any
          # console or shared-UI change can break it. The Evidence break proves narrow is a trap —
          # a page nobody thought of as "hero-related" broke the sellable flow. Better to run the
          # hero on a console PR that turns out not to touch it than to miss the one that does.
          # ⚠️ `packages/@repo/` matched NOTHING and silently halved this filter. The npm SCOPE is
          # `@repo/*`, but the DIRECTORY is `packages/<name>` — there has never been a
          # `packages/@repo/`. So the "shared-UI" arm was dead from the day it was written, and a
          # change confined to packages/ui or packages/brand skipped the hero gate entirely. That is
          # exactly how the `[ ]` bracket mark reached the base button variant and renamed every
          # control's accessible name from "Add" to "[Add]" without this job objecting. The list
          # below is the console's own @repo dependencies, by path.
          if echo "$changed" | grep -qE '^(apps/console/|packages/(ui|brand|assets|email|plan-catalog|platform|privacy|support)/)'; then
            echo "console=true" >> "$GITHUB_OUTPUT"
          else
            echo "console=false" >> "$GITHUB_OUTPUT"
          fi
          # `docs` — the Vale prose lint. Gate on the whole docs app so a change to the
          # .vale.ini / Alethia style / vocab re-runs the lint too, not just content edits.
          if echo "$changed" | grep -qE '^apps/docs/'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          # `runner` — the inputs to the runner BINARY + its Docker image. The 2026-07-22 fleet-churn
          # incident came from apps/runner/Dockerfile.base shipping an arm64 binary in the amd64 image;
          # gate the amd64-ELF-arch guard on any change that could rebuild that binary/image (the
          # Dockerfiles, the runner/cli Go, and the shared Go the runner compiles in — packages/core +
          # go.work). A plain `go build` can't reproduce a Dockerfile ARG regression, so the guard
          # builds the real image — only run it when one of these actually changed. Also fire on a
          # change to THIS workflow, so an edit to the guard job itself re-validates it (and so its
          # introducing PR exercises it).
          if echo "$changed" | grep -qE '^(apps/runner/|apps/cli/|packages/core/|go\.work|\.github/workflows/ci\.yml$)'; then
            echo "runner=true" >> "$GITHUB_OUTPUT"
          else
            echo "runner=false" >> "$GITHUB_OUTPUT"
          fi

  typescript:
    name: TypeScript (lint · types · test · docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Persist Turbo's local cache across runs. Before this, only the pnpm store was cached, so every run
      # re-ran check-types/lint/test/build for EVERY package cold. Keyed per-sha with an os restore fallback,
      # so a PR restores the previous run's cache and Turbo only re-executes the packages that actually
      # changed (it replays cached logs for the rest). This is the single biggest CI-time win.
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Turbo fans these out across EVERY workspace project that defines the script
      # (console, marketing, docs, blog, @alethia/ee, @repo/{ui,brand,plan-catalog}),
      # so new apps/packages are covered automatically — no hardcoded list to drift.
      - name: Type-check + lint (all workspace projects)
        run: pnpm exec turbo run check-types lint
      - name: Unit tests
        run: pnpm exec turbo run test
      # Coverage is merged into the self-hosted README badge by the `coverage-badge` job
      # (push-to-main); no third-party service. See scripts/coverage-badge.mjs + TESTING.md.
      # Build smoke for the split-affected apps — catches transpilePackages /
      # standalone breakage on PRs. Build-only placeholder env so the console's
      # strict zod config modules pass validation (mirrors apps/console/Dockerfile;
      # nothing is contacted — postgres-js + the S3 client connect lazily).
      - name: App build smoke (console · marketing · docs)
        run: pnpm exec turbo run build --filter=console --filter=marketing --filter=docs
        env:
          BETTER_AUTH_SECRET: build-time-placeholder
          BETTER_AUTH_URL: http://localhost:3000
          ALETHIA_DATABASE_URL: postgres://build:build@localhost:5432/build
          ALETHIA_APP_DATABASE_URL: postgres://build:build@localhost:5432/build
          ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
          ALETHIA_STORAGE_ACCESS_KEY_ID: build
          ALETHIA_STORAGE_SECRET_ACCESS_KEY: build

  integration:
    name: Integration (real Postgres + RLS)
    runs-on: ubuntu-latest
    # A throwaway Postgres mirroring the dev stack (compose uses postgres:17-alpine with the
    # same superuser/db). db:migrate then creates the least-priv `alethia_app` role + RLS, so
    # the suite exercises the real SQL query builders and the multi-tenant isolation boundary.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Point at the CI service (the suite's setup.ts defaults to :5433 — these win).
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      # A DISTINCT app-role URL so the RLS isolation assertion actually runs (not skipped).
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      # OpenFGA (started as a step below — service containers can't override the image command, and
      # OpenFGA needs `run`). Makes the community↔enterprise PDP-parity suite actually execute
      # per-commit; REQUIRE=1 turns an OpenFGA-absent skip into a hard failure so parity can't
      # silently go dark (SOC2 CC6.1).
      OPENFGA_TEST_API_URL: http://localhost:8082
      ALETHIA_PDP_PARITY_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # In-memory OpenFGA for the PDP-parity test (it provisions its own store/model/tuples and
      # deletes them after — no datastore migration needed). Started via docker run so we can pass
      # the `run` command; HTTP 8080 → host 8082 (what OPENFGA_TEST_API_URL points at).
      - name: Start OpenFGA (in-memory) for PDP parity
        run: |
          docker run -d --name openfga -p 8082:8080 \
            -e OPENFGA_DATASTORE_ENGINE=memory openfga/openfga:v1.8.4 run
          for i in $(seq 1 40); do
            curl -sf http://localhost:8082/healthz && { echo "openfga up"; break; }
            [ "$i" = "40" ] && { echo "::error::OpenFGA did not become healthy"; docker logs openfga; exit 1; }
            sleep 1
          done
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -F console db:migrate
      - name: Integration tests (real SQL query builders + RLS isolation + PDP parity)
        run: pnpm -F console test:integration

  e2e-browser:
    name: E2E (browser · Playwright hero path)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    # Heavy (console build + Playwright), so it stays OFF most PRs to cut Actions minutes — but it
    # now RUNS on any PR that touches the console surface (detect-changes.console), because that is
    # the only pre-merge signal the hero path has. There is NO nightly hero run (e2e-nightly is
    # maintainer-gated real-cloud provisioning; e2e-ai-nightly drives the Elench journeys), and the
    # merge queue is off — so before this, a console change could break the sellable flow and only a
    # post-merge push would notice. That is exactly how the "Org evidence" assertion rotted for weeks.
    # Still runs on the merge queue, pushes, and manual dispatch as before.
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || needs.detect-changes.outputs.console == 'true'
    # Own parallel job, OFF the fast path: builds + boots the real console against a real Postgres
    # and drives the sellable happy-path in a headless browser (sign-in → org → connect-a-cloud
    # surface → design → Deploy/pending-changes → evidence/clusters). Fully hermetic: email-OTP with
    # the code scraped from the console log — no SES, no OAuth, no cloud creds. OpenFGA is left UNSET
    # so the community PostgresRbacPDP is the authz engine (no extra service). Same postgres:17 +
    # db:migrate as the Integration job above.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Real Postgres service (superuser + least-priv app role created by db:migrate, for RLS).
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      # Auth: a non-secret placeholder + same-origin base URL. Email-OTP only (no OAuth, no SES) →
      # the OTP is logged, which is the hermetic seam the spec reads.
      BETTER_AUTH_SECRET: e2e-browser-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Storage placeholders (the S3 client connects lazily; the hero path uploads nothing).
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      # The Playwright webServer boots `next start` and tees stdout here; the OTP helper reads it.
      DEV_CONSOLE_LOG: /tmp/alethia-e2e-console.log
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -F console db:migrate
      # Build @alethia/ee FIRST. Its dist is gitignored and it has no prepare/postinstall
      # hook, and `pnpm -F console build` calls the console's own script — bypassing turbo,
      # so `build.dependsOn: ["^build"]` never fires. Without this, ee/dist/index.js does
      # not exist, getEnterprise()'s tolerant require throws, and lib/auth/scope.ts falls
      # back to `{ userId, orgId: userId }`.
      #
      # That fallback made this whole job VACUOUS: getOrgEvidence short-circuits to
      # EMPTY_EVIDENCE whenever actor.orgId === actor.userId, so the evidence page rendered
      # "No environments yet" regardless of data and the hero assertion could not fail. The
      # EE scope — the one production and the sandbox box actually run — was never tested.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the suite silently runs community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community"
            echo "::error::scope (actor.orgId === userId), which makes org-scoped assertions vacuous."
            exit 1
          }
      - name: Build the console (production image the browser drives)
        run: pnpm -F console build
      - name: Install Playwright (Chromium + OS deps)
        run: pnpm -F console exec playwright install --with-deps chromium
      # Guard against a vacuous green: if the hero spec is ever renamed without updating the
      # project's testMatch, `playwright test --project=hero` would match 0 tests and could exit 0.
      # Fail loudly instead.
      - name: Guard — hero project must match at least one test
        run: |
          list=$(pnpm -F console exec playwright test --project=hero --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          echo "$list" | grep -qE "Total: [1-9][0-9]* test" || { echo "::error::--project=hero matched 0 tests (testMatch drift?)"; exit 1; }
      - name: Run the hero happy-path (Playwright boots `next start` via webServer)
        run: pnpm -F console exec playwright test --project=hero
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/console/playwright-report/
          retention-days: 7

  e2e-elench-ai:
    name: E2E (browser · Elench AI journeys · scripted model)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    # Heavy (console build + Playwright), so it stays OFF most PRs to cut Actions minutes — but it
    # now RUNS on any PR that touches the agent surface. It is the only test that drives the real
    # composer/rail/grid in a browser, and skipping it on PRs is how a broken Lexical composer
    # shipped green. Still runs on the merge queue, pushes, and manual dispatch as before.
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || needs.detect-changes.outputs.agent == 'true'
    # The Elench AI journeys end-to-end with a SCRIPTED model (ALETHIA_AI_MOCK=1 → the
    # MockLanguageModelV3 in lib/config/ai-mock). Only the model is deterministic: the agent
    # route, extended thinking, orchestration markers, TOOL EXECUTION (PDP-gated reads against
    # this real Postgres), metering, transcript persistence, widget auto-pin into thread_widgets,
    # artifacts and RLS all run for real. No API key, no flake, no cost. The real-model run is
    # the separate (non-gating) e2e-ai-nightly workflow.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      BETTER_AUTH_SECRET: not-a-secret-e2e-placeholder
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      DEV_CONSOLE_LOG: /tmp/alethia-e2e-console.log
      # The scripted model. NEVER set anywhere but an E2E console (unit-tested: the gate is
      # off by default and only the literal "1" engages it).
      ALETHIA_AI_MOCK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -F console db:migrate
      # Build @alethia/ee FIRST. Its dist is gitignored and it has no prepare/postinstall
      # hook, and `pnpm -F console build` calls the console's own script — bypassing turbo,
      # so `build.dependsOn: ["^build"]` never fires. Without this, ee/dist/index.js does
      # not exist, getEnterprise()'s tolerant require throws, and lib/auth/scope.ts falls
      # back to `{ userId, orgId: userId }`.
      #
      # That fallback made this whole job VACUOUS: getOrgEvidence short-circuits to
      # EMPTY_EVIDENCE whenever actor.orgId === actor.userId, so the evidence page rendered
      # "No environments yet" regardless of data and the hero assertion could not fail. The
      # EE scope — the one production and the sandbox box actually run — was never tested.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the suite silently runs community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community"
            echo "::error::scope (actor.orgId === userId), which makes org-scoped assertions vacuous."
            exit 1
          }
      - name: Build the console (production image the browser drives)
        run: pnpm -F console build
      - name: Install Playwright (Chromium + OS deps)
        run: pnpm -F console exec playwright install --with-deps chromium
      # Guard against a vacuous green (renamed spec → testMatch drift → 0 tests → exit 0).
      - name: Guard — elench-ai project must match at least one test
        run: |
          list=$(pnpm -F console exec playwright test --project=elench-ai --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          echo "$list" | grep -qE "Total: [1-9][0-9]* test" || { echo "::error::--project=elench-ai matched 0 tests (testMatch drift?)"; exit 1; }
      - name: Run the Elench AI journeys (scripted model, real pipeline)
        run: pnpm -F console exec playwright test --project=elench-ai
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-elench-ai
          path: apps/console/playwright-report/
          retention-days: 7

  coverage-badge:
    name: Coverage badge (self-hosted)
    runs-on: ubuntu-latest
    # Only on push to main: regenerate coverage and commit the shields.io badge JSON the README
    # renders. No third-party service. `[skip ci]` on the commit avoids a run loop.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit suites (produces per-project coverage summaries)
        run: pnpm exec turbo run test
      - name: Compute merged coverage → badge JSON
        run: node scripts/coverage-badge.mjs
      - name: Commit the badge if it changed
        run: |
          if git diff --quiet -- .github/badges/coverage.json; then
            echo "Coverage badge unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges/coverage.json
            # --no-verify: the repo's pre-commit hook (core.hooksPath) blocks direct
            # commits to main; this CI-authored badge commit is legitimate.
            git commit --no-verify -m "chore(ci): update coverage badge [skip ci]"
            # Publish to the unprotected orphan `badges` branch, NOT to main. `protect-main` is
            # enforcement:active with bypass_actors:[] and a pull_request rule, so a direct push
            # to refs/heads/main is refused with GH006 — contents:write on the token is
            # irrelevant, the ruleset denies the ref update. See publish_badge in the Go badge
            # job below for the full diagnosis; this badge was dead for the same reason.
            #
            # NO `|| true`. A push that cannot land must RED this job.
            git push --force origin HEAD:badges
          fi

  guards:
    name: Authz / open-core guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open-core boundary (core must not import ee/)
        run: pnpm -F console check:ee-boundary
      - name: Repository-wide open-core boundary and community image contract
        run: pnpm check:open-core
      - name: Runner self-image is baked, matches its job, and is multi-arch
        run: pnpm check:runner-self-image
      - name: Community edition type-checks without enterprise activation
        env:
          ALETHIA_EDITION: community
        run: pnpm -F console check-types
      - name: Installed dependency licence inventory has no unknown metadata
        run: pnpm compliance:licenses
      - name: Generate workspace SBOM and community-source evidence
        run: |
          pnpm compliance:release
          pnpm source:community
      - name: Upload compliance evidence
        uses: actions/upload-artifact@v7
        with:
          name: compliance-${{ github.sha }}
          path: |
            dist/compliance
            dist/community-source
          if-no-files-found: error
          retention-days: 30
      - name: No Supabase
        run: pnpm -F console check:no-supabase
      - name: Authz scope (PDP, not ad-hoc user_id)
        run: pnpm -F console check:authz-scope
      - name: Marketing routes ⇄ reservation ⇄ Caddy in sync
        run: pnpm -F console check:marketing-routes
      - name: Drizzle migration history is unforked (linear snapshot chain)
        run: pnpm -F console check:migrations
      - name: Every canvas offer is buildable on every cloud, or documented (offer parity)
        run: pnpm -F console check:offer-parity
      - name: Offer-parity matrix is in sync with the code
        run: |
          pnpm -F console gen:offer-parity
          git diff --exit-code -- docs/testing/offer-parity.md \
            || { echo "::error::docs/testing/offer-parity.md is stale — run 'pnpm -F console gen:offer-parity' and commit."; exit 1; }
      # The sibling of offer parity, on a different unit: offer parity asks whether a CHOICE the
      # canvas presents is buildable, this asks whether the VALUE a user typed reaches the plan. A
      # choice can be perfectly buildable while the number beside it is discarded — #1981 shipped a
      # cache allow-list that saved cleanly, provisioned nothing, and left the cache open.
      - name: Every value the product collects reaches the plan, or is documented (config carriage)
        run: pnpm -F console check:config-carriage
      - name: Config-carriage board is in sync with the code
        run: |
          pnpm -F console gen:config-carriage
          git diff --exit-code -- docs/testing/config-carriage.md \
            || { echo "::error::docs/testing/config-carriage.md is stale — run 'pnpm -F console gen:config-carriage' and commit."; exit 1; }
      # The third parity unit, and the one that closes a hole the first two structurally could not
      # see: BOTH of the guards above derive their surface from the canvas — offer parity from the
      # offer list, config carriage from user-settable columns. A capability that exists only as a
      # TEMPLATE VARIABLE is invisible to them, so no guard could red it and no deferral about it
      # could go stale. AWS envelope-encrypted Kubernetes Secrets for the entire life of the
      # templates while three clouds did not, unboarded and unexcluded (#2004).
      - name: Every asymmetric template variable is recorded (template parity)
        run: pnpm -F console check:template-parity
      - name: Template-parity board is in sync with the templates
        run: |
          pnpm -F console gen:template-parity
          git diff --exit-code -- docs/testing/template-parity.md \
            || { echo "::error::docs/testing/template-parity.md is stale — run 'pnpm -F console gen:template-parity' and commit."; exit 1; }
      - name: Keyless cells agree with the code that implements them
        run: pnpm -F console check:keyless-cells
      # The canvas gates the IAM-auth toggle on this table (#1510). Hand-mirroring it would only
      # DETECT drift; generating it makes drift impossible — and the table churns (aws/gcp MySQL
      # opened four lanes after it was first written).
      - name: Keyless cell mirror is in sync with the renderer (keyless.go → keyless-cells.ts)
        run: |
          pnpm -F console gen:keyless-cells
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/keyless-cells.ts \
            || { echo "::error::Generated keyless-cells.ts is stale — run 'pnpm -F console gen:keyless-cells' and commit (source of truth: packages/core/manifests/keyless.go)."; exit 1; }
      # The inspector's per-cloud node-disk floors (#1972). Same shape: the floors live in the
      # templates' own `>= N` validations (the literals the Go constants are pinned to by
      # TestNodeDiskFloorsMatchTemplates); the canvas reads a generated mirror of them, so a floor
      # bump in a template that isn't regenerated here fails the build instead of drifting.
      - name: Node-disk floors are in sync with the templates (variables.tf → node-disk.ts)
        run: |
          pnpm -F console gen:node-disk
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/node-disk.ts \
            || { echo "::error::Generated node-disk.ts is stale — run 'pnpm -F console gen:node-disk' and commit (source of truth: each template's disk-size variable)."; exit 1; }
      # The offer surface — which canvas switches a user can actually see, per cloud. Derived by
      # EVALUATING the inspector schema's visibleWhen predicates, because they are closures over
      # (config, provider, capabilities) that no pattern-match can read. Checked in so the answer is
      # reviewable, and diffed so it cannot move silently: adding a gate to a field is a real change
      # to what the product offers, and until now it moved nothing a reviewer could see.
      - name: Offer surface is in sync with the inspector schema (config-schema.ts → offer-surface.json)
        run: |
          pnpm -F console gen:offer-surface
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/offer-surface.json \
            || { echo "::error::Generated offer-surface.json is stale — run 'pnpm -F console gen:offer-surface' and commit (source of truth: apps/console/components/design-project/canvas/inspector/config-schema.ts)."; exit 1; }
      # Same shape, same reason (#1621). Which secret stores a cluster can actually read is decided by
      # which store hook each provider registers in Go; the canvas greys out the rest. That answer was
      # a hand-written TS list of two slugs, free to drift from the hooks — and in the direction that
      # matters, a stale list lets the user pick a store the cluster will never resolve, surfacing at
      # deploy time as unresolved secrets rather than at config time. The paired Go test
      # (categories/secrets_runtime_read_mirror_test.go) proves the generator READ the source right.
      - name: Secrets runtime-read mirror is in sync with the hooks (secrets_*.go → secrets-runtime-read.ts)
        run: |
          pnpm -F console gen:secrets-runtime-read
          git diff --exit-code -- apps/console/lib/connectors/generated/secrets-runtime-read.ts \
            || { echo "::error::Generated secrets-runtime-read.ts is stale — run 'pnpm -F console gen:secrets-runtime-read' and commit (source of truth: the saasSecretStore / keylessSecretStore hooks in packages/core/categories/secrets_*.go)."; exit 1; }
      - name: Project templates pin their providers (tofu lock files, no -upgrade)
        run: pnpm -F console check:tofu-lockfiles
      - name: Shipped version defaults are mutually compatible (compat matrix)
        run: pnpm -F console check:compat
      - name: CLI contract fixtures are in sync with the Zod contract
        run: |
          pnpm -F console gen:cli-fixtures
          git diff --exit-code -- packages/core/api/testdata \
            || { echo "::error::CLI fixtures are stale — run 'pnpm -F console gen:cli-fixtures' and commit (the Go contract test will then name any struct field to update)."; exit 1; }
      - name: Go enum constants are in sync with the drizzle enums
        run: |
          pnpm -F console gen:go-enums
          git diff --exit-code -- packages/core/types/enums_gen.go \
            || { echo "::error::Go enum constants are stale — run 'pnpm -F console gen:go-enums' and commit. The Go build + exhaustive lint then flag any switch/map to update."; exit 1; }
      - name: Compat matrix mirror is in sync with the SSOT (matrix.json → matrix.ts)
        run: |
          pnpm -F console gen:matrix
          git diff --exit-code -- apps/console/lib/compat/generated/matrix.ts \
            || { echo "::error::Compat matrix.ts is stale — run 'pnpm -F console gen:matrix' and commit (source of truth: packages/core/compat/matrix.json)."; exit 1; }
      # gen-catalog.mjs has claimed "CI re-runs it and fails on drift" since it was written; until
      # #1373 nothing did. It also re-runs the generator's fail-fast shape guards (every engine has a
      # non-empty versions[] containing its default, and the snake + camel surfaces agree), so a
      # malformed catalog.json reds here rather than at someone's next apply.
      - name: Cloud catalog mirror is in sync with the SSOT (catalog.json → catalog.ts)
        run: |
          pnpm -F console gen:catalog
          git diff --exit-code -- apps/console/lib/cloud-providers/generated/catalog.ts \
            || { echo "::error::Generated catalog.ts is stale — run 'pnpm -F console gen:catalog' and commit (source of truth: packages/core/catalog/catalog.json)."; exit 1; }
      - name: Catalog drift scout's pure parsers/differ hold (derive:catalog --self-test)
        run: pnpm -F console derive:catalog -- --self-test
      - name: Tests exercise real source (anti-vacuous-test tripwire)
        run: node scripts/check-test-imports.mjs
      - name: Go tests exercise real source (anti-vacuous-test tripwire, verify + runner)
        run: node scripts/check-go-test-imports.mjs
      - name: Connector setup artifacts in sync (infra/connector ⇄ console public)
        run: node scripts/check-connector-assets.mjs
      - name: SPDX headers are legal-form-agnostic (Alethia Labs, no OÜ/DPK)
        run: node scripts/check-license-headers.mjs
      # The IP-activation path is dormant code until the founder assignment is signed, and dormant
      # code rots silently. It rewrites eleven exact prose markers across eight legal files; edit any
      # of that wording and the activation would refuse at the worst possible moment. This runs the
      # real rewrite against synthetic evidence, so the markers are proven on every PR.
      - name: IP-activation markers still match the legal prose (#2366)
        run: node scripts/legal/activate-company-ip.mjs --check-markers
      - name: Docs describe a repo that exists (paths · scripts · blocked commands)
        run: node scripts/check-docs-contract.mjs
      # A clickwrap record names a Terms VERSION. If the text behind that version can move, the
      # record proves nothing about what the user actually agreed to — so every public legal
      # document is pinned by the SHA-256 of its source, and editing one without re-sealing is a
      # hard failure rather than a silent re-description of the past (#2372).
      - name: Legal documents match their sealed content hash
        run: node scripts/check-legal-document-hashes.mjs
      # The contributor agreements are sealed BEFORE they are active, and that is the point: the
      # window between counsel approving the text and activation switching enforcement on is exactly
      # when an unnoticed edit would be most damaging. Also guards cla/ACTIVE against disagreeing
      # with the seal once it exists (#2374).
      - name: Contributor agreements match their sealed hash
        run: node scripts/legal/check-cla-hashes.mjs
      # Four hermetic suites that ran NOWHERE until now — no network, no gh, no docker.
      # wt-lease-hook-test.sh replays incident #1247 (one instance committing another's
      # uncommitted work) against a real throwaway leased worktree; it is the only proof
      # the lease actually holds, and it was never executed by CI.
      - name: Worktree lease protocol (13 properties, incl. pid-reuse + nested worktrees)
        run: bash scripts/lib/wt-lease.sh --self-test
      - name: Worktree lease guard — replays incident #1247
        run: bash scripts/lib/wt-lease-hook-test.sh
      - name: Worktree landed-detection (squash merges; merged-PR-plus-new-commit is NOT landed)
        run: bash scripts/lib/wt-landed-test.sh
      - name: Board claim arbitration (earliest-lease-wins) + PR predicates
        run: bash scripts/claim-work.sh --self-test
      # The Go coverage ratchet becomes a step inside `Go (build · vet · test · lint)`, a REQUIRED
      # check with no path filter — so it gates every PR in the repository and a false failure
      # stops the merge queue for everyone, not just its author. Three properties are pinned here
      # because each is a way it could wedge the repo:
      #   · the arithmetic is integer cross-multiplication, never a percentage. packages/core/git
      #     is 185/291 = 63.5739% and DISPLAYS as 63.6%; comparing displayed values fails with
      #     zero code change, forever.
      #   · the fail-open set (unparseable floors from a hand-resolved conflict, partial profile,
      #     unknown covermode, new/deleted package) — the gate may only fail on a real regression.
      #   · the floors JSON layout, asserted with a real `git merge-file`: two PRs each raising a
      #     DIFFERENT, ADJACENT package must merge clean, or every concurrent Go PR conflicts.
      # Hermetic: no go, no network, no repo state.
      - name: Go coverage ratchet (arithmetic · fail-open set · merge-safe layout)
        run: bash scripts/go-coverage.sh --self-test
      - name: Board decomposition validator (disjoint scopes, acyclic DAG)
        run: node scripts/decompose-validate.mjs --self-test
      # The CLA gate runs from `pull_request_target` — a privileged token, and comment text written
      # by whoever opened the pull request. It is also DORMANT until `pnpm legal:activate-ip` writes
      # cla/ACTIVE, so nothing exercises it until the day it starts gating every external
      # contribution at once. These fixtures are what stand in for that: both directions of the
      # trusted-actor list (the archived action's `bot*` glob trusted any registrable "bot…" login,
      # and the shell `case` it replaced never matched the real `[bot]` logins at all), an edited
      # signing comment, a third party signing on the author's behalf, and a signature scoped to a
      # superseded CLA version. Hermetic — no network, no gh, no repo state.
      - name: CLA gate decisions (spoofed bots · edited comments · version scoping)
        run: node scripts/legal/cla-check-selftest.mjs
      # The capabilities-security REQUIRED check decides which changed files it inspects AT ALL, and a
      # file outside that set is not "passed" — it is never read and the check goes green (#1789). This
      # asserts every known-guarded path still exists AND still matches (a rename that quietly drops a
      # file out of scope reds here, not months later on a green PR), that out-of-scope paths still do
      # not match, and that invariants A–D still fire. It reads the checkout, but runs no git and no
      # network — the invariants are driven from inline fixtures.
      - name: Capabilities-security gate scope + invariants (the guard's own guard)
        run: node scripts/security/capabilities-gate.mjs --self-test
      # The nightly rollup is the only thing that reads a real-cloud run's verdict, and it reported a
      # leg that provisioned and FAILED as "gate off — no secret/var wired" (#1613). It is main-gated
      # and runs once a night, so a regression there is invisible for a day and then misattributed to
      # whatever diff is nearby. These fixtures are hermetic — no network, no gh, no token.
      - name: Nightly rollup derivation (a red leg is never "not enabled")
        run: bash scripts/e2e/nightly-rollup.sh --self-test
      # Which dimension a nightly proved decides the tracking issue's TITLE, and the title is the
      # dedup key: keyed on the cloud alone, the floor and the weekly full bar collapse onto one
      # issue and the second red filed is silently dropped — which is how the full bar ran unwatched
      # for weeks (#1755). Both crons are asserted here because neither is reachable from a PR.
      - name: Nightly dimension resolution (floor and full-bar never collide)
        run: bash scripts/e2e/resolve-dimension.sh --self-test
      # The AWS sweeper discovers this run's cluster to reach the resources tofu never owned — the
      # NLB ingress-nginx creates, Karpenter's instances. Discovery fell back to EC2 tags alone, so a
      # teardown that deleted the cluster AND the instances (a hard-killed run's exact end state) left
      # CLUSTER empty, and every cluster-scoped sweep silently became a no-op. Worse, `alive_lbs` in
      # verify_swept is CLUSTER-scoped too, so the sweep exited GREEN with a load balancer billing —
      # run 31929564177 left one standing for eight days. Both directions are asserted: another run's
      # LB must NOT resolve, or the fix would be a wildcard. Hermetic — `aws` is stubbed, no creds.
      - name: AWS sweeper cluster discovery (a dead cluster still reaches its load balancer)
        run: bash scripts/e2e/aws-cleanup.sh --self-test
      # The hcloud sweeper's twin blind spot. The imager provider boots a rescue server and an ssh
      # key named `hcloud-upload-image-*` to build the Talos snapshot, neither carrying a label, and
      # a build that fails mid-resource never lands in state — so the destroy pass cannot see them
      # either. A stopped Hetzner server still bills. They cannot be swept safely (the account is
      # shared, and a CONCURRENT run's upload server matches the same prefix), so they are REPORTED.
      # What is asserted here is the decision, not the printing: whether UNVERIFIABLE gets set, since
      # that is what turns "verified complete" into a warning. Both directions — an empty account
      # must NOT raise it, or the warning stops meaning anything. Hermetic: `hcloud` is stubbed.
      - name: hcloud sweeper reports what it cannot attribute (imager upload helpers)
        run: bash scripts/e2e/hcloud-cleanup.sh --self-test
      # A TIMER must never start an unpriced real apply. The weekly `17 5 * * 0` full-bar cron fanned
      # the 11-kind surface across all five clouds while ALETHIA_COST_CEILING_MONTHLY_USD was wired
      # for aws alone, and bought a standing monthly alibaba CR EE subscription each week (#2340
      # landed the detection only on 2026-08-11). The cron is gone — but removing a cron is a
      # one-line edit and so is adding one, so this is the tripwire on the reintroduction: a cron
      # that resolves to `full` fails unless every matrix cloud is priced. Exemptions (a watched
      # dispatch) deliberately do not satisfy it. Hermetic — parses two files, no gh, no cloud.
      - name: E2E spend guard (no scheduled full bar on an unpriced cloud)
        run: |
          node scripts/check-e2e-spend-guard.mjs --self-test
          node scripts/check-e2e-spend-guard.mjs
      # The proof-bundle scrub decides what a PUBLIC repo publishes, and its only run was inside
      # e2e-nightly.yml — a workflow no PR triggers. So the change that made the tripwire fire on
      # every azure plan JSON could not have been caught before merge, and wasn't: azure lost its
      # runner log on every run and published an unscrubbed 148 KB plan (#1923). The suite pins
      # both directions — non-vacuous AND not over-broad — and is hermetic: no cloud, no secret,
      # obviously-fake literals only.
      - name: Proof-scrub denylist (non-vacuous, and no false positive on a tofu plan JSON)
        run: bash demos/proofs/scrub.sh --self-test
      # PROGRAMME.md is the one file a session reads to know where the MVP programme stands, so its
      # status half is DERIVED and diff-gated — the numbers cannot be typed. This is the guard's own
      # guard (fixtures for RETRACTED supersession, an expiring CI run tag masquerading as a proof,
      # the marker splice refusing a duplicated region, and a vacuity case) plus the staleness diff.
      # The hand-maintained boards it replaces were contradicting each other IN THE TREE while
      # passing CI: runner-xcloud-parity.md called hetzner green for cluster provision,
      # provisioning-e2e-parity.md called it blocked, and the proof ledger said neither had evidence.
      - name: Programme ledger derivation (a PASS with no bundle is never a proof)
        run: node scripts/programme-rollup.mjs --self-test
      - name: Programme ledger is in sync with the tree
        run: node scripts/programme-rollup.mjs
      # The spine mirror: Node cannot parse Go, so the Go tables that already OWN and validate the
      # ceiling/debt verdicts (MaxConfigCarriage, CLIReach) are exported to JSON and diff-gated,
      # rather than a third hand-authored list being kept in step by hand. Same shape as
      # gen:offer-surface / gen:keyless-cells. Untagged test — no cloud, no cost.
      - name: Programme spine mirror is in sync with the Go tables
        run: |
          (cd test/e2e && GOWORK=off go test -run 'TestProgrammeExport' ./...)
          git diff --exit-code -- test/e2e/generated/programme.json \
            || { echo "::error::test/e2e/generated/programme.json is stale — regenerate with (cd test/e2e && GOWORK=off go test -run TestProgrammeExport ./...) and commit. Source of truth: MaxConfigKinds + CLIDemoSteps."; exit 1; }
      # Each guard proves it still BLOCKS what it must and, more importantly, still
      # ALLOWS what it must — the false positives are what get a guard disabled.
      - name: Guards self-test (runtime · compose · merge)
        run: |
          bash .claude/hooks/guard-runtime.sh --self-test
          bash .claude/hooks/guard-compose.sh --self-test
          bash .claude/hooks/guard-merge.sh --self-test
          bash .claude/hooks/guard-iac.sh --self-test
      - name: Hook scripts parse
        run: |
          for f in .claude/hooks/*.sh scripts/env.sh scripts/dev-doctor.sh scripts/box/*.sh; do
            bash -n "$f"
          done
      - name: Cloud privilege (OIDC / creds) never reachable from a PR (BYOC invariant 1)
        run: node scripts/check-workflow-oidc-isolation.mjs

  go:
    name: Go (build · vet · test · lint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apps/cli, apps/runner, packages/core]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # packages/core's untagged provisioning-wiring E2E (deploy_wiring_test.go) runs a real
      # `tofu` against a provider-less module — it self-skips without tofu on PATH, which
      # would make the keystone's per-PR signal hollow. Install it so the test actually runs.
      #
      # apps/runner needs it for the SAME reason, and did not have it. Its chart-scan and
      # IaC-scan suites (chart_scan_test.go, exec_stage_test.go, iac_scan_test.go) self-skip
      # without `helm` and `tofu` on PATH. The 2026-08-04 determinism probe confirmed what
      # ubuntu-latest actually ships: helm IS preinstalled (/usr/local/bin/helm) but **tofu is
      # MISSING**, so those runner tests have been silently skipping in CI — passing by not
      # running. Worth fixing on its own; it also makes the leg's coverage reproducible, which
      # a floor depends on (the same suites measure 49.58% locally with tofu present and
      # 47.24% without).
      #
      # helm is pinned rather than inherited: "happens to be on the GitHub-managed image" is an
      # unpinned property, and the day it is pruned those tests would go quiet again.
      - uses: azure/setup-helm@v5
        if: matrix.module == 'apps/runner'
        with:
          version: v3.16.3
      - uses: opentofu/setup-opentofu@v2
        if: matrix.module == 'packages/core' || matrix.module == 'apps/runner'
        with:
          tofu_version: "1.9.0"
      - name: Build · vet · test (with coverage)
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...
          go test -coverprofile=cover.out ./...
      # Per-package statement-coverage RATCHET: coverage may rise, never fall. Reads the cover.out
      # written directly above — it does NOT re-run the suite.
      #
      # No `working-directory`: the script cd's to the repo root itself, so it is invoked
      # identically for every module and the fix command it prints needs no cd puzzle.
      #
      # No `if: always()`: when the step above fails there is no usable profile, and reporting a
      # coverage collapse on top of a test failure would misattribute the cause.
      #
      # This blocks a PR that lowers coverage in ANY package, including one the author does not
      # own. That is deliberate. Every false-failure path is fail-OPEN and enumerated in the
      # script header — the floors carry a fingerprint of the environment that recorded them, and
      # a mismatch (including a different OS) demotes failures to warnings rather than blaming
      # coverage for a toolchain change.
      - name: Coverage ratchet (per package, no regressions)
        run: bash scripts/go-coverage.sh --module ${{ matrix.module }}
      # Each Go module must be tidy STANDALONE (no go.work) — the CLI mirror + GoReleaser build
      # apps/cli outside the workspace, where go.work can't paper over a missing require. This guard
      # fails the PR instead of the (post-merge) mirror when go.mod/go.sum drift standalone.
      - name: go.mod tidy guard (standalone — GOWORK=off)
        working-directory: ${{ matrix.module }}
        run: |
          GOWORK=off go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::${{ matrix.module }}/go.mod or go.sum is not tidy standalone — run 'cd ${{ matrix.module }} && GOWORK=off go mod tidy' and commit." >&2
            exit 1
          fi
      # Compile-check the docker-gated e2e_local keystone (it's excluded from the default
      # build tags, so a break in deploy_e2e_test.go would otherwise escape all of CI).
      - name: Vet e2e_local keystone (compile check)
        if: matrix.module == 'packages/core'
        working-directory: ${{ matrix.module }}
        run: go vet -tags=e2e_local ./provisioner/
      # Compile-check the T1/T2 harness (test/e2e — a SEPARATE module outside go.work, run
      # only by the merge-queue provision-e2e job / the nightly). Without this, a break in
      # controlplane.go / t1_provision_test.go would escape every per-PR check and only
      # surface in the merge queue, blocking it for everyone rather than failing the
      # offending PR (parity with the e2e_local keystone above). The untagged `go test` runs
      # the harness's PURE unit tests (argocd_assert_test.go — the ArgoCD health assertion's
      # parse/evaluate/derive negative paths; no docker/kind/postgres needed).
      - name: Vet + unit-test e2e harness (compile check + pure logic)
        if: matrix.module == 'packages/core'
        run: |
          cd test/e2e
          GOWORK=off go vet -tags=e2e_t1 ./...
          GOWORK=off go vet -tags=e2e_t2 ./...
          GOWORK=off go vet -tags=e2e_b6 ./...
          GOWORK=off go test -coverprofile=cover.out ./...
      # test/e2e is the FOURTH Go module and has no matrix leg of its own — it is exercised from
      # inside the packages/core leg above, which is why its 2,193 statements have never been
      # coverage-measured. Its ratchet is therefore an explicit step here rather than a matrix
      # entry.
      #
      # Its floors WERE recorded by the determinism probe, whose test/e2e leg installs no tofu,
      # while this leg does — a deliberately CONSERVATIVE floor that the comment here predicted
      # would "tighten on the first `--update`". It has (#2156): the floors now carry this leg's
      # own measurement and `"tofu": true` with it. The fingerprint has to move WITH the number,
      # or the fallback the conservative floor bought is silently gone — a broken tofu install
      # would drop coverage below a floor recorded as tofu-less, and F7 would find nothing
      # "missing" to demote the failure with. Recorded tofu:true, it demotes to a warning.
      - name: Coverage ratchet — test/e2e harness
        if: matrix.module == 'packages/core'
        run: bash scripts/go-coverage.sh --module test/e2e
      - name: CLI logic-scope coverage gate (≥90%)
        if: matrix.module == 'apps/cli'
        working-directory: ${{ matrix.module }}
        run: ./scripts/coverage.sh 90
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}

  coverage-determinism:
    name: Coverage determinism probe (manual)
    # MANUAL ONLY. This exists to answer one question before the ratchet is armed: are the numbers
    # CI produces stable, and are they the same numbers a laptop produces?
    #
    # They are not, and that is the whole point. Go coverage here depends on what is on PATH:
    # measured locally, packages/core/tofu moves 51.98% -> 36.72% with `tofu` removed,
    # packages/core/provisioner 50.73% -> 39.12%, apps/runner/internal/agent 49.58% -> 47.24%
    # (those suites self-skip). packages/core/api moves by two statements depending on whether an
    # alethia credentials file exists in the user's config dir — which it does on a maintainer's
    # Mac and never in CI. Recording floors from a laptop therefore bakes numbers CI can never
    # reach and reds EVERY PR in the repository until someone regenerates them.
    #
    # So: run this, read its output, and generate the floors from THESE numbers.
    #
    # It compares PARSED pairs, never raw profiles — block order in a coverprofile follows package
    # completion order under `go test -p N` and is genuinely unstable run to run, so diffing or
    # checksumming the file itself is broken on arrival.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apps/cli, apps/runner, packages/core, test/e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # Must mirror the `go` job's toolchain EXACTLY, or the numbers this probe prints are not
      # the numbers the ratchet will compare against and flooring from them reds every PR.
      - uses: azure/setup-helm@v5
        if: matrix.module == 'apps/runner'
        with:
          version: v3.16.3
      - uses: opentofu/setup-opentofu@v2
        if: matrix.module == 'packages/core' || matrix.module == 'apps/runner'
        with:
          tofu_version: "1.9.0"
      - name: Which coverage-affecting binaries does this runner image actually ship?
        run: |
          for b in docker git helm kubectl tofu; do
            printf '%-10s %s\n' "$b" "$(command -v "$b" || echo MISSING)"
          done
      - name: Five runs, comparing parsed pairs
        run: |
          for i in 1 2 3 4 5; do
            (cd ${{ matrix.module }} && GOWORK=${{ matrix.module == 'test/e2e' && 'off' || 'auto' }} \
              go test -count=1 -coverprofile=cover.$i.out ./... >/dev/null)
            bash scripts/go-coverage.sh --module ${{ matrix.module }} \
              --profile ${{ matrix.module }}/cover.$i.out --print >run.$i.txt
          done
          echo "── per-package covered/total, run 1 ──"
          cat run.1.txt
          if [ "$(cat run.*.txt | sort -u | wc -l)" -eq "$(wc -l <run.1.txt)" ]; then
            echo "✓ ${{ matrix.module }} is run-to-run deterministic across 5 runs"
          else
            echo "::error::${{ matrix.module }} is NONDETERMINISTIC — do NOT floor it. Differing rows:"
            cat run.*.txt | sort | uniq -c | awk '$1 != 5'
            exit 1
          fi
      - name: Floors these numbers would produce (copy into the A4 PR)
        run: |
          bash scripts/go-coverage.sh --module ${{ matrix.module }} \
            --profile ${{ matrix.module }}/cover.1.out --update
          echo "── ${{ matrix.module }}/coverage-floors.json ──"
          cat ${{ matrix.module }}/coverage-floors.json
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-floors-${{ strategy.job-index }}
          path: ${{ matrix.module }}/coverage-floors.json

  runner-image-arch:
    name: Runner image arch (amd64 ships x86-64 — INCIDENT 2026-07-22 guard)
    # Would have caught the 2026-07-22 fleet-churn incident BEFORE prod: apps/runner/Dockerfile.base
    # shipped an arm64 binary inside the amd64 image (a stray `ARG TARGETARCH=arm64` default), so every
    # x86 fleet VM crash-looped on `execve` ENOEXEC and never registered. A plain `go build` can't
    # reproduce a Dockerfile ARG regression — so BUILD THE REAL IMAGE for linux/amd64 and assert its
    # /usr/local/bin/runner is a genuine x86-64 ELF (e_machine 0x3e), not aarch64 (0xb7). runner-base
    # carries the compiled binary that every per-cloud image inherits FROM without rebuilding, so this
    # one build covers runner-{aws,gcp,azure,alibaba,hetzner}. Mirrors scripts/e2e/runner-e2e.sh's
    # `register` stage (which asserts the same on the PUBLISHED images). Gated on the runner surface.
    needs: [detect-changes]
    if: needs.detect-changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runner-base for linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile.base
          platforms: linux/amd64
          load: true
          tags: runner-base:arch-check
          cache-from: type=gha,scope=runner-base-amd64
      - name: Assert /usr/local/bin/runner is x86-64 (e_machine 0x3e, not 0xb7 aarch64)
        run: |
          em=$(docker run --rm --entrypoint sh runner-base:arch-check \
                 -c 'od -An -tx1 -j18 -N2 /usr/local/bin/runner' | tr -d ' ')
          echo "amd64 /runner e_machine=$em"
          case "$em" in
            3e00) echo "OK — amd64 runner is x86-64 (e_machine=0x3e)" ;;
            b700) echo "::error file=apps/runner/Dockerfile.base::amd64 image ships an ARM64 runner (e_machine=0xb7) — the 2026-07-22 fleet-churn INCIDENT bug (arm64 binary in the amd64 image). Ensure the builder cross-compiles from buildx's TARGETARCH with NO arm64 default."; exit 1 ;;
            *)    echo "::error file=apps/runner/Dockerfile.base::unexpected e_machine=$em in the amd64 runner binary (expected 0x3e x86-64)"; exit 1 ;;
          esac

  provision-e2e:
    name: Provisioning E2E (T1 · real runner → kind)
    # MERGE-QUEUE ONLY. A real runner PROCESS claims a QUEUED job from a real
    # Postgres-backed control plane and drives the full RunDeployV2 spine against a
    # genuine `kind` cluster — kind boot + provider/image pulls are heavy, so this
    # keystone runs when a PR enters the merge queue, not on every push. The `e2e_t1`
    # build tag keeps it out of the fast per-PR Go suite; ALETHIA_E2E_T1_REQUIRE=1
    # turns a missing prerequisite (docker/kind/tofu) into a HARD FAIL, never a green
    # skip, so the signal can't hollow out. Extends the in-process T0 (which stays in
    # the `go` job as a compile check).
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    services:
      # Mirrors the `integration` job: a throwaway Postgres that db:migrate turns into
      # the real control-plane schema + programmables (claim_next_job / update_job_status
      # / insert_job_log) the runner's claim + callbacks + log-shipping exercise.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      # kind is slower than the in-process T0 — give the reachability gate room.
      ALETHIA_CLUSTER_READY_TIMEOUT: 3m
      # In the merge queue a missing prerequisite is a HARD FAIL, never a green skip.
      ALETHIA_E2E_T1_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.9.0"
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - uses: azure/setup-kubectl@v5
      - name: Install kind CLI (independent kubeconfig + cluster-leak cleanup)
        run: |
          go install sigs.k8s.io/kind@v0.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Migrate the control-plane database (schema + programmables/RLS + app role)
        run: pnpm -F console db:migrate
      # B6.1 — the gated-promotion chain is console + DB logic (no cloud, no kind), so it runs here
      # first (fast feedback) against the SAME migrated Postgres: it drives the REAL exported console
      # actions (advancePromotionOnPlan → applyPromotionApproval → finalizeDeployment +
      # finalizePromotionOnDeploy) via the tsx shim and asserts the classification gate blocks, the
      # approval clears it, the DEPLOY reaches SUCCESS through the update_job_status SSOT, and the
      # promotion finalizes. ALETHIA_E2E_B6_REQUIRE=1 makes a missing prereq a hard fail (never a skip).
      - name: B6.1 — gated dev→staging promotion (classification gate → approval → deploy → finalize)
        working-directory: test/e2e
        env:
          ALETHIA_E2E_B6_REQUIRE: "1"
        run: GOWORK=off go test -tags=e2e_b6 ./... -run TestB6GatedPromotion -count=1 -timeout 8m -v
      # 25m: the test's own ctx is 20m (deploy wait 8m + ArgoCD Healthy+Synced
      # convergence assertion 8m + build/boot headroom) plus teardown margin.
      - name: T1 — real runner claims from the control plane and provisions kind
        working-directory: test/e2e
        run: GOWORK=off go test -tags=e2e_t1 ./... -run TestT1RealRunnerKindProvisioning -count=1 -timeout 25m -v
      - name: Teardown any leaked kind clusters (safety net)
        if: always()
        run: kind delete clusters --all || true

  go-coverage-badge:
    name: Go coverage badge (self-hosted)
    runs-on: ubuntu-latest
    # Push-to-main only: aggregate the three Go modules' coverage into one badge JSON the README
    # renders, and commit it. `[skip ci]` avoids a run loop.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cover each Go module
        run: |
          for m in apps/cli apps/runner packages/core; do
            (cd "$m" && go test -coverprofile=cover.out ./...)
          done
      - name: Compute aggregate Go coverage → badge JSON
        run: node scripts/go-coverage-badge.mjs
      - name: Commit the badge if it changed
        run: |
          if git diff --quiet -- .github/badges/go-coverage.json; then
            echo "Go coverage badge unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges/go-coverage.json
            # --no-verify: the repo's pre-commit hook (core.hooksPath) blocks direct
            # commits to main; this CI-authored badge commit is legitimate.
            git commit --no-verify -m "chore(ci): update go coverage badge [skip ci]"
            # WHY NOT `git push` TO MAIN, AND WHY NO `|| true`:
            #
            # `protect-main` (infra/github/main.tf) is enforcement:active with bypass_actors:[]
            # and a pull_request rule, so EVERY update to refs/heads/main must arrive via a PR.
            # This push was refused with `GH006: Protected branch update failed … Changes must be
            # made through a pull request`, and `|| echo "::warning::badge push skipped"` turned
            # that hard failure into a green job. `permissions: contents: write` never mattered —
            # the token has the permission, the ruleset denies the ref update.
            #
            # Consequence: this job had NEVER pushed successfully. .github/badges/go-coverage.json
            # has exactly one commit in its history (23892e35, 2026-06-28, hand-authored); the
            # job was added 2026-06-30 and the ruleset created 2026-07-03. The README advertised
            # 21.6% for five weeks while the real aggregate was 61.2% — a 40-point error that the
            # swallowed exit code hid. The TypeScript badge above was dead for the same reason.
            #
            # The rulesets match only refs/heads/{dev,main,staging} with empty excludes, so the
            # orphan `badges` branch is writable with no Terraform apply and no hole in main.
            git push --force origin HEAD:badges
          fi

  mutation:
    name: Mutation testing (Stryker + Gremlins)
    # The objective "are the tests real" check. Slow — runs WEEKLY + on manual dispatch only,
    # never on PRs. Report-only for now (|| true); ratchet to a hard threshold as scores climb.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - run: pnpm install --frozen-lockfile
      - name: TS mutation (Stryker — lib + actions)
        run: pnpm -F console mutate || true
      - name: Go mutation (Gremlins — all modules)
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
          scripts/go-mutation.sh || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license for ORG-owned repos, so we run the
      # open-source gitleaks binary directly (MIT). Scan only the PR/push diff — the
      # .gitleaks.toml is authored for diff-only scanning so pre-existing history findings
      # don't block new PRs (see that file's header).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan new commits for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "scanning ${BASE}..${HEAD}"
            gitleaks git . --redact --log-opts="${BASE}..${HEAD}"
          else
            echo "base commit unavailable — scanning latest commit only"
            gitleaks git . --redact --log-opts="-1"
          fi

  addon-charts-render:
    name: Add-on charts render (helm template · pinned charts)
    runs-on: ubuntu-latest
    # Its own job because it needs helm on PATH and fetches real charts — neither belongs in the
    # console's vitest run. It renders the DEFAULT values of every marketplace add-on against its
    # pinned chart and requires exit 0.
    #
    # #2058 is why this exists: Loki's entry paired `deploymentMode: SingleBinary` with non-zero
    # read/write/backend replicas. Both values are individually valid, the combination is rejected by
    # the chart's own validate.yaml, and NOTHING in this repo could see it — types pass, unit tests
    # assert what the resolver emits rather than what the chart accepts, and neither parity guard
    # measures add-on values. It shipped, and a real cluster found it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Every add-on renders with its pinned chart and its own defaults
        run: node apps/console/scripts/check-addon-charts-render.mjs

  docs-prose:
    name: Docs prose (Vale · Diátaxis + plain-language)
    needs: detect-changes
    # This job ALWAYS runs so it always reports its status check — that is what makes it safe to
    # mark REQUIRED (infra/github). A job whose steps all skip still reports success, so on a
    # non-docs PR / promotion / merge_group it passes green without spinning up Vale. The real work
    # is gated per-step on the `docs` filter; the final step is the explicit no-op pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.detect-changes.outputs.docs == 'true'
      - uses: actions/setup-node@v7
        if: needs.detect-changes.outputs.docs == 'true'
        with:
          node-version: 22
      # Vale shells out to `mdx2vast` to parse .mdx (prose only — it drops fenced code,
      # code spans, URLs, JSX/ESM); it must be on $PATH.
      - name: Install the MDX preprocessor
        if: needs.detect-changes.outputs.docs == 'true'
        run: npm i -g mdx2vast
      # Vale is a single Go binary — install the pinned release, mirroring the gitleaks job.
      - name: Install Vale
        if: needs.detect-changes.outputs.docs == 'true'
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.15.1/vale_3.15.1_Linux_64-bit.tar.gz \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
      # Downloads the Google style package into styles/ (gitignored); the Alethia style + vocab
      # are vendored in the repo.
      - name: Sync Vale packages
        if: needs.detect-changes.outputs.docs == 'true'
        working-directory: apps/docs
        run: vale sync
      # `vale` exits non-zero ONLY on error-level alerts (the Alethia.Terminology rule). Warnings
      # (plain-language swaps, long sentences) and suggestions print for visibility but never red
      # the build — matches the green-CI / self-merge flow.
      - name: Lint docs prose
        if: needs.detect-changes.outputs.docs == 'true'
        working-directory: apps/docs
        run: vale content
      # No apps/docs changes — nothing to lint, but the job still reports success so the required
      # check is satisfied on non-docs PRs and promotions.
      - name: No docs changes
        if: needs.detect-changes.outputs.docs != 'true'
        run: echo "No apps/docs changes in this PR — prose lint not required."
