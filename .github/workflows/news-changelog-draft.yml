#
# Draft the next News changelog entry, weekly, as a DRAFT pull request.
#
# scripts/news/draft-changelog.mjs reads the squash subjects that reached `main` since the newest
# `kind: changelog` entry, keeps the user-facing feat/fix items, and writes
# apps/blog/content/posts/changelog-<date>.mdx with `draft: true`. That file is raw material: a
# person rewrites it into plain user language and marks the PR ready (news-pipeline proposal §3.1,
# phase 1.4). The bot never publishes — the entry stays `draft: true`, the PR stays a draft, and
# Mergify ignores drafts.
#
# IT OPENS A PR; IT NEVER PUSHES TO dev. Same shape and same token custody as programme.yml: a
# stable branch, so one PR is updated rather than a new one opened every week, and an App token
# (TAP_APP_*) so the PR's checks are not held at `action_required` the way a GITHUB_TOKEN-authored
# PR's are (#3476). GITHUB_TOKEN is the fallback only.
#
# ⚠️ `schedule:` fires the DEFAULT branch's copy (`main`), so the weekly run starts once this file
# has been promoted. `workflow_dispatch` works from any branch before then.
#
# COST: zero. A checkout, a Node script over git history, one PR.

name: News changelog draft (weekly)

on:
  schedule:
    # Mondays 07:23 UTC. Off-minute per the repo's cron convention.
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: news-changelog-draft
  cancel-in-progress: true

# Nothing at the top level; the one job asks for exactly what it uses.
permissions: {}

jobs:
  draft:
    name: Draft the next changelog entry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write — the fallback path pushes the draft branch with GITHUB_TOKEN.
    # pull-requests: write — the fallback path opens the draft PR. Nothing else is read or written.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          # The script reads `main`'s history since the last entry, and its release-please manifest.
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Self-test the parser
        run: node scripts/news/draft-changelog.mjs --self-test

      - name: Write the draft entry
        id: write
        run: |
          node scripts/news/draft-changelog.mjs --ref origin/main
          if git status --porcelain -- apps/blog/content/posts | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the PR token (GitHub App)
        id: app_token
        if: steps.write.outputs.changed == 'true'
        # Non-fatal: a PR that needs an approval click is better than no PR.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: alethialabs-io
          repositories: alethialabs

      - name: Open or update the draft PR
        if: steps.write.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app_token.outputs.token || github.token }}
          base: dev
          branch: news/changelog-draft
          draft: true
          add-paths: apps/blog/content/posts/changelog-*.mdx
          title: "docs(news): changelog draft"
          commit-message: |
            docs(news): draft the next changelog entry

            Generated by .github/workflows/news-changelog-draft.yml from the user-facing
            feat/fix PRs that reached main since the last entry.
          body: |
            Generated by `.github/workflows/news-changelog-draft.yml` (`scripts/news/draft-changelog.mjs`).

            **This is raw material, not the entry.** Before marking this ready:

            1. Rewrite every bullet in plain user language — what changed for the person using the
               console, the CLI or the runner, not what the code does.
            2. Write the headline (the one change that matters most), the `description` and the
               `summary`, and a real `title`.
            3. Move refinements from New into Improved; delete anything a user would not notice.
            4. Remove `draft: true` from the frontmatter.

            The entry renders on `/news/changelog`, in the News grid and in `/news/changelog.xml`.
          delete-branch: false
