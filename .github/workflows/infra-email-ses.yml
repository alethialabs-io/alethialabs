name: Infra - Email SES

# VALIDATE-ONLY, and credential-free by construction. `infra/email-ses` is a self-hosting
# reference: SES in the self-hoster's OWN AWS account (apps/docs/.../self-host/email.mdx). It is
# not a deployment target of ours. Hosted transactional email is `infra/email-ses-account`, in the
# dedicated `alethia-email` account, applied by hand and validated by infra-email-ses-account.yml.
#
# Until 2026-11-15 this file also carried a push-to-main `apply` job that assumed
# `alethia-ses-deployer` (vars.SES_DEPLOYER_ROLE_ARN) through GitHub OIDC and applied this stack in
# the platform account, where SES production access was refused. Its last run was 2026-08-09. It
# was removed so that an edit under `infra/email-ses/**` reaching `main` applies nothing, and so the
# hosted resources it managed can be retired by hand (infra/email-ses/RETIRE.md). Do not add an
# apply job back: a self-hoster applies this stack locally, against their own account and state.
on:
  pull_request:
    paths:
      - 'infra/email-ses/**'

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml`, `addon-render-determinism.yml` and the four workflows
# fixed on 2026-09-02 carry this; these nine did not.
#
# MEASURED 2026-09-03 over 500 runs / 6h24m: jobs spend 5,376 minutes WAITING for a runner against
# 1,802 executing, and 77 of 500 runs (15 percent) were cancelled — started, took a slot, thrown
# away. The currency is slots REQUESTED, so a superseded run costs the same as a useful one until
# it dies.
#
# `github.ref` is `refs/pull/<n>/merge` on a pull_request, so it is distinct per PR.
concurrency:
  group: infra-email-ses-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_DIR: infra/email-ses
  TOFU_VERSION: "1.10.10"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Validate (no backend, no secrets)
        working-directory: ${{ env.TF_DIR }}
        # No backend and no secrets: this workflow references none, so none can reach a PR job.
        run: |
          tofu init -backend=false
          tofu validate

      - name: IaC checks (fmt + tflint + Trivy)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: ${{ env.TF_DIR }}
