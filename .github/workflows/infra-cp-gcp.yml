name: Infra - CP GCP

# VALIDATE-ONLY, and credential-free by construction. `infra/cp-gcp` is a self-hosting option a
# user applies in THEIR OWN GCP project (apps/docs/.../self-host/terraform/gcp.mdx); it is not a
# deployment target of ours. Hosted prod runs on `cp-hetzner`. Until 2026-11-14 this file also
# carried a push-to-main `apply` job behind `vars.INFRA_GCP_APPLY` and a static service-account
# JSON key (`secrets.GOOGLE_CREDENTIALS`). That job never applied anything: its one run (the
# 2026-07-03 go-live push, a day before the variable gate existed) failed at `tofu init`, every push
# run since was `skipped`, and the variable was never set. The `TF_STATE_S3_*` secrets its
# `tofu init` needed do not exist, no `gcp-cp/` state exists, and `GOOGLE_CREDENTIALS` is not set at
# repo, environment or org scope, so the job could not have authenticated either. It was removed
# rather than moved to federation: a deploy identity for a target nobody deploys is standing
# privilege with no user. To make GCP a real target again, add Workload Identity Federation (the
# `infra/gcp-e2e` pattern) and a `google-github-actions/auth` apply job — never a JSON key.
on:
  pull_request:
    paths:
      - 'infra/cp-gcp/**'

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml`, `addon-render-determinism.yml` and the four workflows
# fixed on 2026-09-02 carry this; these nine did not.
#
# MEASURED 2026-09-03 over 500 runs / 6h24m: jobs spend 5,376 minutes WAITING for a runner against
# 1,802 executing, and 77 of 500 runs (15 percent) were cancelled — started, took a slot, thrown
# away. The currency is slots REQUESTED, so a superseded run costs the same as a useful one until
# it dies.
#
# `github.ref` is `refs/pull/<n>/merge` on a pull_request, so it is distinct per PR.
concurrency:
  group: infra-cp-gcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_DIR: infra/cp-gcp
  TOFU_VERSION: "1.10.10"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Validate (no backend, no secrets)
        working-directory: ${{ env.TF_DIR }}
        # No backend and no secrets: this workflow references none, so none can reach a PR job.
        run: |
          tofu init -backend=false
          tofu validate

      - name: IaC checks (fmt + tflint + Trivy)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: ${{ env.TF_DIR }}
