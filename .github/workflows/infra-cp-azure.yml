name: Infra - CP Azure

# VALIDATE-ONLY, and credential-free by construction. `infra/cp-azure` is a self-hosting option a
# user applies in THEIR OWN Azure subscription (apps/docs/.../self-host/terraform/azure.mdx); it
# is not a deployment target of ours. Hosted prod runs on `cp-hetzner`. Until 2026-11-14 this file
# also carried a push-to-main `apply` job behind `vars.INFRA_AZURE_APPLY` and a static
# service-principal secret (`secrets.ARM_CLIENT_SECRET`, with `ARM_CLIENT_ID` /
# `ARM_SUBSCRIPTION_ID` / `ARM_TENANT_ID`). That job never applied anything: its one run (the
# 2026-07-03 go-live push, a day before the variable gate existed) failed at `tofu init`, every push
# run since was `skipped`, and the variable was never set. The `TF_STATE_S3_*` secrets its
# `tofu init` needed do not exist, no `azure-cp/` state exists, and none of the `ARM_*` secrets is
# set at repo, environment or org scope, so the job could not have authenticated either. It was
# removed rather than moved to federation: a deploy identity for a target nobody deploys is
# standing privilege with no user. To make Azure a real target again, add a federated identity
# credential (the `infra/azure-e2e` pattern) and an `azure/login` apply job — never a client secret.
on:
  pull_request:
    paths:
      - 'infra/cp-azure/**'

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml`, `addon-render-determinism.yml` and the four workflows
# fixed on 2026-09-02 carry this; these nine did not.
#
# MEASURED 2026-09-03 over 500 runs / 6h24m: jobs spend 5,376 minutes WAITING for a runner against
# 1,802 executing, and 77 of 500 runs (15 percent) were cancelled — started, took a slot, thrown
# away. The currency is slots REQUESTED, so a superseded run costs the same as a useful one until
# it dies.
#
# `github.ref` is `refs/pull/<n>/merge` on a pull_request, so it is distinct per PR.
concurrency:
  group: infra-cp-azure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_DIR: infra/cp-azure
  TOFU_VERSION: "1.10.10"

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Validate (no backend, no secrets)
        working-directory: ${{ env.TF_DIR }}
        # No backend and no secrets: this workflow references none, so none can reach a PR job.
        run: |
          tofu init -backend=false
          tofu validate

      - name: IaC checks (fmt + tflint + Trivy)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: ${{ env.TF_DIR }}
