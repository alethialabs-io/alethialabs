name: Release CLI

# Builds the CLI from the monorepo source (the source of truth) and PUBLISHES the GitHub Release +
# binaries + Homebrew formula + Scoop manifest + packages + GHCR image on the CLI's own public repo,
# alethialabs-io/alethia-cli — its release/binary home. release-please (in the monorepo) computes the
# version and cuts the cli-v* tag; this workflow snapshots that exact source onto alethia-cli under a
# clean semver tag (vX.Y.Z) and runs GoReleaser THERE, so every version string is clean semver and
# users find releases on the CLI repo. See docs/concepts/release-system.mdx.
#
# TRIGGERED BY THE TAG, not by release-please's job: release-please creates the cli-v* tag with the
# GitHub-App token (which DOES trigger workflows), so publishing runs even if a release-please
# post-step (e.g. commenting on a locked PR) fails. Decoupled on purpose.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.3.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # Derive the version + tags from the trigger: a cli-v* tag push (release-please), or a manual
      # dispatch with the bare version. CLI_TAG = the monorepo source tag; MIRROR_TAG = the clean
      # semver tag published on alethia-cli.
      - name: Resolve version + tags
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${GITHUB_REF_NAME#cli-v}"
          fi
          echo "REL_VERSION=$VER" >> "$GITHUB_ENV"
          echo "CLI_TAG=cli-v$VER" >> "$GITHUB_ENV"
          echo "MIRROR_TAG=v$VER" >> "$GITHUB_ENV"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Checkout monorepo @ the release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.CLI_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: apps/cli/go.sum

      # Token for the alethia-cli release home (release + tag + source push). Separate from the tap
      # token so each is least-scoped.
      - name: Mint alethia-cli token (GitHub App)
        id: cli_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: alethialabs-io
          repositories: alethia-cli

      # Token for the Homebrew tap + Scoop bucket (formula/manifest pushes).
      - name: Mint tap token (GitHub App)
        id: tap_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: alethialabs-io
          repositories: |
            homebrew-tap
            scoop-bucket

      # Snapshot THIS exact source onto alethia-cli (main + a clean vX.Y.Z tag) so GoReleaser below
      # builds + releases from the CLI repo under clean semver — no race with the continuous mirror.
      - name: Sync + tag alethia-cli @ the release source
        env:
          GH_TOKEN: ${{ steps.cli_token.outputs.token }}
        run: |
          set -euo pipefail
          bash .github/mirror/build-stage.sh "$RUNNER_TEMP/stage"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/alethialabs-io/alethia-cli.git" "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/stage/." .
          git config user.name "alethialabs-io"
          git config user.email "contact@borislav.me"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Release ${MIRROR_TAG} — sync from alethialabs-io/alethialabs@${GITHUB_SHA:0:12}"
            git push origin HEAD:main
          else
            echo "alethia-cli source already current."
          fi
          git tag -f "${MIRROR_TAG}"
          git push -f origin "refs/tags/${MIRROR_TAG}"

      - name: Checkout alethia-cli @ the release tag (GoReleaser workdir)
        env:
          GH_TOKEN: ${{ steps.cli_token.outputs.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/alethialabs-io/alethia-cli.git" "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          git checkout "tags/${MIRROR_TAG}"

      - name: Extract release notes from the changelog
        run: |
          set -euo pipefail
          VER="${MIRROR_TAG#v}"
          NOTES="$RUNNER_TEMP/notes.md"
          CL="$RUNNER_TEMP/release/apps/cli/CHANGELOG.md"
          # Pull the "## [<ver>]" section from the release-please changelog (present on real releases).
          if [ -f "$CL" ]; then
            awk -v v="$VER" '
              $0 ~ "^## \\[" v "\\]" {f=1; next}
              /^## \[/ {f=0}
              f {print}
            ' "$CL" > "$NOTES" || true
          fi
          if [ ! -s "$NOTES" ]; then
            printf 'alethia CLI %s\n' "$VER" > "$NOTES"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (publishes to alethia-cli)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: ${{ runner.temp }}/release
          args: release --clean --release-notes=${{ runner.temp }}/notes.md -f apps/cli/.goreleaser.yml
        env:
          # The clean vX.Y.Z tag lives on alethia-cli, which is also the git remote of the workdir —
          # so GoReleaser creates the Release there. GITHUB_TOKEN = the alethia-cli App token.
          GITHUB_TOKEN: ${{ steps.cli_token.outputs.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap_token.outputs.token }}
          SCOOP_TAP_GITHUB_TOKEN: ${{ steps.tap_token.outputs.token }}
          GORELEASER_CURRENT_TAG: ${{ env.MIRROR_TAG }}

      # Single-home: the release + binaries live on alethia-cli, so drop the changelog-only Release
      # release-please created on the monorepo. Keep the cli-v* TAG (release-please's version anchor)
      # by NOT passing --cleanup-tag. Best-effort — never fails the release.
      - name: Single-home — delete the monorepo Release (keep the tag)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete "${CLI_TAG}" --repo ${{ github.repository }} --yes \
            && echo "Deleted monorepo Release ${CLI_TAG} (tag kept)." \
            || echo "No monorepo Release ${CLI_TAG} to delete."

  # ── The metadata publish, and the ONLY job that gets a credential ───────────────────────────
  # Split out of `goreleaser` rather than bolted onto it. That job holds the alethia-cli App token,
  # the Homebrew/Scoop tap token and a GHCR login, and it pushes source to another repository — none
  # of which should acquire the ability to read the production vault because the last step in the
  # job happens to need one secret out of it.
  #
  # `environment: cli-release` is what makes this job's OIDC sub `...:environment:cli-release`,
  # which alethia-deploy-reader trusts (infra/aws-oidc/roles.tf). Without it the sub is
  # `...:ref:refs/tags/cli-vX.Y.Z` — a tag ref, trusted by nothing, which is why every CLI release
  # since v0.4.0 published binaries and told the console nothing (#2482). The environment carries a
  # `cli-v*` TAG deployment policy (infra/github/environments.tf), so no branch and no other tag can
  # select it, and `production`'s secrets stay unreachable from a tag push.
  #
  # ORDERING TRAP: the environment, its tag policy and the trusted sub must all EXIST before this
  # file reaches `main`. A job naming an environment that does not exist creates it unprotected; a
  # job naming a protected one it cannot satisfy is refused before it starts. See the PR body.
  publish-metadata:
    needs: goreleaser
    # TAG PUSHES ONLY. `cli-release` is restricted to the `cli-v*` tag pattern, so a
    # `workflow_dispatch` of this workflow (which runs on a BRANCH ref) cannot select it and would
    # be refused at the gate — turning a manual re-release into a red run at its last job. Skip the
    # publish there and repair it deliberately: run `publish-cli-release-metadata.yml` against
    # `main`, which reaches the same role through the branch sub and runs the same script.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: cli-release
    permissions:
      contents: read
      id-token: write
    env:
      ASM_REGION: eu-central-1
    steps:
      - name: Checkout monorepo @ the release tag
        uses: actions/checkout@v7
        with:
          ref: cli-v${{ needs.goreleaser.outputs.version }}

      - name: Configure AWS credentials (read-only vault role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_READER_ROLE_ARN }}
          aws-region: ${{ env.ASM_REGION }}

      - name: Publish canonical release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ALETHIA_URL: ${{ vars.PUBLIC_APP_URL }}
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: bash .github/scripts/publish-cli-release-metadata.sh
