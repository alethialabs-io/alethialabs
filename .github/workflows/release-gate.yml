name: Release gate
# THE BROWSER GATE IN FRONT OF EVERY PRODUCTION DEPLOY.
#
# Production deploys on a push to `main` (deploy-console.yml), and `main` takes a PR only from a
# pinned `release/<sha>` promotion branch that promote.yml opened at a dev commit (or, until it is
# retired, `staging`, a `hotfix/*` branch, or a release-please PR) — branch-flow-guard.yml.
#
# ⚠️ BUT WHAT MAKES THAT A GATE IS NOT A REQUIRED CHECK, AND THIS HEADER USED TO SAY IT WAS. The
# sentence here read: "So a required check on PRs into `main` IS 'before every production
# deployment'." The mechanism was real; the premise was false. NO `Release gate (<leg>)` context is
# required anywhere. Measured 2026-09-15 by enumerating the live rulesets directly —
# `gh api repos/alethialabs-io/alethialabs/rulesets/18465988` (protect-main) and `/18465989`
# (protect-staging) each require exactly TEN contexts, protect-dev (`/18583159`) nine, and not one
# of those twenty-nine is a gate leg. `.mergify.yml` names none of them either, in any of its
# condition blocks. `infra/github/variables.tf` DOES declare all seven required on `main` — but that
# is a DECLARATION, and that stack has never been applied (#4642 measures the drift, #3549 tracks
# it). Applying it is #4286's work item 3 and is the MAINTAINER's, not this file's; it is also
# blocked on `Release gate (canvas)`, which has never gone green (#4445, #4589), so applying today
# would make `main` require a context nothing satisfies.
#
# SO, FOR THE MERGE, EVERY LEG IS ADVISORY: a promotion PR that is red on a leg is `UNSTABLE`, not
# `BLOCKED`, and can be merged. Read a green promotion as "nothing required was red", never as "the
# gate passed".
#
# ⚠ THE TWO PARAGRAPHS ABOVE ARE A 2026-09-15 MEASUREMENT AND NO LONGER HOLD FOR `main`. Re-read on
# 2026-10-04 (#5417) with the same `gh api …/rulesets/18465988`: protect-main now requires all seven
# `Release gate (<leg>)` contexts, so a promotion PR into `main` that is red on a leg is BLOCKED.
# protect-staging (`/18465989`) and protect-dev (`/18583159`) still require none of them.
#
# WHAT DOES STAND BETWEEN A RED LEG AND PRODUCTION is a step in a different workflow.
# deploy-console.yml's `preflight` job re-derives the leg table below and refuses to deploy unless
# every leg PASSED on the promotion PR's head; `changes` needs `preflight` and every build job needs
# `changes`, so that one edge sits in front of the whole deploy graph. A red leg therefore does stop
# production — but it stops it AFTER the merge, at the deploy, not at the merge button. Two bounds
# on that, because they are what a promoter is actually deciding against: the receipt carries
# `if: github.event_name != 'workflow_dispatch'`, so a deliberate manual dispatch skips it entirely;
# and promoting past a red leg fails nothing at promotion time — it lands the commit on `main` and
# leaves production silently not updating until someone reads the deploy run.
#
# Each leg below boots its own ephemeral console — postgres service, the real
# migrations, the enterprise scope, `next start` — and drives one Playwright project against it, in
# the exact shape ci.yml's `e2e-browser` job proved. The repo is public, so the runner minutes are
# free; nothing here needs a sandbox environment, a staging server, or a cloud credential.
#
# GREEN-BY-RATCHET. The suites were 39% green when this landed (apps/console/docs/qa/findings.md).
# Every leg therefore fails on REGRESSION against apps/console/e2e/gate-baseline.json rather than
# on absolute red — scripts/e2e-ratchet.mjs holds the rules — so the gate can be required from the
# day the baseline is captured while the suites are repaired lane by lane.
#
# WHEN IT RUNS, and why each clause is there:
#   · a non-draft PR into main or staging — the promotion path. A promotion's head is now a
#     `release/<sha>` branch that never moves (promote.yml), so the gate runs ONCE per promotion.
#     `draft == false` stays load-bearing: the old standing dev→staging promotion PR had `dev` as its
#     head, lived as a DRAFT between promotions and was 22% of all CI runs (CONTRIBUTING.md); a
#     one-hour gate re-fired on every dev merge would be the single most expensive mistake this file
#     could make.
#   · a non-draft PR into dev carrying the `release-gate:run` (or `release-gate:all`) label — for a
#     lane that wants per-PR gate feedback, and for capturing or re-recording the baseline. A push to
#     such a PR runs here directly; ADDING the label runs this file through
#     .github/workflows/release-gate-label.yml (`workflow_call`), never as a `labeled` run of its own.
#   · workflow_dispatch, with an optional comma-separated `legs` input.
#   · workflow_call from ci.yml's `e2e-qa-leg` job (#7647): the `qa` leg ALONE, on a dev PR whose
#     diff touches the console UI, its e2e specs or the packages it renders. That run is part of
#     ci.yml's run, reports as `E2E qa leg (…) / Release gate (qa)` (never the bare promotion
#     context), and is a `needs:` of `CI required`, so a qa regression fails the PR that caused it
#     instead of the next promotion (#7554, #7608). ci.yml owns the trigger rule; this file owns
#     the leg.
# Never `merge_group` (Mergify replaced it), never `paths:` (a filtered-out required workflow reports
# nothing and wedges every PR — ci.yml's `build-console` job comment has the incident).
#
# THAT LIST IS ENFORCED BY EVERY JOB'S OWN `if:`, BEFORE A CHECKOUT. `on:` cannot filter by base
# branch AND label at once, so an ordinary feature PR into dev still CREATES a run — and every job in
# it is skipped at the job level, so the run costs no runner slot and no checkout. A run whose jobs all
# skipped concludes `skipped`, which scripts/ci/workflow-health.mjs's `classify()` correctly reads as
# no signal.
#
# ── WHY `labeled` IS NOT IN THE TYPES BELOW, AND MUST NEVER BE AGAIN (#7654, 2026-11-25) ────────
#
# A skipped run is not harmless when it lands on a sha that already has a decided one. Until #7654
# every label added to any PR created a run here, and a label other than the two above skipped every
# job. release-please opens its PR and adds `autorelease: pending` in the same second, so a release PR
# got two `pull_request` runs of this workflow on ONE head sha: `opened` (the legs ran and passed) and
# `labeled` (all skipped). When the skipped run had the higher run id, GitHub showed its check suite
# for this workflow, and protect-main's seven required `Release gate (<leg>)` contexts read "Expected —
# Waiting for status to be reported" until the next push: #7640 (runs 45574672159 success <
# 45574674013 skipped) never became mergeable, #7631 (opposite order) merged. The concurrency fix of
# 2026-11-22 (below) stopped a label from CANCELLING the gate; it could not stop the label's run from
# SUPERSEDING it, because supersession needs no cancellation — only a newer run.
#
# So on a PR into `main`, every run this workflow can now create on a head sha is `opened`,
# `synchronize`, `reopened` or `ready_for_review`, and each of those runs all seven legs unless the PR
# is a draft (which cannot merge). No event left in the list is one whose run skips on a mergeable
# promotion. The two gate labels on a dev PR are served by .github/workflows/release-gate-label.yml,
# which calls this file; its legs report as `Gate by label / Release gate (<leg>)`, a different check
# name (required checks match by name only, and a called job is named `<caller job> / <called job>` —
# that file's header has the sources), so they cannot stand in for, or shadow, the bare contexts
# protect-main requires. `node scripts/ci/check-required-checks.mjs` fails if `labeled` returns here.
#
# ── WHY AN UNLABELLED dev PR NO LONGER RUNS ANYTHING HERE (2026-11-22) ─────────────────────────
#
# Between #4466 and this change, the `legs` job ran on EVERY non-draft dev PR event — every push and
# every label added by anyone or anything — to ask whether the diff changed something a leg measures,
# went RED when it did and the PR carried no label, and (#4777) ran the legs implied by a PR's own
# changed specs without asking. Two measurements decided against keeping that:
#
#   · ITS OWN HEADER MEASURED THE OUTCOME: replaying 80 dev merges, 41 (51%) went red unlabelled, and
#     nothing requires this workflow's checks on dev, so those PRs merged anyway. This file called
#     that disposition — "red on half of dev PRs and binding on none" — the one worse than both
#     alternatives, and it was where the check had settled.
#   · THE CI BILL, 2026-11-15→22: 858 Release gate runs in seven days, a median of 50 minutes, 195 of
#     them cancelled — and 417 cancellations repo-wide came from re-pushes on feature branches, which
#     each re-ran this workflow. CI capacity is the binding constraint on every lane, and a check that
#     binds nothing was spending it on every push.
#
# WHAT THAT GIVES UP, stated rather than hidden: a dev PR that changes what a leg measures and carries
# no label merges with no leg verdict, and a leg's red first appears on the next promotion PR — the
# #4333 → #4389 shape #4466 was written against. The remedy is the label, asked for by the author who
# knows the diff touches the browser: `release-gate:run` narrows to the legs that diff implies (see
# the `legs` job), `release-gate:all` runs every leg. The promotion path is unchanged and still runs
# all seven, and deploy-console.yml's receipt still refuses a production deploy unless every leg
# passed on the promotion PR's head.
#
# The zero-`failed` ledger bar, which used to ride along in this workflow's `ledger` job on every PR,
# moved to ci.yml's `Gate ledger` job (same name), so it is still asked on every PR without
# this workflow having to start.
#
# WHICH legs run is a separate question from WHETHER the gate runs, and it is answered once, in the
# `legs` job. A PR into main or staging runs every leg — that is the gate, and a promotion must not
# choose what measures it. A dev PR MAY narrow, because on that path the seven legs cost ~76
# runner-minutes per push (measured, run 34351806933) and CI capacity, not authoring, is this wave's
# ceiling. Narrowing there is safe for a reason that is written down rather than assumed: the seven
# `Release gate (<leg>)` contexts are filtered OUT of `protect-dev` in infra/github/main.tf (the
# only other ruleset, protect-main, is the one that requires them) and are named nowhere in
# .mergify.yml, so a leg that does not run on a dev PR leaves no required context unreported and no
# queue entry waiting. See the `legs` job for the rules.
#
# That is a statement about the DECLARATION, which is the half this repo can read from the tree.
# What GitHub actually enforces is a separate question and a separate instrument —
# `node scripts/ci/check-required-checks.mjs --live`, which exists because the HCL and the live
# rulesets have already drifted for a month once. The narrowing above is sound under either answer:
# the tree never asks for a leg on dev, and a ruleset that has not been applied asks for even less.
#
# Every `pnpm` invocation is `-C <dir> run` or `exec` (scripts/ci/check-pnpm-script-refs.mjs); every
# step past the checkout that runs on failure carries the #4084 conjunct
# (scripts/ci/check-workflow-shape.mjs). The `WORKFLOW_HEALTH_SUBSTANTIVE_JOB` line lets
# scripts/ci/workflow-health.mjs ask whether the job that carries this workflow's meaning actually
# ran — see the note above that line for why it is no longer a leg.
on:
  pull_request:
    branches: [main, staging, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  # Called by .github/workflows/release-gate-label.yml when a `release-gate:run` or `release-gate:all`
  # label is added to a non-draft dev PR. The caller's `labeled` event payload IS this run's
  # `github.event`, so the job-level `if:` clauses and the picker below read it exactly as they read
  # a direct `labeled` run before #7654 — which is why those `labeled` clauses are still here.
  workflow_call:
  workflow_dispatch:
    inputs:
      legs:
        description: "Comma-separated legs to run (hero, elench-ai, console, canvas, qa, audit, audit-interaction). Empty runs every leg."
        required: false
        default: ""
  # ci.yml's `e2e-qa-leg` job calls this file for the `qa` leg on a dev PR whose diff touches
  # what that leg measures (#7647). Same `legs` picker, same `gate` job, same ratchet and baseline:
  # the leg is DEFINED once, here, and ci.yml only decides WHEN. Inside a called run
  # `github.event_name` is the CALLER's (`pull_request`) and the base is `dev`, so every clause
  # below that would skip an unlabelled dev PR also asks `inputs.ci_legs` first. On every other
  # event `inputs.ci_legs` is null, which `format('{0}', ...)` renders as '' — the clauses read
  # exactly as they did before this trigger existed.
  #
  # `run` comes back out so ci.yml's `CI required` can refuse a VACUOUS green: a called workflow
  # whose `legs` job skipped (a mis-evaluated `if:`) reports success with no leg run at all, and
  # the aggregator reads this output to tell that apart from a leg that ran and passed.
  workflow_call:
    inputs:
      ci_legs:
        description: "Comma-separated legs ci.yml wants run on this PR (today only `qa`)."
        required: true
        type: string
    outputs:
      run:
        description: "`yes` when the legs job decided the gate runs."
        value: ${{ jobs.legs.outputs.run }}

# A LABEL MUST NEVER CANCEL A GATE, DISPLACE A QUEUED ONE, OR SUPERSEDE A DECIDED ONE.
#
# Three different ways one run can take another's verdict away, and `concurrency` governs only the
# first two:
#
#   1. CANCELLATION. The group is evaluated when a run is CREATED, before any job-level `if:`. With a
#      blanket `cancel-in-progress: true`, an unrelated label 40 minutes into the `qa` leg created a
#      new run, cancelled the in-flight one, then skipped every job — and the seven contexts never
#      reported. So `cancel-in-progress` is true only for a `pull_request` event that is not
#      `labeled`: a push supersedes its predecessor as before, and a gate-label request (which now
#      arrives as a `labeled` payload through release-gate-label.yml's `workflow_call`) cannot cancel
#      anything. A dispatch has its own group (`github.event_name` is in it).
#   2. DISPLACEMENT (2026-11-22). With cancel-in-progress off, a group still holds ONE pending run,
#      and a newer run REPLACES the pending one. So a gate-label request queued behind a running gate
#      could be replaced by a run that then skipped every job. The `-unrelated-label-<run id>` suffix
#      gave such a run a group of its own. Since #7654 an unrelated label never reaches this file at
#      all (release-gate-label.yml's job `if:` stops it before the call), so the suffix is defence in
#      depth for a `labeled` event that should no longer exist here.
#   3. SUPERSESSION (#7654). Nothing in this block can prevent it. A newer run of this workflow on the
#      same head sha is the one whose check suite GitHub shows for the workflow, whether or not it
#      cancelled anything; a skipped newer run hid a passing older one, and protect-main read its
#      seven required contexts as "Expected" (#7640). The only fix is not to create such a run, which
#      is why `labeled` left the `pull_request` types above. Read the header section on `labeled`.
#
# The gate-label request runs in the PR's own group: release-gate-label.yml has no group of its own,
# and the group string below does not use `github.workflow` (which a called workflow takes from its
# caller), so the called run lands in `release-gate-pull_request-<n>`. It queues behind an in-flight
# gate and is cancelled by a later push, as a direct `labeled` run was.
concurrency:
  group: release-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ format('{0}', inputs.ci_legs) != '' && '-ci-call' || '' }}${{ (github.event.action == 'labeled' && !contains(fromJSON('["release-gate:run","release-gate:all"]'), github.event.label.name)) && format('-unrelated-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

permissions:
  contents: read

# THE JOB THAT CARRIES THIS WORKFLOW'S MEANING, for scripts/ci/workflow-health.mjs's vacuity check.
#
# It named `Release gate (qa)` until #4466. On a dev PR the legs are CONDITIONAL BY DESIGN — a
# labelled PR narrows to the legs its diff implies — so a decided run can legitimately contain no
# `Release gate (qa)` job at all, and `substantiveVerdict` reads a job absent from every sampled run
# as `misdeclared` ("the job was probably renamed"). No per-run marker on a leg can express that.
#
# So the marker names the job that runs on every DECIDED run: `legs`, which picks what is measured.
# Since 2026-11-22 an unlabelled dev PR skips every job here, so its run concludes `skipped` and is
# not sampled at all; the decided runs are promotions, labelled dev PRs and dispatches, and `legs`
# runs on each. WHAT THAT GIVES UP, stated: a promotion run where `qa` silently stops being selected
# is not caught HERE. It is caught somewhere stronger — deploy-console.yml refuses to deploy unless
# all seven `Release gate (<leg>)` contexts PASSED on the promotion PR's head, which is a stricter
# question than "did the job appear".
env:
  WORKFLOW_HEALTH_SUBSTANTIVE_JOB: "Which legs run, and whether the gate runs at all"

jobs:
  legs:
    name: Which legs run, and whether the gate runs at all
    runs-on: ubuntu-latest
    # The trigger logic lives HERE, once, because `matrix` is not available in a job-level `if:`
    # and six copies of this clause would drift six ways. The gate job `needs` this one, so when
    # this is skipped nothing below runs.
    #
    # THE BASE-REF/LABEL CONJUNCT IS BACK IN THIS `if:` (2026-11-22), where it lived before #4466.
    # #4466 moved it into the picker so this job could run on EVERY non-draft dev PR and go red when
    # an unlabelled diff touched what a leg measures; the header records why that was reversed
    # (51% red, binding on nothing, and a run plus a checkout on every push and every label). So:
    #
    #   · `draft == false` — unchanged. A draft cannot merge, and `ready_for_review` fires the run
    #     the moment it is not one.
    #   · base is `main` or `staging`, OR the PR carries `release-gate:run` / `release-gate:all`. An
    #     ordinary feature PR into dev skips here, before any checkout or API call.
    #   · a `labeled` event counts only when the label just added is one of those two. Since #7654
    #     the only `labeled` payload that reaches this file is release-gate-label.yml's call, whose
    #     own job `if:` already admitted only those two labels on a non-draft dev PR; the clause stays
    #     as defence in depth, and so that the two files cannot disagree about which labels count.
    #
    # NOTHING REQUIRES THIS CHECK, AND NOW NOTHING CAN. It is in neither `.mergify.yml` nor
    # `infra/github`. Before this change it reported on every non-draft PR event, which is what made
    # requiring it in Mergify's `queue_conditions` an available (if expensive) option; now an
    # unlabelled dev PR reports it SKIPPED, and a required context that does not always report wedges
    # the queue (`.mergify.yml`'s `Build console images (no push)` note). Do not add it to either list.
    #
    # The `contains(...)` tests are CASE-INSENSITIVE, and the picker lower-cases the labels it reads
    # for the same reason (see `RUN_LABELS` below), so the two halves cannot disagree about a PR.
    if: >-
      github.event_name == 'workflow_dispatch'
      || format('{0}', inputs.ci_legs) != ''
      || (github.event.pull_request.draft == false
          && (github.base_ref == 'main'
              || github.base_ref == 'staging'
              || contains(github.event.pull_request.labels.*.name, 'release-gate:run')
              || contains(github.event.pull_request.labels.*.name, 'release-gate:all'))
          && (github.event.action != 'labeled'
              || contains(fromJSON('["release-gate:run","release-gate:all"]'), github.event.label.name)))
    # `pull-requests: read` is what `GET /pulls/{n}/files` needs; the workflow-level grant is
    # `contents: read` only. Without it the API call 403s — which selects EVERY leg, loudly, rather
    # than silently narrowing. The `gate` job below keeps the workflow-level grant.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      include: ${{ steps.pick.outputs.include }}
      run: ${{ steps.pick.outputs.run }}
    steps:
      # NO CHECKOUT. This job used to check the tree out for one question — which directories the
      # console is compiled from — and that question belonged to the `require-label` step, which
      # went with the unlabelled-dev-PR path (2026-11-22). The picker reads only the PR's file list
      # (from the API, below) and its own tables, so a monorepo checkout here would be pure cost.
      #
      # The denominator of the path inference below. THIS STEP cannot fail the job: an API error, a
      # revoked scope, GitHub's 3000-file cap — each writes an empty list and a `read=no`, and `pick`
      # turns that into EVERY leg (a diff it cannot read must not narrow). A file list this step could
      # not read is not an empty diff.
      - id: changed
        name: List the PR's changed files (unreadable or empty selects every leg)
        if: ${{ github.event_name == 'pull_request' && format('{0}', inputs.ci_legs) == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: /tmp/release-gate-changed-files.txt
        run: |
          set -uo pipefail
          read_ok=yes
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "$CHANGED_FILES"; then
            echo "::warning::could not list the changed files for this PR — every leg will run"
            : > "$CHANGED_FILES"
            read_ok=no
          fi
          count=$(wc -l < "$CHANGED_FILES" | tr -d ' ')
          # GitHub's file list is capped at 3000. At the cap the list is a TRUNCATION, and inferring
          # from a truncated diff is exactly the under-reporting this file refuses.
          if [ "$count" -ge 3000 ]; then
            echo "::warning::the changed-file list hit GitHub's 3000-file cap — every leg will run"
            read_ok=no
          fi
          echo "changed files: $count (readable: $read_ok)"
          cat "$CHANGED_FILES"
          echo "read=$read_ok" >> "$GITHUB_OUTPUT"
      # ── THIS STEP'S `run:` BLOCK HAS A 21,000-BYTE CEILING, AND BREACHING IT IS A LOAD FAILURE ─
      #
      # GitHub renders every `run:` scalar as a template expression before a job starts, and REFUSES
      # THE WHOLE FILE past 21,000: `(Line: 174, Col: 14): Exceeded max expression length 21000`.
      # Measured on run 34460914813, where #4466's first draft put this block at 20,917 characters —
      # UNDER the limit — and 21,119 UTF-8 BYTES, over it. The budget is bytes, so every `—`, `·` and
      # `→` in a comment down there costs three. The file parsed cleanly under `yaml@2.9.0` and
      # actionlint was silent; GitHub rejected it anyway.
      #
      # WHAT A REJECTED FILE LOOKS LIKE, because nothing in the repo will tell you: a run with ZERO
      # jobs, named `.github/workflows/release-gate.yml` instead of `Release gate`, on the `push`
      # event because `on:` was never read — and NOT ONE gate context on the PR. `gh run list
      # --commit <sha>` shows no release-gate run at all. The message is readable only in that run's
      # own UI. A workflow that does not load runs no legs, which is strictly worse than the gap this
      # job exists to close.
      #
      # SO PROSE LIVES UP HERE, IN YAML COMMENTS, NOT DOWN THERE IN THE HEREDOC, and a check that
      # needs its own thousands of bytes gets its own step with its own budget (the `require-label`
      # step was one, until it was removed with the unlabelled-dev-PR path on 2026-11-22). A `#` line
      # here costs nothing; the same sentence a few columns right, inside the script, is spent out of
      # 21,000.
      # THE CURRENT SIZES ARE NOT WRITTEN DOWN HERE, and that is the third correction to this
      # paragraph rather than a gap in it. Two attempts to record them went stale inside the commit
      # that wrote them — the second recorded its PARENT's numbers, while the step it was describing
      # grew 1,473 bytes in that same diff. A number that drifts inside its own commit is not a
      # record. `node scripts/ci/check-workflow-shape.mjs` prints the live figure for every workflow
      # on a GREEN run, and that is where to read it; what belongs here is only what does not move.
      #
      # WHAT DOES NOT MOVE. The ceiling is 21,000 bytes and it binds PER SCALAR, not per file and not
      # per job: this file is over three times the ceiling and loads. And the rejected scalar was
      # 21,119 bytes / 20,917 characters — the pair that shows the unit. (Actions compiles a `run:`
      # scalar as a template only if it CONTAINS an expression — see the next paragraph — so summing
      # the bytes of several steps, templated or not, is not evidence about the ceiling.)
      #
      # THAT RULE IS ALSO THE CHEAPEST FIX, when it applies. The 21,119-byte block that was refused
      # contained exactly one expression — `${{ matrix.project }}`, inside a JavaScript COMMENT
      # explaining a flag in another job. Prose about an expression IS an expression, and that one
      # mention put 21 KB of script under a template compiler. deploy-console.yml has carried an
      # untemplated block OVER the ceiling and deployed production repeatedly — at 21,500 bytes,
      # which is the number that carries the evidence; it is 22,422 today and has not run since,
      # so today's figure proves nothing. The split is kept anyway, because it does not depend on
      # nobody ever writing `${{` into a comment again.
      #
      # ── WHETHER THE GATE RUNS AT ALL IS DECIDED BY THE JOB'S `if:`, NOT HERE (2026-11-22) ──────
      #
      # From #4466 until 2026-11-22 this step also answered "does an UNLABELLED dev PR's diff change
      # something a leg measures", handed that to a `require-label` step that went RED when it did,
      # and (#4777) ran the legs a PR's own changed specs implied without asking. All of that was
      # reachable only because this job ran on every dev PR; it no longer does (see the job's `if:`
      # and the header for the measurements that decided it), so that machinery is gone rather than
      # left as code no event can reach. The history worth keeping:
      #
      #   · #4333 rewrote the design-project edit buffer unlabelled, the `canvas` leg never ran, and
      #     its red first appeared on unrelated PRs and then blocked promotion #4389 two days later.
      #   · #4742, #4752, #4753 and #4754 went red here, nobody added the label, and each merged with
      #     zero browser runs — the red check never bound anything, which is why #4777 auto-ran spec
      #     legs, and why "51% red, binding on none" was where it ended.
      #   · Why not auto-add the label instead: a label added with the default GITHUB_TOKEN raises a
      #     `labeled` event that CANNOT start a workflow run ("events triggered by the GITHUB_TOKEN will
      #     not create a new workflow run", GitHub, "Triggering a workflow"), so the PR would carry the
      #     label and the gate would still never run. That is still true, and still why the label is a
      #     human's decision.
      #
      # So every event that reaches this step is one where the gate RUNS: a dispatch, a promotion PR,
      # or a dev PR carrying a `release-gate:*` label. The `run` output stays — `yes` on all three —
      # as the gate job's input, and it says `no` (with the reason in the log) if this step is ever
      # reached by an event the job's `if:` should have stopped, rather than spending the legs.
      #
      # SEAMS beyond apps/console, kept from the audit of #4466: `scripts/lib/console-routes.mjs` and
      # `scripts/ci/playwright-install.sh` are not reachable from apps/console's dependency graph but
      # are read by every leg, so a labelled PR that touches either runs every leg.
      #
      # THE LEG TABLE. One row per Playwright project the gate drives; `capabilities` is the
      # promise the leg makes (apps/console/e2e/helpers/capabilities.ts) and `floor` is the
      # fewest tests `--list` may report before the leg is called testMatch drift, not a suite.
      # `args` is the LITERAL `--project=<name>` flag, spelled out per row on purpose:
      # playwright.config.ts's dead-zone guard (#2875) reads every workflow for exactly that
      # string to prove a project runs somewhere, and a `--project=<the matrix expression>` is a
      # template it cannot see through. The emitter stays literal so the guard stays honest.
      #
      # AND THAT EXPRESSION IS NEVER WRITTEN OUT INSIDE THE SCRIPT, WHICH IS LOAD-BEARING.
      # Actions compiles a `run:` scalar as a template only if it CONTAINS a `$`+`{{ … }}`, and
      # this step's script is large. Writing the real expression into one of its comments — as it
      # was until #4466's review — put the whole block under the template compiler and inside the
      # 21,000-BYTE ceiling that refused this whole file once (see the notes above, and
      # scripts/ci/check-workflow-shape.mjs, whose error text prescribes exactly this fix).
      # Prose about an expression IS an expression. Do not restore it for readability.
      #
      # These paragraphs used to be `//` comments inside the script. They moved out here, where a
      # YAML comment costs the expression budget nothing, when check-workflow-shape.mjs began to
      # budget EVERY block scalar, templated or not (#6582); the script was 18,845 bytes.
      #
      # `capabilities` IS A COMMA-SEPARATED SET, and the `env:` block below reads it with
      # `contains(...)`, never `==`. Until #4456 every row held at most one name and the block
      # compared the whole set against one name with `==`, so the first row to promise two things
      # would have matched NOTHING and blanked all SIX Stripe variables — a leg that then
      # fails its own `--assert-env` pre-check, or (had that check not existed) runs every
      # billing assertion against an unconfigured console. See the env block for the six sites.
      #
      # ── WHAT MAY NARROW, AND WHAT MAY NOT ─────────────────────────────────────────────────
      #
      # A labelled dev PR used to run all seven legs: ~76 runner-minutes a push (measured, run
      # 34351806933), most of it seven copies of the same `next build`, for a lane whose whole
      # diff is one spec file. CI capacity is this wave's binding constraint, so a dev PR may
      # narrow. Three things never do, and the order below is the order they are asked in:
      #
      #   1. A PR into main or staging runs EVERY leg. That is the gate; a promotion must not
      #      choose what measures it. `release-gate:all` is the same answer asked for by hand.
      #   2. A diff touching a SEAM runs every leg — a file any leg reads, where a change can
      #      move any of them, so inferring from its path is the under-reporting this repo
      #      keeps paying for.
      #   3. A path matching NO rule runs every leg. "nothing matched" and "nothing needs
      #      running" are the same input, and making them the same output is the vacuous-green
      #      shape the gate exists to refuse. So does a file list this job could not read, and
      #      so does a diff of zero files.
      #
      # The consequence, stated plainly because it is the honest bound: inference narrows ONLY
      # for a diff made ENTIRELY of leg-specific files under apps/console/e2e/. A console
      # source change selects everything, because it can break anything.
      - id: pick
        name: Pick the legs for this event
        env:
          LEGS: ${{ inputs.legs }}
          CI_LEGS: ${{ inputs.ci_legs }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CHANGED_READ: ${{ steps.changed.outputs.read }}
          CHANGED_FILES: /tmp/release-gate-changed-files.txt
        run: |
          node - <<'EOF'
          const legs = [
            { project: "hero",      args: "--project=hero",      workers: 1, retries: 1, capabilities: "",                   manifest: false, floor: 1 },
            { project: "elench-ai", args: "--project=elench-ai", workers: 1, retries: 1, capabilities: "ai-mock",            manifest: false, floor: 1 },
            { project: "console",   args: "--project=console",   workers: 2, retries: 1, capabilities: "stripe,encryption",  manifest: false, floor: 1 },
            { project: "canvas",    args: "--project=canvas",    workers: 1, retries: 1, capabilities: "",                   manifest: false, floor: 1 },
            // `qa` promises `encryption` (#4456), which is what makes every secret-bearing surface
            // in flows/ reachable at all. It cost the rewrite of the two tests in
            // flows/alerts.negative.spec.ts that asserted the fail-closed no-key UI — and note that
            // only ONE of them went red. The other, "an Email channel is still offered, because it
            // stores no secret", stayed GREEN and stopped discriminating, because its whole meaning
            // was the contrast with its sibling. Renaming both moved two entries in
            // apps/console/e2e/gate-baseline.json (ratchet rule 4); their statuses did not.
            { project: "qa",        args: "--project=qa",        workers: 3, retries: 1, capabilities: "stripe,encryption",  manifest: false, floor: 300 },
            // `floor: 225` is MEASURED with `--list` on #6180's tree (#6116), the way the row below derives its own:
            //
            //   behaviour.spec.ts         124   (control + 40 answered + manifest check + 40 B1-B4 + 40 B5 + 2)
            //   predicate-selftest.spec    53
            //   routes.spec.ts             44
            //   permissions.spec.ts        31
            //   fixtures/auth.setup         1
            //   ─────────────────────────
            //   Total:                    253
            //
            // The smallest file is auth.setup (1), and losing it fails every test that depends on it, so the
            // floor is set against the smallest SPEC: 253 minus permissions.spec's 31 is 222, and 225 sits above
            // it — any one spec file that stops matching turns the leg red — while staying 28 below the total, so
            // retiring a handful of routes (about four tests each) does not.
            // `floor: 1` asked nothing: the leg stayed green with every audit file but one gone.
            { project: "audit",     args: "--project=audit",     workers: 1, retries: 1, capabilities: "",                   manifest: true,  floor: 225 },
            // `floor: 70` is MEASURED, not a round number, and the measurement is `--list` — the
            // same number the guard below greps out of `Total:`, taken on this tree:
            //
            //   destructive.spec.ts  60   (one per ledger control, 47, plus 13 standalone)
            //   inert.spec.ts        41   (one per manifest route, 40, plus the emptiness floor)
            //   fixtures/auth.setup   1   (the `dependencies: ["setup"]` project — it IS counted)
            //   ────────────────────────
            //   Total:              102
            //
            // R8 added the second file, so the leg went 61 → 102 and the old floor of 47 no longer
            // asks anything: it sits UNDER destructive.spec.ts on its own, so inert.spec.ts could
            // stop matching entirely and the gate would still be green. The floor therefore has to
            // clear the larger file PLUS setup — 61 — which is what makes "one of the two files
            // dropped out" red; and it has to stay far enough under 102 that retiring a ledger
            // entry or deleting a route is not a red gate. 70 is 9 above the first bound and 32
            // below the second. Re-derive it from `--list` when either file changes shape; do not
            // raise it to hug 102, which would make every routine deletion a gate failure.
            { project: "audit-interaction", args: "--project=audit-interaction", workers: 1, retries: 0, capabilities: "stripe,encryption", manifest: true, floor: 70 },
          ];
          const ALL = legs.map((l) => l.project);

          // A file any leg reads. The first six are the list #4440 names; `global-setup.ts` and
          // `reporters/` are added with the same argument — Playwright has no per-project
          // globalSetup so that file runs for every invocation, and every leg's `--reporter=`
          // flag below names `./e2e/reporters/qa-reporter.ts`.
          //
          // Rule 3 (unmatched runs everything) already covers every path in this list; it is kept
          // against the day someone widens a rule to a directory that holds one of these files.
          //
          // The last three are not under apps/console at all.
          // `console-routes.mjs` is the audit legs' DENOMINATOR — e2e/audit/manifest.ts calls it
          // "the ONE definition of the console's private route set", and the gate job runs it as
          // its own zero-routes guard — so narrowing that glob makes both audit legs measure fewer
          // routes with no leg having run. `playwright-install.sh` installs the browser every leg
          // drives. `sync-public-assets.mjs` is the FIRST command in `apps/console`'s `build` script:
          // it copies @repo/assets/static into apps/console/public, whose synced paths are gitignored,
          // so the package is the only source and that script is the only installer. Change where it
          // writes and every provider icon the browser legs render is simply absent. None of the
          // three is reachable from a surface derived out of apps/console's dependencies, which is
          // why each has to be named here.
          const SEAMS = [
            /^apps\/console\/playwright\.config\.ts$/,
            /^apps\/console\/e2e\/helpers\//,
            /^apps\/console\/e2e\/fixtures\//,
            /^apps\/console\/e2e\/gate-baseline\.json$/,
            /^apps\/console\/e2e\/global-setup\.ts$/,
            /^apps\/console\/e2e\/reporters\//,
            /^scripts\/e2e-ratchet\.mjs$/,
            /^\.github\/workflows\/release-gate\.yml$/,
            /^scripts\/lib\/console-routes\.mjs$/,
            /^scripts\/ci\/playwright-install\.sh$/,
            /^scripts\/sync-public-assets\.mjs$/,
          ];

          // FIRST MATCH WINS, so the order is load-bearing. Each `when` mirrors a project's
          // `testMatch` in apps/console/playwright.config.ts rather than restating a belief about
          // it — that file is where these regexes come from and where they must be kept true.
          const RULES = [
            { when: /^apps\/console\/e2e\/flows\//, legs: ["qa"], why: "e2e/flows/** is the qa project's testMatch" },
            { when: /^apps\/console\/e2e\/audit\/(destructive|filters|inert)\.spec\.ts$/, legs: ["audit-interaction"], why: "the audit-interaction project's whole testMatch" },
            { when: /^apps\/console\/e2e\/audit\/[^/]*\.spec\.ts$/, legs: ["audit"], why: "an audit spec (destructive.spec.ts, filters.spec.ts and inert.spec.ts are testIgnored out of this project)" },
            // NOT "other e2e/audit/** -> audit". destructive.spec.ts imports ./context and
            // ./manifest, so a shared audit module moves BOTH audit legs; sending it to `audit`
            // alone would be a silent under-selection.
            { when: /^apps\/console\/e2e\/audit\//, legs: ["audit", "audit-interaction"], why: "a shared audit module — both audit legs import from this directory" },
            { when: /^apps\/console\/e2e\/hero-happy-path\.spec\.ts$/, legs: ["hero"], why: "the hero project's whole testMatch" },
            { when: /^apps\/console\/e2e\/elench-(ai|ux)\.spec\.ts$/, legs: ["elench-ai"], why: "the elench-ai project's testMatch" },
            { when: /^apps\/console\/e2e\/architecture-canvas\.spec\.ts$/, legs: ["canvas"], why: "the canvas project's whole testMatch" },
            { when: /^apps\/console\/e2e\/(account-settings|activity|billing|connectors|elench-agent|evidence|usage)\.spec\.ts$/, legs: ["console"], why: "the console project's testMatch" },
          ];

          const fs = require("node:fs");
          const env = process.env;

          // The two label names that ask for the gate by hand, and the labels this PR actually
          // carries — parsed ONCE: `decide()` asks WHICH legs run, and the `run` output re-asks
          // WHETHER the gate runs (the job's `if:` already did; see the YAML above this step).
          //
          // LOWER-CASED, because the job-level `if:` above asks the same question with `contains()`,
          // and `contains()` IS CASE-INSENSITIVE while `Array.prototype.includes` is not. Both real
          // labels are lower-case, so this changes no answer today; what it removes is the state
          // where a `Release-Gate:Run` starts this job (the `if:` says yes) and then fails it (the
          // picker said no) — two halves of one conjunct disagreeing about the same PR.
          const RUN_LABELS = ["release-gate:run", "release-gate:all"];
          const prLabels = (() => { try { return JSON.parse(env.PR_LABELS || "[]") || []; } catch { return []; } })().map((l) => String(l).toLowerCase());

          /** Write one `key=value` job output. */
          const emit = (key, value) => { if (env.GITHUB_OUTPUT) fs.appendFileSync(env.GITHUB_OUTPUT, `${key}=${value}\n`); };

          /** Publish one markdown block to the step summary AND the log, so a red job explains itself in both. */
          const summarise = (md) => {
            if (env.GITHUB_STEP_SUMMARY) fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `${md.join("\n")}\n`);
            console.log(md.join("\n"));
          };

          /** The PR's changed paths, or null when the list could not be read or was truncated. */
          function changedPaths() {
            if (env.CHANGED_READ !== "yes") return null;
            try {
              const files = fs.readFileSync(env.CHANGED_FILES, "utf8").split("\n").map((s) => s.trim()).filter(Boolean);
              return files.length > 0 ? files : null;
            } catch { return null; }
          }

          /** Decide which legs run, and the one sentence that says why. Rows are per-path detail. */
          function decide() {
            const ciWant = (env.CI_LEGS || "").split(",").map((s) => s.trim()).filter(Boolean);
            if (ciWant.length > 0) {
              for (const w of ciWant) {
                if (!ALL.includes(w)) { console.error(`::error::ci.yml asked for unknown leg "${w}" (known: ${ALL.join(", ")})`); process.exit(1); }
              }
              return { legs: ciWant, rule: `called from ci.yml for \`${ciWant.join(", ")}\` — its affected-only filter matched this PR's diff (#7647)` };
            }
            if (env.EVENT_NAME === "workflow_dispatch") {
              const want = (env.LEGS || "").split(",").map((s) => s.trim()).filter(Boolean);
              for (const w of want) {
                if (!ALL.includes(w)) {
                  console.error(`::error::unknown leg "${w}" (known: ${ALL.join(", ")})`);
                  process.exit(1);
                }
              }
              return want.length
                ? { legs: want, rule: `workflow_dispatch named \`${want.join(", ")}\`` }
                : { legs: ALL, rule: "workflow_dispatch with an empty `legs` input — every leg" };
            }

            const base = env.BASE_REF || "";
            if (base === "main" || base === "staging") {
              return { legs: ALL, rule: `a PR into \`${base}\` — the promotion path runs every leg; a promotion must not choose what measures it` };
            }

            if (prLabels.includes("release-gate:all")) {
              return { legs: ALL, rule: "`release-gate:all` is on the PR — the manual override, every leg" };
            }

            if (env.CHANGED_READ !== "yes") {
              return { legs: ALL, rule: "the changed-file list could not be read (or was truncated) — every leg. A list this job cannot read is not an empty diff." };
            }
            let changed = [];
            try {
              changed = fs.readFileSync(env.CHANGED_FILES, "utf8").split("\n").map((s) => s.trim()).filter(Boolean);
            } catch {
              return { legs: ALL, rule: "the changed-file list is missing — every leg" };
            }
            if (changed.length === 0) {
              return { legs: ALL, rule: "the PR reported ZERO changed files — every leg. Zero is a number this job does not believe." };
            }

            const seamHits = changed.filter((f) => SEAMS.some((re) => re.test(f)));
            if (seamHits.length > 0) {
              return { legs: ALL, rule: `a shared seam changed (${seamHits.join(", ")}) — a seam can move any leg, so every leg runs` };
            }

            const rows = [];
            const selected = new Set();
            const unmatched = [];
            for (const f of changed) {
              const rule = RULES.find((r) => r.when.test(f));
              if (rule === undefined) {
                unmatched.push(f);
                rows.push({ file: f, legs: "every leg", why: "no rule matches this path" });
                continue;
              }
              for (const l of rule.legs) selected.add(l);
              rows.push({ file: f, legs: rule.legs.join(", "), why: rule.why });
            }
            if (unmatched.length > 0) {
              return { legs: ALL, rule: `${unmatched.length} changed path(s) match no rule — every leg runs, never none`, rows };
            }
            if (selected.size === 0) {
              return { legs: ALL, rule: "the rules selected nothing at all — every leg runs, never none", rows };
            }
            return { legs: ALL.filter((p) => selected.has(p)), rule: "inferred from the changed paths", rows };
          }

          const decision = decide();
          const labelled = legs.filter((l) => decision.legs.includes(l.project));
          if (labelled.length === 0) { console.error("::error::no legs selected"); process.exit(1); }

          // WHETHER THE GATE RUNS. The job's `if:` admits only these three; re-asked here so an event
          // that slipped past it says so and spends nothing, rather than running every leg.
          const promotion = env.BASE_REF === "main" || env.BASE_REF === "staging";
          const asked = RUN_LABELS.some((l) => prLabels.includes(l));
          const gateRuns = env.EVENT_NAME === "workflow_dispatch" || promotion || asked || Boolean(env.CI_LEGS);
          const chosen = labelled;
          const rule = gateRuns ? decision.rule : "not a dispatch, a promotion PR or a labelled dev PR, so the gate does not run (the job-level `if:` should have skipped this job)";
          emit("include", JSON.stringify(chosen));
          console.log(`legs: ${chosen.map((l) => l.project).join(", ")}`);
          console.log(`why: ${rule}`);
          emit("run", gateRuns ? "yes" : "no");

          // A LEG THAT SILENTLY DOES NOT RUN READS AS A LEG THAT PASSED. So the selection is
          // published where the run is read, with the skipped legs named and the rule that decided.
          const ran = chosen.map((l) => l.project);
          const skipped = ALL.filter((p) => !ran.includes(p));
          const md = [
            "## Release gate — which legs run",
            "",
            `**Rule:** ${rule}`,
            "",
            `**Running (${ran.length}/${ALL.length}):** ${ran.map((p) => `\`${p}\``).join(", ")}`,
            "",
            `**Skipped (${skipped.length}):** ${skipped.length ? skipped.map((p) => `\`${p}\``).join(", ") : "none"}`,
          ];
          if (decision.rows && decision.rows.length > 0) {
            md.push("", "| changed path | selects | because |", "| --- | --- | --- |");
            for (const r of decision.rows) md.push(`| \`${r.file}\` | ${r.legs} | ${r.why} |`);
          }
          if (skipped.length > 0) {
            md.push("", "A skipped leg reports no `Release gate (<leg>)` context. `infra/github/main.tf` declares those contexts required on `main` alone — it filters them out of `protect-dev`, and `.mergify.yml` names none of them — and a promotion PR never reaches this branch of the rules. (What GitHub enforces is `check-required-checks.mjs --live`'s question, not this one; the narrowing is sound under either answer.)");
          }
          summarise(md);
          EOF

  gate:
    name: Release gate (${{ matrix.project }})
    needs: [legs]
    # The conjunct that decides whether the runner-hours are spent lives on the `legs` job's `if:`
    # again (2026-11-22), so this job runs only below a `legs` that ran — a dispatch, a promotion PR,
    # or a dev PR carrying a `release-gate:*` label. The two clauses here are defence in depth:
    #
    #   · `run` is `yes` for exactly those three (the picker re-asks the same conjunct).
    #   · the `labeled` clause: a `labeled` payload arrives only through release-gate-label.yml's
    #     call (#7654), which admits the two gate labels alone. `legs` asks the same question; this
    #     keeps the gate from running if either copy ever drifts.
    #
    # A SKIP HERE IS NON-REPORTING, AND deploy-console.yml's RECEIPT DEPENDS ON THAT. The receipt
    # keeps the LATEST check-run per context name and refuses the production deploy unless all seven
    # are `success`. So if a skipped `gate` reported seven `Release gate (<leg>)` check-runs, an
    # innocuous label added to an already-green promotion PR would overwrite seven successes with
    # seven skips and take production off the air.
    #
    # It does not, and this was measured on three heads rather than reasoned about, because moving
    # the clause up here changed WHICH job is skipped and that is exactly the kind of change whose
    # consequence nobody models. GitHub evaluates a job's `if:` BEFORE expanding its matrix, so a
    # false `if:` yields ONE check-run under the literal, unexpanded name:
    #
    #   · #4572 head 563a6d9c, BEFORE this moved (`legs` itself skipped):
    #       `Release gate (${{ matrix.project }})` — skipped. The seven never report.
    #   · this branch, AFTER it moved, run 34480011384 (`legs` SUCCEEDED, `include` carried all
    #     seven, `if:` false): identical — `Release gate (${{ matrix.project }})`, skipped.
    #   · run 34351806933, where the gate actually ran: seven expanded names, six green.
    #
    # The matrix expands only when the job runs. Both before and after, a label leaves the seven
    # contexts untouched and the receipt reads the successes that are already there.
    #
    # ⚠ THAT WAS TRUE OF THE RECEIPT AND FALSE OF THE MERGE BUTTON (#7654). The receipt asks the
    # check-runs API for the latest run per NAME, and a skipped run's lone placeholder name collides
    # with none of the seven. protect-main does not ask that question: a newer, skipped run of this
    # workflow on the same head sha superseded the passing run's suite, and the seven required
    # contexts read "Expected" (#7640). "Untouched" was a measurement of one reader, reported as a
    # property of the commit. Since #7654 an unrelated label creates no run of this workflow at all,
    # which closes both readings; see the header section on `labeled`.
    # `success()` is written out, not implied (#5615): a red or skipped `legs` runs no leg, and a
    # skipped `legs` (a draft, an unlabelled dev PR, an unrelated label) has no output at all.
    # (It was load-bearing while `require-label` could fail `legs` after `pick` had already emitted
    # `run=yes`; that step is gone, but the rule it taught stays.) scripts/ci/check-workflow-shape.mjs
    # refuses this `if:` with the `success()` left unstated, so deleting it is visible.
    if: >-
      success()
      && needs.legs.outputs.run == 'yes'
      && (github.event.action != 'labeled'
          || contains(fromJSON('["release-gate:run","release-gate:all"]'), github.event.label.name))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.include) }}
    # Same hermetic recipe as ci.yml's e2e-browser job: a real Postgres, a production console booted
    # by the Playwright `webServer`, email-OTP with the code scraped from the teed log. OpenFGA is
    # left unset so the community PostgresRbacPDP is the authz engine.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      BETTER_AUTH_SECRET: release-gate-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # `next start` is production mode with no trusted ingress proxy in front of it, so every
      # request lands in ONE shared rate-limit bucket. apps/console/lib/config/auth.ts documents
      # this escape hatch; it is also what let the `console` and `qa` projects into CI at all — the
      # 5-OTP/60s cap was the recorded reason they could not be gating.
      ALETHIA_AUTH_RATE_LIMIT: "0"
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      DEV_CONSOLE_LOG: /tmp/alethia-release-gate-${{ matrix.project }}.log
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      # THE PROMISE. A spec tagged `@needs:<capability>` on a leg that does not promise it is red,
      # never a skip; a promise whose variables are absent fails the pre-check step in seconds.
      #
      # ⚠ EVERY TEST BELOW IS `contains(matrix.capabilities, …)`, NEVER `== '…'`. `capabilities` is
      # a comma-separated SET, and `==` asks whether the set has exactly one member with that name:
      # the moment a leg promises two things (`stripe,encryption`, #4456) every `== 'stripe'` goes
      # false and hands the leg an EMPTY Stripe key, an empty webhook secret, four empty price ids
      # and an empty publishable key — seven of them, one per line below. Count them against the
      # sentence: an off-by-one here reads as "the list is complete" and is how one stays behind.
      # `--assert-env` catches that as a named failure — but the shape it would otherwise
      # produce, billing assertions running green against an unconfigured console, is the exact
      # silent downgrade helpers/capabilities.ts exists to end.
      #
      # `contains` is a SUBSTRING test, so it is only equivalent to set membership while no
      # capability name is a substring of another. That is not left to a comment:
      # `capabilities.ts --assert-env` refuses the whole set when it stops holding, and that check
      # runs on every leg, below, before the build.
      ALETHIA_E2E_CAPABILITIES: ${{ matrix.capabilities }}
      ALETHIA_AI_MOCK: ${{ contains(matrix.capabilities, 'ai-mock') && '1' || '' }}
      ALETHIA_QA_E2E: ${{ matrix.project == 'qa' && '1' || '' }}
      # The credential-encryption key, only where promised (#4456). Without it
      # `isCredEncryptionConfigured()` is false and EVERY secret-bearing surface is inert: the
      # add-channel sheet renders its "needs an encryption key" note and disables submit, and no
      # connector credential can be stored. The gate could therefore exercise none of it.
      #
      # A FIXED NON-SECRET, not a repository secret, and the same literal `e2e-nightly.yml` already
      # uses: base64 for the ASCII `alethia-e2e-cli-demo-throwaway!!`, exactly 32 bytes, which is
      # what lib/crypto/secrets.ts accepts. The console it unlocks lives for one job against a
      # throwaway database, nothing it encrypts outlives the run, and the key is fixed rather than
      # generated so a failed decrypt stays reproducible. It must never be reused anywhere real.
      # `.gitleaks.toml` allowlists this blob anchored to this variable name.
      ALETHIA_CRED_ENCRYPTION_KEY: ${{ contains(matrix.capabilities, 'encryption') && 'YWxldGhpYS1lMmUtY2xpLWRlbW8tdGhyb3dhd2F5ISE=' || '' }}
      # Stripe TEST mode, only where promised. `NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY` is inlined at
      # BUILD time (apps/console/lib/billing/config.ts), which is why it is job-level env and not a
      # run-step env. The webhook secret is any test-mode `whsec_`: nothing reaches CI, and the
      # card-less trial syncs deterministically without one. NEVER `ALETHIA_DEPLOYMENT_MODE=hosted`
      # here — packages/email then refuses the OTP log fallback and nothing can sign in.
      # The sales provider (apps/console/lib/billing/provider/select.ts) FAILS CLOSED: without it the
      # console treats billing as off even with the Stripe test key below, so a `stripe` leg names it.
      BILLING_PROVIDER: ${{ contains(matrix.capabilities, 'stripe') && 'stripe' || '' }}
      STRIPE_SECRET_KEY: ${{ contains(matrix.capabilities, 'stripe') && secrets.STRIPE_TEST_SECRET_KEY || '' }}
      STRIPE_WEBHOOK_SECRET: ${{ contains(matrix.capabilities, 'stripe') && secrets.STRIPE_TEST_WEBHOOK_SECRET || '' }}
      STRIPE_PRICE_TEAM: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_TEAM || '' }}
      # The runner-minutes METER price (#4276). `lib/billing/config.ts` reads it as
      # `meterPrices.team`; without it the metered half of a Pro subscription is unset, so any
      # usage or overage surface a spec drives measures a console that has no meter — a green
      # assertion about a product that is not configured.
      #
      # IT IS NOT A DISPLAY SETTING, which is what an earlier revision of this comment claimed
      # while deliberately keeping it out of `REQUIRED_ENV.stripe` (#4631). `planCreateItems`
      # (app/server/actions/billing.ts) reads it on the CREATION path and pushes the meter as a
      # SECOND subscription item, so setting it changes what every Stripe leg's subscription is
      # made of — starting with the one `global-setup` builds through `startProTrial`, before a
      # single test runs. So it is REQUIRED for the `stripe` promise, and `--assert-env` names it
      # at the top of the job: a leg that promises `stripe` with this half unset builds a
      # one-item subscription and measures a persona this suite does not describe.
      STRIPE_PRICE_METER_TEAM: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_METER_TEAM || '' }}
      STRIPE_PRICE_AI_PLUS: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_AI_PLUS || '' }}
      STRIPE_PRICE_AI_MAX: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_AI_MAX || '' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PUBLISHABLE_KEY || '' }}
      # The test-mode MARKET waiver (#5412, maintainer ruling 2026-10-03). `PAID_MARKETS` is empty,
      # so without this the eligibility gate refuses every paid conversion with `market_closed` and
      # the gate can never reach Stripe Elements, the order summary, the currency toggle or a
      # hosted Checkout session. `lib/billing/eligibility.ts · testModeMarketOpen` honours it ONLY
      # beside a `sk_test_` secret key, so it cannot open a live sale. THIS IS THE ONLY PLACE IT IS
      # SET; it rides the same `stripe` promise as the test keys above.
      ALETHIA_BILLING_TEST_MARKET: ${{ contains(matrix.capabilities, 'stripe') && '1' || '' }}
    steps:
      # `id:` so the two `!cancelled()` steps at the bottom can ask whether there is a WORKSPACE:
      # the `services:` block starts before this checkout, and a failed image pull skips everything
      # here while `cancelled()` stays false (#4084).
      - id: checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Next's OWN incremental compiler cache, not turbo's. `pnpm -C apps/console run build` calls
      # the package script directly — turbo's `build.dependsOn` never fires — so a turbo cache step
      # here would restore nothing the build reads (ci.yml carries that inert step; this file does
      # not repeat it).
      - name: Cache Next's incremental compiler output
        uses: actions/cache@v6
        with:
          path: apps/console/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      # BEFORE the build: an unset repository secret is a named failure at the top of the job,
      # not a downgraded run at the bottom.
      - name: Guard — every promised capability has its variables (seconds, before a single build)
        run: pnpm -C apps/console exec tsx e2e/helpers/capabilities.ts --assert-env
      # THE OBJECT STORE the job env's `ALETHIA_STORAGE_*` has always pointed at, and which nothing
      # here used to start, so every storage read in a leg failed on a refused connection. Since
      # EA-7b (#7338) the invoice PDF route serves ONLY a stored фактура — never a redirect to
      # Stripe's hosted invoice — so `billing.spec.ts` and `flows/billing.spec.ts` seed one into this
      # store and assert the route serves those exact bytes. Without it they could only ever
      # measure "unavailable".
      #
      # A step, not a `services:` entry: SeaweedFS needs its `server -s3` arguments, which a service
      # container cannot be given. The S3 identity is the job env's own throwaway `e2e` pair, in the
      # shape of deploy/seaweedfs/s3.json. Started BEFORE the build so its volume server has minutes
      # to come up; the probe's 120s is a ceiling, not an expected duration.
      - name: Start the object store (SeaweedFS S3 on :8333)
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/seaweedfs-s3.json"
          cat > "$cfg" <<JSON
          {"identities":[{"name":"e2e","credentials":[{"accessKey":"$ALETHIA_STORAGE_ACCESS_KEY_ID","secretKey":"$ALETHIA_STORAGE_SECRET_ACCESS_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$cfg:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.53 \
            server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json \
            -master.volumeSizeLimitMB=1024 -ip.bind=0.0.0.0 >/dev/null
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ || true)
            if [ "$code" != "000" ]; then echo "SeaweedFS S3 answering (HTTP $code)"; exit 0; fi
            sleep 2
          done
          docker logs seaweedfs || true
          echo "::error::SeaweedFS S3 did not answer on :8333 within 120s"
          exit 1
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # Build @alethia/ee FIRST, and prove its dist exists. Without it lib/auth/scope.ts falls back
      # to `{ userId, orgId: userId }` and every org-scoped assertion goes vacuous — the failure
      # ci.yml's e2e-browser job records. The community `pnpm -F @alethia/ee` selector is the one
      # deliberate `-F <pkg> <script>`; the guard step is what makes it safe.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the leg silently runs community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community"
            echo "::error::scope (actor.orgId === userId), which makes org-scoped assertions vacuous."
            exit 1
          }
      - name: Build the console (the production image the browser drives)
        run: pnpm -C apps/console run build
      - name: Install Playwright (Chromium + OS deps)
        run: bash scripts/ci/playwright-install.sh
      # The audit's denominator. The manifest RAISES on zero routes rather than returning [], and
      # this proves it still does before the leg spends an hour on it.
      - name: Guard — the route manifest still resolves (audit legs)
        if: ${{ matrix.manifest }}
        run: node scripts/lib/console-routes.mjs --summary
      # A vacuous green is the failure this repo names most often. A testMatch that drifted to
      # zero tests exits 0; a `qa` leg listing 40 tests is not a smaller suite, it is the wrong one.
      - name: Guard — the leg lists at least its floor of tests
        run: |
          list=$(pnpm -F console exec playwright test ${{ matrix.args }} --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          total=$(echo "$list" | sed -nE 's/.*Total: ([0-9]+) test.*/\1/p' | tail -1)
          if [ -z "$total" ] || [ "$total" -lt ${{ matrix.floor }} ]; then
            echo "::error::--project=${{ matrix.project }} listed ${total:-0} test(s), below the floor of ${{ matrix.floor }} (testMatch drift?)"
            exit 1
          fi
      # `continue-on-error` IS THE GREEN-BY-RATCHET MECHANISM, not a softened check.
      #
      # Playwright exits non-zero whenever ANY test fails, and the whole premise of this gate is
      # that a leg is allowed to be red while it is repaired. When this was written the baseline
      # recorded 94 failures across four legs; it now records none (`node scripts/e2e-ratchet.mjs
      # --census`), and ci.yml's `Gate ledger` job reds any PR that adds one. With none recorded, a
      # failing test is also a ratchet failure (rules 1, 2 and the `{skip}` rule all red a
      # `failed`), so this flag no longer changes a leg's colour; it is kept so the ratchet stays
      # the single verdict and the one place that says WHY a leg is red.
      # Measured when it was added: on run 34247389000 the `console` leg's Ratchet step SUCCEEDED
      # ("no regression against the baseline") and the job was red anyway, on this step. The two
      # legs that passed, `hero` and `elench-ai`, are exactly the two with zero recorded failures.
      #
      # It is safe because the ratchet below is not a summariser — it FAILS on every way this
      # step can die. No `results.json` (a webServer that never booted, a config throw) is an
      # unreadable file and exits 1; a report with no tests for the project raises rather than
      # ratcheting clean; a suite that all-fails is 172+ regressions. And the `--list` floor
      # guard above still fails HARD, before this step, so testMatch drift cannot reach here.
      - name: Run the leg (Playwright boots `next start` via webServer)
        continue-on-error: true
        run: >-
          pnpm -F console exec playwright test
          ${{ matrix.args }}
          --workers=${{ matrix.workers }}
          --retries=${{ matrix.retries }}
          --reporter=list,html,json,./e2e/reporters/qa-reporter.ts
      # THE VERDICT. Not the exit code above — this step is the only thing that can fail the job:
      # a regression against the committed baseline, a new test that did not pass, a skip that is
      # neither a BUG fixme nor a recorded reason, or a recorded failure that now passes (move the
      # ledger). Runs on failure too — that is when it matters.
      - name: Ratchet — no regression against apps/console/e2e/gate-baseline.json
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/e2e-ratchet.mjs --project=${{ matrix.project }} --results=apps/console/test-results/results.json --step-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report, traces and the JSON the ratchet read
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-${{ matrix.project }}
          path: |
            apps/console/playwright-report/
            apps/console/test-results/
          retention-days: 14
