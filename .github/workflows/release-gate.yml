name: Release gate
# THE BROWSER GATE IN FRONT OF EVERY PRODUCTION DEPLOY.
#
# Production deploys on a push to `main` (deploy-console.yml), and `main` only ever takes a PR from
# `staging` (branch-flow-guard.yml). So a required check on PRs into `main` IS "before every
# production deployment". Each leg below boots its own ephemeral console — postgres service, the real
# migrations, the enterprise scope, `next start` — and drives one Playwright project against it, in
# the exact shape ci.yml's `e2e-browser` job proved. The repo is public, so the runner minutes are
# free; nothing here needs a sandbox environment, a staging server, or a cloud credential.
#
# GREEN-BY-RATCHET. The suites were 39% green when this landed (apps/console/docs/qa/findings.md).
# Every leg therefore fails on REGRESSION against apps/console/e2e/gate-baseline.json rather than
# on absolute red — scripts/e2e-ratchet.mjs holds the rules — so the gate can be required from the
# day the baseline is captured while the suites are repaired lane by lane.
#
# WHEN IT RUNS, and why each clause is there:
#   · a non-draft PR into main or staging — the promotion path. `draft == false` is load-bearing:
#     the standing dev→staging promotion PR lives as a DRAFT between promotions and was 22% of all
#     CI runs (CONTRIBUTING.md); a one-hour gate re-fired on every dev merge would be the single most
#     expensive mistake this file could make.
#   · a PR into dev carrying the `release-gate:run` (or `release-gate:all`) label — for a lane that
#     wants per-PR gate feedback, and for capturing the baseline. `labeled` fires for ANY label, so
#     the GATE job also requires that the label just added is one of those two, or a random label
#     would restart an hour. That clause sits on the `gate` job, not on `legs`: since #4466 `legs`
#     reports on every non-draft PR event, because a check that sometimes reports `skipped` cannot
#     be required without wedging the queue.
#   · workflow_dispatch, with an optional comma-separated `legs` input.
# Never `merge_group` (Mergify replaced it), never `paths:` (a filtered-out required workflow reports
# nothing and wedges every PR — validate-console.yml's header has the incident).
#
# AND ON EVERY OTHER NON-DRAFT dev PR, THE `legs` JOB RUNS ANYWAY — to answer one question and then
# stop (#4466). That label was a memory step, not a function of the diff: a PR that rewrites the
# surface a leg exists to protect merged with the leg never having executed, and the red landed days
# later on someone else's promotion (#4333 → #4389). So the `legs` job now goes RED when a dev PR
# changes something the gate BOOTS and carries neither `release-gate:*` label, naming the paths, the
# legs they imply and the label that is missing. The seven legs still run only on a promotion, a
# dispatch, or a labelled PR.
#
# THE PRICE, MEASURED, AND IT IS NOT THE SMALL HALF. Two costs, and the second is the one that
# decides whether this check should be binding.
#
#   · ASKING costs one runner SLOT on every non-draft PR into main, staging or dev, on every push,
#     plus a checkout of this monorepo — including on a docs-only PR. AND ON EVERY LABEL EVENT: `on:`
#     lists `labeled`, and the clause that used to skip this job for an unrelated label moved to the
#     `gate` job, so a triage label, a `claimed`, or anything the queue-babysitting instance and the
#     board automation add now starts a run and a checkout too. That is the cost of the context
#     always reporting, which is what makes it registerable at all; it is not free.
#     scripts/ci/ci-demand.mjs counts slots rather than minutes because 75% of this repo's CI
#     wall-clock is queue wait: a five-second job that waits twenty minutes holds a slot for twenty.
#   · ANSWERING costs the gate. Replaying the last 80 `dev` merges through this exact logic:
#     41 OF 80 (51%) GO RED unlabelled. 39 of those 41 would run all seven legs — a console source
#     path matches no rule, and rule 3 sends it everywhere — for 275 leg-runs, about 3,000 RUNNER-
#     MINUTES over that window, and that is one push each. In a file whose header argues that CI
#     capacity is this wave's binding constraint, that number belongs here rather than in a PR body.
#
# The check is not over-reporting to get there: of the 41, three are paths that cannot reach the
# browser, all of them console source that no rule narrows. The number is what the invariant COSTS
# at today's leg selection, not a matcher being loose — half of dev PRs touch the console, and the
# gate measures the console. Two honest ways to spend less: require it and pay (the legs are seven
# copies of one `next build`, so the bill is the build, not the specs), or make a dev-path console
# change select fewer than seven legs, which is the under-selection #4516 deliberately refuses.
# The one disposition that is worse than both is the one this lands in by default — red on half of
# dev PRs and binding on none, which is how a shared instrument gets trained into noise.
#
# WHICH legs run is a separate question from WHETHER the gate runs, and it is answered once, in the
# `legs` job. A PR into main or staging runs every leg — that is the gate, and a promotion must not
# choose what measures it. A dev PR MAY narrow, because on that path the seven legs cost ~76
# runner-minutes per push (measured, run 34351806933) and CI capacity, not authoring, is this wave's
# ceiling. Narrowing there is safe for a reason that is written down rather than assumed: the seven
# `Release gate (<leg>)` contexts are filtered OUT of `protect-dev` and `protect-staging` in
# infra/github/main.tf and are named nowhere in .mergify.yml, so a leg that does not run on a dev PR
# leaves no required context unreported and no queue entry waiting. See the `legs` job for the rules.
#
# That is a statement about the DECLARATION, which is the half this repo can read from the tree.
# What GitHub actually enforces is a separate question and a separate instrument —
# `node scripts/ci/check-required-checks.mjs --live`, which exists because the HCL and the live
# rulesets have already drifted for a month once. The narrowing above is sound under either answer:
# the tree never asks for a leg on dev, and a ruleset that has not been applied asks for even less.
#
# Every `pnpm` invocation is `-C <dir> run` or `exec` (scripts/ci/check-pnpm-script-refs.mjs); every
# step past the checkout that runs on failure carries the #4084 conjunct
# (scripts/ci/check-workflow-shape.mjs). The `WORKFLOW_HEALTH_SUBSTANTIVE_JOB` line lets
# scripts/ci/workflow-health.mjs ask whether the job that carries this workflow's meaning actually
# ran — see the note above that line for why it is no longer a leg.
on:
  pull_request:
    branches: [main, staging, dev]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      legs:
        description: "Comma-separated legs to run (hero, elench-ai, console, canvas, qa, audit, audit-interaction). Empty runs every leg."
        required: false
        default: ""

# A LABEL EVENT MUST NEVER CANCEL A RUNNING GATE.
#
# The concurrency group is evaluated when a run is CREATED, before any job-level `if:` is
# considered. So with a blanket `cancel-in-progress: true`, adding any unrelated label to a
# promotion PR (`qa:prod`, a triage label) 40 minutes into the `qa` leg creates a new run, cancels
# the in-flight one, and is then skipped by the label guard below — which requires the added label
# to be one of the two `release-gate:*` ones. (That guard was on the `legs` job when this was
# written and is on `gate` since #4466; the mechanism is unchanged.) The SEVEN required
# `Release gate (<leg>)` contexts on
# a promotion PR never report, and the
# PR sits permanently pending with nothing red to explain it, recovering only on a new push or
# `ready_for_review`. The header above anticipated a random label RESTARTING the hour; the guard
# turns that into cancel-and-never-restart, which is worse.
#
# Keying the cancellation on the event action fixes it at the source: a push supersedes its
# predecessor as before, and a label event cannot cancel anything. A label that IS one of the
# `release-gate:*` pair starts a run that simply queues behind any in-flight one.
concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

permissions:
  contents: read

# THE JOB THAT CARRIES THIS WORKFLOW'S MEANING, for scripts/ci/workflow-health.mjs's vacuity check.
#
# It named `Release gate (qa)` until #4466, and that stopped being answerable in the same change.
# Before it, an unlabelled dev PR skipped EVERY job here, so the run concluded `skipped`, so
# `classify()` never counted it and the marker was never consulted (measured: 7 of the last 8 runs).
# Now the `legs` job really runs on those PRs, so the run is DECIDED — and on a green one that
# narrowed to nothing, no `Release gate (qa)` job exists at all. `substantiveVerdict` reads a job
# absent from every sampled run as `misdeclared`, which outranks every other state and prints at the
# top of the report: "the job was probably renamed". It was not. The legs are CONDITIONAL BY DESIGN
# on the dev path, which is a thing no per-run marker can express.
#
# So the marker names the job that runs on every decided run and carries the meaning that is new:
# does a verdict exist for what this PR changed. WHAT THAT GIVES UP, stated: a promotion run where
# `qa` silently stops being selected is no longer caught HERE. It is caught somewhere stronger —
# deploy-console.yml refuses to deploy unless all seven `Release gate (<leg>)` contexts PASSED on the
# promotion PR's head, which is a stricter question than "did the job appear".
env:
  WORKFLOW_HEALTH_SUBSTANTIVE_JOB: "Which legs run, and whether the gate runs at all"

jobs:
  legs:
    name: Which legs run, and whether the gate runs at all
    runs-on: ubuntu-latest
    # The trigger logic lives HERE, once, because `matrix` is not available in a job-level `if:`
    # and six copies of this clause would drift six ways. The gate job `needs` this one, so when
    # this is skipped nothing below runs — and a skipped required context on a DRAFT is harmless:
    # a draft cannot merge, and `ready_for_review` fires the run the moment it is not one.
    #
    # THE BASE-REF/LABEL CONJUNCT USED TO BE PART OF THIS `if:` AND NOW LIVES IN THE PICKER (#4466).
    # It read "base is main or staging, OR the PR carries `release-gate:run`/`release-gate:all`", so
    # an unlabelled dev PR skipped this job — and with it the only place in the repo that holds both
    # the changed-file list and the leg table, i.e. the only place that can ask whether the diff
    # needed a leg. A question cannot be answered by a job that does not run, so the job runs and the
    # `run` output carries the same conjunct, evaluated where the changed files are in hand.
    #
    # THE `labeled` CONJUNCT MOVED TOO — down to the `gate` job, which is what it was always about.
    # It exists so that adding a triage label does not restart an hour of browser legs; it was never
    # about this job, which takes seconds. Leaving it here had a second cost that only appears once
    # this job is a check somebody reads: an unrelated label produced a SKIPPED check-run under this
    # job's name, and a required context whose latest run is `skipped` is not a success. That is the
    # queue wedge `.mergify.yml`'s `Build console images (no push)` note spells out — "a required
    # check that does not always report WEDGES the queue" — and it is the difference between this
    # check being registerable and not. So the rule now reads: this job reports on EVERY non-draft
    # pull_request event; the legs still refuse to restart for a label that is not one of the two.
    #
    # What is NOT relaxed: `draft == false`. And read the label rule together with the `concurrency`
    # note above rather than on its own — a label event cannot CANCEL a running gate either, which is
    # what `cancel-in-progress: ${{ github.event.action != 'labeled' }}` buys.
    #
    # ── REQUIRING THIS CHECK IS AVAILABLE, AND IT IS A COST DECISION, NOT A MECHANISM ONE ────────
    #
    # It is in neither `.mergify.yml` nor `infra/github`, so today it is advisory: a dev PR can be
    # squash-merged with it red. An earlier version of this note said the route was BLOCKED by
    # Mergify's speculative draft. That was wrong about which layer, and the correction matters
    # because "impossible" is an instruction the next reader acts on.
    #
    # THE WEDGE IS REAL FOR THE TWO LAYERS THAT NOTE NAMED, AND ONLY THOSE. `merge_conditions` and
    # `success_conditions` are evaluated against Mergify's TEMPORARY MERGE — a speculative DRAFT
    # authored by `mergify[bot]`, carrying none of the real PR's labels. This job skips a draft, so
    # a `check-success=` there would never be satisfied: the queue stops, the #1653 shape.
    #
    # `queue_conditions` IS A DIFFERENT LAYER and it is the right one. `check-required-checks.mjs`
    # states the distinction, and `.mergify.yml` states it again: `queue_conditions` /
    # `auto_merge_conditions` are evaluated against the REAL pull request and re-evaluated
    # continuously. `-draft` is already one of them, so on the real PR this job RUNS and the context
    # reports `success` or `failure` — never `skipped`. A PR that fails it is EVICTED from the queue
    # rather than held at the head of the train, and an un-queued PR holds no train slot, so it
    # cannot stall anyone else. That is the #1653 shape AVOIDED. The precedent is three lines above
    # where the condition would go: `#review-threads-unresolved = 0` is installed in
    # `queue_conditions` for exactly this reason (#3498, #3444).
    #
    # SO THE ROUTE IS: `- "check-success=Which legs run, and whether the gate runs at all"` in
    # `queue_conditions` and in `auto_merge_conditions` (the enqueue half), plus a `mergify_leads`
    # record in infra/github/required-checks-divergence.json. #4510's precondition — a context must
    # have been observed green once before anything may require it — is met: run 34480011384.
    #
    # ONE ACCOMPANYING EDIT, MEASURED RATHER THAN GUESSED. `parseMergifyCheckBlocks` collects EVERY
    # `*conditions:` block naming a `check-success=` and requires them to name the same set, so
    # adding it to `queue_conditions` alone reds `check-required-checks.mjs` — and worse than one
    # error: `queue_conditions` becomes the canonical list and all eleven other contexts are then
    # reported missing from it. The fix is local and is what that file's own docstring already says
    # semantically — exempt `queue_conditions` from the identity comparison, leaving
    # `merge_conditions` and `success_conditions` as the pair that must agree.
    #
    # WHAT IS ACTUALLY BEING DECIDED, then, is the price in the header: ~3,000 runner-minutes per 80
    # dev merges, against a leg's verdict existing for every PR that changes what it measures. That
    # is the maintainer's call. It is not this file's to assert either way, and it must not assert
    # that the mechanism forbids it.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.draft == false
    # `pull-requests: read` is what `GET /pulls/{n}/files` needs; the workflow-level grant is
    # `contents: read` only. Without it the API call 403s — which selects EVERY leg, loudly, rather
    # than silently narrowing. The `gate` job below keeps the workflow-level grant.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      include: ${{ steps.pick.outputs.include }}
      run: ${{ steps.pick.outputs.run }}
    steps:
      # The tree, for ONE question: which directories the console the gate boots is compiled from.
      # `gateSurfaceDirs()` in the picker walks apps/console's workspace dependencies out of this
      # checkout rather than reading a list typed into this file, so the surface cannot drift from
      # what the build actually consumes. On a `pull_request` this is the MERGE commit, which is the
      # tree the gate would build.
      - uses: actions/checkout@v7
      # The denominator of the path inference below. THIS STEP cannot fail the job: an API error, a
      # revoked scope, GitHub's 3000-file cap — each writes an empty list and a `read=no`, and the
      # question is what the steps below do with it. Both fail SAFE, in the two directions that word
      # means here: `pick` turns it into EVERY leg (a diff it cannot read must not narrow), and the
      # label check turns it into a RED (a diff it cannot read cannot show that no leg was needed).
      # Since #4466 that second one is a job failure on an unlabelled dev PR, cleared by a re-run or
      # the label — which is a change from when this comment said the value only ever became "every
      # leg". A file list this step could not read is not an empty diff.
      - id: changed
        name: List the PR's changed files (unreadable or empty selects every leg)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: /tmp/release-gate-changed-files.txt
        run: |
          set -uo pipefail
          read_ok=yes
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "$CHANGED_FILES"; then
            echo "::warning::could not list the changed files for this PR — every leg will run"
            : > "$CHANGED_FILES"
            read_ok=no
          fi
          count=$(wc -l < "$CHANGED_FILES" | tr -d ' ')
          # GitHub's file list is capped at 3000. At the cap the list is a TRUNCATION, and inferring
          # from a truncated diff is exactly the under-reporting this file refuses.
          if [ "$count" -ge 3000 ]; then
            echo "::warning::the changed-file list hit GitHub's 3000-file cap — every leg will run"
            read_ok=no
          fi
          echo "changed files: $count (readable: $read_ok)"
          cat "$CHANGED_FILES"
          echo "read=$read_ok" >> "$GITHUB_OUTPUT"
      # ── THIS STEP'S `run:` BLOCK HAS A 21,000-BYTE CEILING, AND BREACHING IT IS A LOAD FAILURE ─
      #
      # GitHub renders every `run:` scalar as a template expression before a job starts, and REFUSES
      # THE WHOLE FILE past 21,000: `(Line: 174, Col: 14): Exceeded max expression length 21000`.
      # Measured on run 34460914813, where #4466's first draft put this block at 20,917 characters —
      # UNDER the limit — and 21,119 UTF-8 BYTES, over it. The budget is bytes, so every `—`, `·` and
      # `→` in a comment down there costs three. The file parsed cleanly under `yaml@2.9.0` and
      # actionlint was silent; GitHub rejected it anyway.
      #
      # WHAT A REJECTED FILE LOOKS LIKE, because nothing in the repo will tell you: a run with ZERO
      # jobs, named `.github/workflows/release-gate.yml` instead of `Release gate`, on the `push`
      # event because `on:` was never read — and NOT ONE gate context on the PR. `gh run list
      # --commit <sha>` shows no release-gate run at all. The message is readable only in that run's
      # own UI. A workflow that does not load runs no legs, which is strictly worse than the gap this
      # job exists to close.
      #
      # SO PROSE LIVES UP HERE, IN YAML COMMENTS, NOT DOWN THERE IN THE HEREDOC, and the check that
      # needs its own thousands of bytes is its own step with its own budget. A `#` line here costs
      # nothing; the same sentence a few columns right, inside the script, is spent out of 21,000.
      # THE CURRENT SIZES ARE NOT WRITTEN DOWN HERE, and that is the third correction to this
      # paragraph rather than a gap in it. Two attempts to record them went stale inside the commit
      # that wrote them — the second recorded its PARENT's numbers, while the step it was describing
      # grew 1,473 bytes in that same diff. A number that drifts inside its own commit is not a
      # record. `node scripts/ci/check-workflow-shape.mjs` prints the live figure for every workflow
      # on a GREEN run, and that is where to read it; what belongs here is only what does not move.
      #
      # WHAT DOES NOT MOVE. The ceiling is 21,000 bytes and it binds PER SCALAR, not per file and not
      # per job: this file is over three times the ceiling and loads, and the `legs` job's `run:`
      # bytes exceed it across its steps and load. And the rejected scalar was 21,119 bytes /
      # 20,917 characters — the pair that shows the unit.
      #
      # WHAT IS NOT EVIDENCE IS ADDING THE TWO STEPS TOGETHER. Actions compiles a `run:` scalar as a
      # template only if it CONTAINS an expression, and `require-label` contains none — it is not
      # under the limit by some margin, it is not under the limit at all, so "the two sum to more
      # than the ceiling and load" argues from a scalar the ceiling never touched.
      #
      # THAT RULE IS ALSO THE CHEAPEST FIX, when it applies. The 21,119-byte block that was refused
      # contained exactly one expression — `${{ matrix.project }}`, inside a JavaScript COMMENT
      # explaining a flag in another job. Prose about an expression IS an expression, and that one
      # mention put 21 KB of script under a template compiler. deploy-console.yml has carried an
      # untemplated block OVER the ceiling and deployed production repeatedly — at 21,500 bytes,
      # which is the number that carries the evidence; it is 22,422 today and has not run since,
      # so today's figure proves nothing. The split is kept anyway, because it does not depend on
      # nobody ever writing `${{` into a comment again.
      #
      # ── WHETHER THE GATE RUNS AT ALL, WHICH IS NOW A QUESTION ABOUT THE DIFF (#4466) ──────────
      #
      # A promotion PR, a dispatch and a labelled PR run the legs — the conjunct that used to live in
      # this job's `if:`, unchanged in what it admits. Everything else is a dev PR with no label, and
      # for those the question stops being "did someone remember" and becomes "does this diff change
      # something a leg measures". If it does, the step goes RED and names what and why. Measured
      # cost of not asking: #4333 rewrote the design-project edit buffer unlabelled, the `canvas` leg
      # never ran, its red first appeared on #4434/#4436/#4439 — none of which touch a canvas file —
      # and then blocked the dev→staging promotion #4389 two days later.
      #
      # WHY A RED CHECK AND NOT AN AUTO-ADDED LABEL. A label added with the default GITHUB_TOKEN
      # raises a `labeled` event that CANNOT start a workflow run: "events triggered by the
      # GITHUB_TOKEN will not create a new workflow run, with the following exceptions:
      # workflow_dispatch and repository_dispatch" (GitHub, "Triggering a workflow"), and `labeled`
      # is neither. So auto-labelling is not the weaker option, it is broken in the direction that
      # matters: the PR would carry `release-gate:run`, this workflow would not re-fire, and the gate
      # would still never run — now wearing a label that reads as the fix. A PAT or App token does
      # retrigger, at the price of a stored credential that can write to any PR, to save one click.
      # The red check also spends ZERO gate minutes until a human decides to spend them. There is
      # deliberately no `release-gate:skip` escape label: a guard whose cheapest escape route is a
      # second label is a guard nobody ever pays.
      #
      # WHERE THE ANSWER IS ASSEMBLED. SEAMS and RULES answer first, here, in the step that owns
      # them — one mapping, two questions, so "which legs" and "whether any" cannot drift apart. What
      # this step CANNOT answer is which directories the console is compiled from; that is derived
      # from the tree in the `require-label` step below, which is also where the failure is raised.
      #
      # STATED OMISSIONS, because an unstated one reads as coverage. `pnpm-lock.yaml` and the root
      # config are NOT on the surface, though a dependency bump can certainly break a flow — every
      # lockfile PR would otherwise demand an hour of gate for a change no leg has ever caught. Nor
      # are the devDependencies of a surface package: `@repo/eslint-config` and
      # `@repo/typescript-config` reach the console only through those, and tooling does not change
      # what the browser renders. Both are deliberate under-reports; each is one line to change, in
      # the walk below. What is NOT omitted any more — it was, and the audit of #4466 caught it —
      # are `scripts/lib/console-routes.mjs` and `scripts/ci/playwright-install.sh`: neither is
      # reachable from apps/console's dependency graph and both are read by legs, so they are SEAMS.
      - id: pick
        name: Pick the legs for this event
        env:
          LEGS: ${{ inputs.legs }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CHANGED_READ: ${{ steps.changed.outputs.read }}
          CHANGED_FILES: /tmp/release-gate-changed-files.txt
        run: |
          node - <<'EOF'
          // THE LEG TABLE. One row per Playwright project the gate drives; `capabilities` is the
          // promise the leg makes (apps/console/e2e/helpers/capabilities.ts) and `floor` is the
          // fewest tests `--list` may report before the leg is called testMatch drift, not a suite.
          // `args` is the LITERAL `--project=<name>` flag, spelled out per row on purpose:
          // playwright.config.ts's dead-zone guard (#2875) reads every workflow for exactly that
          // string to prove a project runs somewhere, and `--project=${{ matrix.project }}` is a
          // template it cannot see through. The emitter stays literal so the guard stays honest.
          //
          // `capabilities` IS A COMMA-SEPARATED SET, and the `env:` block below reads it with
          // `contains(...)`, never `==`. Until #4456 every row held at most one name and the block
          // compared the whole set against one name with `==`, so the first row to promise two things
          // would have matched NOTHING and blanked all SIX Stripe variables — a leg that then
          // fails its own `--assert-env` pre-check, or (had that check not existed) runs every
          // billing assertion against an unconfigured console. See the env block for the six sites.
          const legs = [
            { project: "hero",      args: "--project=hero",      workers: 1, retries: 1, capabilities: "",                   manifest: false, floor: 1 },
            { project: "elench-ai", args: "--project=elench-ai", workers: 1, retries: 1, capabilities: "ai-mock",            manifest: false, floor: 1 },
            { project: "console",   args: "--project=console",   workers: 2, retries: 1, capabilities: "stripe,encryption",  manifest: false, floor: 1 },
            { project: "canvas",    args: "--project=canvas",    workers: 1, retries: 1, capabilities: "",                   manifest: false, floor: 1 },
            // `qa` promises `encryption` (#4456), which is what makes every secret-bearing surface
            // in flows/ reachable at all. It cost the rewrite of the two tests in
            // flows/alerts.negative.spec.ts that asserted the fail-closed no-key UI — and note that
            // only ONE of them went red. The other, "an Email channel is still offered, because it
            // stores no secret", stayed GREEN and stopped discriminating, because its whole meaning
            // was the contrast with its sibling. Renaming both moved two entries in
            // apps/console/e2e/gate-baseline.json (ratchet rule 4); their statuses did not.
            { project: "qa",        args: "--project=qa",        workers: 3, retries: 1, capabilities: "stripe,encryption",  manifest: false, floor: 300 },
            { project: "audit",     args: "--project=audit",     workers: 1, retries: 1, capabilities: "",                   manifest: true,  floor: 1 },
            { project: "audit-interaction", args: "--project=audit-interaction", workers: 1, retries: 0, capabilities: "stripe,encryption", manifest: true, floor: 47 },
          ];
          const ALL = legs.map((l) => l.project);

          // ── WHAT MAY NARROW, AND WHAT MAY NOT ─────────────────────────────────────────────────
          //
          // A labelled dev PR used to run all seven legs: ~76 runner-minutes a push (measured, run
          // 34351806933), most of it seven copies of the same `next build`, for a lane whose whole
          // diff is one spec file. CI capacity is this wave's binding constraint, so a dev PR may
          // narrow. Three things never do, and the order below is the order they are asked in:
          //
          //   1. A PR into main or staging runs EVERY leg. That is the gate; a promotion must not
          //      choose what measures it. `release-gate:all` is the same answer asked for by hand.
          //   2. A diff touching a SEAM runs every leg — a file any leg reads, where a change can
          //      move any of them, so inferring from its path is the under-reporting this repo
          //      keeps paying for.
          //   3. A path matching NO rule runs every leg. "nothing matched" and "nothing needs
          //      running" are the same input, and making them the same output is the vacuous-green
          //      shape the gate exists to refuse. So does a file list this job could not read, and
          //      so does a diff of zero files.
          //
          // The consequence, stated plainly because it is the honest bound: inference narrows ONLY
          // for a diff made ENTIRELY of leg-specific files under apps/console/e2e/. A console
          // source change selects everything, because it can break anything.

          // A file any leg reads. The first six are the list #4440 names; `global-setup.ts` and
          // `reporters/` are added with the same argument — Playwright has no per-project
          // globalSetup so that file runs for every invocation, and every leg's `--reporter=`
          // flag below names `./e2e/reporters/qa-reporter.ts`.
          //
          // IT USED TO BE TRUE that deleting this list changed no answer — rule 3 (unmatched runs
          // everything) already covered every path in it, and it was kept only against the day
          // someone widens a rule to a directory. #4466 gave it a SECOND reader and that is no
          // longer true: the label check below asks whether a path is worth a leg, and a seam is
          // the ONLY way a path outside apps/console and its packages can say yes. Deleting a line
          // here now turns a red PR green.
          //
          // The last two are that second reader's, and they are not under apps/console at all.
          // `console-routes.mjs` is the audit legs' DENOMINATOR — e2e/audit/manifest.ts calls it
          // "the ONE definition of the console's private route set", and the gate job runs it as
          // its own zero-routes guard — so narrowing that glob makes both audit legs measure fewer
          // routes with no leg having run. `playwright-install.sh` installs the browser every leg
          // drives. `sync-public-assets.mjs` is the FIRST command in `apps/console`'s `build` script:
          // it copies @repo/assets/static into apps/console/public, whose synced paths are gitignored,
          // so the package is the only source and that script is the only installer. Change where it
          // writes and every provider icon the browser legs render is simply absent. None of the
          // three is reachable from a surface derived out of apps/console's dependencies, which is
          // why each has to be named here.
          const SEAMS = [
            /^apps\/console\/playwright\.config\.ts$/,
            /^apps\/console\/e2e\/helpers\//,
            /^apps\/console\/e2e\/fixtures\//,
            /^apps\/console\/e2e\/gate-baseline\.json$/,
            /^apps\/console\/e2e\/global-setup\.ts$/,
            /^apps\/console\/e2e\/reporters\//,
            /^scripts\/e2e-ratchet\.mjs$/,
            /^\.github\/workflows\/release-gate\.yml$/,
            /^scripts\/lib\/console-routes\.mjs$/,
            /^scripts\/ci\/playwright-install\.sh$/,
            /^scripts\/sync-public-assets\.mjs$/,
          ];

          // FIRST MATCH WINS, so the order is load-bearing. Each `when` mirrors a project's
          // `testMatch` in apps/console/playwright.config.ts rather than restating a belief about
          // it — that file is where these regexes come from and where they must be kept true.
          const RULES = [
            { when: /^apps\/console\/e2e\/flows\//, legs: ["qa"], why: "e2e/flows/** is the qa project's testMatch" },
            { when: /^apps\/console\/e2e\/audit\/destructive\.spec\.ts$/, legs: ["audit-interaction"], why: "the audit-interaction project's whole testMatch" },
            { when: /^apps\/console\/e2e\/audit\/[^/]*\.spec\.ts$/, legs: ["audit"], why: "an audit spec (destructive.spec.ts is testIgnored out of this project)" },
            // NOT "other e2e/audit/** -> audit". destructive.spec.ts imports ./context and
            // ./manifest, so a shared audit module moves BOTH audit legs; sending it to `audit`
            // alone would be a silent under-selection.
            { when: /^apps\/console\/e2e\/audit\//, legs: ["audit", "audit-interaction"], why: "a shared audit module — both audit legs import from this directory" },
            { when: /^apps\/console\/e2e\/hero-happy-path\.spec\.ts$/, legs: ["hero"], why: "the hero project's whole testMatch" },
            { when: /^apps\/console\/e2e\/elench-(ai|ux)\.spec\.ts$/, legs: ["elench-ai"], why: "the elench-ai project's testMatch" },
            { when: /^apps\/console\/e2e\/architecture-canvas\.spec\.ts$/, legs: ["canvas"], why: "the canvas project's whole testMatch" },
            { when: /^apps\/console\/e2e\/(account-settings|activity|billing|connectors|elench-agent|evidence|usage)\.spec\.ts$/, legs: ["console"], why: "the console project's testMatch" },
          ];

          const fs = require("node:fs");
          const env = process.env;

          // The two label names that ask for the gate by hand, and the labels this PR actually
          // carries — parsed ONCE, because two questions read them: `decide()` asks WHICH legs run,
          // and the check in the next step asks WHETHER any of them run at all.
          //
          // LOWER-CASED, because the job-level `if:` above asks the same question with `contains()`,
          // and `contains()` IS CASE-INSENSITIVE while `Array.prototype.includes` is not. Both real
          // labels are lower-case, so this changes no answer today; what it removes is the state
          // where a `Release-Gate:Run` starts this job (the `if:` says yes) and then fails it (the
          // picker said no) — two halves of one conjunct disagreeing about the same PR.
          const RUN_LABELS = ["release-gate:run", "release-gate:all"];
          const prLabels = (() => { try { return JSON.parse(env.PR_LABELS || "[]") || []; } catch { return []; } })().map((l) => String(l).toLowerCase());

          /** Write one `key=value` job output. */
          const emit = (key, value) => { if (env.GITHUB_OUTPUT) fs.appendFileSync(env.GITHUB_OUTPUT, `${key}=${value}\n`); };

          /** Publish one markdown block to the step summary AND the log, so a red job explains itself in both. */
          const summarise = (md) => {
            if (env.GITHUB_STEP_SUMMARY) fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `${md.join("\n")}\n`);
            console.log(md.join("\n"));
          };

          /** The PR's changed paths, or null when the list could not be read or was truncated. */
          function changedPaths() {
            if (env.CHANGED_READ !== "yes") return null;
            try {
              const files = fs.readFileSync(env.CHANGED_FILES, "utf8").split("\n").map((s) => s.trim()).filter(Boolean);
              return files.length > 0 ? files : null;
            } catch { return null; }
          }

          /** Decide which legs run, and the one sentence that says why. Rows are per-path detail. */
          function decide() {
            if (env.EVENT_NAME === "workflow_dispatch") {
              const want = (env.LEGS || "").split(",").map((s) => s.trim()).filter(Boolean);
              for (const w of want) {
                if (!ALL.includes(w)) {
                  console.error(`::error::unknown leg "${w}" (known: ${ALL.join(", ")})`);
                  process.exit(1);
                }
              }
              return want.length
                ? { legs: want, rule: `workflow_dispatch named \`${want.join(", ")}\`` }
                : { legs: ALL, rule: "workflow_dispatch with an empty `legs` input — every leg" };
            }

            const base = env.BASE_REF || "";
            if (base === "main" || base === "staging") {
              return { legs: ALL, rule: `a PR into \`${base}\` — the promotion path runs every leg; a promotion must not choose what measures it` };
            }

            if (prLabels.includes("release-gate:all")) {
              return { legs: ALL, rule: "`release-gate:all` is on the PR — the manual override, every leg" };
            }

            if (env.CHANGED_READ !== "yes") {
              return { legs: ALL, rule: "the changed-file list could not be read (or was truncated) — every leg. A list this job cannot read is not an empty diff." };
            }
            let changed = [];
            try {
              changed = fs.readFileSync(env.CHANGED_FILES, "utf8").split("\n").map((s) => s.trim()).filter(Boolean);
            } catch {
              return { legs: ALL, rule: "the changed-file list is missing — every leg" };
            }
            if (changed.length === 0) {
              return { legs: ALL, rule: "the PR reported ZERO changed files — every leg. Zero is a number this job does not believe." };
            }

            const seamHits = changed.filter((f) => SEAMS.some((re) => re.test(f)));
            if (seamHits.length > 0) {
              return { legs: ALL, rule: `a shared seam changed (${seamHits.join(", ")}) — a seam can move any leg, so every leg runs` };
            }

            const rows = [];
            const selected = new Set();
            const unmatched = [];
            for (const f of changed) {
              const rule = RULES.find((r) => r.when.test(f));
              if (rule === undefined) {
                unmatched.push(f);
                rows.push({ file: f, legs: "every leg", why: "no rule matches this path" });
                continue;
              }
              for (const l of rule.legs) selected.add(l);
              rows.push({ file: f, legs: rule.legs.join(", "), why: rule.why });
            }
            if (unmatched.length > 0) {
              return { legs: ALL, rule: `${unmatched.length} changed path(s) match no rule — every leg runs, never none`, rows };
            }
            if (selected.size === 0) {
              return { legs: ALL, rule: "the rules selected nothing at all — every leg runs, never none", rows };
            }
            return { legs: ALL.filter((p) => selected.has(p)), rule: "inferred from the changed paths", rows };
          }

          const decision = decide();
          const chosen = legs.filter((l) => decision.legs.includes(l.project));
          if (chosen.length === 0) { console.error("::error::no legs selected"); process.exit(1); }
          emit("include", JSON.stringify(chosen));
          console.log(`legs: ${chosen.map((l) => l.project).join(", ")}`);
          console.log(`why: ${decision.rule}`);

          // WHETHER THE GATE RUNS AT ALL (#4466). The reasons live in the YAML comments above this
          // step, where prose costs the expression budget nothing; the CHECK lives in the next step,
          // which owns everything this one cannot answer. What crosses between them is one thing:
          // what SEAMS and RULES — the tables THIS step owns — say about each changed path. That is
          // what keeps the mapping in one place and the two answers from drifting apart.
          const promotion = env.BASE_REF === "main" || env.BASE_REF === "staging";
          const asked = RUN_LABELS.some((l) => prLabels.includes(l));
          const gateRuns = env.EVENT_NAME === "workflow_dispatch" || promotion || asked;
          emit("run", gateRuns ? "yes" : "no");
          if (!gateRuns) {
            const implied = [];
            for (const f of changedPaths() ?? []) {
              if (SEAMS.some((re) => re.test(f))) { implied.push({ f, l: "every leg", w: "a shared seam — this file IS the gate's instrument" }); continue; }
              const rule = RULES.find((r) => r.when.test(f));
              if (rule !== undefined) implied.push({ f, l: rule.legs.join(", "), w: rule.why });
            }
            emit("implied", JSON.stringify(implied));
            emit("would", `${chosen.map((l) => l.project).join(", ")} — ${decision.rule}`);
          }

          // A LEG THAT SILENTLY DOES NOT RUN READS AS A LEG THAT PASSED. So the selection is
          // published where the run is read, with the skipped legs named and the rule that decided.
          const ran = chosen.map((l) => l.project);
          const skipped = ALL.filter((p) => !ran.includes(p));
          const md = [
            "## Release gate — which legs run",
            "",
            `**Rule:** ${decision.rule}`,
            "",
            `**Running (${ran.length}/${ALL.length}):** ${ran.map((p) => `\`${p}\``).join(", ")}`,
            "",
            `**Skipped (${skipped.length}):** ${skipped.length ? skipped.map((p) => `\`${p}\``).join(", ") : "none"}`,
          ];
          if (decision.rows && decision.rows.length > 0) {
            md.push("", "| changed path | selects | because |", "| --- | --- | --- |");
            for (const r of decision.rows) md.push(`| \`${r.file}\` | ${r.legs} | ${r.why} |`);
          }
          if (skipped.length > 0) {
            md.push("", "A skipped leg reports no `Release gate (<leg>)` context. `infra/github/main.tf` declares those contexts required on `main` alone — it filters them out of `protect-dev` and `protect-staging`, and `.mergify.yml` names none of them — and a promotion PR never reaches this branch of the rules. (What GitHub enforces is `check-required-checks.mjs --live`'s question, not this one; the narrowing is sound under either answer.)");
          }
          summarise(md);
          EOF
      # ── THE CHECK ITSELF: a leg's verdict must exist for every PR that changes what it measures ─
      #
      # A SEPARATE STEP, and the separation is not tidiness. Its own `run:` block is its own
      # 21,000-BYTE expression budget (see the ceiling note above `pick`) — the two halves were one
      # step in the first draft of #4466 and GitHub refused to load the file at 21,119 bytes. It also
      # keeps the mapping in ONE place: this step never sees SEAMS or RULES. `pick` hands it the leg
      # attribution for the paths those tables matched, and this step adds only the half `pick` has
      # no business knowing — which directories the console is BUILT from — and then formats and
      # fails.
      #
      # WHAT COUNTS AS THE GATE'S SURFACE IS DERIVED, NOT TYPED: `apps/console` plus every workspace
      # package it depends on, transitively, walked out of the checkout. Add a `@repo/*` dependency
      # to the console and the surface grows with no edit here.
      #
      # AND EVERY STEP OF THAT WALK FAILS CLOSED, because the first draft failed OPEN at four of
      # them and each one was silent. Measured, by mutating a copy of the tree and re-running this
      # step: quoting the workspace globs with `'` instead of `"` cut the surface from 14 dirs to 1;
      # a trailing `# optional` on the `- "ee"` line dropped the enterprise package; a malformed
      # `packages/ui/package.json` dropped @repo/ui. All three turned a PR that touches those very
      # directories GREEN, with no warning. A surface derived from a tree this step half-read is not
      # a smaller surface, it is a broken instrument, and the one thing it must never do is report
      # "nothing the gate measures changed".
      #
      # ONE RECORDED EXEMPTION, and it is a decision rather than an oversight. `release-gate.yml` is
      # a SEAM — a change to it can move any leg — but it is exempt from DEMANDING the label, because
      # the seven legs cannot see a YAML change at all: they boot the console, and the console is
      # byte-identical either side of an edit to this file. What DOES read the edited file is CI
      # itself, and two things there are stronger than a leg would be: GitHub's own load of the file
      # on the push (which is what caught the 21,119-byte rejection — not this job, which does not
      # even run on a draft), and `check-workflow-shape.mjs`, which now measures the budget that
      # rejection came from. The leg table's half is checked independently by
      # `scripts/ci/check-required-checks.mjs` and by deploy-console.yml's promotion receipt. The
      # bound, stated: an edit to the `gate` job's STEPS is not measured by the PR's own run, and
      # this exemption does not pretend otherwise — it buys back ~76 runner-minutes on every edit of
      # the file this wave edits most often, at that cost. The exemption is only from the demand;
      # the file stays a SEAM, so a labelled PR that touches it still runs every leg.
      - id: require-label
        name: A leg's verdict must exist for every PR that changes what it measures
        env:
          GATE_RUNS: ${{ steps.pick.outputs.run }}
          IMPLIED: ${{ steps.pick.outputs.implied }}
          WOULD_RUN: ${{ steps.pick.outputs.would }}
          CHANGED_READ: ${{ steps.changed.outputs.read }}
          CHANGED_FILES: /tmp/release-gate-changed-files.txt
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const env = process.env;

          /** Publish one markdown block to the step summary AND the log — a red job explains itself in both. */
          const summarise = (md) => {
            if (env.GITHUB_STEP_SUMMARY) fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `${md.join("\n")}\n`);
            console.log(md.join("\n"));
          };

          if (env.GATE_RUNS === "yes") {
            console.log("the gate runs on this PR — a dispatch, a promotion, or the label. Nothing to demand.");
            process.exit(0);
          }

          /**
           * The directories the console is COMPILED FROM, derived by scripts/ci/check-console-surface.mjs.
           *
           * NOT INLINE ANY MORE (#4606, found in review). The walk used to live here, and the LEDGER
           * that asks "is every scoped package either on this surface or recorded as not" lived with
           * it — which put a repo invariant inside a per-PR gate. This step returns early whenever
           * the gate RUNS, so the labelled PR that lands a new `@repo/foo` never evaluated the
           * ledger, while every unlabelled dev PR afterwards failed for a diff its author never
           * wrote. The ledger now runs in `Authz / open-core guards` on every PR, and this reads
           * `--json`, which derives the surface and refuses a broken DERIVATION but never a stale
           * record — a bookkeeping entry must not be able to fail this job.
           */
          function surfaceDirs() {
            const { execFileSync } = require("node:child_process");
            try {
              // stderr is inherited so the script's own `::error::` lines reach the log unchanged.
              return JSON.parse(execFileSync("node", ["scripts/ci/check-console-surface.mjs", "--json"], { encoding: "utf8", stdio: ["ignore", "pipe", "inherit"] }));
            } catch {
              console.error("::error::scripts/ci/check-console-surface.mjs could not derive the console's surface (its own error is above). This step must not answer \"nothing the gate measures changed\" from a surface it cannot vouch for — that would pass exactly the PR it exists to stop.");
              process.exit(1);
            }
          }

          // The recorded exemption. See the YAML comment above this step for the decision and its cost.
          const EXEMPT = [{ path: ".github/workflows/release-gate.yml", why: "no leg can see a YAML change — a leg boots a console that is byte-identical either side of an edit to this file, and CI reads the edited file in two stronger ways (see the comment above this step)" }];

          const surface = surfaceDirs();
          let changed = null;
          if (env.CHANGED_READ === "yes") {
            try {
              const files = fs.readFileSync(env.CHANGED_FILES, "utf8").split("\n").map((s) => s.trim()).filter(Boolean);
              changed = files.length > 0 ? files : null;
            } catch { changed = null; }
          }
          if (changed === null) {
            console.error("::error::this dev PR carries neither `release-gate:run` nor `release-gate:all`, and the changed-file list could not be read — an API failure, GitHub's 3000-file cap, or a diff of zero files. So this step cannot show that no leg was needed, and a list it could not read is not an empty diff. Re-run this job, or label the PR and let the gate measure it.");
            summarise(["## Release gate — cannot tell whether a leg is needed", "", "The changed-file list could not be read (see the `List the PR's changed files` step), so the question this job exists to answer has no answer for this PR. Re-run it, or add `release-gate:run`."]);
            process.exit(1);
          }

          const implied = new Map((JSON.parse(env.IMPLIED || "[]") || []).map((r) => [r.f, r]));
          const rows = [];
          const exempted = [];
          for (const f of changed) {
            const off = EXEMPT.find((e) => e.path === f);
            if (off !== undefined) { exempted.push(off); continue; }
            const hit = implied.get(f);
            if (hit !== undefined) { rows.push({ file: f, legs: hit.l, why: hit.w }); continue; }
            const dir = surface.find((d) => f.startsWith(`${d}/`));
            if (dir !== undefined) rows.push({ file: f, legs: "every leg", why: `\`${dir}/\` is compiled into the console every leg boots, and no rule narrows a source path` });
          }

          if (rows.length === 0) {
            summarise([
              "## Release gate — not running, and nothing it measures changed",
              "",
              `None of the ${changed.length} changed path(s) is a gate seam, a leg's spec, or under one of the ${surface.length} directories the console is built from (\`${surface.join("`, `")}\`), and this PR carries neither \`release-gate:run\` nor \`release-gate:all\`. No leg's verdict is missing.`,
              ...(exempted.length > 0 ? ["", `${exempted.length} path(s) matched the recorded exemption: ${exempted.map((e) => e.why).join("; ")}.`] : []),
            ]);
            console.log(`no leg's verdict is missing: none of the ${changed.length} changed path(s) is on the gate's surface`);
            process.exit(0);
          }

          // A BOOLEAN ABOUT A STRUCTURE MUST PRINT THE STRUCTURE: every path, the legs it implies
          // and the rule that says so — as annotations in the log AND as a table in the summary.
          const SHOWN = 25;
          console.error(`::error::${rows.length} of this PR's ${changed.length} changed path(s) are on the release gate's surface, and it carries neither \`release-gate:run\` nor \`release-gate:all\` — so NOT ONE leg runs on the change that needs it. A leg's verdict should exist for every PR that changes what it measures.`);
          for (const r of rows.slice(0, SHOWN)) console.error(`::error file=${r.file}::${r.file} → ${r.legs} (${r.why})`);
          if (rows.length > SHOWN) console.error(`::error::…and ${rows.length - SHOWN} further path(s) on the surface, listed in the job summary.`);
          console.error(`::error::Add \`release-gate:run\` to this PR and it runs: ${env.WOULD_RUN}. \`release-gate:all\` runs every leg.`);
          summarise([
            "## Release gate — a leg would never run on what this PR changes",
            "",
            `**${rows.length} of ${changed.length} changed path(s)** are on the gate's surface, and this PR carries neither \`release-gate:run\` nor \`release-gate:all\`.`,
            "",
            `**Add \`release-gate:run\`** and the gate runs: ${env.WOULD_RUN}. \`release-gate:all\` runs every leg.`,
            "",
            "| changed path | would be measured by | because |",
            "| --- | --- | --- |",
            ...rows.map((r) => `| \`${r.file}\` | ${r.legs} | ${r.why} |`),
            "",
            `The surface is derived from the tree, not typed into the workflow: \`${surface.join("`, `")}\` — \`apps/console\` and every workspace package it depends on — plus the gate's own seams and each leg's specs.`,
          ]);
          process.exit(1);
          EOF

  gate:
    name: Release gate (${{ matrix.project }})
    needs: [legs]
    # BOTH halves of the conjunct that left the `legs` job's `if:` (#4466). `legs` now runs on every
    # non-draft PR so it can ask whether a leg was needed, and reports either way; only this line
    # decides whether the runner-hours are spent.
    #
    #   · `run` is `yes` for a dispatch, a promotion PR and a labelled PR — the exact set the old
    #     job-level clause admitted, and the `legs` job FAILS rather than saying `no` when a dev PR
    #     changes what a leg measures without asking for one.
    #   · the `labeled` clause is the one that was always about THIS job: `labeled` fires for ANY
    #     label, and a `qa:prod` or a triage label added to a promotion PR must not restart an hour
    #     of browser legs. It is not a second copy — it left the `legs` job when it moved here.
    #
    # A SKIP HERE IS NON-REPORTING, AND deploy-console.yml's RECEIPT DEPENDS ON THAT. The receipt
    # keeps the LATEST check-run per context name and refuses the production deploy unless all seven
    # are `success`. So if a skipped `gate` reported seven `Release gate (<leg>)` check-runs, an
    # innocuous label added to an already-green promotion PR would overwrite seven successes with
    # seven skips and take production off the air.
    #
    # It does not, and this was measured on three heads rather than reasoned about, because moving
    # the clause up here changed WHICH job is skipped and that is exactly the kind of change whose
    # consequence nobody models. GitHub evaluates a job's `if:` BEFORE expanding its matrix, so a
    # false `if:` yields ONE check-run under the literal, unexpanded name:
    #
    #   · #4572 head 563a6d9c, BEFORE this moved (`legs` itself skipped):
    #       `Release gate (${{ matrix.project }})` — skipped. The seven never report.
    #   · this branch, AFTER it moved, run 34480011384 (`legs` SUCCEEDED, `include` carried all
    #     seven, `if:` false): identical — `Release gate (${{ matrix.project }})`, skipped.
    #   · run 34351806933, where the gate actually ran: seven expanded names, six green.
    #
    # The matrix expands only when the job runs. Both before and after, a label leaves the seven
    # contexts untouched and the receipt reads the successes that are already there.
    if: >-
      needs.legs.outputs.run == 'yes'
      && (github.event.action != 'labeled'
          || contains(fromJSON('["release-gate:run","release-gate:all"]'), github.event.label.name))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.include) }}
    # Same hermetic recipe as ci.yml's e2e-browser job: a real Postgres, a production console booted
    # by the Playwright `webServer`, email-OTP with the code scraped from the teed log. OpenFGA is
    # left unset so the community PostgresRbacPDP is the authz engine.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      BETTER_AUTH_SECRET: release-gate-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # `next start` is production mode with no trusted ingress proxy in front of it, so every
      # request lands in ONE shared rate-limit bucket. apps/console/lib/config/auth.ts documents
      # this escape hatch; it is also what let the `console` and `qa` projects into CI at all — the
      # 5-OTP/60s cap was the recorded reason they could not be gating.
      ALETHIA_AUTH_RATE_LIMIT: "0"
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      DEV_CONSOLE_LOG: /tmp/alethia-release-gate-${{ matrix.project }}.log
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      # THE PROMISE. A spec tagged `@needs:<capability>` on a leg that does not promise it is red,
      # never a skip; a promise whose variables are absent fails the pre-check step in seconds.
      #
      # ⚠ EVERY TEST BELOW IS `contains(matrix.capabilities, …)`, NEVER `== '…'`. `capabilities` is
      # a comma-separated SET, and `==` asks whether the set has exactly one member with that name:
      # the moment a leg promises two things (`stripe,encryption`, #4456) every `== 'stripe'` goes
      # false and hands the leg an EMPTY Stripe key, an empty webhook secret, four empty price ids
      # and an empty publishable key — seven of them, one per line below. Count them against the
      # sentence: an off-by-one here reads as "the list is complete" and is how one stays behind.
      # `--assert-env` catches that as a named failure — but the shape it would otherwise
      # produce, billing assertions running green against an unconfigured console, is the exact
      # silent downgrade helpers/capabilities.ts exists to end.
      #
      # `contains` is a SUBSTRING test, so it is only equivalent to set membership while no
      # capability name is a substring of another. That is not left to a comment:
      # `capabilities.ts --assert-env` refuses the whole set when it stops holding, and that check
      # runs on every leg, below, before the build.
      ALETHIA_E2E_CAPABILITIES: ${{ matrix.capabilities }}
      ALETHIA_AI_MOCK: ${{ contains(matrix.capabilities, 'ai-mock') && '1' || '' }}
      ALETHIA_QA_E2E: ${{ matrix.project == 'qa' && '1' || '' }}
      # The credential-encryption key, only where promised (#4456). Without it
      # `isCredEncryptionConfigured()` is false and EVERY secret-bearing surface is inert: the
      # add-channel sheet renders its "needs an encryption key" note and disables submit, and no
      # connector credential can be stored. The gate could therefore exercise none of it.
      #
      # A FIXED NON-SECRET, not a repository secret, and the same literal `e2e-nightly.yml` already
      # uses: base64 for the ASCII `alethia-e2e-cli-demo-throwaway!!`, exactly 32 bytes, which is
      # what lib/crypto/secrets.ts accepts. The console it unlocks lives for one job against a
      # throwaway database, nothing it encrypts outlives the run, and the key is fixed rather than
      # generated so a failed decrypt stays reproducible. It must never be reused anywhere real.
      # `.gitleaks.toml` allowlists this blob anchored to this variable name.
      ALETHIA_CRED_ENCRYPTION_KEY: ${{ contains(matrix.capabilities, 'encryption') && 'YWxldGhpYS1lMmUtY2xpLWRlbW8tdGhyb3dhd2F5ISE=' || '' }}
      # Stripe TEST mode, only where promised. `NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY` is inlined at
      # BUILD time (apps/console/lib/billing/config.ts), which is why it is job-level env and not a
      # run-step env. The webhook secret is any test-mode `whsec_`: nothing reaches CI, and the
      # card-less trial syncs deterministically without one. NEVER `ALETHIA_DEPLOYMENT_MODE=hosted`
      # here — packages/email then refuses the OTP log fallback and nothing can sign in.
      STRIPE_SECRET_KEY: ${{ contains(matrix.capabilities, 'stripe') && secrets.STRIPE_TEST_SECRET_KEY || '' }}
      STRIPE_WEBHOOK_SECRET: ${{ contains(matrix.capabilities, 'stripe') && secrets.STRIPE_TEST_WEBHOOK_SECRET || '' }}
      STRIPE_PRICE_TEAM: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_TEAM || '' }}
      # The runner-minutes METER price (#4276). `lib/billing/config.ts` reads it as
      # `meterPrices.team`; without it the metered half of a Pro subscription is unset, so any
      # usage or overage surface a spec drives measures a console that has no meter — a green
      # assertion about a product that is not configured.
      #
      # IT IS NOT A DISPLAY SETTING, which is what an earlier revision of this comment claimed
      # while deliberately keeping it out of `REQUIRED_ENV.stripe` (#4631). `planCreateItems`
      # (app/server/actions/billing.ts) reads it on the CREATION path and pushes the meter as a
      # SECOND subscription item, so setting it changes what every Stripe leg's subscription is
      # made of — starting with the one `global-setup` builds through `startProTrial`, before a
      # single test runs. So it is REQUIRED for the `stripe` promise, and `--assert-env` names it
      # at the top of the job: a leg that promises `stripe` with this half unset builds a
      # one-item subscription and measures a persona this suite does not describe.
      STRIPE_PRICE_METER_TEAM: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_METER_TEAM || '' }}
      STRIPE_PRICE_AI_PLUS: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_AI_PLUS || '' }}
      STRIPE_PRICE_AI_MAX: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_AI_MAX || '' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PUBLISHABLE_KEY || '' }}
    steps:
      # `id:` so the two `!cancelled()` steps at the bottom can ask whether there is a WORKSPACE:
      # the `services:` block starts before this checkout, and a failed image pull skips everything
      # here while `cancelled()` stays false (#4084).
      - id: checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Next's OWN incremental compiler cache, not turbo's. `pnpm -C apps/console run build` calls
      # the package script directly — turbo's `build.dependsOn` never fires — so a turbo cache step
      # here would restore nothing the build reads (ci.yml carries that inert step; this file does
      # not repeat it).
      - name: Cache Next's incremental compiler output
        uses: actions/cache@v6
        with:
          path: apps/console/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      # BEFORE the build: an unset repository secret is a named failure at the top of the job,
      # not a downgraded run at the bottom.
      - name: Guard — every promised capability has its variables (seconds, before a single build)
        run: pnpm -C apps/console exec tsx e2e/helpers/capabilities.ts --assert-env
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # Build @alethia/ee FIRST, and prove its dist exists. Without it lib/auth/scope.ts falls back
      # to `{ userId, orgId: userId }` and every org-scoped assertion goes vacuous — the failure
      # ci.yml's e2e-browser job records. The community `pnpm -F @alethia/ee` selector is the one
      # deliberate `-F <pkg> <script>`; the guard step is what makes it safe.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the leg silently runs community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community"
            echo "::error::scope (actor.orgId === userId), which makes org-scoped assertions vacuous."
            exit 1
          }
      - name: Build the console (the production image the browser drives)
        run: pnpm -C apps/console run build
      - name: Install Playwright (Chromium + OS deps)
        run: bash scripts/ci/playwright-install.sh
      # The audit's denominator. The manifest RAISES on zero routes rather than returning [], and
      # this proves it still does before the leg spends an hour on it.
      - name: Guard — the route manifest still resolves (audit legs)
        if: ${{ matrix.manifest }}
        run: node scripts/lib/console-routes.mjs --summary
      # A vacuous green is the failure this repo names most often. A testMatch that drifted to
      # zero tests exits 0; a `qa` leg listing 40 tests is not a smaller suite, it is the wrong one.
      - name: Guard — the leg lists at least its floor of tests
        run: |
          list=$(pnpm -F console exec playwright test ${{ matrix.args }} --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          total=$(echo "$list" | sed -nE 's/.*Total: ([0-9]+) test.*/\1/p' | tail -1)
          if [ -z "$total" ] || [ "$total" -lt ${{ matrix.floor }} ]; then
            echo "::error::--project=${{ matrix.project }} listed ${total:-0} test(s), below the floor of ${{ matrix.floor }} (testMatch drift?)"
            exit 1
          fi
      # `continue-on-error` IS THE GREEN-BY-RATCHET MECHANISM, not a softened check.
      #
      # Playwright exits non-zero whenever ANY test fails, and the whole premise of this gate is
      # that a leg is allowed to be red while it is repaired — the baseline records 94 failures
      # across four legs (console 8, canvas 5, qa 80, audit 1; 429 recorded passes beside them).
      # Without this, those four can never conclude `success` no matter what
      # the ratchet says, so the gate could never be required and the ledger below would gate
      # nothing. Measured: on run 34247389000 the `console` leg's Ratchet step SUCCEEDED
      # ("no regression against the baseline") and the job was red anyway, on this step. The two
      # legs that passed, `hero` and `elench-ai`, are exactly the two with zero recorded failures.
      #
      # It is safe because the ratchet below is not a summariser — it FAILS on every way this
      # step can die. No `results.json` (a webServer that never booted, a config throw) is an
      # unreadable file and exits 1; a report with no tests for the project raises rather than
      # ratcheting clean; a suite that all-fails is 172+ regressions. And the `--list` floor
      # guard above still fails HARD, before this step, so testMatch drift cannot reach here.
      - name: Run the leg (Playwright boots `next start` via webServer)
        continue-on-error: true
        run: >-
          pnpm -F console exec playwright test
          ${{ matrix.args }}
          --workers=${{ matrix.workers }}
          --retries=${{ matrix.retries }}
          --reporter=list,html,json,./e2e/reporters/qa-reporter.ts
      # THE VERDICT. Not the exit code above — this step is the only thing that can fail the job:
      # a regression against the committed baseline, a new test that did not pass, a skip that is
      # neither a BUG fixme nor a recorded reason, or a recorded failure that now passes (move the
      # ledger). Runs on failure too — that is when it matters.
      - name: Ratchet — no regression against apps/console/e2e/gate-baseline.json
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/e2e-ratchet.mjs --project=${{ matrix.project }} --results=apps/console/test-results/results.json --step-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report, traces and the JSON the ratchet read
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-${{ matrix.project }}
          path: |
            apps/console/playwright-report/
            apps/console/test-results/
          retention-days: 14
