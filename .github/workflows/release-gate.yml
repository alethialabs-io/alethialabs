name: Release gate
# THE BROWSER GATE IN FRONT OF EVERY PRODUCTION DEPLOY.
#
# Production deploys on a push to `main` (deploy-console.yml), and `main` only ever takes a PR from
# `staging` (branch-flow-guard.yml). So a required check on PRs into `main` IS "before every
# production deployment". Each leg below boots its own ephemeral console — postgres service, the real
# migrations, the enterprise scope, `next start` — and drives one Playwright project against it, in
# the exact shape ci.yml's `e2e-browser` job proved. The repo is public, so the runner minutes are
# free; nothing here needs a sandbox environment, a staging server, or a cloud credential.
#
# GREEN-BY-RATCHET. The suites were 39% green when this landed (apps/console/docs/qa/findings.md).
# Every leg therefore fails on REGRESSION against apps/console/e2e/gate-baseline.json rather than
# on absolute red — scripts/e2e-ratchet.mjs holds the rules — so the gate can be required from the
# day the baseline is captured while the suites are repaired lane by lane.
#
# WHEN IT RUNS, and why each clause is there:
#   · a non-draft PR into main or staging — the promotion path. `draft == false` is load-bearing:
#     the standing dev→staging promotion PR lives as a DRAFT between promotions and was 22% of all
#     CI runs (CONTRIBUTING.md); a one-hour gate re-fired on every dev merge would be the single most
#     expensive mistake this file could make.
#   · a PR into dev carrying the `release-gate:run` (or `release-gate:all`) label — for a lane that
#     wants per-PR gate feedback, and for capturing the baseline. `labeled` fires for ANY label, so
#     the job also requires that the label just added is one of those two, or a random label would
#     restart an hour.
#   · workflow_dispatch, with an optional comma-separated `legs` input.
# Never `merge_group` (Mergify replaced it), never `paths:` (a filtered-out required workflow reports
# nothing and wedges every PR — validate-console.yml's header has the incident).
#
# WHICH legs run is a separate question from WHETHER the gate runs, and it is answered once, in the
# `legs` job. A PR into main or staging runs every leg — that is the gate, and a promotion must not
# choose what measures it. A dev PR MAY narrow, because on that path the seven legs cost ~76
# runner-minutes per push (measured, run 34351806933) and CI capacity, not authoring, is this wave's
# ceiling. Narrowing there is safe for a reason that is written down rather than assumed: the seven
# `Release gate (<leg>)` contexts are filtered OUT of `protect-dev` and `protect-staging` in
# infra/github/main.tf and are named nowhere in .mergify.yml, so a leg that does not run on a dev PR
# leaves no required context unreported and no queue entry waiting. See the `legs` job for the rules.
#
# That is a statement about the DECLARATION, which is the half this repo can read from the tree.
# What GitHub actually enforces is a separate question and a separate instrument —
# `node scripts/ci/check-required-checks.mjs --live`, which exists because the HCL and the live
# rulesets have already drifted for a month once. The narrowing above is sound under either answer:
# the tree never asks for a leg on dev, and a ruleset that has not been applied asks for even less.
#
# Every `pnpm` invocation is `-C <dir> run` or `exec` (scripts/ci/check-pnpm-script-refs.mjs); every
# step past the checkout that runs on failure carries the #4084 conjunct
# (scripts/ci/check-workflow-shape.mjs). The `WORKFLOW_HEALTH_SUBSTANTIVE_JOB` line lets
# scripts/ci/workflow-health.mjs ask whether the leg that matters actually ran.
on:
  pull_request:
    branches: [main, staging, dev]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      legs:
        description: "Comma-separated legs to run (hero, elench-ai, console, canvas, qa, audit, audit-interaction). Empty runs every leg."
        required: false
        default: ""

# A LABEL EVENT MUST NEVER CANCEL A RUNNING GATE.
#
# The concurrency group is evaluated when a run is CREATED, before any job-level `if:` is
# considered. So with a blanket `cancel-in-progress: true`, adding any unrelated label to a
# promotion PR (`qa:prod`, a triage label) 40 minutes into the `qa` leg creates a new run, cancels
# the in-flight one, and is then skipped by the `legs` guard below — which requires the added label
# to be one of the two `release-gate:*` ones. The SEVEN required `Release gate (<leg>)` contexts on
# a promotion PR never report, and the
# PR sits permanently pending with nothing red to explain it, recovering only on a new push or
# `ready_for_review`. The header above anticipated a random label RESTARTING the hour; the guard
# turns that into cancel-and-never-restart, which is worse.
#
# Keying the cancellation on the event action fixes it at the source: a push supersedes its
# predecessor as before, and a label event cannot cancel anything. A label that IS one of the
# `release-gate:*` pair starts a run that simply queues behind any in-flight one.
concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

permissions:
  contents: read

env:
  WORKFLOW_HEALTH_SUBSTANTIVE_JOB: "Release gate (qa)"

jobs:
  legs:
    name: Which legs run
    runs-on: ubuntu-latest
    # The trigger logic lives HERE, once, because `matrix` is not available in a job-level `if:`
    # and six copies of this clause would drift six ways. The gate job `needs` this one, so when
    # this is skipped nothing below runs — and a skipped required context on a DRAFT is harmless:
    # a draft cannot merge, and `ready_for_review` fires the run the moment it is not one.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.draft == false
          && (github.event.action != 'labeled'
              || contains(fromJSON('["release-gate:run","release-gate:all"]'), github.event.label.name))
          && (contains(fromJSON('["main","staging"]'), github.base_ref)
              || contains(github.event.pull_request.labels.*.name, 'release-gate:run')
              || contains(github.event.pull_request.labels.*.name, 'release-gate:all')))
    # `pull-requests: read` is what `GET /pulls/{n}/files` needs; the workflow-level grant is
    # `contents: read` only. Without it the API call 403s — which selects EVERY leg, loudly, rather
    # than silently narrowing. The `gate` job below keeps the workflow-level grant.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      # The denominator of the path inference below. It CANNOT fail the job: an API error, a
      # revoked scope, GitHub's 3000-file cap — each writes an empty list and a `read=` value the
      # picker turns into "every leg". A file list this step could not read is not an empty diff.
      - id: changed
        name: List the PR's changed files (unreadable or empty selects every leg)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: /tmp/release-gate-changed-files.txt
        run: |
          set -uo pipefail
          read_ok=yes
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "$CHANGED_FILES"; then
            echo "::warning::could not list the changed files for this PR — every leg will run"
            : > "$CHANGED_FILES"
            read_ok=no
          fi
          count=$(wc -l < "$CHANGED_FILES" | tr -d ' ')
          # GitHub's file list is capped at 3000. At the cap the list is a TRUNCATION, and inferring
          # from a truncated diff is exactly the under-reporting this file refuses.
          if [ "$count" -ge 3000 ]; then
            echo "::warning::the changed-file list hit GitHub's 3000-file cap — every leg will run"
            read_ok=no
          fi
          echo "changed files: $count (readable: $read_ok)"
          cat "$CHANGED_FILES"
          echo "read=$read_ok" >> "$GITHUB_OUTPUT"
      - id: pick
        name: Pick the legs for this event
        env:
          LEGS: ${{ inputs.legs }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CHANGED_READ: ${{ steps.changed.outputs.read }}
          CHANGED_FILES: /tmp/release-gate-changed-files.txt
        run: |
          node - <<'EOF'
          // THE LEG TABLE. One row per Playwright project the gate drives; `capabilities` is the
          // promise the leg makes (apps/console/e2e/helpers/capabilities.ts) and `floor` is the
          // fewest tests `--list` may report before the leg is called testMatch drift, not a suite.
          // `args` is the LITERAL `--project=<name>` flag, spelled out per row on purpose:
          // playwright.config.ts's dead-zone guard (#2875) reads every workflow for exactly that
          // string to prove a project runs somewhere, and `--project=${{ matrix.project }}` is a
          // template it cannot see through. The emitter stays literal so the guard stays honest.
          //
          // `capabilities` IS A COMMA-SEPARATED SET, and the `env:` block below reads it with
          // `contains(...)`, never `==`. Until #4456 every row held at most one name and the block
          // compared the whole set against one name with `==`, so the first row to promise two things
          // would have matched NOTHING and blanked all five Stripe variables — a leg that then
          // fails its own `--assert-env` pre-check, or (had that check not existed) runs every
          // billing assertion against an unconfigured console. See the env block for the six sites.
          const legs = [
            { project: "hero",      args: "--project=hero",      workers: 1, retries: 1, capabilities: "",                   manifest: false, floor: 1 },
            { project: "elench-ai", args: "--project=elench-ai", workers: 1, retries: 1, capabilities: "ai-mock",            manifest: false, floor: 1 },
            { project: "console",   args: "--project=console",   workers: 2, retries: 1, capabilities: "stripe,encryption",  manifest: false, floor: 1 },
            { project: "canvas",    args: "--project=canvas",    workers: 1, retries: 1, capabilities: "",                   manifest: false, floor: 1 },
            { project: "qa",        args: "--project=qa",        workers: 3, retries: 1, capabilities: "stripe,encryption",  manifest: false, floor: 300 },
            { project: "audit",     args: "--project=audit",     workers: 1, retries: 1, capabilities: "",                   manifest: true,  floor: 1 },
            { project: "audit-interaction", args: "--project=audit-interaction", workers: 1, retries: 0, capabilities: "stripe,encryption", manifest: true, floor: 47 },
          ];
          const ALL = legs.map((l) => l.project);

          // ── WHAT MAY NARROW, AND WHAT MAY NOT ─────────────────────────────────────────────────
          //
          // A labelled dev PR used to run all seven legs: ~76 runner-minutes a push (measured, run
          // 34351806933), most of it seven copies of the same `next build`, for a lane whose whole
          // diff is one spec file. CI capacity is this wave's binding constraint, so a dev PR may
          // narrow. Three things never do, and the order below is the order they are asked in:
          //
          //   1. A PR into main or staging runs EVERY leg. That is the gate; a promotion must not
          //      choose what measures it. `release-gate:all` is the same answer asked for by hand.
          //   2. A diff touching a SEAM runs every leg — a file any leg reads, where a change can
          //      move any of them, so inferring from its path is the under-reporting this repo
          //      keeps paying for.
          //   3. A path matching NO rule runs every leg. "nothing matched" and "nothing needs
          //      running" are the same input, and making them the same output is the vacuous-green
          //      shape the gate exists to refuse. So does a file list this job could not read, and
          //      so does a diff of zero files.
          //
          // The consequence, stated plainly because it is the honest bound: inference narrows ONLY
          // for a diff made ENTIRELY of leg-specific files under apps/console/e2e/. A console
          // source change selects everything, because it can break anything.

          // A file any leg reads. The first six are the list #4440 names; `global-setup.ts` and
          // `reporters/` are added with the same argument — Playwright has no per-project
          // globalSetup so that file runs for every invocation, and every leg's `--reporter=`
          // flag below names `./e2e/reporters/qa-reporter.ts`.
          //
          // MEASURED, so the next reader is not misled: not one of these paths is matched by any
          // RULE below TODAY, so deleting this list would change no answer — rule 3 (unmatched
          // runs everything) already covers every one of them. It is kept, and checked FIRST, for
          // the case rule 3 stops covering: the day someone widens a rule to a directory — an
          // `^apps/console/e2e/` catch-all is the obvious one — a seam under it would be swallowed
          // and the diff would look like a tidy-up. That widening is what this list is for, and it
          // is the only thing it does.
          const SEAMS = [
            /^apps\/console\/playwright\.config\.ts$/,
            /^apps\/console\/e2e\/helpers\//,
            /^apps\/console\/e2e\/fixtures\//,
            /^apps\/console\/e2e\/gate-baseline\.json$/,
            /^apps\/console\/e2e\/global-setup\.ts$/,
            /^apps\/console\/e2e\/reporters\//,
            /^scripts\/e2e-ratchet\.mjs$/,
            /^\.github\/workflows\/release-gate\.yml$/,
          ];

          // FIRST MATCH WINS, so the order is load-bearing. Each `when` mirrors a project's
          // `testMatch` in apps/console/playwright.config.ts rather than restating a belief about
          // it — that file is where these regexes come from and where they must be kept true.
          const RULES = [
            { when: /^apps\/console\/e2e\/flows\//, legs: ["qa"], why: "e2e/flows/** is the qa project's testMatch" },
            { when: /^apps\/console\/e2e\/audit\/destructive\.spec\.ts$/, legs: ["audit-interaction"], why: "the audit-interaction project's whole testMatch" },
            { when: /^apps\/console\/e2e\/audit\/[^/]*\.spec\.ts$/, legs: ["audit"], why: "an audit spec (destructive.spec.ts is testIgnored out of this project)" },
            // NOT "other e2e/audit/** -> audit". destructive.spec.ts imports ./context and
            // ./manifest, so a shared audit module moves BOTH audit legs; sending it to `audit`
            // alone would be a silent under-selection.
            { when: /^apps\/console\/e2e\/audit\//, legs: ["audit", "audit-interaction"], why: "a shared audit module — both audit legs import from this directory" },
            { when: /^apps\/console\/e2e\/hero-happy-path\.spec\.ts$/, legs: ["hero"], why: "the hero project's whole testMatch" },
            { when: /^apps\/console\/e2e\/elench-(ai|ux)\.spec\.ts$/, legs: ["elench-ai"], why: "the elench-ai project's testMatch" },
            { when: /^apps\/console\/e2e\/architecture-canvas\.spec\.ts$/, legs: ["canvas"], why: "the canvas project's whole testMatch" },
            { when: /^apps\/console\/e2e\/(account-settings|activity|billing|connectors|elench-agent|evidence|usage)\.spec\.ts$/, legs: ["console"], why: "the console project's testMatch" },
          ];

          const fs = require("node:fs");
          const env = process.env;

          /** Decide which legs run, and the one sentence that says why. Rows are per-path detail. */
          function decide() {
            if (env.EVENT_NAME === "workflow_dispatch") {
              const want = (env.LEGS || "").split(",").map((s) => s.trim()).filter(Boolean);
              for (const w of want) {
                if (!ALL.includes(w)) {
                  console.error(`::error::unknown leg "${w}" (known: ${ALL.join(", ")})`);
                  process.exit(1);
                }
              }
              return want.length
                ? { legs: want, rule: `workflow_dispatch named \`${want.join(", ")}\`` }
                : { legs: ALL, rule: "workflow_dispatch with an empty `legs` input — every leg" };
            }

            const base = env.BASE_REF || "";
            if (base === "main" || base === "staging") {
              return { legs: ALL, rule: `a PR into \`${base}\` — the promotion path runs every leg; a promotion must not choose what measures it` };
            }

            let labels = [];
            try { labels = JSON.parse(env.PR_LABELS || "[]") || []; } catch { labels = []; }
            if (labels.includes("release-gate:all")) {
              return { legs: ALL, rule: "`release-gate:all` is on the PR — the manual override, every leg" };
            }

            if (env.CHANGED_READ !== "yes") {
              return { legs: ALL, rule: "the changed-file list could not be read (or was truncated) — every leg. A list this job cannot read is not an empty diff." };
            }
            let changed = [];
            try {
              changed = fs.readFileSync(env.CHANGED_FILES, "utf8").split("\n").map((s) => s.trim()).filter(Boolean);
            } catch {
              return { legs: ALL, rule: "the changed-file list is missing — every leg" };
            }
            if (changed.length === 0) {
              return { legs: ALL, rule: "the PR reported ZERO changed files — every leg. Zero is a number this job does not believe." };
            }

            const seamHits = changed.filter((f) => SEAMS.some((re) => re.test(f)));
            if (seamHits.length > 0) {
              return { legs: ALL, rule: `a shared seam changed (${seamHits.join(", ")}) — a seam can move any leg, so every leg runs` };
            }

            const rows = [];
            const selected = new Set();
            const unmatched = [];
            for (const f of changed) {
              const rule = RULES.find((r) => r.when.test(f));
              if (rule === undefined) {
                unmatched.push(f);
                rows.push({ file: f, legs: "every leg", why: "no rule matches this path" });
                continue;
              }
              for (const l of rule.legs) selected.add(l);
              rows.push({ file: f, legs: rule.legs.join(", "), why: rule.why });
            }
            if (unmatched.length > 0) {
              return { legs: ALL, rule: `${unmatched.length} changed path(s) match no rule — every leg runs, never none`, rows };
            }
            if (selected.size === 0) {
              return { legs: ALL, rule: "the rules selected nothing at all — every leg runs, never none", rows };
            }
            return { legs: ALL.filter((p) => selected.has(p)), rule: "inferred from the changed paths", rows };
          }

          const decision = decide();
          const chosen = legs.filter((l) => decision.legs.includes(l.project));
          if (chosen.length === 0) { console.error("::error::no legs selected"); process.exit(1); }
          if (env.GITHUB_OUTPUT) fs.appendFileSync(env.GITHUB_OUTPUT, `include=${JSON.stringify(chosen)}\n`);
          console.log(`legs: ${chosen.map((l) => l.project).join(", ")}`);
          console.log(`why: ${decision.rule}`);

          // A LEG THAT SILENTLY DOES NOT RUN READS AS A LEG THAT PASSED. So the selection is
          // published where the run is read, with the skipped legs named and the rule that decided.
          const ran = chosen.map((l) => l.project);
          const skipped = ALL.filter((p) => !ran.includes(p));
          const md = [
            "## Release gate — which legs run",
            "",
            `**Rule:** ${decision.rule}`,
            "",
            `**Running (${ran.length}/${ALL.length}):** ${ran.map((p) => `\`${p}\``).join(", ")}`,
            "",
            `**Skipped (${skipped.length}):** ${skipped.length ? skipped.map((p) => `\`${p}\``).join(", ") : "none"}`,
          ];
          if (decision.rows && decision.rows.length > 0) {
            md.push("", "| changed path | selects | because |", "| --- | --- | --- |");
            for (const r of decision.rows) md.push(`| \`${r.file}\` | ${r.legs} | ${r.why} |`);
          }
          if (skipped.length > 0) {
            md.push("", "A skipped leg reports no `Release gate (<leg>)` context. `infra/github/main.tf` declares those contexts required on `main` alone — it filters them out of `protect-dev` and `protect-staging`, and `.mergify.yml` names none of them — and a promotion PR never reaches this branch of the rules. (What GitHub enforces is `check-required-checks.mjs --live`'s question, not this one; the narrowing is sound under either answer.)");
          }
          if (env.GITHUB_STEP_SUMMARY) fs.appendFileSync(env.GITHUB_STEP_SUMMARY, `${md.join("\n")}\n`);
          console.log(md.join("\n"));
          EOF

  gate:
    name: Release gate (${{ matrix.project }})
    needs: [legs]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.include) }}
    # Same hermetic recipe as ci.yml's e2e-browser job: a real Postgres, a production console booted
    # by the Playwright `webServer`, email-OTP with the code scraped from the teed log. OpenFGA is
    # left unset so the community PostgresRbacPDP is the authz engine.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alethia
          POSTGRES_PASSWORD: alethia-dev-secret
          POSTGRES_DB: alethia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alethia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALETHIA_DATABASE_URL: postgres://alethia:alethia-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DATABASE_URL: postgres://alethia_app:alethia-app-dev-secret@localhost:5432/alethia
      ALETHIA_APP_DB_PASSWORD: alethia-app-dev-secret
      BETTER_AUTH_SECRET: release-gate-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # `next start` is production mode with no trusted ingress proxy in front of it, so every
      # request lands in ONE shared rate-limit bucket. apps/console/lib/config/auth.ts documents
      # this escape hatch; it is also what let the `console` and `qa` projects into CI at all — the
      # 5-OTP/60s cap was the recorded reason they could not be gating.
      ALETHIA_AUTH_RATE_LIMIT: "0"
      ALETHIA_STORAGE_ENDPOINT: http://localhost:8333
      ALETHIA_STORAGE_ACCESS_KEY_ID: e2e
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: e2e
      DEV_CONSOLE_LOG: /tmp/alethia-release-gate-${{ matrix.project }}.log
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      # THE PROMISE. A spec tagged `@needs:<capability>` on a leg that does not promise it is red,
      # never a skip; a promise whose variables are absent fails the pre-check step in seconds.
      #
      # ⚠ EVERY TEST BELOW IS `contains(matrix.capabilities, …)`, NEVER `== '…'`. `capabilities` is
      # a comma-separated SET, and `==` asks whether the set has exactly one member with that name:
      # the moment a leg promises two things (`stripe,encryption`, #4456) every `== 'stripe'` goes
      # false and hands the leg an EMPTY Stripe key, an empty webhook secret and three empty price
      # ids. `--assert-env` catches that as a named failure — but the shape it would otherwise
      # produce, billing assertions running green against an unconfigured console, is the exact
      # silent downgrade helpers/capabilities.ts exists to end.
      #
      # `contains` is a SUBSTRING test, so it is only equivalent to set membership while no
      # capability name is a substring of another. That is not left to a comment:
      # `capabilities.ts --assert-env` refuses the whole set when it stops holding, and that check
      # runs on every leg, below, before the build.
      ALETHIA_E2E_CAPABILITIES: ${{ matrix.capabilities }}
      ALETHIA_AI_MOCK: ${{ contains(matrix.capabilities, 'ai-mock') && '1' || '' }}
      ALETHIA_QA_E2E: ${{ matrix.project == 'qa' && '1' || '' }}
      # The credential-encryption key, only where promised (#4456). Without it
      # `isCredEncryptionConfigured()` is false and EVERY secret-bearing surface is inert: the
      # add-channel sheet renders its "needs an encryption key" note and disables submit, and no
      # connector credential can be stored. The gate could therefore exercise none of it.
      #
      # A FIXED NON-SECRET, not a repository secret, and the same literal `e2e-nightly.yml` already
      # uses: base64 for the ASCII `alethia-e2e-cli-demo-throwaway!!`, exactly 32 bytes, which is
      # what lib/crypto/secrets.ts accepts. The console it unlocks lives for one job against a
      # throwaway database, nothing it encrypts outlives the run, and the key is fixed rather than
      # generated so a failed decrypt stays reproducible. It must never be reused anywhere real.
      # `.gitleaks.toml` allowlists this blob anchored to this variable name.
      ALETHIA_CRED_ENCRYPTION_KEY: ${{ contains(matrix.capabilities, 'encryption') && 'YWxldGhpYS1lMmUtY2xpLWRlbW8tdGhyb3dhd2F5ISE=' || '' }}
      # Stripe TEST mode, only where promised. `NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY` is inlined at
      # BUILD time (apps/console/lib/billing/config.ts), which is why it is job-level env and not a
      # run-step env. The webhook secret is any test-mode `whsec_`: nothing reaches CI, and the
      # card-less trial syncs deterministically without one. NEVER `ALETHIA_DEPLOYMENT_MODE=hosted`
      # here — packages/email then refuses the OTP log fallback and nothing can sign in.
      STRIPE_SECRET_KEY: ${{ contains(matrix.capabilities, 'stripe') && secrets.STRIPE_TEST_SECRET_KEY || '' }}
      STRIPE_WEBHOOK_SECRET: ${{ contains(matrix.capabilities, 'stripe') && secrets.STRIPE_TEST_WEBHOOK_SECRET || '' }}
      STRIPE_PRICE_TEAM: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_TEAM || '' }}
      STRIPE_PRICE_AI_PLUS: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_AI_PLUS || '' }}
      STRIPE_PRICE_AI_MAX: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PRICE_AI_MAX || '' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ contains(matrix.capabilities, 'stripe') && vars.STRIPE_TEST_PUBLISHABLE_KEY || '' }}
    steps:
      # `id:` so the two `!cancelled()` steps at the bottom can ask whether there is a WORKSPACE:
      # the `services:` block starts before this checkout, and a failed image pull skips everything
      # here while `cancelled()` stays false (#4084).
      - id: checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Next's OWN incremental compiler cache, not turbo's. `pnpm -C apps/console run build` calls
      # the package script directly — turbo's `build.dependsOn` never fires — so a turbo cache step
      # here would restore nothing the build reads (ci.yml carries that inert step; this file does
      # not repeat it).
      - name: Cache Next's incremental compiler output
        uses: actions/cache@v6
        with:
          path: apps/console/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      # BEFORE the build: an unset repository secret is a named failure at the top of the job,
      # not a downgraded run at the bottom.
      - name: Guard — every promised capability has its variables (seconds, before a single build)
        run: pnpm -C apps/console exec tsx e2e/helpers/capabilities.ts --assert-env
      - name: Migrate the test database (schema + programmables/RLS + app role)
        run: pnpm -C apps/console run db:migrate
      # Build @alethia/ee FIRST, and prove its dist exists. Without it lib/auth/scope.ts falls back
      # to `{ userId, orgId: userId }` and every org-scoped assertion goes vacuous — the failure
      # ci.yml's e2e-browser job records. The community `pnpm -F @alethia/ee` selector is the one
      # deliberate `-F <pkg> <script>`; the guard step is what makes it safe.
      - name: Build @alethia/ee (the console resolves EE scope only when its dist exists)
        run: pnpm -F @alethia/ee build
      - name: Guard — ee/dist must exist, or the leg silently runs community scope
        run: |
          test -f ee/dist/index.js || {
            echo "::error::ee/dist/index.js missing — the console would fall back to community"
            echo "::error::scope (actor.orgId === userId), which makes org-scoped assertions vacuous."
            exit 1
          }
      - name: Build the console (the production image the browser drives)
        run: pnpm -C apps/console run build
      - name: Install Playwright (Chromium + OS deps)
        run: bash scripts/ci/playwright-install.sh
      # The audit's denominator. The manifest RAISES on zero routes rather than returning [], and
      # this proves it still does before the leg spends an hour on it.
      - name: Guard — the route manifest still resolves (audit legs)
        if: ${{ matrix.manifest }}
        run: node scripts/lib/console-routes.mjs --summary
      # A vacuous green is the failure this repo names most often. A testMatch that drifted to
      # zero tests exits 0; a `qa` leg listing 40 tests is not a smaller suite, it is the wrong one.
      - name: Guard — the leg lists at least its floor of tests
        run: |
          list=$(pnpm -F console exec playwright test ${{ matrix.args }} --list 2>&1) || { echo "$list"; exit 1; }
          echo "$list"
          total=$(echo "$list" | sed -nE 's/.*Total: ([0-9]+) test.*/\1/p' | tail -1)
          if [ -z "$total" ] || [ "$total" -lt ${{ matrix.floor }} ]; then
            echo "::error::--project=${{ matrix.project }} listed ${total:-0} test(s), below the floor of ${{ matrix.floor }} (testMatch drift?)"
            exit 1
          fi
      # `continue-on-error` IS THE GREEN-BY-RATCHET MECHANISM, not a softened check.
      #
      # Playwright exits non-zero whenever ANY test fails, and the whole premise of this gate is
      # that a leg is allowed to be red while it is repaired — the baseline records 94 failures
      # across four legs (console 8, canvas 5, qa 80, audit 1; 429 recorded passes beside them).
      # Without this, those four can never conclude `success` no matter what
      # the ratchet says, so the gate could never be required and the ledger below would gate
      # nothing. Measured: on run 34247389000 the `console` leg's Ratchet step SUCCEEDED
      # ("no regression against the baseline") and the job was red anyway, on this step. The two
      # legs that passed, `hero` and `elench-ai`, are exactly the two with zero recorded failures.
      #
      # It is safe because the ratchet below is not a summariser — it FAILS on every way this
      # step can die. No `results.json` (a webServer that never booted, a config throw) is an
      # unreadable file and exits 1; a report with no tests for the project raises rather than
      # ratcheting clean; a suite that all-fails is 172+ regressions. And the `--list` floor
      # guard above still fails HARD, before this step, so testMatch drift cannot reach here.
      - name: Run the leg (Playwright boots `next start` via webServer)
        continue-on-error: true
        run: >-
          pnpm -F console exec playwright test
          ${{ matrix.args }}
          --workers=${{ matrix.workers }}
          --retries=${{ matrix.retries }}
          --reporter=list,html,json,./e2e/reporters/qa-reporter.ts
      # THE VERDICT. Not the exit code above — this step is the only thing that can fail the job:
      # a regression against the committed baseline, a new test that did not pass, a skip that is
      # neither a BUG fixme nor a recorded reason, or a recorded failure that now passes (move the
      # ledger). Runs on failure too — that is when it matters.
      - name: Ratchet — no regression against apps/console/e2e/gate-baseline.json
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: node scripts/e2e-ratchet.mjs --project=${{ matrix.project }} --results=apps/console/test-results/results.json --step-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report, traces and the JSON the ratchet read
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-${{ matrix.project }}
          path: |
            apps/console/playwright-report/
            apps/console/test-results/
          retention-days: 14
