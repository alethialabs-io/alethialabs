# SPDX-License-Identifier: AGPL-3.0-only
#
# Which workflows are red, and have been red for a while.
#
# WHY THIS EXISTS. On 2026-08-24, one sweep of every workflow's last three runs found FIVE red
# pipelines — four of them red on EVERY run — and not one had been noticed:
#
#   deploy-console        production had not deployed for four days (an expired PostHog key)
#   posthog-error-issues  the same key, so the surface that REPORTS runtime errors was down too
#   release-cli           red on every SUCCESSFUL publish, since v0.4.0
#   e2e-nightly           four clouds reported red on nights that never touched a cloud
#   programme             403 on push; its own staleness rule reds CI for everyone a week later
#
# All five were found by asking GitHub a question nobody was asking. That is the whole content of
# this workflow: ask it daily, and put the answer where a human reads.
#
# IT DOES NOT FAIL. A red pipeline nobody notices is the problem being solved; adding a sixth would
# be a joke at its own expense. It opens or updates ONE title-deduped issue — the mechanism
# e2e-nightly's rollup already uses, and the one that demonstrably reaches someone.

# ── FINDING THE TRACKING ISSUE, keyed on a LABEL and never on the title (#3252) ────────────────────
#
# This job keeps ONE long-lived issue and updates it, because a daily issue is indistinguishable
# from spam and gets muted — which would recreate the blindness the whole file exists to remove. It
# used to find that issue by matching an exact TITLE string inside `wave:hygiene`, and there were
# TWO of them by 2026-08-28 (#2759 and #3208). Both halves of how that happened are ordinary:
#
#   1. Somebody RENAMED the issue, at 14:02:34, to match the broadened scope #3161 had just given
#      this job. A title is prose; people edit prose.
#   2. A scheduled run used a DIFFERENT constant. `schedule:` fires the DEFAULT branch's copy —
#      `main` — which was ~30 commits behind, still carrying the old title. It looked for that
#      title, found none, and filed a second issue.
#
# The second point generalises and is easy to forget: a change to a scheduled workflow on `dev` is
# INERT until it reaches `main`. So two refs must agree about the key, and a mutable string is a bad
# thing for two refs to have to agree about. A dedicated label is not edited by accident, survives a
# rename, and means the title can stay prose for humans.
#
# AND MORE THAN ONE MATCH IS REPORTED, NOT RESOLVED. Silently taking the first is how a duplicate
# gets absorbed rather than surfaced, which is why this one sat unnoticed for three days.

name: Workflow health

on:
  schedule:
    - cron: "23 6 * * *" # daily, 06:23 UTC — after the nightly and its reaper have settled
  workflow_dispatch:

permissions:
  contents: read
  actions: read # read each workflow's recent run conclusions
  issues: write # upsert the one tracking issue

concurrency:
  group: workflow-health
  cancel-in-progress: true

jobs:
  report:
    name: Workflow health report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The conclusions come from the API rather than the checkout, so a workflow deleted from the
      # tree stops being reported the moment it stops existing — no stale entries to prune by hand.
      - name: Collect each workflow's recent run conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > runs.json
          echo "[" >> runs.json
          first=1
          for wf in $(ls .github/workflows/*.yml | xargs -n1 basename); do
            # ONE fetch of (id, conclusion) pairs, filtered once. The conclusions array and the
            # substantive-job array below are BOTH derived from this same filtered list, because
            # they are read positionally downstream — deriving them from two separate queries would
            # let them fall out of step and silently attribute one run's job state to another's
            # conclusion.
            runs="$(gh run list --workflow="$wf" --limit 5 --json databaseId,conclusion \
                     -q '[.[] | select(.conclusion != null)]' 2>/dev/null || echo '[]')"
            [ -z "$runs" ] && runs='[]'
            c="$(printf '%s' "$runs" | jq -c '[.[].conclusion]')"

            # A workflow may declare which job carries its meaning (#2506). A RUN conclusion cannot
            # see a job that never ran: e2e-ai-nightly gates its only substantive job on a secret,
            # so without the key `preflight` succeeds, `e2e-live` skips, and the run concludes
            # `success` — green because it did nothing. Undeclared workflows are judged exactly as
            # before; 35 workflows have legitimately-conditional jobs and flagging all of them would
            # be triaged into silence in a week.
            sub="$(sed -n 's/^[[:space:]]*WORKFLOW_HEALTH_SUBSTANTIVE_JOB:[[:space:]]*//p' \
                    ".github/workflows/$wf" | head -1 | sed 's/^"//; s/"$//' || true)"
            subj='null'; states='[]'
            if [ -n "$sub" ]; then
              subj="$(printf '%s' "$sub" | jq -Rc .)"
              states="$(
                printf '%s' "$runs" | jq -r '.[].databaseId' | while read -r id; do
                  [ -n "$id" ] || continue
                  st="$(gh run view "$id" --json jobs 2>/dev/null \
                        | jq -r --arg n "$sub" '[.jobs[] | select(.name == $n) | .conclusion] | .[0] // "absent"' \
                        2>/dev/null || echo absent)"
                  # `absent` is "we did not see this job in that run", which is NOT evidence that it
                  # skipped — a job added after an old run is absent from it for an innocent reason.
                  # The classifier keeps the two apart; flattening them here would decide the
                  # question before it reached the code that reasons about it.
                  case "$st" in
                    skipped) echo skipped ;;
                    absent|null|"") echo absent ;;
                    *) echo ran ;;
                  esac
                done | jq -Rsc 'split("\n") | map(select(length > 0))'
              )"
              [ -z "$states" ] && states='[]'
            fi

            [ "$first" -eq 0 ] && echo "," >> runs.json
            first=0
            printf '{"name":"%s","conclusions":%s,"substantiveJob":%s,"substantive":%s}' \
              "${wf%.yml}" "$c" "$subj" "$states" >> runs.json
          done
          echo "]" >> runs.json

      - name: Assess
        id: assess
        run: |
          set -euo pipefail
          report="$(node scripts/ci/workflow-health.mjs --input runs.json)"
          echo "$report"
          count="$(printf '%s' "$report" | sed -n 's/^ACTIONABLE_COUNT=//p')"
          echo "count=${count:-0}" >> "$GITHUB_OUTPUT"
          # The body drops the machine-readable tail; the issue gets prose only.
          printf '%s' "$report" | sed '/^ACTIONABLE_COUNT=/d' > report.md
          { echo '## Workflow health'; echo; cat report.md; } >> "$GITHUB_STEP_SUMMARY"

      # Title-deduped, like the nightly rollup's. One long-lived issue that gets updated, never a
      # new one per day — a daily issue is indistinguishable from spam and gets muted, which would
      # recreate the exact blindness this exists to remove.
      - name: Open or update the tracking issue
        if: steps.assess.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "ci: workflows red on every recent run, or green without running"
        run: |
          set -euo pipefail
          body="$(cat report.md)"
          body="${body}

          _Refreshed by \`.github/workflows/workflow-health.yml\` on $(date -u +%Y-%m-%d). Close it when the list is empty; it will reopen itself if that stops being true._"
          # Dedup by LABEL, not by --search. GitHub's search index LAGS by minutes, and a dedup
          # that only asks search has already filed a duplicate in this repo. `--label` is live.
          # Keyed on the tracker label, never on the title — see the header. `--label` is also live
          # where `--search` lags by minutes, which is a separate trap this repo has already hit.
          matches="$(gh issue list --state open --label "tracker:workflow-health" --limit 100 --json number -q '.[].number' 2>/dev/null || true)"
          count="$(printf '%s' "$matches" | grep -c . || true)"
          if [ "${count:-0}" -gt 1 ]; then
            echo "::error title=duplicate tracking issues::more than one open issue carries \`tracker:workflow-health\`: $(printf '%s' "$matches" | tr '\n' ' ')— close all but one. Picking the first would absorb the duplicate instead of reporting it, which is how #3252 went unnoticed for three days."
            exit 1
          fi
          existing="$(printf '%s' "$matches" | head -1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            gh issue comment "$existing" --body "Still actionable on $(date -u +%Y-%m-%d) — red, or green without running. See the updated body."
            echo "updated #$existing"
          else
            gh issue create --title "$TITLE" --label "wave:hygiene,tracker:workflow-health" --body "$body"
          fi

      - name: Say so when everything is green
        if: steps.assess.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "ci: workflows red on every recent run, or green without running"
        run: |
          set -euo pipefail
          # Keyed on the tracker label, never on the title — see the header. `--label` is also live
          # where `--search` lags by minutes, which is a separate trap this repo has already hit.
          matches="$(gh issue list --state open --label "tracker:workflow-health" --limit 100 --json number -q '.[].number' 2>/dev/null || true)"
          count="$(printf '%s' "$matches" | grep -c . || true)"
          if [ "${count:-0}" -gt 1 ]; then
            echo "::error title=duplicate tracking issues::more than one open issue carries \`tracker:workflow-health\`: $(printf '%s' "$matches" | tr '\n' ' ')— close all but one. Picking the first would absorb the duplicate instead of reporting it, which is how #3252 went unnoticed for three days."
            exit 1
          fi
          existing="$(printf '%s' "$matches" | head -1)"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "No workflow has failed its last 3 runs as of $(date -u +%Y-%m-%d). Closing; this reopens itself if that changes."
            echo "closed #$existing"
          fi

      # ── CI demand (#4173) ────────────────────────────────────────────────────────────────────
      #
      # Measured 2026-09-03: jobs spent 5,376 minutes WAITING for a runner against 1,802 executing,
      # and a run had all its ready jobs running only after 35.6 minutes (median). None of that was
      # visible anywhere, so a two-month throughput ceiling had no number attached to it and every
      # proposed fix was an opinion.
      #
      # This optional measurement runs AFTER both branches of the established issue upsert. The job
      # already spends most of its 10-minute budget on sequential GitHub API calls; if demand sampling
      # consumes the remainder, it must cut only itself, never the report this workflow exists to file.
      # It does NOT gate on the value: a demand number is a trend, and failing the build on it would be
      # a guess at the threshold. The collector still fails loudly on an empty or untimed sample.
      - name: CI demand — how much CI we ask for, and how long we wait for it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 60 runs is what fits the remaining budget: one API call per run for its jobs, and the
          # job timings are the whole point — the composition alone would not answer the question.
          gh run list --limit 60 --json databaseId,name,event,headBranch,conclusion,createdAt \
            > demand-runs.json
          jq -c '.[]' demand-runs.json | while read -r r; do
            id=$(printf '%s' "$r" | jq -r '.databaseId')
            jobs=$(gh api "repos/{owner}/{repo}/actions/runs/$id/jobs?per_page=100" \
                     --jq '[.jobs[] | select(.startedAt != null and .startedAt != .createdAt) | {created_at:.createdAt, started_at:.startedAt}]' 2>/dev/null || echo '[]')
            printf '%s' "$r" | jq -c --argjson j "$jobs" \
              '{id:.databaseId, name, event, head_branch:.headBranch, conclusion, created_at:.createdAt, jobs:$j}'
          done | jq -s '.' > demand.json
          { echo '## CI demand'; echo; node scripts/ci/ci-demand.mjs --input demand.json; } \
            >> "$GITHUB_STEP_SUMMARY"

  # ── THE OTHER QUESTION NOBODY WAS ASKING: does the HCL match the live rulesets? ────────────────
  #
  # Same premise as the job above, different subject. Three lists of required checks have to agree —
  # infra/github/variables.tf, .mergify.yml, and the rulesets GitHub actually enforces — and the
  # third is not in the tree, so no PR-time guard can see it. Measured 2026-08-28: the live
  # protect-dev ruleset was last updated 2026-07-29 and required 9 contexts against the HCL's 11, so
  # the repository had been carrying written-down requirements that nothing enforced, for a month.
  #
  # THE PR-TIME HALF IS THE ONE THAT FAILS. check-required-checks.mjs runs in ci.yml's guards job and
  # reds a PR that puts the two in-tree lists out of step. This job covers only the half a guard
  # cannot: the fix for live drift is a `tofu apply` in infra/github/, which is the maintainer's.
  #
  # It is a deduped ISSUE rather than a log line for the reason this whole file exists — the first
  # occurrence survived because it was written down in a comment nobody re-read. A report nobody
  # reads is the same thing with more steps.
  #
  # A SEPARATE JOB, not a step in the one above, so that neither can blind the other.
  required-checks-drift:
    name: Required checks vs the live rulesets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # `|| code=$?` rather than a bare call: a `run:` step is `bash -e`, so a non-zero exit would
      # abort the step before the report could be read, and exit 2 here MEANS something.
      - name: Compare the HCL against the live rulesets
        id: drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=0
          node scripts/ci/check-required-checks.mjs --live > drift.md || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          { echo '## Required checks'; echo; cat drift.md; } >> "$GITHUB_STEP_SUMMARY"
          # 0 agree · 2 drift · anything else means it could not LOOK, which is not "no drift" and
          # must not render as one. That one does fail the job, unlike everything else in this file.
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then
            echo "::error::could not read the live rulesets — this job is blind, not clean"
            exit 1
          fi

      - name: Open or update the drift issue
        if: steps.drift.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "ci: the live branch rulesets do not require what infra/github says they do"
        run: |
          set -euo pipefail
          # --body-file, not an inline string: an indented continuation inside a double-quoted shell
          # string carries its leading whitespace into the issue, and markdown renders 4+ spaces as a
          # code block. The report job above has that wart; this one does not inherit it.
          {
            cat drift.md
            printf '\n_Refreshed by `.github/workflows/workflow-health.yml` on %s. It closes itself once an apply lands._\n' "$(date -u +%Y-%m-%d)"
          } > body.md
          # Dedup by LABEL. GitHub's search index lags by minutes and a --search-only dedup has
          # already filed a duplicate in this repo.
          # Keyed on the tracker label, never on the title — see the header. `--label` is also live
          # where `--search` lags by minutes, which is a separate trap this repo has already hit.
          matches="$(gh issue list --state open --label "tracker:required-checks-drift" --limit 100 --json number -q '.[].number' 2>/dev/null || true)"
          count="$(printf '%s' "$matches" | grep -c . || true)"
          if [ "${count:-0}" -gt 1 ]; then
            echo "::error title=duplicate tracking issues::more than one open issue carries \`tracker:required-checks-drift\`: $(printf '%s' "$matches" | tr '\n' ' ')— close all but one. Picking the first would absorb the duplicate instead of reporting it, which is how #3252 went unnoticed for three days."
            exit 1
          fi
          existing="$(printf '%s' "$matches" | head -1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "updated #$existing"
          else
            gh issue create --title "$TITLE" --label "wave:hygiene,tracker:required-checks-drift" --body-file body.md
          fi

      - name: Close it when an apply has landed
        if: steps.drift.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "ci: the live branch rulesets do not require what infra/github says they do"
        run: |
          set -euo pipefail
          # Keyed on the tracker label, never on the title — see the header. `--label` is also live
          # where `--search` lags by minutes, which is a separate trap this repo has already hit.
          matches="$(gh issue list --state open --label "tracker:required-checks-drift" --limit 100 --json number -q '.[].number' 2>/dev/null || true)"
          count="$(printf '%s' "$matches" | grep -c . || true)"
          if [ "${count:-0}" -gt 1 ]; then
            echo "::error title=duplicate tracking issues::more than one open issue carries \`tracker:required-checks-drift\`: $(printf '%s' "$matches" | tr '\n' ' ')— close all but one. Picking the first would absorb the duplicate instead of reporting it, which is how #3252 went unnoticed for three days."
            exit 1
          fi
          existing="$(printf '%s' "$matches" | head -1)"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Every ruleset now requires exactly what infra/github declares, as of $(date -u +%Y-%m-%d). Closing; this reopens itself if that changes."
            echo "closed #$existing"
          fi

  # ── AND THE THIRD QUESTION NOBODY WAS ASKING: does the worked example still RESOLVE? (#4910) ───
  #
  # Same premise as both jobs above, third subject. #4114 replaced the BYO chart dialog's fictional
  # `acme/*` examples with two real ones — the starter chart repository and a public OCI chart — and
  # pinned them three ways: an exact pin of the constants, a sweep of every wizard step for any
  # repository-shaped string that is not one of them, and an OPT-IN live fetch. The first two run in
  # ci.yml on every PR. The third ran NOWHERE, and it is the only one that can answer the question
  # the fix was actually about: a repository can be renamed, archived, made private or deleted with
  # NO file in this monorepo changing, and the other two stay green over an example that 404s. A
  # check nobody runs is a check that does not exist.
  #
  # THE VACUOUS GREEN IS THE WHOLE DIFFICULTY HERE, not an edge case. The live tests sit behind
  # `describe.runIf(process.env.ALETHIA_CHECK_LIVE_EXAMPLES === "1")`. Run that file WITHOUT the
  # variable — which is what a scheduled job that forgets to set it does — and vitest prints
  # `Test Files 1 passed`, exits 0, and reports the two live tests as `skipped`. Measured, not
  # supposed: 11 total, 9 passed, 2 pending, exit 0. A green run that fetched nothing. So the exit
  # code is NOT the verdict in this job. The verdict is read out of vitest's JSON report:
  #
  #   ok     >= 2 live tests were PRESENT, RAN and PASSED, and the file skipped nothing
  #   rot    the live tests ran and at least one FAILED  → open/update the tracking issue
  #   blind  everything else — fewer than two live tests, any skip, a missing report, or a non-zero
  #          exit with the live probes green — and that FAILS THE JOB, loudly. "I did not check"
  #          must never render as "I checked and it is fine".
  #
  # The two ok-conditions are independent on purpose, because each sees what the other cannot: the
  # COUNT catches the describe being renamed away, gutted or never collected, and the SKIP count
  # catches the environment variable being dropped — which leaves the count intact and every one of
  # them `skipped`. Either failure reds the job rather than passing it.
  #
  # WARNING, and it applies to this job more than to the two above because this job is NEW here:
  # `schedule:` fires the DEFAULT branch's copy of this file. Until this has ridden dev → staging →
  # main it runs on no schedule at all, and a green run on a feature branch is proof that the job
  # WORKS, never that it is ARMED. `workflow_dispatch` against a branch is how to exercise it before
  # then.
  #
  # A SEPARATE JOB, not a step in either above, so that no two of the three can blind each other.
  live-worked-examples:
    name: The console's worked examples still resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `|| code=$?` rather than a bare call: a `run:` step is `bash -e`, and the FAILING run is
      # precisely the one whose report the next step has to read. Nothing is judged here.
      - name: Fetch the worked examples for real
        id: live
        env:
          ALETHIA_CHECK_LIVE_EXAMPLES: "1"
          # Lifts GitHub's 60-per-hour ANONYMOUS API budget, which a hosted runner's shared egress
          # IP can exhaust for reasons that have nothing to do with the example — a 403 there would
          # file a rot report about a repository that is perfectly healthy. It grants no new access:
          # the starter chart is a DIFFERENT repository, which this token can read only while it is
          # public, and "still public" is exactly the assertion.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=0
          pnpm -F console exec vitest run \
            tests/components/design-project/byo/byo-chart-dialog.test.tsx \
            --reporter=json --outputFile="$GITHUB_WORKSPACE/live-examples.json" \
            > "$GITHUB_WORKSPACE/live-examples.log" 2>&1 || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_WORKSPACE/live-examples.log"

      - name: Verdict, read from the report rather than from the exit code
        id: verdict
        env:
          VITEST_CODE: ${{ steps.live.outputs.code }}
        run: |
          set -euo pipefail
          # The describe title the live tests live under. The coupling between this job and that
          # file is a NAME, and it fails CLOSED: rename it and `ran` is 0, which is `blind`, which
          # is a red job — never a quiet pass. The test file says so where the name is defined.
          prefix='ByoChartDialog — the worked example, fetched for real'
          report="$GITHUB_WORKSPACE/live-examples.json"
          if [ ! -s "$report" ]; then
            echo "::error title=blind::vitest wrote no JSON report, so this job checked NOTHING. That is not the same as finding nothing wrong."
            tail -n 80 "$GITHUB_WORKSPACE/live-examples.log" || true
            exit 1
          fi
          ran="$(jq --arg p "$prefix" '[.testResults[].assertionResults[]? | select(.fullName | startswith($p))] | length' "$report")"
          passed="$(jq --arg p "$prefix" '[.testResults[].assertionResults[]? | select((.fullName | startswith($p)) and .status == "passed")] | length' "$report")"
          skipped="$(jq '[(.numPendingTests // 0), (.numTodoTests // 0)] | add' "$report")"
          echo "live probes present=$ran passed=$passed | skipped anywhere in the file=$skipped | vitest exit=${VITEST_CODE:-?}"
          if [ "$ran" -lt 2 ] || [ "$skipped" != "0" ]; then
            echo "::error title=blind::expected at least 2 live probes to RUN with nothing skipped; got ran=$ran skipped=$skipped. The examples were never fetched — this is a BROKEN check reporting green, which is the defect #4910 exists to remove. Look for a dropped ALETHIA_CHECK_LIVE_EXAMPLES, a renamed describe, or a moved test file."
            tail -n 80 "$GITHUB_WORKSPACE/live-examples.log" || true
            exit 1
          fi
          if [ "$passed" -lt "$ran" ]; then
            echo "verdict=rot" >> "$GITHUB_OUTPUT"
          elif [ "${VITEST_CODE:-1}" = "0" ]; then
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
          else
            # Every live probe passed and vitest still failed: an OFFLINE layer in the same file is
            # red, so the pins and the probe disagree and this run cannot be read either way.
            echo "::error title=blind::the live probes passed but vitest exited ${VITEST_CODE}. An offline layer in the same file is red, so this run says nothing trustworthy about the examples."
            tail -n 80 "$GITHUB_WORKSPACE/live-examples.log" || true
            exit 1
          fi

      - name: Open or update the rot issue
        if: steps.verdict.outputs.verdict == 'rot'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "console: the BYO chart dialog's worked example no longer resolves"
        run: |
          set -euo pipefail
          prefix='ByoChartDialog — the worked example, fetched for real'
          # --body-file, and built with `printf` on SINGLE-quoted lines rather than a heredoc: a
          # heredoc body has to sit at column 0 for bash and at the block-scalar indent for YAML,
          # and those two cannot both be true — the first draft of this step took the whole file
          # out with `Implicit keys need to be on a single line`. Single quotes also mean the
          # backticks below are markdown, not command substitution.
          #
          # Code blocks are INDENTED rather than fenced: an indented continuation inside a
          # double-quoted shell string carries its leading whitespace into the issue, and the report
          # job above has that wart. This one does not inherit it.
          {
            printf '%s\n' \
              'The BYO chart dialog hands a user a worked example to copy. It was fetched for real,' \
              'and it did not answer. Until it does, the first thing a user meets in the' \
              'bring-your-own-chart flow is an example that does not work.' \
              ''
            jq -r --arg p "$prefix" '
              [.testResults[].assertionResults[]? | select((.fullName | startswith($p)) and .status != "passed")][]
              | "### " + .title, "",
                (((.failureMessages // ["(no failure message was recorded)"]) | join("\n") | split("\n") | map("    " + .))[]),
                ""
            ' "$GITHUB_WORKSPACE/live-examples.json"
            printf '%s\n' \
              'The three constants are exported from' \
              '`apps/console/components/design-project/byo/byo-chart-dialog.tsx`. Fix the example' \
              'there — fetch the new value BEFORE you write it down — and re-pin it in' \
              '`apps/console/tests/components/design-project/byo/byo-chart-dialog.test.tsx`.' \
              'Reproduce with:' \
              '' \
              '    ALETHIA_CHECK_LIVE_EXAMPLES=1 pnpm -F console exec vitest run tests/components/design-project/byo/byo-chart-dialog.test.tsx' \
              ''
            printf '_Refreshed by `.github/workflows/workflow-health.yml` on %s. It closes itself once the example resolves again._\n' "$(date -u +%Y-%m-%d)"
          } > body.md
          { echo '## Worked examples'; echo; cat body.md; } >> "$GITHUB_STEP_SUMMARY"
          # Dedup by LABEL, never by title or by --search: the search index lags by minutes and a
          # --search-only dedup has already filed a duplicate in this repo (#3252).
          matches="$(gh issue list --state open --label "tracker:worked-example-rot" --limit 100 --json number -q '.[].number' 2>/dev/null || true)"
          count="$(printf '%s' "$matches" | grep -c . || true)"
          if [ "${count:-0}" -gt 1 ]; then
            echo "::error title=duplicate tracking issues::more than one open issue carries \`tracker:worked-example-rot\`: $(printf '%s' "$matches" | tr '\n' ' ')— close all but one. Picking the first would absorb the duplicate instead of reporting it, which is how #3252 went unnoticed for three days."
            exit 1
          fi
          existing="$(printf '%s' "$matches" | head -1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "updated #$existing"
          else
            gh issue create --title "$TITLE" --label "wave:hygiene,tracker:worked-example-rot" --body-file body.md
          fi

      - name: Close it once the example resolves again
        if: steps.verdict.outputs.verdict == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '## Worked examples' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Fetched for real: every worked example the BYO chart dialog offers still resolves." >> "$GITHUB_STEP_SUMMARY"
          # Keyed on the tracker label, never on the title — see the header.
          matches="$(gh issue list --state open --label "tracker:worked-example-rot" --limit 100 --json number -q '.[].number' 2>/dev/null || true)"
          count="$(printf '%s' "$matches" | grep -c . || true)"
          if [ "${count:-0}" -gt 1 ]; then
            echo "::error title=duplicate tracking issues::more than one open issue carries \`tracker:worked-example-rot\`: $(printf '%s' "$matches" | tr '\n' ' ')— close all but one. Picking the first would absorb the duplicate instead of reporting it, which is how #3252 went unnoticed for three days."
            exit 1
          fi
          existing="$(printf '%s' "$matches" | head -1)"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The worked example was fetched for real and resolves, as of $(date -u +%Y-%m-%d). Closing; this reopens itself if that changes."
            echo "closed #$existing"
          fi
