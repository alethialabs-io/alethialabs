#
# Refresh PROGRAMME.md's live half.
#
# PROGRAMME.md is the one file a session reads to know where the MVP programme stands. Most of it is
# derived from the tree by scripts/programme-rollup.mjs and diff-gated on every PR. Two things it
# cannot derive offline — whether a cited issue is still OPEN, and whether a gate variable is SET —
# come from `scripts/programme-fetch.sh`, which commits them as docs/testing/programme-snapshot.json.
#
# WHY A COMMITTED SNAPSHOT AND NOT A LIVE QUERY IN THE PR GATE. A diff gate whose input is a live
# GitHub read is flaky by construction: the same PR would be "stale" or "in sync" depending on whether
# somebody relabelled an issue while CI ran, and every PR's status would depend on the board. So the
# live read happens once, here, and everything downstream stays a pure function of files in the tree.
#
# IT OPENS A PR; IT NEVER PUSHES. CLAUDE.md invariant: `dev` takes PR merges, and Mergify lands them.
# A workflow that pushed to `dev` would also bypass the CODEOWNERS ruleset that guards
# .github/workflows/** and infra/**.
#
# COST: zero. No cloud, no provisioning — a handful of `gh` calls and a Node script.

name: Programme ledger (refresh the live half)

on:
  schedule:
    # 06:07 UTC — after the 03:17 floor nightly's 120-minute cap has expired AND after the 07:17
    # orphan reaper would have reported, so a morning read of PROGRAMME.md reflects the night that
    # just happened rather than the one before it. Off-minute per the repo's cron convention.
    - cron: "7 6 * * *"
  workflow_dispatch:

# Never two refreshes at once: the second would open a competing PR against the same branch.
concurrency:
  group: programme-ledger
  cancel-in-progress: true

# `create-pull-request` has to PUSH the refresh branch before it can open the PR against it, so
# `contents: read` is not enough — the push came back 403 ("Permission to alethialabs-io/alethialabs
# .git denied to github-actions[bot]") on every scheduled run, and the snapshot stopped refreshing.
#
# That failure is on a timer, which is the dangerous part. PROGRAMME.md's live half warns past 48
# hours and FAILS past 7 days, deliberately — "a broken refresh produces no signal at all". So a
# silently dead refresher does not just go stale, it reds `pnpm check:programme` for everyone about
# a week later, and the cause is a workflow nobody was watching.
#
# This does NOT let it write to a protected branch. The rulesets match refs/heads/{dev,main,staging}
# with empty excludes, so `chore/programme-ledger-refresh` is writable and the base branches are
# not — the same shape the coverage badges use with their orphan branch. The workflow still opens a
# PR and still never pushes to dev.
permissions:
  contents: write
  pull-requests: write
  # Reads the e2e-nightly run/job history, which is how gate reality is OBSERVED rather than
  # declared (scripts/programme-fetch.sh, the gate_observations block).
  #
  # This is the scope that exists. There is NO workflow permission that lets a GITHUB_TOKEN list
  # repo variables or secrets — not a missing grant, a token class that cannot do it — which is why
  # every refresh has committed `variables: [], secrets: []` and the board has rendered `? unknown`
  # for facts a run had already demonstrated. `actions: read` answers the better question anyway:
  # whether a leg got PAST its gate, not whether a variable is present somewhere.
  actions: read
  # Rewrites the pinned tracking epic's body (#2896) from the same render PROGRAMME.md gets, so the
  # grid is watchable from the board without cloning. Nothing else in this workflow writes issues.
  issues: write

jobs:
  refresh:
    name: Refresh the programme snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-go@v7
        with:
          go-version-file: test/e2e/go.mod
          cache: false

      # The Go spine mirror (the ceiling/debt verdicts the rollup reads) is normally refreshed on the
      # PR that changes its table. Regenerating here too means a snapshot refresh can never render
      # against a stale spine — and if it produces a diff, that is itself a finding worth a PR.
      - name: Refresh the Go spine mirror
        run: cd test/e2e && GOWORK=off go test -run 'TestProgrammeExport' ./...

      - name: Fetch the live board snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/programme-fetch.sh docs/testing/programme-snapshot.json

      - name: Render PROGRAMME.md
        run: node scripts/programme-rollup.mjs --write

      # The tracking epic is a RENDERING of what was just rendered above — not a second board.
      #
      # THE NUMBER IS HARDCODED ON PURPOSE. Finding the epic by title or label is the shape that has
      # already bitten this repo: a hand-edited title files a duplicate instead of updating, and the
      # duplicate then renders a second, diverging grid that looks equally official. A number cannot
      # drift. If the epic is ever replaced, changing it here is a one-line, deliberate edit.
      #
      # `continue-on-error`, because this is a REPORT. The snapshot refresh and its PR are the job;
      # an issue write that fails (epic closed, locked, permission changed) must not cost the tree
      # its refresh — and PROGRAMME.md, which is the actual entry point, is already correct by then.
      - name: Refresh the tracking epic (#2896)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A FRESHNESS STAMP, APPENDED AROUND THE RENDER — never inside it (#3146).
          #
          # The epic emits `render(derive(...))` VERBATIM: the same function, the same inputs and
          # the same BYTES that PROGRAMME.md's generated half gets. That is deliberate — a second
          # renderer would be a second thing to keep in step, and an epic drifting from the ledger
          # would be indistinguishable from the ledger being wrong. So the stamp cannot live in the
          # render, and it cannot live in PROGRAMME.md either: a render time is not a function of
          # the tree, and the diff gate would go stale an hour after every refresh.
          #
          # It goes HERE, in the assembly, outside the generated region. The epic is not diff-gated,
          # so it can carry what the file cannot.
          #
          # WHY IT IS NEEDED. The preamble claims this is "refreshed daily at 06:07 UTC, and by hand
          # after each dispatch". On 2026-08-28 the epic read 11 of 30 while the ledger read 14 —
          # three cells and two days stale — and NOTHING on the page said so. A reader cannot tell
          # "refreshed twenty minutes ago" from "last refreshed on Tuesday": the grid renders
          # identically either way. Three of the seven scheduled runs before that had failed, and
          # GitHub's cron is best-effort under load, so a missed refresh is normal rather than
          # exceptional.
          #
          # PROGRAMME.md §4 already legislates exactly this for the snapshot — "staleness is an
          # error eventually… it warns past 48 hours and FAILS past 7 days" — and the copy most
          # people actually read had none of that protection.
          {
            cat .github/programme-epic-preamble.md
            node scripts/programme-rollup.mjs --epic-body
            printf '\n---\n\n'
            printf '_Refreshed **%s** from `%s` by [run %s](%s/%s/actions/runs/%s)._\n' \
              "$(date -u '+%Y-%m-%d %H:%M UTC')" "$(git rev-parse --short HEAD)" \
              "${GITHUB_RUN_NUMBER}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            printf '_If that timestamp is old, this grid is old — the ledger in `PROGRAMME.md` is the source, and `pnpm gen:programme` regenerates it._\n'
          } > /tmp/epic-body.md
          gh issue edit 2896 --body-file /tmp/epic-body.md

      # `--write` exits 0 even when it found integrity failures (it writes, then reports). Re-running
      # in check mode is what surfaces them — and it must NOT abort the PR, because a PR carrying the
      # finding is exactly what we want a human to see.
      - name: Report integrity findings (never fatal here)
        continue-on-error: true
        run: node scripts/programme-rollup.mjs

      # ── THE PR MUST NOT BE AUTHORED BY GITHUB_TOKEN (#3476). ──────────────────────────────────
      # A pull request opened with the default GITHUB_TOKEN does NOT trigger other workflows, so
      # `CI`, `TypeScript` and `Authz / open-core guards` never run on it. The PR then sits with an
      # EMPTY check rollup — never red, just permanently BLOCKED and unmergeable — which reads like
      # a CI problem and is not one. Every nightly refresh since this workflow shipped has landed in
      # that state.
      #
      # Same cause, same remedy, same custody as release-please.yml:25-40 — that file's comment
      # records the identical failure on protect-main. The App-installation token makes the PR
      # App-authored, so the checks run. TAP_APP_ID / TAP_APP_PRIVATE_KEY are already used by
      # release-please.yml, mirror-cli.yml and release-cli.yml, so nothing new is trusted here.
      - name: Mint the ledger-PR token (GitHub App)
        id: ledger_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: alethialabs-io
          repositories: alethialabs

      - name: Open or update the refresh PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.ledger_token.outputs.token }}
          base: dev
          branch: chore/programme-ledger-refresh
          # A stable branch means one long-lived PR that gets updated, not a new PR every morning.
          title: "chore(programme): refresh the ledger's live half"
          commit-message: |
            chore(programme): refresh the ledger's live half

            Auto-generated by .github/workflows/programme.yml. Regenerates
            docs/testing/programme-snapshot.json (issue states + gate NAMES, never values) and
            re-renders PROGRAMME.md's generated region from it.
          body: |
            Auto-generated by `.github/workflows/programme.yml`.

            Refreshes the two things `PROGRAMME.md` cannot derive from the tree — whether a cited
            issue is still **open**, and whether a gate variable is **set** — and re-renders the
            generated region.

            **Review the diff, not the mechanism.** A change here means the programme moved: a cell
            flipped, a gate got wired, or a cited issue closed (which re-renders its cell as
            `stale` — cause fixed, needs a re-run).

            `docs/testing/programme-snapshot.json` carries variable and secret **names only**, never
            values.
          labels: |
            wave:hygiene
            lane:tests
            class:backend
            from:programme
          delete-branch: false
