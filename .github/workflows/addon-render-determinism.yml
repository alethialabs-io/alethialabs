# A chart that generates a credential at RENDER time sits permanently OutOfSync under ArgoCD, and
# rolls its pods on every reconcile if it stamps a checksum annotation. Two catalogued add-ons were
# shipping exactly that (#2822, #2823). See scripts/addons/check-render-determinism.sh.
#
# NOT part of the required per-PR rollup, and deliberately so: the sweep pulls eighteen charts from
# ten upstream Helm repositories, and an upstream outage must not red a PR that has nothing to do
# with add-ons. The chart versions are PINNED, so the answer can only change when the catalogue
# changes — which is precisely what the paths filter below keys on.
name: Add-on chart guards

on:
  pull_request:
    paths:
      - "apps/console/lib/addons/**"
      - "test/e2e/fixtures/addon_catalog.json"
      - "scripts/addons/**"
      - ".github/workflows/addon-render-determinism.yml"
  push:
    branches: [dev]
    paths:
      - "apps/console/lib/addons/**"
      - "test/e2e/fixtures/addon_catalog.json"
      - "scripts/addons/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-chart-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinism:
    name: Every add-on renders identically twice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Render each catalogued add-on twice and diff
        run: bash scripts/addons/check-render-determinism.sh
      - name: No add-on ships a credential its upstream chart publishes
        # Runs even when the determinism check fails: they detect OPPOSITE halves of the same class
        # — one finds credentials that MOVE, the other credentials that are PUBLIC and therefore
        # never move — and a run that reports only the first would hide the second.
        if: always()
        run: bash scripts/addons/check-published-defaults.sh
      - name: No add-on requests more memory than a node can give it
        # `if: always()` for the same reason as its sibling: this is a THIRD independent property of
        # the same render, and the three fail for unrelated causes. minio asked for the chart's
        # default 16Gi and simply never scheduled — neither of the checks above can see that, because
        # 16Gi is a constant (so the render is stable) and is not a credential.
        if: always()
        run: bash scripts/addons/check-resource-fit.sh
