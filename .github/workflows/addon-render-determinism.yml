# A chart that generates a credential at RENDER time sits permanently OutOfSync under ArgoCD, and
# rolls its pods on every reconcile if it stamps a checksum annotation. Two catalogued add-ons were
# shipping exactly that (#2822, #2823). See scripts/addons/check-render-determinism.sh.
#
# NOT part of the required per-PR rollup, and deliberately so: the sweep pulls 27 charts from 22
# upstream Helm repositories, and an upstream outage must not red a PR that has nothing to do with
# add-ons. The chart versions are PINNED, so the answer can only change when a chart COORDINATE
# changes — which is what the paths filter below keys on.
#
# There are TWO places a coordinate lives, and for a while this filter knew about one of them.
# #3305 taught the determinism sweep to read `test/e2e/fixtures/hetzner_data_services.json` — the
# in-cluster carriers for the database, cache, queue, registry, secret, topic and nosql KINDS,
# generated from `apps/console/lib/cloud-providers/hetzner-services.ts`. Neither path was listed
# here, so a PR that bumped a data-service chart version and regenerated that fixture ran this
# workflow ZERO times: the guard could see the second source, CI could not see the second source
# change. Harbor is rendered from BOTH, which is the whole reason the sweep was widened — so the
# filter that decides when to run it has to be as wide as the sweep itself.
name: Add-on chart guards

on:
  pull_request:
    paths:
      - "apps/console/lib/addons/**"
      - "test/e2e/fixtures/addon_catalog.*.json"
      # The SECOND chart source — see the header. The fixture is what the guards read; the .ts is
      # what generates it, and a PR that edits one without regenerating the other is exactly the
      # drift worth running on.
      - "test/e2e/fixtures/hetzner_data_services.json"
      - "apps/console/lib/cloud-providers/hetzner-services*.ts"
      - "scripts/addons/**"
      - ".github/workflows/addon-render-determinism.yml"
  push:
    branches: [dev]
    paths:
      - "apps/console/lib/addons/**"
      - "test/e2e/fixtures/addon_catalog.*.json"
      - "test/e2e/fixtures/hetzner_data_services.json"
      - "apps/console/lib/cloud-providers/hetzner-services*.ts"
      - "scripts/addons/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-chart-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinism:
    name: Every add-on renders identically twice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Render each catalogued add-on twice and diff
        run: bash scripts/addons/check-render-determinism.sh
      - name: No add-on ships a credential its upstream chart publishes
        # Runs even when the determinism check fails: they detect OPPOSITE halves of the same class
        # — one finds credentials that MOVE, the other credentials that are PUBLIC and therefore
        # never move — and a run that reports only the first would hide the second.
        if: always()
        run: bash scripts/addons/check-published-defaults.sh
      - name: No add-on requests more memory than a node can give it
        # `if: always()` for the same reason as its sibling: this is a THIRD independent property of
        # the same render, and the three fail for unrelated causes. minio asked for the chart's
        # default 16Gi and simply never scheduled — neither of the checks above can see that, because
        # 16Gi is a constant (so the render is stable) and is not a credential.
        if: always()
        run: bash scripts/addons/check-resource-fit.sh
