#
# Static validation for infra/status — status.alethialabs.io as a Cloudflare Worker (#7148): D1, KV,
# the Worker script and its bindings, the cron trigger, the DNS record and the route. Credential-free
# by design: the stack is APPLIED MANUALLY by the maintainer (packages/status/README.md, "Deploying"),
# because its token needs account-level Workers/KV/D1 scopes no CI job holds. So there is deliberately
# NO apply job here, and no Cloudflare or state credential ever touches a run.
#
# The Worker's own tests run in ci.yml's `TypeScript` job with every other workspace package
# (`turbo run test`). This workflow proves the bundle BUILDS, since the apply consumes it, and runs the
# stack's mocked `tofu test` through iac-checks.

name: Infra - Status

on:
  pull_request:
    paths:
      - "infra/status/**"
      - "packages/status/**"
      - ".github/workflows/infra-status.yml"
      - "infra/.trivyignore"
      - "infra/.tflint.hcl"
      - "infra/.trivy.yaml"
  push:
    branches: [main]
    paths:
      - "infra/status/**"
      - "packages/status/**"
  workflow_dispatch:

# `github.ref`, not the PR number: this also fires on `push`, where the number renders empty and every
# push to `main` would share one group (infra-aws-oidc.yml records the same trap).
concurrency:
  group: infra-status-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_DIR: infra/status
  TOFU_VERSION: "1.10.10"

jobs:
  validate:
    name: Bundle + validate + IaC checks (no backend, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @repo/status...

      # The bytes the maintainer's apply uploads. A Worker that does not bundle is caught here, not at
      # `tofu plan` on a laptop.
      - name: Build the Worker bundle
        run: |
          set -euo pipefail
          pnpm -F @repo/status build
          test -s packages/status/dist/worker.js

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # Against the REAL bundle just built, so the script's bundle precondition sees what an apply would.
      - name: OpenTofu validate
        working-directory: ${{ env.TF_DIR }}
        run: |
          tofu init -backend=false
          tofu validate

      - name: IaC checks (fmt + tflint + Trivy + tofu test)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: ${{ env.TF_DIR }}
