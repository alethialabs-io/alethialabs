#
# Static validation for infra/aws-e2e (the dedicated alethia-e2e AWS account: GitHub OIDC provider,
# the `alethia-e2e-nightly` role, the broker trust, the budget and the e2e DNS zone) and its
# bootstrap. Credential-free by design: both stacks create IAM, so they are APPLIED MANUALLY by a
# maintainer (invariant 4; runbook in infra/aws-e2e/README.md). There is deliberately NO apply job
# and no `id-token` permission — the run only fmt/validate/tests/lints/scans, so no cloud or state
# credential ever touches it (safe on contributor PRs).

name: Infra - AWS e2e account

on:
  pull_request:
    paths:
      - "infra/aws-e2e/**"
      - "infra/.trivyignore"
      - "infra/.tflint.hcl"
      - "infra/.trivy.yaml"
      # e2e-broker.tf reads the broker contract from this file at plan time.
      - "packages/workload-identity/src/broker.ts"
      - ".github/workflows/infra-aws-e2e.yml"
  push:
    branches: [main]
    paths:
      - "infra/aws-e2e/**"

# `github.ref`, not the PR number: this also fires on `push`, where the number renders empty and
# every push to main would collapse into one group (see infra-aws-oidc.yml).
# CONCURRENCY HYGIENE (2026-11-22): `cancel-in-progress` is true only for `pull_request`, so a push to
# the deploy branch (an apply) is never cancelled mid-flight; push runs on one ref still SERIALISE,
# and a newer push replaces a still-PENDING one, which is the apply that would have been superseded
# anyway. `github.event_name` is in the group so a dispatch never shares a group with a push.
concurrency:
  group: infra-aws-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TF_DIR: infra/aws-e2e
  TOFU_VERSION: "1.10.10"

jobs:
  validate:
    name: Validate + test + IaC checks (no backend, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu validate (bootstrap)
        working-directory: ${{ env.TF_DIR }}/bootstrap
        run: |
          tofu init -backend=false
          tofu validate

      # The test file replaces the provider with a credential-free one and overrides the one data
      # source that would call STS, so `tofu test` plans offline. It proves the committed posture and
      # that every refusal and check fires.
      - name: OpenTofu validate + test
        working-directory: ${{ env.TF_DIR }}
        run: |
          tofu init -backend=false
          tofu validate
          tofu test

      - name: IaC checks (fmt + tflint + Trivy)
        uses: ./.github/actions/iac-checks
        with:
          working-directory: ${{ env.TF_DIR }}
