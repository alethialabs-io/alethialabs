name: Deploy Console

# Continuous deploy of the alethialabs.io self-host bundle to the control-plane
# VM (Hetzner or AWS — host-agnostic via DEPLOY_HOST): build the images → push
# to GHCR (public) → SSH in and `compose pull && up -d`.

on:
  push:
    branches: [main]
    paths:
      - 'apps/console/**'
      - 'apps/marketing/**'
      - 'apps/admin/**'
      - 'apps/docs/**'
      - 'apps/blog/**'
      - 'apps/runner/**'
      - 'packages/**'
      - 'docker-compose.yml'
      - 'deploy/prod/**'
      # A deploy-workflow-only fix must be able to deploy itself. The changes job
      # retags the existing images for the new SHA, so this does not rebuild them.
      - '.github/workflows/deploy-console.yml'
  workflow_dispatch:

# SERIALIZE deploys; never cancel one. Two merges to `main` in quick succession currently run two
# full 15-job deploys concurrently, racing the same `compose pull && up -d` on the box — which is
# how a green deploy ships a half-updated stack.
#
# ⚠ `cancel-in-progress: FALSE`, deliberately, and this is the one place the default is wrong. Every
# other group added alongside this one cancels, because a superseded CI run is not evidence and
# holding a runner is its only cost. THIS workflow ssh's into the box and restarts containers:
# cancelling it mid-flight leaves the deploy half-applied, which is strictly worse than the race it
# was meant to fix. The running deploy survives; GitHub keeps only the newest pending run, so an
# intermediate push or manual redeploy can still be cancelled before it starts.
concurrency:
  group: deploy-console
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/alethialabs-io

jobs:
  # What changed in this push? Gates the expensive builds so a console-only deploy doesn't rebuild the
  # 7-8min runner images (and vice-versa). Two coarse groups: the box Next images (`apps`) and the runner
  # images (`runner`). Images whose group didn't change are re-tagged latest→sha by `retag-unchanged` so the
  # deploy's `:${sha}` pull always resolves. `packages/**` is conservatively treated as affecting the apps;
  # `packages/core` (Go, shared by the runner) additionally triggers the runner group.
  # Does the vault hold everything the deploy will REQUIRE? Answered in ~15 seconds, before a
  # single image is built.
  #
  # This exists because the answer used to arrive last. #2375 added two `exit 1` gates for vault
  # keys that were never populated; nothing in CI reads the vault, so it passed every check, reached
  # `main`, and then failed at the final step of a ~20-minute run. Production could not deploy for
  # two weeks, and each attempt rebuilt every image before telling anyone why.
  #
  # Every build job depends on this, so a missing key now costs seconds and the error is the first
  # thing in the run rather than the last.
  preflight:
    name: Preflight — the vault holds what the deploy requires
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read # checkout, and the gate receipt's read of release-gate.yml AT THE GRADED HEAD
      id-token: write # same read-only vault role the deploy uses; no stored secrets
      checks: read # the gate receipt reads the PR head's check-runs
      pull-requests: read # …and has to resolve which PR produced this commit
    env:
      ASM_SECRET_ID: alethia/prod/env
      ASM_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v7

      # THE GATE RECEIPT. Production may only receive a commit whose PR went green through the
      # browser release gate.
      #
      # This is a RECEIPT, not a re-run, and that is deliberate. Re-running the gate here is not
      # available and would not be wanted: cross-workflow `needs:` does not exist, `workflow_run`
      # changes what `github.sha` means, and it would spend a second hour on a commit already
      # validated. What it catches instead is the gap a re-run cannot see — an admin bypass, or a
      # ruleset that drifted from infra/github and stopped requiring the contexts it declares. That
      # is the #3180 shape: written-down requirements that nothing enforced, for a month.
      #
      # THE EXPECTED LEG LIST IS DERIVED, never typed. release-gate.yml's `const legs` table is the
      # one place that decides which legs exist; the repo already carries two hand-written copies of
      # it (infra/github/variables.tf's required contexts, and scripts/merge-signal-health.sh's
      # `for leg in …` loop), and a third would be the copy that decays. It is read through
      # `parseGateLegTable` from scripts/ci/check-required-checks.mjs rather than a fourth inline
      # regex: a duplicated PARSER decays the same way a duplicated list does, and that one is
      # already self-tested in CI (ci.yml runs `pnpm check:required-checks -- --self-test`). It
      # refuses an empty parse, a table it cannot find, and a duplicated leg, so "found nothing"
      # can never render here as "no legs required".
      #
      # WHICH REF EACH HALF READS — and why that is the whole design (#4476). This receipt asks two
      # questions, and they are questions about two different commits:
      #
      #   MEASUREMENT — the check-runs at `pr.head.sha`, the head of the staging→main promotion PR.
      #   EXPECTATION — the leg table at `pr.head.sha` TOO, fetched over the contents API. A
      #                 `pull_request` run resolves its workflow from the PR's HEAD (CONTRIBUTING.md
      #                 states this under the promotion checklist), so the legs that could possibly
      #                 have reported are the ones the HEAD's table defines. Reading any other ref
      #                 asks about a different file than the one that produced the answers.
      #   FLOORED BY  — the leg table in the CHECKED-OUT tree, at `github.sha` on `main`. Read from
      #                 disk, and it may only ADD to the requirement, never remove one.
      #
      # WHY NOT THE LOCAL TREE ALONE — and NOT because it lags. An earlier draft of this block
      # claimed a one-promotion lag ("main's tree is the promotion BEFORE the one that introduced
      # the leg, so a newly added leg goes ungraded for exactly one promotion"). That is FALSE and
      # is recorded here so nobody re-derives it: this workflow runs on `push: branches: [main]` and
      # `actions/checkout` carries no `ref:`, so it checks out `github.sha` — the commit the
      # promotion CREATED, not the one it replaced. A path modified only on the `staging` side
      # resolves to `staging`'s content in that tree, so the checkout already carries the head's
      # table. Walk #4266's seventh leg through it: the local-tree read required 7, not 6. The lag
      # exists only for a read of `main` WHILE the promotion PR is open, which is not this step.
      #
      # The gap that IS real is which commit the local tree is a statement about. The merge takes
      # `staging`'s copy of any path only `staging` touched, so the two trees separate exactly when
      # `main` ALSO moved release-gate.yml since the fork point — a change that reached `main`
      # outside this promotion, e.g. a hotfix merged straight into it. Then the deployed tree can
      # name a leg the head never ran; and a conflict on that file resolved toward `main`'s side can
      # DROP a leg the head did run, which is the lenient direction and is invisible to a
      # local-tree-only read. So the expectation is read at the ref that produced the answers, and
      # the deployed tree is kept as a floor that may only ADD: a leg `main` declares that the head
      # never ran is still a refusal, and the graded ref cannot shrink the requirement below what
      # the tree being deployed asks for. Both directions are loud, instead of assuming the two
      # trees are one.
      #
      # NOT the route, though it reads like one: the emergency cherry-pick CONTRIBUTING.md sanctions
      # targets `staging` — the head itself — so the merge carries it to `main` intact and the two
      # trees still agree. Naming it here would be a plausible-sounding cause that nothing produces.
      #
      # Normally they ARE one tree, and the run says so; requiring the union is the fail-closed
      # reading of the window in which they are not.
      #
      # LATEST RUN PER CONTEXT, not any run. A PR that was a draft has SKIPPED gate check-runs from
      # that period (release-gate.yml's `legs` job requires `draft == false`), and `ready_for_review`
      # then fires a real one. Both are in the list under the same name, so "did it pass" must read
      # the most recent, or an early skip either masks a later failure or a later success is ignored.
      - name: The commit being deployed went green through the release gate
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node - <<'EOF'
          const { execFileSync } = require("node:child_process");
          const { readFileSync } = require("node:fs");
          const { resolve } = require("node:path");
          const { pathToFileURL } = require("node:url");
          const sh = (a) => execFileSync("gh", a, { encoding: "utf8", maxBuffer: 32 * 1024 * 1024 });
          const repo = process.env.REPO, sha = process.env.SHA;
          const GATE = ".github/workflows/release-gate.yml";

          const receipt = async () => {
          // The parser, not a copy of it. See the header: every one of its failure modes is a THROW,
          // and each is caught below and turned into a refusal that names the ref it was reading.
          //
          // ASSERT THE SYMBOL RATHER THAN ASSUME IT. A dynamic `import()` does not link-check named
          // bindings, so a module that stopped exporting `parseGateLegTable` is not an import error:
          // the binding is `undefined` and the first call throws a TypeError inside `legsAt`, where
          // it renders as "could not read the leg table out of release-gate.yml at the graded head".
          // That verdict is right and every noun in it is wrong — release-gate.yml is intact at both
          // refs and the missing thing is in THIS tree — so the reader goes and inspects a healthy
          // file. Nothing in CI can catch the rename that causes it: check-pnpm-script-refs.mjs
          // models `pnpm` invocations and check-docs-contract.mjs models docs, neither reads an
          // `import()` written inside a workflow heredoc, and this workflow only ever runs from
          // `main` — so such a rename lands green on dev and staging and first speaks as a refused
          // production deploy. This check is the only thing that can name what actually happened.
          const PARSER = "scripts/ci/check-required-checks.mjs";
          const mod = await import(pathToFileURL(resolve(PARSER)).href);
          if (typeof mod.parseGateLegTable !== "function") {
            console.error(`::error::${PARSER} in the deployed tree ${sha} does not export \`parseGateLegTable\` (it is ${typeof mod.parseGateLegTable}). This receipt's PARSER is missing from the tree being deployed; that is NOT a statement about ${GATE}, and not a statement about the release gate at all. Land the parser alongside this workflow — a deploy-console.yml-only cherry-pick has to carry ${PARSER} too.`);
            process.exit(1);
          }
          const { parseGateLegTable } = mod;

          // ── which PR produced this commit ─────────────────────────────────────────────────────
          // ONLY a PR whose base is `main` is a receipt for a commit on main. `commits/<sha>/pulls`
          // also returns the dev PR that originally authored the change — measured: for a commit on
          // dev it returns both the merged dev PR and the open dev→staging promotion. Falling back to
          // "any merged PR" would quietly grade a DEV pr's head, where the gate does not run at all
          // (release-gate.yml fires on a dev PR only with the `release-gate:run` label), and refuse
          // the deploy while naming the wrong PR. Fail closed AND say what was found.
          //
          // It is resolved FIRST now, because its head is the ref the expectation is read from.
          const pulls = JSON.parse(sh(["api", `repos/${repo}/commits/${sha}/pulls`]));
          const pr = pulls.find((p) => p.base?.ref === "main" && p.merged_at);
          if (!pr) {
            const seen = pulls.length
              ? pulls.map((p) => `#${p.number} (base ${p.base?.ref}, ${p.merged_at ? "merged" : "open"})`).join(", ")
              : "none";
            console.error(`::error::no MERGED pull request into main contains ${sha}, so nothing can show it passed the release gate. PRs containing this commit: ${seen}. A commit that reached main outside a promotion PR is exactly the bypass this receipt exists to refuse — promote through a PR into main, or dispatch this workflow deliberately.`);
            process.exit(1);
          }
          const head = pr.head.sha;
          console.log(`commit ${sha} came from #${pr.number} (${pr.base.ref} ← ${pr.head.ref}), head ${head}`);

          // ── the leg table, named at each of the two refs ──────────────────────────────────────
          // Both reads fail CLOSED and say which ref they were reading, because "could not see the
          // gate definition" and "the gate requires nothing" are the same silence otherwise.
          //
          // The second `catch` may say "the leg table did not parse at <ref>" only because the
          // parser's existence was asserted above. Without that assertion an `undefined` callee
          // throws a TypeError here too, and this message would blame a healthy release-gate.yml at
          // the other ref for a symbol missing from the deployed tree.
          const legsAt = (where, read) => {
            let text;
            try {
              text = read();
            } catch (e) {
              console.error(`::error::could not read ${GATE} at ${where} — refusing to deploy on a gate definition this receipt cannot see. ${e.message}`);
              process.exit(1);
            }
            try {
              return parseGateLegTable(text).legs;
            } catch (e) {
              console.error(`::error::could not read the leg table out of ${GATE} at ${where} — refusing to deploy on an unknown gate. A parse that finds nothing must not read as "no legs required". ${e.message}`);
              process.exit(1);
            }
          };
          const contentsAt = (ref) => {
            const body = JSON.parse(sh(["api", `repos/${repo}/contents/${GATE}?ref=${ref}`]));
            if (body.encoding !== "base64" || typeof body.content !== "string") {
              throw new Error(`the contents API answered with encoding ${JSON.stringify(body.encoding)} rather than a base64 \`content\` string, so there is nothing to decode.`);
            }
            return Buffer.from(body.content, "base64").toString("utf8");
          };
          // EXPECTATION: the tree that RAN the gate. MEASUREMENT (below): the check-runs on the
          // same commit. FLOOR: the tree being deployed, which may only add.
          const graded = legsAt(`the graded head ${head}`, () => contentsAt(head));
          const deployed = legsAt(`the deployed tree ${sha}`, () => readFileSync(GATE, "utf8"));
          const legs = [...graded, ...deployed.filter((l) => !graded.includes(l))];
          const onlyGraded = graded.filter((l) => !deployed.includes(l));
          const onlyDeployed = deployed.filter((l) => !graded.includes(l));
          if (onlyGraded.length === 0 && onlyDeployed.length === 0) {
            console.log(`gate legs derived from ${GATE}, the same table at both refs (graded head ${head}, deployed tree ${sha}): ${legs.join(", ")}`);
          } else {
            // A promotion window. Not an error — but never silent, because it is the state in which
            // the two halves of this receipt could have disagreed.
            console.log(`::warning::${GATE} differs between the two refs this receipt reads. Graded head ${head} names: ${graded.join(", ")}. Deployed tree ${sha} names: ${deployed.join(", ")}. Requiring the union — ${legs.join(", ")} — so neither ref can lower the bar the other sets.`);
            if (onlyGraded.length) console.log(`  legs the graded head added and the deployed tree does not yet name (these are the ones a local-tree-only read would have skipped): ${onlyGraded.join(", ")}`);
            if (onlyDeployed.length) console.log(`  legs the deployed tree names that the graded head never ran: ${onlyDeployed.join(", ")}`);
          }

          // ── the latest check-run per context on that head ─────────────────────────────────────
          const runs = JSON.parse(sh(["api", `repos/${repo}/commits/${head}/check-runs?per_page=100`, "--paginate", "--slurp"]))
            .flatMap((page) => page.check_runs ?? []);
          const latest = new Map();
          for (const r of runs) {
            const prev = latest.get(r.name);
            const at = r.completed_at ?? r.started_at ?? "";
            if (!prev || at >= prev.at) latest.set(r.name, { at, conclusion: r.conclusion, url: r.html_url });
          }

          let bad = 0;
          for (const leg of legs) {
            const name = `Release gate (${leg})`;
            const got = latest.get(name);
            if (!got) {
              // Say WHICH ref asked for it, and name a remedy that CLEARS the state it is printed
              // for. A leg named at the graded head and still missing means the gate did not run.
              //
              // A leg named ONLY by the deployed tree never had a run to find, and "promote again"
              // is the one instruction that cannot fix it: `deployed` is the post-promotion tree, so
              // a leg only it names reached `main` outside the promotion being graded — a hotfix
              // merged straight into `main`, say. The next promotion's head is the same `staging`,
              // which still does not name the leg, so re-promoting REPRODUCES this refusal — one
              // full promotion cycle spent to learn that. The action that actually clears it moves
              // the leg onto the head.
              const from = graded.includes(leg)
                ? `${GATE} at the graded head ${head} names this leg`
                : `${GATE} names this leg only in the deployed tree ${sha}, not at the graded head ${head}, so the gate could not have produced it. It reached \`main\` outside the promotion this receipt grades, which means PROMOTING AGAIN REPRODUCES THIS — the next head is that same \`staging\`, still without the leg. Back-merge \`main\` into \`staging\` (or land the leg on \`dev\` and promote it forward) so the head carries the leg and the gate reports it`;
              console.error(`::error::${name} never reported on #${pr.number} (head ${head}). ${from}. Nothing measured it.`);
              bad++;
            } else if (got.conclusion !== "success") {
              console.error(`::error::${name} is "${got.conclusion}" on #${pr.number}, not success. ${got.url}`);
              bad++;
            } else {
              console.log(`✓ ${name}`);
            }
          }
          if (bad > 0) {
            // No blanket "re-promote" here either: for a leg the deployed tree alone names, that is
            // the instruction that reproduces the refusal. Each line above carries the remedy for
            // ITS leg, and they are not the same remedy.
            console.error(`::error::${bad} of ${legs.length} release-gate leg(s) did not pass for #${pr.number}. Production is not receiving this commit. Each ::error:: above names the remedy for its own leg — they differ, and none of them is a bypass.`);
            process.exit(1);
          }
          console.log(`✓ all ${legs.length} release-gate legs passed for #${pr.number} — expectation read at ${head}, measured at ${head}, floored by the deployed tree ${sha}`);
          };

          // A receipt that THREW has not said "pass". Without this an unhandled rejection is a
          // failure mode whose exit code depends on the node version, and this step's whole job is
          // to be the one thing between an unmeasured commit and production.
          receipt().catch((e) => {
            console.error(`::error::the gate receipt threw before it reached a verdict: ${(e && e.stack) || e}. That is a REFUSAL, not a pass — production is not receiving this commit.`);
            process.exit(1);
          });
          EOF

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_READER_ROLE_ARN }}
          aws-region: ${{ env.ASM_REGION }}

      # The list and the gate must move together, or this job becomes a second place to forget.
      # deploy/prod/required-vault-keys.txt is the single source of truth; this asserts the deploy
      # job's own inline assertions name exactly the same keys — no more, no less.
      # The list and the gate must move together, or this file becomes a second place to forget.
      # Fails in BOTH directions, and refuses to pass on an empty parse — see the script's header.
      - name: The required list matches the deploy's own assertions
        run: python3 scripts/ci/check-deploy-required-keys.py

      - name: Every required key is present in the vault
        run: |
          set -euo pipefail
          json="$(aws secretsmanager get-secret-value --secret-id "$ASM_SECRET_ID" --region "$ASM_REGION" --query SecretString --output text)"
          missing=0
          while read -r key; do
            # `// ""` so an absent key and a present-but-empty one are the same failure: an empty
            # value reaches the box as `KEY=` and is exactly as broken as no key at all.
            if [ -z "$(printf '%s' "$json" | jq -r --arg k "$key" '.[$k] // ""')" ]; then
              echo "::error::$key is missing or empty in $ASM_SECRET_ID"
              missing=$((missing + 1))
            fi
          done < <(grep -vE '^\s*(#|$)' deploy/prod/required-vault-keys.txt)
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing required vault key(s) missing — fix the vault, not this workflow."
            exit 1
          fi
          echo "✓ every required key present"

  changes:
    # Gated on preflight because EVERY build job needs `changes` — so one edge here puts the vault
    # check in front of the whole graph rather than repeating `needs: preflight` on each of them.
    # `changes` itself is a path filter and costs nothing, so nothing is lost by ordering it last.
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # THESE GLOBS ARE THE DEFINITION OF "this group changed", and `retag-unchanged`'s
          # staleness guard resolves against the SAME lists (see t2 `stale_check`). Keeping one
          # definition is the point: when the guard asked a broader question than the filter, a
          # console-only change made it refuse to retag the RUNNER images and the deploy was
          # skipped — see #2762.
          filters: |
            apps:
              - 'apps/console/**'
              - 'apps/marketing/**'
              - 'apps/admin/**'
              - 'apps/docs/**'
              - 'apps/blog/**'
              - 'packages/**'
              # apps/console declares @alethia/ee (workspace:*, optionalDependencies) and resolves
              # EE scope from ee/dist at runtime, so an ee/-only change genuinely changes the
              # console image. It was absent here, which meant such a change did not rebuild —
              # it RETAGGED a stale image under a fresh SHA, which is #2521's failure exactly.
              - 'ee/**'
              # A dependency bump changes what gets installed into every JS image while touching
              # no app source. Same hazard: without this it retags rather than rebuilds.
              - 'pnpm-lock.yaml'
              - 'docker-compose.yml'
              - 'deploy/prod/**'
            runner:
              - 'apps/runner/**'
              - 'packages/core/**'
              - 'infra/templates/**'

  # Native per-arch builds — NO QEMU. The control-plane box is Hetzner CX (x86) so its
  # images are linux/amd64 (built natively on ubuntu-latest); the fleet VMs are Hetzner
  # CAX (arm64) so the per-cloud runner images are linux/arm64 (built natively on the arm
  # host). `runner` runs on BOTH (co-located on the box + the fleet), so it's built once
  # per arch BY DIGEST and stitched into one multi-arch tag by `merge-runner`. Native
  # builds keep the runner's build-time `tofu init` provider/module cache on EVERY arch
  # (emulated tofu crashed `lfstack.push`, which is why the old QEMU path had to skip it).

  # amd64 box images (single-arch, tagged) — native x86. Skipped when no app/package changed.
  build-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.apps == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      # Every leg runs to completion. These matrices build INDEPENDENT images, so cancelling the
      # siblings of the first red one hides the other failures instead of saving anything useful.
      # That masking is why the 2026-07-30 console outage took 26 days: `console` and
      # `console-migrate` share the Dockerfile's `build` stage, so both always failed, but
      # fail-fast cancelled whichever lost the race — so each run surfaced exactly ONE cause, and
      # #2485 was closed on the PostHog key while the TS2307 underneath it stayed invisible.
      fail-fast: false
      matrix:
        include:
          - image: console
            file: apps/console/Dockerfile
            target: runner
          - image: console-migrate
            file: apps/console/Dockerfile
            target: migrate
          - image: docs
            file: apps/docs/Dockerfile
            target: ""
          - image: blog
            file: apps/blog/Dockerfile
            target: ""
          # Marketing public site — hosted alethialabs.io serves this behind the tunnel.
          - image: marketing
            file: apps/marketing/Dockerfile
            target: ""
          # Admin internal staff dashboard — served behind Cloudflare Access.
          - image: admin
            file: apps/admin/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # An expired POSTHOG_PERSONAL_API_KEY has now stopped production deploys twice (#2244, #2485)
      # and both times nobody noticed for ten days, because the only report of it was a line deep in
      # a buildx log. The build no longer fails on it (apps/console/next.config.ts makes the upload
      # non-fatal), which means the key can now rot silently — so say it on the run summary instead.
      # Never fails: a dead telemetry key is not a reason to withhold a release.
      - name: Check the PostHog key is still live
        if: matrix.image == 'console'
        continue-on-error: true
        env:
          PH_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          PH_HOST: ${{ vars.POSTHOG_API_HOST || 'https://eu.posthog.com' }}
        run: |
          if [ -z "$PH_KEY" ]; then
            echo "::warning::POSTHOG_PERSONAL_API_KEY is not set — the console image ships without symbolicated stack traces."
            exit 0
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $PH_KEY" "$PH_HOST/api/users/@me/" || echo 000)"
          if [ "$code" = "200" ]; then
            echo "PostHog personal API key accepted."
          elif [ "$code" = "000" ]; then
            echo "::warning::Could not reach $PH_HOST to check the PostHog key. Not treating that as a dead key."
          else
            echo "::error::POSTHOG_PERSONAL_API_KEY is invalid or expired (HTTP $code). Rotate it in repo secrets."
            echo "The build continues without symbolication; posthog-error-issues.yml stays red until it is rotated."
          fi

      - name: Build and push ${{ matrix.image }} (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
            ${{ matrix.image == 'console' && format('POSTHOG_PROJECT_ID={0}', secrets.POSTHOG_PROJECT_ID) || '' }}
          # PostHog source-map upload (console only): the personal WRITE key as a BuildKit secret so it
          # never lands in an image layer. Empty for the other matrix images (no-op).
          secrets: |
            ${{ matrix.image == 'console' && format('posthog_api_key={0}', secrets.POSTHOG_PERSONAL_API_KEY) || '' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # CAN THE IMAGE WE JUST PUSHED ACTUALLY START?
      #
      # On 2026-08-26 every Next image shipped without `@swc/helpers/esm` — next's output-file
      # tracing followed the CJS half of a dual-package export and dropped the ESM half. All five
      # apps crash-looped on boot, prod served 502 behind a healthy caddy for ~45 minutes, and this
      # workflow reported SUCCESS the whole time, because nothing between `next build` and
      # Cloudflare ever asked whether the artefact could run.
      #
      # `next build` cannot catch it: the file is present in the full node_modules it builds
      # against and missing only from the PRUNED standalone output. The defect is created by the
      # copy, so it can only be caught after it.
      #
      # Deliberately narrow. A full health check would need Postgres, auth and storage, and would
      # fail for a dozen legitimate reasons in CI — a flaky gate gets disabled, and a disabled gate
      # is worth less than none. This asserts one thing that is never acceptable: the runtime could
      # not RESOLVE a module. Placeholder env mirrors the Dockerfile's build stage so a config
      # complaint is not mistaken for a packaging one.
      # WAIT FOR THE ANSWER, DO NOT SLEEP A FIXED BUDGET.
      #
      # This step used to `sleep 12` and read `docker logs` exactly ONCE. That single read cannot
      # distinguish the two things it is standing between:
      #
      #   the image never boots        → no output, and there never will be any
      #   the image boots slower than 12s → no output YET
      #
      # Both produced the identical "container produced NO output in 12s". On 2026-08-27 that fired
      # on `marketing` at 38841e91 while console, admin, docs and blog passed the SAME probe in the
      # SAME run, and marketing had passed the previous six runs with no change to `apps/marketing`
      # — a slow boot, read as a broken image. The cost is not one red job: `deploy` needs every
      # build job, so a single flaky read SKIPS THE PRODUCTION DEPLOY. Across the last 14 runs on
      # main the deploy job actually ran 3 times.
      #
      # So: poll to a generous ceiling and return the INSTANT there is output. A healthy image still
      # answers in about a second — the ceiling is only what we are willing to wait before calling
      # silence an answer, and raising it costs nothing when nothing is wrong. This is the same
      # "a deadline is not a rejection" shape as #3028 and #3030.
      #
      # It also stops waiting on a container that has EXITED, which can produce no further output,
      # and reports the container's state in the failure — the old message said only that the probe
      # learned nothing, never whether the process died, so the failure was not diagnosable.
      - name: Smoke — the image resolves its modules
        if: matrix.image != 'console-migrate'
        env:
          IMG: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          SMOKE_CONTAINER: smoke-${{ matrix.image }}
          # Ceiling, not an expected duration — see the note above.
          SMOKE_BOOT_TIMEOUT_S: "90"
          # HOW LONG TO KEEP WATCHING AFTER THE FIRST LINE. This is the assertion, not a courtesy.
          #
          # next's standalone `start-server.js` prints the `▲ Next.js` banner and `✓ Ready in X`
          # BEFORE it requires the app bundle — its own source says so. The @swc/helpers crash this
          # step exists to catch therefore arrives AFTER the first line. A probe that stopped at
          # first output would read banner → break → grep finds nothing → green, on the exact
          # incident it was written for. So first output starts a settle window; it never ends the
          # observation.
          SMOKE_SETTLE_S: "10"
        run: |
          set -uo pipefail
          docker rm -f "$SMOKE_CONTAINER" >/dev/null 2>&1 || true

          # `docker run` failing is its own outcome. The old script had no `-e` and swallowed the
          # follow-on `docker logs` failure with `|| true`, so a container that never started
          # reported as "produced NO output" — the same message as a broken bundle.
          if ! docker run -d --name "$SMOKE_CONTAINER" \
            -e NODE_ENV=production -e PORT=3000 -e HOSTNAME=0.0.0.0 \
            -e BETTER_AUTH_SECRET=smoke -e BETTER_AUTH_URL=http://localhost:3000 \
            -e ALETHIA_DATABASE_URL=postgres://smoke:smoke@127.0.0.1:5432/smoke \
            -e ALETHIA_APP_DATABASE_URL=postgres://smoke:smoke@127.0.0.1:5432/smoke \
            -e ALETHIA_STORAGE_ENDPOINT=http://127.0.0.1:8333 \
            -e ALETHIA_STORAGE_ACCESS_KEY_ID=smoke -e ALETHIA_STORAGE_SECRET_ACCESS_KEY=smoke \
            "$IMG" >/dev/null; then
            echo "::error::${{ matrix.image }}: docker run failed — the container never started, so the image was never probed."
            exit 1
          fi

          MODULE_ERR='Cannot find module|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND'
          started_at=$SECONDS
          deadline=$((SECONDS + SMOKE_BOOT_TIMEOUT_S))
          logs=""
          settle_until=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            # `docker logs` merges the CONTAINER's stdout and stderr — and node writes an uncaught
            # module error to stderr, so both are needed. But `docker`'s OWN failure must not be
            # mistaken for container output: on a daemon hiccup `2>&1` would capture "Error response
            # from daemon: …", which is non-empty text the container never said. Gate on the exit
            # code, which is docker's, and treat its failure as "nothing observed yet".
            if ! logs="$(docker logs "$SMOKE_CONTAINER" 2>&1)"; then
              logs=""
            fi

            # A module error is decisive the instant it appears — stop and report it.
            printf '%s' "$logs" | grep -qE "$MODULE_ERR" && break

            # An exited container can produce no further output; waiting longer learns nothing.
            [ "$(docker inspect -f '{{.State.Status}}' "$SMOKE_CONTAINER" 2>/dev/null || echo unknown)" = "exited" ] && break

            # First output STARTS the settle window rather than ending the watch — see SMOKE_SETTLE_S.
            if [ -n "$logs" ]; then
              [ -z "$settle_until" ] && settle_until=$((SECONDS + SMOKE_SETTLE_S))
              [ "$SECONDS" -ge "$settle_until" ] && break
            fi
            sleep 1
          done
          waited=$((SECONDS - started_at))
          status="$(docker inspect -f '{{.State.Status}}' "$SMOKE_CONTAINER" 2>/dev/null || echo unknown)"
          state="$(docker inspect -f '{{.State.Status}} (exit {{.State.ExitCode}})' "$SMOKE_CONTAINER" 2>/dev/null || echo 'unknown (exit ?)')"
          docker rm -f "$SMOKE_CONTAINER" >/dev/null 2>&1 || true

          # The assertion. `Cannot find module` / MODULE_NOT_FOUND means the image is unrunnable no
          # matter what else is true, and no env var can explain it away.
          if printf '%s' "$logs" | grep -qE "$MODULE_ERR"; then
            echo "::error::${{ matrix.image }}: the pushed image cannot resolve its modules — the standalone bundle is incomplete."
            printf '%s\n' "$logs" | grep -E "$MODULE_ERR|path:" | head -10
            exit 1
          fi

          # Vacuity guard: no logs at all means the probe learned nothing, and "learned nothing"
          # must not read as "nothing wrong" — that is the exact shape this step exists to end.
          # Still fail-closed; it now takes up to ${SMOKE_BOOT_TIMEOUT_S}s of silence, not 12, and
          # says what the container was doing when we gave up.
          if [ -z "$logs" ]; then
            echo "::error::${{ matrix.image }}: container produced NO output in ${waited}s (state: ${state}) — cannot conclude the image starts."
            exit 1
          fi

          # A container that spoke and then DIED has not started. Every image this step probes is a
          # long-running server (console-migrate, the one that legitimately exits, is excluded
          # above), so anything but `running` here is a crash — including a crash-loop whose stack
          # trace we simply did not match. Without this the exit code was decorative: a container
          # could print one line, die, and still be reported as starting.
          if [ "$status" != "running" ]; then
            echo "::error::${{ matrix.image }}: container produced output but is ${state} after ${waited}s — it started and did not stay up."
            printf '%s\n' "$logs" | tail -20
            exit 1
          fi
          echo "✓ ${{ matrix.image }}: starts and resolves its modules (watched ${waited}s, state: ${state})"

  # Shared runner BASE — the Go binary + tofu + infracost + kubectl/helm + user + shared templates that all
  # four runner images used to re-download 4×. Built once per arch (native, by digest) then stitched into a
  # multi-arch tag the runner images build FROM. Gated on the runner group like the rest.
  runner-base-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runner-base (amd64) by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile.base
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/runner-base,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runner-base-amd64
          cache-to: type=gha,mode=max,scope=runner-base-amd64

  runner-base-arm64:
    needs: changes
    if: ${{ needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runner-base (arm64) by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile.base
          platforms: linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/runner-base,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runner-base-arm64
          cache-to: type=gha,mode=max,scope=runner-base-arm64

  # Stitch the runner-base digests into the multi-arch tag the runner images build FROM.
  merge-runner-base:
    needs: [changes, runner-base-amd64, runner-base-arm64]
    if: ${{ needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch runner-base manifest
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_PREFIX}/runner-base:${{ github.sha }}" \
            -t "${IMAGE_PREFIX}/runner-base:latest" \
            "${IMAGE_PREFIX}/runner-base@${{ needs.runner-base-amd64.outputs.digest }}" \
            "${IMAGE_PREFIX}/runner-base@${{ needs.runner-base-arm64.outputs.digest }}"

  # Per-cloud runner images — MULTI-ARCH (arm64 + amd64), so the fleet can run them on either arch
  # (it prefers cheap ARM `cax` but fails over to x86 `cpx` when ARM is out — lib/fleet/hcloud.ts).
  # Built NATIVELY per arch and stitched, mirroring runner-base/runner: the per-cloud layer runs
  # `tofu init`, and the amd64 `tofu` binary CRASHES under QEMU emulation (`fatal error:
  # lfstack.push`), so emulation is not an option — amd64 on the x86 runner, arm64 on the arm runner.
  # Each half pushes a per-arch tag (:${sha}-<arch>); merge-runner-images stitches them into :latest/:${sha}.
  build-runner-amd64:
    needs: [changes, merge-runner-base]
    if: ${{ needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      # See build-amd64: one red leg must not cancel the others, or it hides the rest.
      fail-fast: false
      matrix:
        include:
          - { image: runner-aws, file: apps/runner/Dockerfile.aws }
          - { image: runner-gcp, file: apps/runner/Dockerfile.gcp }
          - { image: runner-azure, file: apps/runner/Dockerfile.azure }
          - { image: runner-alibaba, file: apps/runner/Dockerfile.alibaba }
          - { image: runner-hetzner, file: apps/runner/Dockerfile.hetzner }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }} (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
            RUNNER_BASE=${{ env.IMAGE_PREFIX }}/runner-base:${{ github.sha }}
            # The FINAL multi-arch tag, never the per-arch one this job pushes: this ref gets
            # baked in and is later rendered as a sidecar on the CUSTOMER's nodes (#1787).
            SELF_IMAGE=${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}-amd64
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64

  build-runner-arm64:
    needs: [changes, merge-runner-base]
    if: ${{ needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      # See build-amd64: one red leg must not cancel the others, or it hides the rest.
      fail-fast: false
      matrix:
        include:
          - { image: runner-aws, file: apps/runner/Dockerfile.aws }
          - { image: runner-gcp, file: apps/runner/Dockerfile.gcp }
          - { image: runner-azure, file: apps/runner/Dockerfile.azure }
          - { image: runner-alibaba, file: apps/runner/Dockerfile.alibaba }
          - { image: runner-hetzner, file: apps/runner/Dockerfile.hetzner }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }} (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
            RUNNER_BASE=${{ env.IMAGE_PREFIX }}/runner-base:${{ github.sha }}
            # The FINAL multi-arch tag, never the per-arch one this job pushes: this ref gets
            # baked in and is later rendered as a sidecar on the CUSTOMER's nodes (#1787).
            SELF_IMAGE=${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}-arm64
          cache-from: type=gha,scope=${{ matrix.image }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-arm64

  # Stitch each per-cloud image's two per-arch tags into the multi-arch :latest + :${sha} tags.
  merge-runner-images:
    needs: [changes, build-runner-amd64, build-runner-arm64]
    if: ${{ needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      # See build-amd64: one red leg must not cancel the others, or it hides the rest.
      fail-fast: false
      matrix:
        image: [runner-aws, runner-gcp, runner-azure, runner-alibaba, runner-hetzner]
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch ${{ matrix.image }} manifest
        run: |
          for tag in latest "${{ github.sha }}"; do
            docker buildx imagetools create \
              -t "${IMAGE_PREFIX}/${{ matrix.image }}:${tag}" \
              "${IMAGE_PREFIX}/${{ matrix.image }}:${{ github.sha }}-amd64" \
              "${IMAGE_PREFIX}/${{ matrix.image }}:${{ github.sha }}-arm64"
          done

  # `runner` amd64 half — native x86, pushed BY DIGEST (no tag) for the manifest merge.
  runner-amd64:
    needs: [changes, merge-runner-base]
    if: ${{ needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runner (amd64) by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.sha }}
            RUNNER_BASE=${{ env.IMAGE_PREFIX }}/runner-base:${{ github.sha }}
            # The FINAL multi-arch tag, never the per-arch one this job pushes: this ref gets
            # baked in and is later rendered as a sidecar on the CUSTOMER's nodes (#1787).
            SELF_IMAGE=${{ env.IMAGE_PREFIX }}/runner:${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/runner,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runner-amd64
          cache-to: type=gha,mode=max,scope=runner-amd64

  # `runner` arm64 half — native arm, pushed BY DIGEST.
  runner-arm64:
    needs: [changes, merge-runner-base]
    if: ${{ needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build runner (arm64) by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile
          platforms: linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
            RUNNER_BASE=${{ env.IMAGE_PREFIX }}/runner-base:${{ github.sha }}
            # The FINAL multi-arch tag, never the per-arch one this job pushes: this ref gets
            # baked in and is later rendered as a sidecar on the CUSTOMER's nodes (#1787).
            SELF_IMAGE=${{ env.IMAGE_PREFIX }}/runner:${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/runner,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runner-arm64
          cache-to: type=gha,mode=max,scope=runner-arm64

  # Stitch the two runner digests into one multi-arch tag (amd64 for the box, arm64 for the fleet).
  merge-runner:
    needs: [changes, runner-amd64, runner-arm64]
    if: ${{ needs.changes.outputs.runner == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch runner manifest
        run: |
          for tag in latest "${{ github.sha }}"; do
            docker buildx imagetools create \
              -t "${IMAGE_PREFIX}/runner:${tag}" \
              "${IMAGE_PREFIX}/runner@${{ needs.runner-amd64.outputs.digest }}" \
              "${IMAGE_PREFIX}/runner@${{ needs.runner-arm64.outputs.digest }}"
          done

  # For each image group that did NOT rebuild this push, copy its current :latest to :${sha} so the deploy's
  # `:${sha}` pull resolves for every service. Cheap manifest copies (no rebuild). Runs whenever at least one
  # group was skipped; a no-op when both groups changed.
  retag-unchanged:
    needs: changes
    if: ${{ github.event_name != 'workflow_dispatch' && (needs.changes.outputs.apps != 'true' || needs.changes.outputs.runner != 'true') }}
    runs-on: ubuntu-latest
    steps:
      # Full history: the staleness guard below asks git what changed between the commit an image
      # was built from and this one, which needs both commits present.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag unchanged images latest → sha
        env:
          SHA: ${{ github.sha }}
          APPS_CHANGED: ${{ needs.changes.outputs.apps }}
          RUNNER_CHANGED: ${{ needs.changes.outputs.runner }}
        run: |
          set -euo pipefail

          # Retagging is only honest when `latest` really was built from code equivalent to this
          # commit for the paths this group covers. It is NOT a fallback for a group whose build
          # failed — and on 2026-08-13 it silently became one: `apps/**` was unchanged in that push,
          # so this job faithfully retagged a `console:latest` that was 14 days and 13 failed builds
          # old onto the new SHA, `deploy` shipped it, and the run reported success. Production ran
          # 2026-07-30 code for 26 days while `:${sha}` on the box named a commit it did not contain.
          #
          # So: read the commit the candidate image was actually built from (ALETHIA_SOURCE_COMMIT,
          # set from VERSION in the Dockerfile) and refuse to retag if real code moved since.
          # THE PATHS EACH GROUP IS BUILT FROM. These MIRROR the `changes` job's paths-filter, and
          # the two must move together — that is the whole fix for #2762.
          #
          # This guard used to ask ONE question for both groups: "did apps/, packages/, ee/ or the
          # lockfile change?". But the dispatch below is PER GROUP, so the guard and the filter
          # could disagree — and they did. On 2026-08-26 the #2758 promotion changed
          # packages/email/src/config.ts and apps/console/tests/lib/email (console-only). The
          # filter correctly said the runner group was unchanged and skipped all ten runner jobs;
          # the guard then refused to retag the runner images because `packages/` had moved. The
          # job failed, `deploy` is gated `!cancelled() && !failure()`, and production never
          # received the promotion.
          #
          # It also asserted the wrong cause: "the last build of this group FAILED and latest is
          # stale". The runner build had not failed. The runner group simply had not changed, so
          # its latest is legitimately older than HEAD. A guard that names a cause it has not
          # established sends the reader looking for a failure that does not exist.
          #
          # The correct question is per group: did anything THIS image is built from move since
          # the commit its latest was built at?
          APPS_PATHS="apps/console apps/marketing apps/admin apps/docs apps/blog packages/ ee/ pnpm-lock.yaml docker-compose.yml deploy/prod/"
          RUNNER_PATHS="apps/runner packages/core infra/templates"

          stale_check() {
            local img="$1" paths="$2" ref="${IMAGE_PREFIX}/$1:latest" built
            built="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '.. | .Env? // empty | .[]? | select(startswith("ALETHIA_SOURCE_COMMIT=")) | sub("^ALETHIA_SOURCE_COMMIT=";"")' \
              | head -n1)"
            if [ -z "$built" ] || [ "$built" = dev ]; then
              echo "::warning::$img:latest carries no usable ALETHIA_SOURCE_COMMIT — cannot prove it is current; retagging anyway."
              return 0
            fi
            if ! git cat-file -e "${built}^{commit}" 2>/dev/null; then
              echo "::warning::$img:latest names commit ${built}, which is not in this repository's history; retagging anyway."
              return 0
            fi
            # Unquoted on purpose — $paths is a space-separated pathspec list, and quoting it would
            # hand `git diff` one pathspec containing spaces, which matches nothing. A pathspec that
            # matches nothing makes `--quiet` always succeed, so the guard would pass on everything:
            # the exact silent-green shape it exists to prevent.
            # shellcheck disable=SC2086
            if ! git diff --quiet "${built}" "${SHA}" -- $paths; then
              echo "::error::REFUSING to retag ${img}: its latest was built from ${built}, and paths this image is built from have changed between that commit and ${SHA}:"
              # `|| true` because `pipefail` + `set -e` would otherwise let head(1) closing the pipe
              # early abort the whole step on SIGPIPE, losing the return 1 below and every image
              # after this one. Naming the files is a courtesy; it must not decide the verdict.
              git diff --name-only "${built}" "${SHA}" -- $paths 2>/dev/null | head -20 | sed 's/^/::error::  /' || true
              echo "::error::latest is stale for this group. Retagging it would ship old code under a new SHA — rebuild instead."
              echo "::error::If those paths do NOT feed this image, the group's path list here and the changes filter have drifted apart (#2762)."
              return 1
            fi
          }

          retag() {
            stale_check "$1" "$2" || return 1
            echo "retag $1: latest -> ${SHA}"
            docker buildx imagetools create -t "${IMAGE_PREFIX}/$1:${SHA}" "${IMAGE_PREFIX}/$1:latest"
          }
          rc=0
          if [ "${APPS_CHANGED}" != "true" ]; then
            for img in console console-migrate docs blog marketing admin; do retag "$img" "$APPS_PATHS" || rc=1; done
          fi
          if [ "${RUNNER_CHANGED}" != "true" ]; then
            for img in runner runner-aws runner-gcp runner-azure runner-alibaba runner-hetzner; do retag "$img" "$RUNNER_PATHS" || rc=1; done
          fi
          # Report EVERY stale image, not just the first. `set -e` is active, so `retag` returning
          # 1 inside the loop used to abort the step immediately — run 32942599508 named `runner`
          # and stopped, saying nothing about the five runner images behind it. `|| rc=1` keeps the
          # sweep going and `exit $rc` still fails the job, so one run now lists everything that
          # needs rebuilding instead of surfacing them one promotion at a time.
          exit $rc

  deploy:
    needs: [changes, build-amd64, merge-runner-images, merge-runner, retag-unchanged]
    # Run when the build/retag jobs succeeded OR were skipped (a skipped group is retagged instead of built);
    # only a real FAILURE (or cancel) blocks the deploy. Without this, a skipped `needs` job would auto-skip
    # deploy.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # assume the read-only vault role via GitHub OIDC — no stored secrets
    env:
      IMAGE_TAG: ${{ github.sha }}
      APPS_CHANGED: ${{ needs.changes.outputs.apps }}
      ASM_SECRET_ID: alethia/prod/env
      ASM_REGION: eu-central-1
    steps:
      # Read-only OIDC role (infra/aws-oidc → alethia-deploy-reader): GetSecretValue on
      # the one secret. GitHub stores NO secrets; the box never sees AWS creds.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_READER_ROLE_ARN }}
          aws-region: ${{ env.ASM_REGION }}

      - name: Assemble .env from the vault and deploy
        run: |
          set -euo pipefail
          json="$(aws secretsmanager get-secret-value --secret-id "$ASM_SECRET_ID" --region "$ASM_REGION" --query SecretString --output text)"
          val() { printf '%s' "$json" | jq -r --arg k "$1" '.[$k] // ""'; }

          HOST="$(val DEPLOY_HOST)"
          [ -n "$HOST" ] || { echo "::error::DEPLOY_HOST not in $ASM_SECRET_ID yet — run infra-cp-hetzner (provision) first."; exit 1; }
          APP_URL="$(val PUBLIC_APP_URL)"; APP_URL="${APP_URL:-https://alethialabs.io}"
          SERVER_TYPE="$(val HCLOUD_SERVER_TYPE)"; SERVER_TYPE="${SERVER_TYPE:-cax21}"
          PUBLIC_PHONE="$(val ALETHIA_PUBLIC_PHONE)"
          [ -n "$PUBLIC_PHONE" ] || { echo "::error::ALETHIA_PUBLIC_PHONE is required for the production company-information surface."; exit 1; }
          RESEND_KEY="$(val RESEND_API_KEY)"
          [ -n "$RESEND_KEY" ] || { echo "::error::EMAIL_PROVIDER=resend requires RESEND_API_KEY."; exit 1; }

          # Sender addresses — vault first, apex fallback. The fallback domain MUST be one the
          # provider has verified; a subdomain here is rejected at send time, long after this job
          # has reported success. See the note at the emit site below.
          AUTH_FROM="$(val AUTH_EMAIL_FROM)"; AUTH_FROM="${AUTH_FROM:-Alethia <no-reply@alethialabs.io>}"
          GENERAL_FROM="$(val EMAIL_FROM)"; GENERAL_FROM="${GENERAL_FROM:-Alethia <hello@alethialabs.io>}"

          # SSH private key from the vault (never touches the runner env / logs).
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          val DEPLOY_SSH_PRIVATE_KEY > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Assemble .env locally, then scp it to the box. Internal service URLs
          # (Postgres/SeaweedFS) come from the compose files, not here.
          umask 077
          emit() { printf '%s=%s\n' "$1" "$(val "${2:-$1}")"; }
          {
            echo "NEXT_PUBLIC_APP_URL=$APP_URL"
            echo "BETTER_AUTH_URL=$APP_URL"
            echo "NEXT_PUBLIC_SITE_URL=$APP_URL"
            echo "NEXT_PUBLIC_LEGAL_URL=$APP_URL"
            # This IS the hosted control plane. Without it deploymentMode() defaults to "self-managed"
            # (lib/billing/config.ts), which hides the feedback widget and exposes self-managed runner /
            # fleet UI to customers. Constant here — the box is always hosted.
            echo "ALETHIA_DEPLOYMENT_MODE=hosted"
            emit ALETHIA_PUBLIC_PHONE
            emit BETTER_AUTH_SECRET
            # Stable Next.js Server Actions encryption key — shared by console/admin/marketing (one
            # .env, one env_file). Unset ⇒ random per build ⇒ "Server Action was not found" skew when
            # a page is open across a deploy. Generated once into the vault by bootstrap-secrets.sh.
            emit NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
            emit CLI_JWT_SECRET
            # Auth brute-force rate-limit kill-switch (default on; set =0 in the vault to disable).
            # Emit so the disable path actually reaches the console.
            emit ALETHIA_AUTH_RATE_LIMIT
            emit ALETHIA_CRED_ENCRYPTION_KEY
            # config_snapshot authenticity HMAC (lib/runners/snapshot-sig.ts). Absent → signing off.
            emit ALETHIA_SNAPSHOT_HMAC_KEY
            # Credential-encryption key id (keyring) for ONLINE key rotation. Defaults to "1" if the
            # vault key is absent (secrets.ts falls back), so this emit is safe even when unset.
            emit ALETHIA_CRED_ENCRYPTION_KID
            # To ROTATE the credential key with no downtime: add the previous active key to the vault as
            # ALETHIA_CRED_ENCRYPTION_KEY_<oldkid>, add an `emit ALETHIA_CRED_ENCRYPTION_KEY_<oldkid>`
            # line here, set the new active key + bump ALETHIA_CRED_ENCRYPTION_KID, deploy, then run
            # `pnpm -C apps/console run db:reencrypt` on the box. Drop the retired key + its emit line once every
            # row has been re-encrypted. See lib/crypto/secrets.ts for the runbook + ordering.
            echo "ALETHIA_DB_USER=alethia"
            echo "ALETHIA_DB_NAME=alethia"
            emit ALETHIA_DB_PASSWORD
            emit ALETHIA_APP_DB_PASSWORD
            emit OPENFGA_DB_PASSWORD
            emit ALETHIA_STORAGE_ACCESS_KEY_ID
            emit ALETHIA_STORAGE_SECRET_ACCESS_KEY
            echo "ALETHIA_STORAGE_AUTO_CREATE_BUCKETS=true"
            emit TUNNEL_TOKEN
            # PostHog — the all-in-one suite (analytics + replay + web vitals). One external project key;
            # host defaults to eu.i.posthog.com. When set, the console runs PostHog (leave Umami unset).
            emit NEXT_PUBLIC_POSTHOG_KEY
            emit NEXT_PUBLIC_POSTHOG_HOST
            # Structured logs → PostHog Logs over OTLP (lib/observability/otel.ts). Unset ⇒ emitted empty
            # ⇒ the logs provider never registers (the pino→OTel bridge stays a no-op). Endpoint is
            # https://eu.i.posthog.com/i/v1/logs; headers carry `Authorization=Bearer <phc_ project key>`.
            emit OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
            emit OTEL_EXPORTER_OTLP_LOGS_HEADERS
            # --- Operability suite (the ~19-PR program). Every one is OFF unless its value is set in the
            # vault: unset ⇒ emitted empty ⇒ the code's gate treats it as disabled (like the AI keys /
            # analytics above). Without these lines the vault vars could never reach the box's .env, so
            # the whole suite would be un-enable-able in prod (the prod-env-emit-gaps trap). ---
            # Generic OTel collector seam and first-party operational controls. Hosted production does
            # not configure the dormant Sentry/GlitchTip adapter.
            emit OTEL_EXPORTER_OTLP_ENDPOINT
            emit OTEL_SERVICE_NAME
            emit ALETHIA_PLATFORM_ALERT_ORG_ID
            emit ALETHIA_LOG_LEVEL
            # Break-glass privileged-recovery surface — DEFAULT-OFF (404 unless ENABLED="true"): the master
            # switch, the operator allowlist (distinct from support staff), the CF-Access proxy secret, and
            # the orphan-clean arm flag (still 501 even when armed). State-surgery's runner arm flag +
            # ALETHIA_CANCEL_GRACE_SECONDS live in the runner's env, not the console .env.
            emit ALETHIA_BREAKGLASS_ENABLED
            emit BREAKGLASS_OPERATORS
            emit BREAKGLASS_ACCESS_PROXY_SECRET
            emit ALETHIA_BREAKGLASS_ORPHAN_CLEAN_ENABLED
            # Reconcile/GC tunables — safe code defaults (converge 5m; log 30d; fleet_actions 90d), set
            # only to override.
            emit ALETHIA_CONVERGE_MIN_AGE_MINUTES
            emit ALETHIA_JOB_LOG_RETENTION_DAYS
            emit ALETHIA_FLEET_ACTION_RETENTION_DAYS
            # Managed runner fleet is OFF by default (no warm Hetzner VMs billed when there
            # are no prod users). A non-"hcloud" value makes the in-app scaler a no-op
            # (getFleetProvider → ManualFleetProvider). Re-enable purely from the vault by
            # setting FLEET_PROVIDER=hcloud in alethia/prod/env — no code change/redeploy-PR needed.
            FLEET_PROVIDER_VAL="$(val FLEET_PROVIDER)"
            echo "FLEET_PROVIDER=${FLEET_PROVIDER_VAL:-manual}"
            echo "HCLOUD_TOKEN=$(val HCLOUD_FLEET_TOKEN)"   # runtime fleet token (not the CP token)
            emit FLEET_POOLS                                 # declarative warm-pool set → seedFleetPoolsFromEnv on boot
            emit HCLOUD_SSH_KEYS
            echo "HCLOUD_SERVER_TYPE=$SERVER_TYPE"
            echo "FLEET_RUNNER_IMAGE_TAG=latest"
            echo "FLEET_RUNNER_SLOTS=1"
            emit ALETHIA_RUNNER_BOOTSTRAP_TOKEN
            emit ALETHIA_CRON_SECRET
            emit RELEASE_API_SECRET
            # Workload-identity OIDC issuer signing key (lib/oidc/issuer.ts) — powers keyless Azure +
            # Alibaba federation. Auto-generated by bootstrap-secrets.sh; served via /api/oidc JWKS.
            emit ALETHIA_OIDC_SIGNING_KEY
            # Second, published-but-not-signing key set ONLY during a rotation (scripts/rotate-oidc-key.sh)
            # so the outgoing key keeps verifying in-flight assertions through the overlap. Empty otherwise.
            emit ALETHIA_OIDC_SIGNING_KEY_PREVIOUS
            # Signs the evidence receipt (packages/core/verify, SigningKeyFromEnv). Auto-generated by
            # bootstrap-secrets.sh. Absent, signing degrades SILENTLY: the apply still succeeds and
            # still attaches a receipt, but with algorithm:"none" — evidence that proves nothing.
            emit ALETHIA_RECEIPT_SIGNING_KEY
            # Evidence receipt Rekor anchoring (#885, lib/evidence/receipt-anchor.ts). The anchor key
            # (ECDSA-P256) is auto-generated by bootstrap-secrets.sh; the flag/URL/log-key are set in
            # the vault by the operator to enable + point at a log. All empty ⇒ anchoring stays off.
            emit ALETHIA_REKOR_ANCHOR_ENABLED
            emit ALETHIA_REKOR_URL
            emit ALETHIA_REKOR_LOG_PUBLIC_KEY
            emit ALETHIA_RECEIPT_ANCHOR_KEY
            emit GITHUB_CLIENT_ID
            emit GITHUB_CLIENT_SECRET
            emit GOOGLE_CLIENT_ID
            emit GOOGLE_CLIENT_SECRET
            # GitLab + Bitbucket go through the genericOAuth plugin; without these the
            # plugin isn't mounted and /api/auth/sign-in/oauth2 404s. Names match what
            # lib/config/auth.ts reads (GitLab = APPLICATION_ID, Bitbucket = KEY).
            emit GITLAB_APPLICATION_ID
            emit GITLAB_SECRET
            emit BITBUCKET_KEY
            emit BITBUCKET_SECRET
            # AWS is KEYLESS and issuer-direct (like GCP/Azure/Alibaba): the customer's IAM role trusts the
            # Alethia OIDC issuer (an IAM OIDC provider), so the console + runner federate straight in via
            # AssumeRoleWithWebIdentity with a minted assertion — no platform AWS account, no static key,
            # nothing to emit. Availability tracks the OIDC issuer (cloud-connect-setup.ts). Only AWS_REGION
            # is set (the SDK wants a default region for the global STS call).
            echo "AWS_REGION=us-east-1"
            # Azure is KEYLESS + customer-side (like GCP/AWS/Alibaba): the customer creates a
            # user-assigned managed identity in their own subscription (its client id stored per
            # connection), and the console + runner authenticate AS it via a minted OIDC assertion —
            # no platform Entra app, no tenant/secret, NOTHING to emit. Availability tracks the OIDC
            # issuer (cloud-connect-setup.ts).
            # Alibaba is KEYLESS + ACCOUNT-FREE: the console assumes the customer RAM role via
            # AssumeRoleWithOIDC with a minted assertion (issuer above) — Alethia holds no Alibaba
            # account / AccessKey, so nothing is emitted; availability tracks the OIDC issuer.
            # GCP needs NO separate secret either — the customer WIF pool trusts the Alethia issuer
            # directly, so the console/runner mint a subject token (audience alethia-gcp-wif). Availability
            # tracks the OIDC issuer (cloud-connect-setup.ts).
            # AI: direct-to-provider (no Vercel AI Gateway). OPENAI_API_KEY is only used for openai/*
            # model overrides (emit tolerates empty). The paid AI tiers (Plus/Max) stay dark until
            # STRIPE_PRICE_AI_* below are set.
            #
            # ⚠️ A KEY IS NO LONGER ENOUGH (#2373). isAiConfigured() FAILS CLOSED until each provider
            # in use also has its DPA, transfer mechanism, retention and no-training commitment
            # recorded — a prompt carries the customer's infrastructure and code, and it does not
            # leave the system until what happens to it is written down. These MUST be emitted: the
            # list is hard-coded, so a variable missing from it never reaches prod and the assistant
            # would be dark with no vault value able to turn it on.
            #
            # The values are PUBLISHED on /ai-transparency, so a placeholder in the vault becomes a
            # false public statement.
            emit ANTHROPIC_API_KEY
            emit OPENAI_API_KEY
            emit ALETHIA_AI_ANTHROPIC_DPA
            emit ALETHIA_AI_ANTHROPIC_TRANSFER
            emit ALETHIA_AI_ANTHROPIC_RETENTION
            emit ALETHIA_AI_ANTHROPIC_NO_TRAINING
            emit ALETHIA_AI_OPENAI_DPA
            emit ALETHIA_AI_OPENAI_TRANSFER
            emit ALETHIA_AI_OPENAI_RETENTION
            emit ALETHIA_AI_OPENAI_NO_TRAINING
            emit STRIPE_SECRET_KEY
            emit STRIPE_WEBHOOK_SECRET
            emit NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
            emit STRIPE_PRICE_TEAM
            # Metered (usage-based) prices for managed-runner minutes — without these the usage is
            # metered but never charged through Stripe (lib/billing/config.ts meterPriceIdForPlan).
            emit STRIPE_PRICE_METER_TEAM
            emit STRIPE_PRICE_METER_ENTERPRISE
            # Standalone AI subscription prices — unset ⇒ AI Plus/Max stay dark (AI Free needs none).
            emit STRIPE_PRICE_AI_PLUS
            emit STRIPE_PRICE_AI_MAX
            # Stripe Tax toggle — emit so the vault can flip automatic_tax on WITHOUT editing this
            # workflow. Unset ⇒ emitted empty ⇒ isStripeTaxEnabled() false (lib/billing/config.ts),
            # so tax stays off. Set STRIPE_TAX_ENABLED=true in the vault ONLY after the Stripe
            # account's Tax origin + registrations are configured, else Checkout errors on session create.
            emit STRIPE_TAX_ENABLED
            # Odoo фактура (legal invoice-of-record) — both keys must be non-empty for issueFactura()
            # to post the НАП фактура (lib/billing/odoo-invoice.ts odooConfig). Unset ⇒ emitted empty
            # ⇒ odooConfig() returns null ⇒ the receipt/mirror fall back to Stripe's PDF. Strictly
            # safe default-off (needs BOTH URL + token), same "stay dark when unset" semantics as STRIPE_PRICE_AI_*.
            emit ODOO_INVOICE_URL
            emit ODOO_INVOICE_TOKEN
            # Transactional email: hosted production uses Resend while SES production
            # access remains unavailable. Self-hosted deployments retain every adapter.
            echo "EMAIL_PROVIDER=resend"
            emit RESEND_API_KEY
            # Support: staff Slack ping on a new case/reply (lib/support/slack-notify.ts). Unset → no-op.
            emit SUPPORT_SLACK_WEBHOOK_URL
            # Admin staff dashboard @ admin.alethialabs.io (apps/admin): the Cloudflare-Access allowlist
            # (apps/admin/lib/auth/staff.ts) + the console URL its case deep-links target. COMPOSE_PROFILES
            # activates the profiled `admin` service on the box (docker compose reads it from this .env).
            emit SUPPORT_STAFF_EMAILS
            echo "NEXT_PUBLIC_CONSOLE_URL=$APP_URL"
            echo "COMPOSE_PROFILES=admin"
            # Platform-operator plane (Enterprise onboarding, apps/admin /orgs → console internal
            # routes). The dedicated provisioning bearer is [auto] (bootstrap-secrets.sh, NOT the cron
            # secret); the operator + system-user are the maintainer's own account (const, not
            # secrets); the Stripe Product for enterprise line items comes from the vault ([ext]).
            emit PLATFORM_PROVISION_SECRET
            echo "PLATFORM_ADMIN_EMAILS=borislav@alethialabs.io"
            echo "PLATFORM_SYSTEM_USER_EMAIL=borislav@alethialabs.io"
            emit STRIPE_ENTERPRISE_PRODUCT_ID
            # SENDER ADDRESSES COME FROM THE VAULT. They used to be hardcoded here, on two
            # SUBDOMAINS (no-reply@auth. and hello@mail.), and that silently broke every send.
            #
            # Resend verifies each domain SEPARATELY — verifying `alethialabs.io` does not cover
            # `auth.alethialabs.io` or `mail.alethialabs.io`, and the account has one domain slot.
            # So a valid RESEND_API_KEY was necessary but NOT sufficient: mail would still have been
            # rejected at the provider as an unverified sender, after the deploy reported success.
            #
            # Hardcoding them here also meant the vault's own AUTH_EMAIL_FROM / EMAIL_FROM were dead
            # values that DISAGREED with what shipped (no-reply@ vs hello@) — two sources of truth,
            # one of them inert and neither obviously so.
            #
            # Vault-driven with an apex fallback (the same `${X:-default}` shape this job already
            # uses for PUBLIC_APP_URL and HCLOUD_SERVER_TYPE), so the eventual switch back to SES —
            # which verifies subdomains differently — is a vault edit rather than a PR.
            echo "AUTH_EMAIL_FROM=$AUTH_FROM"
            echo "EMAIL_FROM=$GENERAL_FROM"
            echo "ALETHIA_IMAGE_TAG=$IMAGE_TAG"
          } > env.deploy

          SSHOPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          # Free disk FIRST — the box can fill so completely that even scp'ing the few-KB
          # .env fails ("write remote: Failure"). Prune all UNUSED images + build cache
          # over ssh before anything writes to the box (running images are protected;
          # rollback re-pulls from GHCR). Must run before the scp below.
          ssh $SSHOPTS "root@${HOST}" 'df -h /; docker image prune -af || true; docker builder prune -af || true; df -h /'
          scp $SSHOPTS env.deploy "root@${HOST}:/opt/alethia/.env.new"
          rm -f env.deploy

          # On the box: checkout the built SHA, swap in .env, render s3.json from the
          # same storage creds (checkout -f resets that tracked file), compose up behind
          # the tunnel. `bash -s` gets IMAGE_TAG + the apps build verdict from the ssh env.
          ssh $SSHOPTS "root@${HOST}" "IMAGE_TAG='${IMAGE_TAG}' APPS_CHANGED='${APPS_CHANGED}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/alethia
          git fetch origin main
          git checkout -f "$IMAGE_TAG"
          mv -f .env.new .env
          AK="$(grep -m1 '^ALETHIA_STORAGE_ACCESS_KEY_ID=' .env | cut -d= -f2-)"
          SK="$(grep -m1 '^ALETHIA_STORAGE_SECRET_ACCESS_KEY=' .env | cut -d= -f2-)"
          cat > deploy/seaweedfs/s3.json <<JSON
          { "identities": [ { "name": "alethia", "credentials": [ { "accessKey": "${AK}", "secretKey": "${SK}" } ], "actions": ["Admin", "Read", "Write", "List", "Tagging"] } ] }
          JSON
          cf="-f docker-compose.yml -f deploy/prod/docker-compose.prod.yml -f deploy/prod/docker-compose.tunnel.yml"
          # Reclaim disk BEFORE pulling: the box accumulates one sha-tagged image set per
          # deploy, and the old `docker image prune -f` (dangling-only, post-pull) never freed
          # them → the disk fills and `compose pull` dies with "no space left on device".
          # `-af` drops ALL unused images; images backing running containers are protected, so
          # this is safe (rollback re-pulls from GHCR). Build cache too (the box never builds).
          echo "disk before prune:"; df -h / 2>/dev/null || true
          docker image prune -af || true
          docker builder prune -af || true
          echo "disk after prune:"; df -h / 2>/dev/null || true
          docker compose $cf pull
          # If `up` fails, the culprit is almost always the one-shot `migrate` service (the app is
          # gated on it via depends_on: service_completed_successfully). compose only prints an opaque
          # "didn't complete successfully", so dump the migrate container's logs + service status
          # BEFORE exiting — makes the real Postgres error visible in the GitHub Actions log (no SSH).
          if ! docker compose $cf up -d --remove-orphans; then
            echo "::group::migrate logs (deploy failed)"
            docker logs alethia-migrate-1 --tail 200 2>&1 || true
            echo "::endgroup::"
            echo "::group::compose ps"
            docker compose $cf ps || true
            echo "::endgroup::"
            exit 1
          fi
          # A SHA tag is only a registry label. Read provenance from the running app container so a
          # stale image tagged as this commit cannot turn the production deploy green (#2746). An
          # apps build must name this exact SHA. A runner-only release legitimately retags the older,
          # code-equivalent console image; `retag-unchanged` already diff-gated that source commit.
          app_id="$(docker compose $cf ps -q app)"
          deployed_commit="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$app_id" \
            | sed -n 's/^ALETHIA_SOURCE_COMMIT=//p' | head -n1)"
          if [ -z "$deployed_commit" ]; then
            echo "::error::Running console carries no ALETHIA_SOURCE_COMMIT provenance."
            exit 1
          fi
          if [ "$APPS_CHANGED" = true ] && [ "$deployed_commit" != "$IMAGE_TAG" ]; then
            echo "::error::Running console provenance '${deployed_commit:-missing}' does not match promoted SHA '$IMAGE_TAG'."
            exit 1
          fi
          echo "✓ running console carries ALETHIA_SOURCE_COMMIT=$deployed_commit (apps changed: $APPS_CHANGED)"
          # `git checkout` replaces tracked files atomically. Caddy bind-mounts one
          # tracked file, so its existing mount can stay attached to the old inode
          # even though /opt/alethia now shows the new routes. Compose cannot detect
          # bind-mounted content changes and otherwise reports the container as
          # "Running". Recreate it on every release so routing changes take effect.
          docker compose $cf up -d --force-recreate --no-deps caddy
          docker compose $cf exec -T caddy caddy validate --config /etc/caddy/Caddyfile
          # ...and then RESTART CLOUDFLARED, because the recreate above just invalidated it.
          #
          # `--no-deps` is what makes the line above safe to run on its own, and it is also why the
          # tunnel breaks: cloudflared proxies to `http://caddy:80` BY SERVICE NAME over the compose
          # network, and it is already running by this point (the `up -d` above started it). Force-
          # recreating caddy destroys that container and creates a new one with a NEW IP, while
          # cloudflared keeps its pooled connections pointed at the address that no longer exists.
          # Cloudflare's edge then has no origin and every request to alethialabs.io is a 502.
          #
          # That is not hypothetical: the #2747 promotion deployed at 06:27:08Z on 2026-08-26 and
          # took the marketing site down. `caddy validate` passed, every container reported Started,
          # the job went green, and the site had been 502 for minutes before anyone looked.
          #
          # Restarting cloudflared re-resolves the service name. It costs ~1s and is a no-op for
          # correctness when caddy did not actually change.
          docker compose $cf restart cloudflared
          docker image prune -f
          REMOTE

          # DID THE SITE COME BACK? Nothing above answers that.
          #
          # Everything this job asserted up to here is about the box: images pulled, containers
          # Started, and a Caddyfile whose SYNTAX is valid. None of it touches the path a visitor
          # actually takes — edge → cloudflared → caddy → app — which is exactly the path the
          # cloudflared/caddy ordering above used to break. A deploy that cannot tell a serving site
          # from a dead one is not reporting on the deploy.
          #
          # Polled rather than probed once: containers legitimately take a few seconds to accept
          # connections, so a single immediate curl would be flaky in the other direction. Ten
          # attempts over ~100s is far longer than a healthy start and far shorter than a human
          # noticing.
          echo "Verifying ${APP_URL} actually serves..."
          # `served` is the verdict and `last` is the evidence, deliberately two variables. Folding
          # them into one (reset the code to 000 before each retry, then test it at the end) reports
          # 000 for every failure — and 000 (nothing answered) points somewhere completely different
          # from 502 (the edge answered, the origin did not). Losing that distinction in the one
          # message an operator reads at 3am would repeat this incident's actual problem: an output
          # that is technically emitted and tells you nothing.
          served=0
          last=000
          for attempt in $(seq 1 10); do
            last="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$APP_URL/" || echo 000)"
            case "$last" in
              2*|3*) served=1; echo "✓ ${APP_URL} returned $last after ${attempt} attempt(s)"; break ;;
            esac
            echo "  attempt ${attempt}/10: HTTP ${last} — retrying in 10s"
            sleep 10
          done
          if [ "$served" -ne 1 ]; then
            echo "::error::Deploy finished but ${APP_URL} never served a 2xx/3xx (last HTTP ${last}). The"
            echo "::error::containers are up — suspect the tunnel: cloudflared holding a stale caddy address."
            echo "::group::compose ps"
            # The -f list is spelled out rather than reusing `$cf`: that variable is assigned inside
            # the <<'REMOTE' heredoc, which is QUOTED, so it exists only on the box and would expand
            # to empty here — leaving a `docker compose ps` that reads the base file alone and
            # cheerfully reports on the wrong set of services.
            ssh $SSHOPTS "root@${HOST}" 'cd /opt/alethia && docker compose \
              -f docker-compose.yml \
              -f deploy/prod/docker-compose.prod.yml \
              -f deploy/prod/docker-compose.tunnel.yml ps' || true
            echo "::endgroup::"
            exit 1
          fi

  # DID THE DEPLOY ACTUALLY SERVE? A green `deploy` job proves the box accepted the images; it does
  # not prove the public URL answers, and `retag-unchanged` can report success while shipping a stale
  # image. So this runs ten checks against https://alethialabs.io itself, including "the served build
  # id equals the promoted SHA" — the one assertion that separates a deploy from a deploy that
  # landed.
  #
  # A SEPARATE JOB, not extra steps on `deploy`, deliberately: `deploy` holds the SSH key, and
  # Chromium plus a pnpm install do not belong in the job that holds it. The blast radius of a
  # compromised browser dependency should not include the production host key.
  #
  # `SMOKE_EXPECTED_SHA` is set only when the apps group actually rebuilt. On a runner-only push the
  # console images are re-tagged rather than rebuilt, so the served build id is the PREVIOUS commit
  # and asserting equality would red every runner-only deploy. Empty means "do not compare", which
  # the smoke script reads as a skip with its reason, never as a pass.
  smoke:
    name: Post-deploy smoke (the public URL, and the build it serves)
    needs: [changes, deploy]
    if: ${{ needs.deploy.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SMOKE_BASE_URL: ${{ vars.PUBLIC_APP_URL || 'https://alethialabs.io' }}
      SMOKE_EXPECTED_SHA: ${{ needs.changes.outputs.apps == 'true' && github.sha || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/playwright-install.sh

      # THE FLOOR. `--list` prints the manifest length, and this asserts it — the same shape as the
      # release gate's per-leg floor. A suite that silently shrank to two checks and passed is the
      # failure this catches; without it, "smoke green" would be compatible with a smoke that
      # measured almost nothing.
      - name: The smoke manifest still holds every check it is supposed to
        run: |
          set -euo pipefail
          out="$(pnpm -C apps/console run smoke:prod -- --list)"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -qE '^post-deploy smoke — 10 checks:$' || {
            echo "::error::the post-deploy smoke manifest is not 10 checks. If a check was added or removed deliberately, move this number in the same PR; if not, the suite shrank and would have reported green on almost nothing."
            exit 1
          }

      - name: Smoke the deployed site
        id: smoke
        run: pnpm -C apps/console run smoke:prod

      # #4084: a step that must run after a failure carries the conjunct, or it reports on a run that
      # never got far enough to produce anything.
      #
      # `if-no-files-found: error`, and gated on the smoke step having actually RUN. The script writes
      # `smoke-report.json` from a `finally`, so once the run started the file exists on the pass and
      # the fail path alike — an empty artifact would mean the report vanished, which is worth a red.
      # But if `playwright install` died first the smoke never ran and there is legitimately nothing
      # to upload, so `outcome != 'skipped'` keeps that from becoming a second, misleading failure.
      # The path is `smoke-results/`, which is where the script writes — NOT `test-results/`, which is
      # the Playwright convention this script does not use. #4347 is the standing instance of an
      # upload that succeeded having captured nothing it exists for.
      - name: Upload the smoke report
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-smoke
          path: apps/console/smoke-results/
          if-no-files-found: error
          retention-days: 14

  # A red production deploy must never again be discovered by someone happening to read a buildx log.
  # It has happened three times: #2244 (ten days), #2485 (closed on half the diagnosis), and the
  # TS2307 underneath it that nothing ever named while main shipped nothing for 26 days.
  #
  # `failure() || cancelled()` deliberately, NOT `always()` and NOT bare `failure()`: fail-fast used to
  # cancel the sibling console leg, so a run whose only signal is a CANCELLED job is exactly the case
  # that must still report. `always()` would also fire on a clean skip, which is not a problem.
  #
  # This complements workflow-health.yml (a daily cron that catches a workflow red across several runs)
  # by reporting on THIS push, the same minute, instead of the next morning.
  report-failure:
    needs: [changes, build-amd64, runner-base-amd64, runner-base-arm64, merge-runner-base,
            build-runner-amd64, build-runner-arm64, merge-runner-images, runner-amd64,
            runner-arm64, merge-runner, retag-unchanged, deploy, smoke]
    if: ${{ (failure() || cancelled()) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the deploy-broken issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TITLE="prod: Deploy Console is red on main — production is not receiving new code"

          # Name the jobs that actually failed, so the issue body is a diagnosis rather than a link.
          jobs_json="$(gh api "repos/${REPO}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --paginate 2>/dev/null || echo '{"jobs":[]}')"
          bad="$(printf '%s' "$jobs_json" | jq -r '.jobs[]? | select(.conclusion=="failure" or .conclusion=="cancelled") | "- `\(.name)` — \(.conclusion)"' | head -40)"
          [ -n "$bad" ] || bad="- (could not enumerate jobs — see the run)"

          # Static Markdown comes from QUOTED heredocs (backticks stay literal, nothing expands);
          # dynamic values are printf'd in between with plain %s formats. Keeping the two apart is
          # what lets the body carry backticks without shellcheck reading them as substitutions.
          # The heredoc bodies sit at this block's indent on purpose: YAML strips it, so the closing
          # MD lands at column 0 for the shell.
          {
            cat <<'MD'
          `Deploy Console` failed on `main` at commit:
          MD
            printf '%s\n\n' "$SHA"
            cat <<'MD'
          **The `deploy` job is gated `!cancelled() && !failure()`, so production did NOT receive this commit.**
          
          Failing jobs:
          MD
            printf '%s\n\n' "$bad"
            printf 'Run: %s\n\n' "$RUN_URL"
            cat <<'MD'
          Do not close this until a `Deploy Console` run on main reaches `deploy: success`. A green run is
          not sufficient on its own — `retag-unchanged` can report success while shipping a stale image, so
          confirm the deployed `ALETHIA_SOURCE_COMMIT` matches the promoted SHA.
          MD
          } > /tmp/deploy-failure-body.md

          existing="$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updating existing issue #${existing}"
            gh issue comment "$existing" --repo "$REPO" --body-file /tmp/deploy-failure-body.md
          else
            echo "Opening a new issue"
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/deploy-failure-body.md
          fi
