name: Deploy Fleet AWS (dev)

# Manual escape hatch for dev/hotfix deploys. For production releases,
# use conventional commits → release-please → release-runner.yml.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

permissions:
  contents: read
  packages: write
  id-token: write # assume the runner-release deploy role via GitHub OIDC — no stored AWS keys

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: alethia-runner-dev-runner
  ECS_CLUSTER: alethia-runner-dev-eu-west-1-cluster
  ECS_SERVICE: alethia-runner-dev-eu-west-1-service
  GHCR_IMAGE: ghcr.io/alethialabs-io/runner

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage templates for Docker build
        run: |
          cp -r infra/templates/project apps/runner/project-templates
          cp -r infra/templates/runner apps/runner/runner-templates
          cp -r infra/templates/argocd apps/runner/argocd-templates

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Split from the ECR push for the reason release-runner.yml's header sets out at length
      # (#3438): one build-push-action carrying both registries' tags meant the missing ECR
      # repository aborted the GHCR publish too. This workflow has never been dispatched, so it
      # has never shown the failure — it would have failed identically on the first attempt.
      - name: Build and push the runner image to GHCR
        id: ghcr-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile
          push: true
          build-args: |
            VERSION=dev
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Least-privilege OIDC role (infra/aws-oidc → alethia-runner-release-deployer). No keys.
      - name: Configure AWS credentials (OIDC)
        id: aws-creds
        if: ${{ !cancelled() }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.RUNNER_RELEASE_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        if: ${{ !cancelled() && steps.aws-creds.outcome == 'success' }}
        uses: aws-actions/amazon-ecr-login@v2

      # Buildx resolves every layer from the cache the GHCR step just wrote, so this re-pushes
      # the image already built rather than building a second one.
      - name: Push the runner image to ECR
        id: ecr-push
        if: ${{ !cancelled() && steps.ecr-login.outcome == 'success' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/runner/Dockerfile
          push: true
          build-args: |
            VERSION=dev
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha

      # Gated on the PUSH. The task definition pulls from ECR, so rolling the service when the
      # new image never reached it restarts every task onto the OLD image and calls it a deploy.
      - name: Force new Fargate deployment
        if: ${{ !cancelled() && steps.ecr-push.outcome == 'success' }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
          echo "Deployment triggered. Fargate will roll to the new image."
