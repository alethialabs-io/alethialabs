# Contributor License Agreement enforcement.
#
# This uses the free, self-hosted "CLA Assistant Lite" GitHub Action
# (contributor-assistant/github-action). Signatures are stored as a JSON file in
# this repo at cla/signatures/. Alternatively, you can install the hosted app at
# https://cla-assistant.io and delete this workflow.
name: CLA Assistant
on:
  issue_comment:
    types: [created]
  # `reopened` is here so a stale result can be cleared WITHOUT pushing to the PR's branch.
  #
  # `pull_request_target` loads this workflow from the PR's BASE branch, so a fix to this file only
  # takes effect for runs created after it reaches `main`. The obvious lever — a `recheck` comment —
  # cannot deliver that: the CLA action re-runs the ORIGINAL workflow run (it holds `actions: write`,
  # below), and a re-run replays that run's own workflow file. So `recheck` re-evaluates the OLD
  # cla.yml forever.
  #
  # That is not hypothetical. After #1650 allowlisted the release bot, #1031 went green because
  # release-please happened to push its branch (a real `synchronize`), while #890 stayed red through
  # repeated rechecks and had to be cleared with an empty commit pushed to a bot-managed release
  # branch. `reopened` creates a NEW run, so close+reopen becomes a working lever instead.
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'cla/signatures/v1.0.json'
          path-to-document: 'https://github.com/alethialabs-io/alethialabs/blob/main/cla/ICLA.md'
          branch: 'main'
          # Machine accounts, which contribute no third-party IP and so have nothing to assign.
          # `alethia-labs-ci[bot]` is our own release-please App (it authors the `chore(main): release
          # *` PRs); without it every release PR reports a red `cla` forever — #890 and #1031 each
          # carried one for 10 days. Names must match the committer login exactly, `[bot]` suffix and
          # all.
          #
          # `mergify[bot]` is REQUIRED, not a convenience. Mergify validates each queued PR on a
          # speculative branch of its own, and the draft PR it opens for that branch carries a
          # mergify[bot]-authored commit alongside the real ones. Since #1653 made Mergify wait on
          # `check-success=cla`, an unlisted mergify[bot] fails the CLA on EVERY queued dev PR and
          # ejects it — wedging the whole dev queue. It does not weaken enforcement: the real commits
          # on that speculative branch are still checked, so an unsigned contributor still fails.
          #
          # The action also accepts a `bot*` wildcard. Deliberately NOT used: it would allowlist any
          # account whose name merely starts with "bot", which anyone can register.
          allowlist: 'dependabot[bot],github-actions[bot],renovate[bot],alethia-labs-ci[bot],mergify[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
