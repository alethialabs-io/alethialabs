#
# Post-registration CLA activation gate. This privileged pull_request_target job checks out only
# the trusted base commit and never executes pull-request-head code.
name: Contribution legal gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  contribution-legal:
    name: contribution-legal
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Enforce CLA activation policy
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Each bot pattern is QUOTED so `[bot]` is a literal, not a glob. In a `case` pattern
          # `[bot]` is a character class matching one of b/o/t, so the unquoted form failed both
          # ways at once: `dependabot[bot]` never matched the real login, while `dependabott`,
          # `dependaboto` and `dependabotb` DID — and likewise `mergifyt`, `renovateo`,
          # `github-actionsb`, `alethia-labs-cit`. A gate whose purpose is pausing external merges
          # was rejecting every maintenance bot and trusting a set of registrable names instead.
          case "$AUTHOR" in
            bobikenobi12|'dependabot[bot]'|'github-actions[bot]'|'renovate[bot]'|'alethia-labs-ci[bot]'|'mergify[bot]')
              echo "Trusted founder or maintenance bot: $AUTHOR"
              exit 0
              ;;
          esac

          if test ! -f cla/ACTIVE; then
            echo "::error::External merges are paused until the ALETHIA LABS EDPK post-registration CLA is active."
            exit 1
          fi

          echo "::error::cla/ACTIVE exists but the signing job has not replaced the formation gate. Fail closed."
          exit 1

# Activation template:
# - retain trusted-base checkout and minimum permissions;
# - pin contributor-assistant/github-action to
#   ca4a40a7d1004f18d9960b404b97e5f30a505a08 (v2.6.1);
# - store records on a dedicated cla-signatures branch;
# - require the action's exact `cla` status in every branch ruleset.
