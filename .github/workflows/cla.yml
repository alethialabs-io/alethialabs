#
# Pre-activation gate. This privileged pull_request_target job checks out only
# the trusted base commit and never executes pull-request-head code.
name: Contribution legal gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# A superseded run is not evidence about the head of the branch, and while it keeps a runner it is
# denying one to the run that is. `ci.yml` and `addon-render-determinism.yml` have carried this
# since they were written; these seven did not, and the gap only became expensive when the queue
# started landing PRs faster than a run takes to finish.
#
# MEASURED 2026-09-02 19:2xZ, with the dev queue draining: 48 runs queued against 2 in progress,
# and the single largest group was 23 runs headed `dev` — the standing `dev → staging` promotion
# PR #3562, which re-triggers every `pull_request` workflow on EVERY merge into dev. `CI` had
# already cancelled its own superseded runs and showed 1; these seven each showed a full stack.
#
# Scoped to `github.ref`, so this only ever cancels an OLDER run of the SAME workflow on the SAME
# PR or branch — the ordinary "I pushed again" case. It cannot cancel a run for a different ref.
concurrency:
  group: contribution-legal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contribution-legal:
    name: contribution-legal
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Enforce pre-activation contribution policy
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Each bot pattern is QUOTED so `[bot]` is a literal, not a glob. In a `case` pattern
          # `[bot]` is a character class matching one of b/o/t, so the unquoted form failed both
          # ways at once: `dependabot[bot]` never matched the real login, while `dependabott`,
          # `dependaboto` and `dependabotb` DID — and likewise `mergifyt`, `renovateo`,
          # `github-actionsb`, `alethia-labs-cit`. A gate whose purpose is pausing external merges
          # was rejecting every maintenance bot and trusting a set of registrable names instead.
          case "$AUTHOR" in
            bobikenobi12|'dependabot[bot]'|'github-actions[bot]'|'renovate[bot]'|'alethia-labs-ci[bot]'|'mergify[bot]')
              echo "Trusted founder or maintenance bot: $AUTHOR"
              exit 0
              ;;
          esac

          if test ! -f cla/ACTIVE; then
            echo "::error::External merges are paused until the ALETHIA LABS post-registration CLA is active."
            exit 1
          fi

          echo "::error::cla/ACTIVE exists but the signing job has not replaced the pre-activation gate. Fail closed."
          exit 1

# Activation replaces this whole file with cla/cla-active-workflow.yml, which
# `pnpm legal:activate-ip --apply` copies into place once the sealed evidence
# verifies. That template:
# - retains the trusted-base checkout and minimum permissions;
# - uses NO third-party action. contributor-assistant/github-action was pinned
#   here by immutable SHA at v2.6.1 and its upstream was archived in March 2026,
#   so the mechanism is first-party: scripts/legal/cla-check.mjs decides and
#   scripts/legal/cla-run.mjs does the I/O, both fixture-driven in CI (#2367);
# - stores records on the dedicated cla-signatures branch, keyed on the signer's
#   NUMERIC user id — a login can be released and re-registered, an id cannot;
# - reports the exact `cla` status context every branch ruleset requires.
