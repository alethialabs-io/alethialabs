# ExternalDNS on GCP — Cloud DNS, keyless.
#
# `workloadIdentity` becomes the `iam.gke.io/gcp-service-account` annotation. Bind that service
# account to the controller's KSA — `external-dns/addon-external-dns-sa` — with
# roles/iam.workloadIdentityUser and grant it roles/dns.admin on the project (or, better, on the
# specific managed zone).
#
# THE ADD-ON'S KSA IS NOT `external-dns-sa`. That name belongs to the platform's own external-dns,
# which Alethia installs into the same namespace when the environment manages DNS; binding to it
# would put one ServiceAccount under two owners. This add-on runs as `addon-external-dns-sa`.
#
# REQUIRED, not optional: a Google Cloud DNS install with no identity is refused at configure time
# rather than installed to run without one (#3469).

provider: google

workloadIdentity: external-dns@my-project.iam.gserviceaccount.com

domainFilter: example.com
