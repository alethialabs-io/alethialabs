# Velero on Hetzner — backups to Hetzner Object Storage over the S3 API.
#
# There used to be no file here, and the velero README called that a ceiling: the `provider` knob was
# `aws | gcp | azure` and Hetzner is none of those. That reading confused the PLUGIN with the CLOUD.
# `aws` is velero's S3 plugin, and Hetzner Object Storage speaks S3 — what was actually missing was
# somewhere to put the ENDPOINT. `s3Url` and `s3ForcePathStyle` are that somewhere.

provider: aws

# A bucket you own, created in the Hetzner Console (Object Storage has no provisioning API, and its
# access keys are generated by hand). Keep it OUTSIDE this cluster's lifecycle: a bucket the project
# template creates is a bucket `tofu destroy` deletes, and a backup store destroyed with the cluster
# it backs up is not a backup store.
bucket: my-velero-backups

# Hetzner's location code doubles as the S3 region. fsn1 = Falkenstein, nbg1 = Nuremberg,
# hel1 = Helsinki. It must match the endpoint below.
region: fsn1

# The S3 endpoint. Hetzner Object Storage is a separate product from the Hetzner Cloud API and
# answers at <location>.your-objectstorage.com — the same host scripts/e2e/hcloud-cleanup.sh drives
# the bucket sweep against.
s3Url: https://fsn1.your-objectstorage.com

# Virtual-hosted addressing (`<bucket>.fsn1.your-objectstorage.com`) is what Hetzner documents and
# what the repo's own sweep uses, so path-style is not needed here. Turn it on for a store that
# requires it — MinIO and Ceph RADOS Gateway typically do.
s3ForcePathStyle: false

# OFF, and not by preference. A volume snapshot is taken through the CLOUD's snapshot API; pointing
# the S3 plugin at an object store gives velero a bucket, not an API to snapshot hcloud Volumes with.
# The catalog enforces this — a VolumeSnapshotLocation is not emitted when `s3Url` is set — so
# leaving it on here would only look like an offer.
snapshotsEnabled: false

# ON, and this is the consequence of the line above. With no snapshot path, the node-agent's
# file-level backup is the ONLY way volume DATA leaves the cluster. It costs a pod per node; a
# backup that captures manifests and no data costs a restore.
deployNodeAgent: true

# REQUIRES CREDENTIALS, which is why this file is incomplete on purpose.
#
# Set `cloud` in the configure form to an AWS-style credentials file holding the Hetzner Object
# Storage access key pair:
#
#     [default]
#     aws_access_key_id = <HETZNER_S3_ACCESS_KEY>
#     aws_secret_access_key = <HETZNER_S3_SECRET_KEY>
#
# It is stored encrypted at rest and mounted from a runner-seeded Secret's `cloud` key — never
# inlined into values, and never written to a file like this one.
