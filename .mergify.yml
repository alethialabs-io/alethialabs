# Mergify merge queue for the integration branch `dev`.
#
# Mergify reads THIS FILE ONLY FROM THE DEFAULT BRANCH (`main`) — config changes take effect only after they
# reach main (via the dev→staging→main train), not from a PR's base branch. So iterate carefully.
#
# It REPLACES the native GitHub merge queue (the `merge_queue` rule was removed from the Terraform-managed
# `protect-dev` ruleset, infra/github/main.tf). Why: the native queue re-ran required checks via the
# `merge_group` event, where the `merge_group`-only "Provisioning E2E (T1)" job fails on missing auth env and
# wedged EVERY queued PR. Mergify validates each PR on its own branch (no `merge_group`), so that wedge is gone.
#
# Behaviour: every NON-DRAFT PR into `dev` is AUTO-queued (merge_protections_settings.auto_merge_conditions —
# the current replacement for the deprecated `autoqueue`) and SQUASH-merged once the 9 protect-dev required
# checks pass. No `@mergifyio queue`, no `gh pr merge` — just open a non-draft PR; keep WIP as a draft.
#
# ── Why `capabilities-security` is listed here before branch protection requires it ──
# It is a fail-closed security gate, but for a while NOTHING enforced it: absent from all three rulesets
# AND from this file, so a PR that failed it merged anyway. The enforcement lived only in unapplied
# `infra/github` HCL (#1625).
#
# The two halves must be fixed in THIS order. If branch protection required it while this file did not,
# a PR that genuinely FAILS the gate would still satisfy the conditions below, get queued, and then be
# rejected by GitHub at merge time — a stuck queue entry with no visible cause. The reverse (this file
# stricter than branch protection) is harmless: the job is unfiltered, so it always reports.
# So this lands and rides dev→staging→main FIRST; the ruleset apply follows.

queue_rules:
  - name: dev
    # queue_conditions decide which PRs THIS queue accepts — REQUIRED, or a PR can't be assigned to the queue
    # (its absence returned `queue_rule_name: null` before). merge_conditions decide WHEN to merge.
    queue_conditions:
      - base = dev
      - "-draft"
    merge_conditions:
      # The 9 protect-dev required checks (quoted — names contain `·`, `(`, `)`, `/`).
      - "check-success=TypeScript (lint · types · test · docs)"
      - "check-success=Go (build · vet · test · lint) (packages/core)"
      - "check-success=Go (build · vet · test · lint) (apps/cli)"
      - "check-success=Go (build · vet · test · lint) (apps/runner)"
      - "check-success=Integration (real Postgres + RLS)"
      - "check-success=Secret scan (gitleaks)"
      - "check-success=Docs prose (Vale · Diátaxis + plain-language)"
      - "check-success=Authz / open-core guards"
      # The fail-closed capabilities/connector/keyless gate that replaced the dropped #982 CODEOWNERS
      # review. Safe to require: the job is UNFILTERED (runs on every PR) and no-op-passes when no
      # relevant path changed, so it always reports and cannot deadlock an unrelated PR.
      # Listed here BEFORE it is required in branch protection, deliberately — see the note at the
      # bottom of this file.
      - "check-success=capabilities-security"
      # `cla` is deliberately NOT listed here — it belongs in branch protection, not in Mergify.
      #
      # #1653 added it and wedged the whole dev queue. Mergify's conditions gate the SPECULATIVE
      # branch, and the draft PR Mergify opens for it carries a `mergify[bot]`-authored commit
      # alongside the real ones — so the CLA was being evaluated over a commit set that includes
      # Mergify's own merge. Allowlisting mergify[bot] (#1667) did not reliably clear it either:
      # those speculative drafts kept resolving a STALE cla.yml, logging the pre-fix allowlist long
      # after the fix was on `dev`, so the first run on each new draft failed and ejected the PR.
      #
      # The deeper point is that the speculative branch is the wrong subject. A CLA is a property of
      # the PR's OWN commits, which is exactly what a required status check on the branch ruleset
      # evaluates. Enforcement therefore lives in `infra/github/variables.tf`
      # (`required_status_checks`) — where it gates the real PR and never sees mergify[bot].
    # SQUASH matches feature→dev convention (promotions dev→staging→main stay human `--merge`).
    merge_method: squash

# Merge protections: `auto_merge_conditions` below only fires once a merge_protections rule's
# `success_conditions` all pass. Without this block there were no success_conditions to satisfy, so
# auto-merge never triggered (the bug). This rule requires the 9 protect-dev checks on every PR into `dev`.
merge_protections:
  - name: dev required CI
    if:
      - base = dev
    success_conditions:
      - "check-success=TypeScript (lint · types · test · docs)"
      - "check-success=Go (build · vet · test · lint) (packages/core)"
      - "check-success=Go (build · vet · test · lint) (apps/cli)"
      - "check-success=Go (build · vet · test · lint) (apps/runner)"
      - "check-success=Integration (real Postgres + RLS)"
      - "check-success=Secret scan (gitleaks)"
      - "check-success=Docs prose (Vale · Diátaxis + plain-language)"
      - "check-success=Authz / open-core guards"
      - "check-success=capabilities-security"
      # `cla` intentionally absent — see merge_conditions above; it is enforced by the branch ruleset.

# Auto-queue: automatically queues + squash-merges a matching PR once the merge_protections
# success_conditions above pass. The current, non-deprecated auto-merge mechanism (no @mergifyio command).
merge_protections_settings:
  auto_merge_conditions:
    - base = dev
    - "-draft"
