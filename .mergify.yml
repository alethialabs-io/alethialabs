# Mergify merge queue for the integration branch `dev`.
#
# Mergify reads THIS FILE ONLY FROM THE DEFAULT BRANCH (`main`) — config changes take effect only after they
# reach main (via a pinned release/<sha> promotion, promote.yml), not from a PR's base branch. So iterate carefully.
#
# It REPLACES the native GitHub merge queue (the `merge_queue` rule was removed from the Terraform-managed
# `protect-dev` ruleset, infra/github/main.tf). Why: the native queue re-ran required checks via the
# `merge_group` event, where the `merge_group`-only "Provisioning E2E (T1)" job fails on missing auth env and
# wedged EVERY queued PR. Mergify validates each PR on its own branch (no `merge_group`), so that wedge is gone.
#
# Behaviour: every NON-DRAFT PR into `dev` is AUTO-queued (merge_protections_settings.auto_merge_conditions —
# the current replacement for the deprecated `autoqueue`) and SQUASH-merged once the two required
# contexts below pass: `CI required` and `contribution-legal`. No `@mergifyio queue`, no `gh pr merge` —
# just open a non-draft PR; keep WIP as a draft.
#
# ── THE ORDER BETWEEN THIS FILE AND THE RULESET ──
# When the required list changes, this file and `protect-dev` (infra/github) must change in a safe
# order. A context the ruleset requires and this file does not wait for is the hazardous direction:
# Mergify queues the PR, GitHub refuses the merge (protect-dev has no bypass actors), and the entry
# sits in the train with nothing red. The reverse (this file stricter than the ruleset) is harmless —
# Mergify simply waits. So a newly required context lands HERE first, and the ruleset apply follows.
# scripts/ci/check-required-checks.mjs compares the two lists in-tree on every PR.
#
# For the 2026-11-22 switch to `CI required` the live ruleset may still name the eleven per-job
# contexts until infra/github is applied. That is safe while they keep reporting: `CI required` is
# green only when every one of those jobs concluded `success` or `skipped`, and GitHub counts a
# skipped required check as passing. It stops being safe only if a job stops REPORTING (a matrix leg
# that is never generated) — which is why ci.yml's `AFFECTED_ONLY_ARMED` stays "false" until that
# apply has landed.

queue_rules:
  - name: dev
    # ── WHY batch_size AT ALL ──
    # Unset, Mergify's default is 1: every queued PR gets its OWN full speculative branch and its own
    # full set of required CI jobs. Measured on 2026-09-02 at 14:08 UTC, with 20 PRs open: 25 of 34 active CI
    # runs were speculative merge-queue branches against 9 real PR runs, and 64 speculative branches
    # had been created that day to land 38 merges. Three quarters of the CI budget re-validating the
    # queue one PR at a time is why a green, reviewed, conflict-free PR sat ~50 minutes at the front,
    # and why #3784 was open for seven hours.
    #
    # A batch validates up to eight PRs as ONE tree, so up to eight land per cycle instead of one. It is the same
    # tree the queue would have produced anyway — batching changes how many checks pay for it, not
    # what is checked, and the speculative merge is still what catches lane-vs-lane defects that
    # per-PR CI is blind to (a symbol declared in two PRs, an import of a module another deleted).
    #
    # ── THE COST, STATED ──
    # When a batch FAILS, Mergify splits it to isolate the culprit and re-runs the remainder, so a
    # failure costs more CI than it would have serially. That trade is only worth taking while
    # batches are usually green: on 2026-09-02 every batch observed was green, and the failures that
    # did occur were caught on the PRs' own CI before they were ever queued. If red batches become
    # common, LOWER this number rather than removing it — 8 → 3 keeps most of the win.
    #
    # ── 5 → 8, AND A WAIT (2026-11-22) ──
    # Raised from 5 when CI runner slots became the bottleneck (the repo's own measurement that week:
    # ~5,400 minutes queued against ~1,800 executing). A bigger batch is fewer speculative runs per
    # merged PR — but only if batches FILL, and with Mergify's default `batch_max_wait_time` of
    # 30 seconds a batch starts as soon as the timer set by its FIRST PR runs out, so under a trickle
    # of arrivals most batches started with one or two PRs in them. Five minutes is the cost stated
    # plainly: a PR that arrives alone in an idle queue waits up to five minutes longer before its
    # batch starts. A batch that reaches eight starts at once; the wait is a ceiling, not a delay
    # imposed between batches (Mergify docs: "This does not enforce a minimum delay between batches").
    # Written "5 minutes" — Mergify's duration type documents the plural unit; abbreviations are
    # accepted in principle, but an unparseable value invalidates the whole file and stops the queue.
    #
    # ── WHERE THIS TAKES EFFECT ──
    # Mergify reads its configuration from the DEFAULT branch (`main`). Merging this to `dev` changes
    # nothing until it reaches `main` through a pinned release/<sha> promotion, same as the
    # review-thread gate below it.
    batch_size: 8
    batch_max_wait_time: "5 minutes"
    # queue_conditions decide which PRs THIS queue accepts — REQUIRED, or a PR can't be assigned to the queue
    # (its absence returned `queue_rule_name: null` before). merge_conditions decide WHEN to merge.
    queue_conditions:
      - base = dev
      - "-draft"
      # UNRESOLVED CODE-REVIEW FINDINGS KEEP A PR OUT OF THE QUEUE (#3498).
      #
      # There is no required human approval here and there should not be — the maintainer is the
      # only person in the repo and cannot approve his own PR. What DOES exist is a second Claude
      # instance that babysits this queue and runs /code-review on every PR, posting findings as
      # INLINE review comments, i.e. GitHub review threads. Five PRs squash-merged with those
      # findings unaddressed (#3433, #3437, #3444, #3477, #3479 — margins of four, fifteen and five
      # minutes), because the required checks were green and nothing else was consulted.
      #
      # `#review-threads-unresolved` is the count of threads GitHub does NOT have marked resolved.
      # It is NOT filtered by author, so the maintainer's own review of his own PR counts — which is
      # the entire mechanism here. It is not cleared by pushing a fix either: a thread whose line
      # has moved becomes `isOutdated` but stays unresolved, so the gate is released only by
      # explicitly resolving the conversation. That is deliberate. It also means the gate binds ONLY
      # on inline review comments — a top-level PR comment creates no thread, so if /code-review
      # ever stops posting inline, this condition silently stops gating.
      #
      # ── WHY queue_conditions AND NOT merge_conditions ──
      # merge_conditions are evaluated on the TEMPORARY MERGE, not on this PR — the same speculative
      # draft the CLA note below describes. That draft is a fresh pull request with no review
      # threads, so the condition would read 0 = 0 and be TRUE FOREVER: a gate that looks installed
      # and gates nothing. And in the event it is not dead, it is worse — an unsatisfied CONDITION
      # is not a FAILED CHECK, so Mergify does not eject the PR; it holds the head of the train
      # pending, indefinitely, with no checks_timeout configured to break it. Dead or wedged, with
      # no third outcome.
      #
      # queue_conditions is binding on the REAL pull request and continuously re-evaluated: a PR
      # that stops matching is REMOVED from the queue (Mergify's merge-queue lifecycle docs). That
      # is what closes the #3444 case, where the review landed AFTER the PR was already queued. An
      # un-queued PR also holds no train slot, so open findings cannot stall anyone else's merge.
      #
      # ── "GATE ENTRY, BUT DO NOT EJECT A PR ALREADY IN A BATCH" — NOT EXPRESSIBLE (2026-11-22) ──
      # Asked for, because an ejection splits a running batch and re-runs the rest. Mergify has no
      # condition layer with that meaning, checked against its docs on 2026-11-22:
      #   · queue_conditions — re-evaluated while queued; a mismatch dequeues (above).
      #   · merge_conditions — dead for this condition (the temporary-merge argument above).
      #   · auto_merge_conditions (merge_protections_settings, below) — NOT an entry-only layer
      #     either. The docs do not say whether a mismatch dequeues, and the one dequeue observed
      #     (a third-party Mergify comment, 2026-11-21) listed "Auto-merge conditions" INSIDE the
      #     unsatisfied queue-condition tree — i.e. Mergify folds them into what it re-evaluates.
      #   · there is no setting that freezes queue_conditions once a PR is queued.
      # So the gate stays where it was, in both places, with the ejecting behaviour it always had.
      # An EARLIER version of this comment said auto_merge_conditions "only decides whether to
      # enqueue, never to evict"; nothing documented that, and the observation above contradicts it.
      #
      # ⚠️ THE QUOTES ARE LOAD-BEARING. Unquoted, `- #review-threads-unresolved = 0` is a YAML
      # comment and the list item parses as null.
      - "#review-threads-unresolved = 0"
    merge_conditions:
      # The protect-dev required checks. This list, the merge_protections list below and
      # infra/github/variables.tf must agree; scripts/ci/check-required-checks.mjs compares them and
      # fails the PR when they do not (#3180).
      #
      # ── `CI required` — ONE CONTEXT FOR EVERY REQUIRED CI JOB (2026-11-22) ──
      # The aggregator job `ci-required` in .github/workflows/ci.yml. It `needs:` every required job
      # of that workflow and is green only when each one concluded `success` or `skipped`; a failed
      # or cancelled need turns it red, and it runs with `if: always()` so it always reports.
      #
      # ITS `needs:` LIST IS NOW THE SOURCE OF TRUTH for which CI jobs gate a merge into dev — not
      # this file. Adding a required job means adding it to that `needs:` list (and to the count the
      # job checks); nothing here changes. It replaced eleven per-job contexts (TypeScript, the three
      # Go legs, Integration, Secret scan, Docs prose, Authz / open-core guards,
      # capabilities-security, Build console images, BYO users SQL). Why each of those jobs is
      # required — #1625 for capabilities-security, #2606 for the console image build, #6484 for
      # the BYO users SQL — is recorded at the job in ci.yml.
      #
      # Why one context rather than eleven: `check-success=` reads a SKIPPED job as "not green" and
      # a matrix leg that was never generated as "still pending", so a per-job list could never let
      # a PR skip a job its diff cannot affect. The aggregator reads `skipped` as "not needed".
      # A plain `check-success=` on purpose: the job always reports, so no `or:` wrapper.
      - "check-success=CI required"
      # THE CONTRIBUTION GATE — the one required context the aggregator CANNOT cover. It comes from
      # cla.yml, a separate `pull_request_target` workflow, and `needs:` cannot reach across
      # workflows. So it stays listed on its own.
      #
      # It was once left out of this file on purpose (#3180). #1653 added the old `cla` context here
      # and wedged the whole dev queue: Mergify's conditions gate the SPECULATIVE branch, whose draft
      # PR carries a `mergify[bot]`-authored commit, so the CLA was evaluated over Mergify's own
      # merge, and those drafts kept resolving a STALE cla.yml. Neither half can recur: cla.yml is
      # `pull_request_target`, which resolves the workflow from the PR's BASE branch, and the gate
      # keys on `github.event.pull_request.user.login` with `mergify[bot]` trusted, not on the
      # commit set.
      #
      # LEAVING IT OUT IS NOW THE HAZARD. It is in `required_status_checks` for protect-dev, which
      # has NO bypass actors, so a PR this file queued without waiting for it would be refused at
      # merge time: a stuck entry with no visible cause.
      - "check-success=contribution-legal"
    # SQUASH matches feature→dev convention (release/<sha> → main promotions stay a `--merge`, outside Mergify).
    merge_method: squash

# Merge protections: `auto_merge_conditions` below only fires once a merge_protections rule's
# `success_conditions` all pass. Without this block there were no success_conditions to satisfy, so
# auto-merge never triggered (the bug). This rule requires the protect-dev checks on every PR into `dev`,
# and must stay identical to the queue's merge_conditions above — check-required-checks.mjs enforces that.
merge_protections:
  - name: dev required CI
    if:
      - base = dev
    success_conditions:
      # The aggregator — see the note in the dev queue's merge_conditions above.
      - "check-success=CI required"
      # Required by protect-dev and not coverable by the aggregator (a separate workflow), so this
      # file has to wait for it or the merge is refused after the queue has already decided.
      - "check-success=contribution-legal"

# Documented auto-queue: queues a matching PR once the merge_protections success_conditions above
# pass — but only when merge protections are ENABLED for the repository, and as of 2026-11-23 they
# are not (see `pull_request_rules` at the end of this file, which is what actually queues PRs).
merge_protections_settings:
  auto_merge_conditions:
    - base = dev
    - "-draft"
    # The outer half of the review-thread gate — same condition, same reason, see the long note in
    # queue_conditions above. This one stops the auto-queue being ATTEMPTED on a PR with open
    # findings; queue_conditions is the documented one that EVICTS a PR whose findings arrive after
    # it was already queued (whether a mismatch HERE also evicts is undocumented — see the
    # "NOT EXPRESSIBLE" note above). Both are kept, and check-required-checks.mjs fails the build if
    # the gate is in only one of them — or in merge_conditions/success_conditions, where it is dead.
    - "#review-threads-unresolved = 0"

# THE AUTO-QUEUE THAT ACTUALLY FIRES. Measured 2026-11-23: on every dev PR merged since the switch to
# `CI required` (7 of 8), nothing entered the queue until someone commented `@Mergifyio queue` — #7312
# went green at 02:23:58Z and sat unqueued until a manual comment at 02:37. No "Merge Protections" check
# ever appears on a PR head, which says merge protections are not enabled for this repository, and
# Mergify documents `auto_merge_conditions` as acting only when they are
# (docs.mergify.com/merge-protections/auto-merge). The `queue` action below does not depend on that
# switch. It enqueues a matching PR, and the PR still has to satisfy the dev queue's
# `queue_conditions` to enter (docs.mergify.com/workflow/actions/queue), so this adds no new
# admission path — it only removes the comment. `merge_protections_settings` above stays: if
# protections are switched on later both paths name the same PRs, and enqueueing one twice is a no-op.
pull_request_rules:
  - name: auto-queue every ready dev PR
    conditions:
      - base = dev
      - "-draft"
      - "#review-threads-unresolved = 0"
    actions:
      queue:
        name: dev

# The "Version packages" PR (head changeset-release/dev, opened by version-packages.yml) is rebuilt
# whenever a new changeset lands on dev, and a rebuild restarts its CI and drops it from the queue.
# At normal priority it waits behind every PR queued before it, so on a busy day a later changeset
# lands first and rebuilds it again: on 2026-11-26 #7754 was rebuilt twice in two hours while queued,
# holding back the release that publishes the packages behind it. High priority lets it enter the
# next batch as soon as it is green, which is the shortest window a later changeset has to restart it.
# It goes ahead of PRs still waiting, not of batches already running (no allow_checks_interruption):
# no CI already spent is thrown away. Mergify reads this from main, so it binds after a promotion.
priority_rules:
  - name: the Version packages PR goes first
    conditions:
      - base = dev
      - head ~= ^changeset-release/
    priority: high
