#
# gitleaks config. Extends the default rules; allowlists the repo's known
# non-secrets (the self-host dev defaults, build placeholders, and fixtures).
# CI scans only the PR/push diff, so historical findings don't block new PRs.

title = "Alethia gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Known non-secrets — dev defaults, placeholders, test fixtures."
regexTarget = "match"
regexes = [
  # docker-compose / .env.example self-host dev defaults (never used in prod).
  '''alethia-dev-secret''',
  '''alethia-app-dev-secret''',
  '''openfga-dev-secret''',
  '''-dev-secret''',
  '''-dev-password''',
  # ASM_SECRET_ID is the AWS Secrets Manager secret PATH (alethia/prod/env), not a
  # secret value — it's public config in the deploy/infra workflows. generic-api-key
  # flags the `ASM_SECRET_ID: alethia/prod/env` assignment; allowlist the marker.
  '''ASM_SECRET_ID''',
  # ALETHIA_E2E_SECRETS_XACCT_* are the NAMES of the cross-account-secrets e2e's env vars, declared
  # as Go string constants (test/e2e/t2_secrets_xacct.go) — the value IS the variable name, never a
  # value read from one. generic-api-key fires because the identifier contains "Secrets" and the
  # string is long. The harness must declare them as LITERALS: TestScenarioEnablesReachTheNightly
  # greps the source for `ALETHIA_E2E_*` literals to prove every scenario is reachable from the
  # nightly, so building the names by concatenation would silently disable that guard. The file is
  # deliberately not `_test.go` (the untagged pure half is used by the e2e_t2 half), so the
  # test-path allowlist below does not cover it.
  '''ALETHIA_E2E_SECRETS_XACCT[A-Z_]*''',
  # `Aliyun_AES_256` is Alibaba KMS's ALGORITHM NAME — the value of `key_spec` on alicloud_kms_key
  # (infra/templates/project/alibaba/secrets-encryption.tf, #2004). generic-api-key fires on it
  # because the identifier contains "key" and the string is long and underscore-separated. It names
  # a cipher; it carries no key material. Anchored to the exact literal rather than allowlisting
  # `key_spec` or the file, so a real secret assigned nearby is still caught.
  '''Aliyun_AES_256''',
  # An OpenTofu variable reference (`var.<name>`) is a reference, never a literal
  # secret. generic-api-key flags idioms like `minio_password = var.hetzner_s3_secret_key`
  # in the templates; a `var.` value is safe by construction.
  '''var\.[A-Za-z0-9_]+''',
  # Azure BUILT-IN role definition IDs — public, well-known constants (not secrets). Used in the
  # connector's ABAC condition to scope roleAssignments/write to the templates' least-privilege roles.
  '''befefa01-2a29-4197-83a8-272ff33ce314''', # DNS Zone Contributor
  '''4633458b-17de-408a-b874-0445c86b69e6''', # Key Vault Secrets User
  '''b86a8fe4-44ce-4948-aee5-eccb2c155cd7''', # Key Vault Secrets Officer
  '''b1ff04bb-8a4e-4dc4-8eb5-8693973ce19b''', # AKS RBAC Cluster Admin
  # A UUID assigned to a `*client_id` key is an IDENTIFIER, not a credential. In OAuth and in
  # Entra the client_id is the public half by definition — this repo stores its own as
  # `E2E_AZURE_CLIENT_ID`, a repo VARIABLE rather than a secret, which is the same judgement made
  # twice. generic-api-key fires on lines like
  # `external_secrets_client_id = "3f2b…5f60"` in a captured e2e run.log, because the identifier
  # contains "secrets" and the value is long.
  #
  # Both halves of this pattern are load-bearing, and it was measured rather than assumed. Against
  # a three-line probe the default rules flag all three; with this entry they still flag two:
  #   `…client_secret = "<uuid>"`     — still caught (the KEY must be client_id)
  #   `…client_id     = "<non-uuid>"` — still caught (the VALUE must be a strict 8-4-4-4-12 UUID)
  # So a real secret cannot hide behind it by living near a client_id, nor by being assigned to one.
  #
  # Deliberately NOT a `demos/proofs/` path allowlist. A proof bundle is precisely where a real
  # leaked credential would surface, so the bundles stay scanned and only this shape is exempt.
  #
  # ⚠️ THE TRAILING BOUNDARY IS LOAD-BEARING. `regexTarget = "match"` means a SUBSTRING hit
  # dismisses the whole finding, so without it a value that merely BEGINS with a UUID would be
  # exempt and the rest would ride along unscanned:
  #   c_secret_client_id = 3f2b1a4c-5d6e-7f80-9a1b-2c3d4e5f6071.qZx7Lm2pRt9vBn4kJh1sGd3f
  # That is 24 characters of credential material hidden behind a UUID prefix. The `(?:"|$|[\s,;])`
  # tail forces the UUID to be the WHOLE value, which is what the rule always claimed to require.
  '''client_id\s*=\s*"?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:"|$|[\s,;])''',
]
paths = [
  '''(^|/).*_test\.go$''',
  # TS/TSX unit tests hold synthetic fixtures (e.g. freshly-generated RSA keys assigned to
  # process.env in the OIDC issuer tests), which generic-api-key flags. Same policy as Go tests.
  '''(^|/).*\.test\.tsx?$''',
  '''(^|/)testdata/''',
  '''\.example$''',
  '''(^|/)\.env\.example$''',
]
