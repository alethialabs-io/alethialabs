#
# Exceptions to the cloud-availability rules. Read by scripts/check-cloud-availability.mjs (#6950,
# wave spec alibaba-switch §4.6).
#
# Rule 1 (cloud-list): a list of three or more cloud slugs written by hand. Offer lists — what a
# user may choose — derive from packages/core/catalog/catalog.json through @repo/cloud-catalog,
# offeredClouds() or catalog.OfferedProviders(), and never appear here. The files listed here are
# the two kinds the spec says stay complete (§2):
#   class B: a CAPABILITY list, the clouds that implement a feature. It must never reach a picker
#            unfiltered.
#   class C: an EXHAUSTIVE list over every slug a stored row can carry, so that old rows still render.
# Two more kinds are also listed: GENERATED mirrors of the catalog, and test or fixture inputs that
# sit outside the test directories.
#
# Rule 2 (hidden-name): a hidden cloud named on a user-visible surface. An entry here records a
# decision that users must read the name on that page. Today every such name is a DigitalOcean
# product that is not the cloud, or a configuration key.
#
# An entry carries EXACTLY ONE of these two fields:
#   reason: a DECISION that the file really is one of the kinds above, never "not converted yet";
#   lifts:  #<issue> marks measured drift that the named open issue removes.
# The list is checked in BOTH directions:
#   - a finding with no entry fails;
#   - a file holding more lists than its `lists:` fails;
#   - an entry that excuses nothing fails as stale: fewer lists than it says, no mention of its
#     cloud any more, a cloud no longer hidden, or a deleted file.
# So converting a list means deleting or lowering its entry in the same diff.
#
# Seeded on 2026-11-26 from a run on dev at 7252786f7: 41 lists in 33 files, and 5 hidden-cloud
# names (cloud, file) in 4 files, after this PR edited two docs lines that named DigitalOcean and Civo
# as connectable clouds.
#
# Shape:
#   entries:
#     - file: apps/console/lib/x.ts
#       rule: cloud-list
#       lists: 1
#       reason: why this list is a capability, an exhaustive map, generated or a fixture
#     - file: apps/docs/content/docs/x.mdx
#       rule: hidden-name
#       cloud: digitalocean
#       reason: why a user must read this name here
entries:
  # ── Rule 1, generated mirrors of catalog.json (regenerated, never edited) ──────────────────────
  - file: packages/cloud-catalog/src/generated.ts
    rule: cloud-list
    lists: 5
    reason: "generated by apps/console/scripts/gen-catalog.mjs from catalog.json; these ARE the derived sets (ALL/AVAILABLE/HIDDEN/PROVISIONABLE_CLOUDS) every other list must use"
  - file: apps/console/lib/cloud-providers/generated/catalog.ts
    rule: cloud-list
    lists: 3
    reason: "generated by apps/console/scripts/gen-catalog.mjs from catalog.json under the CI diff gate"
  # ── Rule 1, class C: exhaustive over the stored enum ────────────────────────────────────────────
  - file: apps/console/lib/db/schema/enums.ts
    rule: cloud-list
    lists: 1
    reason: "the cloud_provider Postgres enum; hiding a cloud deletes no enum value (spec §3 non-goals)"
  - file: apps/console/lib/cloud-providers/provider-slug.ts
    rule: cloud-list
    lists: 1
    reason: "class C: every slug a stored row carries, so a project on a hidden cloud still renders; choices go through isCloudOffered"
  - file: apps/console/components/evidence/evidence-query.ts
    rule: cloud-list
    lists: 1
    reason: "class C exception named in spec §4.4: the URL parser for the evidence filter stays complete; options come from the rows that exist"
  - file: packages/ui/src/provider-icon.tsx
    rule: cloud-list
    lists: 2
    reason: "class C (spec §2 row 20): icon slug union and list stay complete so existing rows on a hidden cloud render"
  - file: apps/console/app/(private)/dashboard/providers/extra-cloud-actions.ts
    rule: cloud-list
    lists: 1
    reason: "a type complement (Exclude<CloudProvider, aws|gcp|azure>) naming the three clouds with their own action files, not an offer"
  - file: apps/console/lib/connectors/cloud-connect-setup.ts
    rule: cloud-list
    lists: 1
    reason: "a type complement (Exclude<ConnectableCloudSlug, aws|gcp|azure>) naming the three clouds with their own setup field, not an offer"
  # ── Rule 1, class B: capability lists ───────────────────────────────────────────────────────────
  - file: apps/console/app/server/actions/identities.ts
    rule: cloud-list
    lists: 1
    reason: "capability: the clouds connected by a scoped API token; what may be connected is refused by assertCloudOffered"
  - file: apps/console/lib/cloud-providers/connections.ts
    rule: cloud-list
    lists: 1
    reason: "capability: clouds with no role federation (token clouds)"
  - file: apps/console/lib/cloud-providers/health/index.ts
    rule: cloud-list
    lists: 2
    reason: "capability (spec §2 row 19): clouds with a server-side health probe, and token clouds whose probe needs a held token"
  - file: apps/console/lib/cloud-providers/inventory/index.ts
    rule: cloud-list
    lists: 1
    reason: "capability: token clouds have no federated inventory read"
  - file: apps/console/lib/clusters/mint-eligibility.ts
    rule: cloud-list
    lists: 1
    reason: "capability (spec §2 row 19): the clouds the MINT_KUBECONFIG job serves; kubeconfig mint keeps working on a hidden cloud"
  - file: apps/console/lib/runners/token-mint-auth.ts
    rule: cloud-list
    lists: 1
    reason: "capability (spec §2 row 19): clouds whose token-mint routes are per-job-bound"
  - file: apps/console/lib/stores/use-cloud-provider-store.ts
    rule: cloud-list
    lists: 1
    reason: "capability (spec §2 row 19): clouds whose identities carry a VPC/subnet inventory"
  - file: apps/console/lib/oidc/keyless-readiness.ts
    rule: cloud-list
    lists: 1
    reason: "capability: clouds whose connect federates off this instance's issuer"
  - file: apps/console/components/cloud-connect/use-cloud-connect.tsx
    rule: cloud-list
    lists: 1
    reason: "capability: clouds with a dedicated connect guide in the docs; which connect sheets are offered is decided by the offered set"
  - file: apps/console/lib/validations/network.ts
    rule: cloud-list
    lists: 1
    reason: "capability with a load-bearing order: the clouds a project network template exists for, in the order the generated Go validation spec ids are emitted (spec §2 row 13; kept by ALI-L1)"
  - file: apps/console/lib/addons/catalog-export.ts
    rule: cloud-list
    lists: 1
    reason: "capability: the clouds an add-on fixture is generated for (the e2e provider matrix over infra/templates/project/); kept by ALI-L1"
  - file: apps/console/scripts/gen-offer-surface.ts
    rule: cloud-list
    lists: 1
    reason: "generator input over the template directories, which keep Alibaba so the parity boards do not move (spec §4.5); kept by ALI-L1"
  - file: packages/workload-identity/src/broker.ts
    rule: cloud-list
    lists: 1
    reason: "capability (spec §2 row 19): clouds the workload-identity broker federates"
  - file: packages/core/argocd/vault.go
    rule: cloud-list
    lists: 1
    reason: "capability (spec §2 row 19): clouds with a keyless Vault auth path"
  - file: packages/core/categories/secrets_keyless.go
    rule: cloud-list
    lists: 1
    reason: "capability (spec §2 row 19): clouds with a keyless secrets backend"
  # ── Rule 1, scripts and the e2e harness ─────────────────────────────────────────────────────────
  - file: scripts/e2e/reaper-result.mjs
    rule: cloud-list
    lists: 1
    reason: "the orphan reaper sweeps every cloud anyone ever provisioned on, offered or not (spec §4.5: reaper unchanged)"
  - file: scripts/e2e/refresh-e2e-issuer-token.mjs
    rule: cloud-list
    lists: 1
    reason: "capability: the clouds whose e2e identity is brokered by the issuer token"
  - file: scripts/spend-report/src/types.ts
    rule: cloud-list
    lists: 1
    reason: "the spend report reads every cloud that can bill, offered or not"
  - file: scripts/check-e2e-spend-guard.mjs
    rule: cloud-list
    lists: 1
    reason: "a self-test assertion inside the spend guard over a fixture world, not an offer"
  - file: test/e2e/addon_exclusions.go
    rule: cloud-list
    lists: 1
    reason: "capability (spec §2 row 19): the clouds an add-on exclusion applies to"
  - file: test/e2e/external_dns_identity.go
    rule: cloud-list
    lists: 1
    reason: "capability: the clouds with an external-dns workload-identity annotation"
  - file: test/e2e/t2_xacct_registry.go
    rule: cloud-list
    lists: 1
    reason: "capability: the clouds whose cross-account registry lane is wired"
  - file: apps/console/lib/seed/catalog.ts
    rule: cloud-list
    lists: 1
    reason: "demo seed data: the clouds its fixture rows are written on, all of them offered"
  # ── Rule 1, drift that a named issue removes ────────────────────────────────────────────────────
  - file: apps/console/lib/scanner/compare.ts
    rule: cloud-list
    lists: 1
    lifts: "#6872"
  - file: packages/brand/src/site/primitives.tsx
    rule: cloud-list
    lists: 1
    lifts: "#7816"
  # ── Rule 2 — surfaces that must name a hidden cloud ─────────────────────────────────────────────
  - file: apps/docs/content/docs/concepts/connectors.mdx
    rule: hidden-name
    cloud: digitalocean
    reason: "DigitalOcean Container Registry is a registry connector users can choose, not the DigitalOcean cloud"
  - file: apps/docs/content/docs/guides/connectors/pluggable.mdx
    rule: hidden-name
    cloud: digitalocean
    reason: "DigitalOcean Container Registry is a registry connector users can choose, not the DigitalOcean cloud"
  - file: apps/docs/content/docs/reference/cli/project.mdx
    rule: hidden-name
    cloud: digitalocean
    reason: "documents the refusal sentence a hidden cloud returns; naming one is the example"
  - file: apps/docs/content/docs/self-host/configuration.mdx
    rule: hidden-name
    cloud: digitalocean
    reason: "the self-host configuration reference lists every variable the bundled runner reads, including the token a cloud enabled with ALETHIA_ENABLE_HIDDEN_CLOUDS needs"
  - file: apps/docs/content/docs/self-host/configuration.mdx
    rule: hidden-name
    cloud: civo
    reason: "the self-host configuration reference lists every variable the bundled runner reads, including the token a cloud enabled with ALETHIA_ENABLE_HIDDEN_CLOUDS needs"
