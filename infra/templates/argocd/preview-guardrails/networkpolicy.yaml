# Preview-env network isolation (#887). Namespace-agnostic: metadata.namespace is intentionally
# omitted so ArgoCD applies each doc into the Application's destination namespace (preview-<pr>).
# A preview runs UNTRUSTED PR code, so the baseline is default-deny with a minimal allowlist:
# pods may resolve DNS and talk within their own preview namespace, and nothing else — no traffic
# to other tenants on the Fabric, no arbitrary egress to the internet or cloud metadata endpoints.
#
# default-deny: no ingress and no egress for every pod in the namespace (empty rule lists = deny).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preview-default-deny
  labels:
    alethia.io/preview: "true"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# allow-dns: egress on 53/UDP+TCP to the cluster's DNS and to NOTHING else, so workloads can resolve
# names. Two peers, because where a DNS packet is evaluated depends on whether the node runs a local
# DNS cache:
#   1. kube-system pods k8s-app=kube-dns — the plain path: the pod queries the kube-dns ClusterIP,
#      kube-proxy / the CNI translates it to a kube-dns pod, and the policy sees that pod.
#   2. the node-local DNS cache's link-local /32s — with NodeLocal DNSCache the query never reaches
#      a kube-dns pod: a hostNetwork cache on the node answers it, so the pod selector above admits
#      nothing and every lookup is dropped (#845 gcp leg, run 36716444473: the loadgenerator's
#      `wget http://frontend:80` got no answer at all). 169.254.20.10 is the address GKE's and the
#      upstream Kubernetes nodelocaldns addon listen on (the one pods use under GKE + Cloud DNS);
#      169.254.25.10 is Kubespray's default, the most common installer for a self-managed cluster
#      a customer brings. Both are single link-local addresses owned by the node, on port 53 only —
#      169.254.169.254 (cloud metadata) is deliberately NOT in range.
# GKE with kube-dns (not Cloud DNS) keeps pods pointed at the kube-dns ClusterIP and the cache binds
# THAT address on the node, so the evaluated destination is the ClusterIP itself — a per-cluster
# value no static file can name. The runner adds it as a separate policy
# (alethia-allow-node-local-dns, packages/core/provisioner/deploy_namespace.go) after applying this
# bundle.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preview-allow-dns
  labels:
    alethia.io/preview: "true"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
        - ipBlock:
            cidr: 169.254.25.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# allow-intra-namespace: ingress and egress between pods within the same preview namespace, so a
# multi-service preview (app + its own db/cache) works while staying isolated from the rest of the
# Fabric. Uses podSelector {} on both ends — same-namespace only (NetworkPolicy peers without a
# namespaceSelector match the policy's own namespace).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preview-allow-intra-namespace
  labels:
    alethia.io/preview: "true"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
