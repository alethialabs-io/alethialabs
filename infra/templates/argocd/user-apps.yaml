{{- if .AppsDestinationRepo }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: User application deployments
  sourceRepos:
    - "{{ .AppsDestinationRepo }}"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: apps
  source:
    repoURL: {{ .AppsDestinationRepo }}
    targetRevision: HEAD
    # The environment's own apps_path, or the repo root when it names none. `apps_path` means the
    # same thing on all three placement modes; it was previously read only by the namespace and
    # vcluster paths, so a dedicated environment silently delivered the repo root no matter what
    # it declared. Validated by ValidateAppsPath before it reaches here.
    path: {{ if .AppsPath }}{{ .AppsPath }}{{ else }}.{{ end }}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
