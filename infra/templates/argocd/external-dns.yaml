{{- /* external-dns only renders when DNS is enabled, a domain exists, AND the cloud (or
       DNS connector) has a working external-dns backend — DNSProvider() returns "" otherwise
       and the whole app is skipped instead of deploying a broken controller. */ -}}
{{- if and .DNSEnabled .DomainName .DNSProvider }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: "1.15.0"
    helm:
      values: |
        fullnameOverride: external-dns
        interval: 30m
        policy: sync
        {{- if eq .DNSProvider "webhook" }}
        {{- /* Hetzner Cloud DNS via the official webhook sidecar; token seeded by the
               deploy path into the external-dns-hetzner Secret before the app syncs. */}}
        provider:
          name: webhook
          webhook:
            image:
              repository: docker.io/hetzner/external-dns-hetzner-webhook
              tag: v0.3.3
            env:
              - name: HETZNER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: external-dns-hetzner
                    key: token
        {{- else }}
        provider: {{ .DNSProvider }}
        {{- end }}
        registry: txt
        triggerLoopOnEvent: true
        {{- if eq .DNSProvider "cloudflare" }}
        {{- /* Connector-backed: the api_token Secret is seeded by the deploy path from
               the job's connector credential — no cloud identity annotation needed. */}}
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: external-dns-cloudflare
                key: apiToken
        {{- end }}
        serviceAccount:
          name: external-dns-sa
          annotations:
            {{- if eq .DNSProvider "aws" }}
            eks.amazonaws.com/role-arn: arn:aws:iam::{{ .AWSAccountID }}:role/{{ .ClusterName }}-external-dns
            {{- else if eq .DNSProvider "google" }}
            iam.gke.io/gcp-service-account: {{ .GCPExternalDNSSA }}
            {{- else if eq .DNSProvider "azure" }}
            azure.workload.identity/client-id: {{ .AzureExternalDNSClient }}
            {{- end }}
        {{- if eq .DNSProvider "azure" }}
        podLabels:
          azure.workload.identity/use: "true"
        {{- /* external-dns's azure provider reads /etc/kubernetes/azure.json (its default
               --azure-config-file) UNCONDITIONALLY — v0.15.0's getConfig() os.ReadFile()s it
               and errors out BEFORE applying --azure-resource-group/--azure-subscription-id,
               so the flags alone cannot replace it. AKS lays no such file down on a
               workload-identity cluster, which is why #2868 presented as file-not-found while
               the Application still read Synced. The Secret is seeded by the deploy path
               before this app's first sync, exactly like the hetzner/cloudflare tokens above;
               it holds four identifiers and useWorkloadIdentityExtension, never a secret.
               `secretConfiguration` would do this in-chart but is DEPRECATED in 1.15.0 and
               would inline the ids into this Application spec. */}}
        extraVolumes:
          - name: azure-config
            secret:
              secretName: external-dns-azure
        extraVolumeMounts:
          - name: azure-config
            mountPath: /etc/kubernetes
            readOnly: true
        {{- end }}
        domainFilters:
          - {{ .DomainName }}
        {{- if eq .DNSProvider "aws" }}
        {{- /* WITHOUT this, external-dns finds ZERO zones and silently writes nothing.

               Route53 zone discovery filters the account's hosted zones through the SAME
               domainFilter set above (provider/aws/aws.go:339 in v0.15.0):

                 if !p.domainFilter.Match(zone.Name) { if !p.zoneMatchParent { …skip… } }

               and `matchFilter` only accepts a zone that EQUALS a filter or sits BELOW it —
               never a zone ABOVE it. So a cluster on `prod.example.com` whose records live in
               the customer's `example.com` zone matches nothing: dot counts differ, and
               HasSuffix("example.com", ".prod.example.com") is false.

               That is the normal shape, not an edge case. A customer delegates one zone and
               runs many clusters under it, and Alethia hands external-dns the per-environment
               subdomain as its filter. The controller then reports Healthy — it is running
               fine, it simply has no zone to write into — while every Ingress it should
               publish stays unresolvable.

               MEASURED on aws/gitops run 33095437088. The Ingress had its ALB address
               (k8s-argocd-argocdar-…elb.amazonaws.com) for the full 10-minute probe and no
               record ever appeared. The ACM certificate issued in the same run, which looks
               contradictory and is not: tofu writes the validation CNAME
               (module.acm[0].aws_route53_record.cert_validation), never external-dns.

               `--aws-zone-match-parent` is upstream's flag for exactly this. It widens ZONE
               DISCOVERY only; which records get published is still bounded by domainFilters,
               so the blast radius inside the parent zone is unchanged. */}}
        extraArgs:
          - --aws-zone-match-parent
        {{- end }}
        txtOwnerId: {{ .Environment }}-{{ .Region }}-{{ .DNSZoneID }}
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3
{{- end }}
