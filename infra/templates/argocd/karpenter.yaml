{{- if and (eq .Provider "aws") .EnableKarpenter }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: oci://public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.14.0"
    helm:
      values: |
        fullnameOverride: karpenter
        serviceAccount:
          create: true
          name: karpenter
          {{- /* IRSA (#6559). The role's trust policy (project/aws/irsa.tf, module.irsa_karpenter)
               names exactly karpenter:karpenter — this ServiceAccount in the destination
               namespace below. The method REFUSES the render when the role output is empty, so
               Karpenter is never installed without its AWS identity. */}}
          annotations:
            eks.amazonaws.com/role-arn: {{ .KarpenterServiceAccountRoleArn | printf "%q" }}
        replicas: 2
        settings:
          clusterName: {{ .ClusterName }}
          clusterEndpoint: {{ .ClusterEndpoint }}
          interruptionQueue: {{ .KarpenterQueueName }}
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3
{{- end }}
