{{- if and .AppsDestinationRepo (not .AppsPath) }}
# RENDERED ONLY WHEN THE ENVIRONMENT NAMES NO apps_path.
#
# This ApplicationSet exists to DISCOVER environments in a repo that has none declared — a plain
# Kustomize repo pointed at Alethia with no per-tier configuration. Once an environment names an
# `apps_path`, discovery is not merely redundant: it is actively wrong. The generator below is
# anchored at the repo root and globs `overlays/*`, so the Fabric's own environment adopted EVERY
# overlay in the repo, including the ones its shared `namespace`/`vcluster` tiers were placing
# themselves. Both Applications then claimed the same Deployments, both with selfHeal: true:
#
#   Deployment/adservice is part of applications argocd/app-<project>-<ns> and apps-<ns>
#
# leaving those tiers OutOfSync/Missing. test/e2e/t2_fabric_demo.go already refuses to run in that
# configuration ("the base dedicated deploy's apps-overlays ApplicationSet already delivers them,
# so the placements would prove nothing and would collide") — this makes the product agree with the
# harness instead of relying on the caller to keep two repos apart.
#
# An explicit path wins over a glob. Naming no path is unchanged: root Application + this discovery.
#
# Multi-environment apps delivery (decoupled env-model, #838). An ApplicationSet whose Git
# directories generator discovers every overlays/ENV directory in the apps repo and renders one
# ArgoCD Application per overlay — the standard Kustomize GitOps layout (base + overlays/ENV), and
# exactly what the enterprise-demo uses (overlays/dev to ns boutique-dev, overlays/staging to ns
# boutique-staging). This is ADDITIVE to the single root Application in user-apps.yaml: a flat apps
# repo (no overlays) yields ZERO generated Applications here (harmless); an overlays repo gets one
# Application per environment. The generated apps run under the same "apps" AppProject.
#
# facts.Labels are rendered into the template metadata.labels so the generated Applications carry the
# B1.4 classification/sweep labels — InjectCommonLabels only stamps top-level Application/AppProject
# docs, not an ApplicationSet, so the propagation is done explicitly here. The inner ArgoCD
# Go-template path expressions are emitted LITERALLY (backtick-escaped) for ArgoCD to evaluate.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-overlays
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ .AppsDestinationRepo }}
        revision: HEAD
        directories:
          - path: overlays/*
  template:
    metadata:
      name: 'apps-{{ `{{ .path.basename }}` }}'
      {{- if .Labels }}
      labels:
        {{- range $k, $v := .Labels }}
        {{ $k }}: "{{ $v }}"
        {{- end }}
      {{- end }}
    spec:
      project: apps
      source:
        repoURL: {{ .AppsDestinationRepo }}
        targetRevision: HEAD
        path: '{{ `{{ .path.path }}` }}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
{{- end }}
