# SPDX-License-Identifier: AGPL-3.0-only
#
# Offer exclusions — the machine-readable half of the cloud-parity rule.
#
# CLAUDE.md: "a per-cloud change covers ALL clouds in the same pass; a cloud that can't is an EXPLICIT
# documented exclusion, never silent." This file is where "explicit" lives. `check-offer-parity`
# (apps/console/scripts) fails on any offer a cloud can't build unless it is listed here, and the
# generated matrix prints every entry as a documented exclusion rather than hiding it.
#
# An entry is a DECISION, not a mute button. Each one states why the cloud cannot honor the offer —
# a product limit, a platform architecture choice — never "we haven't got to it yet". Work not yet
# done belongs on the board as an issue, where it stays visible; an exclusion says we are not going
# to do it, and the matrix shows it to anyone reading.
#
# Fields:
#   offer   — the cell being decided, in the canvas's own vocabulary. THREE shapes, one per grid the
#             matrix draws, and an entry whose shape does not match its grid matches nothing and
#             silently does nothing:
#
#               <kind>:<variant>            an engine choice          database:mysql
#                                           ("<kind> engines" grids)  cache:valkey
#
#               <kind>:<option>             a switch on a kind with   bucket:versioning
#                                           NO engine axis            network:single_nat_gateway
#                                           ("Carrier coverage")      registry:immutable_tags
#
#               <kind>:<variant>:<option>   a switch whose answer     database:postgres:iam_auth
#                                           differs PER ENGINE        database:mysql:iam_auth
#                                           ("Option-level offers")
#
#             Which shape a given switch takes is not a choice made here: the guard adjudicates an
#             option per engine only when it is in `ADJUDICATED` (apps/console/scripts/
#             check-offer-parity.mjs), and every other option is measured once per cloud. Copy the
#             key from the matrix cell you are answering and it will always be right.
#   cloud   — the template directory name, or "*" for every cloud
#   reason  — one line, in the product's voice; printed verbatim in the matrix — under "Documented
#             exclusions" for an `exclusions:` entry, under "Known gaps on the baseline" for a
#             `baseline:` one, and under "Reviewed branch-guard wirings" for a `wired:` one. All are
#             read by people deciding whether to pick that cloud, so write it as what a USER gets,
#             not as what the code does.
#
# FOUR sections, and the difference between them is the decision each one records:
#   exclusions:         — this cloud will never honor the offer. A product decision.
#   baseline:           — it should honor it and does not yet. Real debt, carries `issue:` + `state:`.
#   wired:              — it DOES honor it, through a branch guard the code cannot self-evidence, and
#                         a person has read that branch and confirmed it (#1829/#1830). Neither a
#                         limit nor debt.
#   carried_in_cluster: — it DOES honor it, through a component the platform installs INTO THE CLUSTER
#                         rather than through OpenTofu. The carrier rule structurally cannot see these:
#                         L5 wants a tfvar declared in the template and read by a resource argument,
#                         and an in-cluster component writes no tfvar at all.
#
#                         NOT an exclusion (the offer is delivered — an `exclusions:` reason prints
#                         under a heading meaning "this cloud cannot", which for cert-manager on
#                         gcp/azure is the opposite of the truth) and NOT `wired:` (that is about a
#                         ⚠️ branch guard in provider code; there is no branch here to read).
#
#                         ⚠️ It is a CHECKABLE claim, not prose, and that is deliberate. #1864 is the
#                         cautionary case: `exclusions:` was the one claim nothing re-read, so a
#                         measured gap could be discharged by RECLASSIFYING it rather than fixing it —
#                         green either way. A bare "cert-manager does this one" would reopen that hole
#                         through a third door. So an entry names the PREDICATE that decides per cloud
#                         and the guard RE-READS it from the Go source every run: drop a cloud from
#                         `certManagerDNS01Solvers` and every entry claiming it goes stale. An entry
#                         with no `predicate:` is REFUSED, and an entry for a cell OpenTofu carries
#                         anyway is refused too — it would credit the wrong mechanism in the matrix
#                         and would keep the cell green if the template carriage later broke.
#
#                         Extra fields: `by` (the component, e.g. cert-manager), `predicate` (the Go
#                         `map[string]…` whose KEYS are the clouds it ships for), `source` (the file
#                         that map lives in, repo-relative).
#   issue   — the tracking issue. Required in `baseline:` (an entry with no issue is an amnesty
#             nothing will ever come back to collect); optional in `exclusions:`, where it records
#             the thread the decision was made in.
#   state   — `baseline:` ONLY, and required there: the state the guard finds the cell in, verbatim
#             from its own report — `no-carrier`, `missing-branch`, `unwired-template` or
#             `gated-carrier`. Copy the value the guard prints; it names it in the failure.
#
#             This is what lets the ratchet tell "the gap was FIXED, delete this entry" from "the gap
#             CHANGED SHAPE, update this entry". Without it the two are the same observation — the
#             cell no longer reproduces the state we remember — and the guard has to guess. It once
#             guessed "fixed" for a cell that had drifted from `unwired-template` to `gated-carrier`,
#             i.e. from a proven gap to a gap wired on WEAKER evidence, and told a reviewer to delete
#             the board record of something still shipping.
#
#             `gated-carrier` (⚠️) is a legitimate value here. It does not fail the build — the guard
#             cannot decide whether the key a branch writes IS the feature the switch names — but it
#             is not honoring either, so a cell in that state can be boarded like any other.

exclusions:
  # ── Hetzner — compute-only by architecture ──────────────────────────────────────────
  # Hetzner exposes no managed data services. What a Hetzner project gets is in-cluster Helm charts
  # installed by ArgoCD (CloudNativePG for Postgres, Valkey for cache), so the engine is fixed by the
  # chart and nothing about it travels through OpenTofu. This is the documented ceiling in
  # hetzner-connector-parity, not a gap: the canvas floor already narrows the engine list here.
  - offer: database:postgres
    cloud: hetzner
    reason: Provisioned in-cluster by the CloudNativePG chart, not by OpenTofu — no tfvar carries the engine.
  - offer: cache:valkey
    cloud: hetzner
    reason: Provisioned in-cluster by the Valkey chart, not by OpenTofu — no tfvar carries the engine.

  # ── Hetzner TLS and WAF — the same architectural ceiling, settled by #1810 ───────────
  # These were baselined while #1810 read as "the switch is dropped in the console". Wiring the
  # carrier settled it: on Hetzner there is nothing on the other side of the wire — the whole
  # cloud's TLS story is in-cluster, exactly like its Postgres.
  #
  # CORRECTED by the cert-manager platform lane. This entry used to read "managed_certificate is
  # still HONORED on Hetzner: cert-manager issues the certificate inside the cluster" — which was
  # never true. cert-manager was installed NOWHERE in this repo, and after the catalog copy was
  # fixed this exclusion was the last place still asserting it.
  #
  # Making cert-manager a platform add-on did not rescue Hetzner either: cert-manager ships no
  # Hetzner Cloud DNS DNS01 solver in the box (it needs a third-party webhook — the same upstream
  # gap external-dns fills with its webhook sidecar), and HTTP01 is not an alternative because
  # Hetzner has no ingress controller.
  #
  # CORRECTED AGAIN by #1816, and the correction matters because a `reason:` prints VERBATIM into
  # the public matrix. The previous text opened "Hetzner sells no managed certificate", which is
  # not true and is checkable: `hcloud_managed_certificate` is in the pinned provider (1.67.0),
  # alongside `hcloud_uploaded_certificate`. What it is, is a LOAD BALANCER certificate — the only
  # thing that can present one is an `hcloud_load_balancer`, and this template provisions none.
  # A Talos cluster on Hetzner takes traffic at the nodes; there is no Hetzner-managed listener to
  # terminate TLS on, so there is nothing for the certificate to be attached to. #1816 creating the
  # DNS zone does not change that: a zone is not a listener.
  #
  # It stays an EXCLUSION rather than moving to the baseline because it is not scheduled work. The
  # cell would need a load balancer this cloud's architecture does not use, which is the same "not
  # how this cloud is built" shape as the WAF entry below, not debt with a fix pending.
  - offer: dns:managed_certificate
    cloud: hetzner
    reason: Hetzner's managed certificate can only be presented by a Hetzner load balancer, and an Alethia Hetzner cluster takes traffic at the nodes instead — so there is no listener to attach one to, and cert-manager ships no Hetzner DNS01 solver to issue one in-cluster either.
  - offer: dns:waf_enabled
    cloud: hetzner
    reason: Hetzner sells no web application firewall — the product does not exist.
  # Alibaba is a DIFFERENT shape from Hetzner's above, and the reason has to say so: the product
  # exists and is good, but the provider models it as an ACCOUNT-level purchase. `alicloud_wafv3_instance`
  # takes no arguments at all — four computed attributes and a `timeouts` block — so nothing could
  # distinguish two instances, and its create/delete are CreatePostpaidInstance/ReleaseInstance. The
  # companion data source accepts no filter arguments either, because there is nothing to filter by.
  # Two projects in one account therefore share one firewall, and destroying either releases it for
  # both. Withdrawn in #1841 while nothing was attached to it, which is the only cheap moment: once a
  # binding lands, the same cross-project release drops a firewall inspecting live traffic.
  - offer: dns:waf_enabled
    cloud: alibaba
    reason: Unavailable on Alibaba Cloud. The alicloud provider models WAF 3.0 as an account-level purchase — the instance resource takes no arguments at all, so nothing distinguishes two of them, and its create/delete are CreatePostpaidInstance/ReleaseInstance. A per-project state model cannot own that safely: destroying one project would release the account's firewall out from under every other project sharing it. Buy a WAF 3.0 instance in your account and put it in front of your ingress from the WAF console.
    issue: '#1841'

  # ── Valkey on the clouds that have no Valkey product ────────────────────────────────
  # Checked against the pinned providers, not assumed: azurerm exposes `azurerm_managed_redis`
  # (Redis only), and `alicloud_kvstore_instance.instance_type` accepts Redis or Memcache. Neither
  # cloud sells Valkey, so the canvas no longer offers it there (#1420 made the floor catalog-derived).
  # These entries keep the decision visible in the matrix rather than leaving a blank.
  - offer: cache:valkey
    cloud: azure
    reason: Azure Cache/Managed Redis has no Valkey engine — the product does not exist.
  - offer: cache:valkey
    cloud: alibaba
    reason: ApsaraDB KVStore offers Redis or Memcache only — no Valkey engine.

  # ── local — the kind-cluster development template ───────────────────────────────────
  # `infra/templates/project/local` stands up a kind cluster for development. It has no cloud behind
  # it, so there are no managed services to provision at all; data services come from the same
  # in-cluster charts as Hetzner.
  - offer: database:postgres
    cloud: local
    reason: A local kind cluster has no managed services — data services run in-cluster.
  - offer: database:mysql
    cloud: local
    reason: A local kind cluster has no managed services — data services run in-cluster.
  - offer: cache:redis
    cloud: local
    reason: A local kind cluster has no managed services — data services run in-cluster.
  - offer: cache:valkey
    cloud: local
    reason: A local kind cluster has no managed services — data services run in-cluster.

  # ── Keyless DB auth where there is no managed database to authenticate TO ────────────
  # `iam_auth` trades a password for a short-lived cloud IAM token. That needs two things the
  # in-cluster path has neither of: a managed instance the cloud controls, and a cloud identity plane
  # to mint tokens against. Hetzner and local run Postgres as a CloudNativePG chart inside the
  # cluster, so there is no cloud-side login to bind an identity to. Same architectural ceiling as
  # the database:postgres entries above — not unfinished work.
  #
  # Since #1510 the canvas GATES the toggle on these cells, and `reason` here is checked against the
  # string the canvas shows (packages/core/manifests/keyless.go, `keylessCells`). Reword one and the
  # guard reds until the other agrees — a matrix that documents different reasoning from the product
  # is worse than one that documents none, because it is believed.
  - offer: database:postgres:iam_auth
    cloud: hetzner
    reason: Unavailable on Hetzner. Postgres runs in-cluster via CloudNativePG — there is no managed instance and no cloud identity plane to mint database tokens against. This database keeps a generated password.
  - offer: database:postgres:iam_auth
    cloud: local
    reason: A local kind cluster has no cloud identity plane — there is nothing to mint an IAM token against.
  - offer: database:mysql:iam_auth
    cloud: local
    reason: A local kind cluster has no cloud identity plane — there is nothing to mint an IAM token against.

  # ── Alibaba keyless DB auth — settled by #1510 ───────────────────────────────────────
  # This was BASELINE while the evidence was thin ("whether ApsaraDB offers a RAM data-plane login is
  # undetermined"). It is now established, from Alibaba's own docs, that it does not:
  #
  #   · `ModifyPGHbaConfig` ENUMERATES every auth method RDS PostgreSQL accepts — trust, reject,
  #     scram-sha-256, md5, password, gss, sspi, ldap, radius, cert, pam. Upstream Postgres's list,
  #     with no cloud-identity method in it.
  #   · `CreateAccount` makes `AccountPassword` REQUIRED for MySQL, and takes no auth-mode parameter.
  #   · RAM/STS covers the console and OpenAPI. RDS appears on "services that work with STS" for
  #     control-plane access; that is not a database login, and it is the thing most likely to be
  #     misread as one.
  #   · The `alicloud` provider has no equivalent argument — `alicloud_db_account` is name+password,
  #     and `db_instance`'s `role_arn` is for KMS/TDE, not login.
  #
  # The closest reachable posture is KMS-Secrets-rotated passwords, or LDAP/AD on PostgreSQL only —
  # neither is token-as-password. So this is a capability ceiling, not debt, and it is an exclusion.
  - offer: database:postgres:iam_auth
    cloud: alibaba
    reason: Unavailable on Alibaba Cloud. RAM governs ApsaraDB's control plane only — there is no data-plane token login for a keyless connection to authenticate with. This database keeps a generated password.
  - offer: database:mysql:iam_auth
    cloud: alibaba
    reason: Unavailable on Alibaba Cloud. RAM governs ApsaraDB's control plane only — there is no data-plane token login for a keyless connection to authenticate with. This database keeps a generated password.

  # ── Object storage that cannot be UN-encrypted ──────────────────────────────────────
  # The switch offers both positions and these three clouds only have one. S3 has applied SSE-S3 to
  # every new object since January 2023 with no way to turn it off; Cloud Storage encrypts every
  # object server-side and exposes no disable; Azure Storage Service Encryption is permanent on every
  # account. So the OFF position is the unbuildable one, and it is unbuildable because the platform
  # refuses it — a ceiling, not unfinished wiring.
  #
  # The honest alternative is to stop offering the switch on these clouds (a canvas change, not a
  # template one). Recorded here rather than assumed, so the matrix says out loud that the toggle
  # does nothing on three of the four clouds that show it.
  - offer: bucket:encryption_enabled
    cloud: aws
    reason: S3 encrypts every object at rest and the setting cannot be turned off — this switch is informational on AWS.
  - offer: bucket:encryption_enabled
    cloud: gcp
    reason: Cloud Storage encrypts every object at rest and the setting cannot be turned off — this switch is informational on Google Cloud.
  - offer: bucket:encryption_enabled
    cloud: azure
    reason: Azure Storage encrypts every blob at rest and the setting cannot be turned off — this switch is informational on Azure.

  # ── NAT gateways Hetzner does not sell ──────────────────────────────────────────────
  # `single_nat_gateway` chooses between one shared NAT gateway and one per availability zone. Hetzner
  # Cloud has neither: private networks route through a server you run yourself, and the hcloud
  # provider exposes no managed NAT gateway resource to count one of or several of. Same architectural
  # ceiling as the data-service entries above.
  - offer: network:single_nat_gateway
    cloud: hetzner
    reason: Hetzner Cloud has no managed NAT gateway — egress routes through the cluster's own nodes, so there is nothing to have one of or one per zone.

  # ── Alibaba managed TLS certificate — settled by #1824 ──────────────────────────────
  # This was BASELINE on the reading that the build was merely unfinished — the entry said it "needs
  # a CAS free-DV request plus the AliDNS validation record". That request resource does not exist.
  # Checked against the PINNED provider, aliyun/alicloud 1.286.0 (the version
  # infra/templates/project/alibaba/.terraform.lock.hcl resolves), by reading its own schema: every
  # resource whose name mentions `cert`, `ssl` or `cas`, plus a sweep of all 1169 resource schemas
  # for a validation or challenge attribute.
  #
  #   · `alicloud_ssl_certificates_service_certificate` and its legacy alias `alicloud_cas_certificate`
  #     are the SAME schema, and it is UPLOAD-only — cert, key, encrypt_cert, encrypt_private_key,
  #     sign_cert, sign_private_key, i.e. PEM material you already hold. No domain argument, no
  #     validation method, no issuance status. There is nothing here to request.
  #   · `alicloud_ssl_certificates_service_pca_cert` and `_pca_certificate` issue from a PRIVATE CA
  #     you operate (`parent_identifier`, `common_name`, `years`). A private root is not publicly
  #     trusted, so it is not a certificate a browser will accept for the domain.
  #   · `alicloud_esa_certificate` requires a `site_id` — an Edge Security Acceleration site, a
  #     separate CDN product this template does not provision and which has no tie to AliDNS.
  #   · `alicloud_waf_certificate` requires a WAF `instance_id` and takes certificate + private_key:
  #     it ATTACHES material you already have.
  #   · `alicloud_alidns_record` DOES exist, so the validation-record half is expressible — but no
  #     certificate resource in the provider emits a challenge to put in it. Nothing in the provider
  #     exposes a validation or challenge attribute at all, which is exactly what the AWS template
  #     consumes as `aws_acm_certificate.domain_validation_options`. Without one, the shape the other
  #     clouds use cannot be written here.
  #
  # The ceiling is the PROVIDER's declarative surface, not our backlog. Alibaba Cloud does sell free
  # DV certificates through SSL Certificates Service, but only the console and OpenAPI can order one,
  # so there is no resource for the template to declare — the same shape as the Hetzner NAT gateway
  # entry above, a capability the cloud has that its Terraform provider does not expose. That makes
  # it a ceiling rather than debt. Revisit if aliyun ships a certificate-request resource.
  #
  # NOTE the honest consequence, because an exclusion must not read as an excuse: this switch issues
  # NOTHING on Alibaba, while the canvas still advertises it as "Managed TLS certificate from Alibaba
  # Cloud SSL Certificates Service" (catalog.json `live.certOptions`). The remaining honest
  # alternative is to stop offering the switch here, a canvas change rather than a template one,
  # tracked separately.
  #
  # ⚠ The `reason:` below was CORRECTED at merge time and the correction is the point of this note.
  # It used to end "— install the cert-manager add-on to have the cluster issue and renew TLS
  # instead", and it was written when cert-manager was a marketplace add-on and Hetzner's entry (two
  # blocks up) still claimed cert-manager issued there. Both halves of that sentence are now false:
  # the cert-manager platform lane REMOVED it from `ADDON_CATALOG` (it is installed by the deploy,
  # not by a user ticking a box), and it ships NO Alibaba Cloud DNS DNS01 solver in the box — the
  # same upstream gap that keeps Hetzner out, and the reason that entry was corrected in the same
  # lane. So the old sentence told a user to install something they cannot install, to do a thing it
  # could not do. A `reason:` prints VERBATIM into the public matrix, which is why a stale one here
  # ships a false claim about a cloud we support rather than merely reading oddly.
  - offer: dns:managed_certificate
    cloud: alibaba
    reason: Unavailable on Alibaba Cloud. The alicloud provider can only upload a certificate you already hold, never order one, and cert-manager ships no Alibaba DNS01 solver — so nothing issues a certificate here, by OpenTofu or in-cluster. Bring your own certificate.
    issue: #1824

  # ── Point-in-time recovery on Alibaba Tablestore — not a property of the table ───────
  # Boarded under #1815 while it read as a missing carrier. It is not: there is nothing on the other
  # side of the wire to carry it TO. `alicloud_ots_table` exposes instance_name, table_name,
  # primary_key, defined_column, time_to_live, max_version, allow_update,
  # deviation_cell_version_in_sec and the four SSE arguments — no backup or recovery argument of any
  # kind — and the Tablestore API has none either.
  #
  # Get the claim right, because "the product does not exist" is falsifiable here and would make the
  # matrix wrong: Tablestore CAN be restored. It is restored through Cloud Backup (HBR), a separate
  # service with its own vault, its own billing and its own IAM, driven by a SCHEDULED plan
  # (`alicloud_hbr_ots_backup_plan`, schedule `I|{startTime}|{interval}`, full with optional
  # incremental). Its restore points are backup runs, not a continuous log — the console's restore
  # range is bounded by the plan's schedule, which is not what "point in time" promises. Alethia will
  # not map a per-table toggle onto a separately-billed backup service, so the honest statement is
  # that the capability is not expressible as a property of the table.
  #
  # Re-derived against the post-#1833 guard: the carrier probe still measures this cell `no-carrier`,
  # i.e. it reproduces in the SAME shape it was boarded in. Nothing here is a ratchet "fixed —
  # delete it". The entry leaves `baseline:` because the ceiling claim above reclassifies it, and
  # because the guard refuses to let one cell be both excluded and boarded as debt.
  - offer: nosql:point_in_time_recovery
    cloud: alibaba
    reason: Tablestore has no point-in-time recovery setting on the table — restoring is a job you run in Cloud Backup, a separately-billed service, against a backup plan you schedule yourself, rather than something the table can be told to do.

  # ── Ordered delivery on Alibaba — an argument with nothing behind it ─────────────────
  # The other three clouds are built (#1812). Alibaba is not, and the reason is NOT that the
  # argument is missing — that would make this baseline debt, and it is deliberately not filed as
  # such. `alicloud_message_service_queue.queue_type` exists in the pinned provider 1.286.0 (read
  # out of `tofu providers schema` against the real lockfile, not off a docs page), and Alibaba's
  # CreateQueue reference documents `QueueType` with exactly two values, verbatim:
  #   "The type of the queue. Valid values: normal: standard queue. fifo: FIFO queue." — default normal
  #
  # That sentence is the entire published specification. Alibaba states no ordering scope, no
  # message-group or deduplication key for a publisher to set, no throughput ceiling, no region
  # availability and no pricing; the Simple Message Service limits page does not use the word FIFO
  # anywhere, and the console's create-queue panel has no queue-type selector at all. Alibaba's own
  # best-practice guidance for this service still tells applications to attach a sequence id and
  # sort client-side.
  #
  # Wiring it would ship the one thing this guard exists to prevent: a switch that reaches a real
  # provider argument and promises the user a behaviour nobody has stated. Alethia does not offer a
  # guarantee the cloud does not make. Revisit if Alibaba publishes one — the argument is already
  # there, so it would be a small change and a large amount of new documentation. Until then the
  # canvas card reads "Standard" on Alibaba and the field says the switch is not applied.
  #
  # Re-derived against the post-#1833 guard, the same way #1815's Tablestore entry above was: the
  # carrier probe still measures this cell `no-carrier`, i.e. it reproduces in exactly the shape it
  # was boarded in. This is NOT a ratchet "fixed — delete it". It leaves `baseline:` because the
  # ceiling claim above reclassifies it, and because the guard refuses to let one cell be both
  # excluded and boarded as debt. packages/core/cloud/queue_ordered_parity_test.go pins the
  # ABSENCE, so a later one-line "fix" cannot contradict this entry in silence.
  - offer: queue:ordered
    cloud: alibaba
    reason: Alibaba Cloud's queue service accepts a FIFO queue type but publishes no ordering guarantee behind it — no delivery order, no message key to group by, no throughput limit — so Alethia does not offer ordered delivery there.
    issue: #1812
  # ── Azure Container Registry — neither switch exists where a template can reach ──────
  # Both were baselined under #1811 as "not sent to ACR yet". They are not unfinished wiring: there
  # is nothing on the other side to send them to. The pressure to make the parity guard green points
  # at two wrong answers here, so the reasoning is written down rather than the verdict alone.
  #
  # Tag immutability. `azurerm_container_registry` has no immutability argument — the resource is
  # `name`, `resource_group_name`, `location`, `sku`, `admin_enabled`, georeplications, network and
  # policy blocks, and `modules/acr/main.tf` uses all of the ones that exist. Locking a repository on
  # ACR is a per-repository DATA-PLANE operation (`az acr repository update --write-enabled false`)
  # that Resource Manager does not model, so no argument on any resource can carry the choice.
  # `quarantine_policy_enabled` is a DIFFERENT feature — hold a newly pushed image until it is
  # validated — and must not be substituted for this one to make a cell go green.
  #
  # Image scanning. On Azure this is Microsoft Defender for Containers, expressed as
  # `azurerm_security_center_subscription_pricing`. It is SUBSCRIPTION-scoped and billed: the
  # provider's own docs warn that changing the pricing tier to Standard affects all resources of that
  # type in the subscription and can be costly, and that deleting the resource resets the tier to
  # Free. A per-project switch wired to it would re-bill an entire subscription on deploy and, on
  # teardown, disable Defender for every other workload in it. That is not a per-project setting.
  - offer: registry:immutable_tags
    cloud: azure
    reason: Azure Container Registry has no tag-immutability setting on the registry — locking a repository is an operation outside Resource Manager, so no template argument can carry your choice.
    issue: #1811
  - offer: registry:vulnerability_scanning
    cloud: azure
    reason: Image scanning on Azure is Microsoft Defender for Containers, a billed security plan that switches on for the whole subscription — not something one project's registry can turn on for itself.
    issue: #1811

# ── Baseline — real gaps, already boarded ───────────────────────────────────────────────
#
# NOT exclusions. These are offers a cloud genuinely cannot honor today and that we intend to fix;
# each carries the issue tracking it. They do not fail the build, so the guard could land on a
# codebase that already had the debt — but a NEW gap does fail, and the list RATCHETS: when a cell is
# MEASURED and comes out honored, the guard fails until its entry is deleted. It can only shrink.
#
# "Measured" is doing work in that sentence. An entry whose cell the guard no longer produces at all
# — the cloud dropped off `offeredOn`, the key was renamed, the kind lost its tofu evidence — is not
# fixed and is never asked for back; the guard reports it as "did NOT measure" and says what to check.
# Emptiness is not evidence: it is the absence of it.
#
# Delete the entry in the same PR that fixes the gap.

baseline:
  # Everything below arrived in one pass, from the CARRIER check the guard gained when it learned to
  # measure `<kind>:<option>` cells and to walk variables.tf → resource argument. None of it is new
  # breakage; all of it was already shipping, and none of it was visible before, because a kind with
  # no engine axis could not be named by the old offer key.
  #
  # The shapes, so the list reads as something other than a wall:
  #   · a switch the cloud's provider does
  #     not carry, because the thing on the
  #     far side is not built yet            (registry:vulnerability_scanning on alibaba)
  #
  # That is the whole list. ALL THREE shapes this section opened with are gone, and every one of
  # them left the honest way — built, or established as a product limit. None was reworded to make
  # the guard green, which is the failure mode the ratchet exists to catch.
  #
  #   · "a switch NO provider carries" was both registry switches when the carrier check first
  #     measured them. #1811 carried `immutable_tags` to ECR, Artifact Registry and ACR; scanning
  #     reached the two clouds where it is a repository property, and the two where it is a
  #     separate service to stand up stayed here under their own issues (#1844, #1845).
  #   · "a switch carried into tfvars and then read by no resource argument" was queue:ordered and
  #     the Alibaba DNS certificate. #1812 built the first on the three clouds that can honor it,
  #     and #1865 took the second into `exclusions:` as a provider ceiling.
  #   · "a kind the cloud's template omits entirely" was Hetzner DNS and Hetzner networking. #1816
  #     built both — including the console inventory and the CIDR derivation the network half
  #     needed before a user could reach it at all, which is the difference between a cell that
  #     measures green and a feature that works.
  #
  # The DNS block that stood here is gone. #1810 wired both canvas DNS switches through the snapshot,
  # ProjectDNSConfig and all four providers, which cleared nine of its ten cells; the last one —
  # Alibaba's managed certificate — moved UP into `exclusions:` when #1824 established that the
  # pinned alicloud provider cannot express the request at all. It was never a build we had not got
  # to; it was a build the provider has no resource for.

  # ── Container registry: image scanning, on the two clouds where it is a build ───────
  # Eight cells were here. #1811 promoted both registry switches out of `provider_config` into typed
  # columns and typed Go fields, and carried `immutable_tags` onto a real resource argument on aws
  # (`image_tag_mutability`), gcp (`docker_config.immutable_tags`) and alibaba
  # (`alicloud_cr_ee_repo.tag_immutability` — a resource the module never created at all, #1837).
  # `vulnerability_scanning` reached ECR's `scan_on_push` on aws in the same pass. Azure's two cells
  # moved UP into `exclusions:`: ACR exposes neither setting through Resource Manager.
  #
  # gcp LEFT this list in #1844, and how it left is the point. `vulnerability_scanning_config` takes
  # INHERITED|DISABLED with no ENABLED, so the ON position means "follow the project default", which
  # is on only once `containerscanning.googleapis.com` is enabled. The obvious fix — grant the
  # provisioner `serviceusage.services.enable` — was REFUSED (maintainer, 2026-08-03): that verb
  # turns on any API in the customer's project, has no narrower form, and an IAM change to the
  # connector is not retroactive, so a partial rollout would leave tenants planning clean and
  # scanning nothing. Instead the API is an onboarding prerequisite the customer performs, the
  # connector reads it (`serviceusage.services.get` — the READ verb only), and the template REFUSES
  # the ON position when it is absent (`terraform_data.artifact_registry_scanning_guard`) rather
  # than landing on INHERITED. Available where the prerequisite is done, honestly unavailable where
  # it is not — never silently on.
  #
  # alibaba was the remainder and LEFT in #1845, the honest way: built. The #1895 research settled
  # the shape (no ForceNew hazard — the instance has no VPC argument at all; VPC attaches via a
  # sibling link resource) but not the AUTO trigger's VPC prerequisite, which is undocumented in
  # both languages. So the carry is one REPO-scoped AUTO/VUL `alicloud_cr_scan_rule` per repository
  # whose switch is on — never an instance argument (`image_scanner`/`vpc_quota` are the #1933
  # traps) — and the claim is deliberately split: plan-green proves the wiring
  # (checks_registry.tftest.hcl asserts both positions), while the runtime proof — push an image,
  # observe a scan — is owed by the alibaba e2e nightly (#2061/#2101). If scans never fire there,
  # the fallback is a plan-time refusal (the gcp #1844 shape above), not silent green.

  # ── Queues: ordered delivery ────────────────────────────────────────────────────────
  # All four #1812 cells are gone from this list, and NOT for one reason — do not read them as one
  # fix. AWS, Azure and GCP are built: the switch now reaches `aws_sqs_queue.fifo_queue`,
  # `azurerm_servicebus_queue.requires_session` and
  # `google_pubsub_subscription.enable_message_ordering`, so the carrier probe measures those three
  # cells HONORED and fails the build until their entries are deleted. Alibaba was NOT fixed — the
  # probe still measures it `no-carrier` — and it moves to `exclusions:` above as a product ceiling.

  # ── Bucket encryption on Alibaba — a gap, and an unresolved question ────────────────
  # Nothing carries the switch — the wiring verdict the other bucket cells had before #1813 retired
  # them — but NOT the same decision, because the outcome is not the same. AWS/GCP/Azure encrypt
  # unconditionally, so an inert switch is cosmetic. Whether Alibaba OSS applies a default
  # server-side encryption method to a new bucket is not established from anything in this repo — and
  # if it does not, a user who leaves this (default-on) switch alone gets unencrypted objects. That
  # difference is why this is boarded rather than excluded: the answer decides whether it is cosmetic
  # or a security defect.

  # ── NoSQL point-in-time recovery ────────────────────────────────────────────────────
  # Both #1815 cells are gone from this list, for two DIFFERENT reasons — do not read them as one
  # fix. GCP: the post-#1833 carrier probe measures the cell HONORED and fails the build until this
  # entry is deleted (`firestore_point_in_time_recovery` is assigned FROM the field, so it grades
  # `derived`, not `gated-carrier`). Alibaba: the probe still measures it `no-carrier` — it was NOT
  # fixed — and it moves to `exclusions:` above as a product ceiling, not as a ratchet deletion.
  #
  # Still boarded on this offer's row, and NOT this lane's to claim: azure grades `gated-carrier`
  # under the new guard, because buildCosmosDBCollections writes `analytical_storage_enabled`
  # (Synapse Link column storage) inside an `if PointInTimeRecovery` branch. The old guard scored
  # that as honored. It is named in the matrix as ⚠️ and is not counted as carried.

  # ── Hetzner DNS and bring-your-own-network — BOTH BUILT in #1816 ────────────────────
  # Both entries are gone, and both were RATCHET DELETIONS, not reclassifications: neither moved
  # into `exclusions:`, because neither was a platform ceiling. Hetzner's Cloud API grew Zones in
  # 2025 and the pinned hcloud provider exposes `hcloud_zone` natively, so `infra/templates/project/
  # hetzner/dns.tf` now creates the zone the same way route53.tf / cloud-dns.tf / azure-dns.tf do;
  # and network.tf gained the greenfield/brownfield branch AWS and GCP already had, so
  # `provision_network = false` attaches the network you name instead of quietly building a second
  # one. Proved by root-level checks_dns_and_network.tftest.hcl, on and off, nine runs.
  #
  # The network half needed TWO more things before its deletion was honest, and both are in this
  # lane rather than boarded. A template nobody can reach is a green cell over a feature that does
  # not exist, which is the exact failure this file is here to prevent.
  #
  #   · The canvas's "Existing network" control is a SELECT over synced inventory, and Hetzner's
  #     inventory sync listed regions only — so the picker was always empty and `provision_network
  #     = false` was unreachable from the product. The sync now lists networks too.
  #   · pod_cidr / service_cidr were derived from `network_cidr`, which the brownfield path IGNORES
  #     (the attached network's own range is the supernet), while the canvas hides the CIDR field on
  #     that very path. A user attaching anything but a 10.0.0.0/16 would have hit this lane's own
  #     fail-closed precondition. They are now derived from the network that actually resolved.

  # ── nosql: a switch that turned on a DIFFERENT billable feature ─────────────────────
  # Azure used to carry `point_in_time_recovery` into `analytical_storage_enabled` — Synapse Link
  # analytical storage, a separate and separately-billed feature — while the Cosmos account was
  # declared with no `backup {}` block at all. Asking for recoverability bought a bill and no
  # recoverability. FIXED in #1838: the provider emits `point_in_time_recovery` and the account is
  # planned with `backup { type = "Continuous" }` on the free Continuous7Days tier.

# Branch-guard wirings a person has READ and found correct.
#
# A ⚠️ `gated-carrier` cell means the switch decides whether a key appears, but the code never shows
# that the key IS the feature the switch names — a question about semantics that a text-reading guard
# cannot answer (#1829/#1830). Every ⚠️ cell must therefore be declared: `baseline:` above when the
# wiring is wrong or unreviewed, or here when someone has read the branch and it does what it says.
#
# An entry here is NOT an exclusion (the cloud does honor the offer) and NOT debt (there is nothing to
# fix). It is a review record, and it is ratcheted like the baseline: when the cell stops reading ⚠️,
# the entry stops answering anything and the guard asks for it back.
#
# Fields: offer / cloud as above, plus `reason` — what you checked, in the product's voice.
wired:
  # STANDARD_HA is Memorystore's replicated, zone-redundant tier. GCP exposes no separate multi-AZ
  # flag on Memorystore — the tier IS the mechanism — so this is the correct wiring for the switch.
  # (It is also set when NumCacheNodes > 1, which is a superset, not a substitution.)
  - offer: cache:multi_az
    cloud: gcp
    reason: Choosing multi-AZ puts the cache on Memorystore's replicated STANDARD_HA tier, which is how zone redundancy is bought on Google Cloud.
  # `length` + `special` are the generation parameters; the `else` writes `manual = true`. That is
  # precisely the generate-vs-bring-your-own choice the switch offers.
  - offer: secret:generate
    cloud: aws
    reason: Asking Alethia to generate a secret sends the length and special-character rules to AWS; supplying your own sends it as a manual value instead.

# ── Carried in-cluster — honored, but not by OpenTofu ───────────────────────────────────
#
# The offer IS delivered on these clouds, by a component the platform installs into the cluster
# rather than by a resource in the template. The carrier rule cannot see them by construction: L5
# wants a tfvar declared in the template and read by a resource argument, and an in-cluster
# component writes no tfvar at all.
#
# Each entry names the PREDICATE that decides which clouds the component ships for, and the guard
# RE-READS it from the Go source on every run. That is what makes this a ratchet rather than a mute
# button: drop a cloud from the map and its entry goes stale, exactly as a `baseline:` entry does
# when its gap is fixed. An entry with no `predicate:` is refused, and so is one for a cell OpenTofu
# carries anyway — that would credit the wrong mechanism in the matrix.
carried_in_cluster:
  # Azure's certificate switch used to build an `azurerm_app_service_certificate_order`: a purchased,
  # GoDaddy-backed App Service Certificate (~$300/yr for a wildcard) that cannot bind to an AKS
  # ingress under any configuration. It was billed and it terminated nothing (#1825). Deleted.
  #
  # cert-manager issues the certificate over an ACME DNS01 challenge using the identity external-dns
  # already holds, and AGIC lifts the resulting Secret onto the Application Gateway listener.
  - offer: dns:managed_certificate
    cloud: azure
    by: cert-manager
    predicate: certManagerDNS01Solvers
    source: packages/core/argocd/infra_facts.go
    reason: Issued in-cluster by cert-manager over an ACME DNS01 challenge — a free Let's Encrypt certificate that renews itself, served by the Application Gateway.
    issue: "#1825"
  # GCP's certificate was NOT broken — unlike Azure's, `google_compute_managed_ssl_certificate` was
  # free, automatic and genuinely terminated the GKE ingress. It goes for a different reason: one
  # mechanism instead of two (#1858), and it takes three real failure modes with it.
  #
  # Google validates a managed certificate by resolving EVERY name on it to the attached load
  # balancer, so a single unresolvable SAN holds the whole certificate in FAILED_NOT_VISIBLE and
  # every other name with it; changing the SAN set REPLACES the certificate, which is why the module
  # needed create_before_destroy plus a digest in the name and still had a 63-char overflow lurking;
  # and it cannot issue a wildcard at all.
  #
  # cert-manager has none of those: the certificate covers exactly what the Ingress asks for, adding
  # a hostname is not a replacement, and DNS01 can issue wildcards. The GKE Ingress consumes the
  # Secret via `spec.tls` — Google documents Secrets and pre-shared certificates as separate
  # options, so the annotation is dropped rather than kept alongside.
  - offer: dns:managed_certificate
    cloud: gcp
    by: cert-manager
    predicate: certManagerDNS01Solvers
    source: packages/core/argocd/infra_facts.go
    reason: Issued in-cluster by cert-manager over an ACME DNS01 challenge — a free Let's Encrypt certificate that renews itself, served by the GKE Ingress from a Kubernetes Secret.
    issue: "#1858"

  # ── The registry switches on Hetzner (#2431) ──────────────────────────────────────
  # Hetzner sells no container registry, so its `registry` kind is an in-cluster Harbor rather than
  # a tofu resource. The carrier rule structurally cannot see these two: it wants a tfvar declared in
  # the template and read by a resource argument, and Harbor is configured over its own API by the
  # bootstrap Job (`alethia harbor-bootstrap`), which writes no tfvar at all.
  #
  # NOT an exclusion. Harbor honours BOTH natively, and saying otherwise would print "this cloud
  # cannot" under an offer the product does deliver:
  #   · immutable_tags         — a project immutable-tag rule over ** / **, reconciled two-way so
  #                              turning the switch OFF actually removes it;
  #   · vulnerability_scanning — the project's `auto_scan` metadata, served by the Trivy the chart
  #                              already installs (hetznerRegistryValues sizes its volume), and
  #                              re-asserted on an existing project so a later toggle takes effect.
  - offer: registry:immutable_tags
    cloud: hetzner
    by: harbor
    predicate: harborCarriedRegistryOffers
    source: packages/core/argocd/harbor.go
    reason: Harbor enforces tag immutability with a project immutable-tag rule, applied over its API by the in-cluster bootstrap Job — there is no tofu resource on Hetzner to carry a tfvar.
    issue: "#2431"
  - offer: registry:vulnerability_scanning
    cloud: hetzner
    by: harbor
    predicate: harborCarriedRegistryOffers
    source: packages/core/argocd/harbor.go
    reason: Harbor scans on push with the Trivy the chart installs, enabled through the project's auto_scan metadata by the in-cluster bootstrap Job — there is no tofu resource on Hetzner to carry a tfvar.
    issue: "#2431"

  # ── The secret switches on Hetzner (#2432) ────────────────────────────────────────
  # Hetzner sells no secret store, so its `secret` kind is a KV v2 entry in a Vault the platform
  # installs and operates, rather than a Secrets Manager / Secret Manager / Key Vault / KMS entry.
  # The carrier rule structurally cannot see these two: it wants a tfvar declared in the template and
  # read by a resource argument, and the value is minted by the bootstrap Job (`alethia
  # vault-bootstrap`) inside the cluster — deliberately, so it never passes through the runner.
  #
  # NOT an exclusion. Both are honoured exactly as they are on the four managed clouds, from the same
  # three ProjectSecretConfig fields buildSecrets carries there:
  #   · generate      — `false` writes NO value, matching `manual: true` elsewhere (the secret exists
  #                     with no version and the operator supplies one); `true` mints one in-pod.
  #   · special_chars — widens the generated alphabet beyond alphanumerics, alongside `length`.
  - offer: secret:generate
    cloud: hetzner
    by: vault
    predicate: vaultCarriedSecretOffers
    source: packages/core/argocd/vault.go
    reason: The value is minted inside the cluster by the in-cluster Vault's bootstrap Job and written straight to KV v2, so it never passes through the runner — there is no tofu resource on Hetzner to carry a tfvar. Turning it off leaves the path unwritten for an operator to fill, exactly as `manual` does elsewhere.
    issue: "#2432"
  - offer: secret:special_chars
    cloud: hetzner
    by: vault
    predicate: vaultCarriedSecretOffers
    source: packages/core/argocd/vault.go
    reason: The generated alphabet is widened beyond alphanumerics by the in-cluster Vault's bootstrap Job, alongside the declared length — there is no tofu resource on Hetzner to carry a tfvar.
    issue: "#2432"
