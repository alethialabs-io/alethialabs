  # ── Queues: ordered delivery ────────────────────────────────────────────────────────
  # All four #1812 cells are gone from this list, and NOT for one reason — do not read them as one
  # fix. AWS, Azure and GCP are built: the switch now reaches `aws_sqs_queue.fifo_queue`,
