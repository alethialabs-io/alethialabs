# Activated only by scripts/legal/activate-company-ip.mjs after signed founder
# transfer evidence is verified. Never execute pull-request-head code here.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: cla
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Contributor License Agreement
        # v2.6.1 is pinned because the upstream action was archived in March 2026.
        # Reassess or replace this dependency before the next CLA version.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: cla/signatures/v1.1.json
          path-to-document: https://github.com/alethialabs-io/alethialabs/blob/main/cla/ICLA.md
          branch: cla-signatures
          allowlist: bobikenobi12,dependabot[bot],github-actions[bot],renovate[bot],alethia-labs-ci[bot],mergify[bot]
          lock-pullrequest-aftermerge: true
