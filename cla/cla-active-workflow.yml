# POST-REGISTRATION TEMPLATE — this file is intentionally outside
# .github/workflows and does not run. Complete cla/README.md first, then review
# this template with counsel and copy it into the active workflow.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Contributor License Agreement
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: cla/signatures/v1.1.json
          path-to-document: https://github.com/alethialabs-io/alethialabs/blob/main/cla/ICLA.md
          branch: cla-signatures
          allowlist: bot*,dependabot[bot],renovate[bot]
