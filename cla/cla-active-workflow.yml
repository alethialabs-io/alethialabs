#
# POST-REGISTRATION TEMPLATE — this file is intentionally outside .github/workflows and does not
# run. `pnpm legal:activate-ip --apply` copies it over .github/workflows/cla.yml once the sealed
# signed evidence verifies (scripts/legal/activate-company-ip.mjs). Complete cla/README.md first.
#
# There is no third-party action here. This used to pin contributor-assistant/github-action at
# v2.6.1 by immutable SHA; that repository was archived in March 2026 (#2367). The replacement is
# first-party — scripts/legal/cla-check.mjs decides, scripts/legal/cla-run.mjs does the I/O — so the
# mechanism is auditable in-tree and driven by fixtures (scripts/legal/cla-check-selftest.mjs, run
# in CI on every pull request).
#
# The privileged-job rules this file exists to hold:
#   · pull_request_target runs with a WRITE token against the BASE ref. The checkout below pins the
#     base SHA and sets persist-credentials: false, and nothing in the job runs pull-request-head
#     code — no install, no build, no `run` from the head tree. That is the whole reason the scripts
#     have zero dependencies and are invoked with bare `node`.
#   · permissions are the minimum the gate needs: `statuses: write` to report `cla`, `contents:
#     write` to append a signature record to the dedicated branch, `pull-requests: read` to resolve
#     a comment's head SHA. NOT `actions: write` (the archived action asked for it), and not
#     `pull-requests: write` — this gate reports a status, it does not comment. `contents: write` is
#     repo-wide because that is the only granularity GITHUB_TOKEN has; the compensating control is
#     that this job runs nothing but first-party scripts from the trusted base ref.
#   · there is NO personal access token. The archived action needed `PERSONAL_ACCESS_TOKEN` to push
#     signature records; the built-in GITHUB_TOKEN with `contents: write` writes to the
#     `cla-signatures` branch of this same repository, so a long-lived credential that outlives any
#     single run never has to exist. In a product whose claim is "hold zero keys", a standing PAT in
#     repository secrets is exactly the thing not to add for convenience.
#   · the concurrency group is per pull request, so two comments in quick succession cannot race
#     each other into a lost signature record.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: cla
    # Comments on plain issues are not this gate's business, and neither is any comment that is not
    # one of the two exact phrases. Filtering here keeps the privileged job from starting at all —
    # the script re-checks both conditions, because a workflow condition is a cost control and not
    # a security boundary.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request != null &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For a comment event there is no PR ref in the payload, so fall back to the default
          # branch. Either way this is a TRUSTED ref: never github.event.pull_request.head.sha.
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Enforce the contribution legal gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/legal/cla-run.mjs
