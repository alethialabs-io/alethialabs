#
# Self-host overlay — the production layer for a self-hosted single-VM install. Layer it on the
# base bundle:
#
#   docker compose -f docker-compose.yml -f deploy/selfhost/docker-compose.selfhost.yml config
#
# What it sets, relative to the base bundle:
#   - every image comes prebuilt from GHCR at ONE pinned tag, ALETHIA_VERSION (no on-box builds);
#   - the bundled runner is self-operated (ALETHIA_RUNNER_OPERATOR: self);
#   - the marketing and admin services are hosted-only and never start here;
#   - Caddy serves ALETHIA_DOMAIN with automatic TLS; Postgres and the object store are not
#     published to the host;
#   - every `required` entry of deploy/selfhost/secrets.manifest is referenced as `${NAME:?…}`.
#     A missing or empty secret stops compose before any container starts, naming the variable.
#     No secret in this file has a default, and none may be given one;
#   - a one-shot `preflight` service runs before `migrate` and refuses, naming the variable, a
#     secret that holds a template placeholder or a published sample value.
#
# The hosted service's overlay is deploy/prod/docker-compose.prod.yml; this file does not
# inherit from it. Layout, lifecycle and the lanes that wire this in: deploy/selfhost/README.md.
name: alethia

services:
  # One-shot check ahead of `migrate`: every instance secret in secrets.manifest is set and none is
  # a template placeholder. It exits non-zero and names each unusable variable, and nothing after
  # it starts. `${NAME:?…}` below already stops an EMPTY required secret at render time; this also
  # catches a placeholder or a published sample value, and an optional entry set to one. It runs
  # deploy/selfhost/preflight.sh from the checkout in the console-migrate image, so it needs no
  # image of its own and moves with ALETHIA_VERSION.
  preflight:
    image: "ghcr.io/alethialabs-io/console-migrate:${ALETHIA_VERSION:?ALETHIA_VERSION is not set. Pin the release to run, see deploy/selfhost/README.md}"
    pull_policy: always
    entrypoint: ["sh", "/alethia/selfhost/preflight.sh"]
    command: []
    env_file: .env
    volumes:
      - ./deploy/selfhost:/alethia/selfhost:ro
    restart: "no"

  migrate:
    image: "ghcr.io/alethialabs-io/console-migrate:${ALETHIA_VERSION:?ALETHIA_VERSION is not set. Pin the release to run, see deploy/selfhost/README.md}"
    pull_policy: always
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      ALETHIA_DATABASE_URL: "postgres://${ALETHIA_DB_USER:-alethia}:${ALETHIA_DB_PASSWORD:?ALETHIA_DB_PASSWORD is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}@postgres:5432/${ALETHIA_DB_NAME:-alethia}"
      ALETHIA_APP_DB_PASSWORD: "${ALETHIA_APP_DB_PASSWORD:?ALETHIA_APP_DB_PASSWORD is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"

  app:
    image: "ghcr.io/alethialabs-io/console:${ALETHIA_VERSION:?ALETHIA_VERSION is not set. Pin the release to run, see deploy/selfhost/README.md}"
    pull_policy: always
    environment:
      ALETHIA_DATABASE_URL: "postgres://${ALETHIA_DB_USER:-alethia}:${ALETHIA_DB_PASSWORD:?ALETHIA_DB_PASSWORD is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}@postgres:5432/${ALETHIA_DB_NAME:-alethia}"
      ALETHIA_APP_DATABASE_URL: "postgres://alethia_app:${ALETHIA_APP_DB_PASSWORD:?ALETHIA_APP_DB_PASSWORD is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}@postgres:5432/${ALETHIA_DB_NAME:-alethia}"
      ALETHIA_CRED_ENCRYPTION_KEY: "${ALETHIA_CRED_ENCRYPTION_KEY:?ALETHIA_CRED_ENCRYPTION_KEY is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      CLI_JWT_SECRET: "${CLI_JWT_SECRET:?CLI_JWT_SECRET is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      ALETHIA_STORAGE_ACCESS_KEY_ID: "${ALETHIA_STORAGE_ACCESS_KEY_ID:?ALETHIA_STORAGE_ACCESS_KEY_ID is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: "${ALETHIA_STORAGE_SECRET_ACCESS_KEY:?ALETHIA_STORAGE_SECRET_ACCESS_KEY is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      ALETHIA_SNAPSHOT_HMAC_KEY: "${ALETHIA_SNAPSHOT_HMAC_KEY:?ALETHIA_SNAPSHOT_HMAC_KEY is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      ALETHIA_CRON_SECRET: "${ALETHIA_CRON_SECRET:?ALETHIA_CRON_SECRET is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      ALETHIA_RUNNER_BOOTSTRAP_TOKEN: "${ALETHIA_RUNNER_BOOTSTRAP_TOKEN:?ALETHIA_RUNNER_BOOTSTRAP_TOKEN is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      ALETHIA_OIDC_SIGNING_KEY: "${ALETHIA_OIDC_SIGNING_KEY:?ALETHIA_OIDC_SIGNING_KEY is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      ALETHIA_RECEIPT_SIGNING_KEY: "${ALETHIA_RECEIPT_SIGNING_KEY:?ALETHIA_RECEIPT_SIGNING_KEY is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"

  runner:
    image: "ghcr.io/alethialabs-io/runner:${ALETHIA_VERSION:?ALETHIA_VERSION is not set. Pin the release to run, see deploy/selfhost/README.md}"
    pull_policy: always
    environment:
      # Stated explicitly rather than left to the runner's built-in default: this runner runs on
      # the operator's own VM and uses the credentials the operator gives it.
      ALETHIA_RUNNER_OPERATOR: self
      ALETHIA_RUNNER_BOOTSTRAP_TOKEN: "${ALETHIA_RUNNER_BOOTSTRAP_TOKEN:?ALETHIA_RUNNER_BOOTSTRAP_TOKEN is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      ALETHIA_STORAGE_ACCESS_KEY_ID: "${ALETHIA_STORAGE_ACCESS_KEY_ID:?ALETHIA_STORAGE_ACCESS_KEY_ID is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      ALETHIA_STORAGE_SECRET_ACCESS_KEY: "${ALETHIA_STORAGE_SECRET_ACCESS_KEY:?ALETHIA_STORAGE_SECRET_ACCESS_KEY is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
      ALETHIA_RECEIPT_SIGNING_KEY: "${ALETHIA_RECEIPT_SIGNING_KEY:?ALETHIA_RECEIPT_SIGNING_KEY is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"

  docs:
    image: "ghcr.io/alethialabs-io/docs:${ALETHIA_VERSION:?ALETHIA_VERSION is not set. Pin the release to run, see deploy/selfhost/README.md}"
    pull_policy: always
  blog:
    image: "ghcr.io/alethialabs-io/blog:${ALETHIA_VERSION:?ALETHIA_VERSION is not set. Pin the release to run, see deploy/selfhost/README.md}"
    pull_policy: always

  # Hosted-only. Moved to a profile this layout never enables, so COMPOSE_PROFILES=marketing does
  # not start it on a self-hosted instance. (The staff dashboard is not in the base file at all.)
  marketing:
    profiles: !override ["hosted-only"]

  postgres:
    environment:
      POSTGRES_PASSWORD: "${ALETHIA_DB_PASSWORD:?ALETHIA_DB_PASSWORD is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
    ports: !reset []

  seaweedfs:
    ports: !reset []

  # Optional browser DB UI (`tools` profile); same superuser connection as migrate.
  pgweb:
    environment:
      PGWEB_DATABASE_URL: "postgres://${ALETHIA_DB_USER:-alethia}:${ALETHIA_DB_PASSWORD:?ALETHIA_DB_PASSWORD is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}@postgres:5432/${ALETHIA_DB_NAME:-alethia}?sslmode=disable"

  # OpenFGA (`enterprise` profile).
  openfga-db:
    environment:
      POSTGRES_PASSWORD: "${OPENFGA_DB_PASSWORD:?OPENFGA_DB_PASSWORD is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}"
  openfga-migrate:
    environment:
      OPENFGA_DATASTORE_URI: "postgres://openfga:${OPENFGA_DB_PASSWORD:?OPENFGA_DB_PASSWORD is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}@openfga-db:5432/openfga?sslmode=disable"
  openfga:
    environment:
      OPENFGA_DATASTORE_URI: "postgres://openfga:${OPENFGA_DB_PASSWORD:?OPENFGA_DB_PASSWORD is not set in .env. Every instance secret is generated per install; see deploy/selfhost/secrets.manifest}@openfga-db:5432/openfga?sslmode=disable"

  caddy:
    environment:
      # Empty ALETHIA_DOMAIN serves plain HTTP on :80 (an IP-only first look).
      ALETHIA_DOMAIN: "${ALETHIA_DOMAIN:-}"
      ALETHIA_ACME_EMAIL: "${ALETHIA_ACME_EMAIL:-}"
    volumes: !override
      # The self-host ingress; the hosted service keeps its own Caddyfile in deploy/prod/.
      - ./deploy/selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
