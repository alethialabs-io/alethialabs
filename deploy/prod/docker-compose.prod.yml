# Production overrides for any single-VM deploy. Layer on top of the base bundle:
#
#   docker compose -f docker-compose.yml -f deploy/prod/docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f deploy/prod/docker-compose.prod.yml up -d
#
# Differences vs local: app/docs/runner run from prebuilt public GHCR images (no
# on-box builds), Caddy serves the real domain with automatic TLS (ALETHIA_DOMAIN),
# and the datastores are NOT published to the host (only Caddy's 80/443 are public).
name: alethia

services:
  # Prebuilt images from CI (deploy-hetzner.yml). ALETHIA_IMAGE_TAG is the
  # commit SHA the pipeline pushed; defaults to latest.
  app:
    image: "ghcr.io/alethialabs-io/console:${ALETHIA_IMAGE_TAG:-latest}"
    pull_policy: always
  docs:
    image: "ghcr.io/alethialabs-io/docs:${ALETHIA_IMAGE_TAG:-latest}"
    pull_policy: always
  blog:
    image: "ghcr.io/alethialabs-io/blog:${ALETHIA_IMAGE_TAG:-latest}"
    pull_policy: always
  runner:
    image: "ghcr.io/alethialabs-io/runner:${ALETHIA_IMAGE_TAG:-latest}"
    pull_policy: always
    environment:
      # PRODUCTION CANNOT PROVISION AWS OR GCP WITHOUT THIS (#3348).
      #
      # The base bundle sets `ALETHIA_RUNNER_MODE: self-hosted`, which is right for local dev —
      # there is no keyless federation infrastructure on a laptop. But this container is
      # colocated with the control plane, has NO ambient cloud credentials, and `self` takes the
      # ambient-credential path: `runner.go` branches on `Operator == "managed"` and everything
      # else falls through to plain AssumeRole / ADC. The AWS SDK then reaches for EC2 instance
      # metadata on a box that is not EC2 and returns a 404 naming IMDS — an error that sends the
      # reader somewhere with nothing to do with the cause. #4916 made that failure legible at
      # claim time; this is the other half, and it is the half that makes provisioning work.
      #
      # ⚠️ `self` IS ALSO THE DEFAULT. `runnerOperator()` (apps/runner/cmd/runner/main.go:196-206)
      # reads ALETHIA_RUNNER_OPERATOR first, falls back to ALETHIA_RUNNER_MODE
      # (cloud-hosted → managed, self-hosted → self), and returns "self" when BOTH are unset. So
      # deleting this line does not restore a neutral state — it restores the broken one, and
      # nothing fails until a provisioning job reaches a cloud.
      #
      # WHAT THIS GRANTS, stated plainly: a `managed` runner federates keylessly into customer
      # roles, so this VM can mint assertions into any connected customer account. That is the
      # product's central claim working as designed, and it is also the blast radius if this VM
      # is compromised.
      #
      # THE DECISION, and its scope (maintainer, 2026-09-22): taken deliberately BECAUSE nobody
      # is using production yet. The goal is to make provisioning work properly for testing now;
      # a proper runner-pool mechanism is to be designed before there are real users. Read this
      # as a pre-users choice with a known expiry, NOT as a settled architecture for a
      # multi-tenant deployment. Revisit it when the first customer connects an account.
      ALETHIA_RUNNER_OPERATOR: managed
  # Marketing public site — self-hosted (the tunnel overlay turns the zone on).
  # Inactive unless the operator runs with COMPOSE_PROFILES=marketing AND enables
  # the `import marketing*.caddy` line in deploy/prod/Caddyfile.
  marketing:
    profiles: ["marketing"]
    image: "ghcr.io/alethialabs-io/marketing:${ALETHIA_IMAGE_TAG:-latest}"
    pull_policy: always
  # The internal staff dashboard at admin.<domain>, behind Cloudflare Access (Caddyfile.tunnel
  # routes the host; the app verifies the Access token against CF_ACCESS_TEAM_DOMAIN +
  # CF_ACCESS_AUD, then checks SUPPORT_STAFF_EMAILS). Hosted-only: its source and its image live
  # in the private alethialabs-io/web repo, and the image is private, so this service exists
  # only in the prod overlay and never in the base compose file or the self-host layout.
  # Started by COMPOSE_PROFILES=admin, which the console deploy writes into the box's .env.
  admin:
    profiles: ["admin"]
    # Its own tag, not ALETHIA_IMAGE_TAG: alethialabs-io/web deploys admin on its own schedule
    # and records the tag in /opt/alethia/admin.image.env; the console deploy
    # (scripts/ci/deploy-console-assemble-env.sh) copies it into .env and refuses to deploy
    # without it. No usable default on purpose: an unset tag pulls `admin:unset`, which fails
    # loudly, where `latest` would silently run whatever image last carried that label.
    image: "ghcr.io/alethialabs-io/admin:${ALETHIA_ADMIN_IMAGE_TAG:-unset}"
    pull_policy: always
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Internal service URLs (like `app`): staff read the shared service DB cross-tenant
      # (RLS-bypass) and presign attachment downloads from the same object store. The staff
      # allowlist + NEXT_PUBLIC_CONSOLE_URL come from .env (env_file above).
      ALETHIA_DATABASE_URL: "postgres://${ALETHIA_DB_USER:-alethia}:${ALETHIA_DB_PASSWORD:?ALETHIA_DB_PASSWORD is not set in .env. Every instance secret is generated per install (deploy/install.sh; for local development, scripts/dev-env.sh); see deploy/selfhost/secrets.manifest}@postgres:5432/${ALETHIA_DB_NAME:-alethia}"
      ALETHIA_STORAGE_ENDPOINT: "http://seaweedfs:8333"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  # One-shot migrate — the console Dockerfile's `migrate` target (shares all
  # build cache with console; the final stage is the only difference).
  migrate:
    image: "ghcr.io/alethialabs-io/console-migrate:${ALETHIA_IMAGE_TAG:-latest}"
    pull_policy: always

  caddy:
    environment:
      # Drive the Caddyfile; empty ALETHIA_DOMAIN → plain HTTP on :80.
      ALETHIA_DOMAIN: "${ALETHIA_DOMAIN:-}"
      ALETHIA_ACME_EMAIL: "${ALETHIA_ACME_EMAIL:-}"
    volumes: !override
      - ./deploy/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Keep Postgres + object storage on the internal network only.
  postgres:
    ports: !reset []
  seaweedfs:
    ports: !reset []
