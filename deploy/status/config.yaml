# Gatus — Alethia public status page (https://status.alethialabs.io)
# Docs: https://github.com/TwiN/gatus
#
# IMPORTANT: run this on infra SEPARATE from production. A status page that
# shares a host/network with the thing it monitors goes dark exactly when you
# need it (during a prod outage). Use a small standalone VPS / a different cloud
# / a distinct Hetzner box — never the prod cluster.

ui:
  title: Alethia Status
  header: Alethia
  description: Live status of the Alethia control plane.

# Persist uptime history so the page shows trends across restarts.
storage:
  type: sqlite
  path: /data/data.db

endpoints:
  # Anonymous `/` is the MARKETING landing page, not the console: the edge Caddy
  # (deploy/prod/Caddyfile.tunnel) sends a cookie-less `/` to the marketing app.
  # Gatus sends no cookie, so this row is the public website and is named so.
  - name: Website
    group: Alethia
    url: "https://alethialabs.io"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 800"

  # The console's own public page. `/auth/signin` (what this used to probe) is a
  # back-compat 307 to `/login` in apps/console/proxy.ts; probe the page itself.
  - name: Console
    group: Alethia
    url: "https://alethialabs.io/login"
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  # /api/health with no query is the READINESS probe
  # (apps/console/app/api/health/route.ts). Its anonymous body is
  # {"status": "healthy" | "degraded" | "unhealthy", ...}; it answers 503 only
  # for `unhealthy` (the database is unreachable). It NEVER returns "ok" -- only
  # the liveness path (?shallow=1) does.
  #
  # The status page shows the readiness answer as TWO rows, because Gatus can
  # only say up or down and the route has three states:
  #   API             -- down only when the API cannot serve (unhealthy / 503).
  #   Background jobs -- down whenever a supervised background loop is stuck
  #                      (degraded) or the API is down.
  # A degraded API still serves every request, so painting it red would
  # overstate the outage; hiding `degraded` entirely would understate it.
  #
  # Every `[BODY].status` value below is checked against what the route really
  # returns by apps/console/tests/api/health/status-page-monitors.test.ts.
  - name: API
    group: Alethia
    url: "https://alethialabs.io/api/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == any(healthy, degraded)"

  - name: Background jobs
    group: Alethia
    url: "https://alethialabs.io/api/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == healthy"

  - name: Documentation
    group: Alethia
    url: "https://alethialabs.io/docs"
    interval: 300s
    conditions:
      - "[STATUS] == 200"
