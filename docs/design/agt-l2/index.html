<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Approvals Design</title>
<meta name="description" content="AGT-L2 design prototype: approval page, approvals list, agent policy, service token auto-approve, connected agents and consent." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* ===================================================================================
   Tokens. Values mirror packages/brand/src/tokens.css (the console's own file):
   grayscale OKLCH ramp, the four named ink tiers, the --text-ui-* rungs, the --z-* rungs.
   Dark is the signature theme and the default; light follows prefers-color-scheme
   unless the viewer pins a theme.
   =================================================================================== */
:root {
  --gray-0: oklch(1 0 0); --gray-50: oklch(0.985 0 0); --gray-100: oklch(0.967 0 0);
  --gray-200: oklch(0.928 0 0); --gray-300: oklch(0.882 0 0); --gray-400: oklch(0.788 0 0);
  --gray-500: oklch(0.664 0 0); --gray-550: oklch(0.610 0 0); --gray-600: oklch(0.556 0 0);
  --gray-625: oklch(0.527 0 0); --gray-700: oklch(0.440 0 0); --gray-800: oklch(0.345 0 0);
  --gray-900: oklch(0.268 0 0); --gray-950: oklch(0.205 0 0); --gray-1000: oklch(0.165 0 0);
  --gray-1050: oklch(0.130 0 0); --gray-1100: oklch(0.108 0 0);

  /* dark (default) */
  --canvas: var(--gray-1100);
  --surface: var(--gray-1000);
  --surface-raised: var(--gray-950);
  --surface-sunken: var(--gray-1100);
  --surface-muted: var(--gray-950);
  --text-primary: var(--gray-50);
  --text-secondary: var(--gray-500);
  --text-tertiary: var(--gray-550);
  --text-disabled: var(--gray-700);
  --border: oklch(1 0 0 / 0.10);
  --border-strong: oklch(1 0 0 / 0.17);
  --border-faint: oklch(1 0 0 / 0.05);
  --ink: var(--gray-50);
  --ink-hover: var(--gray-200);
  --ink-foreground: var(--gray-1000);
  --signal-strong: var(--text-primary);
  --signal-mute: var(--text-tertiary);
  --signal-faint: var(--gray-700);
  --signal-critical: var(--gray-50);
  --signal-critical-surface: var(--gray-1000);
  --overlay: oklch(0 0 0 / 0.62);
  --ring: oklch(1 0 0 / 0.28);
  --skeleton: oklch(1 0 0 / 0.07);
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.30);
  --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.45);
  color-scheme: dark;

  --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-grotesk: "Space Grotesk", var(--font-sans);

  --text-ui-3xs: 9px; --text-ui-2xs: 10px; --text-ui-xs: 11px; --text-ui-sm: 12px;
  --text-ui-md: 13px; --text-ui-lg: 15px; --text-ui-xl: 17px;
  --tracking-eyebrow: 0.16em;

  --radius-sm: 2px; --radius-md: 3px; --radius-lg: 4px;
  --z-sticky-head: 10; --z-raised: 20; --z-sticky-bar: 30; --z-header: 100;
  --z-overlay: 200; --z-overlay-nested: 210; --z-toast: 300;
  --ease: cubic-bezier(0.2, 0, 0, 1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --canvas: var(--gray-50); --surface: var(--gray-0); --surface-raised: var(--gray-0);
    --surface-sunken: var(--gray-100); --surface-muted: var(--gray-100);
    --text-primary: var(--gray-1000); --text-secondary: var(--gray-700); --text-tertiary: var(--gray-625);
    --text-disabled: var(--gray-400); --border: var(--gray-200); --border-strong: var(--gray-300);
    --border-faint: var(--gray-100); --ink: var(--gray-950); --ink-hover: var(--gray-900);
    --ink-foreground: var(--gray-50); --signal-faint: var(--gray-400); --signal-critical: var(--gray-1000);
    --signal-critical-surface: var(--gray-100); --overlay: oklch(0 0 0 / 0.55); --ring: oklch(0 0 0 / 0.22);
    --skeleton: oklch(0 0 0 / 0.07); --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.06);
    --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.14); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --canvas: var(--gray-50); --surface: var(--gray-0); --surface-raised: var(--gray-0);
  --surface-sunken: var(--gray-100); --surface-muted: var(--gray-100);
  --text-primary: var(--gray-1000); --text-secondary: var(--gray-700); --text-tertiary: var(--gray-625);
  --text-disabled: var(--gray-400); --border: var(--gray-200); --border-strong: var(--gray-300);
  --border-faint: var(--gray-100); --ink: var(--gray-950); --ink-hover: var(--gray-900);
  --ink-foreground: var(--gray-50); --signal-faint: var(--gray-400); --signal-critical: var(--gray-1000);
  --signal-critical-surface: var(--gray-100); --overlay: oklch(0 0 0 / 0.55); --ring: oklch(0 0 0 / 0.22);
  --skeleton: oklch(0 0 0 / 0.07); --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.06);
  --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.14); color-scheme: light;
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--canvas); color: var(--text-primary);
  font-family: var(--font-sans); font-size: var(--text-ui-md); line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.eyebrow { font-family: var(--font-mono); font-size: var(--text-ui-2xs); font-weight: 500; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-tertiary); }
.t1 { color: var(--text-primary); } .t2 { color: var(--text-secondary); } .t3 { color: var(--text-tertiary); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
svg.ic { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ---------------- Design board (prototype chrome, not product) ---------------- */
.board { position: relative; z-index: 400; background: var(--surface); border-bottom: 1px solid var(--border); }
.board-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; max-width: 1440px; margin: 0 auto; }
.board-brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-grotesk); font-weight: 600; font-size: var(--text-ui-lg); }
.board-brand .tag { font-family: var(--font-mono); font-size: var(--text-ui-2xs); letter-spacing: var(--tracking-eyebrow); color: var(--text-tertiary); font-weight: 500; }
.board-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.board-tab { border: 1px solid var(--border); background: transparent; padding: 4px 9px; font-size: var(--text-ui-sm); color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-sm); }
.board-tab[aria-pressed="true"] { background: var(--ink); color: var(--ink-foreground); border-color: var(--ink); }
.board-tab .n { font-family: var(--font-mono); font-size: var(--text-ui-2xs); margin-right: 4px; }
.board-ctl { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-items: center; }
.board select, .board .tog { height: 28px; border: 1px solid var(--border-strong); background: var(--surface-sunken); padding: 0 8px; font-size: var(--text-ui-sm); border-radius: var(--radius-sm); cursor: pointer; max-width: 100%; }
.board .tog[aria-pressed="true"] { background: var(--ink); color: var(--ink-foreground); }
.board-states { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 16px 10px; max-width: 1440px; margin: 0 auto; }
.chip-state { border: 1px dashed var(--border-strong); background: transparent; padding: 2px 8px; font-size: var(--text-ui-xs); font-family: var(--font-mono); color: var(--text-tertiary); cursor: pointer; border-radius: var(--radius-sm); }
.chip-state[aria-pressed="true"] { border-style: solid; color: var(--text-primary); border-color: var(--ink); }
.stage-wrap { padding: 16px; display: flex; justify-content: center; }
.frame { width: 100%; max-width: 1360px; border: 1px solid var(--border); background: var(--surface); transform: translateZ(0); container-type: inline-size; container-name: app; overflow: hidden; height: max(560px, calc(100vh - var(--board-h, 140px) - 32px)); position: relative; }
.frame.phone { max-width: 390px; height: min(844px, max(560px, calc(100vh - var(--board-h, 140px) - 32px))); }
.frame-scroll { height: 100%; overflow-y: auto; overflow-x: hidden; }
.board-note { padding: 0 16px 8px; max-width: 1440px; margin: 0 auto; font-size: var(--text-ui-xs); color: var(--text-tertiary); }

/* annotations: data source + gaps */
.annot [data-src], .annot [data-gap] { position: relative; outline: 1px dashed var(--border-strong); outline-offset: 2px; }
.annot [data-src]::after, .annot [data-gap]::after { position: absolute; left: 0; top: -15px; z-index: 5; font-family: var(--font-mono); font-size: var(--text-ui-3xs); line-height: 13px; padding: 0 4px; white-space: nowrap; pointer-events: none; max-width: 320px; text-transform: none; letter-spacing: 0; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
.annot [data-src]::after { content: attr(data-src); background: var(--surface-raised); color: var(--text-secondary); border: 1px solid var(--border); }
.annot [data-gap]::after { content: "GAP · " attr(data-gap); background: var(--ink); color: var(--ink-foreground); }
.annot [data-gap] { outline: 1px solid var(--ink); }

/* ---------------- Console shell ---------------- */
.console { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.sidebar { border-right: 1px solid var(--border); background: var(--surface-sunken); display: flex; flex-direction: column; position: sticky; top: 0; height: max(558px, calc(100vh - var(--board-h, 140px) - 34px)); }
.sb-head { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--border); font-family: var(--font-grotesk); font-weight: 600; font-size: var(--text-ui-lg); }
.sb-org { margin: 10px; border: 1px solid var(--border); padding: 6px 8px; display: flex; align-items: center; gap: 8px; font-size: var(--text-ui-sm); }
.sb-org .av { width: 18px; height: 18px; display: grid; place-items: center; background: var(--ink); color: var(--ink-foreground); font-size: var(--text-ui-2xs); font-weight: 600; }
.sb-nav { padding: 4px 10px; display: flex; flex-direction: column; gap: 1px; }
.sb-item { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; color: var(--text-secondary); text-decoration: none; font-size: var(--text-ui-md); border-radius: var(--radius-sm); }
.sb-item[aria-current="page"] { background: var(--surface-raised); color: var(--text-primary); box-shadow: inset 2px 0 0 var(--ink); }
.sb-item .count { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-ui-2xs); border: 1px solid var(--border-strong); padding: 0 5px; color: var(--text-primary); }
.sb-foot { margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: var(--text-ui-sm); }
.avatar { width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; background: var(--surface-raised); border: 1px solid var(--border-strong); font-size: var(--text-ui-2xs); font-weight: 600; flex: none; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: var(--z-header); }
.btn.menu-btn { display: none; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--text-ui-md); color: var(--text-tertiary); }
.crumbs a { text-decoration: none; color: var(--text-tertiary); white-space: nowrap; }
.crumbs .sep { color: var(--text-disabled); }
.crumbs .cur { color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.content { padding: 20px; width: 100%; margin: 0 auto; }
.content.w-detail { max-width: 1040px; }
.content.w-list { max-width: 1200px; }
.content.w-settings { max-width: 1200px; }

/* agent-access banner (kill switch off) */
.banner { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--ink); padding: 10px 12px; margin-bottom: 16px; font-size: var(--text-ui-md); }
.banner.inverted { background: var(--ink); color: var(--ink-foreground); }
.banner .grow { flex: 1; min-width: 0; }

/* ---------------- Primitives ---------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-primary); font-size: var(--text-ui-md); font-weight: 500; cursor: pointer; border-radius: var(--radius-sm); white-space: nowrap; text-decoration: none; transition: background 120ms var(--ease), border-color 120ms var(--ease); }
.btn:hover { background: var(--surface-raised); }
.btn:active { transform: translateY(0.5px); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--ink-foreground); }
.btn.primary:hover { background: var(--ink-hover); }
.btn.ghost { border-color: transparent; }
.btn.sm { height: 28px; padding: 0 10px; font-size: var(--text-ui-sm); }
.btn.lg { height: 40px; }
.btn.full { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { cursor: not-allowed; color: var(--text-disabled); background: transparent; border-color: var(--border); }
.btn.primary[disabled] { background: var(--surface-raised); color: var(--text-disabled); border-color: var(--border); }
.status { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: var(--text-ui-2xs); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); white-space: nowrap; }
.status .dot { width: 7px; height: 7px; border-radius: 999px; flex: none; position: relative; }
.status.active { color: var(--text-primary); } .status.active .dot { background: var(--signal-strong); }
.status.pending { color: var(--text-primary); } .status.pending .dot { background: var(--signal-mute); box-shadow: 0 0 0 3px var(--border-strong); }
.status.idle .dot { border: 1.5px solid var(--signal-mute); }
.status.failed { color: var(--text-primary); } .status.failed .dot { background: var(--signal-critical); } .status.failed .dot::after { content: ""; position: absolute; inset: 2px; background: var(--signal-critical-surface); border-radius: 1px; }
.status.disabled { color: var(--text-tertiary); } .status.disabled .dot { background: var(--signal-faint); }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border: 1px solid var(--border-strong); font-family: var(--font-mono); font-size: var(--text-ui-2xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); white-space: nowrap; border-radius: var(--radius-sm); }
.pill.prod { background: var(--ink); color: var(--ink-foreground); border-color: var(--ink); font-weight: 500; }
.pill.ee { border-style: dashed; }
.op { font-weight: 500; }
.op.destroy { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; background: var(--ink); color: var(--ink-foreground); font-family: var(--font-mono); font-size: var(--text-ui-2xs); letter-spacing: 0.08em; text-transform: uppercase; height: 18px; border-radius: var(--radius-sm); }
.op.deploy { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border: 1px solid var(--border-strong); font-family: var(--font-mono); font-size: var(--text-ui-2xs); letter-spacing: 0.08em; text-transform: uppercase; border-radius: var(--radius-sm); }
.card { border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); border-radius: var(--radius-lg); }
.card + .card { margin-top: 16px; }
.card-pad { padding: 16px; }
.sh { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; }
.sh h2, .sh h3 { margin: 0; font-size: var(--text-ui-lg); font-weight: 500; letter-spacing: -0.01em; }
.sh .desc { margin: 2px 0 0; color: var(--text-tertiary); font-size: var(--text-ui-md); }
.toolbar { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
.toolbar .lead { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.toolbar .desc { margin: 0; color: var(--text-tertiary); font-size: var(--text-ui-md); }
.dl { display: grid; grid-template-columns: 148px minmax(0, 1fr); border-top: 1px solid var(--border); }
.dl > dt, .dl > dd { margin: 0; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.dl > dt { color: var(--text-tertiary); font-size: var(--text-ui-sm); padding-top: 11px; }
.dl > dd { min-width: 0; overflow-wrap: anywhere; }
.dl > dd:last-of-type, .dl > dt:last-of-type { border-bottom: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.sub { color: var(--text-tertiary); font-size: var(--text-ui-sm); }
.counts { font-family: var(--font-mono); font-size: var(--text-ui-sm); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.counts .z { color: var(--text-tertiary); }
.counts .hot { background: var(--ink); color: var(--ink-foreground); padding: 0 4px; }
.digest { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--border-strong); padding: 6px 10px; background: var(--surface-sunken); }
.digest .val { font-family: var(--font-mono); font-size: var(--text-ui-xl); letter-spacing: 0.12em; font-weight: 500; }
.note { border: 1px dashed var(--border-strong); padding: 12px 14px; background: var(--surface-sunken); }
.note blockquote { margin: 6px 0 0; font-family: var(--font-mono); font-size: var(--text-ui-sm); color: var(--text-secondary); white-space: pre-wrap; overflow-wrap: anywhere; }
.link { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--border-strong); cursor: pointer; background: none; border: 0; padding: 0; color: var(--text-primary); font-size: inherit; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { text-decoration-color: var(--text-primary); }
.inline-alert { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border-strong); padding: 10px 12px; background: var(--surface-sunken); font-size: var(--text-ui-md); }
.inline-alert.strong { border-color: var(--ink); }
.inline-alert .ic { margin-top: 3px; }
.inline-alert p { margin: 2px 0 0; color: var(--text-secondary); }
.inline-alert b { font-weight: 500; color: var(--text-primary); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-size: var(--text-ui-sm); font-weight: 500; color: var(--text-primary); }
.hint { font-size: var(--text-ui-sm); color: var(--text-tertiary); margin: 0; }
.input, .textarea, .select { width: 100%; border: 1px solid var(--border-strong); background: var(--surface-sunken); padding: 7px 10px; font-size: var(--text-ui-md); border-radius: var(--radius-sm); }
.textarea { min-height: 72px; resize: vertical; }
.input.mono { font-family: var(--font-mono); }
.input[aria-invalid="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
.check:last-child { border-bottom: 0; }
.check input { margin: 3px 0 0; accent-color: var(--ink); width: 14px; height: 14px; flex: none; }
.check .ttl { font-weight: 500; }
.check .why { color: var(--text-tertiary); font-size: var(--text-ui-sm); }
.check.locked { cursor: not-allowed; }
.check.locked .ttl { color: var(--text-tertiary); }
.group { border: 1px solid var(--border); }
.group-h { padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--surface-sunken); display: flex; align-items: center; gap: 8px; }
.switch { position: relative; width: 34px; height: 20px; flex: none; border: 1px solid var(--border-strong); background: var(--surface-sunken); border-radius: 999px; cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 999px; background: var(--text-tertiary); transition: transform 140ms var(--ease); }
.switch[aria-checked="true"] { background: var(--ink); border-color: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(14px); background: var(--ink-foreground); }
.switch[disabled] { cursor: not-allowed; opacity: 1; border-style: dashed; }
.switch[disabled]::after { background: var(--text-disabled); }
.setting { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; padding: 16px; border-top: 1px solid var(--border); }
.setting:first-of-type { border-top: 0; }
.setting .s-title { font-weight: 500; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.setting .s-body { color: var(--text-tertiary); font-size: var(--text-ui-md); margin: 4px 0 0; max-width: 62ch; }
.consequence { grid-column: 1 / -1; border-left: 2px solid var(--ink); padding: 2px 0 2px 10px; font-size: var(--text-ui-sm); color: var(--text-secondary); }
.consequence b { color: var(--text-primary); font-weight: 500; }
.skel { background: var(--skeleton); border-radius: var(--radius-sm); animation: pulse 1.6s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } * { transition: none !important; } }
.empty { text-align: center; padding: 48px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1px dashed var(--border-strong); }

    requestedMinAgo: 3, planJob: "8a77c010", plannedAt: "13:44", counts: { create: 0, update: 3, delete: 1, replace: 1 },
    costDelta: "+$8/mo", costTotal: "$1,904.12/mo", verify: { verdict: "warn", pass: 10, warn: 2, fail: 0, ne: 0, signed: true },
    digest: "4b81d0c2", note: "Urgent hotfix, already reviewed by security. Approve quickly please.", expiresIn: 57,
  });
  if (state === "destroy" || state === "destroy-confirm") Object.assign(base, {
    op: "destroy", project: "payments-api", env: "perf", stage: "staging", requester: IVAN, via: VIA.agent_oauth("Cursor"),
    clientDomain: "cursor.com", requestedMinAgo: 20, planJob: "1a2b3c4d", plannedAt: "12 Nov, 09:12",
    deployedAt: "12 Nov, 09:20", deployJob: "6e0f11b2", costTotal: "$238.10/mo", digest: "e07a9b3f",
    note: "Load test finished. Tearing down the perf environment.", expiresIn: 40,
  });
  if (state === "expiring") base.expiresIn = 4;
  if (state === "no-cost") { base.costDelta = null; base.verify = { verdict: "not_evaluable", pass: 0, warn: 0, fail: 0, ne: 12, signed: false }; base.note = null; }
  const decided = { approved: "approved", used: "consumed", denied: "rejected", expired: "expired", superseded: "superseded" };
  if (decided[state]) base.status = decided[state];
  if (state === "self") base.selfBlocked = true;
  if (state === "blocked-off") base.block = "off";
  if (state === "blocked-client") base.block = "client";
  if (state === "blocked-prod") Object.assign(base, { env: "production", stage: "production", digest: "d41e07b2", block: "prod", costDelta: "+$61.20/mo", costTotal: "$1,957.32/mo" });
  if (state === "second-person") Object.assign(base, { env: "production", stage: "production", requester: IVAN, via: VIA.session(), clientDomain: null, digest: "4b81d0c2", note: null, counts: { create: 0, update: 3, delete: 0, replace: 0 }, costDelta: "+$8/mo", costTotal: "$1,904.12/mo" });
  if (state === "reauth") base.reauth = true;
  return base;
}

const stagePill = (stage) => stage === "production"

const opTag = (op) => op === "destroy" ? `<span class="op destroy">${ic("trash")}Destroy</span>` : `<span class="op deploy">Deploy</span>`;
const btn = (label, o = {}) => `<button type="button" class="btn ${o.v || ""} ${o.sm ? "sm" : ""} ${o.lg ? "lg" : ""} ${o.full ? "full" : ""}" ${o.act ? `data-act="${o.act}"` : ""} ${o.disabled ? "disabled" : ""} ${o.attrs || ""}>${o.icon ? ic(o.icon) : ""}${esc(label)}</button>`;
const sectionHeading = (title, desc, actions = "", level = 2, attrs = "") => `<div class="sh"${attrs}><div style="min-width:0"><h${level}>${esc(title)}</h${level}>${desc ? `<p class="desc">${desc}</p>` : ""}</div>${actions ? `<div class="row">${actions}</div>` : ""}</div>`;

const emptyState = (icon, title, desc, actions = "") => `<div class="empty" role="status"><div class="media">${ic(icon)}</div><div class="et">${esc(title)}</div><p class="ed">${desc}</p>${actions ? `<div class="ea">${actions}</div>` : ""}</div>`;
const errorState = (title, desc) => `<div class="empty" role="alert" style="border-style:solid"><div class="media">${ic("alert")}</div><div class="et">${esc(title)}</div><p class="ed">${desc}</p><div class="ea">${btn("Try again", { icon: "refresh", act: "noop" })}</div></div>`;
const skel = (w, h = 12, extra = "") => `<div class="skel" style="width:${w};height:${h}px;${extra}"></div>`;
const inlineAlert = (icon, title, body, strong = false, attrs = "") => `<div class="inline-alert ${strong ? "strong" : ""}" role="status"${attrs}>${ic(icon)}<div><b>${title}</b>${body ? `<p>${body}</p>` : ""}</div></div>`;
const person = (p, sub) => `<span class="row" style="gap:8px;flex-wrap:nowrap"><span class="avatar" aria-hidden="true">${p.initials}</span><span style="min-width:0"><span class="t1">${esc(p.name)}</span>${sub ? `<br><span class="sub">${sub}</span>` : ""}</span></span>`;
const viaLine = (v) => `<span class="row" style="gap:6px"${src("apply_approvals.requester_credential + requester_credential_ref → oauth_client.name | cli_service_tokens.name")}>${ic(v.icon)}<span class="t1">${esc(v.label)}</span><span class="sub">· ${esc(v.kind)}</span></span>`;

function countdown(minutes, prefix = "Expires in") {
  const t = LOAD + minutes * MIN;
  return `<span class="countdown ${minutes <= 5 ? "urgent" : ""}" data-expires="${t}" data-prefix="${prefix}"${src("apply_approvals.expires_at · formatDuration")}>${prefix} ${fmtLeft(t)}</span>`;
}
function fmtLeft(t) {
  const ms = Math.max(0, t - Date.now());
  const m = Math.floor(ms / MIN), s = Math.floor((ms % MIN) / 1000);
  if (ms === 0) return "0 min";
  if (m >= 60) return `${Math.floor(m / 60)}h ${m % 60}m`;
  if (m >= 5) return `${m} min`;
  return `${m}:${String(s).padStart(2, "0")}`;
}
function clockAt(minutesFromLoad) { const d = new Date(LOAD + minutesFromLoad * MIN); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }

/* ===================================================================================
   SURFACES 1 + 2 — Approvals list (home) and the decision SHEET over it.

const APPROVAL_ID = "7f3c2a91-4d0e-4b8a-9c11-2b6e5d8f0a13";

/** The decision sheet. Same facts, same states as v1's page, in a right-hand sheet. */
function approvalSheet(state) {
  const a = S.ui.after === "destroy" ? Object.assign(approvalFor("destroy"), { status: "approved" }) : approvalFor(state);
  const close = btn("", { v: "ghost", sm: true, icon: "x", act: "sheet-close", attrs: 'aria-label="Close"' });
  const wrap = (inner, extra = "") => `<div class="scrim" data-act="sheet-close-bg"><div class="sheet wide ${extra}" role="dialog" aria-modal="true" aria-labelledby="ap-t" data-stop${src("URL: ?approval=<id> on /[org]/~/approvals")}>${inner}</div></div>`;
  if (state === "loading") return wrap(`<div class="sheet-h"><div style="flex:1">${skel("120px", 12)}${skel("60%", 16, "margin-top:8px")}</div>${close}</div><div class="sheet-b" aria-busy="true">${Array.from({ length: 7 }, () => `<div style="display:flex;gap:16px">${skel("110px")}${skel("50%")}</div>`).join("")}</div><div class="sheet-dec">${skel("100%", 40)}</div>`);
  if (state === "error") return wrap(`<div class="sheet-h"><h2 id="ap-t" style="flex:1">Approval</h2>${close}</div><div class="sheet-b">${errorState("Couldn't load this approval", "Something went wrong on our side. Nothing was decided. Try again in a moment.")}</div>`);
  if (state === "not-found") return wrap(`<div class="sheet-h"><h2 id="ap-t" style="flex:1">Approval</h2>${close}</div><div class="sheet-b">
      <div class="empty" role="status" style="border-style:solid"${src("ApprovalError not_found — same answer for 'no project access' and 'no such approval'")}><div class="media">${ic("lock")}</div><div class="et">This approval isn't available to you</div>
      <p class="ed">You may not have access to its project, or the link may be wrong. Ask the person who sent it.</p><div class="ea">${btn("Close", { act: "sheet-close" })}</div></div></div>`);

  const isDestroy = a.op === "destroy";
  const prod = a.stage === "production";
  const decided = a.status !== "pending";
  let band = "";
  if (!decided && isDestroy) band = `<div class="sheet-band">${ic("alert")}Destroy · can't be undone</div>`;
  else if (!decided && prod) band = `<div class="sheet-band">${ic("alert")}Production environment</div>`;
  const title = `${isDestroy ? "Destroy" : "Deploy"} · ${a.project} / ${a.env}`;
  const head = `${band}<div class="sheet-h"><div style="flex:1;min-width:0">
      <div class="row">${approvalStatus(a.status)}${a.status === "pending" ? countdown(a.expiresIn) + `<span class="sub">· until ${clockAt(a.expiresIn)}</span>` : ""}</div>
      <h2 id="ap-t" style="margin-top:6px">${esc(title)}</h2>
      <p class="hint" style="margin-top:2px">Requested ${a.requestedMinAgo} min ago through ${esc(a.via.label)}.</p></div>
      <div class="row" style="flex-wrap:nowrap">${btn("", { v: "ghost", sm: true, icon: "link", act: "toast:Link copied. Anyone with " + (isDestroy ? "destroy" : "deploy") + " access to " + a.project + " can decide.", attrs: 'aria-label="Copy link"' })}${close}</div></div>`;
  const body = `<div class="sheet-b ${decided ? "dimmed" : ""}">${requestSection(a)}${planSection(a)}${a.note ? noteSection(a) : ""}</div>`;
  const foot = decided ? outcomeFoot(a, state) : decisionFoot(a);
  return wrap(head + body + foot, isDestroy && !decided ? "serious" : prod && !decided ? "serious" : "") + (S.ui.dialog === "destroy" || state === "destroy-confirm" ? destroyDialog(a) : "");
}

function requestSection(a) {

      <dt>Operation</dt><dd${src("apply_approvals.operation")}>${opTag(a.op)}</dd>

      <dt>Environment</dt><dd><span class="row"><span class="mono t1"${src("apply_approvals.environment_id → project_environments.name")}>${esc(a.env)}</span>${stagePill(a.stage)}</span>${a.stage === "production" ? `<div class="sub" style="margin-top:4px">This environment serves your customers.</div>` : ""}</dd>

    </dl></section>`;
}

function planSection(a) {
  const c = a.counts;
  const verifyLabel = { pass: ["active", "Passed"], warn: ["pending", "Passed with warnings"], not_evaluable: ["idle", "Not checked"] }[a.verify.verdict];
  const rows = a.op === "destroy" ? `
      <dt>Removes</dt><dd${gap("exact teardown list: no destroy-mode plan is queued yet (binding.ts) — shows what the last deploy applied")}><span class="t1">Everything this environment runs</span><div class="sub" style="margin-top:2px">As deployed on ${a.deployedAt} by job <a class="link mono" href="#">${a.deployJob}</a>, from plan <span class="mono">${a.planJob}</span>.</div></dd>
      <dt>Cost</dt><dd${src("environment_cost total · formatMonthlyDelta (negative = saving)")}><span class="mono t1">−${a.costTotal.replace("/mo", "")}/mo</span> <span class="sub">est. saving</span></dd>` : `
      <dt>Changes</dt><dd${src("jobs.execution_metadata.plan_result → parse-plan.ts:PlanSummary.counts")}><div class="counts"><span class="${c.create ? "t1" : "z"}">${c.create} to add</span><span class="${c.update ? "t1" : "z"}">${c.update} to change</span>${c.replace ? `<span class="t1">${c.replace} to replace</span>` : ""}<span class="${c.delete ? "hot" : "z"}">${c.delete} to destroy</span></div>${c.delete ? `<div class="sub" style="margin-top:4px">This deploy removes ${c.delete} existing resource${c.delete > 1 ? "s" : ""}.</div>` : ""}</dd>
      <dt>Cost</dt><dd${src("execution_metadata.cost_breakdown → InfracostBreakdownTotals.diffTotalMonthlyCost / totalMonthlyCost")}>${a.costDelta ? `<span class="mono t1">${a.costDelta}</span> <span class="sub">est. · ${a.costTotal} after this deploy</span>` : `<span class="t2">No estimate for this plan</span>`}</dd>
      <dt>Verification</dt><dd${src("execution_metadata.verify_receipt.receipt.verdict + report.summary")}><span class="row">${status(verifyLabel[0], verifyLabel[1])}<span class="sub">${a.verify.verdict === "not_evaluable" ? `${a.verify.ne} controls could not be evaluated` : `${a.verify.pass} passed${a.verify.warn ? ` · ${a.verify.warn} warning${a.verify.warn > 1 ? "s" : ""}` : ""}`}</span><a class="link" href="#">View receipt</a></span>${a.verify.signed ? "" : `<div class="sub" style="margin-top:4px">This receipt is not signed.</div>`}</dd>`;
  return `<section aria-labelledby="h-plan">${sectionHeading(a.op === "destroy" ? "What gets destroyed" : "Reviewed plan", a.op === "destroy" ? "Read from the environment's last deploy, not from the request." : "Read from the plan job, not from the request.", `<a class="btn sm" href="#">${ic("ext")}Open plan</a>`, 3).replace("<h3>", '<h3 id="h-plan">')}
    <dl class="dl facts" style="margin-top:8px">${rows}
      <dt>Plan digest</dt><dd${src("apply_approvals.plan_sha256 → read.ts:digestPrefix (8 chars)")}><span class="digest"><span class="val">${a.digest}</span></span><p class="hint" style="margin-top:6px">${esc(a.via.label)} showed the requester these same 8 characters. If they don't match, deny.</p></dd>
      <dt>Plan job</dt><dd${src("apply_approvals.plan_job_id")}><a class="link mono" href="#">${a.planJob}</a> <span class="sub">· planned ${a.plannedAt}</span></dd>
    </dl></section>`;
}

function noteSection(a) {
  return `<section aria-labelledby="h-note"><div class="note"${src("apply_approvals.reason (UNTRUSTED, ≤500 chars, request.ts:MAX_REASON_LENGTH)")}>
      <div class="row" style="justify-content:space-between"><h3 id="h-note" class="eyebrow" style="margin:0">Note from the requester</h3><span class="sub">Not checked by Alethia</span></div>
      <blockquote>${esc(a.note)}</blockquote></div>
    <p class="hint" style="margin-top:8px">Decide on the plan above. The note is written by ${esc(a.via.label)} and can say anything.</p></section>`;
}

/** Why Approve is unavailable right now, re-checked at decision time (maintainer ruling 2). */
function approveBlock(a) {
  if (a.reauth) return { kind: "reauth" };
  if (a.block === "off") return { kind: "policy", icon: "power", title: "Agent access is off in acme", body: `While it's off, ${esc(a.via.label)} can't deploy even with an approval. You can deny the request, or someone who manages agents can turn access back on in Settings → Agents.`, srcs: "org_agent_policy.agent_access_enabled = false, re-checked at decide time" };
  if (a.block === "prod") return { kind: "policy", icon: "lock", title: "acme keeps agents off production", body: `Only a person in the console can deploy production, so this request can only be denied.`, srcs: "org_agent_policy.agents_may_not_apply_to_production, re-checked at decide time" };
  if (a.block === "client") return { kind: "policy", icon: "lock", title: `${esc(a.via.label)} isn't an allowed agent app in acme`, body: `acme only lets approved apps act as agents. Deny this, or ask someone who manages agents to allow ${esc(a.via.label)} in Settings → Agents.`, srcs: "org_agent_policy.allowed_oauth_client_ids (Enterprise, AGT-L14 enterprise-policy.ts:oauthClientRefusal)" };
  if (a.selfBlocked) return { kind: "policy", icon: "info", title: "Someone else needs to approve this", body: `acme requires a different person to approve requests made for you. You can still deny it, or send the link to a teammate with ${a.op} access.`, srcs: "org_agent_policy.require_different_approver → enterprise-policy.ts:approverRefusal" };
  return null;
}

function decisionFoot(a) {
  const isDestroy = a.op === "destroy";
  const block = approveBlock(a);
  if (block && block.kind === "reauth") {
    return `<div class="sheet-dec">${inlineAlert("login", "Sign in again to decide", "Approvals need a sign-in from the last 24 hours. You last signed in 2 days ago. You'll come straight back to this request.", true, src("decide.ts:DECIDER_SESSION_MAX_AGE_MS → reauthentication_required"))}
      <div class="dec-actions">${btn("Sign in again", { v: "primary", lg: true, icon: "login", act: "noop" })}</div></div>`;
  }
  if (S.ui.denying) {
    return `<div class="sheet-dec"><form class="field" data-form="deny" onsubmit="return false"${src("apply_approvals.decision_reason (new column, ruled in) · untrusted, ≤500")}>
        <label for="deny-reason">Reason for denying <span class="t3" style="font-weight:400">(optional)</span></label>
        <textarea id="deny-reason" class="textarea" maxlength="500" placeholder="For example: wrong environment, plan again from main.">${esc(S.ui.reason || "")}</textarea>

  }
  const lede = isDestroy
    ? `Approving lets <b class="t1">${esc(a.via.label)}</b> destroy <span class="mono t1">${esc(a.env)}</span> once, before ${clockAt(a.expiresIn)}.`
    : `Approving lets <b class="t1">${esc(a.via.label)}</b> deploy this exact plan to <span class="mono t1">${esc(a.env)}</span> once, before ${clockAt(a.expiresIn)}. If the plan changes first, the approval stops working.`;
  return `<div class="sheet-dec" aria-labelledby="h-dec">
    <h3 id="h-dec" class="sr-only">${isDestroy ? "Approve this destroy?" : "Approve this deploy?"}</h3>
    ${block ? inlineAlert(block.icon, block.title, block.body, true, src(block.srcs)) : ""}
    ${a.expiresIn <= 5 && !block ? inlineAlert("clock", `Expires in ${a.expiresIn} min`, `After ${clockAt(a.expiresIn)} it can't be approved and ${esc(a.via.label)} has to ask again.`, true) : ""}
    ${!block ? `<p class="t2" style="margin:0">${lede}</p>` : ""}
    ${isDestroy && !block ? `<ul class="conseq"><li>Every resource in <span class="mono t1">${esc(a.env)}</span> is removed from your cloud.</li><li>Data in its databases and volumes is deleted unless you back it up first.</li><li>You'll type the environment name to confirm.</li></ul>` : ""}
    <div class="dec-actions">${btn("Deny", { lg: true, act: "deny" })}${btn(isDestroy ? "Approve destroy…" : "Approve deploy", { v: "primary", lg: true, icon: isDestroy ? "" : "check", act: isDestroy ? "open-destroy" : "approve", disabled: !!block })}</div>

    <p class="footnote" style="margin:0">Anyone with ${isDestroy ? "destroy" : "deploy"} access to ${esc(a.project)} can decide. Decisions are recorded in Activity.</p>
  </div>`;
}

function outcomeFoot(a, state) {
  const reason = S.ui.byMe ? S.ui.reason : "Wrong environment. Plan again from main.";
  const map = {
    approved: { body: `You approved this at ${clockAt(-1)}. ${esc(a.via.label)} can ${a.op === "destroy" ? "destroy " + esc(a.env) : "deploy this plan"} once, before ${clockAt(a.expiresIn)}.`, sub: `If it doesn't start by ${clockAt(a.expiresIn)}, the approval expires.` },
    used: { body: `Approved by ${ME.name} at ${clockAt(-6)}. The ${a.op} started at ${clockAt(-5)}.`, sub: "Each approval runs one job once.", act: `<a class="btn full" href="#">${ic("ext")}Open deploy job 5c7d2e81</a>` },
    denied: { body: `${S.ui.byMe ? "You" : IVAN.name} denied this at ${clockAt(-2)}.`, sub: "", act: S.ui.noReason ? "" : `<div class="note"${src("apply_approvals.decision_reason (UNTRUSTED)")}><div class="eyebrow">Reason from ${S.ui.byMe ? "you" : IVAN.name}</div><blockquote>${esc(reason)}</blockquote></div>` },
    expired: { body: `Nobody decided before ${clockAt(-1)}, so this request can't be approved any more.`, sub: `Ask ${esc(a.via.label)} to request a new approval. acme gives requests 1 hour.` },
    superseded: { body: `A newer plan of ${esc(a.project)} / ${esc(a.env)} succeeded after this one, so this request no longer describes what would run.`, sub: `<span${gap("why it was superseded is not stored: read.ts recomputes bindingStaleReason live")}>Decide the newer request instead.</span>`, act: btn("Open the newer request", { full: true, act: "sheet:pending" }) },
  }[state];
  return `<div class="sheet-dec" aria-live="polite">${map.body ? `<p class="t1" style="margin:0">${map.body}</p>` : ""}${map.sub ? `<p class="sub" style="margin:0">${map.sub}</p>` : ""}${map.act || ""}</div>`;
}

function destroyDialog(a) {
  const typed = S.ui.typed || "";

      <thead><tr><th scope="col">Name</th><th scope="col">Token</th><th scope="col">Can</th><th scope="col">Projects</th><th scope="col">Deploys without approval</th><th scope="col">Last used</th><th scope="col">Status</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
      <tbody>${TOKENS.map((t) => `<tr><td class="cell-main">${t.name}</td><td class="mono sub">${t.prefix}…</td><td>${scopeWords(t.scopes)}</td><td>${t.projects}</td><td${src("cli_service_tokens.auto_approve_environment_ids")}>${t.auto.length ? t.auto.map((e) => `<span class="mono">${e}</span>`).join("<br>") : `<span class="t3">None</span>`}</td><td class="t2">${t.used}</td><td>${status(t.st[0], t.st[1])}</td><td>${t.st[1] === "Active" ? `<div class="row" style="flex-wrap:nowrap">${btn("Edit", { sm: true, v: "ghost", act: "tok-edit" })}${btn("Revoke", { sm: true, v: "ghost", act: "noop" })}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>
    <div class="m-list">${TOKENS.map((t) => `<div class="m-item"><div class="row" style="justify-content:space-between"><span class="cell-main">${t.name}</span>${status(t.st[0], t.st[1])}</div><div class="sub mono">${t.prefix}…</div><div class="sub">${scopeWords(t.scopes)} · ${t.projects}</div><div class="sub">Deploys without approval: ${t.auto.length ? t.auto.join(", ") : "none"}</div>${t.st[1] === "Active" ? `<div>${btn("Edit", { sm: true, act: "tok-edit" })}</div>` : ""}</div>`).join("")}</div>`;
  let overlay = "";
  if (state === "create" || state === "no-apply" || state === "no-permission" || S.ui.sheet === "tok") overlay = tokenSheet(state, owner, false);
  if (state === "edit" || S.ui.sheet === "tok-edit") overlay = tokenSheet(state, owner, true);
  if (state === "created") overlay = tokenCreated();
  return settingsFrame("tokens", "Service tokens", `${pageToolbar({ desc, actions })}${list}${overlay}`);
}

function tokenSheet(state, owner, editing) {
  const f = tokenForm();
  if (state === "no-apply" && !S.ui.naApplied) { f.scopes = ["read", "plan"]; S.ui.naApplied = true; }
  const hasApply = f.scopes.includes("apply");
  const projs = f.projMode === "all" ? PROJECTS : PROJECTS.filter((p) => f.projects.includes(p.name));
  const lockedAll = !hasApply || !owner;
  const envRows = projs.map((p) => `<div class="group" style="margin-top:8px"><div class="group-h"><span class="cell-main">${p.name}</span></div>${p.envs.map(([e, stage]) => {
    const prod = stage === "production";
    const id = `${p.name}/${e}`;
    const on = !prod && f.auto.includes(id);
    const locked = prod || lockedAll;
    return `<label class="check ${locked ? "locked" : ""}"><input type="checkbox" ${on ? "checked" : ""} ${locked ? "disabled" : ""} data-auto="${id}" aria-describedby="why-${id.replace("/", "-")}"/><span style="min-width:0"><span class="row"><span class="ttl mono">${e}</span>${stagePill(stage)}</span><span class="why" id="why-${id.replace("/", "-")}">${prod ? `${ic("lock")} Production always needs a person.` : on ? "Deploys go ahead without asking anyone." : "Each deploy waits for a person."}</span></span></label>`;
  }).join("")}</div>`).join("");
  const title = editing ? "Edit ci-deploy" : "Create a service token";
  return `<div class="scrim" data-act="close-sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" data-stop>
    <div class="sheet-h"><div style="flex:1;min-width:0"><h2 id="sh-t">${title}</h2><p class="hint" style="margin-top:4px">${editing ? "The token itself doesn't change. Pipelines using it keep working." : "You'll see the token once, right after you create it."}</p></div>${btn("", { v: "ghost", sm: true, icon: "x", act: "close-sheet", attrs: 'aria-label="Close"' })}</div>
    <div class="sheet-b">
      ${editing ? "" : `<div class="field"${src("cli_service_tokens.name")}><label for="tk-name">Name</label><input id="tk-name" class="input" value="ci-deploy" /><p class="hint">Say what uses it, so a list of tokens reads as a list of purposes.</p></div>
      <div class="field"${src("cli_service_tokens.expires_at (createTokenSchema.expires_in_days)")}><label for="tk-exp">Expires</label><select id="tk-exp" class="select"><option>In 30 days</option><option selected>In 90 days</option><option>In 1 year</option><option>Never</option></select></div>`}
      <fieldset class="field" style="border:0;padding:0;margin:0"${src("cli_service_tokens.scopes (agent_scope[])")}><legend class="label" style="margin-bottom:6px">What it can do</legend>
        <div class="group">${Object.keys(SCOPE_TEXT).map((k) => `<label class="check"><input type="checkbox" data-scope="${k}" ${f.scopes.includes(k) ? "checked" : ""} ${editing ? "disabled" : ""}/><span><span class="ttl">${SCOPE_TEXT[k][0]}</span><br><span class="why">${SCOPE_TEXT[k][1]}</span></span></label>`).join("")}</div>
        ${editing ? `<p class="hint"${gap("no PATCH for scopes/projects: app/api/cli/tokens/[id] has DELETE only")}>To change what it can do, create a new token.</p>` : ""}</fieldset>
      <fieldset class="field" style="border:0;padding:0;margin:0"${src("cli_service_tokens.project_ids (NULL = all, present and future)")}><legend class="label" style="margin-bottom:6px">Projects</legend>
        <div class="group">
          <label class="check"><input type="radio" name="pm" data-projmode="all" ${f.projMode === "all" ? "checked" : ""} ${editing ? "disabled" : ""}/><span><span class="ttl">All projects</span><br><span class="why">Including projects created later.</span></span></label>
          <label class="check"><input type="radio" name="pm" data-projmode="some" ${f.projMode === "some" ? "checked" : ""} ${editing ? "disabled" : ""}/><span style="flex:1"><span class="ttl">Only these projects</span>${f.projMode === "some" ? `<span class="row" style="margin-top:6px">${PROJECTS.map((p) => `<label class="pill" style="cursor:pointer;height:22px;text-transform:none;letter-spacing:0"><input type="checkbox" data-proj="${p.name}" ${f.projects.includes(p.name) ? "checked" : ""} ${editing ? "disabled" : ""} style="accent-color:var(--ink);margin:0"/>${p.name}</label>`).join("")}</span>` : ""}</span></label>
        </div></fieldset>
      <fieldset class="field" style="border:0;padding:0;margin:0"${gap("auto_approve_environment_ids has no write path: mintServiceToken/createTokenSchema don't accept it; no PATCH; no audit event")}>
        <legend class="label" style="margin-bottom:4px">Deploy without approval</legend>
        <p class="hint">Choose environments where this token's deploys go ahead without a person approving each one. For CI pipelines that deploy to staging on every merge.</p>
        ${!owner ? inlineAlert("lock", "You can't choose these environments", "Choosing them needs the Manage agents permission, which your role doesn't include. You can create the token now; someone with that permission can add environments later.", false, src("PDP verb org:manage_agents (new) — D2's owner-only, granted to the owner role by default")) : ""}
        ${owner && !hasApply ? inlineAlert("info", "Needs the Deploy permission", "Turn on Deploy above to choose environments.", false) : ""}
        <div ${lockedAll ? 'aria-disabled="true"' : ""}>${envRows || `<p class="hint">Choose at least one project first.</p>`}</div>
        <ul class="conseq" style="margin-top:10px"><li>Production environments always need a person.</li><li>Destroys always need a person, everywhere.</li><li>Every automatic deploy is recorded in Activity with this token's name.</li></ul>
      </fieldset>
    </div>
    <div class="sheet-f">${btn("Cancel", { v: "ghost", act: "close-sheet" })}${btn(editing ? "Save changes" : "Create token", { v: "primary", act: editing ? "tok-save" : "tok-create" })}</div>
  </div></div>`;
}
function tokenCreated() {
  return `<div class="dialog-wrap"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="tc-t">
    <div class="dialog-h"><h2 id="tc-t">Copy your new token</h2><p>This is the only time it's shown. Alethia stores a fingerprint, never the token.</p></div>

      <div class="secret"><code>alethia_sat_3f9aK2xQ••••••••••••••••••••••••••••••••••</code>${btn("Copy", { sm: true, icon: "copy", act: "toast:Token copied." })}</div>

}

  const title = AGENT_CATALOG.find((c) => c.slug === slug)?.name || slug;
  if (b.svg) return `<svg class="brand" width="${size}" height="${size}" viewBox="0 0 24 24" role="img" aria-label="${esc(title)}">${b.svg}</svg>`;
  const fill = NEAR_BLACK.has(b.hex) ? "currentColor" : `#${b.hex}`;
  return `<svg class="brand" width="${size}" height="${size}" viewBox="0 0 24 24" role="img" aria-label="${esc(title)}"><path fill="${fill}" d="${b.d}"/></svg>`;
}
