/* ===================================================================================
   SURFACE 6 — Consent  /auth/oauth/consent  (AuthShell). Every edge case is a state.
   =================================================================================== */
const ORGS = [
  { slug: "acme", role: "Admin", plan: "Enterprise", agentsOn: true, noProd: false, allow: null, projects: ["payments-api", "web", "data-lake"] },
  { slug: "globex", role: "Viewer", plan: "Pro", agentsOn: true, noProd: false, allow: null, projects: ["billing", "portal"] },
];
const MANY_ORGS = ["acme", "globex", "initech", "umbrella-labs", "hooli", "stark-industries", "wayne-ent", "tyrell", "cyberdyne", "soylent", "aperture", "black-mesa"];
const CONSENT_SCOPE_WORDS = { read: ["See your projects", "Environments, jobs, plans, costs and logs.", "view"], design: ["Change designs", "Edit infrastructure designs. Nothing is created in your cloud.", "edit"], plan: ["Run plans", "Plans and repository scans, which use your runners.", "plan"], apply: ["Ask to deploy", "Every deploy waits for a person to approve it in Alethia.", "deploy"], destroy: ["Ask to destroy", "Every destroy waits for a person, who types the environment name.", "destroy"] };
const VIEWER_CAN = ["read"];

function consentState(state) {
  if (!S.ui.cons) {
    const app = state === "c-not-allowed" ? "windsurf" : state === "c-unverified" ? null : "claudecode";
    S.ui.cons = { app, org: state === "c-role" ? "globex" : "acme", scopes: ["read", "design", "plan", "apply"], projMode: state === "c-projects-many" ? "some" : "all", projects: state === "c-projects-many" ? ["checkout-api", "web"] : [], pq: "", oq: "" };
  }
  return S.ui.cons;
}
function consentPage(state) {
  const account = `<div class="acct"${src("Better Auth session user")}><span class="avatar">${ME.initials}</span><div style="flex:1;min-width:0"><div class="t1">${ME.name}</div><div class="sub">${ME.email}</div></div><a class="link" href="#" data-act="cstate:c-switch">Not you? Switch account</a></div>`;
  const authShell = (inner, showAcct = true) => `<div class="auth"><div class="auth-head">${MARK(20)}Alethia</div><div class="auth-main"><div class="auth-col">${inner.replace("<!--acct-->", showAcct ? account : "")}</div></div><div class="auth-foot"><span>Alethia · Connect an app</span><span style="margin-left:auto">Privacy · Terms</span></div></div>`;
  const msg = (eyebrow, h, p, actions = "") => authShell(`<div><p class="eyebrow">${eyebrow}</p><h1>${h}</h1><p class="lede">${p}</p></div>${actions}`, false);
  if (state === "c-none") return msg("Connect an app", "Nothing to connect", "This page opens when an app such as Claude Code or Cursor asks to connect to Alethia. Start from that app to continue.");
  if (state === "c-expired") return msg("Connect an app", "This request has expired", "Connection requests are valid for a few minutes. Go back to the app and connect again.", btn("Close this page", { act: "noop" }));
  if (state === "c-used") return msg("Connect an app", "This request was already answered", "Someone already allowed or denied this request, maybe in another tab. Go back to the app; if it isn't connected, connect again from there.", btn("Close this page", { act: "noop" }));
  if (state === "c-denied") return msg("Connect an app", "You denied Claude Code", "Claude Code was told no and has no access to Alethia. You can close this page.", btn("Close this page", { act: "noop" }));
  if (state === "c-allowed") return msg("Connected", "Returning to Claude Code…", "Claude Code can now work in acme with the permissions you chose. If nothing happens in a few seconds, go back to Claude Code yourself.", `<div class="row">${btn("Return to Claude Code", { v: "primary", act: "noop" })}${btn("Manage connections", { act: "go:connected" })}</div>`);
  if (state === "c-switch") return msg("Connect an app", "Sign in with another account", "You'll come straight back here to finish connecting Claude Code. Nothing has been granted yet.", `<div class="row">${btn("Sign in with another account", { v: "primary", icon: "login", act: "noop" })}${btn("Back", { act: "cstate:c-default" })}</div>`);
  if (state === "c-loading") return authShell(`<div aria-busy="true">${skel("100px", 10)}${skel("80%", 28, "margin-top:12px")}${skel("100%", 64, "margin-top:20px")}${skel("100%", 180, "margin-top:16px")}</div>`, false);
  if (state === "c-no-scopes") return msg("Connect an app", "Claude Code didn't ask for any Alethia permissions", "It only asked to know who you are, which isn't enough to work in Alethia. Deny this, and check the app's setup guide.", `<div class="row">${btn("Deny", { v: "primary", act: "cstate:c-denied" })}<a class="btn" href="#">Setup guide</a></div>`);

  const c = consentState(state);
  const app = c.app ? AGENT_CATALOG.find((a) => a.slug === c.app) : null;
  const appName = app ? app.name : "Release helper";
  const orgs = state === "c-personal" ? [{ slug: "personal", label: "Personal workspace", role: "Owner", agentsOn: true, noProd: false, allow: null, projects: [] }] : ORGS;
  const org = orgs.find((o) => o.slug === c.org) || orgs[0];
  const agentsOff = state === "c-off";
  const noProd = state === "c-noprod";
  const notAllowed = state === "c-not-allowed" && org.slug === "acme";
  const blocked = agentsOff || notAllowed;
  const isViewer = org.role === "Viewer";
  const reconsent = state === "c-reconsent";
  const existing = reconsent ? ["read", "design", "plan", "apply"] : null;
  const requested = reconsent ? ["read", "design", "plan", "apply", "destroy"] : state === "c-unknown-scope" ? ["read", "plan"] : ["read", "design", "plan", "apply", "destroy"];
  if (reconsent && !S.ui.rcApplied) { c.scopes = ["read", "plan", "apply", "destroy"]; S.ui.rcApplied = true; }
  if (state === "c-unknown-scope" && !S.ui.usApplied) { c.scopes = ["read", "plan"]; S.ui.usApplied = true; }

  /* identity */
  const identity = app
    ? `<div class="client-id"${src("oauth_client.name · icon · clientId (CIMD URL host) · clientDiscoveryId")}><div class="atile" style="width:44px;height:44px">${brandMark(app.slug, 28)}</div><div style="min-width:0"><div class="cell-main">${esc(app.name)}</div><div class="sub">Verified by <span class="mono">${esc(app.domain)}</span>, which publishes this app's identity.</div></div></div>`
    : `<div class="client-id" style="border-color:var(--ink)"${src("oauth_client without clientDiscoveryId (no CIMD): name and redirect are self-asserted")}><div class="atile" style="width:44px;height:44px">${brandMark(null)}</div><div style="min-width:0"><div class="cell-main">“Release helper” <span class="sub" style="font-weight:400">· name given by the app</span></div><div class="sub">Alethia couldn't confirm who publishes this app. After you allow, you'll be sent to <span class="mono t1">localhost:5173</span>.</div></div></div>`;

  /* organization */
  let orgField;
  if (state === "c-personal") {
    orgField = `<div class="field"><span class="label">Where it works</span><div class="group"><div class="check" style="cursor:default"><span><span class="ttl">Your personal workspace</span><br><span class="why">You aren't in an organization. ${esc(appName)} works in your personal workspace.</span></span></div></div></div>`;
  } else if (state === "c-many-orgs") {
    const oq = (c.oq || "").toLowerCase();
    const list = MANY_ORGS.filter((o) => !oq || o.includes(oq));
    orgField = `<fieldset class="field" style="border:0;margin:0;padding:0"${src("the person's memberships → agent_oauth_grants.org_id")}><legend class="label" style="margin-bottom:6px">Organization</legend>
      <label class="search" style="flex:none;width:100%">${ic("search")}<span class="sr-only">Search organizations</span><input type="search" placeholder="Search your 12 organizations" value="${esc(c.oq || "")}" data-input="coq" /></label>
      <div class="group scroll-list" role="radiogroup" aria-label="Organization">${list.map((o, i) => `<label class="check"><input type="radio" name="corg" data-corg="${o}" ${c.org === o ? "checked" : ""}/><span><span class="ttl mono">${o}</span><br><span class="why">${i % 3 === 1 ? "Viewer" : i % 3 === 2 ? "Member" : "Admin"}</span></span></label>`).join("") || `<p class="hint" style="padding:10px 12px">No organization matches.</p>`}</div>
      <p class="hint">${esc(appName)} can only see the one you choose. Connect again to use another.</p></fieldset>`;
  } else {
    orgField = `<fieldset class="field" style="border:0;margin:0;padding:0"${src("the person's memberships → agent_oauth_grants.org_id")}><legend class="label" style="margin-bottom:6px">Organization</legend>
      <div class="group" role="radiogroup">${orgs.map((o) => `<label class="check"><input type="radio" name="corg" data-corg="${o.slug}" ${org.slug === o.slug ? "checked" : ""}/><span style="flex:1"><span class="ttl mono">${o.slug}</span><br><span class="why">Your role: ${o.role}</span></span>${notAllowedFor(state, o) ? `<span class="pill">Not allowed</span>` : ""}</label>`).join("")}</div>
      <p class="hint">${esc(appName)} can only see the one you choose. Connect again to use another.</p></fieldset>`;
  }

  /* blocking or informing alerts */
  let alerts = "";
  if (agentsOff) alerts += inlineAlert("power", "Agents are turned off in acme", "Someone who manages agents in acme has turned agent access off. Choose another organization, or ask them.", true, src("org_agent_policy.agent_access_enabled = false"));
  if (notAllowed) alerts += inlineAlert("lock", "acme doesn't allow Windsurf", "acme only lets approved apps act as agents. Choose another organization, or ask someone who manages agents in acme to add Windsurf.", true, src("org_agent_policy.allowed_oauth_client_ids (Enterprise, AGT-L14 oauthClientRefusal)"));
  if (noProd) alerts += inlineAlert("info", "acme keeps agents off production", `${esc(appName)} can plan production environments, but only a person can deploy or destroy them.`, false, src("org_agent_policy.agents_may_not_apply_to_production"));
  if (reconsent) alerts += inlineAlert("refresh", `You connected ${esc(appName)} to acme on 3 Nov`, "Allowing replaces that connection with the choices below. Changes are marked.", false, src("existing agent_oauth_grants row for (user, client, org)"));
  if (!app) alerts += inlineAlert("alert", "Only allow apps you set up yourself", "If you didn't just start connecting an app, deny this request.", true);

  /* scopes */
  const scopeRows = requested.map((k) => {
    const w = CONSENT_SCOPE_WORDS[k];
    const roleCant = isViewer && !VIEWER_CAN.includes(k);
    const dis = blocked || roleCant;
    const checked = !roleCant && c.scopes.includes(k);
    let tag = "";
    if (reconsent) { const had = existing.includes(k); tag = checked && !had ? `<span class="pill">New</span>` : !checked && had ? `<span class="pill">Removing</span>` : ""; }
    return `<label class="check ${dis ? "locked" : ""}"><input type="checkbox" data-cscope="${k}" ${checked ? "checked" : ""} ${dis ? "disabled" : ""} aria-describedby="cs-${k}"/><span style="flex:1"><span class="ttl">${w[0]}</span><br><span class="why" id="cs-${k}">${roleCant ? `Your role in ${org.slug} (${org.role}) can't ${w[2]}, so this isn't offered.` : w[1]}</span></span>${tag}</label>`;
  }).join("");
  const unknown = state === "c-unknown-scope" ? `<div class="inline-alert" role="status"${gap("consent must drop scopes outside MCP_PROVIDER_SCOPES; today agentScopesFromClaims refuses a token that carries one")}>${ic("info")}<div><b>Not offered by Alethia</b><p>${esc(appName)} also asked for <span class="mono t1">billing:write</span> and <span class="mono t1">admin</span>. Alethia has no such permissions, so they won't be granted.</p></div></div>` : "";
  const noneTicked = !blocked && requested.every((k) => !(c.scopes.includes(k) && !(isViewer && !VIEWER_CAN.includes(k))));

  /* projects */
  const projList = state === "c-projects-many" ? ["auth-service", "billing-worker", "checkout-api", "data-lake", "edge-proxy", "email-sender", "feature-flags", "infra-core", "ml-pipeline", "notifications", "payments-api", "search", "web", "web-admin"] : org.projects;
  let projField;
  if (state === "c-projects-none" || projList.length === 0) {
    projField = `<div class="field"><span class="label">Projects</span><div class="group"><div class="check" style="cursor:default"><span><span class="ttl">All projects</span><br><span class="why">${esc(org.slug === "personal" ? "Your workspace" : org.slug)} has no projects yet. ${esc(appName)} will see the ones you create.</span></span></div></div></div>`;
  } else {
    const pq = (c.pq || "").toLowerCase();
    const filtered = projList.filter((p) => !pq || p.includes(pq));
    const many = projList.length > 6;
    projField = `<fieldset class="field" style="border:0;margin:0;padding:0"${src("agent_oauth_grants.project_ids (NULL = all, present and future)")}><legend class="label" style="margin-bottom:6px">Projects</legend>
      <div class="group">
        <label class="check"><input type="radio" name="cpm" data-cprojmode="all" ${c.projMode === "all" ? "checked" : ""} ${blocked ? "disabled" : ""}/><span><span class="ttl">All projects</span><br><span class="why">Including projects created later.${reconsent ? "" : ""}</span></span></label>
        <label class="check"><input type="radio" name="cpm" data-cprojmode="some" ${c.projMode === "some" ? "checked" : ""} ${blocked ? "disabled" : ""}/><span style="flex:1"><span class="ttl">Only these projects</span>${c.projMode === "some" ? `<span style="display:block;margin-top:8px">${many ? `<label class="search" style="flex:none;width:100%;margin-bottom:6px">${ic("search")}<span class="sr-only">Search projects</span><input type="search" placeholder="Search ${projList.length} projects" value="${esc(c.pq || "")}" data-input="cpq" /></label>` : ""}<span class="${many ? "scroll-list group" : "row"}" style="${many ? "display:block" : ""}">${filtered.map((p) => many ? `<label class="check" style="padding:6px 10px"><input type="checkbox" data-cproj="${p}" ${c.projects.includes(p) ? "checked" : ""}/><span class="mono">${p}</span></label>` : `<label class="pill" style="cursor:pointer;height:22px;text-transform:none;letter-spacing:0"><input type="checkbox" data-cproj="${p}" ${c.projects.includes(p) ? "checked" : ""} style="accent-color:var(--ink);margin:0"/>${p}</label>`).join("")}</span>${many ? `<span class="hint" style="display:block;margin-top:6px">${c.projects.length ? `${c.projects.length} chosen: ${c.projects.join(", ")}` : "None chosen yet."}</span>` : ""}</span>` : ""}</span></label>
      </div>${reconsent ? `<p class="hint">Currently: all projects. No change.</p>` : ""}</fieldset>`;
  }
  const someEmpty = c.projMode === "some" && c.projects.length === 0 && projList.length > 0 && state !== "c-projects-none";

  const changes = reconsent ? `<div class="group"${src("diff: requested choices vs the existing grant")}><div class="group-h"><span class="label">What changes</span></div><div style="padding:10px 12px"><ul class="conseq"><li><b class="t1">Adds</b> Ask to destroy</li><li><b class="t1">Removes</b> Change designs</li><li>Projects stay: all projects</li></ul></div></div>` : "";
  const submitting = state === "c-submitting";
  const netErr = state === "c-network" || S.ui.netErr;
  const allowLabel = submitting ? "Allowing…" : !app ? "Allow unverified app" : reconsent ? "Update connection" : "Allow";
  const inner = `
    <div><p class="eyebrow">Connect an app</p><h1>Let ${esc(appName)} work in Alethia?</h1>
      <p class="lede">It will act as you and never do more than you can.</p></div>
    <!--acct-->
    ${identity}
    ${orgField}
    ${alerts}
    <fieldset class="field" style="border:0;margin:0;padding:0"${src("agent_oauth_grants.scopes ⊆ requested ∩ AGENT_SCOPES; a scope only narrows the role (PDP)")}><legend class="label" style="margin-bottom:6px">${esc(appName)} asked to</legend>
      <div class="group">${scopeRows}</div>
      ${noneTicked ? `<p class="hint t1" role="alert">Choose at least one, or deny.</p>` : blocked ? "" : `<p class="hint">Untick anything you don't want to allow.</p>`}</fieldset>
    ${unknown}
    ${projField}
    ${someEmpty ? `<p class="hint t1" role="alert">Choose at least one project, or allow all.</p>` : ""}
    ${changes}
    <p class="hint">${esc(appName)} also gets your name and email, and stays connected until you disconnect it in <b class="t1">Settings → Connected agents</b>.</p>
    ${netErr ? `<div class="inline-alert strong" role="alert">${ic("alert")}<div><b>Couldn't reach Alethia</b><p>Nothing was granted. Check your connection and try again.</p></div></div>` : ""}
    <div class="row" style="flex-wrap:nowrap">${btn("Deny", { lg: true, full: true, act: "cstate:c-denied", disabled: submitting })}${btn(allowLabel, { v: "primary", lg: true, full: true, disabled: blocked || noneTicked || someEmpty || submitting, act: "consent-allow", icon: submitting ? "refresh" : "" })}</div>`;
  return authShell(`<div${gap("consent writes no agent_oauth_grants row today; POST /api/auth/oauth2/consent takes {accept, consent_code} only")}></div>` + inner);
}
function notAllowedFor(state, o) { return state === "c-not-allowed" && o.slug === "acme"; }

/* ===================================================================================
   Registry + board
   =================================================================================== */
const SHEET_STATES = [["pending", "Waiting · deploy"], ["production", "Waiting · production"], ["destroy", "Waiting · destroy"], ["destroy-confirm", "Destroy · type name"], ["expiring", "Expiring soon"], ["no-cost", "No estimate · not checked"], ["deny-open", "Deny · with reason"], ["blocked-off", "Blocked · agent access off"], ["blocked-prod", "Blocked · agents off production"], ["blocked-client", "Blocked · app not allowed (Ent.)"], ["second-person", "Second person (Ent.)"], ["self", "Self-approval refused (Ent.)"], ["reauth", "Fresh sign-in needed"], ["approved", "Approved (by you)"], ["used", "Used"], ["denied", "Denied · reason shown"], ["expired", "Expired"], ["superseded", "Replaced"], ["not-found", "Not available"], ["loading", "Loading"], ["error", "Error"]];
const SURFACES = {
  list: { n: 1, label: "Approvals", route: () => "/acme/~/approvals", render: (st) => listPage(st), states: [["waiting", "Waiting (default filter)"], ["all", "All · auto-loads more"], ["loading-more", "Loading more"], ["more-error", "Couldn't load more"], ["end", "All loaded"], ["filtered-empty", "No matches"], ["empty", "Empty org"], ["loading", "Loading"], ["error", "Error"]] },
  sheet: { n: 2, label: "Decision sheet", route: () => `/acme/~/approvals?approval=${APPROVAL_ID}`, render: (st) => listPage("waiting", st), states: SHEET_STATES },
  policy: { n: 3, label: "Agent policy", route: () => "/acme/~/settings/agents", render: policyPage, states: [["default", "Can manage agents"], ["off", "Agent access off"], ["no-permission", "No org:manage_agents"], ["community", "Community edition"], ["loading", "Loading"], ["error", "Error"]] },
  tokens: { n: 4, label: "Service tokens", route: () => "/acme/~/settings/tokens", render: tokensPage, states: [["list", "List"], ["create", "Create · auto-approve"], ["no-apply", "No Deploy permission"], ["no-permission", "No org:manage_agents"], ["edit", "Edit environments"], ["created", "Created · shown once"], ["empty", "Empty"], ["loading", "Loading"]] },
  connected: { n: 5, label: "Connected agents", route: () => "/acme/~/settings/connected", render: connectedPage, states: [["list", "Connected + available"], ["manage", "Manage sheet"], ["disconnect", "Disconnect"], ["agents-off", "Agent access off"], ["none", "None connected"], ["loading", "Loading"]] },
  consent: { n: 6, label: "Consent screen", route: () => "/auth/oauth/consent?consent_code=…&client_id=…&scope=…", render: consentPage, states: [["c-default", "Default · two orgs"], ["c-many-orgs", "Many orgs"], ["c-personal", "No org (personal)"], ["c-unverified", "Unverified app"], ["c-not-allowed", "App not on allow-list (Ent.)"], ["c-off", "Agents off in org"], ["c-noprod", "Org keeps agents off prod"], ["c-role", "Role can't use a scope"], ["c-projects-none", "Zero projects"], ["c-projects-many", "Many projects"], ["c-reconsent", "Re-consent · changes"], ["c-unknown-scope", "Unknown scopes requested"], ["c-no-scopes", "No Alethia scopes"], ["c-switch", "Wrong account"], ["c-submitting", "Submitting"], ["c-network", "Network error"], ["c-denied", "Denied"], ["c-allowed", "Allowed"], ["c-expired", "Expired code"], ["c-used", "Code already used"], ["c-none", "Opened directly"], ["c-loading", "Loading"]] },
};

function board() {
  const sf = SURFACES[S.surface];
  return `<div class="board" role="region" aria-label="Prototype controls">
    <div class="board-row">
      <div class="board-brand">${MARK(18)}AGT-L2 <span class="tag">DESIGN v2 · FOR SIGN-OFF</span></div>
      <div class="board-tabs" role="group" aria-label="Surface">${Object.entries(SURFACES).map(([k, v]) => `<button class="board-tab" aria-pressed="${k === S.surface}" data-act="surface:${k}"><span class="n">${v.n}</span>${v.label}</button>`).join("")}</div>
      <div class="board-ctl">
        <button class="tog" aria-pressed="${S.phone}" data-act="phone">Phone 390</button>
        <button class="tog" aria-pressed="${S.annot}" data-act="annot">Data sources</button>
        ${S.surface === "connected" ? `<button class="tog" aria-pressed="${S.monoUnconnected}" data-act="monoun" title="Third-party marks keep owner colours per ruling #3907; this previews the alternative">Grayscale unconnected</button>` : ""}
        <button class="tog" data-act="theme">Theme: ${S.theme || "system"}</button>
      </div>
    </div>
    <div class="board-states" role="group" aria-label="State">${sf.states.map(([k, l]) => `<button class="chip-state" aria-pressed="${k === S.state}" data-act="state:${k}">${l}</button>`).join("")}</div>
    <div class="board-note mono">${sf.route()}${S.annot ? " · dashed = data-model field (file:symbol) · solid = gap in the data model" : ""}</div>
  </div>`;
}

let observer = null;
function render() {
  const keepFocus = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.input;
  const caret = keepFocus ? document.activeElement.selectionStart : null;
  const prevScroll = document.querySelector(".frame-scroll")?.scrollTop || 0;
  const sf = SURFACES[S.surface];
  document.getElementById("root").innerHTML = `${board()}<div class="stage-wrap"><div class="frame ${S.phone ? "phone" : ""} ${S.annot ? "annot" : ""} ${S.monoUnconnected ? "mono-unconnected" : ""}"><div class="frame-scroll">${sf.render(S.state)}</div>${S.ui.toast ? `<div class="toast" role="status">${ic("check")}${esc(S.ui.toast)}</div>` : ""}</div></div>`;
  document.documentElement.style.setProperty("--board-h", document.querySelector(".board").offsetHeight + "px");
  const frame = document.querySelector(".frame");
  const scroller = frame.querySelector(".frame-scroll");
  if (S.keepScroll) scroller.scrollTop = prevScroll;
  S.keepScroll = false;
  /* overlays cover the visible frame, not the scrolled page inside it */
  frame.querySelectorAll(".frame-scroll .dialog-wrap, .frame-scroll .scrim").forEach((o) => frame.appendChild(o));
  if (keepFocus) { const el = document.querySelector(`[data-input="${keepFocus}"]`); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} } }
  if (S.ui.focus) { const el = document.querySelector(S.ui.focus); if (el) el.focus(); S.ui.focus = null; }
  /* useInfiniteScrollSentinel: auto-load when the tail sentinel scrolls into view */
  if (observer) observer.disconnect();
  const sentinel = frame.querySelector("[data-sentinel]");
  if (sentinel && typeof IntersectionObserver !== "undefined" && S.state === "all" && !S.ui.loadingMore) {
    observer = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) loadMore(); }, { root: scroller, rootMargin: "0px 0px 200px 0px" });
    observer.observe(sentinel);
  }
}
function setState(st) { S.state = st; S.ui = {}; if (st === "deny-open") S.ui.denying = true; render(); }
let toastTimer;
function toast(msg) { S.ui.toast = msg; S.keepScroll = true; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.ui.toast = null; S.keepScroll = true; render(); }, 2600); }
function loadMore() {
  if (S.ui.loadingMore || S.ui.loadedMore) return;
  if (S.state === "more-error") { S.state = "all"; }
  S.ui.loadingMore = true; S.keepScroll = true; render();
  setTimeout(() => { S.ui.loadingMore = false; S.ui.loadedMore = true; S.keepScroll = true; render(); }, 900);
}
function go(surface, state) { S.surface = surface; S.state = state; S.ui = {}; render(); }

/* ===================================================================================
   Interactions
   =================================================================================== */
document.addEventListener("click", (e) => {
  const stop = e.target.closest("[data-stop]");
  const el = e.target.closest("[data-act]");
  if (!el) { if (S.ui.openFacet && !e.target.closest(".facet")) { S.ui.openFacet = null; S.keepScroll = true; render(); } return; }
  const act = el.dataset.act;
  if (/-bg$/.test(act) && stop) return;
  if (el.tagName === "A" || el.tagName === "BUTTON" || el.tagName === "TR" || el.classList.contains("m-item")) e.preventDefault();
  const [k, v] = act.split(/:(.*)/s);
  switch (k) {
    case "surface": go(v, SURFACES[v].states[0][0]); break;
    case "state": setState(v); break;
    case "phone": S.phone = !S.phone; render(); break;
    case "annot": S.annot = !S.annot; render(); break;
    case "monoun": S.monoUnconnected = !S.monoUnconnected; render(); break;
    case "theme": S.theme = S.theme === null ? "light" : S.theme === "light" ? "dark" : null; if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; render(); break;
    case "go": { const m = { list: ["list", "waiting"], policy: ["policy", "default"], tokens: ["tokens", "list"], connected: ["connected", "list"] }[v]; go(m[0], m[1]); break; }
    case "sheet": S.surface = "sheet"; setState(v); break;
    case "sheet-close": case "sheet-close-bg":
      if (S.surface === "sheet") go("list", "waiting");
      else { S.ui.manage = null; if (["manage", "disconnect"].includes(S.state)) S.state = "list"; S.keepScroll = true; render(); }
      break;
    case "toast": toast(v); break;
    case "approve": S.state = "approved"; S.ui = {}; render(); toast("Approved. The requester can now deploy this plan once."); break;
    case "deny": S.ui.denying = true; S.ui.focus = "#deny-reason"; render(); break;
    case "deny-cancel": S.ui.denying = false; render(); break;
    case "deny-confirm": { const r = (document.getElementById("deny-reason") || {}).value || ""; S.state = "denied"; S.ui = { byMe: true, reason: r.trim(), noReason: !r.trim() }; render(); toast("Denied. The requester has been told."); break; }
    case "open-destroy": S.ui.dialog = "destroy"; S.ui.focus = "#confirm-env"; render(); break;
    case "close-dialog": case "close-dialog-bg": S.ui.dialog = null; S.ui.revoke = null; S.ui.typed = ""; if (S.state === "destroy-confirm") S.state = "destroy"; if (S.state === "disconnect") S.state = "list"; S.keepScroll = true; render(); break;
    case "approve-destroy": S.state = "approved"; S.ui = {}; S.ui.after = "destroy"; render(); toast("Destroy approved. Cursor can run it once."); break;
    case "facet": S.ui.openFacet = S.ui.openFacet === v ? null : v; S.keepScroll = true; render(); break;
    case "clear-filters": S.ui.filters = { status: [], op: [], via: [], stage: [] }; S.ui.q = ""; render(); break;
    case "load-more": loadMore(); break;
    case "sw":
      { const p = policyState();
        if (v === "access" && p.access) { S.ui.dialog = "kill"; render(); break; }
        if (v === "access") { p.access = true; render(); toast("Agent access is on."); break; }
        p[v] = !p[v]; render(); toast("Saved."); break; }
    case "kill-confirm": policyState().access = false; S.ui.dialog = null; render(); toast("Agent access is off."); break;
    case "ttl": policyState().ttl = Number(v); render(); toast("Saved. New requests stay open for the new time."); break;
    case "tok-new": S.ui.sheet = "tok"; render(); break;
    case "tok-edit": S.ui.sheet = "tok-edit"; render(); break;
    case "close-sheet": case "close-sheet-bg": S.ui.sheet = null; if (["create", "no-apply", "no-permission", "edit"].includes(S.state)) S.state = "list"; render(); break;
    case "tok-create": S.state = "created"; S.ui.sheet = null; render(); break;
    case "tok-save": S.ui.sheet = null; S.state = "list"; render(); toast("Saved. Recorded in Activity."); break;
    case "agent-manage": S.ui.manage = v; S.keepScroll = true; render(); break;
    case "revoke": S.ui.revoke = v; S.keepScroll = true; render(); break;
    case "revoke-confirm": { const n = S.ui.revoke || "Claude Code"; S.ui = {}; S.state = "list"; render(); toast(`${n} disconnected.`); break; }
    case "cf-clear": S.ui.cf = { status: [] }; S.ui.cq = ""; render(); break;
    case "cstate": setState(v); break;
    case "consent-allow": {
      const fail = S.state === "c-network" && !S.ui.retried;
      const keep = S.ui.cons; S.ui = { cons: keep, rcApplied: true, usApplied: true };
      const from = S.state; S.state = "c-submitting"; render();
      setTimeout(() => { if (fail) { S.state = from; S.ui = { cons: keep, netErr: true, retried: true, rcApplied: true, usApplied: true }; render(); } else { S.state = "c-allowed"; S.ui = {}; render(); } }, 900);
      break; }
    default: break;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (S.ui.dialog || S.ui.revoke) { S.ui.dialog = null; S.ui.revoke = null; if (S.state === "destroy-confirm") S.state = "destroy"; if (S.state === "disconnect") S.state = "list"; render(); return; }
    if (S.ui.openFacet) { S.ui.openFacet = null; render(); return; }
    if (S.ui.sheet) { S.ui.sheet = null; if (["create", "no-apply", "no-permission", "edit"].includes(S.state)) S.state = "list"; render(); return; }
    if (S.ui.manage || S.state === "manage") { S.ui.manage = null; S.state = "list"; render(); return; }
    if (S.surface === "sheet") { go("list", "waiting"); return; }
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-act], .m-item[data-act]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", (e) => {
  const t = e.target, k = t.dataset.input;
  if (k === "typed") { S.ui.typed = t.value; render(); }
  if (k === "q") { S.ui.q = t.value; render(); }
  if (k === "cq") { S.ui.cq = t.value; render(); }
  if (k === "coq") { S.ui.cons.oq = t.value; render(); }
  if (k === "cpq") { S.ui.cons.pq = t.value; render(); }
  if (t.id === "deny-reason") S.ui.reason = t.value;
});
document.addEventListener("change", (e) => {
  const t = e.target;
  const keep = () => { S.keepScroll = true; render(); };
  if (t.dataset.facet) { const f = listFilters()[t.dataset.facet]; const i = f.indexOf(t.value); if (t.checked && i < 0) f.push(t.value); if (!t.checked && i >= 0) f.splice(i, 1); keep(); }
  if (t.dataset.cfacet) { const f = S.ui.cf.status; const v = t.dataset.cfacet; S.ui.cf.status = t.checked ? [...f, v] : f.filter((x) => x !== v); keep(); }
  if (t.dataset.scope) { const f = tokenForm(); const s = t.dataset.scope; f.scopes = t.checked ? [...f.scopes, s] : f.scopes.filter((x) => x !== s); keep(); }
  if (t.dataset.projmode) { tokenForm().projMode = t.dataset.projmode; keep(); }
  if (t.dataset.proj) { const f = tokenForm(); const p = t.dataset.proj; f.projects = t.checked ? [...f.projects, p] : f.projects.filter((x) => x !== p); f.auto = f.auto.filter((a) => f.projects.includes(a.split("/")[0])); keep(); }
  if (t.dataset.auto) { const f = tokenForm(); const a = t.dataset.auto; f.auto = t.checked ? [...f.auto, a] : f.auto.filter((x) => x !== a); keep(); }
  if (t.dataset.cscope) { const c = S.ui.cons; const s = t.dataset.cscope; c.scopes = t.checked ? [...c.scopes, s] : c.scopes.filter((x) => x !== s); keep(); }
  if (t.dataset.cprojmode) { S.ui.cons.projMode = t.dataset.cprojmode; keep(); }
  if (t.dataset.cproj) { const c = S.ui.cons; const p = t.dataset.cproj; c.projects = t.checked ? [...c.projects, p] : c.projects.filter((x) => x !== p); keep(); }
  if (t.dataset.corg) { S.ui.cons.org = t.dataset.corg; keep(); }
  if (t.dataset.input === "snav") { const m = { agents: ["policy", "default"], tokens: ["tokens", "list"], connected: ["connected", "list"] }[t.value]; if (m) go(m[0], m[1]); }
});

/* Live countdown: text updates every second; screen readers hear only threshold changes. */
setInterval(() => {
  document.querySelectorAll("[data-expires]").forEach((el) => {
    const t = Number(el.dataset.expires);
    el.textContent = `${el.dataset.prefix} ${fmtLeft(t)}`;
    el.classList.toggle("urgent", t - Date.now() <= 5 * MIN);
  });
}, 1000);

/* Deep link: #surface/state[/phone|/annot] */
(function boot() {
  const [s, st, ph] = location.hash.replace("#", "").split("/");
  if (ph === "phone") S.phone = true;
  if (ph === "annot") S.annot = true;
  if (SURFACES[s]) { S.surface = s; S.state = SURFACES[s].states.some((x) => x[0] === st) ? st : SURFACES[s].states[0][0]; }
  else { S.surface = "list"; S.state = "waiting"; }
  if (S.state === "deny-open") S.ui.denying = true;
  render();
})();
</script>
</body>
