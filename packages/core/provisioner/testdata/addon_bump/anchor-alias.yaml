apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: addon-ingress-nginx
  namespace: argocd
  labels:
    alethia.io/managed-by: addon-marketplace
x-rev: &rev 4.11.2
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: *rev
    helm:
      values: |
        controller:
          replicaCount: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
